<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Ghost — Viktorianisches Herrenhaus</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000a04;}
canvas{position:absolute;inset:0;width:1080px;height:1920px;display:block;}
.bg{position:absolute;inset:0;background:
  radial-gradient(ellipse 70% 50% at 50% 40%, #002010 0%, #001508 50%, transparent 80%),
  linear-gradient(180deg, #000a04 0%, #001508 50%, #000a04 100%);}
/* Manor silhouette */
.manor{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:900px;height:680px;background:#000804;pointer-events:none;
  clip-path:polygon(
    0 100%, 0 55%, 10% 55%, 10% 45%, 12% 35%, 14% 35%, 14% 30%, 18% 30%, 18% 45%, 22% 45%,
    22% 20%, 30% 8%, 38% 20%, 38% 45%, 44% 45%, 44% 55%, 50% 55%, 50% 32%, 54% 32%,
    54% 20%, 58% 18%, 62% 20%, 62% 32%, 66% 32%, 66% 50%, 72% 50%,
    72% 18%, 78% 5%, 84% 18%, 84% 45%, 90% 45%, 90% 55%, 100% 55%, 100% 100%
  );}
/* Lit windows */
.mw{position:absolute;background:#50ffa0;box-shadow:0 0 20px #00ff80,0 0 40px #00ff80;border-radius:3px;opacity:0.6;animation:flick 3s ease-in-out infinite;}
.mw1{bottom:240px;left:calc(50% - 280px);width:18px;height:28px;}
.mw2{bottom:320px;left:calc(50% - 200px);width:14px;height:22px;animation-delay:-0.7s;}
.mw3{bottom:380px;left:calc(50% - 60px);width:16px;height:24px;animation-delay:-1.4s;}
.mw4{bottom:240px;left:calc(50% + 120px);width:14px;height:22px;animation-delay:-2.1s;}
.mw5{bottom:360px;left:calc(50% + 220px);width:16px;height:24px;animation-delay:-0.3s;}
@keyframes flick{0%,100%{opacity:0.55}40%{opacity:0.3}50%{opacity:0.85}60%{opacity:0.4}}

/* Web corners */
.web{position:absolute;width:200px;height:200px;opacity:0.25;pointer-events:none;}
.web svg{width:100%;height:100%;}
.web-tl{top:40px;left:40px;}.web-tr{top:40px;right:40px;transform:scaleX(-1);}

.zone-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(0,0,0,0.55) 0%,transparent 100%);z-index:40;}
.zone-bot{position:absolute;bottom:0;left:0;right:0;height:920px;background:linear-gradient(0deg,rgba(0,5,2,0.55) 0%,rgba(0,5,2,0.12) 40%,transparent 100%);z-index:40;}
.center-darken{position:absolute;top:300px;left:50%;transform:translateX(-50%);width:780px;height:540px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(0,10,5,0.4) 0%,transparent 70%);z-index:38;}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 40%,rgba(0,0,0,0.65) 100%);z-index:39;pointer-events:none;}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="stars"></canvas>
<canvas id="mist"></canvas>
<div class="manor"></div>
<div class="mw mw1"></div><div class="mw mw2"></div><div class="mw mw3"></div><div class="mw mw4"></div><div class="mw mw5"></div>
<canvas id="ghosts"></canvas>
<canvas id="candles"></canvas>
<div class="web web-tl"><svg viewBox="0 0 100 100"><g stroke="rgba(200,255,220,0.4)" stroke-width="0.5" fill="none"><line x1="0" y1="0" x2="100" y2="80"/><line x1="0" y1="0" x2="80" y2="100"/><line x1="0" y1="0" x2="60" y2="100"/><line x1="0" y1="0" x2="100" y2="60"/><line x1="0" y1="0" x2="100" y2="40"/><line x1="0" y1="0" x2="40" y2="100"/><path d="M20 0 Q15 18 0 20"/><path d="M40 0 Q30 30 0 40"/><path d="M60 0 Q48 50 0 60"/></g></svg></div>
<div class="web web-tr"><svg viewBox="0 0 100 100"><g stroke="rgba(200,255,220,0.4)" stroke-width="0.5" fill="none"><line x1="0" y1="0" x2="100" y2="80"/><line x1="0" y1="0" x2="80" y2="100"/><line x1="0" y1="0" x2="60" y2="100"/><line x1="0" y1="0" x2="100" y2="60"/><line x1="0" y1="0" x2="100" y2="40"/><line x1="0" y1="0" x2="40" y2="100"/><path d="M20 0 Q15 18 0 20"/><path d="M40 0 Q30 30 0 40"/></g></svg></div>
<div class="center-darken"></div>
<div class="vignette"></div>
<div class="zone-top"></div>
<div class="zone-bot"></div>
<script>
const W=1080,H=1920;
function setup(id){const c=document.getElementById(id);c.width=W;c.height=H;return c.getContext('2d');}

const st=setup('stars');
const stars=[];
for(let i=0;i<80;i++)stars.push({x:Math.random()*W,y:Math.random()*800,r:Math.random()*1.2+0.2,tw:Math.random()*Math.PI*2});

const mt=setup('mist');
const mist=[];
for(let i=0;i<30;i++)mist.push({x:Math.random()*W,y:Math.random()*H,r:120+Math.random()*180,vx:(Math.random()-0.5)*0.3,a:0.1+Math.random()*0.15});

const gh=setup('ghosts');
const ghosts=[];
for(let i=0;i<4;i++){
  ghosts.push({x:Math.random()*W,y:400+Math.random()*1000,
    vx:(Math.random()<0.5?0.3:-0.3)*(1+Math.random()),
    vy:(Math.random()-0.5)*0.2,sz:50+Math.random()*30,ph:Math.random()*Math.PI*2,
    a:0.25+Math.random()*0.2});
}

const cd=setup('candles');
const candles=[
  {x:W/2-240,y:1560},{x:W/2-100,y:1620},{x:W/2+80,y:1600},{x:W/2+220,y:1580}
];
for(const c of candles){c.ph=Math.random()*Math.PI*2;c.flick=0;}

let t=0;
function loop(){
  t+=0.016;
  st.clearRect(0,0,W,H);
  for(const s of stars){s.tw+=0.03;const a=0.3+Math.sin(s.tw)*0.4;st.fillStyle=`rgba(200,255,220,${a})`;st.beginPath();st.arc(s.x,s.y,s.r,0,Math.PI*2);st.fill();}
  mt.clearRect(0,0,W,H);mt.globalCompositeOperation='screen';
  for(const f of mist){f.x+=f.vx;if(f.x<-200)f.x=W+200;if(f.x>W+200)f.x=-200;
    const g=mt.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
    g.addColorStop(0,`rgba(30,80,55,${f.a})`);g.addColorStop(1,'rgba(30,80,55,0)');
    mt.fillStyle=g;mt.beginPath();mt.arc(f.x,f.y,f.r,0,Math.PI*2);mt.fill();}
  mt.globalCompositeOperation='source-over';
  gh.clearRect(0,0,W,H);
  for(const g of ghosts){
    g.ph+=0.02;g.x+=g.vx;g.y+=g.vy+Math.sin(g.ph)*0.3;
    if(g.x<-80)g.x=W+80;if(g.x>W+80)g.x=-80;
    if(g.y<300)g.vy=Math.abs(g.vy);if(g.y>1500)g.vy=-Math.abs(g.vy);
    // Ghost shape — flowing sheet
    gh.save();gh.translate(g.x,g.y);
    gh.shadowBlur=30;gh.shadowColor='#00ff80';
    const grad=gh.createRadialGradient(0,-g.sz*0.2,0,0,0,g.sz);
    grad.addColorStop(0,`rgba(180,255,200,${g.a})`);
    grad.addColorStop(0.6,`rgba(100,255,160,${g.a*0.6})`);
    grad.addColorStop(1,'rgba(0,255,128,0)');
    gh.fillStyle=grad;
    gh.beginPath();
    // body/sheet
    gh.moveTo(-g.sz*0.6,-g.sz*0.2);
    gh.quadraticCurveTo(-g.sz*0.8,-g.sz,0,-g.sz);
    gh.quadraticCurveTo(g.sz*0.8,-g.sz,g.sz*0.6,-g.sz*0.2);
    gh.lineTo(g.sz*0.7,g.sz*0.8);
    for(let i=5;i>=-5;i--){
      const wx=i*g.sz*0.14;
      const wy=g.sz*0.8+Math.sin(t*3+i)*g.sz*0.12;
      gh.lineTo(wx,wy);
    }
    gh.closePath();gh.fill();
    // Eyes
    gh.fillStyle=`rgba(0,30,10,${g.a*2})`;gh.shadowBlur=0;
    gh.beginPath();gh.ellipse(-g.sz*0.22,-g.sz*0.35,g.sz*0.07,g.sz*0.12,0,0,Math.PI*2);gh.fill();
    gh.beginPath();gh.ellipse(g.sz*0.22,-g.sz*0.35,g.sz*0.07,g.sz*0.12,0,0,Math.PI*2);gh.fill();
    gh.restore();
  }
  gh.shadowBlur=0;

  cd.clearRect(0,0,W,H);
  for(const c of candles){
    c.ph+=0.4+Math.random()*0.2;
    const fl=0.7+Math.sin(c.ph)*0.25+Math.random()*0.1;
    // Halo
    const hg=cd.createRadialGradient(c.x,c.y,0,c.x,c.y,90*fl);
    hg.addColorStop(0,`rgba(200,255,180,${0.35*fl})`);
    hg.addColorStop(1,'rgba(200,255,180,0)');
    cd.fillStyle=hg;cd.beginPath();cd.arc(c.x,c.y,90,0,Math.PI*2);cd.fill();
    // Flame
    cd.fillStyle=`rgba(180,255,200,${fl})`;cd.shadowBlur=15;cd.shadowColor='#80ffb0';
    cd.beginPath();cd.ellipse(c.x,c.y,4*fl,12*fl,0,0,Math.PI*2);cd.fill();
    cd.shadowBlur=0;
  }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
