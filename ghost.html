<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Ghost — Viktorianisches Herrenhaus</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:1080px;height:1920px;overflow:hidden;
    background:radial-gradient(ellipse 100% 70% at 50% 25%, #001a06 0%, #000d03 45%, #000401 100%);
  }
  canvas{position:absolute;inset:0;width:1080px;height:1920px;display:block;}

  /* Full moon — greenish tint for ghost atmosphere */
  .moon{
    position:absolute;top:65px;right:120px;
    width:140px;height:140px;border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #e8f8e0 0%, #c0e0b0 40%, #88b880 70%, #507050 100%);
    box-shadow:0 0 40px rgba(100,200,80,0.35), 0 0 90px rgba(60,160,50,0.2);
    animation:moonGlow 10s ease-in-out infinite;
    z-index:2;
  }
  @keyframes moonGlow{0%,100%{box-shadow:0 0 40px rgba(100,200,80,0.35),0 0 90px rgba(60,160,50,0.2)}50%{box-shadow:0 0 55px rgba(120,220,90,0.45),0 0 120px rgba(80,180,60,0.28)}}

  /* Manor silhouette — detailed victorian house */
  .manor{position:absolute;bottom:0;left:0;right:0;height:900px;pointer-events:none;}

  /* Main body */
  .body{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:620px;height:560px;background:#000803;
    clip-path:polygon(0 100%,0 30%,5% 28%,5% 20%,12% 20%,12% 28%,18% 26%,18% 15%,25% 15%,25% 26%,35% 24%,35% 12%,38% 10%,38% 8%,42% 5%,46% 8%,46% 0%,54% 0%,54% 8%,58% 5%,62% 8%,62% 10%,65% 12%,65% 24%,75% 26%,75% 15%,82% 15%,82% 26%,88% 28%,88% 20%,95% 20%,95% 28%,100% 30%,100% 100%);}

  /* Left tower */
  .ltower{position:absolute;bottom:0;left:60px;width:130px;height:720px;background:#000702;
    clip-path:polygon(0 100%,0 22%,8% 16%,8% 8%,15% 8%,15% 0,24% 0,24% 8%,32% 8%,32% 16%,40% 14%,40% 8%,50% 5%,60% 8%,60% 14%,68% 16%,68% 8%,76% 8%,76% 0,85% 0,85% 8%,92% 8%,92% 16%,100% 22%,100% 100%);}

  /* Right tower */
  .rtower{position:absolute;bottom:0;right:55px;width:140px;height:680px;background:#000702;
    clip-path:polygon(0 100%,0 24%,8% 18%,8% 10%,16% 10%,16% 2%,25% 0,34% 2%,34% 10%,42% 10%,42% 18%,50% 16%,50% 8%,60% 5%,70% 8%,70% 16%,78% 18%,78% 10%,86% 10%,86% 2%,95% 0,100% 2%,100% 18%,100% 24%,100% 100%);}

  /* Smaller side structures */
  .lside{position:absolute;bottom:0;left:180px;width:120px;height:480px;background:#000702;
    clip-path:polygon(0 100%,0 28%,15% 20%,15% 10%,25% 8%,35% 10%,35% 0,50% 0,65% 0,65% 10%,75% 8%,85% 10%,85% 20%,100% 28%,100% 100%);}
  .rside{position:absolute;bottom:0;right:185px;width:115px;height:460px;background:#000702;
    clip-path:polygon(0 100%,0 28%,15% 20%,15% 10%,25% 8%,35% 10%,50% 0,65% 10%,75% 8%,85% 10%,85% 20%,100% 28%,100% 100%);}

  /* Windows — ghost green glow */
  .win{position:absolute;border-radius:2px 2px 4px 4px;mix-blend-mode:screen;}
  /* Main body windows */
  .w1 {bottom:420px;left:calc(50% - 180px);width:22px;height:32px;background:#00cc55;box-shadow:0 0 16px #00cc55,0 0 35px rgba(0,180,60,0.5);animation:winGhost 5s ease-in-out infinite;}
  .w2 {bottom:420px;left:calc(50% - 90px); width:20px;height:30px;background:#00bb44;box-shadow:0 0 14px #00bb44;animation:winGhost 7s ease-in-out infinite reverse;animation-delay:-2s;}
  .w3 {bottom:420px;left:calc(50% + 55px); width:22px;height:32px;background:#00dd66;box-shadow:0 0 16px #00dd66;animation:winGhost 6s ease-in-out infinite;animation-delay:-1s;}
  .w4 {bottom:420px;left:calc(50% + 140px);width:20px;height:30px;background:#00aa44;box-shadow:0 0 12px #00aa44;animation:winGhost 8s ease-in-out infinite reverse;}
  .w5 {bottom:320px;left:calc(50% - 140px);width:18px;height:26px;background:#00cc44;box-shadow:0 0 12px #00cc44;animation:winGhost 4.5s ease-in-out infinite;animation-delay:-3s;}
  .w6 {bottom:320px;left:calc(50% + 110px);width:18px;height:26px;background:#00bb55;box-shadow:0 0 12px #00bb55;animation:winGhost 6.5s ease-in-out infinite reverse;animation-delay:-1.8s;}
  /* Tower windows */
  .wt1{bottom:560px;left:100px;  width:14px;height:22px;background:#00cc44;box-shadow:0 0 10px #00cc44;animation:winGhost 9s ease-in-out infinite;}
  .wt2{bottom:480px;left:108px;  width:12px;height:18px;background:#00aa33;box-shadow:0 0 8px  #00aa33;animation:winGhost 5.5s ease-in-out infinite reverse;animation-delay:-4s;}
  .wt3{bottom:540px;right:90px;  width:14px;height:22px;background:#00dd55;box-shadow:0 0 10px #00dd55;animation:winGhost 7.5s ease-in-out infinite;animation-delay:-2.5s;}
  .wt4{bottom:460px;right:100px; width:12px;height:18px;background:#00bb44;box-shadow:0 0 8px  #00bb44;animation:winGhost 4s ease-in-out infinite reverse;animation-delay:-1s;}
  @keyframes winGhost{
    0%,100%{opacity:1;filter:blur(0)}
    20%{opacity:0.3;filter:blur(2px)}
    40%{opacity:0.9}
    65%{opacity:0.15;filter:blur(1px)}
    80%{opacity:0.85}
  }

  /* Trees — bare branches */
  .tree{position:absolute;bottom:0;pointer-events:none;}
  .tl{left:-20px; width:280px;height:680px;background:#000501;
    clip-path:polygon(28% 100%,29% 52%,15% 40%,5% 28%,18% 34%,22% 22%,10% 12%,24% 20%,26% 8%,28% 18%,29% 0,30% 18%,32% 5%,34% 20%,36% 10%,40% 22%,52% 14%,44% 26%,55% 32%,42% 38%,38% 52%,40% 100%);}
  .tr{right:-15px;width:260px;height:640px;background:#000501;
    clip-path:polygon(62% 100%,61% 50%,75% 36%,88% 22%,74% 30%,70% 16%,82% 8%,68% 18%,66% 4%,64% 16%,62% 0,60% 16%,58% 6%,56% 18%,52% 10%,48% 24%,38% 16%,46% 30%,35% 38%,50% 46%,58% 50%,60% 100%);}

  /* Spiderwebs — CSS in corners */
  .web{position:absolute;opacity:0.22;pointer-events:none;}
  .web-tl{top:0;left:0;width:220px;height:220px;}
  .web-tr{top:0;right:0;width:200px;height:200px;transform:scaleX(-1);}
  .web-bl{bottom:520px;left:60px;width:160px;height:160px;}

  /* Ground floor candles */
  .candle-wrap{position:absolute;bottom:0;left:0;right:0;height:200px;pointer-events:none;}
  .candle{position:absolute;bottom:0;}
  .candle-body{position:absolute;bottom:0;background:linear-gradient(180deg,#2a1a08,#1a0e04);border-radius:3px 3px 0 0;}
  .candle-wax{position:absolute;top:-4px;left:-2px;right:-2px;height:6px;background:rgba(200,160,100,0.4);border-radius:50%;}

  /* Dense ground fog */
  .fog-base{
    position:absolute;bottom:0;left:0;right:0;height:520px;
    background:
      radial-gradient(ellipse 110% 55% at 50% 100%, rgba(0,60,15,0.55) 0%, transparent 60%),
      radial-gradient(ellipse 80% 40% at 15% 100%, rgba(0,40,10,0.4) 0%, transparent 50%),
      radial-gradient(ellipse 70% 38% at 90% 100%, rgba(0,50,12,0.35) 0%, transparent 48%);
    filter:blur(16px);mix-blend-mode:screen;
    animation:fogPulse 12s ease-in-out infinite alternate;
  }
  @keyframes fogPulse{0%{transform:translateX(0)}100%{transform:translateX(22px)}}

  /* Ghost light ring glow */
  .ring-ghost{
    position:absolute;top:210px;left:50%;transform:translateX(-50%);
    width:860px;height:860px;border-radius:50%;
    background:radial-gradient(ellipse 100% 100% at 50% 50%,
      rgba(0,180,60,0.08) 0%, rgba(0,140,45,0.04) 48%, transparent 68%);
    mix-blend-mode:screen;filter:blur(18px);
    animation:ghostGlow 4s ease-in-out infinite;
  }
  @keyframes ghostGlow{0%,100%{opacity:0.65;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.02)}}

  /* Scene-wide ghost-light flicker */
  .scene-flicker{
    position:absolute;inset:0;
    background:radial-gradient(ellipse 65% 55% at 52% 62%, rgba(0,80,20,0.07) 0%, transparent 60%);
    mix-blend-mode:screen;
    animation:sFlicker 5s ease-in-out infinite;pointer-events:none;
  }
  @keyframes sFlicker{0%,100%{opacity:0.55}18%{opacity:1}42%{opacity:0.6}70%{opacity:0.9}88%{opacity:0.4}}

  /* UI zones */
  .center-darken{position:absolute;top:300px;left:50%;transform:translateX(-50%);width:780px;height:540px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(0,6,2,0.44) 0%,transparent 70%);z-index:38;}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 38%,rgba(0,3,1,0.78) 100%);z-index:39;pointer-events:none;}
  .zone-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(0,0,0,0.55) 0%,transparent 100%);z-index:40;}
  .zone-bot{position:absolute;bottom:0;left:0;right:0;height:920px;background:linear-gradient(0deg,rgba(0,4,1,0.65) 0%,rgba(0,4,1,0.14) 40%,transparent 100%);z-index:40;}
</style>
</head>
<body>
  <div class="moon"></div>

  <!-- Spiderwebs (SVG inline) -->
  <svg class="web web-tl" viewBox="0 0 220 220">
    <g stroke="rgba(180,230,190,0.6)" stroke-width="0.8" fill="none">
      <line x1="0" y1="0" x2="220" y2="120"/>
      <line x1="0" y1="0" x2="160" y2="220"/>
      <line x1="0" y1="0" x2="100" y2="220"/>
      <line x1="0" y1="0" x2="220" y2="180"/>
      <line x1="0" y1="0" x2="220" y2="60"/>
      <line x1="0" y1="0" x2="50" y2="220"/>
      <path d="M30 0 Q22 25 0 28"/>
      <path d="M60 0 Q45 50 0 56"/>
      <path d="M95 0 Q70 75 0 84"/>
      <path d="M130 0 Q98 100 0 112"/>
      <path d="M165 0 Q125 125 0 140"/>
    </g>
  </svg>
  <svg class="web web-tr" viewBox="0 0 200 200">
    <g stroke="rgba(180,230,190,0.5)" stroke-width="0.8" fill="none">
      <line x1="0" y1="0" x2="200" y2="100"/>
      <line x1="0" y1="0" x2="150" y2="200"/>
      <line x1="0" y1="0" x2="200" y2="160"/>
      <line x1="0" y1="0" x2="80" y2="200"/>
      <line x1="0" y1="0" x2="200" y2="55"/>
      <path d="M28 0 Q20 22 0 25"/>
      <path d="M56 0 Q42 44 0 50"/>
      <path d="M84 0 Q63 66 0 75"/>
      <path d="M112 0 Q84 88 0 100"/>
    </g>
  </svg>
  <svg class="web web-bl" viewBox="0 0 160 160">
    <g stroke="rgba(180,230,190,0.35)" stroke-width="0.7" fill="none">
      <line x1="0" y1="160" x2="160" y2="60"/>
      <line x1="0" y1="160" x2="120" y2="0"/>
      <line x1="0" y1="160" x2="160" y2="110"/>
      <line x1="0" y1="160" x2="60" y2="0"/>
      <path d="M0 130 Q28 110 30 80"/>
      <path d="M0 100 Q56 80 60 40"/>
    </g>
  </svg>

  <!-- Manor -->
  <div class="manor">
    <div class="tree tl"></div><div class="tree tr"></div>
    <div class="lside"></div><div class="rside"></div>
    <div class="ltower"></div><div class="rtower"></div>
    <div class="body"></div>
    <div class="win w1"></div><div class="win w2"></div><div class="win w3"></div><div class="win w4"></div>
    <div class="win w5"></div><div class="win w6"></div>
    <div class="win wt1"></div><div class="win wt2"></div><div class="win wt3"></div><div class="win wt4"></div>
  </div>

  <!-- Floor candles -->
  <div class="candle-wrap">
    <div class="candle" style="left:140px"><div class="candle-body" style="width:12px;height:55px"></div><div class="candle-wax"></div></div>
    <div class="candle" style="left:295px"><div class="candle-body" style="width:10px;height:45px"></div><div class="candle-wax"></div></div>
    <div class="candle" style="left:680px"><div class="candle-body" style="width:11px;height:50px"></div><div class="candle-wax"></div></div>
    <div class="candle" style="left:820px"><div class="candle-body" style="width:10px;height:48px"></div><div class="candle-wax"></div></div>
    <div class="candle" style="left:940px"><div class="candle-body" style="width:9px;height:40px"></div><div class="candle-wax"></div></div>
  </div>

  <!-- Canvas stack: fog → ring → ghosts → particles -->
  <canvas id="cFog"></canvas>
  <canvas id="cRing"></canvas>
  <canvas id="cGhosts"></canvas>
  <canvas id="cParticles"></canvas>

  <div class="fog-base"></div>
  <div class="ring-ghost"></div>
  <div class="scene-flicker"></div>
  <div class="center-darken"></div>
  <div class="vignette"></div>
  <div class="zone-top"></div>
  <div class="zone-bot"></div>

<script>
const W=1080, H=1920;
const RING_CX=540, RING_CY=590, RING_R=300;

function mkCanvas(id){
  const c=document.getElementById(id);
  c.width=W; c.height=H;
  return c.getContext('2d');
}
const fogCtx    = mkCanvas('cFog');
const ringCtx   = mkCanvas('cRing');
const ghostCtx  = mkCanvas('cGhosts');
const partCtx   = mkCanvas('cParticles');

/* ═══════════════════════════════════════════════════════════════════════════
   DRIFTING FOG LAYERS
   ═══════════════════════════════════════════════════════════════════════════ */
const fogLayers=[];
for(let i=0;i<22;i++){
  fogLayers.push({
    x:Math.random()*W,
    y:H-80-Math.random()*480,
    rx:100+Math.random()*220,
    ry:28+Math.random()*55,
    vx:(Math.random()-0.5)*0.28,
    phase:Math.random()*Math.PI*2,
    sp:0.005+Math.random()*0.008,
    a:0.08+Math.random()*0.14,
    hue:130+Math.random()*30,
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   RING — Candle crown + ghost essence swirl + glow
   ═══════════════════════════════════════════════════════════════════════════ */
const CANDLE_COUNT=14;
const candleRing=[];
for(let i=0;i<CANDLE_COUNT;i++){
  candleRing.push({
    angle:(i/CANDLE_COUNT)*Math.PI*2,
    phase:Math.random()*Math.PI*2,
    flickSp:0.1+Math.random()*0.15,
    height:22+Math.random()*18,
    width:5+Math.random()*4,
    orbitR:RING_R+62+Math.random()*28,
    tilt:(Math.random()-0.5)*0.25,
  });
}

// Ghost essence — wispy blobs orbiting the ring
const ESSENCE_COUNT=16;
const essenceOrbs=[];
for(let i=0;i<ESSENCE_COUNT;i++){
  essenceOrbs.push({
    angle:(i/ESSENCE_COUNT)*Math.PI*2,
    speed:0.009+Math.random()*0.007*(Math.random()<0.5?1:-1),
    phase:Math.random()*Math.PI*2,
    phaseSp:0.02+Math.random()*0.03,
    r:18+Math.random()*30,
    orbitR:RING_R*0.55+Math.random()*RING_R*0.4,
    hue:130+Math.random()*40,
  });
}

function drawCandleFlame(ctx,x,y,w,h,flick,tilt){
  const fh=h*(0.65+flick*0.35);
  const sw=Math.sin(tilt)*fh*0.4;
  ctx.save();
  // Outer glow
  const og=ctx.createRadialGradient(x+sw,y-fh*0.5,0,x+sw,y-fh*0.5,fh*0.8);
  og.addColorStop(0,`rgba(80,220,40,${0.3+flick*0.25})`);
  og.addColorStop(0.4,`rgba(40,160,20,${0.12+flick*0.1})`);
  og.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=og; ctx.shadowBlur=0;
  ctx.beginPath(); ctx.arc(x+sw,y-fh*0.45,fh*0.8,0,Math.PI*2); ctx.fill();
  // Flame shape
  const fg=ctx.createLinearGradient(x,y,x+sw*0.5,y-fh);
  fg.addColorStop(0,'rgba(180,255,100,0.95)');
  fg.addColorStop(0.3,'rgba(80,220,40,0.8)');
  fg.addColorStop(0.7,'rgba(20,160,20,0.5)');
  fg.addColorStop(1,'rgba(0,80,10,0)');
  ctx.shadowBlur=14; ctx.shadowColor=`rgba(60,220,30,0.8)`;
  ctx.fillStyle=fg;
  ctx.beginPath();
  ctx.moveTo(x-w*0.5,y);
  ctx.quadraticCurveTo(x-w*0.7+sw*0.3,y-fh*0.45,x+sw*0.65,y-fh*0.8);
  ctx.quadraticCurveTo(x+sw,y-fh,x+sw*0.3,y-fh);
  ctx.quadraticCurveTo(x-sw*0.3+sw*0.3,y-fh*0.9,x+sw*0.4,y-fh*0.6);
  ctx.quadraticCurveTo(x+w*0.7+sw*0.2,y-fh*0.3,x+w*0.5,y);
  ctx.fill();
  // White-hot core
  ctx.shadowBlur=0;
  ctx.fillStyle=`rgba(220,255,200,${0.6+flick*0.35})`;
  ctx.beginPath(); ctx.ellipse(x+sw*0.4,y-fh*0.25,w*0.22,fh*0.3,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════════════════
   GHOSTS
   ═══════════════════════════════════════════════════════════════════════════ */
const ghosts=[];
function mkGhost(i){
  const types=['sheet','cloud','wisp'];
  return{
    x:100+Math.random()*880,
    y:200+Math.random()*1200,
    type:types[i%types.length],
    vx:(Math.random()-0.5)*0.5,
    vy:(Math.random()-0.5)*0.2-0.1,
    phase:Math.random()*Math.PI*2,
    wobble:Math.random()*Math.PI*2,
    wobbleSp:0.018+Math.random()*0.025,
    size:50+Math.random()*60,
    opacity:0,
    targetOpacity:0.2+Math.random()*0.22,
    fadeState:'in',
    fadeTimer:0,
    fadeDur:4+Math.random()*6,
    stayDur:5+Math.random()*8,
    hue:130+Math.random()*30,
    eyePhase:Math.random()*Math.PI*2,
  };
}
for(let i=0;i<5;i++){
  const g=mkGhost(i);
  g.opacity=g.targetOpacity*Math.random();
  ghosts.push(g);
}

function drawGhost(ctx,g){
  const {x,y,type,size,opacity,wobble,phase,hue,eyePhase} = g;
  if(opacity<0.01) return;
  const wob=Math.sin(wobble)*size*0.06;
  ctx.save();
  ctx.translate(x+wob,y);

  if(type==='sheet'){
    // Classic ghost shape
    const sg=ctx.createLinearGradient(0,-size,0,size*0.8);
    sg.addColorStop(0,`hsla(${hue},70%,85%,${opacity*0.85})`);
    sg.addColorStop(0.4,`hsla(${hue},65%,75%,${opacity*0.7})`);
    sg.addColorStop(0.75,`hsla(${hue},60%,60%,${opacity*0.4})`);
    sg.addColorStop(1,`hsla(${hue},60%,50%,0)`);
    ctx.shadowBlur=25; ctx.shadowColor=`hsla(${hue},80%,65%,${opacity*0.6})`;
    ctx.fillStyle=sg;
    ctx.beginPath();
    // Dome head
    ctx.arc(0,-size*0.25,size*0.48,Math.PI,0);
    // Flowing body
    ctx.lineTo(size*0.48,size*0.5);
    // Wavy bottom — 5 scallops
    for(let sc=5;sc>=-5;sc--){
      const bx=sc*size*0.095;
      const by=size*0.72+Math.sin(sc*1.2+phase)*size*0.1;
      ctx.lineTo(bx,by);
    }
    ctx.closePath(); ctx.fill();
    // Eyes
    ctx.shadowBlur=0;
    ctx.fillStyle=`rgba(0,18,5,${opacity*1.8})`;
    ctx.beginPath(); ctx.ellipse(-size*0.14,-size*0.3,size*0.07,size*0.1,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( size*0.14,-size*0.3,size*0.07,size*0.1,0,0,Math.PI*2); ctx.fill();
    // Eye glints
    ctx.fillStyle=`rgba(200,255,180,${opacity*0.9})`;
    ctx.beginPath(); ctx.arc(-size*0.12,-size*0.32,size*0.025,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc( size*0.16,-size*0.32,size*0.025,0,Math.PI*2); ctx.fill();

  } else if(type==='cloud'){
    // Amorphous cloud ghost
    for(let ci=0;ci<5;ci++){
      const cx=Math.sin(ci*1.25+phase)*size*0.28;
      const cy=Math.cos(ci*1.1+phase*0.7)*size*0.22;
      const cr=size*0.38+Math.sin(ci*2+eyePhase)*size*0.12;
      const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,cr);
      cg.addColorStop(0,`hsla(${hue+ci*5},70%,80%,${opacity*0.65})`);
      cg.addColorStop(0.5,`hsla(${hue},65%,65%,${opacity*0.3})`);
      cg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=cg; ctx.shadowBlur=18; ctx.shadowColor=`hsla(${hue},80%,60%,${opacity*0.5})`;
      ctx.beginPath(); ctx.arc(cx,cy,cr,0,Math.PI*2); ctx.fill();
    }
    // Two glowing eyes in the cloud
    ctx.shadowBlur=0;
    ctx.fillStyle=`rgba(0,20,6,${opacity*1.5})`;
    ctx.beginPath(); ctx.ellipse(-size*0.12,0,size*0.065,size*0.09,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( size*0.12,0,size*0.065,size*0.09,0,0,Math.PI*2); ctx.fill();

  } else {
    // Wisp — just a glowing orb with streamer
    const wg=ctx.createRadialGradient(0,0,0,0,0,size*0.55);
    wg.addColorStop(0,`hsla(${hue+15},85%,88%,${opacity*0.9})`);
    wg.addColorStop(0.4,`hsla(${hue},80%,70%,${opacity*0.55})`);
    wg.addColorStop(0.8,`hsla(${hue-5},75%,55%,${opacity*0.2})`);
    wg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.shadowBlur=30; ctx.shadowColor=`hsla(${hue},90%,65%,${opacity*0.7})`;
    ctx.fillStyle=wg; ctx.beginPath(); ctx.arc(0,0,size*0.55,0,Math.PI*2); ctx.fill();
    // Streamer tail
    ctx.shadowBlur=8;
    ctx.strokeStyle=`hsla(${hue},80%,75%,${opacity*0.45})`;
    ctx.lineWidth=size*0.06; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(0,0);
    for(let si=1;si<=8;si++){
      const sa=si*0.4+phase;
      const sr=si*size*0.065;
      ctx.lineTo(Math.cos(sa)*sr*0.3,si*size*0.06+Math.sin(sa)*sr*0.2);
    }
    ctx.stroke();
  }
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════════════════
   PARTICLES: Ghost motes, falling leaves
   ═══════════════════════════════════════════════════════════════════════════ */
const ghostMotes=[];
for(let i=0;i<52;i++){
  ghostMotes.push({
    x:80+Math.random()*920, y:H-100+Math.random()*80,
    vy:-(0.25+Math.random()*0.7), vx:(Math.random()-0.5)*0.35,
    phase:Math.random()*Math.PI*2, sp:0.03+Math.random()*0.045,
    r:0.8+Math.random()*2.2, hue:125+Math.random()*35, life:Math.random(),
  });
}

const leaves=[];
const LEAF_COLS=['#0a1a05','#0c2206','#080d03','#061504','#0e1a06'];
for(let i=0;i<28;i++){
  leaves.push({
    x:Math.random()*W, y:Math.random()*H-100,
    vy:0.5+Math.random()*1.0, vx:(Math.random()-0.5)*0.4-0.2,
    rot:Math.random()*Math.PI*2, rotV:(Math.random()-0.5)*0.04,
    sw:Math.random()*Math.PI*2, swSp:0.01+Math.random()*0.015, swAmp:20+Math.random()*30,
    size:5+Math.random()*9, col:LEAF_COLS[Math.floor(Math.random()*LEAF_COLS.length)],
  });
}

// Floor candle flames — positions match CSS candles
const floorCandles=[
  {x:146,y:H-55,w:12,h:30,phase:Math.random()*Math.PI*2,sp:0.11},
  {x:300,y:H-45,w:10,h:26,phase:Math.random()*Math.PI*2,sp:0.13},
  {x:685,y:H-50,w:11,h:28,phase:Math.random()*Math.PI*2,sp:0.10},
  {x:825,y:H-48,w:10,h:26,phase:Math.random()*Math.PI*2,sp:0.14},
  {x:944,y:H-40,w:9,h:23,phase:Math.random()*Math.PI*2,sp:0.12},
];

/* ═══════════════════════════════════════════════════════════════════════════
   MAIN LOOP
   ═══════════════════════════════════════════════════════════════════════════ */
let t=0;

function loop(){
  t+=0.016;

  /* ── FOG ── */
  fogCtx.clearRect(0,0,W,H);
  fogCtx.globalCompositeOperation='screen';
  for(const f of fogLayers){
    f.x+=f.vx; f.phase+=f.sp;
    if(f.x>W+250) f.x=-250; if(f.x<-250) f.x=W+250;
    const pulse=0.7+Math.sin(f.phase)*0.3;
    const g=fogCtx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.rx);
    g.addColorStop(0,`hsla(${f.hue},60%,18%,${f.a*pulse})`);
    g.addColorStop(0.5,`hsla(${f.hue},55%,12%,${f.a*pulse*0.5})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    fogCtx.save(); fogCtx.scale(1,f.ry/f.rx);
    fogCtx.fillStyle=g; fogCtx.beginPath(); fogCtx.arc(f.x,f.y*(f.rx/f.ry),f.rx,0,Math.PI*2); fogCtx.fill();
    fogCtx.restore();
  }
  fogCtx.globalCompositeOperation='source-over';

  /* ── RING ── */
  ringCtx.clearRect(0,0,W,H);

  // Central ghost light glow
  const cenPulse=0.55+Math.sin(t*1.4)*0.3;
  const cg=ringCtx.createRadialGradient(RING_CX,RING_CY,0,RING_CX,RING_CY,RING_R+210);
  cg.addColorStop(0,`rgba(0,180,50,${0.15*cenPulse})`);
  cg.addColorStop(0.4,`rgba(0,130,35,${0.07*cenPulse})`);
  cg.addColorStop(1,'rgba(0,0,0,0)');
  ringCtx.fillStyle=cg; ringCtx.beginPath(); ringCtx.arc(RING_CX,RING_CY,RING_R+210,0,Math.PI*2); ringCtx.fill();

  // Ghost essence swirl
  for(const eo of essenceOrbs){
    eo.angle+=eo.speed; eo.phase+=eo.phaseSp;
    const pulse=0.3+Math.abs(Math.sin(eo.phase))*0.55;
    const ex=RING_CX+Math.cos(eo.angle)*eo.orbitR;
    const ey=RING_CY+Math.sin(eo.angle)*eo.orbitR;
    const eg=ringCtx.createRadialGradient(ex,ey,0,ex,ey,eo.r);
    eg.addColorStop(0,`hsla(${eo.hue},75%,75%,${pulse*0.7})`);
    eg.addColorStop(0.5,`hsla(${eo.hue},70%,60%,${pulse*0.3})`);
    eg.addColorStop(1,'rgba(0,0,0,0)');
    ringCtx.fillStyle=eg; ringCtx.shadowBlur=12; ringCtx.shadowColor=`hsla(${eo.hue},80%,60%,0.6)`;
    ringCtx.beginPath(); ringCtx.arc(ex,ey,eo.r,0,Math.PI*2); ringCtx.fill();
  }
  ringCtx.shadowBlur=0;

  // Candle ring
  for(const c of candleRing){
    c.phase+=c.flickSp;
    const flick=0.4+Math.sin(c.phase)*0.5+Math.sin(c.phase*2.3)*0.1;
    const cx=RING_CX+Math.cos(c.angle)*c.orbitR;
    const cy=RING_CY+Math.sin(c.angle)*c.orbitR;
    drawCandleFlame(ringCtx,cx,cy,c.width,c.height,flick,c.tilt+Math.sin(c.phase*0.4)*0.1);
  }
  ringCtx.shadowBlur=0;

  /* ── GHOSTS ── */
  ghostCtx.clearRect(0,0,W,H);
  for(let i=0;i<ghosts.length;i++){
    const g=ghosts[i];
    g.wobble+=g.wobbleSp; g.phase+=0.025; g.eyePhase+=0.035;
    g.x+=g.vx; g.y+=g.vy;
    // Fade in/out lifecycle
    g.fadeTimer+=0.016;
    if(g.fadeState==='in'){
      g.opacity=Math.min(g.targetOpacity, g.opacity+0.004);
      if(g.fadeTimer>g.fadeDur){g.fadeState='stay';g.fadeTimer=0;}
    } else if(g.fadeState==='stay'){
      if(g.fadeTimer>g.stayDur){g.fadeState='out';g.fadeTimer=0;}
    } else {
      g.opacity=Math.max(0,g.opacity-0.003);
      if(g.opacity<=0){ghosts[i]=mkGhost(i);ghosts[i].x=100+Math.random()*880;ghosts[i].y=200+Math.random()*1200;}
    }
    // Boundary
    if(g.x<-120) g.vx=Math.abs(g.vx);
    if(g.x>W+120) g.vx=-Math.abs(g.vx);
    if(g.y<100) g.vy=Math.abs(g.vy);
    if(g.y>1600) g.vy=-Math.abs(g.vy);
    drawGhost(ghostCtx,g);
  }
  ghostCtx.shadowBlur=0;

  /* ── PARTICLES ── */
  partCtx.clearRect(0,0,W,H);

  // Floor candle flames
  for(const fc of floorCandles){
    fc.phase+=fc.sp;
    const flick=0.4+Math.sin(fc.phase)*0.5+Math.sin(fc.phase*2.2+0.5)*0.1;
    drawCandleFlame(partCtx,fc.x,fc.y,fc.w,fc.h,flick,Math.sin(fc.phase*0.3)*0.12);
  }
  partCtx.shadowBlur=0;

  // Ghost motes
  partCtx.save();
  for(let i=0;i<ghostMotes.length;i++){
    const m=ghostMotes[i];
    m.phase+=m.sp; m.life+=0.008;
    m.x+=m.vx+Math.sin(m.phase)*0.25; m.y+=m.vy;
    if(m.life>1||m.y<-30){
      ghostMotes[i]={x:80+Math.random()*920,y:H-80+Math.random()*60,vy:-(0.25+Math.random()*0.7),vx:(Math.random()-0.5)*0.35,phase:Math.random()*Math.PI*2,sp:0.03+Math.random()*0.045,r:0.8+Math.random()*2.2,hue:125+Math.random()*35,life:0};
      continue;
    }
    const fa=(1-m.life)*(0.35+Math.abs(Math.sin(m.phase))*0.55);
    partCtx.shadowBlur=5; partCtx.shadowColor=`hsla(${m.hue},90%,65%,0.7)`;
    partCtx.fillStyle=`hsla(${m.hue},85%,70%,${fa})`;
    partCtx.beginPath(); partCtx.arc(m.x,m.y,m.r,0,Math.PI*2); partCtx.fill();
  }
  partCtx.shadowBlur=0; partCtx.restore();

  // Falling leaves
  for(let i=0;i<leaves.length;i++){
    const l=leaves[i];
    l.sw+=l.swSp; l.rot+=l.rotV;
    l.x+=l.vx+Math.sin(l.sw)*l.swAmp*0.022;
    l.y+=l.vy;
    if(l.y>H+20) leaves[i]={x:Math.random()*W,y:-20,vy:0.5+Math.random()*1.0,vx:(Math.random()-0.5)*0.4-0.2,rot:Math.random()*Math.PI*2,rotV:(Math.random()-0.5)*0.04,sw:Math.random()*Math.PI*2,swSp:0.01+Math.random()*0.015,swAmp:20+Math.random()*30,size:5+Math.random()*9,col:LEAF_COLS[Math.floor(Math.random()*LEAF_COLS.length)]};
    partCtx.save();
    partCtx.translate(l.x,l.y); partCtx.rotate(l.rot);
    partCtx.fillStyle=l.col+'dd';
    partCtx.beginPath(); partCtx.ellipse(0,0,l.size,l.size*0.5,0,0,Math.PI*2); partCtx.fill();
    partCtx.strokeStyle=l.col+'88'; partCtx.lineWidth=0.6;
    partCtx.beginPath(); partCtx.moveTo(-l.size,0); partCtx.lineTo(l.size,0); partCtx.stroke();
    partCtx.restore();
  }

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
