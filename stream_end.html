<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stream Ending</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:1080px;height:1920px;overflow:hidden;
  background:transparent;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:white;
}

/* Alles atmet — langsam zwischen 0.15 und 0.95 */
.center{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;
  gap:36px;
  animation:breathe 4s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{opacity:0.15;}
  50%{opacity:0.95;}
}

/* Eyebrow */
.eyebrow{
  font-size:18px;font-weight:700;letter-spacing:5px;text-transform:uppercase;
  color:rgba(255,255,255,0.7);
  text-shadow:0 0 20px rgba(78,205,196,0.8);
}

/* Main text */
.main-text{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  text-align:center;
}
.line1{
  font-size:48px;font-weight:900;letter-spacing:-1px;
  color:white;
  text-shadow:0 2px 30px rgba(0,0,0,0.8);
}
.line2{
  font-size:48px;font-weight:900;letter-spacing:-1px;
  background:linear-gradient(90deg,#667eea,#4ecdc4);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 12px rgba(78,205,196,0.6));
}

/* Divider */
.divider{
  width:100px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(78,205,196,0.8),transparent);
}

/* Countdown ring */
.ring-wrap{
  position:relative;
  width:240px;height:240px;
}
.ring-svg{
  position:absolute;inset:0;width:100%;height:100%;
  transform:rotate(-90deg);
}
.ring-bg{fill:none;stroke:rgba(255,255,255,0.1);stroke-width:3;}
.ring-fill{
  fill:none;stroke:url(#rg);stroke-width:3.5;stroke-linecap:round;
  stroke-dasharray:659;stroke-dashoffset:0;
  transition:stroke-dashoffset 1s linear;
  filter:drop-shadow(0 0 6px rgba(78,205,196,0.9));
}

.ring-inner{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;
}
.count{
  font-size:80px;font-weight:900;letter-spacing:-4px;
  line-height:1;color:white;
  text-shadow:0 2px 30px rgba(0,0,0,0.6),0 0 20px rgba(78,205,196,0.3);
  transition:all 0.15s ease;
}
.count.tick{animation:tickAnim 0.25s cubic-bezier(0.22,1,0.36,1);}
@keyframes tickAnim{
  0%{transform:scale(1.12);}
  100%{transform:scale(1);}
}
.count-sub{
  font-size:13px;font-weight:700;letter-spacing:3px;
  text-transform:uppercase;color:rgba(255,255,255,0.5);
}

/* Message */
.msg{
  font-size:24px;font-weight:600;
  color:rgba(255,255,255,0.8);
  text-align:center;line-height:1.5;
  text-shadow:0 2px 20px rgba(0,0,0,0.7);
}
.msg span{
  color:#4ecdc4;font-weight:900;
  text-shadow:0 0 16px rgba(78,205,196,0.6);
}

/* Site */
.site{
  font-size:20px;font-weight:800;letter-spacing:1px;
  color:rgba(255,255,255,0.5);
  text-shadow:0 0 16px rgba(102,126,234,0.5);
}

/* Urgent */
.urgent .ring-fill{
  stroke:url(#rg-urg);
  filter:drop-shadow(0 0 10px rgba(255,68,68,0.9));
}
.urgent .count{
  color:#FF6B6B;
  text-shadow:0 0 20px rgba(255,68,68,0.5);
}
/* Urgente atmet schneller */
.urgent.center{
  animation:breatheFast 1.2s ease-in-out infinite;
}
@keyframes breatheFast{
  0%,100%{opacity:0.2;}
  50%{opacity:1;}
}

/* Ended */
.ended-msg{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  display:none;opacity:0;
  flex-direction:column;align-items:center;gap:24px;
  animation:breathe 3s ease-in-out infinite;
}
.ended-msg.show{display:flex;}
.ended-big{
  font-size:60px;font-weight:900;letter-spacing:-1px;
  background:linear-gradient(135deg,#667eea,#4ecdc4);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 14px rgba(102,126,234,0.4));
}
.ended-sub{font-size:26px;color:rgba(255,255,255,0.7);font-weight:600;}
</style>
</head>
<body>

<div class="center" id="center">
  <div class="eyebrow">Catchmon Arena</div>

  <div class="main-text">
    <div class="line1">Stream is</div>
    <div class="line2">Ending Soon</div>
  </div>

  <div class="divider"></div>

  <div class="ring-wrap" id="ringWrap">
    <svg class="ring-svg" viewBox="0 0 210 210">
      <defs>
        <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#667eea"/>
          <stop offset="100%" stop-color="#4ecdc4"/>
        </linearGradient>
        <linearGradient id="rg-urg" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#FF4444"/>
          <stop offset="100%" stop-color="#FF8844"/>
        </linearGradient>
      </defs>
      <circle class="ring-bg" cx="105" cy="105" r="100"/>
      <circle class="ring-fill" id="ringFill" cx="105" cy="105" r="100"/>
    </svg>
    <div class="ring-inner">
      <div class="count" id="count">60</div>
      <div class="count-sub">seconds</div>
    </div>
  </div>

  <div class="msg">
    Thanks for watching!<br>
    <span>Like for one last catch 🎯</span>
  </div>

  <div class="site">trainertrials.github.io/TrainerTrials</div>
</div>

<div class="ended-msg" id="endedMsg">
  <div class="ended-big">See you next time!</div>
  <div class="ended-sub">Follow for more streams 🎮</div>
</div>

<script>
const TOTAL = 60;
const CIRC  = 2 * Math.PI * 100; // ~628

const countEl  = document.getElementById('count');
const ringFill = document.getElementById('ringFill');
const ringWrap = document.getElementById('ringWrap');
const center   = document.getElementById('center');
const endedMsg = document.getElementById('endedMsg');

let remaining = TOTAL;

function updateRing() {
  const prog = remaining / TOTAL;
  ringFill.style.strokeDasharray = CIRC;
  ringFill.style.strokeDashoffset = CIRC * (1 - prog);
}

function tick() {
  countEl.classList.remove('tick');
  void countEl.offsetWidth;
  countEl.classList.add('tick');
  countEl.textContent = remaining;
  updateRing();

  if (remaining <= 10) {
    ringWrap.classList.add('urgent');
    center.classList.add('urgent');
  }

  if (remaining <= 0) {
    center.style.transition = 'opacity 1s ease';
    center.style.opacity = '0';
    setTimeout(() => {
      center.style.display = 'none';
      endedMsg.classList.add('show');
      // fade in
      endedMsg.style.animation = 'breathe 3s ease-in-out infinite';
      endedMsg.style.opacity = '1';
    }, 1000);
    return;
  }

  remaining--;
  setTimeout(tick, 1000);
}

updateRing();
tick();
</script>
</body>
</html>
