<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Inkay Detail</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; background: #fff; padding: 20px; }
    .container { max-width: 600px; margin: auto; }
    img { width: 200px; display: block; margin: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
    #filterBox { margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>#686 Inkay</h1>
    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/686.png" alt="Inkay">
    <p><b>Encounters:</b> 1<br><b>Trainers Caught:</b> 0</p>
    <div id="filterBox">
      <label><input type="checkbox" id="caughtOnly" onchange="filterRows()"> Nur Gefangene anzeigen</label>
    </div>
    <table id="dataTable">
      <thead>
        <tr><th>Trainer</th><th>Punkte</th><th>Level</th><th>Shiny</th><th>Sum</th><th>HP</th><th>Atk</th><th>Def</th><th>SpA</th><th>SpD</th><th>Speed</th></tr>
      </thead>
      <tbody>
<tr class="seen">
  <td><a href="trainer_❌.html">❌</a></td><td>217</td><td>1</td><td></td><td>117</td>
  <td>27</td><td>13</td><td>21</td>
  <td>17</td><td>15</td><td>24</td>
</tr>
</tbody>
    </table>
    <div style="text-align:center; margin-top:20px;">
      <a href="../pokedex.html">← Back to Pokédex</a>
    </div>
  </div>
  <script>
    function filterRows() {
      const showCaughtOnly = document.getElementById("caughtOnly").checked;
      const rows = document.querySelectorAll("#dataTable tbody tr");
      rows.forEach(row => {
        row.style.display = (!showCaughtOnly || row.classList.contains("caught")) ? "" : "none";
      });
    }
  </script>
</body>
</html>
