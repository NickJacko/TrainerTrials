<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Ice — Arktisches Nordlicht</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:1080px;height:1920px;overflow:hidden;
    background:radial-gradient(ellipse 100% 80% at 50% 20%, #001530 0%, #000c1e 45%, #000408 100%);
  }
  canvas{position:absolute;inset:0;width:1080px;height:1920px;display:block;}

  /* Star field base */
  .stars{
    position:absolute;top:0;left:0;right:0;height:1100px;
    background-image:
      radial-gradient(circle 1px at 12% 8%, rgba(255,255,255,0.85), transparent),
      radial-gradient(circle 1px at 28% 5%, rgba(200,230,255,0.7), transparent),
      radial-gradient(circle 1px at 45% 12%, rgba(255,255,255,0.9), transparent),
      radial-gradient(circle 1px at 67% 4%, rgba(200,220,255,0.75), transparent),
      radial-gradient(circle 1px at 83% 9%, rgba(255,255,255,0.8), transparent),
      radial-gradient(circle 1px at 92% 15%, rgba(220,240,255,0.7), transparent),
      radial-gradient(circle 1px at 8%  22%, rgba(255,255,255,0.65), transparent),
      radial-gradient(circle 1px at 35% 18%, rgba(200,230,255,0.8), transparent),
      radial-gradient(circle 1px at 55% 7%, rgba(255,255,255,0.75), transparent),
      radial-gradient(circle 1px at 74% 20%, rgba(210,235,255,0.7), transparent),
      radial-gradient(circle 1px at 19% 35%, rgba(255,255,255,0.55), transparent),
      radial-gradient(circle 1px at 88% 28%, rgba(255,255,255,0.65), transparent),
      radial-gradient(circle 2px at 52% 25%, rgba(200,230,255,0.4), transparent),
      radial-gradient(circle 1px at 38% 40%, rgba(255,255,255,0.45), transparent),
      radial-gradient(circle 1px at 6%  48%, rgba(200,220,255,0.5), transparent),
      radial-gradient(circle 1px at 96% 42%, rgba(255,255,255,0.5), transparent);
  }

  /* Distant mountain silhouette */
  .mountains{
    position:absolute;bottom:480px;left:0;right:0;height:340px;
    background:#000c18;
    clip-path:polygon(
      0 100%, 0 70%, 4% 62%, 9% 72%, 14% 52%, 19% 65%, 24% 44%,
      29% 58%, 34% 38%, 39% 54%, 44% 36%, 49% 50%, 54% 33%,
      59% 48%, 64% 30%, 69% 46%, 74% 34%, 79% 52%, 84% 38%,
      89% 55%, 94% 42%, 98% 60%, 100% 65%, 100% 100%);
  }
  .mountain-snow{
    position:absolute;bottom:680px;left:0;right:0;height:80px;
    background:rgba(160,200,240,0.1);
    clip-path:polygon(
      4% 100%, 9% 55%, 14% 100%, 24% 30%, 29% 100%, 34% 20%,
      39% 100%, 44% 18%, 49% 100%, 54% 15%, 59% 100%, 64% 12%,
      69% 100%, 74% 18%, 79% 100%, 84% 22%, 89% 100%);
    filter:blur(2px);
  }

  /* Icebergs */
  .iceberg{position:absolute;mix-blend-mode:screen;}
  .ib1{bottom:380px;left:30px;width:260px;height:200px;
    background:linear-gradient(135deg,rgba(160,220,255,0.18) 0%,rgba(80,160,220,0.1) 60%,transparent 100%);
    clip-path:polygon(15% 100%,0 60%,12% 30%,25% 45%,40% 15%,55% 35%,70% 20%,85% 40%,100% 60%,88% 100%);
    filter:blur(1px);}
  .ib2{bottom:340px;right:60px;width:220px;height:180px;
    background:linear-gradient(150deg,rgba(140,210,255,0.15) 0%,rgba(60,140,200,0.08) 60%,transparent 100%);
    clip-path:polygon(0 100%,5% 55%,18% 25%,35% 45%,50% 10%,65% 38%,80% 22%,92% 50%,100% 70%,100% 100%);
    filter:blur(1px);}
  .ib3{bottom:360px;left:320px;width:180px;height:150px;
    background:linear-gradient(140deg,rgba(180,230,255,0.12) 0%,rgba(100,170,230,0.06) 60%,transparent 100%);
    clip-path:polygon(10% 100%,0 65%,20% 30%,38% 50%,55% 20%,72% 45%,88% 32%,100% 55%,90% 100%);
    filter:blur(1px);}
  /* Iceberg glow from aurora */
  .ib-glow{
    position:absolute;bottom:340px;left:0;right:0;height:120px;
    background:linear-gradient(180deg,transparent 0%,rgba(0,200,150,0.06) 60%,rgba(0,160,200,0.04) 100%);
    mix-blend-mode:screen;
    animation:ibGlow 7s ease-in-out infinite;
  }
  @keyframes ibGlow{0%,100%{opacity:0.6}50%{opacity:1}}

  /* Ice plain */
  .ice-plain{
    position:absolute;bottom:0;left:0;right:0;height:420px;
    background:
      linear-gradient(0deg, #000c1c 0%, #001428 35%, #001830 70%, transparent 100%);
  }
  /* Ice surface sheen */
  .ice-sheen{
    position:absolute;bottom:0;left:0;right:0;height:300px;
    background:
      radial-gradient(ellipse 80% 30% at 30% 100%, rgba(0,180,200,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 25% at 70% 100%, rgba(0,160,220,0.06) 0%, transparent 55%),
      radial-gradient(ellipse 100% 20% at 50% 100%, rgba(0,200,180,0.05) 0%, transparent 50%);
    mix-blend-mode:screen;
    animation:sheenShift 10s ease-in-out infinite alternate;
  }
  @keyframes sheenShift{0%{transform:translateX(0)}100%{transform:translateX(20px)}}

  /* Ring ice glow from below */
  .ring-ice-glow{
    position:absolute;top:230px;left:50%;transform:translateX(-50%);
    width:760px;height:760px;border-radius:50%;
    background:radial-gradient(ellipse 100% 100% at 50% 50%,
      rgba(0,220,200,0.12) 0%,
      rgba(0,180,220,0.06) 40%,
      transparent 65%);
    mix-blend-mode:screen;filter:blur(20px);
    animation:icePulse 5s ease-in-out infinite;
  }
  @keyframes icePulse{0%,100%{opacity:0.7;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.03)}}

  /* UI zones */
  .center-darken{position:absolute;top:300px;left:50%;transform:translateX(-50%);width:780px;height:540px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(0,8,20,0.42) 0%,transparent 70%);z-index:38;}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 40%,rgba(0,0,10,0.72) 100%);z-index:39;pointer-events:none;}
  .zone-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(0,0,0,0.5) 0%,transparent 100%);z-index:40;}
  .zone-bot{position:absolute;bottom:0;left:0;right:0;height:920px;background:linear-gradient(0deg,rgba(0,0,12,0.65) 0%,rgba(0,0,12,0.15) 40%,transparent 100%);z-index:40;}
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="mountains"></div>
  <div class="mountain-snow"></div>
  <div class="iceberg ib1"></div>
  <div class="iceberg ib2"></div>
  <div class="iceberg ib3"></div>
  <div class="ib-glow"></div>

  <!-- Canvas stack: aurora → ice → ring crystals → particles -->
  <canvas id="cAurora"></canvas>
  <canvas id="cIce"></canvas>
  <canvas id="cRing"></canvas>
  <canvas id="cParticles"></canvas>

  <div class="ice-plain"></div>
  <div class="ice-sheen"></div>
  <div class="ring-ice-glow"></div>
  <div class="center-darken"></div>
  <div class="vignette"></div>
  <div class="zone-top"></div>
  <div class="zone-bot"></div>

<script>
const W=1080, H=1920;
const RING_CX=540, RING_CY=590, RING_R=300;

function mkCanvas(id){
  const c=document.getElementById(id);
  c.width=W; c.height=H;
  return c.getContext('2d');
}
const auroraCtx  = mkCanvas('cAurora');
const iceCtx     = mkCanvas('cIce');
const ringCtx    = mkCanvas('cRing');
const partCtx    = mkCanvas('cParticles');

/* ═══════════════════════════════════════════════════════════════════════════
   AURORA BOREALIS — 5 animated bands
   ═══════════════════════════════════════════════════════════════════════════ */
const auroraBands=[
  {y:180, amp:55,  freq:0.0028, phOff:0,    speed:0.006, hue:160, sat:100, ht:160, bright:0.45},
  {y:320, amp:45,  freq:0.0035, phOff:1.2,  speed:0.009, hue:195, sat:95,  ht:130, bright:0.40},
  {y:220, amp:65,  freq:0.0022, phOff:2.5,  speed:0.005, hue:270, sat:90,  ht:120, bright:0.35},
  {y:400, amp:40,  freq:0.0042, phOff:3.8,  speed:0.011, hue:175, sat:100, ht:100, bright:0.38},
  {y:140, amp:70,  freq:0.0018, phOff:0.7,  speed:0.004, hue:210, sat:90,  ht:140, bright:0.32},
];
// Per-band phase and flare state
const bandState=auroraBands.map(()=>({phase:Math.random()*Math.PI*2, flare:0, flareTimer:8+Math.random()*12}));

/* ═══════════════════════════════════════════════════════════════════════════
   ICE PLAIN — cracks drawn once
   ═══════════════════════════════════════════════════════════════════════════ */
(function buildIceCracks(){
  iceCtx.clearRect(0,0,W,H);
  const crackY=H-420;
  for(let i=0;i<22;i++){
    const x1=Math.random()*W, y1=crackY+Math.random()*(H-crackY);
    let cx=x1,cy=y1;
    const len=3+Math.floor(Math.random()*8);
    const a=Math.random()*Math.PI*2;
    iceCtx.beginPath(); iceCtx.moveTo(cx,cy);
    for(let s=0;s<len;s++){
      const na=a+(Math.random()-0.5)*0.6;
      cx+=Math.cos(na)*18+Math.random()*10;
      cy+=Math.sin(na)*6+Math.random()*4;
      iceCtx.lineTo(cx,cy);
    }
    const alpha=0.04+Math.random()*0.08;
    iceCtx.strokeStyle=`rgba(100,200,240,${alpha})`;
    iceCtx.lineWidth=0.8+Math.random()*1.2;
    iceCtx.stroke();
  }
  // Reflection shimmer lines
  for(let i=0;i<8;i++){
    const rx=100+Math.random()*880;
    const rg=iceCtx.createLinearGradient(rx,crackY,rx+Math.random()*80-40,H);
    rg.addColorStop(0,'rgba(0,200,220,0)');
    rg.addColorStop(0.4,`rgba(0,180,220,${0.04+Math.random()*0.06})`);
    rg.addColorStop(1,'rgba(0,200,220,0)');
    iceCtx.strokeStyle=rg;
    iceCtx.lineWidth=1.5+Math.random()*2;
    iceCtx.beginPath();
    iceCtx.moveTo(rx,crackY);
    iceCtx.lineTo(rx+(Math.random()-0.5)*40,H);
    iceCtx.stroke();
  }
})();

/* ═══════════════════════════════════════════════════════════════════════════
   ICE CRYSTALS — hexagonal prisms around ring
   ═══════════════════════════════════════════════════════════════════════════ */
const CRYSTAL_COUNT=14;
const crystals=[];
for(let i=0;i<CRYSTAL_COUNT;i++){
  const ang=(i/CRYSTAL_COUNT)*Math.PI*2;
  crystals.push({
    ang,
    orbitR: RING_R+75+Math.random()*50,
    h: 38+Math.random()*55,
    w: 12+Math.random()*10,
    rot: Math.random()*0.3-0.15,
    rotV: (Math.random()-0.5)*0.003,
    phase: Math.random()*Math.PI*2,
    speed: 0.012+Math.random()*0.008,
    hue: 160+Math.random()*120,
    tilt: (Math.random()-0.5)*0.4,
  });
}

function drawHexCrystal(ctx, cx, cy, w, h, rot, hue, bright){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);

  // Crystal body — hexagonal prism top view
  const pts6=[];
  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2-Math.PI/6;
    pts6.push({x:Math.cos(a)*w, y:Math.sin(a)*w});
  }

  // Tall crystal shape: flat hex base, pointed tip above
  const tipX=Math.sin(0.2)*h*0.3;
  const tipY=-h;

  // Side faces (trapezoids)
  for(let i=0;i<6;i++){
    const p1=pts6[i], p2=pts6[(i+1)%6];
    const shade=0.4+0.6*((i+0.5)/6);
    const cg=ctx.createLinearGradient(0,0,0,-h);
    cg.addColorStop(0,`hsla(${hue},80%,${30*shade}%,0.85)`);
    cg.addColorStop(0.5,`hsla(${hue+10},85%,${55*shade*bright}%,0.7)`);
    cg.addColorStop(1,`hsla(${hue+20},90%,${75*bright}%,0.3)`);
    ctx.fillStyle=cg;
    ctx.shadowBlur=12; ctx.shadowColor=`hsla(${hue},100%,70%,0.7)`;
    ctx.beginPath();
    ctx.moveTo(p1.x,p1.y);
    ctx.lineTo(p2.x,p2.y);
    ctx.lineTo(p2.x*0.3+tipX*0.7,p2.y*0.3+tipY*0.7);
    ctx.lineTo(p1.x*0.3+tipX*0.7,p1.y*0.3+tipY*0.7);
    ctx.closePath(); ctx.fill();
  }

  // Top tip (bright point)
  const tg=ctx.createRadialGradient(tipX,tipY,0,tipX,tipY,w*0.8);
  tg.addColorStop(0,`hsla(${hue+30},100%,90%,${bright*0.95})`);
  tg.addColorStop(0.4,`hsla(${hue+10},95%,70%,${bright*0.5})`);
  tg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=tg;
  ctx.shadowBlur=20; ctx.shadowColor=`hsla(${hue},100%,80%,0.9)`;
  ctx.beginPath(); ctx.arc(tipX,tipY,w*0.5,0,Math.PI*2); ctx.fill();

  // Hex base cap
  ctx.shadowBlur=0;
  ctx.strokeStyle=`hsla(${hue},90%,75%,${bright*0.5})`;
  ctx.lineWidth=0.8;
  ctx.beginPath();
  ctx.moveTo(pts6[0].x,pts6[0].y);
  for(let i=1;i<6;i++) ctx.lineTo(pts6[i].x,pts6[i].y);
  ctx.closePath(); ctx.stroke();

  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════════════════
   SNOWFLAKE RING — delicate crystals swirling around spawn ring
   ═══════════════════════════════════════════════════════════════════════════ */
const snowRing=[];
for(let i=0;i<24;i++){
  snowRing.push({
    angle:(i/24)*Math.PI*2,
    speed:(0.004+Math.random()*0.006)*(Math.random()<0.5?1:-1),
    r:RING_R+30+Math.random()*40,
    size:4+Math.random()*7,
    phase:Math.random()*Math.PI*2,
  });
}

function drawSnowflake(ctx,x,y,size,rotation,alpha){
  ctx.save();
  ctx.translate(x,y); ctx.rotate(rotation);
  ctx.strokeStyle=`rgba(200,240,255,${alpha})`;
  ctx.lineWidth=1;
  ctx.shadowBlur=6; ctx.shadowColor=`rgba(150,220,255,${alpha*0.8})`;
  // 6 arms
  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(a)*size, Math.sin(a)*size);
    // side branches
    const bx=Math.cos(a)*size*0.5, by=Math.sin(a)*size*0.5;
    ctx.moveTo(bx,by);
    ctx.lineTo(bx+Math.cos(a+Math.PI/3)*size*0.3, by+Math.sin(a+Math.PI/3)*size*0.3);
    ctx.moveTo(bx,by);
    ctx.lineTo(bx+Math.cos(a-Math.PI/3)*size*0.3, by+Math.sin(a-Math.PI/3)*size*0.3);
    ctx.stroke();
  }
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════════════════
   PARTICLES: Snowfall, Ice glitter, Aurora motes
   ═══════════════════════════════════════════════════════════════════════════ */
const snowflakes=[];
for(let i=0;i<95;i++) snowflakes.push(mkSnow(true));
function mkSnow(init){
  return{
    x:Math.random()*W, y:init?Math.random()*H:-20,
    r:0.8+Math.random()*2.8,
    vy:0.4+Math.random()*0.8,
    vx:(Math.random()-0.5)*0.4-0.3,
    sway:Math.random()*Math.PI*2,
    swSp:0.008+Math.random()*0.015,
    a:0.3+Math.random()*0.5,
  };
}

// Ice glitter on the ice plain
const glitter=[];
for(let i=0;i<38;i++){
  glitter.push({
    x:Math.random()*W,
    y:H-20-Math.random()*380,
    phase:Math.random()*Math.PI*2,
    speed:0.04+Math.random()*0.08,
    r:0.8+Math.random()*1.8,
    hue:160+Math.random()*60,
  });
}

// Aurora motes drifting along bands
const auroraMotes=[];
for(let i=0;i<20;i++){
  const band=auroraBands[Math.floor(Math.random()*auroraBands.length)];
  auroraMotes.push({
    x:Math.random()*W,
    y:band.y+Math.random()*50,
    vx:0.3+Math.random()*0.8,
    phase:Math.random()*Math.PI*2,
    hue:band.hue,
    r:1.5+Math.random()*3,
    a:0.4+Math.random()*0.4,
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   MAIN LOOP
   ═══════════════════════════════════════════════════════════════════════════ */
let t=0;

function loop(){
  t+=0.016;

  /* ── AURORA ── */
  auroraCtx.clearRect(0,0,W,H);
  auroraCtx.globalCompositeOperation='screen';

  // Global breath — slow pulsing intensity
  const globalBreath=0.65+Math.sin(t*0.22)*0.22+Math.sin(t*0.37)*0.13;

  for(let bi=0;bi<auroraBands.length;bi++){
    const b=auroraBands[bi];
    const bs=bandState[bi];
    bs.phase+=b.speed;

    // Flare logic — occasional brightness spike
    bs.flareTimer-=0.016;
    if(bs.flareTimer<0){
      bs.flare=1;
      bs.flareTimer=8+Math.random()*16;
    }
    if(bs.flare>0) bs.flare=Math.max(0,bs.flare-0.025);
    const flareBoost=bs.flare*0.6;

    const intensity=globalBreath*(0.6+flareBoost);

    // Draw band as a series of gradient strips
    const STEPS=W/4;
    for(let xi=0;xi<=STEPS;xi++){
      const x=(xi/STEPS)*W;
      const xNext=((xi+1)/STEPS)*W;
      const waveMid=Math.sin(x*b.freq+bs.phase+b.phOff)*b.amp;
      const waveNext=Math.sin(xNext*b.freq+bs.phase+b.phOff)*b.amp;
      const yMid=b.y+waveMid;
      const yNext=b.y+waveNext;

      const grad=auroraCtx.createLinearGradient(x,yMid-b.ht*0.5,x,yMid+b.ht);
      grad.addColorStop(0,`hsla(${b.hue},${b.sat}%,60%,0)`);
      grad.addColorStop(0.2,`hsla(${b.hue},${b.sat}%,65%,${b.bright*intensity*0.6})`);
      grad.addColorStop(0.45,`hsla(${b.hue+8},${b.sat}%,72%,${b.bright*intensity})`);
      grad.addColorStop(0.7,`hsla(${b.hue+15},${b.sat}%,60%,${b.bright*intensity*0.5})`);
      grad.addColorStop(1,`hsla(${b.hue},${b.sat}%,50%,0)`);

      auroraCtx.fillStyle=grad;
      auroraCtx.beginPath();
      auroraCtx.moveTo(x, yMid-b.ht*0.5);
      auroraCtx.lineTo(xNext, yNext-b.ht*0.5);
      auroraCtx.lineTo(xNext, yNext+b.ht);
      auroraCtx.lineTo(x, yMid+b.ht);
      auroraCtx.fill();
    }
  }
  auroraCtx.globalCompositeOperation='source-over';

  /* ── RING: Ice crystals + snowflake ring ── */
  ringCtx.clearRect(0,0,W,H);

  // Under-ice glow
  const iceGlow=0.6+Math.sin(t*1.4)*0.3;
  const ig=ringCtx.createRadialGradient(RING_CX,RING_CY,0,RING_CX,RING_CY,RING_R+180);
  ig.addColorStop(0,`rgba(0,220,200,${0.18*iceGlow})`);
  ig.addColorStop(0.35,`rgba(0,180,220,${0.09*iceGlow})`);
  ig.addColorStop(0.7,`rgba(0,140,200,${0.04*iceGlow})`);
  ig.addColorStop(1,'rgba(0,0,0,0)');
  ringCtx.fillStyle=ig;
  ringCtx.beginPath(); ringCtx.arc(RING_CX,RING_CY,RING_R+180,0,Math.PI*2); ringCtx.fill();

  // Crystals
  for(const c of crystals){
    c.phase+=c.speed;
    c.rot+=c.rotV;
    const bright=0.5+Math.sin(c.phase)*0.5;
    // Color shifts with aurora
    const hueShift=c.hue+Math.sin(t*0.4+c.ang)*40;
    const cx=RING_CX+Math.cos(c.ang)*c.orbitR;
    const cy=RING_CY+Math.sin(c.ang)*c.orbitR;
    drawHexCrystal(ringCtx,cx,cy,c.w,c.h,c.rot+c.tilt,hueShift,bright);
  }
  ringCtx.shadowBlur=0;

  // Snowflake ring
  for(const sf of snowRing){
    sf.angle+=sf.speed;
    sf.phase+=0.04;
    const glow=0.4+Math.sin(sf.phase)*0.4;
    const sx=RING_CX+Math.cos(sf.angle)*sf.r;
    const sy=RING_CY+Math.sin(sf.angle)*sf.r;
    drawSnowflake(ringCtx,sx,sy,sf.size,sf.angle+t*0.5,glow*0.7);
  }
  ringCtx.shadowBlur=0;

  /* ── PARTICLES ── */
  partCtx.clearRect(0,0,W,H);

  // Snow
  for(let i=0;i<snowflakes.length;i++){
    const s=snowflakes[i];
    s.sway+=s.swSp;
    s.x+=s.vx+Math.sin(s.sway)*0.5;
    s.y+=s.vy;
    if(s.y>H+20) snowflakes[i]=mkSnow(false);
    partCtx.fillStyle=`rgba(220,240,255,${s.a})`;
    partCtx.beginPath(); partCtx.arc(s.x,s.y,s.r,0,Math.PI*2); partCtx.fill();
    // Larger flakes get a small cross shape
    if(s.r>2){
      partCtx.strokeStyle=`rgba(220,240,255,${s.a*0.5})`;
      partCtx.lineWidth=0.6;
      partCtx.beginPath();
      partCtx.moveTo(s.x-s.r*1.4,s.y); partCtx.lineTo(s.x+s.r*1.4,s.y);
      partCtx.moveTo(s.x,s.y-s.r*1.4); partCtx.lineTo(s.x,s.y+s.r*1.4);
      partCtx.stroke();
    }
  }

  // Ice glitter
  partCtx.save();
  for(const g of glitter){
    g.phase+=g.speed;
    const pulse=Math.max(0,Math.sin(g.phase));
    if(pulse<0.05) continue;
    partCtx.shadowBlur=6; partCtx.shadowColor=`hsla(${g.hue},90%,80%,0.8)`;
    partCtx.fillStyle=`hsla(${g.hue},90%,85%,${pulse*0.85})`;
    partCtx.beginPath(); partCtx.arc(g.x,g.y,g.r,0,Math.PI*2); partCtx.fill();
  }
  partCtx.shadowBlur=0; partCtx.restore();

  // Aurora motes
  partCtx.save();
  for(const m of auroraMotes){
    m.phase+=0.04;
    m.x+=m.vx;
    if(m.x>W+50) m.x=-50;
    const band=auroraBands[auroraMotes.indexOf(m)%auroraBands.length];
    m.y=band.y+Math.sin(m.x*band.freq+bandState[auroraMotes.indexOf(m)%auroraBands.length].phase)*band.amp
       +Math.sin(m.phase)*15;
    const pulse=0.4+Math.sin(m.phase*1.5)*0.4;
    partCtx.shadowBlur=10; partCtx.shadowColor=`hsla(${m.hue},100%,70%,0.9)`;
    partCtx.fillStyle=`hsla(${m.hue},100%,80%,${m.a*pulse})`;
    partCtx.beginPath(); partCtx.arc(m.x,m.y,m.r,0,Math.PI*2); partCtx.fill();
  }
  partCtx.shadowBlur=0; partCtx.restore();

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
