<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Ice — Eishöhle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000814;}
canvas{position:absolute;inset:0;width:1080px;height:1920px;display:block;}
/* Deep cave with frozen blue tunnel opening into distance */
.cave{position:absolute;inset:0;background:
  radial-gradient(ellipse 35% 30% at 50% 50%, #7fdfff 0%, #3a9fd5 15%, #0a4878 40%, #001830 70%, #000814 100%),
  radial-gradient(ellipse 60% 55% at 50% 55%, #0a4878 0%, #001830 50%, #000814 100%);}
/* Frosty glow ring from tunnel entrance */
.tunnel-glow{position:absolute;top:480px;left:50%;transform:translateX(-50%);width:700px;height:700px;border-radius:50%;
  background:radial-gradient(circle,rgba(180,240,255,0.35) 0%,rgba(100,200,255,0.15) 30%,transparent 65%);
  filter:blur(40px);animation:pu 6s ease-in-out infinite;}
@keyframes pu{0%,100%{opacity:0.8;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.06)}}

/* Cave walls — top/bottom edges, jagged ice */
.wall-top{position:absolute;top:-20px;left:-20px;right:-20px;height:360px;}
.wall-bot{position:absolute;bottom:-20px;left:-20px;right:-20px;height:420px;}
.wall-l{position:absolute;left:-20px;top:-20px;bottom:-20px;width:340px;}
.wall-r{position:absolute;right:-20px;top:-20px;bottom:-20px;width:360px;}
.wall-top svg,.wall-bot svg,.wall-l svg,.wall-r svg{width:100%;height:100%;display:block;}

.zone-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(0,0,0,0.55) 0%,transparent 100%);z-index:40;}
.zone-bot{position:absolute;bottom:0;left:0;right:0;height:920px;background:linear-gradient(0deg,rgba(0,8,20,0.55) 0%,transparent 100%);z-index:40;}
.center-darken{position:absolute;top:300px;left:50%;transform:translateX(-50%);width:780px;height:540px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(0,8,20,0.25) 0%,transparent 70%);z-index:38;}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse 75% 65% at 50% 50%,transparent 35%,rgba(0,0,0,0.7) 100%);z-index:39;pointer-events:none;}
</style></head><body>
<div class="cave"></div>
<div class="tunnel-glow"></div>

<!-- Top wall with icicles hanging down -->

    <stop offset="80%" stop-color="#9fdfff"/>
    <stop offset="100%" stop-color="#e0f5ff"/>
  </linearGradient></defs>
  <!-- Cave roof rock base -->
  <path d="M0 0 L1120 0 L1120 180 Q950 200 800 170 Q650 140 500 180 Q350 210 200 170 Q80 140 0 180 Z" fill="#0a2038"/>
  <path d="M0 0 L1120 0 L1120 160 Q950 180 800 150 Q650 120 500 160 Q350 190 200 150 Q80 120 0 160 Z" fill="#143a5a" opacity="0.7"/>
  <!-- Icicles hanging -->
  <g fill="url(#ice1)" opacity="0.92">

    <path d="M180 165 L195 250 L210 165 Z"/>
    <path d="M240 175 L260 310 L280 175 Z"/>
    <path d="M320 160 L335 220 L350 160 Z"/>
    <path d="M380 175 L400 330 L420 175 Z"/>
    <path d="M460 170 L475 260 L490 170 Z"/>

    <path d="M1080 175 L1100 330 L1120 175 Z"/>
  </g>
  <!-- Highlight on icicles -->
  <g fill="#e0f5ff" opacity="0.5">
    <path d="M55 170 L58 270 L62 170 Z"/>
    <path d="M118 180 L122 320 L128 180 Z"/>
    <path d="M258 185 L262 290 L268 185 Z"/>
    <path d="M398 185 L402 310 L408 185 Z"/>
    <path d="M538 170 L542 270 L548 170 Z"/>
    <path d="M678 180 L682 300 L688 180 Z"/>
    <path d="M818 185 L822 280 L828 185 Z"/>
    <path d="M958 175 L962 290 L968 175 Z"/>
    <path d="M1098 185 L1102 310 L1108 185 Z"/>
  </g>
</svg></div>

<!-- Bottom wall with stalagmites -->
<div class="wall-bot"><svg viewBox="0 0 1120 420" preserveAspectRatio="none">
  <defs><linearGradient id="ice2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#e0f5ff"/>
    <stop offset="30%" stop-color="#9fdfff"/>
    <stop offset="70%" stop-color="#3a8dc0"/>
    <stop offset="100%" stop-color="#0a2848"/>
  </linearGradient></defs>
  <path d="M0 420 L1120 420 L1120 240 Q950 200 800 240 Q650 280 500 230 Q350 190 200 240 Q80 280 0 240 Z" fill="#0a2038"/>
  <path d="M0 420 L1120 420 L1120 260 Q950 220 800 260 Q650 300 500 250 Q350 210 200 260 Q80 300 0 260 Z" fill="#143a5a" opacity="0.7"/>
  <!-- Stalagmites rising -->
  <g fill="url(#ice2)" opacity="0.92">
    <path d="M50 240 L70 100 L90 240 Z"/>
    <path d="M130 250 L145 180 L160 250 Z"/>
    <path d="M200 240 L220 60 L240 240 Z"/>
    <path d="M290 250 L305 170 L320 250 Z"/>
    <path d="M360 235 L380 90 L400 235 Z"/>
    <path d="M440 250 L455 180 L470 250 Z"/>
    <path d="M510 240 L530 110 L550 240 Z"/>
    <path d="M600 245 L615 175 L630 245 Z"/>
    <path d="M670 235 L690 80 L710 235 Z"/>
    <path d="M760 250 L775 175 L790 250 Z"/>
    <path d="M830 240 L850 100 L870 240 Z"/>
    <path d="M920 250 L935 180 L950 250 Z"/>
    <path d="M990 240 L1010 90 L1030 240 Z"/>
    <path d="M1070 250 L1085 175 L1100 250 Z"/>
  </g>
  <g fill="#e0f5ff" opacity="0.5">
    <path d="M68 130 L71 235 L75 130 Z"/>
    <path d="M218 90 L222 235 L226 90 Z"/>
    <path d="M378 120 L382 230 L386 120 Z"/>
    <path d="M528 140 L532 235 L536 140 Z"/>
    <path d="M688 110 L692 230 L696 110 Z"/>
    <path d="M848 130 L852 235 L856 130 Z"/>
    <path d="M1008 120 L1012 235 L1016 120 Z"/>
  </g>
</svg></div>

<!-- Left wall -->
<div class="wall-l"><svg viewBox="0 0 340 1960" preserveAspectRatio="none">
  <defs><linearGradient id="ice3" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0a2038"/>
    <stop offset="60%" stop-color="#1a4878"/>
    <stop offset="100%" stop-color="#5fafdf"/>
  </linearGradient></defs>
  <path d="M0 0 L180 0 Q160 300 200 600 Q240 900 170 1200 Q210 1500 180 1960 L0 1960 Z" fill="url(#ice3)"/>
  <!-- Ice protrusions -->
  <g fill="#7fcfef" opacity="0.7">
    <path d="M170 200 L260 240 L180 280 Z"/>
    <path d="M190 500 L280 560 L200 600 Z"/>
    <path d="M170 800 L270 840 L180 880 Z"/>
    <path d="M200 1100 L290 1150 L210 1200 Z"/>
    <path d="M180 1400 L270 1440 L190 1480 Z"/>
    <path d="M200 1700 L280 1750 L210 1790 Z"/>
  </g>
  <g fill="#c0ecff" opacity="0.5">
    <path d="M180 210 L245 245 L190 275 Z"/>
    <path d="M200 510 L265 560 L210 595 Z"/>
    <path d="M180 810 L255 840 L190 875 Z"/>
    <path d="M210 1110 L275 1150 L220 1195 Z"/>
  </g>
</svg></div>

<!-- Right wall -->
<div class="wall-r"><svg viewBox="0 0 360 1960" preserveAspectRatio="none">
  <defs><linearGradient id="ice4" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0%" stop-color="#0a2038"/>
    <stop offset="60%" stop-color="#1a4878"/>
    <stop offset="100%" stop-color="#5fafdf"/>
  </linearGradient></defs>
  <path d="M360 0 L180 0 Q200 300 160 600 Q120 900 190 1200 Q150 1500 180 1960 L360 1960 Z" fill="url(#ice4)"/>
  <g fill="#7fcfef" opacity="0.7">
    <path d="M190 250 L100 290 L180 330 Z"/>
    <path d="M170 550 L80 610 L160 650 Z"/>
    <path d="M190 850 L90 890 L180 930 Z"/>
    <path d="M160 1150 L70 1200 L150 1250 Z"/>
    <path d="M180 1450 L90 1490 L170 1530 Z"/>
    <path d="M160 1750 L80 1800 L150 1840 Z"/>
  </g>
  <g fill="#c0ecff" opacity="0.5">
    <path d="M180 260 L115 295 L170 325 Z"/>
    <path d="M160 560 L95 610 L150 645 Z"/>
    <path d="M180 860 L105 890 L170 925 Z"/>
    <path d="M150 1160 L85 1200 L140 1245 Z"/>
  </g>
</svg></div>

<canvas id="shimmer"></canvas>
<canvas id="drops"></canvas>
<canvas id="crystals"></canvas>
<canvas id="mist"></canvas>

<div class="center-darken"></div><div class="vignette"></div><div class="zone-top"></div><div class="zone-bot"></div>

<script>
const W=1080,H=1920;
function s(id){const c=document.getElementById(id);c.width=W;c.height=H;return c.getContext('2d');}
const sh=s('shimmer'),dp=s('drops'),cr=s('crystals'),ms=s('mist');

// Shimmer — sparkles on ice walls
const sparkles=[];
for(let i=0;i<70;i++){
  const side=Math.random();
  let x,y;
  if(side<0.25){x=Math.random()*320;y=Math.random()*H;}
  else if(side<0.5){x=W-Math.random()*320;y=Math.random()*H;}
  else if(side<0.75){x=Math.random()*W;y=Math.random()*300;}
  else{x=Math.random()*W;y=H-Math.random()*350;}
  sparkles.push({x,y,sz:1.5+Math.random()*3,ph:Math.random()*Math.PI*2,sp:0.04+Math.random()*0.06,hue:185+Math.random()*25});
}

// Water drops falling from icicles
const drops=[];
const dropSources=[55,120,195,260,335,400,475,540,615,680,755,820,895,960,1035,1100];
function addDrop(){
  const x=dropSources[Math.floor(Math.random()*dropSources.length)]+(Math.random()-0.5)*4;
  drops.push({x,y:250+Math.random()*80,vy:1+Math.random()*1.5,a:1,sz:2+Math.random()*2,trail:[]});
}

// Floating ice crystals
const crystals=[];
for(let i=0;i<35;i++)crystals.push({x:Math.random()*W,y:Math.random()*H,sz:3+Math.random()*6,rot:Math.random()*Math.PI*2,vr:(Math.random()-0.5)*0.02,vy:-0.15-Math.random()*0.3,vx:(Math.random()-0.5)*0.3,a:0.4+Math.random()*0.4,hue:190+Math.random()*20});

// Mist tendrils
const mists=[];
for(let i=0;i<10;i++)mists.push({x:Math.random()*W,y:400+Math.random()*900,r:180+Math.random()*160,vx:(Math.random()-0.5)*0.4,a:0.04+Math.random()*0.06,ph:Math.random()*Math.PI*2});

function drawCrystal(ctx,x,y,sz,rot,col,a){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalAlpha=a;
  ctx.fillStyle=col;ctx.strokeStyle='#e0f5ff';ctx.lineWidth=0.5;
  ctx.beginPath();
  ctx.moveTo(0,-sz);ctx.lineTo(sz*0.7,-sz*0.3);ctx.lineTo(sz*0.5,sz*0.8);
  ctx.lineTo(-sz*0.5,sz*0.8);ctx.lineTo(-sz*0.7,-sz*0.3);ctx.closePath();
  ctx.fill();ctx.stroke();
  ctx.restore();
}

let t=0;
function loop(){
  t+=0.016;

  sh.clearRect(0,0,W,H);
  for(const p of sparkles){
    p.ph+=p.sp;
    const a=(Math.sin(p.ph)*0.5+0.5);
    if(a>0.1){
      sh.fillStyle=`hsla(${p.hue},100%,85%,${a})`;
      sh.beginPath();sh.arc(p.x,p.y,p.sz*a,0,Math.PI*2);sh.fill();
      // Cross sparkle
      sh.strokeStyle=`hsla(${p.hue},100%,95%,${a*0.7})`;sh.lineWidth=0.8;
      sh.beginPath();
      sh.moveTo(p.x-p.sz*3*a,p.y);sh.lineTo(p.x+p.sz*3*a,p.y);
      sh.moveTo(p.x,p.y-p.sz*3*a);sh.lineTo(p.x,p.y+p.sz*3*a);
      sh.stroke();
    }
  }

  dp.clearRect(0,0,W,H);
  if(Math.random()<0.08)addDrop();
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i];d.vy+=0.04;d.y+=d.vy;
    d.trail.push({x:d.x,y:d.y});if(d.trail.length>12)d.trail.shift();
    // Trail
    for(let k=0;k<d.trail.length;k++){
      const tp=d.trail[k];const ta=(k/d.trail.length)*0.5;
      dp.fillStyle=`rgba(180,240,255,${ta})`;
      dp.beginPath();dp.arc(tp.x,tp.y,d.sz*0.4,0,Math.PI*2);dp.fill();
    }
    // Drop
    dp.fillStyle='rgba(220,245,255,0.95)';
    dp.beginPath();dp.ellipse(d.x,d.y,d.sz,d.sz*1.4,0,0,Math.PI*2);dp.fill();
    dp.fillStyle='rgba(255,255,255,0.9)';
    dp.beginPath();dp.arc(d.x-d.sz*0.3,d.y-d.sz*0.4,d.sz*0.3,0,Math.PI*2);dp.fill();
    // Splash when reaching bottom
    if(d.y>1600+Math.random()*100){
      // small ripple
      dp.strokeStyle='rgba(180,240,255,0.6)';dp.lineWidth=1.5;
      dp.beginPath();dp.ellipse(d.x,d.y,d.sz*2,d.sz*0.5,0,0,Math.PI*2);dp.stroke();
      drops.splice(i,1);
    }
  }

  cr.clearRect(0,0,W,H);
  for(const c of crystals){
    c.x+=c.vx;c.y+=c.vy;c.rot+=c.vr;
    if(c.y<-20){c.y=H+20;c.x=Math.random()*W;}
    if(c.x<-20)c.x=W+20;if(c.x>W+20)c.x=-20;
    drawCrystal(cr,c.x,c.y,c.sz,c.rot,`hsl(${c.hue},70%,80%)`,c.a);
  }

  ms.clearRect(0,0,W,H);
  for(const m of mists){
    m.ph+=0.01;m.x+=m.vx;
    if(m.x<-m.r)m.x=W+m.r;if(m.x>W+m.r)m.x=-m.r;
    const g=ms.createRadialGradient(m.x,m.y,0,m.x,m.y,m.r);
    g.addColorStop(0,`rgba(180,220,240,${m.a*(0.8+Math.sin(m.ph)*0.2)})`);
    g.addColorStop(1,'rgba(180,220,240,0)');
    ms.fillStyle=g;ms.beginPath();ms.arc(m.x,m.y,m.r,0,Math.PI*2);ms.fill();
  }

  requestAnimationFrame(loop);
}
loop();
</script>
</body></html>
