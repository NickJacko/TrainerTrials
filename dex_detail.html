<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Catchmon Detail</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="utils.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      color: #333;
      transition: all 0.5s ease;
    }

    /* God Mode Body - Mystical Background */
    body.god-mode {
      background: 
        radial-gradient(circle at 20% 30%, rgba(75,0,130,0.3) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(25,0,50,0.4) 0%, transparent 50%),
        linear-gradient(135deg, #0a0a0a 0%, #1a001a 30%, #000000 70%, #2d002d 100%);
      animation: mysticalBackground 8s ease-in-out infinite alternate;
    }

    @keyframes mysticalBackground {
      0% { filter: brightness(0.8) contrast(1.2); }
      100% { filter: brightness(1.1) contrast(1.5); }
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
    }

    /* God Mode Interference Overlay */
    .interference-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .interference-overlay.active {
      opacity: 1;
      background: 
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(255,255,255,0.03) 2px,
          rgba(255,255,255,0.03) 4px
        ),
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 2px,
          rgba(128,0,128,0.02) 2px,
          rgba(128,0,128,0.02) 4px
        );
      animation: scanlines 0.1s linear infinite, interference 2s ease-in-out infinite;
    }

    @keyframes scanlines {
      0% { background-position: 0 0, 0 0; }
      100% { background-position: 0 4px, 4px 0; }
    }

    @keyframes interference {
      0%, 100% { 
        opacity: 0.6;
        filter: contrast(1) brightness(1);
      }
      50% { 
        opacity: 0.8;
        filter: contrast(1.2) brightness(1.1);
      }
    }

    /* Glitch Effect for God Mode */
    .glitch-container {
      position: relative;
      display: inline-block;
    }

    .glitch-text {
      position: relative;
      display: inline-block;
    }

    .glitch-text::before,
    .glitch-text::after {
      content: attr(data-text);
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
    }

    body.god-mode .glitch-text::before {
      animation: glitch-1 2s infinite;
      color: #ff00ff;
      z-index: -1;
    }

    body.god-mode .glitch-text::after {
      animation: glitch-2 2s infinite;
      color: #00ffff;
      z-index: -2;
    }

    @keyframes glitch-1 {
      0%, 100% { 
        transform: translate(0);
        opacity: 0;
      }
      20% { 
        transform: translate(-2px, 2px);
        opacity: 1;
      }
      40% { 
        transform: translate(-2px, -2px);
        opacity: 1;
      }
      60% { 
        transform: translate(2px, 2px);
        opacity: 1;
      }
      80% { 
        transform: translate(2px, -2px);
        opacity: 1;
      }
    }

    @keyframes glitch-2 {
      0%, 100% { 
        transform: translate(0);
        opacity: 0;
      }
      25% { 
        transform: translate(2px, -2px);
        opacity: 0.8;
      }
      50% { 
        transform: translate(-2px, 2px);
        opacity: 0.8;
      }
      75% { 
        transform: translate(2px, 2px);
        opacity: 0.8;
      }
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 15px 20px;
      border: 1px solid rgba(255,255,255,0.2);
      position: relative;
      z-index: 10;
    }

    body.god-mode .top-bar {
      background: rgba(75,0,130,0.2);
      border: 1px solid rgba(128,0,128,0.4);
      box-shadow: 0 0 20px rgba(75,0,130,0.3);
      animation: mysterBar 3s ease-in-out infinite alternate;
    }

    @keyframes mysterBar {
      0% { box-shadow: 0 0 20px rgba(75,0,130,0.3); }
      100% { box-shadow: 0 0 40px rgba(128,0,128,0.6); }
    }

    .back-button {
      font-size: 16px;
      text-decoration: none;
      color: white;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 12px;
      background: linear-gradient(145deg, rgba(255,255,255,0.2), rgba(255,255,255,0.1));
      border: 1px solid rgba(255,255,255,0.3);
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    body.god-mode .back-button {
      background: linear-gradient(145deg, rgba(128,0,128,0.3), rgba(75,0,130,0.2));
      border: 1px solid rgba(147,112,219,0.4);
      color: #DDA0DD;
    }

    .back-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    h1 {
      text-align: center;
      font-size: clamp(2rem, 5vw, 3rem);
      margin: 12px 0 16px;
      font-weight: 800;
      position: relative;
      z-index: 10;
      color: white;
    }

    body.god-mode h1 {
      color: #9370DB;
      text-shadow: 
        0 0 10px rgba(147,112,219,0.8),
        0 0 20px rgba(75,0,130,0.6),
        0 0 30px rgba(128,0,128,0.4);
      animation: titlePulse 3s ease-in-out infinite alternate;
    }

    @keyframes titlePulse {
      0% { 
        filter: brightness(1);
        text-shadow: 
          0 0 10px rgba(147,112,219,0.8),
          0 0 20px rgba(75,0,130,0.6);
      }
      100% { 
        filter: brightness(1.3);
        text-shadow: 
          0 0 20px rgba(147,112,219,1),
          0 0 40px rgba(75,0,130,0.8),
          0 0 60px rgba(128,0,128,0.6);
      }
    }

    .image-container {
      text-align: center;
      margin-bottom: 30px;
      position: relative;
      z-index: 10;
    }

    img {
      width: 250px;
      max-width: 90%;
      height: auto;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      transition: all 0.5s ease;
    }

    body.god-mode img {
      filter: brightness(0.1) saturate(0) contrast(3);
      border: 4px solid rgba(75,0,130,0.6);
      box-shadow: 
        0 0 30px rgba(75,0,130,0.8),
        0 0 60px rgba(128,0,128,0.4),
        inset 0 0 20px rgba(0,0,0,0.9);
      animation: godImagePulse 4s ease-in-out infinite alternate;
      position: relative;
    }

    @keyframes godImagePulse {
      0% { 
        box-shadow: 
          0 0 30px rgba(75,0,130,0.8),
          0 0 60px rgba(128,0,128,0.4);
        filter: brightness(0.1) saturate(0) contrast(3);
      }
      100% { 
        box-shadow: 
          0 0 50px rgba(75,0,130,1),
          0 0 100px rgba(128,0,128,0.6),
          0 0 150px rgba(147,112,219,0.3);
        filter: brightness(0.15) saturate(0) contrast(4);
      }
    }

    /* God Image Overlay */
    .god-image-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #9370DB;
      font-weight: 900;
      font-size: 14px;
      text-shadow: 
        0 0 20px rgba(147,112,219,1),
        0 0 40px rgba(75,0,130,0.8);
      letter-spacing: 1px;
      text-align: center;
      animation: overlayPulse 3s ease-in-out infinite alternate;
      background: linear-gradient(135deg, 
        rgba(0,0,0,0.9) 0%, 
        rgba(25,0,50,0.8) 50%, 
        rgba(0,0,0,0.9) 100%);
      padding: 8px 16px;
      border-radius: 12px;
      border: 2px solid rgba(147,112,219,0.6);
      box-shadow: 
        0 0 30px rgba(75,0,130,0.5),
        inset 0 0 15px rgba(147,112,219,0.3);
      opacity: 0;
      white-space: nowrap;
      display: none;
    }

    body.god-mode .god-image-overlay {
      opacity: 1;
      display: block;
    }

    @keyframes overlayPulse {
      0% { 
        opacity: 0.9;
        transform: translate(-50%, -50%) scale(1);
        text-shadow: 
          0 0 20px rgba(147,112,219,1),
          0 0 40px rgba(75,0,130,0.8);
      }
      100% { 
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.05);
        text-shadow: 
          0 0 30px rgba(147,112,219,1),
          0 0 60px rgba(75,0,130,1),
          0 0 90px rgba(138,43,226,0.8);
      }
    }

    #summary {
      text-align: center;
      font-size: 18px;
      color: white;
      margin-bottom: 30px;
      font-weight: 600;
      position: relative;
      z-index: 10;
    }

    body.god-mode #summary {
      color: #DDA0DD;
      text-shadow: 0 0 10px rgba(221,160,221,0.6);
    }

    #filterBox {
      margin: 20px auto;
      text-align: center;
      font-size: 15px;
      position: relative;
      z-index: 10;
    }

    #filterBox label {
      color: white;
      font-weight: 600;
      background: rgba(255,255,255,0.1);
      padding: 10px 20px;
      border-radius: 25px;
      border: 1px solid rgba(255,255,255,0.2);
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    body.god-mode #filterBox label {
      background: rgba(75,0,130,0.2);
      border: 1px solid rgba(128,0,128,0.3);
      color: #DDA0DD;
    }

    #filterBox label:hover {
      background: rgba(255,255,255,0.2);
      transform: translateY(-2px);
    }

    #caughtOnly {
      width: 18px;
      height: 18px;
      accent-color: #9370DB;
    }

    .table-container {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 0;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      overflow: hidden;
      position: relative;
      z-index: 10;
    }

    body.god-mode .table-container {
      background: rgba(25,0,25,0.9);
      border: 2px solid rgba(75,0,130,0.4);
      box-shadow: 
        0 0 30px rgba(75,0,130,0.4),
        inset 0 0 20px rgba(128,0,128,0.1);
      animation: tableGlow 4s ease-in-out infinite alternate;
    }

    @keyframes tableGlow {
      0% { 
        box-shadow: 
          0 0 30px rgba(75,0,130,0.4),
          inset 0 0 20px rgba(128,0,128,0.1);
      }
      100% { 
        box-shadow: 
          0 0 50px rgba(75,0,130,0.6),
          inset 0 0 30px rgba(128,0,128,0.2);
      }
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th {
      background: linear-gradient(145deg, #4CAF50, #45a049);
      color: white;
      padding: 16px 12px;
      text-align: center;
      font-weight: 600;
      font-size: 13px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
      border: none;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    body.god-mode th {
      background: linear-gradient(145deg, #4B0082, #8B008B);
      color: #DDA0DD;
      text-shadow: 0 0 5px rgba(221,160,221,0.8);
      animation: headerFlicker 5s ease-in-out infinite alternate;
    }

    @keyframes headerFlicker {
      0%, 100% { 
        filter: brightness(1);
        text-shadow: 0 0 5px rgba(221,160,221,0.8);
      }
      50% { 
        filter: brightness(1.2);
        text-shadow: 0 0 10px rgba(221,160,221,1);
      }
    }

    td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      transition: all 0.2s ease;
      color: white;
    }

    body.god-mode td {
      color: #DDA0DD;
      border-bottom: 1px solid rgba(75,0,130,0.2);
      background: rgba(0,0,0,0.1);
    }

    tr:hover {
      background: linear-gradient(90deg, rgba(76, 175, 80, 0.05), rgba(76, 175, 80, 0.1), rgba(76, 175, 80, 0.05));
    }

    body.god-mode tr:hover {
      background: linear-gradient(90deg, rgba(75,0,130, 0.1), rgba(128,0,128, 0.2), rgba(75,0,130, 0.1));
      transform: scale(1.01);
    }

    .catcher-name {
      display: inline-block;
      font-weight: bold;
      background-size: 200% auto;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 3s linear infinite;
    }

    .king {
      background-image: linear-gradient(90deg, #ffd700, #ffffff, #ffd700);
    }
    .flame {
      background-image: linear-gradient(90deg, #ff0000, #ffffff, #ff0000);
    }
    .diamond {
      background-image: linear-gradient(90deg, #00bfff, #ffffff, #00bfff);
    }
    .shine {
      background-image: linear-gradient(90deg, #32cd32, #ffffff, #32cd32);
    }
    .normal {
      color: white;
      text-shadow: none;
      font-weight: 600;
      background: none;
      -webkit-text-fill-color: inherit;
      background-clip: unset;
      animation: none;
    }

    body.god-mode .normal {
      color: #DDA0DD;
    }

    @keyframes shine {
      to { background-position: -200% center; }
    }

    /* Static/Noise Effect for God Mode */
    .static-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      opacity: 0;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><defs><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs><rect width="100%" height="100%" filter="url(%23noiseFilter)" opacity="0.05"/></svg>') repeat;
      animation: staticNoise 0.1s steps(8,end) infinite;
    }

    body.god-mode .static-overlay {
      opacity: 1;
    }

    @keyframes staticNoise {
      0% { transform: translate(0,0); }
      10% { transform: translate(-5%,-10%); }
      20% { transform: translate(-10%,-15%); }
      30% { transform: translate(5%,-25%); }
      40% { transform: translate(-5%,25%); }
      50% { transform: translate(-10%,10%); }
      60% { transform: translate(15%,0%); }
      70% { transform: translate(0%,-15%); }
      80% { transform: translate(-15%,15%); }
      90% { transform: translate(10%,-10%); }
      100% { transform: translate(5%,0%); }
    }

    /* Mobile Optimizations */
    @media (max-width: 768px) {
      .container {
        padding: 15px;
      }

      h1 {
        font-size: clamp(1.5rem, 6vw, 2rem);
      }

      img {
        width: 200px;
      }

      .god-image-overlay {
        font-size: 12px;
        padding: 6px 12px;
      }

      table {
        font-size: 12px;
      }

      th, td {
        padding: 8px 6px;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 10px;
      }

      h1 {
        font-size: clamp(1.2rem, 8vw, 1.6rem);
      }

      img {
        width: 150px;
      }

      .god-image-overlay {
        font-size: 10px;
        padding: 4px 8px;
      }

      table {
        font-size: 11px;
      }

      th, td {
        padding: 6px 4px;
      }
    }
  </style>
</head>
<body>
  <div class="interference-overlay"></div>
  <div class="static-overlay"></div>
  
  <div class="container">
    <div class="top-bar">
      <a class="back-button" href="javascript:history.back()">← Back</a>
    </div>

    <h1 id="catchTitle" class="glitch-container">
      <span class="glitch-text" data-text="">Loading...</span>
    </h1>
    
    <div class="image-container">
      <img id="catchImg" src="" alt="Sprite">
      <div class="god-image-overlay">⚡ CLASSIFIED ENTITY ⚡<br>ACCESS RESTRICTED</div>
    </div>
    
    <p id="summary">Loading...</p>

    <div id="filterBox">
      <label>
        <input type="checkbox" id="caughtOnly" onchange="renderTable()">
        Show caught only
      </label>
    </div>

    <div class="table-container">
      <table id="dataTable">
        <thead>
          <tr>
            <th>Catcher</th><th>Points</th><th>Level</th><th>Shiny</th><th>Sum</th>
            <th>ATK</th><th>DEF</th><th>SPD</th><th>WIS</th><th>CHA</th><th>LUK</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    const statsOrder = ["ATK", "DEF", "SPD", "WIS", "CHA", "LUK"];
    let allEntries = [];
    let catcherDonations = {};
    let isGodMode = false;

    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function capitalize(s) {
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    function sumStats(stats) {
      return Object.values(stats).reduce((a, b) => a + b, 0);
    }

    function calcPoints(p) {
      return p.gesamtpunkte ?? 0;
    }

    function isGodCatchmon(sprite) {
      return sprite && sprite.includes('/God/');
    }

    function activateGodMode() {
      isGodMode = true;
      document.body.classList.add('god-mode');
      document.querySelector('.interference-overlay').classList.add('active');
      
      // Glitch effect for title
      const titleElement = document.querySelector('.glitch-text');
      if (titleElement) {
        titleElement.setAttribute('data-text', titleElement.textContent);
      }
      
      // Play mysterious sound effect (if available)
      try {
        const audio = new Audio('sounds/god_reveal.mp3');
        audio.volume = 0.3;
        audio.play().catch(() => {});
      } catch (e) {}
      
      // Random screen flickers
      setInterval(() => {
        if (Math.random() < 0.1) { // 10% chance every interval
          document.body.style.filter = 'brightness(1.5) contrast(2)';
          setTimeout(() => {
            document.body.style.filter = '';
          }, 50 + Math.random() * 100);
        }
      }, 2000);
      
      // Random interference bursts
      setInterval(() => {
        if (Math.random() < 0.05) { // 5% chance
          const overlay = document.querySelector('.interference-overlay');
          overlay.style.opacity = '0.9';
          setTimeout(() => {
            overlay.style.opacity = '0.6';
          }, 200 + Math.random() * 300);
        }
      }, 1000);
    }

    function renderTable() {
      const tbody = document.querySelector("#dataTable tbody");
      const showCaughtOnly = document.getElementById("caughtOnly").checked;
      tbody.innerHTML = "";

      allEntries
        .filter(e => !showCaughtOnly || e.catcher)
        .sort((a, b) => calcPoints(b) - calcPoints(a))
        .forEach(e => {
          const tr = document.createElement("tr");
          const stats = statsOrder.map(s => `<td>${e.stats[s]}</td>`).join("");
          
          let catcherCell = "❌";
          if (e.catcher) {
            if (isGodMode) {
              // In God mode, show mysterious catcher names
              catcherCell = `<span class="glitch-text" data-text="█████">█████</span>`;
            } else {
              catcherCell = getStyledCatcherName(e.catcher, catcherDonations[e.catcher] || 0);
            }
          }
          
          tr.innerHTML = `
            <td>${catcherCell}</td>
            <td>${calcPoints(e)}</td>
            <td>${e.level}</td>
            <td>${e.shiny ? "✨" : ""}</td>
            <td>${sumStats(e.stats)}</td>
            ${stats}
          `;
          tbody.appendChild(tr);
        });
    }

    async function loadData() {
      const name = getParam("name");
      if (!name) return;

      try {
        const [catcherResponse, dexResponse, seenResponse] = await Promise.all([
          fetch("catcher.json"),
          fetch("dex_list.json"), 
          fetch("seen_caught.json")
        ]);

        const catcher = catcherResponse.ok ? await catcherResponse.json() : {};
        const dexList = dexResponse.ok ? await dexResponse.json() : [];
        const seenData = seenResponse.ok ? await seenResponse.json() : {};

        const lowerName = name.toLowerCase();
        const entries = [];
        catcherDonations = {};

        Object.entries(catcher.catcher || {}).forEach(([catcher, info]) => {
          catcherDonations[catcher] = info.donation || 0;
          (info.team || []).forEach(p => {
            if (p.name.toLowerCase() === lowerName) {
              entries.push({ ...p, catcher });
            }
          });
        });

        (catcher.escaped || []).forEach(p => {
          if (p.name.toLowerCase() === lowerName) {
            entries.push({ ...p, catcher: null });
          }
        });

        const dexEntry = dexList.find(p => p.name.toLowerCase() === lowerName);
        const sprite = dexEntry?.sprite || "";
        const escaped = seenData[lowerName]?.escaped || 0;
        const caught = seenData[lowerName]?.caught || 0;

        // Check if this is a God Catchmon
        if (isGodCatchmon(sprite)) {
          activateGodMode();
          document.getElementById("catchTitle").innerHTML = 
            `<span class="glitch-text" data-text="#??? ??? ??? ???">#??? ??? ??? ???</span>`;
        } else {
          document.getElementById("catchTitle").textContent = 
            `#${String(dexEntry?.id || "").padStart(3, "0")} ${capitalize(name)}`;
        }
        
        document.getElementById("catchImg").src = sprite;
        document.getElementById("catchImg").alt = name;
        
        if (isGodMode) {
          document.getElementById("summary").textContent = `█ CLASSIFIED / █ CLASSIFIED`;
        } else {
          document.getElementById("summary").textContent = `${escaped} escaped / ${caught} caught`;
        }

        allEntries = entries;
        renderTable();
        
      } catch (error) {
        console.error("Error loading data:", error);
        document.getElementById("catchTitle").textContent = "Error loading data";
        document.getElementById("summary").textContent = "Please check console for details";
      }
    }

    // Initialize glitch text data attributes after DOM load
    document.addEventListener('DOMContentLoaded', () => {
      const glitchElements = document.querySelectorAll('.glitch-text');
      glitchElements.forEach(el => {
        if (!el.getAttribute('data-text')) {
          el.setAttribute('data-text', el.textContent);
        }
      });
    });

    loadData();
  </script>
</body>
</html>
