<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: wss: data: blob:;">
  <title>Catchmon Detail</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="assets/css/dex_detail.css">
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="container">

    <div class="top-bar reveal">
      <a class="back-btn" href="catchdex_live.html">← Catchdex</a>
    </div>

    <div class="hero reveal">
      <div class="hero-img-wrap">
        <img id="catchImg" class="hero-img" src="" alt="Catchmon" loading="lazy">
        <div class="god-overlay">CLASSIFIED ENTITY<br>ACCESS RESTRICTED</div>
      </div>
      <div class="hero-info">
        <div class="hero-eyebrow">Catchmon Detail</div>
        <h1 id="catchTitle" class="catch-title">Loading...</h1>
        <div class="catch-summary" id="summary">Loading statistics...</div>
      </div>
    </div>

    <div class="filter-bar reveal">
      <label class="filter-label">
        <input type="checkbox" id="caughtOnly" checked>
        <span>Show escaped too</span>
      </label>
    </div>

    <div class="table-wrap reveal">
      <table id="dataTable">
        <thead>
          <tr>
            <th>Catcher</th><th>Points</th><th>Lvl</th><th>✨</th>
            <th>Stats</th><th>When</th>
            <th>ATK</th><th>DEF</th><th>SPD</th><th>WIS</th><th>CHA</th><th>LUK</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="12" class="loading"><div class="spinner"></div><div>Loading...</div></td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script type="module" src="assets/js/pages/dex_detail.js"></script>
  <script type="module" src="assets/js/trainer_widget.js"></script>
</body>
</html>
