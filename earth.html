<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Earth — Kristallhöhle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0a0600;}
canvas{position:absolute;inset:0;width:1080px;height:1920px;display:block;}
.bg{position:absolute;inset:0;background:
  radial-gradient(ellipse 70% 45% at 50% 50%, #3a2010 0%, #1a0a00 50%, transparent 80%),
  linear-gradient(180deg, #0a0600 0%, #150a00 35%, #1a0a00 60%, #0a0500 100%);}
/* Cave walls — jagged silhouettes top & bottom */
.stals-top{position:absolute;top:0;left:0;right:0;height:320px;background:#0a0500;
  clip-path:polygon(0 0, 100% 0, 100% 30%, 96% 70%, 92% 20%, 88% 85%, 84% 40%, 80% 90%, 76% 30%, 72% 75%, 68% 25%, 64% 80%, 60% 35%, 56% 95%, 52% 40%, 48% 85%, 44% 30%, 40% 90%, 36% 40%, 32% 75%, 28% 25%, 24% 80%, 20% 35%, 16% 90%, 12% 30%, 8% 70%, 4% 25%, 0 55%);}
.stals-bot{position:absolute;bottom:0;left:0;right:0;height:360px;background:#0a0500;
  clip-path:polygon(0 100%, 100% 100%, 100% 45%, 96% 30%, 92% 80%, 88% 15%, 84% 60%, 80% 10%, 76% 70%, 72% 25%, 68% 75%, 64% 20%, 60% 65%, 56% 5%, 52% 60%, 48% 15%, 44% 70%, 40% 10%, 36% 60%, 32% 25%, 28% 75%, 24% 20%, 20% 65%, 16% 10%, 12% 70%, 8% 30%, 4% 75%, 0 45%);}

/* Underground lake reflection */
.lake{position:absolute;bottom:0;left:0;right:0;height:140px;background:linear-gradient(0deg, rgba(255,153,68,0.15) 0%, transparent 80%);mix-blend-mode:screen;animation:lakePulse 5s ease-in-out infinite;}
@keyframes lakePulse{0%,100%{opacity:0.7}50%{opacity:1}}

.zone-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(0,0,0,0.45) 0%,transparent 100%);z-index:40;}
.zone-bot{position:absolute;bottom:0;left:0;right:0;height:920px;background:linear-gradient(0deg,rgba(10,5,0,0.5) 0%,rgba(10,5,0,0.1) 40%,transparent 100%);z-index:40;}
.center-darken{position:absolute;top:300px;left:50%;transform:translateX(-50%);width:780px;height:540px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(10,5,0,0.35) 0%,transparent 70%);z-index:38;}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 40%,rgba(0,0,0,0.6) 100%);z-index:39;pointer-events:none;}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="crystals"></canvas>
<div class="stals-top"></div>
<div class="stals-bot"></div>
<div class="lake"></div>
<canvas id="drops"></canvas>
<canvas id="dust"></canvas>
<div class="center-darken"></div>
<div class="vignette"></div>
<div class="zone-top"></div>
<div class="zone-bot"></div>
<script>
const W=1080,H=1920;
function setup(id){const c=document.getElementById(id);c.width=W;c.height=H;return c.getContext('2d');}

const cr=setup('crystals');
const crystals=[];
const cHues=[30,15,200,280,45];
for(let i=0;i<30;i++){
  const top=Math.random()<0.5;
  const x=Math.random()*W;
  const y=top?50+Math.random()*250:H-80-Math.random()*250;
  crystals.push({x,y,sz:20+Math.random()*50,rot:(Math.random()-0.5)*0.4,hue:cHues[Math.floor(Math.random()*cHues.length)],ph:Math.random()*Math.PI*2,top});
}
// Middle ambient crystals (smaller, softer)
for(let i=0;i<14;i++){
  crystals.push({x:Math.random()*W,y:400+Math.random()*1000,sz:12+Math.random()*18,rot:Math.random()*Math.PI*2,hue:cHues[Math.floor(Math.random()*cHues.length)],ph:Math.random()*Math.PI*2,top:false,floating:true});
}
function drawCrystal(c,cr){
  c.save();c.translate(cr.x,cr.y);c.rotate(cr.rot);
  const a=0.6+Math.sin(cr.ph)*0.35;
  c.shadowBlur=20;c.shadowColor=`hsl(${cr.hue},90%,60%)`;
  const grad=c.createLinearGradient(0,-cr.sz,0,cr.sz);
  grad.addColorStop(0,`hsla(${cr.hue},90%,70%,${a})`);
  grad.addColorStop(1,`hsla(${cr.hue},90%,40%,${a*0.6})`);
  c.fillStyle=grad;
  c.beginPath();
  c.moveTo(0,-cr.sz);c.lineTo(cr.sz*0.4,-cr.sz*0.4);c.lineTo(cr.sz*0.4,cr.sz*0.7);c.lineTo(0,cr.sz);
  c.lineTo(-cr.sz*0.4,cr.sz*0.7);c.lineTo(-cr.sz*0.4,-cr.sz*0.4);c.closePath();c.fill();
  c.strokeStyle=`hsla(${cr.hue},90%,85%,${a*0.7})`;c.lineWidth=1;c.stroke();
  c.restore();
}

const dp=setup('drops');
const drops=[];
for(let i=0;i<8;i++)drops.push({x:Math.random()*W,y:200+Math.random()*100,vy:3+Math.random()*2,next:performance.now()+Math.random()*3000});

const du=setup('dust');
const dusts=[];
for(let i=0;i<80;i++)dusts.push({x:Math.random()*W,y:Math.random()*H,r:0.5+Math.random()*1.2,vx:(Math.random()-0.5)*0.15,vy:(Math.random()-0.5)*0.1,a:0.2+Math.random()*0.3,hue:25+Math.random()*20});

let t=0;
function loop(){
  t+=0.016;
  cr.clearRect(0,0,W,H);
  for(const c of crystals){c.ph+=0.025;drawCrystal(cr,c);}
  cr.shadowBlur=0;

  dp.clearRect(0,0,W,H);
  for(const d of drops){
    if(performance.now()>d.next){
      d.y+=d.vy;
      if(d.y>H-200){d.next=performance.now()+2000+Math.random()*4000;d.y=200+Math.random()*100;d.x=Math.random()*W;}
      dp.fillStyle='rgba(200,220,255,0.6)';dp.shadowBlur=6;dp.shadowColor='#aaccff';
      dp.beginPath();dp.ellipse(d.x,d.y,2,5,0,0,Math.PI*2);dp.fill();
    }
  }
  dp.shadowBlur=0;

  du.clearRect(0,0,W,H);
  for(const d of dusts){d.x+=d.vx;d.y+=d.vy;
    if(d.x<0)d.x=W;if(d.x>W)d.x=0;if(d.y<0)d.y=H;if(d.y>H)d.y=0;
    du.fillStyle=`hsla(${d.hue},70%,70%,${d.a})`;du.beginPath();du.arc(d.x,d.y,d.r,0,Math.PI*2);du.fill();}
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
