<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<title>Earth — Solide.</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:1080px;height:1920px;
  overflow:hidden;
  background:#000;
  position:relative;
}
canvas{
  position:absolute;top:0;left:0;
  width:1080px;height:1920px;
  pointer-events:none;
}
#zone-top{
  position:absolute;top:0;left:0;width:1080px;height:120px;
  background:linear-gradient(to bottom,rgba(0,0,0,0.62) 0%,transparent 100%);
  z-index:50;pointer-events:none;
}
#zone-bot{
  position:absolute;bottom:0;left:0;width:1080px;height:920px;
  background:linear-gradient(to top,rgba(0,0,0,0.55) 0%,transparent 100%);
  z-index:50;pointer-events:none;
}
#vignette{
  position:absolute;top:0;left:0;width:1080px;height:1920px;
  background:radial-gradient(ellipse 90% 90% at 50% 50%,transparent 32%,rgba(0,0,0,0.68) 100%);
  z-index:49;pointer-events:none;
}
#center-darken{
  position:absolute;left:150px;top:300px;width:780px;height:540px;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0.38) 0%,transparent 70%);
  z-index:48;pointer-events:none;
}
</style>
</head>
<body>

<canvas id="cvBase"    style="z-index:1"></canvas>
<canvas id="cvGround"  style="z-index:2"></canvas>
<canvas id="cvRoots"   style="z-index:3"></canvas>
<canvas id="cvMoss"    style="z-index:4"></canvas>
<canvas id="cvForest"  style="z-index:5"></canvas>
<canvas id="cvPart"    style="z-index:6"></canvas>

<div id="zone-top"></div>
<div id="zone-bot"></div>
<div id="vignette"></div>
<div id="center-darken"></div>

<script>
'use strict';
const W=1080,H=1920,CX=540,CY=590,RING_R=300;

['cvBase','cvGround','cvRoots','cvMoss','cvForest','cvPart'].forEach(id=>{
  const c=document.getElementById(id);c.width=W;c.height=H;
});
const gc=id=>document.getElementById(id).getContext('2d');
const ctxBase  =gc('cvBase');
const ctxGround=gc('cvGround');
const ctxRoots =gc('cvRoots');
const ctxMoss  =gc('cvMoss');
const ctxForest=gc('cvForest');
const ctxPart  =gc('cvPart');

document.getElementById('cvGround').style.mixBlendMode='screen';
document.getElementById('cvRoots').style.mixBlendMode ='screen';
document.getElementById('cvMoss').style.mixBlendMode  ='screen';
document.getElementById('cvForest').style.mixBlendMode='screen';
document.getElementById('cvPart').style.mixBlendMode  ='screen';

let t=0, last=performance.now();
const rng=(a,b)=>a+(b-a)*Math.random();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,x)=>a+(b-a)*x;

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 1 — BASE: deep earth, warm darkness, ember glow at horizon
// ─────────────────────────────────────────────────────────────────────────────
// Slow ember pools — warm patches of distant fire glow from below
const EMBER_POOLS = Array.from({length:8},(_,i)=>({
  x: rng(0,W),
  y: rng(H*0.55, H),
  r: rng(150,380),
  phase: rng(0,Math.PI*2),
  speed: rng(0.04,0.09),
  hue: rng(18,38),
  baseA: rng(0.04,0.09),
}));

function drawBase(){
  const c=ctxBase;
  c.clearRect(0,0,W,H);

  // Deep earth gradient — very dark brown, not black
  const bg=c.createRadialGradient(CX,H*0.65,0,CX,H*0.65,1100);
  bg.addColorStop(0,  '#160d04');
  bg.addColorStop(0.3,'#0f0803');
  bg.addColorStop(0.6,'#090502');
  bg.addColorStop(1,  '#040200');
  c.fillStyle=bg; c.fillRect(0,0,W,H);

  // Distant fire horizon — warm glow creeping up from deep below
  const horizon=c.createLinearGradient(0,H*0.6,0,H);
  horizon.addColorStop(0,'rgba(0,0,0,0)');
  horizon.addColorStop(0.4,`rgba(40,18,4,${0.3+0.1*Math.sin(t*0.18)})`);
  horizon.addColorStop(0.8,`rgba(70,28,6,${0.45+0.1*Math.sin(t*0.14+1)})`);
  horizon.addColorStop(1,  `rgba(90,38,8,${0.6+0.08*Math.sin(t*0.11)})`);
  c.fillStyle=horizon; c.fillRect(0,H*0.6,W,H*0.4);

  // Ember pools — slow breathing heat
  EMBER_POOLS.forEach(ep=>{
    const pulse=0.5+0.5*Math.sin(t*ep.speed+ep.phase);
    const a=ep.baseA*(0.5+0.8*pulse);
    const g=c.createRadialGradient(ep.x,ep.y,0,ep.x,ep.y,ep.r*(0.9+0.2*pulse));
    g.addColorStop(0,  `hsla(${ep.hue},88%,55%,${a*1.5})`);
    g.addColorStop(0.4,`hsla(${ep.hue},75%,32%,${a})`);
    g.addColorStop(1,  'rgba(0,0,0,0)');
    c.fillStyle=g;
    c.beginPath(); c.arc(ep.x,ep.y,ep.r*(0.9+0.2*pulse),0,Math.PI*2); c.fill();
  });

  // Aerial perspective — blue-dark haze in upper portion (forest canopy above)
  const canopyHaze=c.createLinearGradient(0,0,0,H*0.35);
  canopyHaze.addColorStop(0,  'rgba(4,8,3,0.92)');
  canopyHaze.addColorStop(0.5,'rgba(6,10,4,0.55)');
  canopyHaze.addColorStop(1,  'rgba(0,0,0,0)');
  c.fillStyle=canopyHaze; c.fillRect(0,0,W,H*0.35);
}

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 2 — GROUND: soil surface with texture, cracks, wet patches
// ─────────────────────────────────────────────────────────────────────────────

// Soil texture blobs — layered warm-brown organic shapes
const SOIL_BLOBS = Array.from({length:40},()=>({
  x: rng(0,W),
  y: rng(H*0.35,H),
  rx: rng(40,200),
  ry: rng(20,80),
  angle: rng(0,Math.PI),
  hue: rng(22,40),
  sat: rng(45,70),
  lig: rng(12,22),
  alpha: rng(0.12,0.28),
}));

// Ground cracks — deep fissures lit from below
function makeCrack(startX,startY,length,depth){
  const pts=[{x:startX,y:startY}];
  let cx=startX,cy=startY;
  for(let i=0;i<Math.floor(length/18);i++){
    cx+=(Math.random()-0.5)*22;
    cy+=12+Math.random()*10;
    pts.push({x:cx,y:cy});
    if(Math.random()<0.3&&depth<3){
      const branch=makeCrack(cx,cy,length*0.45,depth+1);
      pts.push({branch});
    }
  }
  return pts;
}

// Pre-generate crack paths
const CRACKS=Array.from({length:12},()=>({
  pts: makeCrack(rng(60,W-60), rng(H*0.4,H*0.7), rng(80,220), 0),
  phase: rng(0,Math.PI*2),
  speed: rng(0.3,0.8),
  hue: rng(20,40),
}));

function strokePts(c,pts){
  c.beginPath();
  pts.forEach((p,i)=>{
    if(p.branch){ strokePts(c,p.branch); return; }
    i===0?c.moveTo(p.x,p.y):c.lineTo(p.x,p.y);
  });
  c.stroke();
}

function drawGround(){
  const c=ctxGround;
  c.clearRect(0,0,W,H);

  // Soil blob layer — warm tones, different depths
  SOIL_BLOBS.forEach(sb=>{
    c.save();
    c.globalAlpha=sb.alpha;
    c.translate(sb.x,sb.y); c.rotate(sb.angle);
    const g=c.createRadialGradient(0,0,0,0,0,sb.rx);
    g.addColorStop(0,  `hsl(${sb.hue},${sb.sat}%,${sb.lig}%)`);
    g.addColorStop(0.6,`hsl(${sb.hue},${sb.sat-10}%,${sb.lig-5}%)`);
    g.addColorStop(1,  'rgba(0,0,0,0)');
    c.fillStyle=g;
    c.scale(1,sb.ry/sb.rx);
    c.beginPath(); c.arc(0,0,sb.rx,0,Math.PI*2); c.fill();
    c.restore();
  });

  // Ground cracks — lit from below by ember glow
  CRACKS.forEach(cr=>{
    const pulse=0.5+0.5*Math.sin(t*cr.speed+cr.phase);
    // Outer glow
    [12,5,1.5].forEach((lw,pass)=>{
      const la=[0.06,0.15,0.45][pass]*pulse;
      c.strokeStyle=`hsla(${cr.hue},85%,52%,${la})`;
      c.lineWidth=lw;
      c.shadowColor=`hsl(${cr.hue},90%,55%)`;
      c.shadowBlur=lw*4;
      c.lineCap='round';
      strokePts(c,cr.pts);
      c.shadowBlur=0;
    });
  });

  // Wet patches — puddles, dark reflective spots
  for(let wp=0;wp<14;wp++){
    const wx=80+wp*72+Math.sin(wp*31.7)*60;
    const wy=H*0.45+wp*55+Math.cos(wp*17.3)*80;
    const wr=20+Math.sin(wp*7.1)*15;
    const wa=0.08+0.04*Math.sin(t*0.2+wp);
    const wg=c.createRadialGradient(wx,wy,0,wx,wy,wr*2.5);
    wg.addColorStop(0,  `rgba(35,28,12,${wa*1.5})`);
    wg.addColorStop(0.5,`rgba(25,20,8,${wa})`);
    wg.addColorStop(1,  'rgba(0,0,0,0)');
    c.fillStyle=wg;
    c.beginPath(); c.arc(wx,wy,wr*2.5,0,Math.PI*2); c.fill();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 3 — ROOTS: the underground network, glowing with life
// ─────────────────────────────────────────────────────────────────────────────

// Recursive root builder
function buildRoot(x,y,dir,length,depth,maxD){
  if(depth>maxD||length<8) return [];
  const segs=[];
  let cx=x,cy=y,ca=dir;
  const steps=Math.max(3,Math.floor(length/14));
  for(let s=0;s<steps;s++){
    ca+=rng(-0.22,0.22);
    // Bias: sideways roots spread more horizontal
    const gravBias = depth===0 ? 0.08 : 0.03;
    cy+=gravBias*14;
    const nx=cx+Math.cos(ca)*14;
    const ny=cy+Math.sin(ca)*14;
    const frac=s/steps;
    segs.push({
      x1:cx,y1:cy,x2:nx,y2:ny,
      w:Math.max(0.5, (3.2-depth*0.55)*(1-frac*0.5)),
      depth,
    });
    cx=nx; cy=ny;
    // Branch off
    if(s>1 && Math.random()<(0.28-depth*0.05)){
      const bDir=ca+(Math.random()<0.5?1:-1)*rng(0.35,0.75);
      segs.push(...buildRoot(cx,cy,bDir,length*rng(0.35,0.6),depth+1,maxD));
    }
  }
  return segs;
}

// 6 root origin points along top edge (tree bases)
const ROOT_ORIGINS=[90,220,390,540,710,880,1020];
const ALL_ROOTS=[];
ROOT_ORIGINS.forEach(ox=>{
  // Main taproot — straight down
  ALL_ROOTS.push(...buildRoot(ox+rng(-15,15), rng(160,260), Math.PI/2, rng(450,700), 0, 5));
  // Side roots — spreading
  for(let s=0;s<5;s++){
    const dir=Math.PI*0.25 + s*Math.PI*0.12 * (s%2===0?1:-1);
    ALL_ROOTS.push(...buildRoot(ox+rng(-20,20), rng(200,280), dir, rng(180,340), 1, 4));
  }
});

// Pre-render roots to offscreen for performance
const rootOff=document.createElement('canvas');
rootOff.width=W; rootOff.height=H;
const rootOffCtx=rootOff.getContext('2d');
(function prerenderRoots(){
  const c=rootOffCtx;
  c.clearRect(0,0,W,H);
  ALL_ROOTS.forEach(seg=>{
    const d=seg.depth;
    const hue=lerp(35,22,d/5);
    const lig=lerp(28,14,d/5);
    const a=lerp(0.65,0.25,d/5);
    c.strokeStyle=`hsla(${hue},55%,${lig}%,${a})`;
    c.lineWidth=seg.w;
    c.lineCap='round';
    c.shadowColor=`hsl(${hue},60%,32%)`;
    c.shadowBlur=seg.w*2;
    c.beginPath(); c.moveTo(seg.x1,seg.y1); c.lineTo(seg.x2,seg.y2); c.stroke();
  });
  c.shadowBlur=0;
})();

// Sap flows — living glow traveling along roots
class SapFlow {
  constructor(){
    this.segs=ALL_ROOTS.filter(s=>s.depth<3);
    this.reset();
  }
  reset(){
    this.idx=Math.floor(Math.random()*this.segs.length);
    this.progress=0;
    this.speed=rng(0.0015,0.004);
    this.hue=rng(28,48);
    this.alpha=rng(0.25,0.55);
  }
  update(dt){
    this.progress+=this.speed*dt*60;
    if(this.progress>=1) this.reset();
  }
  draw(c){
    const seg=this.segs[this.idx];
    if(!seg) return;
    const f=this.progress;
    const sx=lerp(seg.x1,seg.x2,f);
    const sy=lerp(seg.y1,seg.y2,f);
    c.save();
    c.globalAlpha=this.alpha*(0.5+0.5*Math.sin(t*4+this.progress*30));
    c.fillStyle=`hsl(${this.hue},90%,65%)`;
    c.shadowColor=`hsl(${this.hue},100%,70%)`; c.shadowBlur=8;
    c.beginPath(); c.arc(sx,sy,2.2,0,Math.PI*2); c.fill();
    c.shadowBlur=0;
    c.restore();
  }
}
const SAP_FLOWS=Array.from({length:18},()=>new SapFlow());

function drawRoots(dt){
  const c=ctxRoots;
  c.clearRect(0,0,W,H);
  c.globalAlpha=0.82;
  c.drawImage(rootOff,0,0);
  c.globalAlpha=1;
  SAP_FLOWS.forEach(sf=>{ sf.update(dt); sf.draw(c); });
}

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 4 — MOSS: bioluminescent ground glow, living earth
// Green/amber moss patches that breathe
// ─────────────────────────────────────────────────────────────────────────────
const MOSS_PATCHES=Array.from({length:28},(_,i)=>({
  x: rng(30,W-30),
  y: rng(H*0.28, H-80),
  rx: rng(25,110),
  ry: rng(10,45),
  hue: Math.random()<0.7 ? rng(95,130) : rng(35,55), // mostly green, some amber
  phase: rng(0,Math.PI*2),
  speed: rng(0.08,0.2),
  alpha: rng(0.09,0.22),
  angle: rng(0,Math.PI),
}));

// Fireflies — slow, lazy drifters in the undergrowth
class Firefly {
  constructor(){this.reset(true)}
  reset(init=false){
    this.x=init?rng(0,W):rng(100,W-100);
    this.y=init?rng(H*0.3,H*0.85):rng(H*0.3,H*0.85);
    this.vx=rng(-0.4,0.4);
    this.vy=rng(-0.25,0.25);
    this.r=rng(2,5);
    this.life=init?Math.random():0;
    this.phase=rng(0,Math.PI*2);
    this.blinkSpeed=rng(0.8,2.5);
    this.hue=Math.random()<0.7 ? rng(85,120) : rng(42,62);
    this.alpha=rng(0.5,1.0);
  }
  update(dt){
    this.x+=this.vx*dt*60+Math.sin(t*0.3+this.phase)*0.5;
    this.y+=this.vy*dt*60+Math.cos(t*0.25+this.phase)*0.3;
    this.life+=dt*0.15;
    if(this.x<0||this.x>W||this.y<H*0.2||this.y>H*0.9||this.life>12) this.reset(false);
  }
  draw(c){
    const blink=Math.pow(Math.max(0,Math.sin(t*this.blinkSpeed+this.phase)),2);
    if(blink<0.05) return;
    c.save();
    c.globalAlpha=blink*this.alpha;
    // Glow halo
    const g=c.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r*5);
    g.addColorStop(0,  `hsl(${this.hue},100%,82%)`);
    g.addColorStop(0.3,`hsl(${this.hue},90%,60%)`);
    g.addColorStop(1,  'rgba(0,0,0,0)');
    c.fillStyle=g;
    c.beginPath(); c.arc(this.x,this.y,this.r*5,0,Math.PI*2); c.fill();
    // Core
    c.fillStyle=`hsl(${this.hue},100%,88%)`;
    c.shadowColor=`hsl(${this.hue},100%,80%)`; c.shadowBlur=this.r*6;
    c.beginPath(); c.arc(this.x,this.y,this.r,0,Math.PI*2); c.fill();
    c.shadowBlur=0;
    c.restore();
  }
}
const FIREFLIES=Array.from({length:35},()=>new Firefly());

function drawMoss(dt){
  const c=ctxMoss;
  c.clearRect(0,0,W,H);

  // Moss patches — bioluminescent ground glow
  MOSS_PATCHES.forEach(mp=>{
    const pulse=0.5+0.5*Math.sin(t*mp.speed+mp.phase);
    const a=mp.alpha*(0.5+0.8*pulse);
    c.save();
    c.globalAlpha=a;
    c.translate(mp.x,mp.y); c.rotate(mp.angle);
    const g=c.createRadialGradient(0,0,0,0,0,mp.rx);
    g.addColorStop(0,  `hsl(${mp.hue},80%,45%)`);
    g.addColorStop(0.5,`hsl(${mp.hue},65%,25%)`);
    g.addColorStop(1,  'rgba(0,0,0,0)');
    c.scale(1,mp.ry/mp.rx);
    c.shadowColor=`hsl(${mp.hue},90%,50%)`;
    c.shadowBlur=mp.rx*0.6;
    c.beginPath(); c.arc(0,0,mp.rx,0,Math.PI*2);
    c.fillStyle=g; c.fill();
    c.shadowBlur=0;
    c.restore();
  });

  // Fireflies
  FIREFLIES.forEach(ff=>{ ff.update(dt); ff.draw(c); });
}

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 5 — FOREST: tree silhouettes, canopy, ember sparks rising
// ─────────────────────────────────────────────────────────────────────────────

// Tree silhouette as a filled dark shape
function drawTreeSilhouette(c,tx,groundY,height,trunkW,crownR,alpha){
  c.save();
  c.globalAlpha=alpha;

  const lean=Math.sin(tx*0.017)*12;
  const topX=tx+lean;
  const topY=groundY-height;

  // Trunk
  c.fillStyle='rgba(8,5,2,0.95)';
  c.shadowColor='rgba(4,2,1,0.8)'; c.shadowBlur=6;
  c.beginPath();
  c.moveTo(tx-trunkW,groundY);
  c.bezierCurveTo(tx-trunkW*0.7,groundY-height*0.5, topX-trunkW*0.4,groundY-height*0.85, topX,topY);
  c.bezierCurveTo(topX+trunkW*0.4,groundY-height*0.85, tx+trunkW*0.7,groundY-height*0.5, tx+trunkW,groundY);
  c.closePath(); c.fill();

  // Crown — layered dark masses
  for(let layer=0;layer<4;layer++){
    const ly=topY + layer*crownR*0.3;
    const lr=crownR*(1.1-layer*0.12);
    const la=0.88-layer*0.06;
    c.globalAlpha=alpha*la;
    const cg=c.createRadialGradient(topX,ly,0,topX,ly,lr);
    cg.addColorStop(0,'rgba(10,14,5,0.96)');
    cg.addColorStop(0.65,'rgba(6,9,3,0.88)');
    cg.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=cg;
    c.shadowColor='rgba(3,6,1,0.7)'; c.shadowBlur=12;
    c.beginPath(); c.arc(topX,ly,lr,0,Math.PI*2); c.fill();
  }
  c.shadowBlur=0;
  c.restore();
}

const TREES_BACK=[
  {x:40,  y:440,h:280,tw:10,cr:95},
  {x:200, y:410,h:330,tw:12,cr:110},
  {x:410, y:400,h:310,tw:11,cr:100},
  {x:600, y:415,h:295,tw:10,cr:95},
  {x:790, y:405,h:320,tw:12,cr:105},
  {x:980, y:430,h:270,tw:10,cr:90},
  {x:120, y:450,h:250,tw:9, cr:85},
  {x:680, y:425,h:285,tw:10,cr:95},
  {x:860, y:410,h:310,tw:11,cr:100},
];
const TREES_FRONT=[
  {x:-20, y:500,h:480,tw:24,cr:155},
  {x:245, y:470,h:560,tw:28,cr:175},
  {x:505, y:460,h:590,tw:30,cr:185},
  {x:780, y:475,h:530,tw:26,cr:165},
  {x:1100,y:490,h:500,tw:25,cr:158},
];

// Ember sparks rising from below
class Ember {
  constructor(){this.reset(true)}
  reset(init=false){
    this.x=rng(50,W-50);
    this.y=init?rng(H*0.4,H):H+10;
    this.vy=-(rng(0.4,1.2));
    this.vx=rng(-0.3,0.3);
    this.r=rng(0.8,3.5);
    this.life=init?Math.random():1;
    this.decay=rng(0.0018,0.004);
    this.hue=rng(18,45);
    this.phase=rng(0,Math.PI*2);
    this.flicker=rng(3,8);
  }
  update(dt){
    this.x+=this.vx*dt*60+Math.sin(t*0.8+this.phase)*0.6;
    this.y+=this.vy*dt*60;
    this.life-=this.decay*dt*60;
    if(this.life<=0||this.y<-20) this.reset(false);
  }
  draw(c){
    const fl=0.4+0.6*Math.pow(Math.max(0,Math.sin(t*this.flicker+this.phase)),1.5);
    c.save();
    c.globalAlpha=this.life*fl*0.85;
    const g=c.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r*3.5);
    g.addColorStop(0,  `hsl(${this.hue},100%,88%)`);
    g.addColorStop(0.4,`hsl(${this.hue},90%,58%)`);
    g.addColorStop(1,  'rgba(0,0,0,0)');
    c.fillStyle=g;
    c.beginPath(); c.arc(this.x,this.y,this.r*3.5,0,Math.PI*2); c.fill();
    c.fillStyle=`hsl(${this.hue},100%,92%)`;
    c.shadowColor=`hsl(${this.hue},100%,75%)`; c.shadowBlur=this.r*5;
    c.beginPath(); c.arc(this.x,this.y,this.r,0,Math.PI*2); c.fill();
    c.shadowBlur=0;
    c.restore();
  }
}
const EMBERS=Array.from({length:70},()=>new Ember());

// Drifting dust motes — slow, warm-lit
class Mote {
  constructor(){this.reset(true)}
  reset(init=false){
    this.x=init?rng(0,W):rng(0,W);
    this.y=init?rng(0,H):H*0.5+Math.random()*H*0.5;
    this.vy=rng(-0.15,-0.04);
    this.vx=rng(-0.12,0.12);
    this.r=rng(0.5,1.8);
    this.life=init?Math.random():1;
    this.decay=rng(0.0005,0.0015);
    this.hue=rng(30,55);
    this.phase=rng(0,Math.PI*2);
    this.alpha=rng(0.2,0.5);
  }
  update(dt){
    this.x+=this.vx*dt*60+Math.sin(t*0.4+this.phase)*0.2;
    this.y+=this.vy*dt*60;
    this.life-=this.decay*dt*60;
    if(this.life<=0||this.y<0) this.reset(false);
  }
  draw(c){
    c.save();
    c.globalAlpha=this.alpha*this.life*(0.5+0.5*Math.sin(t*1.5+this.phase));
    c.fillStyle=`hsl(${this.hue},70%,62%)`;
    c.shadowColor=`hsl(${this.hue},90%,68%)`; c.shadowBlur=this.r*4;
    c.beginPath(); c.arc(this.x,this.y,this.r,0,Math.PI*2); c.fill();
    c.shadowBlur=0;
    c.restore();
  }
}
const MOTES=Array.from({length:80},()=>new Mote());

// Pre-render trees
const treeOff=document.createElement('canvas');
treeOff.width=W; treeOff.height=H;
const treeOffCtx=treeOff.getContext('2d');
(function prerenderTrees(){
  TREES_BACK.forEach(tr=>drawTreeSilhouette(treeOffCtx,tr.x,tr.y,tr.h,tr.tw,tr.cr,0.45));
  TREES_FRONT.forEach(tr=>drawTreeSilhouette(treeOffCtx,tr.x,tr.y,tr.h,tr.tw,tr.cr,0.75));
})();

function drawForest(dt){
  const c=ctxForest;
  c.clearRect(0,0,W,H);

  // Ember sparks
  EMBERS.forEach(em=>{ em.update(dt); em.draw(c); });

  // Forest mist at ground — post-rain atmosphere
  for(let mi=0;mi<7;mi++){
    const mx=rng(0,W), my=H*0.3+mi*80+Math.sin(t*0.06+mi)*60;
    const mr=120+Math.sin(t*0.08+mi)*40;
    const ma=0.025+0.015*Math.sin(t*0.05+mi);
    const mg=c.createRadialGradient(mx,my,0,mx,my,mr);
    mg.addColorStop(0,`rgba(40,35,20,${ma})`);
    mg.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=mg; c.beginPath(); c.arc(mx,my,mr,0,Math.PI*2); c.fill();
  }

  // Tree silhouettes
  c.globalAlpha=1;
  c.drawImage(treeOff,0,0);

  // Dappled light through canopy — warm, shifting patches
  for(let dl=0;dl<22;dl++){
    const dhash=(n)=>{ let x=Math.sin(n)*43758.5453; return x-Math.floor(x); };
    const dx=dhash(dl*127.1)*W;
    const dy=dhash(dl*311.7)*H*0.7+H*0.1;
    const sway=Math.sin(t*0.06+dl)*0.4+Math.cos(t*0.04*dl)*0.2;
    const dox=sway*18, doy=sway*8;
    const dr=25+dhash(dl*71)*40;
    const dra=(0.04+0.025*Math.sin(t*0.1+dl))*Math.abs(Math.sin(t*0.07+dl*0.4));
    const dg=c.createRadialGradient(dx+dox,dy+doy,0,dx+dox,dy+doy,dr);
    dg.addColorStop(0,`rgba(105,82,35,${dra*1.5})`);
    dg.addColorStop(0.5,`rgba(75,58,22,${dra*0.5})`);
    dg.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=dg; c.beginPath(); c.arc(dx+dox,dy+doy,dr,0,Math.PI*2); c.fill();
  }

  // Heavy canopy ceiling
  const canopy=c.createLinearGradient(0,0,0,H*0.22);
  canopy.addColorStop(0,'rgba(5,8,3,0.95)');
  canopy.addColorStop(0.6,'rgba(4,7,2,0.6)');
  canopy.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=canopy; c.fillRect(0,0,W,H*0.22);
}

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 6 — PARTICLES + RING
// ─────────────────────────────────────────────────────────────────────────────
const RING_MOTES=Array.from({length:65},(_,i)=>({
  angle:i/65*Math.PI*2,
  speed:rng(-0.004,0.004),
  rOff:rng(-0.25,0.25),
  r:rng(0.8,2.5),
  life:Math.random(),
  decay:rng(0.003,0.007),
  phase:rng(0,Math.PI*2),
  hue:rng(28,50),
}));

function drawRing(c){
  // Earthy amber-green ring
  [65,28,10,3].forEach((lw,pass)=>{
    const la=[0.025,0.065,0.18,0.52][pass]*(0.7+0.3*Math.sin(t*0.85));
    c.strokeStyle=`hsla(35,82%,52%,${la})`;
    c.lineWidth=lw;
    c.shadowColor='hsla(38,90%,55%,0.4)';
    c.shadowBlur=lw*2;
    c.beginPath(); c.arc(CX,CY,RING_R,0,Math.PI*2); c.stroke();
    c.shadowBlur=0;
  });

  RING_MOTES.forEach(rm=>{
    rm.angle+=rm.speed;
    rm.life-=rm.decay;
    if(rm.life<=0){rm.life=1;rm.decay=rng(0.003,0.007);}
    const rx=CX+Math.cos(rm.angle)*(RING_R+rm.rOff*24);
    const ry=CY+Math.sin(rm.angle)*(RING_R+rm.rOff*24);
    const ra=rm.life*(0.35+0.4*Math.sin(t*2.2+rm.phase));
    c.globalAlpha=ra*0.55;
    c.fillStyle=`hsl(${rm.hue},88%,68%)`;
    c.shadowColor=`hsl(${rm.hue},100%,72%)`; c.shadowBlur=rm.r*4;
    c.beginPath(); c.arc(rx,ry,rm.r,0,Math.PI*2); c.fill();
    c.shadowBlur=0;
  });
  c.globalAlpha=1;
}

function drawPart(dt){
  const c=ctxPart;
  c.clearRect(0,0,W,H);
  MOTES.forEach(m=>{ m.update(dt); m.draw(c); });
  drawRing(c);
}

// ─────────────────────────────────────────────────────────────────────────────
// MAIN LOOP
// ─────────────────────────────────────────────────────────────────────────────
function loop(now){
  const dt=Math.min((now-last)/1000,0.05);
  last=now; t+=dt;

  drawBase();
  drawGround(dt);
  drawRoots(dt);
  drawMoss(dt);
  drawForest(dt);
  drawPart(dt);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
