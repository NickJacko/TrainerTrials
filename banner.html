<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stream Banner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: transparent;
      overflow: hidden;
      width: 100vw; height: 60px;
      display: flex; align-items: center;
    }

    .banner {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 52px;
      background: rgba(4,2,14,0.88);
      border-top: 1px solid rgba(255,255,255,0.08);
      overflow: hidden;
      display: flex; align-items: center;
    }

    /* Grid texture */
    .banner::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(78,205,196,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(78,205,196,0.05) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none; z-index: 0;
    }

    /* Animated top border gradient */
    .banner::after {
      content: '';
      position: absolute; top: 0; left: -100%; right: 0; height: 1px;
      background: linear-gradient(90deg,
        transparent,
        #4ECDC4 20%,
        #FFD700 50%,
        #FF6B6B 80%,
        transparent
      );
      animation: borderSlide 4s linear infinite;
    }
    @keyframes borderSlide { 0%{left:-100%} 100%{left:100%} }

    /* Left badge */
    .banner-badge {
      flex-shrink: 0;
      padding: 0 14px 0 16px;
      font-size: 10px; font-weight: 800; letter-spacing: 2px;
      text-transform: uppercase; color: #4ECDC4; opacity: 0.7;
      border-right: 1px solid rgba(255,255,255,0.07);
      height: 100%; display: flex; align-items: center;
      position: relative; z-index: 1;
      white-space: nowrap;
    }

    /* Live dot */
    .live-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #FF6B6B; box-shadow: 0 0 6px #FF6B6B;
      margin-right: 8px;
      animation: livePulse 1.5s ease-in-out infinite;
    }
    @keyframes livePulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* Scrolling text area */
    .marquee-clip {
      flex: 1; overflow: hidden; height: 100%;
      display: flex; align-items: center;
      position: relative; z-index: 1;
      mask-image: linear-gradient(90deg, transparent, black 4%, black 96%, transparent);
      -webkit-mask-image: linear-gradient(90deg, transparent, black 4%, black 96%, transparent);
    }

    .marquee-inner {
      display: flex; align-items: center;
      white-space: nowrap;
      animation: scroll 32s linear infinite;
    }
    @keyframes scroll { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }

    .msg-block {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 0 60px;
      font-size: 15px; font-weight: 700;
    }
    .msg-block .sep {
      width: 4px; height: 4px; border-radius: 50%;
      background: rgba(255,255,255,0.25); flex-shrink: 0;
    }
    .msg-text {
      background-size: 200% auto;
      background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: msgShine 4s linear infinite;
    }
    .c-teal   { background-image: linear-gradient(90deg,#4ECDC4,#fff8,#4ECDC4); }
    .c-gold   { background-image: linear-gradient(90deg,#FFD700,#fff8,#FFD700); }
    .c-red    { background-image: linear-gradient(90deg,#FF6B6B,#fff8,#FF6B6B); }
    .c-blue   { background-image: linear-gradient(90deg,#64B5F6,#fff8,#64B5F6); }
    .c-purple { background-image: linear-gradient(90deg,#CE93D8,#fff8,#CE93D8); }
    .c-green  { background-image: linear-gradient(90deg,#A5D6A7,#fff8,#A5D6A7); }
    @keyframes msgShine { to { background-position:-200% center; } }
  </style>
</head>
<body>
<div class="banner">
  <div class="banner-badge">
    <div class="live-dot"></div>
    Catchmon Arena
  </div>
  <div class="marquee-clip">
    <div class="marquee-inner" id="marqueeInner"></div>
  </div>
</div>

<script>
  const messages = [
    { text: "🎮 Like the stream to catch Catchmon — more likes = higher chance!", color: "c-teal" },
    { text: "⚡ Send TikTok Gifts to unlock a permanent catch multiplier up to 5×!", color: "c-gold" },
    { text: "🔥 Evolve your team by fusing duplicate Catchmon — power up!", color: "c-red" },
    { text: "💎 Check the leaderboard and your Catchdex at trainertrials.org", color: "c-blue" },
    { text: "🏆 Climb the Elite Catcher Arena and dominate the rankings!", color: "c-purple" },
    { text: "✨ Shiny Catchmon are ultra rare — keep watching to catch one!", color: "c-green" },
  ];

  const inner = document.getElementById('marqueeInner');

  // Build double set for seamless loop
  function buildMarquee(){
    inner.innerHTML='';
    const doubled=[...messages,...messages];
    doubled.forEach(m=>{
      const block=document.createElement('div');
      block.className='msg-block';
      block.innerHTML=`
        <div class="sep"></div>
        <span class="msg-text ${m.color}">${m.text}</span>
      `;
      inner.appendChild(block);
    });
  }
  buildMarquee();
</script>
</body>
</html>
