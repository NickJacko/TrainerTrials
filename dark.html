<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Dark — Verfallenes Schloss</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#02000a;}
canvas{position:absolute;inset:0;width:1080px;height:1920px;display:block;}
.bg{position:absolute;inset:0;background:
  radial-gradient(ellipse 60% 40% at 50% 25%, #1a0030 0%, #0a0018 40%, transparent 70%),
  linear-gradient(180deg, #02000a 0%, #05000f 40%, #02000a 100%);}
/* Moon with clouds */
.moon{position:absolute;top:200px;left:50%;transform:translateX(-50%);width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%, #e8e0ff 0%, #b8a8e0 50%, #6a5a90 100%);
  box-shadow:0 0 80px rgba(180,160,220,0.35),0 0 160px rgba(120,80,200,0.25);}
.moon-cloud{position:absolute;top:220px;width:400px;height:40px;background:linear-gradient(90deg,transparent 0%,#0a0018 20%,#0a0018 80%,transparent 100%);border-radius:50%;filter:blur(6px);animation:mc 25s linear infinite;}
.mc1{left:-400px;animation-duration:30s;}
.mc2{top:280px;left:-600px;height:25px;width:500px;animation-duration:35s;animation-delay:-10s;}
@keyframes mc{from{transform:translateX(0)}to{transform:translateX(1500px)}}

/* Castle silhouette */
.castle{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:1080px;height:700px;pointer-events:none;}
.tower{position:absolute;bottom:0;background:#010008;}
.t1{left:10%;width:80px;height:500px;clip-path:polygon(0 100%, 0 15%, 50% 0, 100% 15%, 100% 100%);}
.t2{left:22%;width:110px;height:600px;clip-path:polygon(0 100%, 0 10%, 50% 0, 100% 10%, 100% 100%);}
.t3{left:36%;width:70px;height:420px;clip-path:polygon(0 100%, 0 25%, 30% 18%, 30% 8%, 70% 8%, 70% 18%, 100% 25%, 100% 100%);}
.t4{right:34%;width:140px;height:550px;clip-path:polygon(0 100%, 0 12%, 50% 0, 100% 12%, 100% 100%);}
.t5{right:20%;width:90px;height:480px;clip-path:polygon(0 100%, 0 18%, 20% 10%, 20% 0, 80% 0, 80% 10%, 100% 18%, 100% 100%);}
.t6{right:8%;width:100px;height:620px;clip-path:polygon(0 100%, 0 10%, 50% 0, 100% 10%, 100% 100%);}
.wall{position:absolute;bottom:0;left:8%;right:6%;height:300px;background:#010008;clip-path:polygon(0 100%, 0 30%, 5% 35%, 5% 20%, 10% 20%, 10% 35%, 15% 30%, 20% 35%, 20% 20%, 25% 20%, 25% 35%, 30% 30%, 35% 35%, 35% 15%, 40% 15%, 40% 35%, 45% 30%, 50% 35%, 55% 35%, 55% 18%, 60% 18%, 60% 35%, 65% 30%, 70% 35%, 75% 35%, 75% 20%, 80% 20%, 80% 35%, 85% 30%, 90% 35%, 95% 35%, 100% 30%, 100% 100%);}
/* Windows glowing */
.window{position:absolute;width:8px;height:14px;background:#6600cc;box-shadow:0 0 15px #6600cc;border-radius:2px 2px 0 0;}
.w1{bottom:400px;left:26%;}.w2{bottom:350px;left:38%;}.w3{bottom:480px;right:37%;}.w4{bottom:400px;right:25%;}

.zone-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(0,0,0,0.55) 0%,transparent 100%);z-index:40;}
.zone-bot{position:absolute;bottom:0;left:0;right:0;height:920px;background:linear-gradient(0deg,rgba(0,0,0,0.55) 0%,rgba(0,0,0,0.12) 40%,transparent 100%);z-index:40;}
.center-darken{position:absolute;top:300px;left:50%;transform:translateX(-50%);width:780px;height:540px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(0,0,5,0.4) 0%,transparent 70%);z-index:38;}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 40%,rgba(0,0,0,0.7) 100%);z-index:39;pointer-events:none;}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="stars"></canvas>
<div class="moon"></div>
<div class="moon-cloud mc1"></div>
<div class="moon-cloud mc2"></div>
<canvas id="fog"></canvas>
<div class="castle">
  <div class="tower t1"></div><div class="tower t2"></div><div class="tower t3"></div>
  <div class="tower t4"></div><div class="tower t5"></div><div class="tower t6"></div>
  <div class="wall"></div>
  <div class="window w1"></div><div class="window w2"></div><div class="window w3"></div><div class="window w4"></div>
</div>
<canvas id="ravens"></canvas>
<canvas id="magic"></canvas>
<div class="center-darken"></div>
<div class="vignette"></div>
<div class="zone-top"></div>
<div class="zone-bot"></div>
<script>
const W=1080,H=1920;
function setup(id){const c=document.getElementById(id);c.width=W;c.height=H;return c.getContext('2d');}

const st=setup('stars');
const stars=[];
for(let i=0;i<100;i++)stars.push({x:Math.random()*W,y:Math.random()*1000,r:Math.random()*1.2+0.2,tw:Math.random()*Math.PI*2});

const fg=setup('fog');
const fogs=[];
for(let i=0;i<25;i++)fogs.push({x:Math.random()*W,y:1200+Math.random()*600,r:150+Math.random()*200,vx:(Math.random()-0.5)*0.25,a:0.1+Math.random()*0.15});

const rv=setup('ravens');
const ravens=[];
for(let i=0;i<4;i++)ravens.push({x:Math.random()*W,y:300+Math.random()*600,vx:(Math.random()<0.5?1:-1)*(1.2+Math.random()*0.6),flap:Math.random()*Math.PI*2,flapSp:0.25,sz:10+Math.random()*6,bob:Math.random()*Math.PI*2});

const mg=setup('magic');
const parts=[];
for(let i=0;i<45;i++)parts.push({cx:W/2+(Math.random()-0.5)*400,cy:H/2+(Math.random()-0.5)*400,r:80+Math.random()*150,a:Math.random()*Math.PI*2,sp:0.01+Math.random()*0.015,sz:1+Math.random()*2,hue:270+Math.random()*40});

let t=0;
function loop(){
  t+=0.016;
  st.clearRect(0,0,W,H);
  for(const s of stars){s.tw+=0.03;const a=0.3+Math.sin(s.tw)*0.4;st.fillStyle=`rgba(220,210,255,${a})`;st.beginPath();st.arc(s.x,s.y,s.r,0,Math.PI*2);st.fill();}
  fg.clearRect(0,0,W,H);fg.globalCompositeOperation='screen';
  for(const f of fogs){f.x+=f.vx;if(f.x<-200)f.x=W+200;if(f.x>W+200)f.x=-200;
    const g=fg.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
    g.addColorStop(0,`rgba(60,30,90,${f.a})`);g.addColorStop(1,'rgba(60,30,90,0)');
    fg.fillStyle=g;fg.beginPath();fg.arc(f.x,f.y,f.r,0,Math.PI*2);fg.fill();}
  fg.globalCompositeOperation='source-over';
  rv.clearRect(0,0,W,H);
  for(const r of ravens){
    r.flap+=r.flapSp;r.bob+=0.02;r.x+=r.vx;r.y+=Math.sin(r.bob)*0.5;
    if(r.x<-40)r.x=W+40;if(r.x>W+40)r.x=-40;
    const fl=Math.sin(r.flap)*0.6;
    rv.fillStyle='#000';rv.save();rv.translate(r.x,r.y);rv.scale(r.vx>0?1:-1,1);
    rv.beginPath();rv.moveTo(0,0);rv.lineTo(-r.sz,-r.sz*0.3-fl*r.sz*0.5);rv.lineTo(-r.sz*0.5,0);
    rv.lineTo(-r.sz,r.sz*0.3+fl*r.sz*0.5);rv.closePath();rv.fill();
    rv.beginPath();rv.moveTo(0,0);rv.lineTo(r.sz,-r.sz*0.3-fl*r.sz*0.5);rv.lineTo(r.sz*0.5,0);
    rv.lineTo(r.sz,r.sz*0.3+fl*r.sz*0.5);rv.closePath();rv.fill();
    rv.beginPath();rv.ellipse(0,0,r.sz*0.3,r.sz*0.15,0,0,Math.PI*2);rv.fill();
    rv.restore();
  }
  mg.clearRect(0,0,W,H);
  for(const p of parts){
    p.a+=p.sp;
    const x=p.cx+Math.cos(p.a)*p.r;
    const y=p.cy+Math.sin(p.a)*p.r*0.7;
    mg.fillStyle=`hsla(${p.hue},100%,60%,0.6)`;mg.shadowBlur=12;mg.shadowColor=`hsl(${p.hue},100%,60%)`;
    mg.beginPath();mg.arc(x,y,p.sz,0,Math.PI*2);mg.fill();
  }
  mg.shadowBlur=0;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
