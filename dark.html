<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Dark — Verfallenes Schloss</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:1080px;height:1920px;overflow:hidden;
    background:radial-gradient(ellipse 100% 80% at 50% 20%, #0e0025 0%, #06000f 50%, #01000a 100%);
  }
  canvas{position:absolute;inset:0;width:1080px;height:1920px;display:block;}

  /* Blood moon */
  .moon{
    position:absolute;top:82px;left:630px;
    width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle at 38% 32%,
      #ffcc66 0%, #ff8822 28%, #cc3300 58%, #881100 80%, #440800 100%);
    box-shadow:0 0 60px rgba(200,50,0,0.5), 0 0 120px rgba(150,30,0,0.3), 0 0 200px rgba(100,20,0,0.2);
    animation:moonPulse 7s ease-in-out infinite;
    z-index:2;
  }
  .moon-crater{position:absolute;border-radius:50%;background:rgba(0,0,0,0.25);}
  .mc1{width:28px;height:24px;top:35%;left:28%;}
  .mc2{width:18px;height:16px;top:55%;left:58%;}
  .mc3{width:12px;height:11px;top:25%;left:62%;}
  .mc4{width:22px;height:18px;top:48%;left:22%;}
  @keyframes moonPulse{0%,100%{box-shadow:0 0 60px rgba(200,50,0,0.5),0 0 120px rgba(150,30,0,0.3)}50%{box-shadow:0 0 80px rgba(220,60,0,0.65),0 0 160px rgba(170,40,0,0.4),0 0 240px rgba(120,25,0,0.25)}}

  /* Scene candle-flicker overlay */
  .flicker{
    position:absolute;inset:0;
    background:radial-gradient(ellipse 60% 50% at 52% 65%, rgba(60,0,80,0.08) 0%, transparent 60%);
    mix-blend-mode:screen;
    animation:sceneFlicker 4s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes sceneFlicker{0%,100%{opacity:0.6}22%{opacity:1}45%{opacity:0.7}68%{opacity:0.95}85%{opacity:0.5}}

  /* Castle silhouette — CSS drawn */
  .castle{position:absolute;bottom:0;left:0;right:0;height:820px;pointer-events:none;}

  /* Main keep */
  .keep{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:340px;height:520px;background:#030008;
    clip-path:polygon(0 100%,0 20%,8% 18%,8% 0,22% 0,22% 14%,35% 14%,35% 0,50% 0,50% 14%,65% 14%,65% 0,78% 0,78% 18%,92% 18%,100% 20%,100% 100%);
  }
  /* Towers */
  .tower{position:absolute;bottom:0;background:#020007;}
  .tl1{left:50px; width:110px;height:680px;clip-path:polygon(0 100%,0 18%,15% 10%,15% 0,30% 0,30% 10%,50% 6%,70% 10%,70% 0,85% 0,85% 10%,100% 18%,100% 100%);}
  .tl2{left:175px;width:80px; height:560px;clip-path:polygon(0 100%,0 22%,20% 12%,20% 0,45% 0,45% 12%,80% 12%,80% 0,100% 22%,100% 100%);}
  .tr1{right:50px; width:110px;height:660px;clip-path:polygon(0 100%,0 18%,15% 10%,15% 0,30% 0,30% 10%,50% 6%,70% 10%,70% 0,85% 0,85% 10%,100% 18%,100% 100%);}
  .tr2{right:175px;width:80px; height:540px;clip-path:polygon(0 100%,0 22%,20% 12%,20% 0,45% 0,45% 12%,80% 12%,80% 0,100% 22%,100% 100%);}
  /* Wall connecting towers */
  .wall{position:absolute;bottom:0;background:#020007;}
  .wl{left:50px;right:calc(100% - 290px);height:320px;clip-path:polygon(0 100%,0 25%,10% 20%,10% 0,20% 0,20% 20%,30% 15%,40% 20%,50% 15%,60% 20%,70% 15%,80% 20%,90% 15%,100% 20%,100% 100%);}
  .wr{right:50px;left:calc(100% - 290px);height:300px;clip-path:polygon(0 100%,0 20%,10% 15%,20% 20%,30% 15%,40% 20%,50% 15%,60% 20%,70% 15%,80% 20%,90% 20%,90% 0,100% 0,100% 25%,100% 100%);}

  /* Glowing windows */
  .win{position:absolute;border-radius:3px 3px 50% 50% / 3px 3px 100% 100%;mix-blend-mode:screen;}
  .w1{bottom:390px;left:calc(50% - 130px);width:16px;height:24px;background:#6600cc;box-shadow:0 0 18px #6600cc,0 0 40px rgba(102,0,204,0.5);animation:winFlicker 5s ease-in-out infinite;}
  .w2{bottom:340px;left:calc(50% - 80px); width:12px;height:20px;background:#7700dd;box-shadow:0 0 14px #7700dd;animation:winFlicker 7s ease-in-out infinite reverse;animation-delay:-2s;}
  .w3{bottom:360px;left:calc(50% + 50px); width:14px;height:22px;background:#5500bb;box-shadow:0 0 16px #5500bb;animation:winFlicker 6s ease-in-out infinite;animation-delay:-1.5s;}
  .w4{bottom:440px;left:100px;width:10px;height:16px;background:#6600cc;box-shadow:0 0 12px #6600cc;animation:winFlicker 8s ease-in-out infinite reverse;}
  .w5{bottom:480px;right:95px;width:10px;height:16px;background:#7700dd;box-shadow:0 0 12px #7700dd;animation:winFlicker 4.5s ease-in-out infinite;animation-delay:-3s;}
  .w6{bottom:510px;right:220px;width:8px;height:14px;background:#5500bb;box-shadow:0 0 10px #5500bb;animation:winFlicker 6.5s ease-in-out infinite reverse;animation-delay:-0.8s;}
  @keyframes winFlicker{0%,100%{opacity:1}30%{opacity:0.4}50%{opacity:0.9}70%{opacity:0.2}90%{opacity:0.8}}

  /* Crow nests on towers */
  .nest{position:absolute;width:14px;height:5px;background:#010005;border-radius:50%;}
  .nest1{bottom:680px;left:93px;} .nest2{bottom:660px;right:88px;} .nest3{bottom:560px;left:205px;}

  /* Ground fog */
  .fog{
    position:absolute;bottom:0;left:0;right:0;height:380px;
    background:
      radial-gradient(ellipse 100% 45% at 50% 100%, rgba(30,0,50,0.6) 0%, transparent 65%),
      radial-gradient(ellipse 70% 30% at 20% 100%, rgba(20,0,35,0.4) 0%, transparent 55%),
      radial-gradient(ellipse 60% 28% at 85% 100%, rgba(25,0,45,0.35) 0%, transparent 50%);
    filter:blur(14px);mix-blend-mode:screen;
    animation:fogDrift 15s ease-in-out infinite alternate;
  }
  @keyframes fogDrift{0%{transform:translateX(0)}100%{transform:translateX(18px)}}

  /* Dark energy ring glow */
  .ring-dark{
    position:absolute;top:205px;left:50%;transform:translateX(-50%);
    width:820px;height:820px;border-radius:50%;
    background:radial-gradient(ellipse 100% 100% at 50% 50%,
      rgba(80,0,120,0.1) 0%, rgba(60,0,100,0.05) 50%, transparent 70%);
    mix-blend-mode:screen;filter:blur(20px);
    animation:darkPulse 6s ease-in-out infinite;
  }
  @keyframes darkPulse{0%,100%{opacity:0.6;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.02)}}

  /* UI zones */
  .center-darken{position:absolute;top:300px;left:50%;transform:translateX(-50%);width:780px;height:540px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(4,0,10,0.45) 0%,transparent 70%);z-index:38;}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 38%,rgba(0,0,6,0.78) 100%);z-index:39;pointer-events:none;}
  .zone-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(0,0,0,0.6) 0%,transparent 100%);z-index:40;}
  .zone-bot{position:absolute;bottom:0;left:0;right:0;height:920px;background:linear-gradient(0deg,rgba(0,0,6,0.68) 0%,rgba(0,0,6,0.16) 40%,transparent 100%);z-index:40;}
</style>
</head>
<body>
  <!-- Moon -->
  <div class="moon">
    <div class="moon-crater mc1"></div><div class="moon-crater mc2"></div>
    <div class="moon-crater mc3"></div><div class="moon-crater mc4"></div>
  </div>

  <!-- Castle -->
  <div class="castle">
    <div class="tower tl1"></div><div class="tower tl2"></div>
    <div class="tower tr1"></div><div class="tower tr2"></div>
    <div class="wall wl"></div><div class="wall wr"></div>
    <div class="keep"></div>
    <div class="nest nest1"></div><div class="nest nest2"></div><div class="nest nest3"></div>
    <div class="win w1"></div><div class="win w2"></div><div class="win w3"></div>
    <div class="win w4"></div><div class="win w5"></div><div class="win w6"></div>
  </div>

  <!-- Canvas stack: clouds → ring → ravens → particles -->
  <canvas id="cClouds"></canvas>
  <canvas id="cRing"></canvas>
  <canvas id="cRavens"></canvas>
  <canvas id="cParticles"></canvas>

  <div class="fog"></div>
  <div class="ring-dark"></div>
  <div class="flicker"></div>
  <div class="center-darken"></div>
  <div class="vignette"></div>
  <div class="zone-top"></div>
  <div class="zone-bot"></div>

<script>
const W=1080, H=1920;
const RING_CX=540, RING_CY=590, RING_R=300;
const MOON_X=730, MOON_Y=182; // Moon center

function mkCanvas(id){
  const c=document.getElementById(id);
  c.width=W; c.height=H;
  return c.getContext('2d');
}
const cloudsCtx = mkCanvas('cClouds');
const ringCtx   = mkCanvas('cRing');
const ravensCtx = mkCanvas('cRavens');
const partCtx   = mkCanvas('cParticles');

/* ═══════════════════════════════════════════════════════════════════════════
   STORM CLOUDS — passing over the moon
   ═══════════════════════════════════════════════════════════════════════════ */
const clouds=[];
for(let i=0;i<12;i++){
  clouds.push({
    x: Math.random()*W*1.6-W*0.3,
    y: 60+Math.random()*280,
    rx: 120+Math.random()*200,
    ry: 50+Math.random()*80,
    vx: 0.12+Math.random()*0.22,
    a: 0.55+Math.random()*0.35,
    dark: Math.random()<0.6,
    phase: Math.random()*Math.PI*2,
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   RING — Rune orbit + tendrils + dark fog + energy waves
   ═══════════════════════════════════════════════════════════════════════════ */
// Rune shapes — unique dark magic symbols
const RUNE_COUNT=10;
const runeOrbit=[];
for(let i=0;i<RUNE_COUNT;i++){
  runeOrbit.push({
    angle:(i/RUNE_COUNT)*Math.PI*2,
    speed:0.007+Math.random()*0.004*(Math.random()<0.5?1:-1),
    phase:Math.random()*Math.PI*2,
    glowSp:0.03+Math.random()*0.05,
    type:i%5, // 5 rune types
    size:10+Math.random()*8,
  });
}

function drawRune(ctx,x,y,type,size,hue,a){
  ctx.save(); ctx.translate(x,y);
  ctx.strokeStyle=`hsla(${hue},100%,65%,${a})`;
  ctx.lineWidth=1.5; ctx.shadowBlur=12; ctx.shadowColor=`hsla(${hue},100%,60%,0.8)`;
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  if(type===0){ // Bindrune: two overlapping triangles (Star of magic)
    for(let i=0;i<3;i++){const a=(i/3)*Math.PI*2-Math.PI/2;const x2=Math.cos(a)*size,y2=Math.sin(a)*size;i?ctx.lineTo(x2,y2):ctx.moveTo(x2,y2);}ctx.closePath();
    ctx.moveTo(0,-size*0.6);ctx.lineTo(size*0.5,size*0.3);ctx.lineTo(-size*0.5,size*0.3);ctx.closePath();
  } else if(type===1){ // Eye of darkness
    ctx.arc(0,0,size*0.85,0,Math.PI*2);
    ctx.moveTo(0,-size*1.3);ctx.lineTo(0,size*1.3);
    ctx.moveTo(-size,0);ctx.lineTo(size,0);
    ctx.moveTo(-size*0.7,-size*0.7);ctx.lineTo(size*0.7,size*0.7);
    ctx.moveTo(size*0.7,-size*0.7);ctx.lineTo(-size*0.7,size*0.7);
  } else if(type===2){ // Sigil: nested angular forms
    ctx.moveTo(-size,-size*0.5);ctx.lineTo(0,-size*1.2);ctx.lineTo(size,-size*0.5);
    ctx.moveTo(size,-size*0.5);ctx.lineTo(size,size*0.5);ctx.lineTo(0,size*1.2);ctx.lineTo(-size,size*0.5);ctx.lineTo(-size,-size*0.5);
    ctx.moveTo(0,-size*0.5);ctx.lineTo(size*0.5,size*0.2);ctx.lineTo(-size*0.5,size*0.2);ctx.closePath();
  } else if(type===3){ // Spiral rune
    for(let j=0;j<40;j++){const a=j*0.3;const r=j*size*0.04;const x2=Math.cos(a)*r,y2=Math.sin(a)*r;j?ctx.lineTo(x2,y2):ctx.moveTo(x2,y2);}
    ctx.moveTo(0,-size);ctx.lineTo(size*0.6,size*0.8);ctx.lineTo(-size*0.6,size*0.8);ctx.closePath();
  } else { // Crescent with cross
    ctx.arc(0,0,size,Math.PI*0.15,Math.PI*1.85);
    ctx.moveTo(-size*0.5,-size*0.5);ctx.lineTo(size*0.5,size*0.5);
    ctx.moveTo(size*0.5,-size*0.5);ctx.lineTo(-size*0.5,size*0.5);
    ctx.arc(-size*0.2,0,size*0.4,0,Math.PI*2);
  }
  ctx.stroke();
  ctx.restore();
}

// Energy tendrils — bezier tentacles from ground up to ring
const TENDRIL_COUNT=6;
const tendrils=[];
for(let i=0;i<TENDRIL_COUNT;i++){
  const startAng=-Math.PI/2+(i/(TENDRIL_COUNT-1)-0.5)*Math.PI*0.8;
  tendrils.push({
    startAng,
    phase:Math.random()*Math.PI*2,
    speed:0.02+Math.random()*0.015,
    sway:Math.random()*Math.PI*2,
    swaySp:0.015+Math.random()*0.02,
    hue:270+Math.random()*40,
    thickness:2+Math.random()*2,
  });
}

// Dark energy pulse waves
let pulseWaves=[];
let pulseTimer=0;

/* ═══════════════════════════════════════════════════════════════════════════
   RAVENS
   ═══════════════════════════════════════════════════════════════════════════ */
const ravens=[];
for(let i=0;i<7;i++){
  const type=i<4?'circling':'perched';
  ravens.push({
    x:type==='perched'?[110,820,220][i-4]:Math.random()*W,
    y:type==='perched'?[680,660,560][i-4]:150+Math.random()*400,
    vx:type==='circling'?(Math.random()<0.5?1:-1)*(1+Math.random()*0.8):0,
    vy:type==='circling'?(Math.random()-0.5)*0.5:0,
    flap:Math.random()*Math.PI*2,
    flapSp:0.18+Math.random()*0.1,
    size:8+Math.random()*8,
    type,
    orbitAng:Math.random()*Math.PI*2,
    orbitR:200+Math.random()*250,
    orbitSp:(Math.random()<0.5?1:-1)*(0.006+Math.random()*0.006),
    bobPhase:Math.random()*Math.PI*2,
    perchTimer:type==='perched'?0:0,
    perchDur:type==='perched'?2+Math.random()*5:0,
  });
}

function drawRaven(ctx, rv, t){
  ctx.save();
  ctx.translate(rv.x, rv.y);
  const flip=rv.vx<0?-1:rv.vx>0?1:(rv.orbitSp<0?-1:1);
  ctx.scale(flip,1);
  const flap=Math.cos(rv.flap)*0.7; // -0.7 to 0.7

  const s=rv.size;
  ctx.fillStyle='rgba(5,2,10,0.95)';
  ctx.shadowBlur=8; ctx.shadowColor='rgba(80,0,100,0.5)';

  // Body
  ctx.beginPath();
  ctx.ellipse(0,0,s*0.55,s*0.32,0.15,0,Math.PI*2);
  ctx.fill();
  // Head
  ctx.beginPath();
  ctx.ellipse(s*0.42,-s*0.12,s*0.22,s*0.18,-0.2,0,Math.PI*2);
  ctx.fill();
  // Beak
  ctx.fillStyle='rgba(20,8,30,0.9)';
  ctx.beginPath();
  ctx.moveTo(s*0.62,-s*0.08);ctx.lineTo(s*0.84,-s*0.12);ctx.lineTo(s*0.62,-s*0.2);
  ctx.fill();
  // Left wing
  ctx.fillStyle='rgba(5,2,10,0.9)';
  ctx.beginPath();
  ctx.moveTo(-s*0.1,0);
  ctx.bezierCurveTo(-s*0.2,-(s*0.5+flap*s*0.6),-s*0.7,-(s*0.5+flap*s*0.5),-s*0.9,-s*0.1+flap*s*0.15);
  ctx.bezierCurveTo(-s*0.7,s*0.2,-s*0.35,s*0.18,-s*0.1,s*0.12);
  ctx.fill();
  // Right wing
  ctx.beginPath();
  ctx.moveTo(s*0.15,0);
  ctx.bezierCurveTo(s*0.25,-(s*0.4+flap*s*0.55),s*0.7,-(s*0.4+flap*s*0.45),s*0.85,s*0.05+flap*s*0.1);
  ctx.bezierCurveTo(s*0.65,s*0.15,s*0.35,s*0.12,s*0.15,s*0.1);
  ctx.fill();
  // Tail
  ctx.beginPath();
  ctx.moveTo(-s*0.45,s*0.1);
  ctx.lineTo(-s*0.75,s*0.35);ctx.lineTo(-s*0.55,s*0.4);ctx.lineTo(-s*0.65,s*0.45);ctx.lineTo(-s*0.45,s*0.38);
  ctx.fill();
  ctx.shadowBlur=0;
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════════════════
   PARTICLES: Spores, Fog tatters, Tower sparks
   ═══════════════════════════════════════════════════════════════════════════ */
const spores=[];
for(let i=0;i<60;i++){
  spores.push({
    x: 80+Math.random()*920,
    y: H-200+Math.random()*150,
    vy:-(0.3+Math.random()*0.9),
    vx:(Math.random()-0.5)*0.4,
    phase:Math.random()*Math.PI*2,
    sp:0.025+Math.random()*0.04,
    r:1+Math.random()*2.5,
    hue:270+Math.random()*40,
    a:0.4+Math.random()*0.4,
    life:Math.random(),
  });
}

const fogTatters=[];
for(let i=0;i<20;i++){
  fogTatters.push({
    x:Math.random()*W, y:H-100-Math.random()*250,
    rx:60+Math.random()*120, ry:18+Math.random()*30,
    vx:0.2+Math.random()*0.4*(Math.random()<0.5?1:-1),
    phase:Math.random()*Math.PI*2,
    sp:0.006+Math.random()*0.01,
    a:0.08+Math.random()*0.12,
  });
}

// Tower spark emitters (top of each main tower)
const towerTops=[{x:105,y:240},{x:918,y:260},{x:218,y:380},{x:862,y:370}];
const towerSparks=[];
let sparkTimer=0;

/* ═══════════════════════════════════════════════════════════════════════════
   MAIN LOOP
   ═══════════════════════════════════════════════════════════════════════════ */
let t=0;

function loop(){
  t+=0.016;

  /* ── CLOUDS ── */
  cloudsCtx.clearRect(0,0,W,H);
  for(const c of clouds){
    c.x+=c.vx;
    if(c.x>W+350) c.x=-350;
    c.phase+=0.004;
    const pulse=0.85+Math.sin(c.phase)*0.15;
    const col=c.dark?`rgba(12,4,20,${c.a*pulse})`:`rgba(22,8,38,${c.a*pulse*0.7})`;
    const g=cloudsCtx.createRadialGradient(c.x,c.y,0,c.x,c.y,c.rx);
    g.addColorStop(0,col);
    g.addColorStop(0.5,c.dark?`rgba(8,2,14,${c.a*pulse*0.65})`:`rgba(14,4,24,${c.a*pulse*0.4})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    cloudsCtx.save();
    cloudsCtx.scale(1,c.ry/c.rx);
    cloudsCtx.fillStyle=g;
    cloudsCtx.beginPath();
    cloudsCtx.arc(c.x,c.y*(c.rx/c.ry),c.rx,0,Math.PI*2);
    cloudsCtx.fill();
    cloudsCtx.restore();
  }

  /* ── RING ── */
  ringCtx.clearRect(0,0,W,H);

  // Pulse wave emissions
  pulseTimer+=0.016;
  if(pulseTimer>3+Math.random()*4){
    pulseTimer=0;
    pulseWaves.push({r:RING_R,maxR:RING_R+280,life:1,decay:0.018,hue:280+Math.random()*30});
  }
  // Draw + update waves
  for(let i=pulseWaves.length-1;i>=0;i--){
    const pw=pulseWaves[i];
    pw.r+=1.8; pw.life-=pw.decay;
    if(pw.life<=0){pulseWaves.splice(i,1);continue;}
    ringCtx.strokeStyle=`hsla(${pw.hue},100%,55%,${pw.life*0.3})`;
    ringCtx.lineWidth=1.5;
    ringCtx.shadowBlur=10; ringCtx.shadowColor=`hsla(${pw.hue},100%,55%,0.5)`;
    ringCtx.beginPath(); ringCtx.arc(RING_CX,RING_CY,pw.r,0,Math.PI*2); ringCtx.stroke();
    ringCtx.shadowBlur=0;
  }

  // Ambient ring glow
  const rGlow=0.5+Math.sin(t*1.8)*0.3;
  const rg=ringCtx.createRadialGradient(RING_CX,RING_CY,RING_R-15,RING_CX,RING_CY,RING_R+200);
  rg.addColorStop(0,`rgba(100,0,160,${0.18*rGlow})`);
  rg.addColorStop(0.4,`rgba(70,0,120,${0.08*rGlow})`);
  rg.addColorStop(1,'rgba(0,0,0,0)');
  ringCtx.fillStyle=rg; ringCtx.beginPath(); ringCtx.arc(RING_CX,RING_CY,RING_R+200,0,Math.PI*2); ringCtx.fill();

  // Dark fog ring
  for(let fi=0;fi<12;fi++){
    const fa=(fi/12)*Math.PI*2+t*0.15;
    const fr=RING_R*0.6+Math.sin(fa*2.3+t*0.8)*RING_R*0.3;
    const fx=RING_CX+Math.cos(fa)*fr;
    const fy=RING_CY+Math.sin(fa)*fr;
    const fg=ringCtx.createRadialGradient(fx,fy,0,fx,fy,40);
    fg.addColorStop(0,`rgba(40,0,80,${0.12+Math.sin(fa*3+t)*0.06})`);
    fg.addColorStop(1,'rgba(0,0,0,0)');
    ringCtx.fillStyle=fg;
    ringCtx.beginPath(); ringCtx.arc(fx,fy,40,0,Math.PI*2); ringCtx.fill();
  }

  // Tendrils
  for(const td of tendrils){
    td.phase+=td.speed; td.sway+=td.swaySp;
    const startX=RING_CX+Math.cos(td.startAng)*(RING_R+20);
    const startY=RING_CY+Math.sin(td.startAng)*(RING_R+20);
    // Tendril grows down from ring toward the castle
    const endX=startX+Math.sin(td.sway)*60+(td.startAng<0?-1:1)*40;
    const endY=Math.min(startY+300+Math.sin(td.phase)*80, H-300);
    const cp1x=startX+Math.sin(td.sway+1)*80;
    const cp1y=startY+80+Math.sin(td.phase)*40;
    const cp2x=endX-Math.cos(td.sway)*60;
    const cp2y=endY-80+Math.sin(td.phase*1.3)*30;
    const alpha=0.35+Math.sin(td.phase)*0.25;
    ringCtx.save();
    ringCtx.strokeStyle=`hsla(${td.hue},100%,55%,${alpha})`;
    ringCtx.lineWidth=td.thickness+Math.sin(td.phase)*0.8;
    ringCtx.shadowBlur=14; ringCtx.shadowColor=`hsla(${td.hue},100%,55%,0.7)`;
    ringCtx.lineCap='round';
    ringCtx.beginPath();
    ringCtx.moveTo(startX,startY);
    ringCtx.bezierCurveTo(cp1x,cp1y,cp2x,cp2y,endX,endY);
    ringCtx.stroke();
    // Thinner bright core
    ringCtx.strokeStyle=`hsla(${td.hue+20},100%,80%,${alpha*0.6})`;
    ringCtx.lineWidth=td.thickness*0.3; ringCtx.shadowBlur=0;
    ringCtx.stroke();
    ringCtx.restore();
  }

  // Rune orbit
  for(const r of runeOrbit){
    r.angle+=r.speed; r.phase+=r.glowSp;
    const pulse=0.45+Math.sin(r.phase)*0.45;
    const rx=RING_CX+Math.cos(r.angle)*(RING_R+62);
    const ry=RING_CY+Math.sin(r.angle)*(RING_R+62);
    const hue=270+Math.sin(r.phase*0.7)*40;
    drawRune(ringCtx,rx,ry,r.type,r.size,hue,pulse);
  }
  ringCtx.shadowBlur=0;

  /* ── RAVENS ── */
  ravensCtx.clearRect(0,0,W,H);
  for(const rv of ravens){
    rv.flap+=rv.flapSp;
    if(rv.type==='circling'){
      rv.orbitAng+=rv.orbitSp;
      rv.bobPhase+=0.02;
      // Slow irregular orbit around upper area
      const orbitCX=400+Math.sin(t*0.12)*120;
      const orbitCY=300+Math.cos(t*0.09)*80;
      rv.x=orbitCX+Math.cos(rv.orbitAng)*rv.orbitR;
      rv.y=orbitCY+Math.sin(rv.orbitAng)*rv.orbitR*0.45+Math.sin(rv.bobPhase)*12;
      rv.vx=rv.orbitSp>0?1:-1;
    } else {
      // Perched — occasional hop
      rv.bobPhase+=0.015;
      rv.y+=Math.sin(rv.bobPhase*0.3)*0.08;
    }
    drawRaven(ravensCtx,rv,t);
  }

  /* ── PARTICLES ── */
  partCtx.clearRect(0,0,W,H);

  // Spores
  partCtx.save();
  for(let i=0;i<spores.length;i++){
    const s=spores[i];
    s.phase+=s.sp; s.life+=0.008;
    s.x+=s.vx+Math.sin(s.phase)*0.3; s.y+=s.vy;
    if(s.life>1||s.y<-30){
      spores[i]={x:80+Math.random()*920,y:H-150+Math.random()*100,vy:-(0.3+Math.random()*0.9),vx:(Math.random()-0.5)*0.4,phase:Math.random()*Math.PI*2,sp:0.025+Math.random()*0.04,r:1+Math.random()*2.5,hue:270+Math.random()*40,a:0.4+Math.random()*0.4,life:0};
      continue;
    }
    const fa=(1-s.life)*s.a;
    partCtx.shadowBlur=6; partCtx.shadowColor=`hsla(${s.hue},100%,60%,0.7)`;
    partCtx.fillStyle=`hsla(${s.hue},100%,65%,${fa*(0.4+Math.abs(Math.sin(s.phase))*0.6)})`;
    partCtx.beginPath(); partCtx.arc(s.x,s.y,s.r,0,Math.PI*2); partCtx.fill();
  }
  partCtx.shadowBlur=0; partCtx.restore();

  // Fog tatters
  for(const ft of fogTatters){
    ft.x+=ft.vx; ft.phase+=ft.sp;
    if(ft.x>W+200) ft.x=-200;
    if(ft.x<-200) ft.x=W+200;
    const pulse=0.6+Math.sin(ft.phase)*0.4;
    const fg=partCtx.createRadialGradient(ft.x,ft.y,0,ft.x,ft.y,ft.rx);
    fg.addColorStop(0,`rgba(30,0,55,${ft.a*pulse})`);
    fg.addColorStop(0.5,`rgba(18,0,35,${ft.a*pulse*0.5})`);
    fg.addColorStop(1,'rgba(0,0,0,0)');
    partCtx.save();
    partCtx.scale(1,ft.ry/ft.rx);
    partCtx.fillStyle=fg;
    partCtx.beginPath(); partCtx.arc(ft.x,ft.y*(ft.rx/ft.ry),ft.rx,0,Math.PI*2); partCtx.fill();
    partCtx.restore();
  }

  // Tower sparks
  sparkTimer+=0.016;
  if(sparkTimer>0.12+Math.random()*0.2){
    sparkTimer=0;
    const tower=towerTops[Math.floor(Math.random()*towerTops.length)];
    for(let i=0;i<3;i++){
      towerSparks.push({
        x:tower.x+(Math.random()-0.5)*20,
        y:tower.y,
        vx:(Math.random()-0.5)*1.5,
        vy:0.5+Math.random()*1.5,
        life:1, decay:0.025+Math.random()*0.03,
        r:0.8+Math.random()*1.5,
        hue:Math.random()<0.6?280+Math.random()*30:40+Math.random()*20,
      });
    }
  }
  for(let i=towerSparks.length-1;i>=0;i--){
    const s=towerSparks[i];
    s.x+=s.vx; s.y+=s.vy; s.vy+=0.06; s.life-=s.decay;
    if(s.life<=0){towerSparks.splice(i,1);continue;}
    partCtx.fillStyle=`hsla(${s.hue},100%,${s.hue>200?65:80}%,${s.life})`;
    partCtx.beginPath(); partCtx.arc(s.x,s.y,s.r,0,Math.PI*2); partCtx.fill();
  }

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
