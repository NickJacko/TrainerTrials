<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Global Catch Bonus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0; padding: 0;
      background: #111; color: white;
      font-family: sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100vh;
    }

    .bar-container {
      width: 80%;
      height: 30px;
      background: #333;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
      position: relative;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      transition: width 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      overflow: hidden;
    }

    .bar-fill::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.3) 30%,
        rgba(255, 255, 255, 0.6) 50%,
        rgba(255, 255, 255, 0.3) 70%,
        rgba(255, 255, 255, 0) 100%
      );
      background-size: 200% auto;
      background-position: -200% center;
      animation: shine 3s ease-in-out infinite;
    }

    @keyframes shine {
      0%   { background-position: -200% center; }
      50%  { background-position: 200% center; }
      100% { background-position: 200% center; }
    }

    .bar-fill.full {
      animation: pulse 2s ease-in-out infinite;
      background: linear-gradient(90deg, #ffd700, #ffed4e, #fff700, #ffd700);
      background-size: 200% auto;
      animation: pulse 2s ease-in-out infinite, goldShine 3s linear infinite;
    }

    @keyframes pulse {
      0%, 100% { 
        filter: brightness(1) drop-shadow(0 0 5px gold); 
        transform: scaleY(1);
      }
      50% { 
        filter: brightness(1.5) drop-shadow(0 0 15px gold); 
        transform: scaleY(1.1);
      }
    }

    @keyframes goldShine {
      0%   { background-position: -200% center; }
      100% { background-position: 200% center; }
    }

    .bonus {
      font-size: 1.7em;
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
      transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .bonus.full-bonus {
      color: #ffd700;
      text-shadow: 
        0 0 10px gold,
        0 2px 4px rgba(0, 0, 0, 0.5);
      animation: textGlow 2s ease-in-out infinite;
    }

    @keyframes textGlow {
      0%, 100% { 
        text-shadow: 
          0 0 10px gold,
          0 2px 4px rgba(0, 0, 0, 0.5);
      }
      50% { 
        text-shadow: 
          0 0 20px gold,
          0 0 30px gold,
          0 2px 4px rgba(0, 0, 0, 0.5);
      }
    }

    /* Smooth number transitions */
    .bonus-number {
      display: inline-block;
      transition: transform 0.3s ease;
    }

    .bonus-number.updating {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <div class="bar-container">
    <div class="bar-fill" id="bar"></div>
  </div>
  <div class="bonus" id="bonusText">+0.0% global catchrate</div>

  <script>
    let currentPercent = 0;
    let targetPercent = 0;
    let bonusValue = 0;
    let displayedBonus = 0;
    let isUpdating = false;

    async function fetchData() {
      try {
        const res = await fetch("global_likes.json?_=" + Date.now());
        const data = await res.json();
        const global = data.global_likes || 0;
        targetPercent = Math.min(global / 10000 * 100, 100);
        bonusValue = Math.min(global / 10000 * 10, 10);
      } catch (e) {
        console.error("Fehler beim Laden von global_likes.json");
      }
    }

    function updateDisplay() {
      const bar = document.getElementById("bar");
      const bonusText = document.getElementById("bonusText");

      // Smooth Übergang für Balken berechnen
      const percentDiff = Math.abs(targetPercent - currentPercent);
      if (percentDiff > 0.01) {
        const speed = percentDiff > 10 ? 0.05 : 0.02; // Schneller bei großen Sprüngen
        currentPercent += (targetPercent - currentPercent) * speed;
        bar.style.width = currentPercent.toFixed(1) + "%";
      }

      // Smooth Übergang für Bonus-Text
      const bonusDiff = Math.abs(bonusValue - displayedBonus);
      if (bonusDiff > 0.01) {
        if (!isUpdating) {
          isUpdating = true;
          bonusText.querySelector('.bonus-number')?.classList.add('updating');
          setTimeout(() => {
            bonusText.querySelector('.bonus-number')?.classList.remove('updating');
            isUpdating = false;
          }, 300);
        }
        
        const bonusSpeed = bonusDiff > 1 ? 0.05 : 0.02;
        displayedBonus += (bonusValue - displayedBonus) * bonusSpeed;
        bonusText.innerHTML = `+<span class="bonus-number">${displayedBonus.toFixed(1)}</span>% global catchrate`;
      }

      // Full-Status mit sanften Übergängen
      if (targetPercent >= 100) {
        bar.classList.add("full");
        bonusText.classList.add("full-bonus");
      } else {
        bar.classList.remove("full");
        bonusText.classList.remove("full-bonus");
      }
    }

    // Daten regelmäßig holen (weniger oft)
    setInterval(fetchData, 300);

    // Anzeige sanft aktualisieren (sehr oft für smooth transitions)
    setInterval(updateDisplay, 16); // ~60fps für ultra-smooth animations

    // Initial load
    fetchData();
  </script>

</body>
</html>
