<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com https://*.firebasedatabase.app; connect-src 'self' https://*.firebasedatabase.app https://*.firebaseio.com https://www.googleapis.com wss://*.firebasedatabase.app https://www.google.com https://content-firebaseappcheck.googleapis.com https://firebaseappcheck.googleapis.com; frame-src 'self' https://www.google.com https://*.firebasedatabase.app; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; base-uri 'self';">
  <title>Global Level</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: transparent;
      color: white;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      padding: 8px;
    }

    .widget {
      background: rgba(4,2,14,0.88);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 16px 20px;
      position: relative; overflow: hidden;
      min-width: 380px; max-width: 480px;
    }
    .widget::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(78,205,196,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(78,205,196,0.04) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
    }

    /* Animated top glow line */
    .widget::after {
      content: '';
      position: absolute; top: 0; left: -100%; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, #4ECDC4 40%, #FFD700 60%, transparent);
      animation: topGlow 3s ease-in-out infinite;
    }
    @keyframes topGlow { 0%{left:-100%} 100%{left:100%} }

    /* Header row */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px; position: relative; z-index: 1;
    }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ECDC4; box-shadow: 0 0 8px #4ECDC4; animation: dp 2s ease-in-out infinite; }
    @keyframes dp { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .header-label { font-size: 10px; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase; opacity: 0.45; }

    .level-badge {
      font-size: 1.6rem; font-weight: 900; letter-spacing: -1px;
      color: #FFD700; text-shadow: 0 0 20px rgba(255,215,0,0.5);
      animation: lvlPulse 3s ease-in-out infinite alternate;
    }
    @keyframes lvlPulse { 0%{filter:brightness(1)} 100%{filter:brightness(1.3)} }

    /* XP numbers */
    .xp-row {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 8px; position: relative; z-index: 1;
    }
    .xp-current { font-size: 13px; font-weight: 700; color: #4ECDC4; }
    .xp-next    { font-size: 11px; opacity: 0.35; font-weight: 600; }

    /* Progress track */
    .track {
      height: 14px; background: rgba(255,255,255,0.07);
      border-radius: 7px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.07);
      position: relative; z-index: 1;
      margin-bottom: 8px;
    }
    .fill {
      height: 100%; width: 0%; border-radius: 7px;
      position: relative; overflow: hidden;
      transition: width 1.5s cubic-bezier(0.25,0.46,0.45,0.94);
    }

    /* Level-based fill colours */
    .fill.lvl-0  { background: linear-gradient(90deg,#6C757D,#9E9E9E); }
    .fill.lvl-5  { background: linear-gradient(90deg,#4CAF50,#66BB6A); box-shadow:0 0 10px rgba(76,175,80,0.4); }
    .fill.lvl-10 { background: linear-gradient(90deg,#00838F,#26C6DA); box-shadow:0 0 12px rgba(0,131,143,0.4); }
    .fill.lvl-15 { background: linear-gradient(90deg,#1976D2,#42A5F5); box-shadow:0 0 12px rgba(25,118,210,0.4); }
    .fill.lvl-20 { background: linear-gradient(90deg,#F57F17,#FFEB3B); box-shadow:0 0 14px rgba(245,127,23,0.5); }
    .fill.lvl-25 { background: linear-gradient(90deg,#E65100,#FF9800); box-shadow:0 0 16px rgba(230,81,0,0.5); }
    .fill.lvl-30 { background: linear-gradient(90deg,#C62828,#F44336); box-shadow:0 0 16px rgba(198,40,40,0.5); }
    .fill.lvl-40 { background: linear-gradient(90deg,#B71C1C,#D32F2F); box-shadow:0 0 18px rgba(183,28,28,0.6); }
    .fill.lvl-50 { background: linear-gradient(90deg,#ff0000,#ff8000,#ffff00,#00ff00,#00ffff,#0000ff,#8000ff); background-size:200% auto; animation:rainbow 3s linear infinite; box-shadow:0 0 24px rgba(255,200,0,0.6); }
    @keyframes rainbow { to{background-position:-200% center;} }

    /* Shimmer overlay on fill */
    .fill::after {
      content:'';
      position:absolute; inset:0;
      background:linear-gradient(90deg,transparent 30%,rgba(255,255,255,0.25) 50%,transparent 70%);
      animation:shimmer 2s linear infinite;
    }
    @keyframes shimmer { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }

    /* Floating +XP */
    .xp-float {
      position: absolute; font-size: 13px; font-weight: 900;
      color: #4CAF50; pointer-events: none; z-index: 10;
      text-shadow: 0 0 10px rgba(76,175,80,0.7);
      animation: xpFloat 1.5s ease-out forwards;
    }
    @keyframes xpFloat { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-36px) scale(0.6)} }

    /* Level up flash */
    .lvl-flash {
      position: absolute; inset: 0; border-radius: 18px;
      background: rgba(255,215,0,0.25);
      animation: lvlFlash 0.6s ease-out forwards;
      pointer-events: none; z-index: 5;
    }
    @keyframes lvlFlash { 0%{opacity:0} 30%{opacity:1} 100%{opacity:0} }

    .next-label { font-size: 10px; opacity: 0.3; font-weight: 600; position: relative; z-index: 1; text-align: right; }
  </style>
</head>
<body>
<div class="widget" id="widget">
  <div class="header">
    <div class="header-left">
      <div class="live-dot"></div>
      <div class="header-label">🌟 Global Level</div>
    </div>
    <div class="level-badge" id="levelBadge">Lvl 1</div>
  </div>
  <div class="xp-row">
    <div class="xp-current" id="xpCurrent">0 XP</div>
    <div class="xp-next" id="xpNext">Next: Level 2</div>
  </div>
  <div class="track">
    <div class="fill lvl-0" id="fill"></div>
  </div>
  <div class="next-label" id="nextLabel">0 / 100 XP to next level</div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
  const db = getDatabase(initializeApp({
    apiKey:"AIzaSyDdStpC5rVtgaZ4XvtKLwQttnyIDXL2z7Q",
    authDomain:"trainertrials.firebaseapp.com",
    databaseURL:"https://trainertrials-default-rtdb.europe-west1.firebasedatabase.app",
    projectId:"trainertrials", storageBucket:"trainertrials.firebasestorage.app",
    messagingSenderId:"22071275267", appId:"1:22071275267:web:92e82d6bfaee169aff8336"
  }));

  function xpForLevel(l){ return Math.floor(100*Math.pow(1.5,l-1)); }
  function levelFromXP(total){
    let l=1,used=0;
    while(true){ const n=xpForLevel(l); if(used+n>total) return l; used+=n; l++; }
  }
  function xpInLevel(total){
    let l=1,used=0;
    while(true){ const n=xpForLevel(l); if(used+n>total) return total-used; used+=n; l++; }
  }
  function fillClass(l){
    if(l>=50)return'lvl-50';if(l>=40)return'lvl-40';if(l>=30)return'lvl-30';
    if(l>=25)return'lvl-25';if(l>=20)return'lvl-20';if(l>=15)return'lvl-15';
    if(l>=10)return'lvl-10';if(l>=5)return'lvl-5';return'lvl-0';
  }

  let displayXP=0, targetXP=0, prevLevel=1, lastTotal=0;

  function spawnXP(amount){
    const widget=document.getElementById('widget');
    const el=document.createElement('div');
    el.className='xp-float';
    el.textContent=`+${amount} XP`;
    el.style.left=Math.random()*200+80+'px';
    el.style.top='40px';
    widget.appendChild(el);
    setTimeout(()=>el.remove(),1500);
  }
  function levelFlash(){
    const widget=document.getElementById('widget');
    const f=document.createElement('div'); f.className='lvl-flash';
    widget.appendChild(f); setTimeout(()=>f.remove(),650);
  }

  function tick(){
    if(Math.abs(targetXP-displayXP)>0.5){
      displayXP+=(targetXP-displayXP)*0.06;
    } else { displayXP=targetXP; }

    const level = levelFromXP(Math.floor(displayXP));
    const inLvl = xpInLevel(Math.floor(displayXP));
    const need  = xpForLevel(level);
    const pct   = Math.min(100,(inLvl/need)*100);

    if(level>prevLevel){ levelFlash(); prevLevel=level; }

    document.getElementById('levelBadge').textContent = `Lvl ${level}`;
    document.getElementById('xpCurrent').textContent  = `${Math.floor(displayXP).toLocaleString('de-DE')} XP`;
    document.getElementById('xpNext').textContent     = `Next: Level ${level+1}`;
    document.getElementById('nextLabel').textContent   = `${Math.floor(inLvl).toLocaleString('de-DE')} / ${need.toLocaleString('de-DE')} XP to next level`;

    const fill=document.getElementById('fill');
    fill.style.width=pct.toFixed(2)+'%';
    fill.className=`fill ${fillClass(level)}`;

    requestAnimationFrame(tick);
  }

  onValue(ref(db,'global/total_likes_ever'),snap=>{
    const total=snap.val()||0;
    if(total>lastTotal) spawnXP(total-lastTotal);
    lastTotal=total;
    targetXP=total;
  });

  tick();
</script>
</body>
</html>
