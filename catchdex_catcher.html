<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; connect-src 'self' https://*.firebasedatabase.app https://*.firebaseio.com https://www.googleapis.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src https://fonts.gstatic.com; base-uri 'self';">
  <title>📘 Catchdex</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#1a1a2e">
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" as="style">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #0f0f23; margin: 0; padding: 0; min-height: 100vh; color: white;
      overflow-x: hidden; -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(ellipse at center, #1a1a2e 0%, #16213e 30%, #0f0f23 70%, #000000 100%);
      z-index: -2;
    }

    .bg-effects { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.3; pointer-events: none; }

    .floating-element { position: absolute; font-size: 1.5rem; opacity: 0; animation: floatUp 12s linear infinite; pointer-events: none; }
    @keyframes floatUp {
      0% { transform: translateY(100vh) translateX(0) rotate(0deg) scale(0.5); opacity: 0; }
      10%, 90% { opacity: 0.3; }
      100% { transform: translateY(-50px) translateX(20px) rotate(180deg) scale(0.8); opacity: 0; }
    }

    .container { max-width: 1400px; margin: auto; padding: 20px; position: relative; z-index: 1; }

    .header-section {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 30px; background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px); border-radius: 16px; padding: 20px 24px;
      border: 1px solid rgba(255,255,255,0.12); position: relative; overflow: hidden;
    }

    .header-section::before {
      content: ''; position: absolute; top: -2px; left: -100%;
      width: 100%; height: calc(100% + 4px);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      animation: headerShine 6s ease-in-out infinite;
    }
    @keyframes headerShine { 0%, 50% { left: -100%; } 100% { left: 100%; } }

    .header-content { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; width: 100%; }

    .back-button {
      font-size: 15px; text-decoration: none; color: white; font-weight: 600;
      padding: 12px 20px; border-radius: 12px; background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2); transition: all 0.3s ease; touch-action: manipulation;
    }
    .back-button:hover { transform: translateY(-2px); background: rgba(255,255,255,0.15); }

    h1 {
      text-align: center; flex: 1; font-size: clamp(2rem, 5vw, 3.5rem);
      background: linear-gradient(45deg, #FFD700, #FF6B6B, #4ECDC4, #FFD700);
      background-size: 200% 200%;
      background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: gradientShift 3s ease-in-out infinite; font-weight: 900; margin: 0;
    }
    @keyframes gradientShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

    .rarity-section {
      margin-bottom: 32px; background: rgba(255,255,255,0.06);
      backdrop-filter: blur(10px); border-radius: 20px; padding: 24px;
      border: 1px solid rgba(255,255,255,0.1); position: relative; overflow: hidden;
    }

    .rarity-header { text-align: center; margin-bottom: 24px; position: relative; z-index: 2; }
    .rarity-title { font-size: clamp(1.8rem, 4vw, 2.5rem); font-weight: 800; margin: 0 0 12px 0; }

    .starter .rarity-title { background: linear-gradient(45deg, #4CAF50, #81C784); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .common .rarity-title { background: linear-gradient(45deg, #9E9E9E, #BDBDBD); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .rare .rarity-title { background: linear-gradient(45deg, #2196F3, #64B5F6); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .legendary .rarity-title { background: linear-gradient(45deg, #FF9800, #FFB74D); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: legendaryPulse 2s ease-in-out infinite alternate; }
    .mythical .rarity-title { background: linear-gradient(45deg, #9C27B0, #BA68C8); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: mythicalPulse 2.5s ease-in-out infinite alternate; }
    .god .rarity-title { background: linear-gradient(45deg, #000000, #424242, #000000); background-size: 200% auto; background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: godEffect 3s linear infinite; }
    .god .rarity-section { background: linear-gradient(135deg, rgba(0,0,0,0.4), rgba(64,0,64,0.2), rgba(0,0,0,0.4)); border: 1px solid rgba(128,0,128,0.3); }

    @keyframes legendaryPulse { 0% { filter: brightness(1); } 100% { filter: brightness(1.2); } }
    @keyframes mythicalPulse { 0% { filter: brightness(1); } 100% { filter: brightness(1.3); } }
    @keyframes godEffect { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

    .dex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; justify-items: center; position: relative; z-index: 2; }

    .catchmon-card {
      background: rgba(255,255,255,0.08); border-radius: 16px; width: 140px; min-height: 200px;
      padding: 14px; text-align: center; transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex; flex-direction: column; justify-content: space-between; align-items: center;
      border: 1px solid rgba(255,255,255,0.1); overflow: hidden; position: relative;
      backdrop-filter: blur(10px); touch-action: manipulation;
    }
    .catchmon-card:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 12px 24px rgba(0,0,0,0.3); border-color: rgba(76,175,80,0.4); }

    .god .catchmon-card { background: linear-gradient(145deg, #1a1a1a, #2d2d2d); border: 1px solid rgba(128,0,128,0.4); }
    .god .catchmon-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(45deg, transparent 30%, rgba(128,0,128,0.15) 50%, transparent 70%); animation: godCardGlow 4s ease-in-out infinite; pointer-events: none; border-radius: 16px; }
    @keyframes godCardGlow { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.6; } }

    .catchmon-card img { width: 90px; height: 90px; object-fit: contain; margin-bottom: 8px; transition: transform 0.25s ease; border-radius: 8px; position: relative; z-index: 2; }
    .catchmon-card:hover img { transform: scale(1.1); }
    .god .catchmon-card img { filter: brightness(0.7) contrast(1.3); border: 1px solid rgba(128,0,128,0.3); }

    .god .catchmon-card::before { content: '⚡ DIVINE ⚡'; position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%); color: #DAA520; font-weight: 900; font-size: 9px; z-index: 3; text-shadow: 0 0 8px rgba(218,165,32,0.8); background: rgba(0,0,0,0.8); padding: 2px 5px; border-radius: 6px; border: 1px solid rgba(218,165,32,0.4); animation: divineGlow 3s ease-in-out infinite alternate; }
    @keyframes divineGlow { 0% { opacity: 0.8; } 100% { opacity: 1; } }

    .catchmon-card a { text-decoration: none; color: white; font-weight: 600; display: block; position: relative; z-index: 2; }
    .god .catchmon-card a { color: #9370DB; }
    .catchmon-card .id-name { font-size: 13px; font-weight: 700; margin-bottom: 6px; color: white; line-height: 1.2; position: relative; z-index: 2; }
    .god .catchmon-card .id-name { color: #9370DB; }

    .uncaught { opacity: 0.5; }
    .uncaught img { filter: grayscale(100%) brightness(0.4); }

    .star { position: absolute; top: 8px; right: 8px; font-size: 16px; color: gold; z-index: 4; filter: drop-shadow(0 0 6px rgba(255,215,0,0.8)); animation: starTwinkle 2s ease-in-out infinite alternate; }
    @keyframes starTwinkle { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

    .rarity-count { background: rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 16px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.9); display: inline-block; }

    .catcher-name { display: inline-block; font-weight: bold; background-size: 200% auto; background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 3s linear infinite; }
    .king { background-image: linear-gradient(90deg, #ffd700, #ffffff, #ffd700); }
    .flame { background-image: linear-gradient(90deg, #ff0000, #ffffff, #ff0000); }
    .diamond { background-image: linear-gradient(90deg, #00bfff, #ffffff, #00bfff); }
    .shine { background-image: linear-gradient(90deg, #32cd32, #ffffff, #32cd32); }
    .normal { color: white; font-weight: 700; background: none; -webkit-text-fill-color: inherit; animation: none; }
    @keyframes shine { to { background-position: -200% center; } }

    .loading { display: flex; justify-content: center; align-items: center; height: 200px; color: rgba(255,255,255,0.8); font-size: 16px; }
    .loading::after { content: ''; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top: 2px solid white; border-radius: 50%; margin-left: 12px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-message { text-align: center; padding: 40px; color: rgba(255,255,255,0.8); font-size: 16px; background: rgba(255,255,255,0.06); border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); }

    @media (max-width: 768px) {
      .container { padding: 12px; }
      .header-section { flex-direction: column; gap: 16px; padding: 20px 16px; }
      .header-content { flex-direction: column; gap: 16px; }
      .rarity-section { padding: 16px 12px; margin-bottom: 24px; }
      .dex-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
      .catchmon-card { width: 110px; min-height: 160px; padding: 10px; }
      .catchmon-card img { width: 75px; height: 75px; margin-bottom: 6px; }
      .catchmon-card .id-name { font-size: 11px; margin-bottom: 4px; }
      .catchmon-card:hover { transform: none; box-shadow: none; border-color: rgba(255,255,255,0.1); }
      .catchmon-card:hover img { transform: none; }
    }

    @media (max-width: 480px) {
      .container { padding: 8px; }
      .rarity-section { padding: 12px 8px; margin-bottom: 20px; }
      .dex-grid { grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 10px; }
      .catchmon-card { width: 95px; min-height: 140px; padding: 8px; }
      .catchmon-card img { width: 65px; height: 65px; margin-bottom: 4px; }
      .catchmon-card .id-name { font-size: 10px; margin-bottom: 2px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      .floating-element, .header-section::before { animation: none; }
    }
  </style>
</head>
<body>
  <div class="bg-effects" id="bgEffects"></div>

  <div class="container">
    <div class="header-section">
      <div class="header-content">
        <a class="back-button" href="javascript:history.back()">← Back</a>
        <h1 id="catcherTitle">📘 Loading Catchdex...</h1>
        <div></div>
      </div>
    </div>
    <div id="dexContainer">
      <div class="loading">Loading Catchmon</div>
    </div>
  </div>

  <script type="module">
    import { db } from './assets/js/firebase.client.js';
    import { ref, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

    // --- Security ---
    function escapeHtml(input) {
      const s = String(input ?? "");
      return s.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#39;");
    }

    function validateTrainerName(name) {
      if (!name) return null;
      const cleaned = name.trim().slice(0, 60);
      if (!/^[\w\s\-]+$/.test(cleaned)) return null;
      return cleaned;
    }

    const rawName = new URLSearchParams(window.location.search).get("name");
    const trainerName = validateTrainerName(rawName);

    const rarityOrder = ["Starter", "Common", "Rare", "Legendary", "Mythical", "God"];
    const rarityEmojis = { "Starter": "🌱", "Common": "⚪", "Rare": "🔵", "Legendary": "🟡", "Mythical": "🟣", "God": "⚫" };

    function capitalize(str) { return str.charAt(0).toUpperCase() + str.slice(1); }

    function getDonationTier(donation) {
      if (donation >= 1000) return 'king';
      if (donation >= 500) return 'flame';
      if (donation >= 250) return 'diamond';
      if (donation >= 100) return 'shine';
      return 'normal';
    }

    // Safe title builder — no innerHTML with user input
    function setTitle(trainerName, donation) {
      const titleEl = document.getElementById("catcherTitle");
      titleEl.textContent = '';
      const prefix = document.createTextNode('📘 ');
      titleEl.appendChild(prefix);
      const tier = getDonationTier(donation);
      const nameSpan = document.createElement('span');
      nameSpan.className = `catcher-name ${tier}`;
      nameSpan.textContent = capitalize(trainerName);
      titleEl.appendChild(nameSpan);
      const suffix = document.createTextNode("'s Catchdex");
      titleEl.appendChild(suffix);
    }

    function buildRaritySection(rarity, pokemons, caughtCount) {
      if (pokemons.length === 0) return '';
      const rarityClass = rarity.toLowerCase();
      const emoji = rarityEmojis[rarity] || "❓";

      let cardsHtml = '';
      pokemons.forEach(p => {
        const name = p.name.toLowerCase();
        const caught = name in caughtCount;
        const count = caughtCount[name] || 0;
        const star = count >= 3;
        const id = String(p.id).padStart(3, "0");
        const displayName = rarity === "God" ? "??? ??? ???" : escapeHtml(capitalize(p.name));
        const displayId = rarity === "God" ? "???" : id;
        const safeName = capitalize(p.name).replace(/ /g, "_");

        cardsHtml += `
          <div class="catchmon-card${caught ? "" : " uncaught"}">
            <a href="dex_detail.html?name=${encodeURIComponent(safeName)}">
              <img src="${escapeHtml(p.sprite)}" alt="${escapeHtml(capitalize(p.name))}" loading="lazy">
              <div class="id-name">#${displayId}<br>${displayName}</div>
              ${star ? '<div class="star">★</div>' : ''}
            </a>
          </div>
        `;
      });

      return `
        <div class="rarity-section ${rarityClass}">
          <div class="rarity-header">
            <h2 class="rarity-title">${emoji} ${rarity}</h2>
            <div class="rarity-count">${pokemons.length} Catchmon</div>
          </div>
          <div class="dex-grid">${cardsHtml}</div>
        </div>
      `;
    }

    async function loadCatchdex(trainer) {
      const container = document.getElementById("dexContainer");
      const titleEl = document.getElementById("catcherTitle");

      try {
        const dexRes = await fetch("dex_list.json?" + Date.now());
        const dexList = await dexRes.json();

        onValue(ref(db, 'trainers'), (snapshot) => {
          const trainersData = snapshot.val() || {};
          const trainerData = trainersData[trainer];

          if (!trainerData) {
            titleEl.textContent = `📘 ${capitalize(trainer)}'s Catchdex`;
            container.innerHTML = '<div class="error-message">Trainer not found.</div>';
            return;
          }

          const team = Array.isArray(trainerData.team) ? trainerData.team : Object.values(trainerData.team || {});
          const donation = trainerData.donation || 0;
          const caughtCount = {};
          team.forEach(mon => {
            const monName = mon.name.toLowerCase();
            caughtCount[monName] = (caughtCount[monName] || 0) + 1;
          });

          setTitle(trainer, donation);

          const byRarity = {};
          rarityOrder.forEach(r => byRarity[r] = []);
          dexList.forEach(mon => {
            const parts = mon.sprite.split("/");
            const rarity = parts.length > 1 ? parts[1] : "Common";
            (byRarity[rarity] || byRarity["Common"]).push(mon);
          });
          rarityOrder.forEach(r => { if (byRarity[r]) byRarity[r].sort((a, b) => a.id - b.id); });

          container.innerHTML = rarityOrder.map(r => buildRaritySection(r, byRarity[r] || [], caughtCount)).join('');
        });

      } catch (error) {
        console.error('Error loading catchdex:', error);
        titleEl.textContent = `📘 ${capitalize(trainer)}'s Catchdex`;
        container.innerHTML = '<div class="error-message">Error loading data. Please try again later.</div>';
      }
    }

    // Background effects
    let backgroundElements = [];
    const maxElements = 8;

    function createFloatingElement() {
      if (backgroundElements.length >= maxElements) return;
      const elements = ['🏆', '🥇', '👑', '⭐', '💎', '🔥', '⚡'];
      const el = document.createElement('div');
      el.className = 'floating-element';
      el.textContent = elements[Math.floor(Math.random() * elements.length)];
      el.style.left = Math.random() * 100 + '%';
      el.style.animationDuration = (Math.random() * 4 + 8) + 's';
      el.style.animationDelay = Math.random() * 2 + 's';
      document.getElementById('bgEffects').appendChild(el);
      backgroundElements.push(el);
      setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); backgroundElements = backgroundElements.filter(e => e !== el); }, 12000);
    }

    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      let lastTime = 0;
      function animate() {
        const now = Date.now();
        if (now - lastTime > 3000) { createFloatingElement(); lastTime = now; }
        requestAnimationFrame(animate);
      }
      animate();
      for (let i = 0; i < 3; i++) setTimeout(createFloatingElement, i * 1000);
    }

    // Init
    if (!trainerName) {
      document.getElementById("dexContainer").innerHTML = '<div class="error-message">Invalid or missing trainer name.</div>';
      document.getElementById("catcherTitle").textContent = "📘 Unknown Trainer's Catchdex";
    } else {
      loadCatchdex(trainerName.toLowerCase());
    }

    // Service Worker — relative path for GitHub Pages
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.log('SW registration failed:', err));
      });
    }

    console.log('📘 Catchdex loaded — XSS-safe, Firebase v10 modular');
  </script>
</body>
</html>
