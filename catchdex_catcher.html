<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com https://*.firebasedatabase.app; connect-src 'self' https://*.firebasedatabase.app https://*.firebaseio.com https://www.googleapis.com wss://*.firebasedatabase.app https://www.google.com https://content-firebaseappcheck.googleapis.com https://firebaseappcheck.googleapis.com; frame-src 'self' https://www.google.com https://*.firebasedatabase.app; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'self';">
  <title>📘 Catchdex</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#1a1a2e">
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" as="style">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #0f0f23; margin: 0; padding: 0; min-height: 100vh; color: white; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(ellipse at center, #1a1a2e 0%, #16213e 30%, #0f0f23 70%, #000000 100%); z-index: -2; }
    .bg-effects { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.3; pointer-events: none; }
    .floating-element { position: absolute; font-size: 1.5rem; opacity: 0; animation: floatUp 12s linear infinite; pointer-events: none; }
    @keyframes floatUp { 0% { transform: translateY(100vh) translateX(0) rotate(0deg) scale(0.5); opacity: 0; } 10%, 90% { opacity: 0.3; } 100% { transform: translateY(-50px) translateX(20px) rotate(180deg) scale(0.8); opacity: 0; } }
    .container { max-width: 1400px; margin: auto; padding: 20px; position: relative; z-index: 1; }
    .header-section { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); border-radius: 16px; padding: 20px 24px; border: 1px solid rgba(255,255,255,0.12); position: relative; overflow: hidden; }
    .header-section::before { content: ''; position: absolute; top: -2px; left: -100%; width: 100%; height: calc(100% + 4px); background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent); animation: headerShine 6s ease-in-out infinite; }
    @keyframes headerShine { 0%, 50% { left: -100%; } 100% { left: 100%; } }
    .header-content { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; width: 100%; }
    .back-button { font-size: 15px; text-decoration: none; color: white; font-weight: 600; padding: 12px 20px; border-radius: 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); transition: all 0.3s ease; touch-action: manipulation; }
    .back-button:hover { transform: translateY(-2px); background: rgba(255,255,255,0.15); }
    h1 { text-align: center; flex: 1; font-size: clamp(2rem, 5vw, 3.5rem); background: linear-gradient(45deg, #FFD700, #FF6B6B, #4ECDC4, #FFD700); background-size: 200% 200%; background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: gradientShift 3s ease-in-out infinite; font-weight: 900; margin: 0; }
    @keyframes gradientShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    .rarity-section { margin-bottom: 32px; background: rgba(255,255,255,0.06); backdrop-filter: blur(10px); border-radius: 20px; padding: 24px; border: 1px solid rgba(255,255,255,0.1); position: relative; overflow: hidden; }
    .rarity-header { text-align: center; margin-bottom: 24px; position: relative; z-index: 2; }
    .rarity-title { font-size: clamp(1.8rem, 4vw, 2.5rem); font-weight: 800; margin: 0 0 12px 0; }
    .starter .rarity-title { background: linear-gradient(45deg, #4CAF50, #81C784); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .common .rarity-title { background: linear-gradient(45deg, #9E9E9E, #BDBDBD); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .rare .rarity-title { background: linear-gradient(45deg, #2196F3, #64B5F6); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .legendary .rarity-title { background: linear-gradient(45deg, #FF9800, #FFB74D); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: legendaryPulse 2s ease-in-out infinite alternate; }
    .mythical .rarity-title { background: linear-gradient(45deg, #9C27B0, #BA68C8); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: mythicalPulse 2.5s ease-in-out infinite alternate; }
    .god .rarity-title { background: linear-gradient(45deg, #000000, #424242, #000000); background-size: 200% auto; background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: godEffect 3s linear infinite; }
    .god .rarity-section { background: linear-gradient(135deg, rgba(0,0,0,0.4), rgba(64,0,64,0.2), rgba(0,0,0,0.4)); border: 1px solid rgba(128,0,128,0.3); }
    @keyframes legendaryPulse { 0% { filter: brightness(1); } 100% { filter: brightness(1.2); } }
    @keyframes mythicalPulse { 0% { filter: brightness(1); } 100% { filter: brightness(1.3); } }
    @keyframes godEffect { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
    .dex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; justify-items: center; position: relative; z-index: 2; }
    .catchmon-card { background: rgba(255,255,255,0.08); border-radius: 16px; width: 140px; min-height: 200px; padding: 14px; text-align: center; transition: transform 0.3s ease, box-shadow 0.3s ease; display: flex; flex-direction: column; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; position: relative; backdrop-filter: blur(10px); touch-action: manipulation; }
    .catchmon-card:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 12px 24px rgba(0,0,0,0.3); border-color: rgba(76,175,80,0.4); }
    .god .catchmon-card { background: linear-gradient(145deg, #1a1a1a, #2d2d2d); border: 1px solid rgba(128,0,128,0.4); }
    .god .catchmon-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(45deg, transparent 30%, rgba(128,0,128,0.15) 50%, transparent 70%); animation: godCardGlow 4s ease-in-out infinite; pointer-events: none; border-radius: 16px; }
    @keyframes godCardGlow { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.6; } }
    .catchmon-card img { width: 90px; height: 90px; object-fit: contain; margin-bottom: 8px; transition: transform 0.25s ease; border-radius: 8px; position: relative; z-index: 2; }
    .catchmon-card:hover img { transform: scale(1.1); }
    .god .catchmon-card img { filter: brightness(0.7) contrast(1.3); border: 1px solid rgba(128,0,128,0.3); }
    .god .catchmon-card::before { content: 'DIVINE'; position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%); color: #DAA520; font-weight: 900; font-size: 9px; z-index: 3; background: rgba(0,0,0,0.8); padding: 2px 5px; border-radius: 6px; border: 1px solid rgba(218,165,32,0.4); animation: divineGlow 3s ease-in-out infinite alternate; }
    @keyframes divineGlow { 0% { opacity: 0.8; } 100% { opacity: 1; } }
    .catchmon-card a { text-decoration: none; color: white; font-weight: 600; display: block; position: relative; z-index: 2; }
    .god .catchmon-card a { color: #9370DB; }
    .catchmon-card .id-name { font-size: 13px; font-weight: 700; margin-bottom: 6px; color: white; line-height: 1.2; position: relative; z-index: 2; }
    .god .catchmon-card .id-name { color: #9370DB; }
    .uncaught { opacity: 0.5; }
    .uncaught img { filter: grayscale(100%) brightness(0.4); }
    .star { position: absolute; top: 8px; right: 8px; font-size: 16px; color: gold; z-index: 4; filter: drop-shadow(0 0 6px rgba(255,215,0,0.8)); animation: starTwinkle 2s ease-in-out infinite alternate; }
    @keyframes starTwinkle { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
    .rarity-count { background: rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 16px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.9); display: inline-block; }
    .catcher-name { display: inline-block; font-weight: bold; background-size: 200% auto; background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 3s linear infinite; }
    .king { background-image: linear-gradient(90deg, #ffd700, #ffffff, #ffd700); }
    .flame { background-image: linear-gradient(90deg, #ff0000, #ffffff, #ff0000); }
    .diamond { background-image: linear-gradient(90deg, #00bfff, #ffffff, #00bfff); }
    .shine { background-image: linear-gradient(90deg, #32cd32, #ffffff, #32cd32); }
    .normal { color: white; font-weight: 700; background: none; -webkit-text-fill-color: inherit; animation: none; }
    @keyframes shine { to { background-position: -200% center; } }
    .loading { display: flex; justify-content: center; align-items: center; height: 200px; color: rgba(255,255,255,0.8); font-size: 16px; }
    .loading::after { content: ''; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top: 2px solid white; border-radius: 50%; margin-left: 12px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-message { text-align: center; padding: 40px; color: rgba(255,255,255,0.8); font-size: 16px; background: rgba(255,255,255,0.06); border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); }
    @media (max-width: 768px) { .container { padding: 12px; } .header-section { flex-direction: column; gap: 16px; padding: 20px 16px; } .header-content { flex-direction: column; gap: 16px; } .rarity-section { padding: 16px 12px; margin-bottom: 24px; } .dex-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; } .catchmon-card { width: 110px; min-height: 160px; padding: 10px; } .catchmon-card img { width: 75px; height: 75px; margin-bottom: 6px; } .catchmon-card .id-name { font-size: 11px; margin-bottom: 4px; } .catchmon-card:hover { transform: none; box-shadow: none; } .catchmon-card:hover img { transform: none; } }
    @media (max-width: 480px) { .container { padding: 8px; } .rarity-section { padding: 12px 8px; margin-bottom: 20px; } .dex-grid { grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 10px; } .catchmon-card { width: 95px; min-height: 140px; padding: 8px; } .catchmon-card img { width: 65px; height: 65px; margin-bottom: 4px; } .catchmon-card .id-name { font-size: 10px; margin-bottom: 2px; } }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } .floating-element, .header-section::before { animation: none; } }
  </style>
</head>
