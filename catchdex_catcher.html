<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Catchdex</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      color: #333;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 15px 20px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .back-button {
      font-size: 16px;
      text-decoration: none;
      color: white;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 12px;
      background: linear-gradient(145deg, rgba(255,255,255,0.2), rgba(255,255,255,0.1));
      border: 1px solid rgba(255,255,255,0.3);
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .back-button:hover {
      transform: translateY(-2px);
      background: linear-gradient(145deg, rgba(255,255,255,0.3), rgba(255,255,255,0.2));
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    h1 {
      text-align: center;
      font-size: clamp(1.5rem, 4vw, 2rem);
      margin: 0;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
      background-size: 300% 300%;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 3s ease-in-out infinite;
      font-weight: 800;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .rarity-section {
      margin-bottom: 40px;
    }

    .rarity-header {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
      border: 2px solid rgba(255,255,255,0.2);
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      position: relative;
      overflow: hidden;
    }

    .rarity-header::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      animation: headerShimmer 4s ease-in-out infinite;
    }

    @keyframes headerShimmer {
      0% { left: -100%; }
      50% { left: 100%; }
      100% { left: 100%; }
    }

    .rarity-title {
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 800;
      margin: 0;
      position: relative;
      z-index: 2;
    }

    /* Rarity Specific Styles */
    .starter .rarity-title {
      background: linear-gradient(45deg, #4CAF50, #81C784, #A5D6A7);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
    }

    .common .rarity-title {
      background: linear-gradient(45deg, #9E9E9E, #BDBDBD, #E0E0E0);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(158, 158, 158, 0.3);
    }

    .rare .rarity-title {
      background: linear-gradient(45deg, #2196F3, #64B5F6, #90CAF9);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(33, 150, 243, 0.3);
    }

    .legendary .rarity-title {
      background: linear-gradient(45deg, #FF9800, #FFB74D, #FFCC02);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 152, 0, 0.3);
      animation: legendaryPulse 2s ease-in-out infinite alternate;
    }

    .mythical .rarity-title {
      background: linear-gradient(45deg, #9C27B0, #BA68C8, #CE93D8);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(156, 39, 176, 0.3);
      animation: mythicalPulse 2.5s ease-in-out infinite alternate;
    }

    .god .rarity-title {
      background: linear-gradient(45deg, #000000, #424242, #616161, #000000);
      background-size: 200% auto;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: godEffect 3s linear infinite;
      filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
      position: relative;
    }

    .god .rarity-header {
      background: linear-gradient(135deg, 
        rgba(0,0,0,0.3) 0%, 
        rgba(64,0,64,0.2) 25%, 
        rgba(0,0,0,0.4) 50%, 
        rgba(64,0,64,0.2) 75%, 
        rgba(0,0,0,0.3) 100%);
      border: 2px solid rgba(0,0,0,0.5);
      box-shadow: 
        0 0 30px rgba(0,0,0,0.5),
        inset 0 0 20px rgba(255,255,255,0.1);
    }

    @keyframes legendaryPulse {
      0% { 
        filter: brightness(1) drop-shadow(0 0 10px rgba(255, 152, 0, 0.3));
        transform: scale(1);
      }
      100% { 
        filter: brightness(1.3) drop-shadow(0 0 25px rgba(255, 152, 0, 0.6));
        transform: scale(1.02);
      }
    }

    @keyframes mythicalPulse {
      0% { 
        filter: brightness(1) drop-shadow(0 0 15px rgba(156, 39, 176, 0.3));
        transform: scale(1);
      }
      100% { 
        filter: brightness(1.4) drop-shadow(0 0 30px rgba(156, 39, 176, 0.7));
        transform: scale(1.03);
      }
    }

    @keyframes godEffect {
      0% { 
        background-position: 0% 50%;
        filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
      }
      50% {
        filter: drop-shadow(0 0 20px rgba(128,0,128,0.6));
      }
      100% { 
        background-position: 200% 50%;
        filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
      }
    }

    .dex-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 15px;
      justify-items: center;
    }

    .catchmon-box {
      position: relative;
      width: 120px;
      height: 140px;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 16px;
      background: linear-gradient(145deg, #ffffff, #f0f0f0);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 8px;
      text-align: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .catchmon-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transition: left 0.5s;
    }

    .catchmon-box:hover::before {
      left: 100%;
    }

    .catchmon-box:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      border-color: rgba(76, 175, 80, 0.4);
    }

    .catchmon-box img {
      max-width: 80px;
      max-height: 80px;
      margin-bottom: 8px;
      transition: transform 0.3s ease;
      position: relative;
      z-index: 2;
    }

    .catchmon-box:hover img {
      transform: scale(1.1);
    }

    .catchmon-box a {
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }

    .catchmon-name {
      font-size: 12px;
      font-weight: 700;
      color: #333;
      margin-top: auto;
      line-height: 1.2;
      text-align: center;
    }

    .uncaught img {
      filter: grayscale(100%) brightness(0.4);
    }

    .uncaught .catchmon-name {
      color: #999;
    }

    .star {
      position: absolute;
      top: 4px;
      right: 4px;
      font-size: 16px;
      color: gold;
      z-index: 3;
      filter: drop-shadow(0 0 4px rgba(255, 215, 0, 0.8));
      animation: starTwinkle 2s ease-in-out infinite alternate;
    }

    @keyframes starTwinkle {
      0% { transform: scale(1) rotate(0deg); }
      100% { transform: scale(1.2) rotate(15deg); }
    }

    /* God Card Special Effects - Mysterious & Centered */
    .god .catchmon-box {
      background: linear-gradient(145deg, 
        rgba(0,0,0,0.9) 0%, 
        rgba(25,0,25,0.8) 50%, 
        rgba(0,0,0,0.9) 100%);
      border: 2px solid rgba(75,0,130,0.6);
      box-shadow: 
        0 15px 35px rgba(0,0,0,0.6),
        0 0 25px rgba(75,0,130,0.4),
        inset 0 0 20px rgba(128,0,128,0.1);
      position: relative;
      overflow: hidden;
    }

    .god .catchmon-box::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 30% 30%, rgba(75,0,130,0.2) 0%, transparent 50%),
        radial-gradient(circle at 70% 70%, rgba(148,0,211,0.15) 0%, transparent 50%);
      animation: godCardAura 5s ease-in-out infinite;
      pointer-events: none;
      border-radius: 16px;
      z-index: 1;
    }

    @keyframes godCardAura {
      0%, 100% { 
        opacity: 0.4;
        transform: scale(1);
      }
      50% { 
        opacity: 0.8;
        transform: scale(1.02);
      }
    }

    .god .catchmon-box:hover {
      border-color: rgba(75,0,130,0.9);
      box-shadow: 
        0 25px 50px rgba(0,0,0,0.8),
        0 0 40px rgba(75,0,130,0.7);
      transform: translateY(-12px) scale(1.05);
    }

    /* God Image - Mysterious Silhouette */
    .god .catchmon-box img {
      filter: brightness(0) saturate(0) contrast(2);
      position: relative;
      border: 3px solid rgba(75,0,130,0.5);
      box-shadow: 
        0 0 20px rgba(75,0,130,0.6),
        inset 0 0 15px rgba(0,0,0,0.8);
      background: radial-gradient(circle, 
        rgba(25,0,25,0.9) 0%, 
        rgba(0,0,0,1) 70%);
      border-radius: 8px;
    }

    .god .catchmon-box .mystery-overlay {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #9370DB;
      font-weight: 900;
      font-size: 7px;
      z-index: 4;
      text-shadow: 
        0 0 15px rgba(147, 112, 219, 1),
        0 0 30px rgba(75, 0, 130, 0.8),
        0 0 45px rgba(138, 43, 226, 0.6);
      letter-spacing: 0.5px;
      text-align: center;
      line-height: 1.3;
      animation: divineRevealer 4s ease-in-out infinite;
      background: linear-gradient(135deg, 
        rgba(0,0,0,0.9) 0%, 
        rgba(25,0,50,0.8) 50%, 
        rgba(0,0,0,0.9) 100%);
      padding: 3px 6px;
      border-radius: 8px;
      border: 2px solid rgba(147, 112, 219, 0.4);
      box-shadow: 
        0 0 20px rgba(75,0,130,0.3),
        inset 0 0 10px rgba(147, 112, 219, 0.2);
      white-space: nowrap;
    }

    @keyframes divineRevealer {
      0%, 100% { 
        opacity: 0.8;
        text-shadow: 
          0 0 15px rgba(147, 112, 219, 1),
          0 0 30px rgba(75, 0, 130, 0.8);
        transform: translate(-50%, -50%) scale(1);
      }
      50% { 
        opacity: 1;
        text-shadow: 
          0 0 25px rgba(147, 112, 219, 1),
          0 0 50px rgba(75, 0, 130, 1),
          0 0 75px rgba(138, 43, 226, 0.8);
        transform: translate(-50%, -50%) scale(1.05);
      }
    }

    .god .catchmon-box a {
      color: #9370DB;
    }

    .god .catchmon-name {
      color: #9370DB;
      text-shadow: 0 0 5px rgba(147, 112, 219, 0.5);
    }

    .catcher-name {
      display: inline-block;
      font-weight: bold;
      background-size: 200% auto;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 3s linear infinite;
      text-shadow: 0 0 4px rgba(255, 255, 255, 0);
    }

    .king    { background-image: linear-gradient(90deg, #ffd700, white, #ffd700); }
    .flame   { background-image: linear-gradient(90deg, orangered, white, red); }
    .diamond { background-image: linear-gradient(90deg, deepskyblue, white, deepskyblue); }
    .shine   { background-image: linear-gradient(90deg, limegreen, white, limegreen); }
    .normal  {
      color: white;
      font-weight: normal;
      background: none;
      -webkit-text-fill-color: inherit;
      background-clip: unset;
      animation: none;
    }

    @keyframes shine {
      to { background-position: -200% center; }
    }

    .rarity-count {
      background: rgba(255,255,255,0.2);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      margin-top: 10px;
      display: inline-block;
    }

    /* Mobile Optimizations */
    @media (max-width: 768px) {
      .container {
        padding: 15px;
      }

      .top-bar {
        flex-direction: column;
        gap: 10px;
        text-align: center;
        padding: 15px;
      }

      h1 {
        font-size: clamp(1.2rem, 5vw, 1.6rem);
      }

      .rarity-section {
        margin-bottom: 30px;
      }

      .rarity-header {
        padding: 15px;
        margin-bottom: 15px;
      }

      .rarity-title {
        font-size: clamp(1.2rem, 5vw, 1.6rem);
      }

      .dex-grid {
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 12px;
      }

      .catchmon-box {
        width: 100px;
        height: 120px;
        padding: 6px;
      }

      .catchmon-box img {
        max-width: 64px;
        max-height: 64px;
        margin-bottom: 6px;
      }

      .catchmon-name {
        font-size: 10px;
      }

      .god .catchmon-box .mystery-overlay {
        font-size: 6px;
        padding: 2px 4px;
        top: 25%;
      }

      .rarity-count {
        font-size: 12px;
        padding: 6px 12px;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 10px;
      }

      .rarity-header {
        padding: 12px;
      }

      .dex-grid {
        grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
        gap: 10px;
      }

      .catchmon-box {
        width: 90px;
        height: 110px;
        padding: 5px;
      }

      .catchmon-box img {
        max-width: 56px;
        max-height: 56px;
        margin-bottom: 5px;
      }

      .catchmon-name {
        font-size: 9px;
      }

      .god .catchmon-box .mystery-overlay {
        font-size: 5px;
        padding: 1px 3px;
        top: 22%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <a class="back-button" href="javascript:history.back()">← Back</a>
      <h1><span class="catcher-name normal" id="trainerName">Loading…</span>'s Catchdex</h1>
    </div>
    <div id="dexContainer">Loading Catchmon…</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const trainerName = params.get("name");
    const rarityOrder = ["Starter", "Common", "Rare", "Legendary", "Mythical", "God"];
    const rarityEmojis = {
      "Starter": "🌱",
      "Common": "⚪",
      "Rare": "🔵", 
      "Legendary": "🟡",
      "Mythical": "🟣",
      "God": "⚫"
    };

    if (!trainerName) {
      document.getElementById("dexContainer").innerText = "No trainer specified.";
      document.getElementById("trainerName").innerText = "Unknown";
    } else {
      loadCatchdex(trainerName.toLowerCase());
    }

    function censorGodName(name) {
      return "??? ??? ???";
    }

    function buildRaritySection(rarity, pokemons, caughtCount) {
      if (pokemons.length === 0) return '';
      
      const rarityClass = rarity.toLowerCase();
      const emoji = rarityEmojis[rarity] || "❓";
      
      let cardsHtml = '';
      pokemons.forEach(mon => {
        const monName = mon.name.toLowerCase();
        const caught = monName in caughtCount;
        const star = caughtCount[monName] >= 3;
        
        // God Catchmon Namen mysteriös machen
        let displayName = mon.name;
        if (rarity === "God") {
          displayName = censorGodName(mon.name);
        }

        const mysteryOverlay = rarity === "God" ? 
          '<div class="mystery-overlay">🌟 UNKNOWN DIVINITY 🌟</div>' : '';

        cardsHtml += `
          <div class="catchmon-box${caught ? "" : " uncaught"}">
            <a href="dex_detail.html?name=${encodeURIComponent(mon.name)}">
              <img src="${mon.sprite}" alt="${mon.name}">
              ${mysteryOverlay}
              <div class="catchmon-name">${displayName}</div>
              ${star ? '<div class="star">★</div>' : ''}
            </a>
          </div>
        `;
      });

      return `
        <div class="rarity-section ${rarityClass}">
          <div class="rarity-header">
            <h2 class="rarity-title">${emoji} ${rarity}</h2>
            <div class="rarity-count">${pokemons.length} Catchmon</div>
          </div>
          <div class="dex-grid">
            ${cardsHtml}
          </div>
        </div>
      `;
    }

    async function loadCatchdex(trainer) {
      const [dexRes, catcherRes] = await Promise.all([
        fetch("dex_list.json"),
        fetch("catcher.json")
      ]);
      const dexList = await dexRes.json();
      const catchers = (await catcherRes.json()).catcher;
      const trainerData = catchers?.[trainer];
      const container = document.getElementById("dexContainer");
      const nameSpan = document.getElementById("trainerName");

      if (!trainerData) {
        nameSpan.textContent = trainer;
        container.textContent = "Trainer not found.";
        return;
      }

      const team = trainerData.team || [];
      const donation = trainerData.donation || 0;
      const caughtCount = {};
      team.forEach(mon => {
        const monName = mon.name.toLowerCase();
        caughtCount[monName] = (caughtCount[monName] || 0) + 1;
      });

      nameSpan.textContent = trainer;
      nameSpan.className = "catcher-name";
      if (donation >= 2500) nameSpan.classList.add("king");
      else if (donation >= 500) nameSpan.classList.add("flame");
      else if (donation >= 250) nameSpan.classList.add("diamond");
      else if (donation >= 100) nameSpan.classList.add("shine");
      else nameSpan.classList.add("normal");

      // Gruppiere nach Rarity basierend auf dem Sprite-Pfad
      const byRarity = {};
      rarityOrder.forEach(r => byRarity[r] = []);

      dexList.forEach(mon => {
        const parts = mon.sprite.split("/");
        const rarity = parts.length > 1 ? parts[1] : "Common";
        if (byRarity[rarity]) {
          byRarity[rarity].push(mon);
        } else {
          byRarity["Common"].push(mon);
        }
      });

      // Sortiere jede Rarity nach ID
      rarityOrder.forEach(r => {
        if (byRarity[r]) {
          byRarity[r].sort((a, b) => a.id - b.id);
        }
      });

      // Baue HTML für alle Sections
      let html = '';
      rarityOrder.forEach(rarity => {
        const pokemons = byRarity[rarity] || [];
        html += buildRaritySection(rarity, pokemons, caughtCount);
      });

      container.innerHTML = html;
    }
  </script>
</body>
</html>
