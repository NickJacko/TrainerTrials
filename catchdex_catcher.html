<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Catchdex</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 960px;
      margin: auto;
      padding: 16px;
    }
    .top-bar {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
    .back-button {
      font-size: 16px;
      text-decoration: none;
      color: #555;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 6px;
      background: #e0e0e0;
    }
    .back-button:hover {
      background: #ccc;
    }
    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 16px;
    }
    h2 {
      font-size: 18px;
      margin: 24px 0 8px;
      text-align: center;
      color: #333;
    }
    .dex-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .catchmon-box {
      position: relative;
      width: 100px;
      height: 120px;
      border: 2px solid #ccc;
      border-radius: 8px;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 6px;
      text-align: center;
    }
    .catchmon-box img {
      max-width: 80px;
      max-height: 80px;
    }
    .catchmon-box a {
      text-decoration: none;
      color: inherit;
    }
    .uncaught img {
      filter: grayscale(100%) brightness(0.4);
    }
    .star {
      position: absolute;
      top: 4px;
      right: 4px;
      font-size: 16px;
      color: gold;
    }
    .catcher-name {
      display: inline-block;
      font-weight: bold;
      background-size: 200% auto;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 3s linear infinite;
    }
    .king    { background-image: linear-gradient(90deg, #ffd700, white, #ffd700); }
    .flame   { background-image: linear-gradient(90deg, orangered, white, red); }
    .diamond { background-image: linear-gradient(90deg, deepskyblue, white, deepskyblue); }
    .shine   { background-image: linear-gradient(90deg, limegreen, white, limegreen); }
    .normal  {
      color: #444;
      font-weight: normal;
      background: none;
      -webkit-text-fill-color: inherit;
      background-clip: unset;
      animation: none;
    }
    @keyframes shine {
      to { background-position: -200% center; }
    }
    @media (max-width: 600px) {
      .catchmon-box {
        width: 80px;
        height: 100px;
      }
      .catchmon-box img {
        max-width: 64px;
        max-height: 64px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <a class="back-button" href="javascript:history.back()">← Back</a>
    </div>
    <h1><span class="catcher-name normal" id="trainerName">Loading…</span>’s Catchdex</h1>
    <div id="dexContainer">Loading Catchmon…</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const trainerName = params.get("name");
    const rarities = ["Starter", "Common", "Rare", "Legendary", "Mythical", "God"];

    if (!trainerName) {
      document.getElementById("dexContainer").innerText = "No trainer specified.";
      document.getElementById("trainerName").innerText = "Unknown";
    } else {
      loadCatchdex(trainerName.toLowerCase());
    }

    async function loadCatchdex(trainer) {
      const [dexRes, catcherRes] = await Promise.all([
        fetch("dex_list.json"),
        fetch("catcher.json")
      ]);
      const dexList = await dexRes.json();
      const catchers = (await catcherRes.json()).catcher;
      const trainerData = catchers?.[trainer];
      const container = document.getElementById("dexContainer");
      const nameSpan = document.getElementById("trainerName");

      if (!trainerData) {
        nameSpan.textContent = trainer;
        container.textContent = "Trainer not found.";
        return;
      }

      const team = trainerData.team || [];
      const donation = trainerData.donation || 0;
      const caughtCount = {};
      team.forEach(mon => {
        const monName = mon.name.toLowerCase();
        caughtCount[monName] = (caughtCount[monName] || 0) + 1;
      });

      nameSpan.textContent = trainer;
      nameSpan.className = "catcher-name";
      if (donation >= 2500) nameSpan.classList.add("king");
      else if (donation >= 500) nameSpan.classList.add("flame");
      else if (donation >= 250) nameSpan.classList.add("diamond");
      else if (donation >= 100) nameSpan.classList.add("shine");
      else nameSpan.classList.add("normal");

      const byRarity = {};
      rarities.forEach(r => byRarity[r] = []);
      dexList.forEach(mon => {
        const parts = mon.sprite.split("/");
        const rarity = parts.length > 1 ? parts[1] : "Unknown";
        if (!byRarity[rarity]) byRarity[rarity] = [];
        byRarity[rarity].push(mon);
      });
      rarities.forEach(r => {
        if (byRarity[r]) byRarity[r].sort((a, b) => a.id - b.id);
      });

      container.innerHTML = "";
      rarities.forEach(rarity => {
        const mons = byRarity[rarity];
        if (!mons || mons.length === 0) return;

        const header = document.createElement("h2");
        header.textContent = rarity;
        container.appendChild(header);

        const grid = document.createElement("div");
        grid.className = "dex-grid";

        mons.forEach(mon => {
          const nameLower = mon.name.toLowerCase();
          const caught = nameLower in caughtCount;
          const star = caughtCount[nameLower] >= 3;

          const box = document.createElement("div");
          box.className = "catchmon-box" + (caught ? "" : " uncaught");
          box.innerHTML = `
            <a href="dex_detail.html?name=${encodeURIComponent(mon.name)}">
              <img src="${mon.sprite}" alt="${mon.name}">
              <div style="font-size: 12px; margin-top: 4px;">${mon.name}</div>
              ${star ? '<div class="star">★</div>' : ''}
            </a>
          `;
          grid.appendChild(box);
        });

        container.appendChild(grid);
      });
    }
  </script>
</body>
</html>
