<!DOCTYPE html>
<html lang="en">
<head>
  <script src="utils.js"></script>
  <meta charset="UTF-8" />
  <title>📘 Catchdex</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: radial-gradient(ellipse at center, #1a1a2e 0%, #16213e 30%, #0f0f23 70%, #000000 100%);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      color: white;
      overflow-x: hidden;
    }

    /* Animated Background */
    .bg-effects {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0.4;
    }

    .trophy-float {
      position: absolute;
      font-size: 2rem;
      opacity: 0.3;
      animation: floatTrophy 15s linear infinite;
      pointer-events: none;
    }

    @keyframes floatTrophy {
      0% {
        transform: translateY(100vh) rotate(0deg) scale(0.5);
        opacity: 0;
      }
      10% {
        opacity: 0.3;
      }
      90% {
        opacity: 0.3;
      }
      100% {
        transform: translateY(-100px) rotate(360deg) scale(0.8);
        opacity: 0;
      }
    }

    .energy-orb {
      position: absolute;
      width: 6px;
      height: 6px;
      background: radial-gradient(circle, #FFD700, #FFA500);
      border-radius: 50%;
      animation: orbFloat 12s linear infinite;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
    }

    @keyframes orbFloat {
      0% {
        transform: translateY(100vh) translateX(0);
        opacity: 0;
      }
      20% {
        opacity: 0.8;
      }
      80% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-100px) translateX(50px);
        opacity: 0;
      }
    }

    .container {
      max-width: 1400px;
      margin: auto;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    /* Header Section */
    .header-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 20px 30px;
      border: 2px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      position: relative;
      overflow: hidden;
    }

    .header-section::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, 
        transparent, 
        rgba(255, 215, 0, 0.1), 
        transparent, 
        rgba(255, 215, 0, 0.1), 
        transparent);
      animation: headerShine 8s linear infinite;
    }

    @keyframes headerShine {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .header-content {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .back-button {
      font-size: 16px;
      text-decoration: none;
      color: white;
      font-weight: 700;
      padding: 15px 25px;
      border-radius: 15px;
      background: linear-gradient(145deg, rgba(255,255,255,0.15), rgba(255,255,255,0.08));
      border: 2px solid rgba(255,255,255,0.2);
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      backdrop-filter: blur(10px);
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    .back-button:hover {
      transform: translateY(-3px) scale(1.02);
      background: linear-gradient(145deg, rgba(255,255,255,0.25), rgba(255,255,255,0.15));
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      border-color: rgba(255,255,255,0.4);
    }

    h1 {
      text-align: center;
      flex: 1;
      font-size: clamp(2.5rem, 6vw, 4rem);
      background: linear-gradient(45deg, #FFD700, #FF6B6B, #4ECDC4, #45B7D1, #FFD700);
      background-size: 300% 300%;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 4s ease-in-out infinite;
      font-weight: 900;
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
      letter-spacing: -1px;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      25% { background-position: 100% 50%; }
      50% { background-position: 100% 100%; }
      75% { background-position: 0% 100%; }
    }

    .rarity-section {
      margin-bottom: 40px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(15px);
      border-radius: 25px;
      padding: 25px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      position: relative;
      overflow: hidden;
    }

    .rarity-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
      animation: sectionShine 8s linear infinite;
    }

    @keyframes sectionShine {
      0% { left: -100%; }
      50% { left: 100%; }
      100% { left: 100%; }
    }

    .rarity-header {
      text-align: center;
      margin-bottom: 30px;
      position: relative;
      z-index: 2;
    }

    .rarity-title {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      margin: 0 0 15px 0;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    /* Rarity Specific Styles */
    .starter .rarity-title {
      background: linear-gradient(45deg, #4CAF50, #81C784, #A5D6A7);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
    }

    .common .rarity-title {
      background: linear-gradient(45deg, #9E9E9E, #BDBDBD, #E0E0E0);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(158, 158, 158, 0.3);
    }

    .rare .rarity-title {
      background: linear-gradient(45deg, #2196F3, #64B5F6, #90CAF9);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(33, 150, 243, 0.3);
    }

    .legendary .rarity-title {
      background: linear-gradient(45deg, #FF9800, #FFB74D, #FFCC02);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 152, 0, 0.3);
      animation: legendaryPulse 2s ease-in-out infinite alternate;
    }

    .mythical .rarity-title {
      background: linear-gradient(45deg, #9C27B0, #BA68C8, #CE93D8);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(156, 39, 176, 0.3);
      animation: mythicalPulse 2.5s ease-in-out infinite alternate;
    }

    .god .rarity-title {
      background: linear-gradient(45deg, #000000, #424242, #616161, #000000);
      background-size: 200% auto;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: godEffect 3s linear infinite;
      filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
      position: relative;
    }

    .god .rarity-section {
      background: linear-gradient(135deg, 
        rgba(0,0,0,0.3) 0%, 
        rgba(64,0,64,0.2) 25%, 
        rgba(0,0,0,0.4) 50%, 
        rgba(64,0,64,0.2) 75%, 
        rgba(0,0,0,0.3) 100%);
      border: 2px solid rgba(0,0,0,0.5);
      box-shadow: 
        0 0 30px rgba(0,0,0,0.5),
        inset 0 0 20px rgba(255,255,255,0.1);
    }

    @keyframes legendaryPulse {
      0% { 
        filter: brightness(1) drop-shadow(0 0 10px rgba(255, 152, 0, 0.3));
        transform: scale(1);
      }
      100% { 
        filter: brightness(1.3) drop-shadow(0 0 25px rgba(255, 152, 0, 0.6));
        transform: scale(1.02);
      }
    }

    @keyframes mythicalPulse {
      0% { 
        filter: brightness(1) drop-shadow(0 0 15px rgba(156, 39, 176, 0.3));
        transform: scale(1);
      }
      100% { 
        filter: brightness(1.4) drop-shadow(0 0 30px rgba(156, 39, 176, 0.7));
        transform: scale(1.03);
      }
    }

    @keyframes godEffect {
      0% { 
        background-position: 0% 50%;
        filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
      }
      50% {
        filter: drop-shadow(0 0 20px rgba(128,0,128,0.6));
      }
      100% { 
        background-position: 200% 50%;
        filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
      }
    }

    .dex-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 20px;
      justify-items: center;
      position: relative;
      z-index: 2;
    }

    .catchmon-card {
      background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
      border-radius: 20px;
      width: 150px;
      min-height: 220px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 15px;
      text-align: center;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      border: 2px solid transparent;
      overflow: hidden;
      position: relative;
      backdrop-filter: blur(15px);
    }

    .catchmon-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.6s;
    }

    .catchmon-card:hover::before {
      left: 100%;
    }

    .catchmon-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      border-color: rgba(76, 175, 80, 0.3);
    }

    /* God Card Special Effects */
    .god .catchmon-card {
      background: linear-gradient(145deg, #1a1a1a, #2d2d2d);
      border: 2px solid rgba(128,0,128,0.3);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      position: relative;
    }

    .god .catchmon-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(45deg, 
        transparent 30%, 
        rgba(128,0,128,0.1) 50%, 
        transparent 70%);
      animation: godCardGlow 4s ease-in-out infinite;
      pointer-events: none;
      border-radius: 20px;
    }

    @keyframes godCardGlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }

    .god .catchmon-card:hover {
      border-color: rgba(128,0,128,0.6);
      box-shadow: 0 20px 40px rgba(128,0,128,0.3);
    }

    .catchmon-card img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 10px;
      transition: transform 0.3s ease;
      border-radius: 8px;
      position: relative;
      z-index: 2;
    }

    .catchmon-card:hover img {
      transform: scale(1.1);
    }

    /* God Image Effects */
    .god .catchmon-card img {
      filter: brightness(0.6) contrast(1.5) saturate(0.8);
      position: relative;
      border: 2px solid rgba(128,0,128,0.3);
      box-shadow: 0 0 15px rgba(128,0,128,0.4);
    }

    .god .catchmon-card::before {
      content: '⚡ DIVINE POWER ⚡';
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #DAA520;
      font-weight: 900;
      font-size: 10px;
      z-index: 3;
      text-shadow: 
        0 0 10px rgba(218, 165, 32, 0.8),
        0 0 20px rgba(255, 215, 0, 0.6);
      letter-spacing: 1px;
      text-align: center;
      line-height: 1.2;
      animation: divineGlow 3s ease-in-out infinite alternate;
      background: rgba(0,0,0,0.7);
      padding: 3px 6px;
      border-radius: 8px;
      border: 1px solid rgba(218, 165, 32, 0.5);
    }

    @keyframes divineGlow {
      0% { 
        opacity: 0.8;
        text-shadow: 
          0 0 10px rgba(218, 165, 32, 0.8),
          0 0 20px rgba(255, 215, 0, 0.6);
      }
      100% { 
        opacity: 1;
        text-shadow: 
          0 0 15px rgba(218, 165, 32, 1),
          0 0 30px rgba(255, 215, 0, 0.8),
          0 0 40px rgba(255, 255, 255, 0.4);
      }
    }

    .catchmon-card a {
      text-decoration: none;
      color: white;
      font-weight: bold;
      display: block;
      position: relative;
      z-index: 2;
    }

    .god .catchmon-card a {
      color: #800080;
    }

    .catchmon-card .id-name {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      color: white;
      line-height: 1.2;
      position: relative;
      z-index: 2;
    }

    .god .catchmon-card .id-name {
      color: #800080;
      text-shadow: 0 0 5px rgba(128,0,128,0.5);
    }

    .uncaught {
      opacity: 0.5;
    }

    .uncaught img {
      filter: grayscale(100%) brightness(0.4);
    }

    .star {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 20px;
      color: gold;
      z-index: 4;
      filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.8));
      animation: starTwinkle 2s ease-in-out infinite alternate;
    }

    @keyframes starTwinkle {
      0% { transform: scale(1) rotate(0deg); }
      100% { transform: scale(1.2) rotate(15deg); }
    }

    .rarity-count {
      background: rgba(255,255,255,0.2);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      display: inline-block;
    }

    /* Donation Tier Styles */
    .catcher-name {
      display: inline-block;
      font-weight: bold;
      background-size: 200% auto;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 3s linear infinite;
    }

    .king {
      background-image: linear-gradient(90deg, #ffd700, #ffffff, #ffd700);
    }

    .flame {
      background-image: linear-gradient(90deg, #ff0000, #ffffff, #ff0000);
    }

    .diamond {
      background-image: linear-gradient(90deg, #00bfff, #ffffff, #00bfff);
    }

    .shine {
      background-image: linear-gradient(90deg, #32cd32, #ffffff, #32cd32);
    }

    .normal {
      color: white;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
      background: none;
      -webkit-text-fill-color: inherit;
      background-clip: unset;
      animation: none;
    }

    @keyframes shine {
      to {
        background-position: -200% center;
      }
    }

    /* Loading Animation */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
      color: rgba(255,255,255,0.8);
      font-size: 18px;
      position: relative;
      z-index: 2;
    }

    .loading::after {
      content: '';
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      margin-left: 15px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-message {
      text-align: center;
      padding: 60px;
      color: rgba(255,255,255,0.8);
      font-size: 18px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      position: relative;
      z-index: 2;
    }

    /* Mobile Optimizations */
    @media (max-width: 768px) {
      .container {
        padding: 15px;
      }

      .header-section {
        flex-direction: column;
        gap: 20px;
        text-align: center;
        padding: 25px 20px;
      }

      .header-content {
        flex-direction: column;
        gap: 20px;
      }

      .rarity-section {
        padding: 20px 15px;
        margin-bottom: 30px;
      }

      .rarity-title {
        font-size: clamp(1.5rem, 6vw, 2rem);
      }

      .dex-grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 15px;
      }

      .catchmon-card {
        width: 120px;
        min-height: 180px;
        padding: 12px;
      }

      .catchmon-card img {
        width: 80px;
        height: 80px;
        margin-bottom: 8px;
      }

      .catchmon-card .id-name {
        font-size: 12px;
        margin-bottom: 6px;
      }

      .god .catchmon-card::before {
        font-size: 8px;
        padding: 2px 4px;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 10px;
      }

      .rarity-section {
        padding: 15px 10px;
        margin-bottom: 20px;
      }

      .dex-grid {
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 12px;
      }

      .catchmon-card {
        width: 100px;
        min-height: 160px;
        padding: 10px;
      }

      .catchmon-card img {
        width: 70px;
        height: 70px;
        margin-bottom: 6px;
      }

      .catchmon-card .id-name {
        font-size: 11px;
        margin-bottom: 4px;
      }

      .god .catchmon-card::before {
        font-size: 7px;
        padding: 2px 4px;
      }

      .rarity-count {
        font-size: 12px;
        padding: 6px 12px;
      }
    }
  </style>
</head>
<body>
  <!-- Animated Background -->
  <div class="bg-effects" id="bgEffects"></div>

  <div class="container">
    <!-- Header Section -->
    <div class="header-section">
      <div class="header-content">
        <a class="back-button" href="javascript:history.back()">← Back</a>
        <h1 id="catcherTitle">📘 Loading Catchdex...</h1>
        <div></div> <!-- Spacer for flex layout -->
      </div>
    </div>

    <div id="dexContainer">
      <div class="loading">Loading Catchmon</div>
    </div>
  </div>

  <script>
    // Create animated background effects
    function createTrophy() {
      const trophies = ['🏆', '🥇', '👑', '⭐', '💎', '🔥', '⚡'];
      const trophy = document.createElement('div');
      trophy.className = 'trophy-float';
      trophy.textContent = trophies[Math.floor(Math.random() * trophies.length)];
      trophy.style.left = Math.random() * 100 + '%';
      trophy.style.animationDuration = (Math.random() * 8 + 12) + 's';
      trophy.style.animationDelay = Math.random() * 3 + 's';
      
      document.getElementById('bgEffects').appendChild(trophy);
      
      setTimeout(() => {
        if (trophy.parentNode) {
          trophy.parentNode.removeChild(trophy);
        }
      }, 20000);
    }

    function createEnergyOrb() {
      const orb = document.createElement('div');
      orb.className = 'energy-orb';
      orb.style.left = Math.random() * 100 + '%';
      orb.style.animationDuration = (Math.random() * 6 + 8) + 's';
      orb.style.animationDelay = Math.random() * 2 + 's';
      
      document.getElementById('bgEffects').appendChild(orb);
      
      setTimeout(() => {
        if (orb.parentNode) {
          orb.parentNode.removeChild(orb);
        }
      }, 15000);
    }

    // Start background animations
    setInterval(createTrophy, 4000);
    setInterval(createEnergyOrb, 1000);

    // Initial effects
    for (let i = 0; i < 3; i++) {
      setTimeout(createTrophy, i * 2000);
    }
    for (let i = 0; i < 8; i++) {
      setTimeout(createEnergyOrb, i * 500);
    }

    const params = new URLSearchParams(window.location.search);
    const trainerName = params.get("name");
    const rarityOrder = ["Starter", "Common", "Rare", "Legendary", "Mythical", "God"];
    const rarityEmojis = {
      "Starter": "🌱",
      "Common": "⚪",
      "Rare": "🔵", 
      "Legendary": "🟡",
      "Mythical": "🟣",
      "God": "⚫"
    };

    if (!trainerName) {
      document.getElementById("dexContainer").innerHTML = '<div class="error-message">No trainer specified.</div>';
      document.getElementById("catcherTitle").textContent = "📘 Unknown Trainer's Catchdex";
    } else {
      loadCatchdex(trainerName.toLowerCase());
    }

    function censorGodName(name) {
      return "??? ??? ???";
    }

    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function buildRaritySection(rarity, pokemons, caughtCount) {
      if (pokemons.length === 0) return '';
      
      const rarityClass = rarity.toLowerCase();
      const emoji = rarityEmojis[rarity] || "❓";
      
      let cardsHtml = '';
      pokemons.forEach(p => {
        const name = p.name.toLowerCase();
        const caught = name in caughtCount;
        const count = caughtCount[name] || 0;
        const star = count >= 3;
        const id = String(p.id).padStart(3, "0");
        
        // God Catchmon komplett mysteriös machen
        let displayName = capitalize(p.name);
        let displayId = id;
        
        if (rarity === "God") {
          displayName = censorGodName(displayName);
          displayId = "???";
        }
        
        const safeName = capitalize(p.name).replace(/ /g, "_");

        const mysteryOverlay = rarity === "God" ? 
          `<div style="position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); 
                      color: #9370DB; font-weight: 900; font-size: 8px; z-index: 3;
                      text-shadow: 0 0 10px rgba(147, 112, 219, 0.8);
                      background: rgba(0,0,0,0.7); padding: 2px 4px; border-radius: 6px;
                      border: 1px solid rgba(147, 112, 219, 0.5); white-space: nowrap;">
                      ⚡ CLASSIFIED ENTITY ⚡
                   </div>` : '';

cardsHtml += `
          <div class="catchmon-card${caught ? "" : " uncaught"}">
            <a href="dex_detail.html?name=${safeName}">
              <img src="${p.sprite}" alt="${capitalize(p.name)}">
              ${mysteryOverlay}
              <div class="id-name">#${displayId}<br>${displayName}</div>
              ${star ? '<div class="star">★</div>' : ''}
            </a>
          </div>
        `;
      });

      return `
        <div class="rarity-section ${rarityClass}">
          <div class="rarity-header">
            <h2 class="rarity-title">${emoji} ${rarity}</h2>
            <div class="rarity-count">${pokemons.length} Catchmon</div>
          </div>
          <div class="dex-grid">
            ${cardsHtml}
          </div>
        </div>
      `;
    }

    async function loadCatchdex(trainer) {
      try {
        const [dexRes, catcherRes] = await Promise.all([
          fetch("dex_list.json"),
          fetch("catcher.json")
        ]);
        
        if (!dexRes.ok || !catcherRes.ok) {
          throw new Error('Network response was not ok');
        }
        
        const dexList = await dexRes.json();
        const catchers = (await catcherRes.json()).catcher;
        const trainerData = catchers?.[trainer];
        const container = document.getElementById("dexContainer");
        const titleElement = document.getElementById("catcherTitle");

        if (!trainerData) {
          titleElement.innerHTML = `📘 ${capitalize(trainer)}'s Catchdex`;
          container.innerHTML = '<div class="error-message">Trainer not found.</div>';
          return;
        }

        const team = trainerData.team || [];
        const donation = trainerData.donation || 0;
        const caughtCount = {};
        team.forEach(mon => {
          const monName = mon.name.toLowerCase();
          caughtCount[monName] = (caughtCount[monName] || 0) + 1;
        });

        // Update title with styled name
        const styledName = getStyledCatcherName(trainer, donation);
        titleElement.innerHTML = `📘 ${styledName}'s Catchdex`;

        // Gruppiere nach Rarity basierend auf dem Sprite-Pfad
        const byRarity = {};
        rarityOrder.forEach(r => byRarity[r] = []);

        dexList.forEach(mon => {
          const parts = mon.sprite.split("/");
          const rarity = parts.length > 1 ? parts[1] : "Common";
          if (byRarity[rarity]) {
            byRarity[rarity].push(mon);
          } else {
            byRarity["Common"].push(mon);
          }
        });

        // Sortiere jede Rarity nach ID
        rarityOrder.forEach(r => {
          if (byRarity[r]) {
            byRarity[r].sort((a, b) => a.id - b.id);
          }
        });

        // Baue HTML für alle Sections
        let html = '';
        rarityOrder.forEach(rarity => {
          const pokemons = byRarity[rarity] || [];
          html += buildRaritySection(rarity, pokemons, caughtCount);
        });

        container.innerHTML = html;
        
      } catch (error) {
        console.error('Error loading catchdex data:', error);
        const container = document.getElementById("dexContainer");
        const titleElement = document.getElementById("catcherTitle");
        titleElement.innerHTML = `📘 ${capitalize(trainer)}'s Catchdex`;
        container.innerHTML = '<div class="error-message">Error loading data. Please try again later.</div>';
      }
    }
  </script>
</body>
</html>
