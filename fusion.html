<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🔥 Fusion Monitor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .fusion-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      backdrop-filter: blur(10px);
    }

    .fusion-container {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 69, 0, 0.2));
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 40px;
      border: 3px solid rgba(255, 215, 0, 0.5);
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 100px rgba(255, 215, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      position: relative;
      overflow: hidden;
      max-width: 800px;
      text-align: center;
      animation: containerEntrance 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    @keyframes containerEntrance {
      0% {
        opacity: 0;
        transform: scale(0.3) rotate(-10deg);
      }
      50% {
        transform: scale(1.1) rotate(5deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    .fusion-container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, 
        transparent, 
        rgba(255, 215, 0, 0.1), 
        transparent, 
        rgba(255, 215, 0, 0.1), 
        transparent);
      animation: epicShine 3s linear infinite;
    }

    @keyframes epicShine {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .fusion-title {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 900;
      margin-bottom: 30px;
      background: linear-gradient(45deg, #FFD700, #FF6B6B, #4ECDC4, #45B7D1, #FFD700);
      background-size: 300% 300%;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleGradient 2s ease-in-out infinite;
      position: relative;
      z-index: 2;
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
      filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.3));
    }

    @keyframes titleGradient {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .evolution-display {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      margin: 30px 0;
      position: relative;
      z-index: 2;
      flex-wrap: wrap;
    }

    .catchmon-card {
      text-align: center;
      transition: all 1s ease;
      position: relative;
    }

    .catchmon-image {
      width: 150px;
      height: 150px;
      object-fit: contain;
      border-radius: 20px;
      box-shadow: 
        0 10px 30px rgba(0,0,0,0.4),
        0 0 50px rgba(255, 215, 0, 0.3);
      border: 3px solid rgba(255,255,255,0.4);
      transition: all 1s ease;
      animation: imageFloat 3s ease-in-out infinite alternate;
    }

    @keyframes imageFloat {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-10px) scale(1.05); }
    }

    .evolution-arrow {
      font-size: 3rem;
      animation: arrowPulse 1.5s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8));
      position: relative;
      z-index: 2;
    }

    @keyframes arrowPulse {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.3) rotate(10deg); }
    }

    .catchmon-name {
      font-size: 1.3rem;
      font-weight: 700;
      margin-top: 15px;
      color: white;
      text-shadow: 
        0 0 10px rgba(255, 255, 255, 0.8),
        0 2px 10px rgba(0,0,0,0.7);
      position: relative;
      z-index: 2;
    }

    .catcher-info {
      font-size: 1.6rem;
      font-weight: 700;
      margin-top: 25px;
      color: #4ECDC4;
      text-shadow: 
        0 0 15px rgba(78, 205, 196, 0.8),
        0 2px 10px rgba(0,0,0,0.7);
      position: relative;
      z-index: 2;
      animation: catcherGlow 3s ease-in-out infinite alternate;
    }

    @keyframes catcherGlow {
      0% { 
        filter: brightness(1);
        text-shadow: 
          0 0 15px rgba(78, 205, 196, 0.8),
          0 2px 10px rgba(0,0,0,0.7);
      }
      100% { 
        filter: brightness(1.3);
        text-shadow: 
          0 0 25px rgba(78, 205, 196, 1),
          0 0 40px rgba(78, 205, 196, 0.6),
          0 2px 10px rgba(0,0,0,0.7);
      }
    }

    /* Epic Particle Effects */
    .fusion-particle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: radial-gradient(circle, #FFD700, #FFA500);
      border-radius: 50%;
      animation: particleFloat 4s ease-out infinite;
      pointer-events: none;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
    }

    @keyframes particleFloat {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(-200px) scale(0.3) rotate(360deg);
      }
    }

    /* Lightning Effects */
    .lightning-effect {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 1;
    }

    .lightning-bolt {
      position: absolute;
      width: 4px;
      background: linear-gradient(0deg, 
        transparent 0%, 
        rgba(255, 255, 255, 0.9) 20%, 
        rgba(255, 215, 0, 0.8) 50%, 
        rgba(255, 255, 255, 0.9) 80%, 
        transparent 100%);
      animation: lightning 0.4s ease-out;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
    }

    @keyframes lightning {
      0% { 
        opacity: 0; 
        height: 0;
        transform: scaleY(0);
      }
      50% { 
        opacity: 1; 
        height: 100%;
        transform: scaleY(1);
      }
      100% { 
        opacity: 0; 
        height: 100%;
        transform: scaleY(1);
      }
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .fusion-container {
        padding: 30px 20px;
        margin: 20px;
        max-width: 95%;
      }

      .evolution-display {
        flex-direction: column;
        gap: 20px;
      }

      .catchmon-image {
        width: 120px;
        height: 120px;
      }

      .evolution-arrow {
        font-size: 2rem;
        transform: rotate(90deg);
      }
    }
  </style>
</head>
<body>
  <!-- Fusion Overlay -->
  <div class="fusion-overlay" id="fusionOverlay">
    <div class="fusion-container">
      <div class="lightning-effect" id="lightningContainer"></div>
      
      <h1 class="fusion-title">🔥 EPIC FUSION! 🔥</h1>
      
      <div class="evolution-display" id="evolutionDisplay">
        <!-- Evolution wird hier dynamisch eingefügt -->
      </div>
      
      <div class="catcher-info" id="catcherInfo">
        Loading evolution...
      </div>
    </div>
  </div>

  <script>
    let currentAnimation = null;
    let lastFusionCheck = 0;

    // Create epic particles
    function createParticles() {
      const container = document.querySelector('.fusion-container');
      if (!container) return;

      for (let i = 0; i < 25; i++) {
        const particle = document.createElement('div');
        particle.className = 'fusion-particle';
        
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = '90%';
        particle.style.animationDelay = Math.random() * 2 + 's';
        particle.style.animationDuration = (Math.random() * 2 + 3) + 's';
        
        container.appendChild(particle);
        
        setTimeout(() => {
          if (particle.parentNode) {
            particle.parentNode.removeChild(particle);
          }
        }, 5000);
      }
    }

    // Create lightning effects
    function createLightning() {
      const container = document.getElementById('lightningContainer');
      if (!container) return;

      for (let i = 0; i < 5; i++) {
        setTimeout(() => {
          const bolt = document.createElement('div');
          bolt.className = 'lightning-bolt';
          bolt.style.left = Math.random() * 100 + '%';
          bolt.style.height = '100%';
          
          container.appendChild(bolt);
          
          setTimeout(() => {
            if (bolt.parentNode) {
              bolt.parentNode.removeChild(bolt);
            }
          }, 400);
        }, i * 100);
      }
    }

    // Show fusion animation with sequential display for chains
    function showFusionAnimation(fusionData) {
      const overlay = document.getElementById('fusionOverlay');
      const evolutionDisplay = document.getElementById('evolutionDisplay');
      const catcherInfo = document.getElementById('catcherInfo');

      if (!fusionData.evolutions || fusionData.evolutions.length === 0) return;

      // Clear previous content
      evolutionDisplay.innerHTML = '';

      const evolutions = fusionData.evolutions;
      const evolutionCount = evolutions.length;

      // Check if this is a chain evolution (sequential) or multiple separate evolutions
      const isChainEvolution = evolutionCount > 1 && evolutions.some((evo, index) => {
        if (index === 0) return false;
        return evolutions[index - 1].to.name === evo.from.name;
      });

      if (isChainEvolution) {
        // CHAIN EVOLUTION: Show sequentially A→B→C
        showChainEvolution(evolutions, fusionData.catcher);
      } else if (evolutionCount > 1) {
        // MULTIPLE SEPARATE EVOLUTIONS: Show all at once
        showMultipleEvolutions(evolutions, fusionData.catcher);
      } else {
        // SINGLE EVOLUTION: Show normally
        showSingleEvolution(evolutions[0], fusionData.catcher);
      }

      // Show overlay
      overlay.style.display = 'flex';

      // Create effects
      createParticles();
      createLightning();

      // Auto-hide after appropriate time
      const hideDelay = isChainEvolution ? (evolutionCount * 3000 + 5000) : 8000;
      setTimeout(() => {
        overlay.style.display = 'none';
        currentAnimation = null;
      }, hideDelay);
    }

    // Show single evolution
    function showSingleEvolution(evolution, catcher) {
      const evolutionDisplay = document.getElementById('evolutionDisplay');
      const catcherInfo = document.getElementById('catcherInfo');

      evolutionDisplay.innerHTML = `
        <div class="catchmon-card">
          <img class="catchmon-image" src="${evolution.from.sprite}" alt="${evolution.from.name}">
          <div class="catchmon-name">${evolution.from.name}</div>
          <div style="font-size: 0.9rem; opacity: 0.8;">Level ${evolution.from.level}</div>
        </div>
        
        <div class="evolution-arrow">⚡</div>
        
        <div class="catchmon-card">
          <img class="catchmon-image" src="${evolution.to.sprite}" alt="${evolution.to.name}">
          <div class="catchmon-name">${evolution.to.name}</div>
          <div style="font-size: 0.9rem; opacity: 0.8;">Level ${evolution.to.level}</div>
        </div>
      `;

      catcherInfo.textContent = `${catcher}'s ${evolution.from.name} evolved into ${evolution.to.name}!`;
    }

    // Show multiple separate evolutions
    function showMultipleEvolutions(evolutions, catcher) {
      const evolutionDisplay = document.getElementById('evolutionDisplay');
      const catcherInfo = document.getElementById('catcherInfo');

      evolutionDisplay.style.flexDirection = 'column';
      evolutionDisplay.style.gap = '20px';

      let html = '';
      evolutions.forEach((evolution, index) => {
        html += `
          <div style="display: flex; align-items: center; gap: 30px; margin-bottom: 15px;">
            <div class="catchmon-card">
              <img class="catchmon-image" src="${evolution.from.sprite}" alt="${evolution.from.name}" style="width: 120px; height: 120px;">
              <div class="catchmon-name" style="font-size: 1.1rem;">${evolution.from.name}</div>
              <div style="font-size: 0.8rem; opacity: 0.8;">Level ${evolution.from.level}</div>
            </div>
            
            <div class="evolution-arrow" style="font-size: 2rem;">⚡</div>
            
            <div class="catchmon-card">
              <img class="catchmon-image" src="${evolution.to.sprite}" alt="${evolution.to.name}" style="width: 120px; height: 120px;">
              <div class="catchmon-name" style="font-size: 1.1rem;">${evolution.to.name}</div>
              <div style="font-size: 0.8rem; opacity: 0.8;">Level ${evolution.to.level}</div>
            </div>
          </div>
        `;
      });

      evolutionDisplay.innerHTML = html;
      catcherInfo.textContent = `${catcher} triggered ${evolutions.length} epic evolutions!`;
    }

    // Show chain evolution (sequential A→B→C)
    function showChainEvolution(evolutions, catcher) {
      const evolutionDisplay = document.getElementById('evolutionDisplay');
      const catcherInfo = document.getElementById('catcherInfo');
      const title = document.querySelector('.fusion-title');

      // Update title for chain
      title.textContent = '🔥 EPIC CHAIN FUSION! 🔥';

      // Build the full chain display
      let chainHtml = '';
      
      // Add first Catchmon
      chainHtml += `
        <div class="catchmon-card">
          <img class="catchmon-image" src="${evolutions[0].from.sprite}" alt="${evolutions[0].from.name}">
          <div class="catchmon-name">${evolutions[0].from.name}</div>
          <div style="font-size: 0.9rem; opacity: 0.8;">Level ${evolutions[0].from.level}</div>
        </div>
      `;

      // Add each evolution step
      evolutions.forEach((evolution, index) => {
        chainHtml += `
          <div class="evolution-arrow" style="animation-delay: ${index * 0.5}s;">⚡</div>
          <div class="catchmon-card" style="animation-delay: ${index * 0.8}s;">
            <img class="catchmon-image" src="${evolution.to.sprite}" alt="${evolution.to.name}">
            <div class="catchmon-name">${evolution.to.name}</div>
            <div style="font-size: 0.9rem; opacity: 0.8;">Level ${evolution.to.level}</div>
          </div>
        `;
      });

      evolutionDisplay.innerHTML = chainHtml;

      // Build chain text
      const chainNames = [evolutions[0].from.name];
      evolutions.forEach(evo => chainNames.push(evo.to.name));
      const chainText = chainNames.join(' → ');

      catcherInfo.innerHTML = `
        <div>${catcher} triggered an epic chain evolution!</div>
        <div style="font-size: 1.2rem; margin-top: 10px; color: #FFD700;">${chainText}</div>
      `;

      // Animate chain sequentially
      animateChainSequence();
    }

    // Animate chain evolution sequence
    function animateChainSequence() {
      const cards = document.querySelectorAll('.catchmon-card');
      const arrows = document.querySelectorAll('.evolution-arrow');

      // Start with first card visible, others hidden
      cards.forEach((card, index) => {
        if (index === 0) {
          card.style.opacity = '1';
          card.style.transform = 'scale(1)';
        } else {
          card.style.opacity = '0';
          card.style.transform = 'scale(0.5)';
        }
      });

      arrows.forEach(arrow => {
        arrow.style.opacity = '0';
        arrow.style.transform = 'scale(0.5)';
      });

      // Animate each step
      let delay = 1000; // Start delay
      
      for (let i = 0; i < arrows.length; i++) {
        setTimeout(() => {
          // Show arrow
          arrows[i].style.transition = 'all 0.5s ease';
          arrows[i].style.opacity = '1';
          arrows[i].style.transform = 'scale(1)';
          
          // Add extra lightning for this step
          createLightning();
          
          setTimeout(() => {
            // Show next card
            cards[i + 1].style.transition = 'all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            cards[i + 1].style.opacity = '1';
            cards[i + 1].style.transform = 'scale(1)';
            
            // Extra particles for each evolution
            createParticles();
          }, 300);
          
        }, delay + (i * 2000));
      }
    }

    // Check for new fusions
    async function checkForFusions() {
      try {
        const response = await fetch('fusion_trigger.json?' + Date.now());
        const data = await response.json();
        
        if (data.timestamp > lastFusionCheck && data.catcher && data.evolutions.length > 0) {
          lastFusionCheck = data.timestamp;
          
          // Prevent multiple simultaneous animations
          if (currentAnimation) return;
          currentAnimation = data.timestamp;
          
          showFusionAnimation(data);
          
          console.log(`🔥 Fusion animation for ${data.catcher}: ${data.evolutions.length} evolutions`);
        }
      } catch (error) {
        // File doesn't exist yet or other error - that's normal
      }
    }

    // Check every 500ms for new fusions
    setInterval(checkForFusions, 500);

    // Initial check
    checkForFusions();

    console.log('🔥 Fusion Monitor loaded and ready!');
  </script>
</body>
</html>
