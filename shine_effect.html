<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Confetti Finale</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="utils.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 999;
      width: 100%;
      height: 100%;
    }
    #winnerText {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 1001;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      text-shadow: 0 0 10px #000;
      opacity: 0;
      transition: opacity 1s ease;
    }
    #winnerName {
      font-size: 48px;
      font-weight: bold;
    }
    #catchmonLine {
      font-size: 32px;
      margin-top: 12px;
    }

    .catcher-name {
      display: inline-block;
      font-weight: bold;
      background-size: 200% auto;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 3s linear infinite;
      text-shadow: 0 0 4px rgba(255, 255, 255, 0);
    }
    .king {
      background-image: linear-gradient(90deg, #ffd700, white, #ffd700);
    }
    .flame {
      background-image: linear-gradient(90deg, #ff0000, white, #ff0000);
    }
    .diamond {
      background-image: linear-gradient(90deg, deepskyblue, white, deepskyblue);
    }
    .shine {
      background-image: linear-gradient(90deg, limegreen, white, limegreen);
    }
    .normal {
      color: #fff;
      font-weight: normal;
      background: none;
      -webkit-text-fill-color: inherit;
      background-clip: unset;
      animation: none;
    }

    @keyframes shine {
      to { background-position: -200% center; }
    }
  </style>
</head>
<body>
  <canvas id="confettiCanvas" width="1080" height="1920"></canvas>

  <div id="winnerText">
    <div id="winnerName">???</div>
    <div id="catchmonLine">caught ???!</div>
  </div>

  <script>
    const canvas = document.getElementById("confettiCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const width = canvas.width;
    const height = canvas.height;
    const colors = ["#ff0", "#0f0", "#0ff", "#f0f", "#f00", "#00f"];
    const confetti = [];

    function createConfetti() {
      const x = Math.random() * width;
      const y = -10;
      const size = Math.random() * 12 + 8;
      const speedY = Math.random() * 4 + 3;
      const dx = (Math.random() - 0.5) * 2;
      const color = colors[Math.floor(Math.random() * colors.length)];
      const rotate = Math.random() * 360;
      const rotateSpeed = (Math.random() - 0.5) * 10;
      confetti.push({ x, y, size, speedY, dx, color, rotate, rotateSpeed });
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      for (let i = confetti.length - 1; i >= 0; i--) {
        const c = confetti[i];
        c.y += c.speedY;
        c.x += c.dx;
        c.rotate += c.rotateSpeed;

        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate((c.rotate * Math.PI) / 180);
        ctx.fillStyle = c.color;
        ctx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size);
        ctx.restore();

        if (c.y > height + c.size) {
          confetti.splice(i, 1);
        }
      }

      for (let i = 0; i < 10; i++) createConfetti();
      requestAnimationFrame(animate);
    }

    const winnerText = document.getElementById("winnerText");
    const winnerName = document.getElementById("winnerName");
    const catchmonLine = document.getElementById("catchmonLine");

    fetch("spawn_data.json?" + Date.now())
      .then(res => res.json())
      .then(data => {
        const styledName = getStyledCatcherName(data.winner || "???", data.donation || 0);
        winnerName.innerHTML = `🎉 ${styledName} 🎉`;
        catchmonLine.textContent = `caught ${data.name || "???"}!`;
        winnerText.style.opacity = "1";
      });

    animate();

    setTimeout(() => {
      canvas.remove();
      winnerText.remove();
    }, 8000);
  </script>
</body>
</html>
