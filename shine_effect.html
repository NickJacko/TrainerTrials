<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sparkle Rainbow Burst</title>
  <script src="utils.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: radial-gradient(ellipse at center, #2d1b69 0%, #11052c 50%, #000000 100%);
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      width: 100vw;
      height: 100vh;
    }

    #sparkleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      pointer-events: none;
    }

    #imageContainer {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      height: 280px;
      z-index: 3;
      opacity: 1;
      transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    #catchImage {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: brightness(1.3) contrast(1.2) drop-shadow(0 0 20px rgba(50, 205, 50, 0.6));
      border-radius: 50%;
      transition: all 1s ease;
    }

    #rainbowOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 25% 25%, rgba(255, 0, 150, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(0, 255, 150, 0.1) 0%, transparent 50%),
        linear-gradient(45deg, 
          rgba(255, 0, 0, 0.05) 0%, 
          rgba(255, 165, 0, 0.05) 16%, 
          rgba(255, 255, 0, 0.05) 33%, 
          rgba(0, 255, 0, 0.05) 50%, 
          rgba(0, 0, 255, 0.05) 66%, 
          rgba(75, 0, 130, 0.05) 83%, 
          rgba(238, 130, 238, 0.05) 100%);
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      transition: opacity 2s ease;
      animation: rainbowShift 8s linear infinite;
    }

    @keyframes rainbowShift {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    #nameContainer {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: all 2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    #winnerName {
      font-size: clamp(2.2rem, 8vw, 5.5rem);
      font-weight: 800;
      margin-bottom: 18px;
      text-shadow: 
        0 0 12px currentColor,
        0 0 25px currentColor,
        0 0 40px rgba(50, 205, 50, 0.8),
        0 0 60px rgba(144, 238, 144, 0.6),
        0 6px 15px rgba(0,0,0,0.8);
      animation: sparkleGlow 2.2s ease-in-out infinite alternate;
      letter-spacing: 2px;
      white-space: nowrap;
      max-width: 90vw;
      filter: drop-shadow(0 0 15px currentColor);
    }

    #catchLine {
      font-size: clamp(1.6rem, 5vw, 2.8rem);
      color: #F0E68C;
      font-weight: 600;
      text-shadow: 
        0 0 15px rgba(240, 230, 140, 0.9),
        0 0 30px rgba(50, 205, 50, 0.7),
        0 4px 12px rgba(0,0,0,0.8);
      animation: twinklePulse 3s ease-in-out infinite;
      letter-spacing: 1px;
      white-space: nowrap;
      max-width: 90vw;
    }

    @keyframes sparkleGlow {
      0% { 
        filter: brightness(1) drop-shadow(0 0 15px currentColor);
        transform: scale(1) translateY(0);
      }
      100% { 
        filter: brightness(1.6) drop-shadow(0 0 35px currentColor);
        transform: scale(1.06) translateY(-4px);
      }
    }

    @keyframes twinklePulse {
      0%, 100% { 
        opacity: 0.9; 
        transform: translateY(0) scale(1);
        text-shadow: 
          0 0 15px rgba(240, 230, 140, 0.9),
          0 0 30px rgba(50, 205, 50, 0.7),
          0 4px 12px rgba(0,0,0,0.8);
      }
      50% { 
        opacity: 1; 
        transform: translateY(-6px) scale(1.03);
        text-shadow: 
          0 0 25px rgba(240, 230, 140, 1),
          0 0 50px rgba(50, 205, 50, 0.9),
          0 0 70px rgba(144, 238, 144, 0.8),
          0 4px 12px rgba(0,0,0,0.8);
      }
    }

    /* Shine Tier Rainbow Styles */
    .catcher-name {
      display: inline-block;
      font-weight: 800;
      background-size: 600% auto;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbowShine 3.5s linear infinite;
    }

    .king {
      background-image: linear-gradient(45deg, 
        #FFD700, #32CD32, #FFD700, #90EE90, #FFD700, #32CD32);
      color: #FFD700;
    }
    
    .flame {
      background-image: linear-gradient(45deg, 
        #FF6347, #32CD32, #FF8C69, #90EE90, #FF6347, #32CD32);
      color: #FF6347;
    }
    
    .diamond {
      background-image: linear-gradient(45deg, 
        #00CED1, #32CD32, #48D1CC, #90EE90, #00CED1, #32CD32);
      color: #00CED1;
    }
    
    .shine {
      background-image: linear-gradient(45deg, 
        #32CD32, #90EE90, #ADFF2F, #98FB98, #50C878, #7CFC00);
      color: #32CD32;
    }
    
    .normal {
      background-image: linear-gradient(45deg, 
        #32CD32, #90EE90, #ADFF2F, #98FB98, #50C878);
      color: #32CD32;
      background-size: 600% auto;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
      animation: rainbowShine 3.5s linear infinite;
    }

    @keyframes rainbowShine {
      0% { background-position: 0% 50%; }
      100% { background-position: 600% 50%; }
    }

    /* Sparkle Ring Animation */
    .sparkle-ring {
      position: fixed;
      border: 2px solid;
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
      animation: sparkleExpand 2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    .sparkle-ring.green {
      border-color: rgba(50, 205, 50, 0.8);
      box-shadow: 0 0 20px rgba(50, 205, 50, 0.6), inset 0 0 20px rgba(50, 205, 50, 0.3);
    }

    .sparkle-ring.rainbow {
      border: 3px solid;
      border-image: linear-gradient(45deg, 
        #ff0000, #ff8000, #ffff00, #80ff00, #00ff00, #00ff80, 
        #00ffff, #0080ff, #0000ff, #8000ff, #ff00ff, #ff0080) 1;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.8);
    }

    @keyframes sparkleExpand {
      0% {
        width: 0;
        height: 0;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
      }
      70% {
        opacity: 0.8;
        transform: translate(-50%, -50%) scale(1.1) rotate(180deg);
      }
      100% {
        width: 600px;
        height: 600px;
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.9) rotate(360deg);
      }
    }

    /* Floating Stars */
    .floating-star {
      position: fixed;
      pointer-events: none;
      z-index: 6;
      font-size: 20px;
      animation: floatUp 4s ease-out forwards;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) rotate(0deg) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-300px) rotate(720deg) scale(0.3);
      }
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      #imageContainer {
        width: 240px;
        height: 240px;
      }

      #winnerName {
        font-size: clamp(1.8rem, 12vw, 4rem);
        letter-spacing: 1px;
      }

      #catchLine {
        font-size: clamp(1.2rem, 8vw, 2.2rem);
        letter-spacing: 0.5px;
      }
    }
  </style>
</head>
<body>
  <canvas id="sparkleCanvas"></canvas>
  
  <div id="imageContainer">
    <img id="catchImage" src="" alt="Catchmon">
  </div>

  <div id="rainbowOverlay"></div>

  <div id="nameContainer">
    <div id="winnerName">???</div>
    <div id="catchLine">caught ???!</div>
  </div>

  <audio id="sparkleSound" src="sounds/normal.mp3" preload="auto"></audio>

  <script>
    const canvas = document.getElementById('sparkleCanvas');
    const ctx = canvas.getContext('2d');
    const imageContainer = document.getElementById('imageContainer');
    const catchImage = document.getElementById('catchImage');
    const rainbowOverlay = document.getElementById('rainbowOverlay');
    const nameContainer = document.getElementById('nameContainer');
    const winnerName = document.getElementById('winnerName');
    const catchLine = document.getElementById('catchLine');

    let effectStarted = false;
    let sparkles = [];
    let rainbowParticles = [];
    let animationTime = 0;

    // Canvas Setup
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Load spawn data
    fetch("spawn_data.json?" + Date.now())
      .then(res => res.json())
      .then(data => {
        const styledName = getStyledCatcherName(data.winner || "???", data.donation || 0);
        const tier = getDonationTier(data.donation || 0);
        
        winnerName.innerHTML = styledName;
        winnerName.className = `catcher-name ${tier}`;
        catchLine.textContent = `caught ${data.name || "???"}!`;
        
        if (data.sprite) {
          catchImage.src = data.sprite;
          catchImage.onload = () => {
            setTimeout(startSparkleEffect, 400);
          };
        }
      })
      .catch(err => {
        console.error("Error loading spawn data:", err);
        startSparkleEffect();
      });

    // Sound Effect
    window.addEventListener("DOMContentLoaded", () => {
      const sparkleAudio = document.getElementById("sparkleSound");
      if (sparkleAudio) {
        sparkleAudio.volume = 0.5;
        sparkleAudio.play().catch(() => {
          console.log("Autoplay blocked");
        });
      }
    });

    // Sparkle Particle Class
    class SparkleParticle {
      constructor(x, y, type = 'normal') {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = (Math.random() - 0.5) * 6 - Math.random() * 3;
        this.life = 1.0;
        this.size = Math.random() * 8 + 4;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotationSpeed = (Math.random() - 0.5) * 0.2;
        this.sparkleIntensity = Math.random();
        this.type = type;
        this.hue = Math.random() * 360;
        this.twinkle = Math.random() * Math.PI * 2;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.1; // gravity
        this.vx *= 0.99;
        this.vy *= 0.98;
        this.rotation += this.rotationSpeed;
        this.life -= 0.008;
        this.size *= 0.998;
        this.twinkle += 0.2;
        this.hue += 2;
        return this.life > 0 && this.size > 1;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = this.life * (0.7 + Math.sin(this.twinkle) * 0.3);
        
        // Sparkle glow
        const glowSize = this.size * 3;
        const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, glowSize);
        
        if (this.type === 'rainbow') {
          gradient.addColorStop(0, `hsla(${this.hue}, 100%, 70%, ${this.life})`);
          gradient.addColorStop(0.4, `hsla(${this.hue + 60}, 100%, 60%, ${this.life * 0.8})`);
          gradient.addColorStop(1, `hsla(${this.hue + 120}, 100%, 50%, 0)`);
        } else {
          gradient.addColorStop(0, `rgba(255, 255, 255, ${this.life})`);
          gradient.addColorStop(0.3, `rgba(144, 238, 144, ${this.life * 0.8})`);
          gradient.addColorStop(0.7, `rgba(50, 205, 50, ${this.life * 0.6})`);
          gradient.addColorStop(1, `rgba(50, 205, 50, 0)`);
        }
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(0, 0, glowSize, 0, Math.PI * 2);
        ctx.fill();
        
        // Star shape
        ctx.fillStyle = this.type === 'rainbow' ? 
          `hsla(${this.hue}, 100%, 90%, ${this.life})` : 
          `rgba(255, 255, 255, ${this.life})`;
        
        ctx.beginPath();
        const spikes = 6;
        const outerRadius = this.size;
        const innerRadius = this.size * 0.4;
        
        for (let i = 0; i < spikes * 2; i++) {
          const angle = (i * Math.PI) / spikes;
          const radius = i % 2 === 0 ? outerRadius : innerRadius;
          const x = Math.cos(angle) * radius;
          const y = Math.sin(angle) * radius;
          
          if (i === 0) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        }
        ctx.closePath();
        ctx.fill();
        
        // Bright center
        ctx.fillStyle = `rgba(255, 255, 255, ${this.life})`;
        ctx.beginPath();
        ctx.arc(0, 0, this.size * 0.3, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
      }
    }

    // Rainbow Particle Class
    class RainbowParticle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 4;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.size = Math.random() * 6 + 3;
        this.hue = Math.random() * 360;
        this.trail = [];
      }

      update() {
        this.trail.push({x: this.x, y: this.y, life: this.life});
        if (this.trail.length > 10) this.trail.shift();
        
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.97;
        this.vy *= 0.97;
        this.life -= 0.012;
        this.hue += 3;
        return this.life > 0;
      }

      draw() {
        // Draw trail
        this.trail.forEach((point, i) => {
          const alpha = (i / this.trail.length) * point.life * 0.5;
          const size = this.size * (i / this.trail.length) * 0.7;
          
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = `hsla(${this.hue - i * 10}, 100%, 60%, ${alpha})`;
          ctx.beginPath();
          ctx.arc(point.x, point.y, size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        // Draw main particle
        ctx.save();
        ctx.globalAlpha = this.life;
        
        const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 2);
        gradient.addColorStop(0, `hsla(${this.hue}, 100%, 80%, ${this.life})`);
        gradient.addColorStop(0.7, `hsla(${this.hue + 60}, 100%, 60%, ${this.life * 0.7})`);
        gradient.addColorStop(1, `hsla(${this.hue + 120}, 100%, 40%, 0)`);
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = `hsla(${this.hue}, 100%, 95%, ${this.life})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
      }
    }

    function createSparkleRing(x, y, type = 'green', delay = 0) {
      setTimeout(() => {
        const ring = document.createElement('div');
        ring.className = `sparkle-ring ${type}`;
        ring.style.left = x + 'px';
        ring.style.top = y + 'px';
        document.body.appendChild(ring);
        
        setTimeout(() => {
          ring.remove();
        }, 2000);
      }, delay);
    }

    function createFloatingStars(centerX, centerY, count = 12) {
      const starEmojis = ['✨', '⭐', '🌟', '💫', '⚡'];
      
      for (let i = 0; i < count; i++) {
        const star = document.createElement('div');
        star.className = 'floating-star';
        star.textContent = starEmojis[Math.floor(Math.random() * starEmojis.length)];
        
        const angle = (i / count) * Math.PI * 2;
        const distance = Math.random() * 80 + 40;
        const x = centerX + Math.cos(angle) * distance;
        const y = centerY + Math.sin(angle) * distance;
        
        star.style.left = x + 'px';
        star.style.top = y + 'px';
        star.style.color = `hsl(${Math.random() * 360}, 100%, 70%)`;
        star.style.animationDelay = Math.random() * 2 + 's';
        
        document.body.appendChild(star);
        
        setTimeout(() => {
          star.remove();
        }, 4000);
      }
    }

    function startSparkleEffect() {
      effectStarted = true;
      
      const rect = imageContainer.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      // Initial sparkle rings
      setTimeout(() => {
        createSparkleRing(centerX, centerY, 'green');
        createFloatingStars(centerX, centerY, 8);
      }, 200);

      setTimeout(() => {
        createSparkleRing(centerX, centerY, 'rainbow');
      }, 600);

      // BIG SPARKLE BURST
      setTimeout(() => {
        // Create massive sparkle explosion
        for (let i = 0; i < 60; i++) {
          const angle = (i / 60) * Math.PI * 2;
          const distance = Math.random() * 120 + 30;
          const x = centerX + Math.cos(angle) * distance;
          const y = centerY + Math.sin(angle) * distance;
          
          sparkles.push(new SparkleParticle(x, y, i % 3 === 0 ? 'rainbow' : 'normal'));
        }

        // Rainbow particles
        for (let i = 0; i < 30; i++) {
          rainbowParticles.push(new RainbowParticle(centerX, centerY));
        }
        
        // More floating stars
        createFloatingStars(centerX, centerY, 16);
        
        // Image transformation
        imageContainer.style.transform = 'translate(-50%, -50%) scale(1.2) rotate(360deg)';
        imageContainer.style.filter = 'brightness(2) contrast(1.5) saturate(1.5) hue-rotate(120deg)';
        
        setTimeout(() => {
          imageContainer.style.transform = 'translate(-50%, -50%) scale(0.7) rotate(0deg)';
          imageContainer.style.opacity = '0.3';
          imageContainer.style.filter = 'brightness(3) blur(5px)';
        }, 800);
        
      }, 1000);

      // Rainbow overlay
      setTimeout(() => {
        rainbowOverlay.style.opacity = '1';
      }, 1400);

      // Show name
      setTimeout(() => {
        nameContainer.style.opacity = '1';
        nameContainer.style.transform = 'translate(-50%, -50%) scale(1)';
      }, 1800);
    }

    function updateEffect() {
      if (!effectStarted) return;
      
      animationTime += 0.016;
      
      // Update sparkles
      sparkles = sparkles.filter(sparkle => sparkle.update());
      
      // Update rainbow particles
      rainbowParticles = rainbowParticles.filter(particle => particle.update());
      
      // Add continuous sparkles
      if (animationTime < 4 && Math.random() < 0.4) {
        const x = canvas.width * 0.5 + (Math.random() - 0.5) * 300;
        const y = canvas.height * 0.5 + (Math.random() - 0.5) * 200;
        sparkles.push(new SparkleParticle(x, y, Math.random() < 0.3 ? 'rainbow' : 'normal'));
      }
    }

    function drawEffect() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Draw sparkles
      sparkles.forEach(sparkle => sparkle.draw());
      
      // Draw rainbow particles
      rainbowParticles.forEach(particle => particle.draw());
      
      // Add magical atmosphere
      if (animationTime > 1.2) {
        const intensity = Math.min(0.3, (animationTime - 1.2) / 2);
        ctx.save();
        ctx.globalAlpha = intensity * 0.5;
        
        for (let i = 0; i < 6; i++) {
          const x = (Math.sin(animationTime * 1.5 + i) * 0.3 + 0.5) * canvas.width;
          const y = (Math.cos(animationTime * 1.2 + i * 0.8) * 0.2 + 0.4) * canvas.height;
          const size = 50 + Math.sin(animationTime * 3 + i) * 25;
          const hue = (animationTime * 50 + i * 60) % 360;
          
          const gradient = ctx.createRadialGradient(x, y, 0, x, y, size);
          gradient.addColorStop(0, `hsla(${hue}, 100%, 70%, 0.15)`);
          gradient.addColorStop(1, `hsla(${hue}, 100%, 50%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    function animate() {
      updateEffect();
      drawEffect();
      requestAnimationFrame(animate);
    }

    // Start animation
    animate();

    // Cleanup after effect
    setTimeout(() => {
      canvas.remove();
      imageContainer.remove();
      rainbowOverlay.remove();
      nameContainer.remove();
    }, 7000);
  </script>
</body>
</html>
