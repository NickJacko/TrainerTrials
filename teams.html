<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Trainer Teams</title>
  <style>
    body { font-family: Arial, sans-serif; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px; border: 1px solid #ddd; text-align: left; }
    th { background-color: #f2f2f2; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Trainer Teams</h2>
  <input type="text" id="searchInput" placeholder="Search by trainer name..." onkeyup="filterTable()">
  <table id="teamsTable">
    <thead><tr>
      <th onclick="sortTable(0)">Trainer</th>
      <th onclick="sortTable(1)">Coins</th>
      <th>Team (Caught Pokémon)</th>
    </tr></thead>
    <tbody>
      <tr><td style="color:gold; font-weight:bold;">💎 Nick</td><td>6000</td><td>Turtwig</td></tr>
      <tr><td style="color:inherit; font-weight:bold;"> thix1300</td><td>32</td><td>Growlithe</td></tr>
      <tr><td style="color:inherit; font-weight:bold;"> Moritzlolii</td><td>9</td><td></td></tr>
      <tr><td style="color:inherit; font-weight:bold;"> TrainerTrials</td><td>7</td><td></td></tr>
    </tbody>
  </table>
  <script>
    function filterTable() {
      var input = document.getElementById("searchInput");
      var filter = input.value.toUpperCase();
      var table = document.getElementById("teamsTable");
      var tr = table.getElementsByTagName("tr");
      for (var i = 1; i < tr.length; i++) {
        var td = tr[i].getElementsByTagName("td")[0];
        tr[i].style.display = (td && td.innerHTML.toUpperCase().indexOf(filter) > -1) ? "" : "none";
      }
    }
    function sortTable(n) {
      var table = document.getElementById("teamsTable");
      var switching = true;
      var dir = "asc";
      while (switching) {
        switching = false;
        var rows = table.rows;
        for (var i = 1; i < (rows.length - 1); i++) {
          var shouldSwitch = false;
          var x = rows[i].getElementsByTagName("TD")[n];
          var y = rows[i+1].getElementsByTagName("TD")[n];
          if (!x || !y) continue;
          var cmpX = (n==1) ? parseInt(x.innerHTML) : x.innerHTML.toUpperCase();
          var cmpY = (n==1) ? parseInt(y.innerHTML) : y.innerHTML.toUpperCase();
          if ((dir == "asc" && cmpX > cmpY) || (dir == "desc" && cmpX < cmpY)) {
            shouldSwitch = true;
            break;
          }
        }
        if (shouldSwitch) {
          rows[i].parentNode.insertBefore(rows[i+1], rows[i]);
          switching = true;
        } else {
          if (dir == "asc") {
            dir = "desc";
            switching = true;
          }
        }
      }
    }
  </script>
</body>
</html>
