<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<title>Light — Das Tor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:1080px;height:1920px;
  overflow:hidden;
  background:#000;
  position:relative;
}
canvas{
  position:absolute;top:0;left:0;
  width:1080px;height:1920px;
  pointer-events:none;
}
#zone-top{
  position:absolute;top:0;left:0;width:1080px;height:120px;
  background:linear-gradient(to bottom,rgba(0,0,6,0.55) 0%,transparent 100%);
  z-index:50;pointer-events:none;
}
#zone-bot{
  position:absolute;bottom:0;left:0;width:1080px;height:920px;
  background:linear-gradient(to top,rgba(0,0,6,0.48) 0%,transparent 100%);
  z-index:50;pointer-events:none;
}
#vignette{
  position:absolute;top:0;left:0;width:1080px;height:1920px;
  background:radial-gradient(ellipse 92% 92% at 50% 50%,transparent 28%,rgba(0,0,8,0.65) 100%);
  z-index:49;pointer-events:none;
}
#center-darken{
  position:absolute;left:150px;top:300px;width:780px;height:540px;
  background:radial-gradient(ellipse at center,rgba(0,0,4,0.28) 0%,transparent 70%);
  z-index:48;pointer-events:none;
}
</style>
</head>
<body>

<canvas id="cvSky"    style="z-index:1"></canvas>
<canvas id="cvClouds" style="z-index:2"></canvas>
<canvas id="cvStairs" style="z-index:3"></canvas>
<canvas id="cvGate"   style="z-index:4"></canvas>
<canvas id="cvPart"   style="z-index:5"></canvas>

<div id="zone-top"></div>
<div id="zone-bot"></div>
<div id="vignette"></div>
<div id="center-darken"></div>

<script>
'use strict';
const W=1080, H=1920, CX=540, CY=590, RING_R=300;

['cvSky','cvClouds','cvStairs','cvGate','cvPart'].forEach(id=>{
  const c=document.getElementById(id); c.width=W; c.height=H;
});
const gc=id=>document.getElementById(id).getContext('2d');
const ctxSky   =gc('cvSky');
const ctxClouds=gc('cvClouds');
const ctxStairs=gc('cvStairs');
const ctxGate  =gc('cvGate');
const ctxPart  =gc('cvPart');

document.getElementById('cvClouds').style.mixBlendMode='screen';
document.getElementById('cvStairs').style.mixBlendMode='screen';
document.getElementById('cvGate').style.mixBlendMode  ='screen';
document.getElementById('cvPart').style.mixBlendMode  ='screen';

let t=0, last=performance.now();
const rng=(a,b)=>a+(b-a)*Math.random();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,x)=>a+(b-a)*x;
const eio=(x)=>x<.5?2*x*x:1-(-2*x+2)**2/2;
const hash=(n)=>{ let x=Math.sin(n)*43758.5453; return x-Math.floor(x); };

// ── LAYOUT ───────────────────────────────────────────────────────────────────
// Gate: large, centered near top of screen, the dominant visual element
const GATE_CX  = CX;
const GATE_CY  = 560;                 // lower — catchmon in gate at CY height
const GATE_W   = 420;
const GATE_H   = 620;
const PIL_W    = 38;
const PIL_LX   = GATE_CX - GATE_W/2 - PIL_W;
const PIL_RX   = GATE_CX + GATE_W/2 + PIL_W;
const GATE_TOP = GATE_CY - GATE_H/2;
const GATE_BOT = GATE_CY + GATE_H/2;

const STAIR_BOT  = H*0.86;
const STAIR_TOP  = GATE_BOT + 10;
const STAIR_STEPS= 20;
const STAIR_W_BOT= 720;
const STAIR_W_TOP= GATE_W + PIL_W*2 + 20;

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 1 — SKY
// ─────────────────────────────────────────────────────────────────────────────
const STARS=Array.from({length:260},(_,i)=>({
  x:hash(i*127.1)*W,
  y:hash(i*311.7)*H*0.75,
  r:rng(0.3,1.9),
  a:rng(0.2,0.88),
  ph:rng(0,Math.PI*2),
  sp:rng(0.15,0.95),
}));

function drawSky(){
  const c=ctxSky;
  c.clearRect(0,0,W,H);

  // Base sky — deep night blue, darkest at very top
  const bg=c.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,   '#000009');
  bg.addColorStop(0.06,'#00010e');
  bg.addColorStop(0.15,'#000318');
  bg.addColorStop(0.28,'#010a28');
  bg.addColorStop(0.42,'#021538');
  bg.addColorStop(0.56,'#031d48');
  bg.addColorStop(0.68,'#042255');
  bg.addColorStop(0.78,'#031c48');
  bg.addColorStop(0.88,'#021235');
  bg.addColorStop(1,   '#010820');
  c.fillStyle=bg; c.fillRect(0,0,W,H);

  // The supernatural blue behind and around the gate
  const gBlue=c.createRadialGradient(GATE_CX,GATE_CY,0,GATE_CX,GATE_CY,700);
  gBlue.addColorStop(0,  `rgba(35,90,220,${0.30+0.07*Math.sin(t*0.18)})`);
  gBlue.addColorStop(0.18,`rgba(25,65,185,${0.20+0.05*Math.sin(t*0.15+1)})`);
  gBlue.addColorStop(0.38,`rgba(16,42,145,0.12)`);
  gBlue.addColorStop(0.65,`rgba(8,22,95,0.05)`);
  gBlue.addColorStop(1,  'rgba(0,0,0,0)');
  c.fillStyle=gBlue; c.fillRect(0,0,W,H);

  // Warm horizon glow rising from cloud layer
  const warmRise=c.createLinearGradient(0,STAIR_BOT-200,0,H);
  warmRise.addColorStop(0,  'rgba(0,0,0,0)');
  warmRise.addColorStop(0.3,`rgba(22,16,5,${0.25+0.06*Math.sin(t*0.1)})`);
  warmRise.addColorStop(0.65,`rgba(38,26,8,0.38)`);
  warmRise.addColorStop(1,  `rgba(55,38,10,0.52)`);
  c.fillStyle=warmRise; c.fillRect(0,STAIR_BOT-200,W,H-(STAIR_BOT-200));

  // Stars
  STARS.forEach(s=>{
    const tw=0.5+0.5*Math.sin(t*s.sp+s.ph);
    c.globalAlpha=s.a*tw;
    c.fillStyle='rgba(215,228,255,1)';
    c.shadowColor='rgba(190,210,255,0.35)'; c.shadowBlur=s.r*2;
    c.beginPath(); c.arc(s.x,s.y,s.r,0,Math.PI*2); c.fill();
    c.shadowBlur=0;
  });
  c.globalAlpha=1;

  // Gate radiance — wide soft light emanating outward from the gate
  const radiance=c.createRadialGradient(GATE_CX,GATE_CY,50,GATE_CX,GATE_CY,850);
  radiance.addColorStop(0,  `rgba(255,242,175,${0.10+0.04*Math.sin(t*0.28)})`);
  radiance.addColorStop(0.2,`rgba(235,215,140,${0.055})`);
  radiance.addColorStop(0.45,`rgba(200,175,100,0.025)`);
  radiance.addColorStop(1,  'rgba(0,0,0,0)');
  c.fillStyle=radiance; c.fillRect(0,0,W,H);
}

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 2 — CLOUDS: cloud floor + orbiting reverent clouds
// ─────────────────────────────────────────────────────────────────────────────
const CLOUD_FLOOR=Array.from({length:26},(_,i)=>({
  x:rng(-100,W+100),
  y:rng(STAIR_BOT-30,H*0.92),
  rx:rng(90,380), ry:rng(20,68),
  alpha:rng(0.09,0.24),
  phase:rng(0,Math.PI*2), speed:rng(0.004,0.014),
  vx:rng(-0.022,0.022),
  litFrac:rng(0.3,1.0),
}));

// Clouds orbiting the gate — they circle it like planets, with Ehrfurcht
const ORB_CLOUDS=Array.from({length:18},(_,i)=>{
  const baseR=rng(320,650);
  return {
    angle: rng(0,Math.PI*2),
    orbitRx: baseR,
    orbitRy: baseR*rng(0.18,0.32),  // flattened ellipse
    orbitCY: rng(GATE_CY+80,STAIR_BOT-80),
    speed: rng(0.012,0.038)*(Math.random()<0.5?1:-1),
    size: rng(50,155),
    alpha: rng(0.10,0.26),
    phase: rng(0,Math.PI*2),
    subN: Math.floor(rng(3,8)),
    subOff: Array.from({length:8},()=>({
      ox:rng(-120,120), oy:rng(-40,30), r:rng(0.3,0.7)
    })),
  };
});

function drawClouds(dt){
  const c=ctxClouds;
  c.clearRect(0,0,W,H);

  // Cloud floor
  CLOUD_FLOOR.forEach(cf=>{
    cf.x+=cf.vx*dt*60;
    if(cf.x<-cf.rx*2) cf.x=W+cf.rx;
    if(cf.x>W+cf.rx*2) cf.x=-cf.rx;
    const pulse=0.82+0.18*Math.sin(t*cf.speed+cf.phase);
    const gDist=Math.hypot(cf.x-GATE_CX,(cf.y-GATE_CY)*3)/500;
    const lit=Math.max(0,1-gDist)*cf.litFrac;
    const lig=lerp(55,92,lit);
    const sat=lerp(4,24,lit);
    c.save();
    c.globalAlpha=cf.alpha*pulse;
    c.translate(cf.x,cf.y);
    const g=c.createRadialGradient(0,-cf.ry*0.08,0,0,0,cf.rx);
    g.addColorStop(0,  `hsl(44,${sat}%,${lig}%)`);
    g.addColorStop(0.4,`hsl(42,${Math.max(0,sat-7)}%,${lig-18}%)`);
    g.addColorStop(0.75,`hsl(40,${Math.max(0,sat-14)}%,${lig-35}%)`);
    g.addColorStop(1,  'rgba(0,0,0,0)');
    c.scale(1,cf.ry/cf.rx);
    c.shadowColor=`hsl(44,40%,72%)`; c.shadowBlur=cf.ry*lit*2.5;
    c.fillStyle=g; c.beginPath(); c.arc(0,0,cf.rx,0,Math.PI*2); c.fill();
    c.shadowBlur=0;
    c.restore();
  });

  // Orbiting clouds
  ORB_CLOUDS.forEach(oc=>{
    oc.angle+=oc.speed*dt;
    const ox=Math.cos(oc.angle)*oc.orbitRx;
    const oy=Math.sin(oc.angle)*oc.orbitRy;
    const ccx=GATE_CX+ox, ccy=oc.orbitCY+oy;
    const pulse=0.78+0.22*Math.sin(t*0.08+oc.phase);
    const gProx=Math.max(0,1-Math.hypot(ox,oy*4)/400);

    c.save();
    c.globalAlpha=oc.alpha*pulse;

    const drawBlob=(bx,by,br)=>{
      const bl=lerp(58,92,gProx);
      const bs=lerp(5,28,gProx);
      const bg2=c.createRadialGradient(bx,by-br*0.12,0,bx,by,br);
      bg2.addColorStop(0,  `hsl(44,${bs}%,${bl}%)`);
      bg2.addColorStop(0.5,`hsl(42,${Math.max(0,bs-8)}%,${bl-22}%)`);
      bg2.addColorStop(1,  'rgba(0,0,0,0)');
      c.shadowColor=`rgba(245,220,140,${gProx*0.28})`; c.shadowBlur=br*0.35*gProx;
      c.fillStyle=bg2; c.beginPath(); c.arc(bx,by,br,0,Math.PI*2); c.fill();
      c.shadowBlur=0;
    };

    drawBlob(ccx,ccy,oc.size);
    for(let si=0;si<oc.subN;si++){
      const so=oc.subOff[si];
      drawBlob(ccx+so.ox,ccy+so.oy,oc.size*so.r);
    }
    c.restore();
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 3 — STAIRCASE: 2D perspective staircase, painted not computed
// Trapezoid steps converging toward gate — clean, readable, impressive
// ─────────────────────────────────────────────────────────────────────────────

function buildStairPath(){
  // Each step: a trapezoid pair (tread + riser face)
  // Steps get narrower and shorter as they go up (perspective)
  const steps=[];
  for(let i=0;i<STAIR_STEPS;i++){
    const frac=i/(STAIR_STEPS-1);           // 0=bottom, 1=top
    const ease=eio(frac);

    // Y positions — bottom step at STAIR_BOT, top near GATE_BOT
    const stepBotY=lerp(STAIR_BOT, STAIR_TOP+40, ease);
    const stepTopY=lerp(STAIR_BOT, STAIR_TOP+40, eio((i+1)/(STAIR_STEPS-1)));

    // Width — tapers toward gate width
    const stepBotW=lerp(STAIR_W_BOT, STAIR_W_TOP, ease)/2;
    const stepTopW=lerp(STAIR_W_BOT, STAIR_W_TOP, eio((i+1)/(STAIR_STEPS-1)))/2;

    // Tread height (visual) gets smaller toward top
    const treadH=lerp(22,6,ease);

    steps.push({
      i, frac: ease,
      // Tread top edge
      tl:{x:CX-stepTopW, y:stepTopY},
      tr:{x:CX+stepTopW, y:stepTopY},
      // Tread bottom edge (= riser top)
      bl:{x:CX-stepBotW, y:stepBotY},
      br:{x:CX+stepBotW, y:stepBotY},
      treadH,
    });
  }
  return steps;
}
const STAIRS=buildStairPath();

// Pre-render static staircase to offscreen
const stairOff=document.createElement('canvas');
stairOff.width=W; stairOff.height=H;
(function renderStairs(){
  const c=stairOff.getContext('2d');
  c.clearRect(0,0,W,H);

  // Draw from bottom to top so upper steps overlap lower
  [...STAIRS].reverse().forEach(step=>{
    const {frac,tl,tr,bl,br,treadH}=step;
    const distFade=frac;         // brighter near gate (top)
    const nearBright=1-frac;     // brighter at bottom (nearer viewer)

    // ── TREAD (horizontal top surface) ───────────────────────────────────
    // Top face — lit from above by gate light, brighter toward top
    const treadLit=lerp(0.18,0.72,frac);
    const treadG=c.createLinearGradient(CX,tl.y,CX,bl.y);
    treadG.addColorStop(0, `rgba(255,250,215,${treadLit*0.95})`);
    treadG.addColorStop(0.5,`rgba(245,238,195,${treadLit*0.7})`);
    treadG.addColorStop(1, `rgba(230,220,175,${treadLit*0.45})`);

    c.fillStyle=treadG;
    c.shadowColor='rgba(255,245,185,0.25)'; c.shadowBlur=frac*12;
    c.beginPath();
    c.moveTo(tl.x,tl.y); c.lineTo(tr.x,tr.y);
    c.lineTo(br.x,br.y); c.lineTo(bl.x,bl.y);
    c.closePath(); c.fill();
    c.shadowBlur=0;

    // Tread front edge — bright highlight line
    c.strokeStyle=`rgba(255,252,225,${lerp(0.08,0.48,frac)})`;
    c.lineWidth=lerp(0.5,2.2,frac);
    c.beginPath(); c.moveTo(bl.x,bl.y); c.lineTo(br.x,br.y); c.stroke();

    // ── RISER (vertical front face) ──────────────────────────────────────
    // Riser bottom edge connects to next step's top
    const riserTopY=bl.y;
    const riserBotY=bl.y+treadH;
    const riserLX=lerp(bl.x, CX-lerp(STAIR_W_BOT,STAIR_W_TOP,frac*1.05)/2, 0.15);
    const riserRX=lerp(br.x, CX+lerp(STAIR_W_BOT,STAIR_W_TOP,frac*1.05)/2, 0.15);

    const riserDark=lerp(0.06,0.20,frac);
    const riserG=c.createLinearGradient(CX,riserTopY,CX,riserBotY);
    riserG.addColorStop(0, `rgba(210,195,145,${riserDark*0.9})`);
    riserG.addColorStop(1, `rgba(165,150,105,${riserDark*0.5})`);
    c.fillStyle=riserG;
    c.beginPath();
    c.moveTo(bl.x,riserTopY); c.lineTo(br.x,riserTopY);
    c.lineTo(riserRX,riserBotY); c.lineTo(riserLX,riserBotY);
    c.closePath(); c.fill();

    // ── SIDE EDGES — thin shadow lines ────────────────────────────────────
    c.strokeStyle=`rgba(180,165,115,${lerp(0.04,0.18,frac)})`;
    c.lineWidth=0.8;
    c.beginPath(); c.moveTo(tl.x,tl.y); c.lineTo(bl.x,bl.y); c.stroke();
    c.beginPath(); c.moveTo(tr.x,tr.y); c.lineTo(br.x,br.y); c.stroke();
  });

  // ── BANISTER / SIDE RAILS ─────────────────────────────────────────────
  // Left rail: connect left edges of all steps
  for(let pass=2;pass>=0;pass--){
    const lw=[14,5,1.2][pass];
    c.lineWidth=lw; c.lineCap='round'; c.lineJoin='round';
    c.strokeStyle=`rgba(255,245,180,${[0.04,0.12,0.52][pass]})`;
    c.shadowColor='rgba(255,235,145,0.35)'; c.shadowBlur=lw*2.5;
    c.beginPath();
    STAIRS.forEach((step,si)=>{
      if(si===0) c.moveTo(step.bl.x,step.bl.y);
      else c.lineTo(step.tl.x,step.tl.y);
    });
    c.stroke();
    // Right rail
    c.beginPath();
    STAIRS.forEach((step,si)=>{
      if(si===0) c.moveTo(step.br.x,step.br.y);
      else c.lineTo(step.tr.x,step.tr.y);
    });
    c.stroke();
    c.shadowBlur=0;
  }

  // Soft underside glow of staircase (the whole structure glows faintly)
  const stairGlow=c.createLinearGradient(CX,STAIR_BOT,CX,STAIR_TOP);
  stairGlow.addColorStop(0,'rgba(255,240,160,0.0)');
  stairGlow.addColorStop(0.5,`rgba(255,240,155,0.04)`);
  stairGlow.addColorStop(1,`rgba(255,244,170,0.10)`);
  c.fillStyle=stairGlow;
  c.beginPath();
  c.moveTo(STAIRS[0].bl.x,STAIRS[0].bl.y);
  STAIRS.forEach(s=>c.lineTo(s.tl.x,s.tl.y));
  STAIRS.slice().reverse().forEach(s=>c.lineTo(s.tr.x,s.tr.y));
  c.lineTo(STAIRS[0].br.x,STAIRS[0].br.y);
  c.closePath(); c.fill();
})();

function drawStairs(){
  const c=ctxStairs;
  c.clearRect(0,0,W,H);
  c.globalAlpha=0.94;
  c.drawImage(stairOff,0,0);
  c.globalAlpha=1;

  // Animated step shimmer — a slow wave of light traveling up the stairs
  const shimmerPos=(t*0.12)%1;
  const shimmerStep=Math.floor(shimmerPos*STAIR_STEPS);
  STAIRS.forEach((step,si)=>{
    const dist=Math.abs(si-shimmerStep);
    if(dist>3) return;
    const sa=Math.max(0,0.3-dist*0.08)*(0.5+0.5*Math.sin(t*4));
    c.save();
    c.globalAlpha=sa;
    c.fillStyle='rgba(255,252,220,0.8)';
    c.shadowColor='rgba(255,245,180,0.6)'; c.shadowBlur=8;
    c.beginPath();
    c.moveTo(step.tl.x,step.tl.y); c.lineTo(step.tr.x,step.tr.y);
    c.lineTo(step.br.x,step.br.y); c.lineTo(step.bl.x,step.bl.y);
    c.closePath(); c.fill();
    c.shadowBlur=0;
    c.restore();
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 4 — GATE: zwei Säulen aus Licht, der Öffnungszyklus, das Innere
// ─────────────────────────────────────────────────────────────────────────────

// Gate opening state
let gateOpen=0.0;
let gateSpeed=0.12;
let gateDir=1;
let gateHoldT=0;
let gateState='rising'; // rising | held_open | falling | held_closed

function tickGate(dt){
  switch(gateState){
    case 'rising':
      gateOpen=Math.min(1,gateOpen+gateSpeed*dt);
      if(gateOpen>=1){ gateState='held_open'; gateHoldT=rng(5,12); }
      break;
    case 'held_open':
      gateHoldT-=dt;
      if(gateHoldT<=0){ gateState='falling'; }
      break;
    case 'falling':
      gateOpen=Math.max(0,gateOpen-gateSpeed*0.6*dt);
      if(gateOpen<=0){ gateState='held_closed'; gateHoldT=rng(4,10); }
      break;
    case 'held_closed':
      gateHoldT-=dt;
      if(gateHoldT<=0){ gateState='rising'; }
      break;
  }
}

function drawPillar(c, px, side){
  const pulse=0.85+0.15*Math.sin(t*0.4+(side===0?0:1.1));
  const pTop=GATE_TOP-120;
  const pBot=GATE_BOT;

  // Wide outer glow — the aura of compressed sunlight
  [200,110,58,28,12,PIL_W].forEach((gw,pass)=>{
    const ga=[0.008,0.018,0.04,0.09,0.18,0.65][pass]*pulse;
    const gh=lerp(42,52,pass/5);
    const gl=lerp(42,96,pass/5);
    const pg=c.createLinearGradient(px-gw,0,px+gw,0);
    pg.addColorStop(0,   'rgba(0,0,0,0)');
    pg.addColorStop(0.25,`hsla(${gh},92%,${gl}%,${ga})`);
    pg.addColorStop(0.5, `hsla(${gh+4},96%,${Math.min(99,gl+4)}%,${ga*1.3})`);
    pg.addColorStop(0.75,`hsla(${gh},92%,${gl}%,${ga})`);
    pg.addColorStop(1,   'rgba(0,0,0,0)');
    c.fillStyle=pg;
    c.fillRect(px-gw, pTop-40, gw*2, pBot-pTop+120);
  });

  // Pillar body — color+alpha fade: gold at base → white → invisible at top
  const bodyFade=c.createLinearGradient(0,pBot,0,pTop-60);
  bodyFade.addColorStop(0,  `rgba(255,235,140,${0.90*pulse})`);
  bodyFade.addColorStop(0.2,`rgba(255,244,175,${0.80*pulse})`);
  bodyFade.addColorStop(0.5,`rgba(255,250,210,${0.62*pulse})`);
  bodyFade.addColorStop(0.78,`rgba(255,254,235,${0.30*pulse})`);
  bodyFade.addColorStop(0.92,`rgba(255,255,250,${0.10*pulse})`);
  bodyFade.addColorStop(1,  'rgba(255,255,255,0)');
  c.shadowColor='rgba(255,240,155,0.45)'; c.shadowBlur=22;
  c.fillStyle=bodyFade;
  c.fillRect(px-PIL_W,pTop-60,PIL_W*2,pBot-pTop+120);
  c.shadowBlur=0;

  // Upward light streams — the "Wasserfall der die falsche Richtung gewählt hat"
  for(let s=0;s<6;s++){
    const sOff=(s-2.5)*PIL_W*0.28;
    const scrollY=(t*lerp(60,180,s/5))%(pBot-pTop);
    c.save();
    c.beginPath(); c.rect(px-PIL_W*0.9,pTop-60,PIL_W*1.8,pBot-pTop+100); c.clip();
    c.globalAlpha=(0.18+0.1*Math.sin(t*1.8+s))*pulse;
    for(let rep=0;rep<2;rep++){
      const segH=pBot-pTop;
      const baseY=pBot-scrollY+rep*segH;
      const sg=c.createLinearGradient(0,baseY,0,baseY-segH);
      sg.addColorStop(0,  'rgba(0,0,0,0)');
      sg.addColorStop(0.12,`rgba(255,252,210,0.9)`);
      sg.addColorStop(0.45,`rgba(255,248,195,0.6)`);
      sg.addColorStop(0.8, `rgba(255,244,182,0.2)`);
      sg.addColorStop(1,  'rgba(0,0,0,0)');
      const sx=px+sOff;
      c.strokeStyle=sg;
      c.lineWidth=1.2+s*0.35;
      c.shadowColor='rgba(255,242,175,0.5)'; c.shadowBlur=5;
      c.beginPath(); c.moveTo(sx,baseY);
      for(let iy=0;iy<segH;iy+=10){
        c.lineTo(sx+Math.sin(iy*0.038+t*0.85+s)*3.5,baseY-iy);
      }
      c.stroke(); c.shadowBlur=0;
    }
    c.restore();
  }

  // Base of pillar — where it rests on the top stair step
  const baseGlow=c.createRadialGradient(px,pBot,0,px,pBot,140);
  baseGlow.addColorStop(0, `rgba(255,232,128,${0.22*pulse})`);
  baseGlow.addColorStop(0.4,`rgba(220,192,88,0.08)`);
  baseGlow.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle=baseGlow; c.fillRect(px-140,pBot-80,280,160);

  // Capital (top ornament)
  const capY=pTop-55;
  [20,8,2].forEach((lw,pass)=>{
    const la=[0.04,0.12,0.5][pass]*pulse;
    c.strokeStyle=`rgba(255,244,175,${la})`;
    c.lineWidth=lw;
    c.shadowColor='rgba(255,235,145,0.4)'; c.shadowBlur=lw*2;
    c.beginPath();
    c.moveTo(px-PIL_W*1.6,capY);
    c.lineTo(px+PIL_W*1.6,capY);
    c.stroke(); c.shadowBlur=0;
    // Second cap line below
    c.beginPath();
    c.moveTo(px-PIL_W*1.3,capY+16);
    c.lineTo(px+PIL_W*1.3,capY+16);
    c.stroke();
  });
}

function drawGateInterior(c){
  const oe=eio(gateOpen);
  const intX=PIL_LX+PIL_W;
  const intW=PIL_RX-PIL_LX-PIL_W*2;
  const intTopY=GATE_TOP;
  const intBotY=GATE_BOT;
  const intH=intBotY-intTopY;

  // The impossible blue — always visible through the gate
  const blueG=c.createLinearGradient(intX,intTopY,intX,intBotY);
  blueG.addColorStop(0,  `rgba(28,75,210,${0.42+0.08*Math.sin(t*0.22)})`);
  blueG.addColorStop(0.3,`rgba(22,62,190,${0.52+0.06*Math.sin(t*0.18+1)})`);
  blueG.addColorStop(0.6,`rgba(18,52,175,${0.45})`);
  blueG.addColorStop(1,  `rgba(14,38,148,${0.32})`);
  c.fillStyle=blueG; c.fillRect(intX,intTopY,intW,intH);

  // Stars visible through the gate — the sky that shouldn't exist
  for(let gs=0;gs<28;gs++){
    const gsx=intX+hash(gs*127.1+7)*intW;
    const gsy=intTopY+hash(gs*311.7+3)*intH*0.88;
    const gsph=hash(gs*89.3)*Math.PI*2;
    const gsa=(0.25+0.55*Math.pow(Math.max(0,Math.sin(t*hash(gs*71+1)*0.9+gsph)),2))*0.75;
    c.globalAlpha=gsa;
    c.fillStyle='rgba(225,235,255,1)';
    c.shadowColor='rgba(200,215,255,0.5)'; c.shadowBlur=2.5;
    c.beginPath(); c.arc(gsx,gsy,hash(gs*53)*1.4+0.3,0,Math.PI*2); c.fill();
    c.shadowBlur=0;
  }
  c.globalAlpha=1;

  // Gate edge glow — where interior meets pillar
  [intX,intX+intW].forEach((ex,side)=>{
    const dir=side===0?1:-1;
    const eg=c.createLinearGradient(ex,0,ex+dir*35,0);
    eg.addColorStop(0,`rgba(255,238,145,0.22)`);
    eg.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=eg; c.fillRect(ex-(side===1?35:0),intTopY,35,intH);
  });

  // Opening — goldwhite → pure white → "ein Zustand"
  if(oe>0.01){
    // Gold flood
    const gf=Math.min(1,oe*2);
    c.globalAlpha=gf*oe*0.78;
    const goldRad=c.createRadialGradient(GATE_CX,intTopY+intH*0.42,0,
                                           GATE_CX,intTopY+intH*0.42,intW*0.62);
    goldRad.addColorStop(0,  'rgba(255,245,178,0.95)');
    goldRad.addColorStop(0.3,'rgba(255,240,158,0.68)');
    goldRad.addColorStop(0.65,'rgba(255,232,122,0.28)');
    goldRad.addColorStop(1,  'rgba(0,0,0,0)');
    c.fillStyle=goldRad; c.fillRect(intX,intTopY,intW,intH);

    // Pure white phase
    if(oe>0.42){
      const wf=(oe-0.42)/0.58;
      c.globalAlpha=wf*0.88;
      const wRad=c.createRadialGradient(GATE_CX,intTopY+intH*0.40,0,
                                          GATE_CX,intTopY+intH*0.40,intW*0.58);
      wRad.addColorStop(0,  `rgba(255,255,255,${wf*0.94})`);
      wRad.addColorStop(0.28,`rgba(255,255,253,${wf*0.68})`);
      wRad.addColorStop(0.58,`rgba(248,250,255,${wf*0.30})`);
      wRad.addColorStop(1,  'rgba(0,0,0,0)');
      c.fillStyle=wRad; c.fillRect(intX,intTopY,intW,intH);
    }
    c.globalAlpha=1;
  }

  // The Catchmon silhouette — visible when gate is mostly closed
  if(gateOpen<0.18){
    const sAlpha=(0.18-gateOpen)/0.18*0.28*(0.5+0.5*Math.sin(t*0.14));
    c.save();
    c.globalAlpha=sAlpha;
    const siG=c.createRadialGradient(GATE_CX,intTopY+intH*0.38,0,
                                       GATE_CX,intTopY+intH*0.38,intW*0.38);
    siG.addColorStop(0,  'rgba(255,252,218,0.85)');
    siG.addColorStop(0.3,'rgba(255,246,192,0.48)');
    siG.addColorStop(0.65,'rgba(245,235,165,0.18)');
    siG.addColorStop(1,  'rgba(0,0,0,0)');
    c.shadowColor='rgba(255,242,175,0.5)'; c.shadowBlur=45;
    c.fillStyle=siG; c.fillRect(intX,intTopY,intW,intH);
    c.shadowBlur=0;
    c.restore();
  }
}

function drawGateArch(c){
  // Decorative arch above the gate — stone-like but made of light
  const pulse=0.82+0.18*Math.sin(t*0.38);
  const archCX=GATE_CX;
  const archTopY=GATE_TOP-128;
  const archW=GATE_W/2+PIL_W;

  // Arch curve
  [40,16,4].forEach((lw,pass)=>{
    const la=[0.03,0.10,0.52][pass]*pulse;
    c.strokeStyle=`rgba(255,244,172,${la})`;
    c.lineWidth=lw; c.shadowColor='rgba(255,232,140,0.4)'; c.shadowBlur=lw*2.5;
    c.beginPath();
    c.moveTo(archCX-archW, GATE_TOP);
    c.bezierCurveTo(
      archCX-archW, archTopY+20,
      archCX, archTopY-60,
      archCX, archTopY-60
    );
    c.bezierCurveTo(
      archCX, archTopY-60,
      archCX+archW, archTopY+20,
      archCX+archW, GATE_TOP
    );
    c.stroke(); c.shadowBlur=0;
  });

  // Keystone at apex
  const kY=archTopY-65;
  [40,18,6].forEach((kr,pass)=>{
    const ka=[0.04,0.1,0.55][pass]*(0.8+0.2*Math.sin(t*1.8));
    const kg=c.createRadialGradient(archCX,kY,0,archCX,kY,kr);
    kg.addColorStop(0,`rgba(255,252,215,${ka})`);
    kg.addColorStop(1,'rgba(0,0,0,0)');
    c.shadowColor='rgba(255,242,160,0.7)'; c.shadowBlur=kr*1.5;
    c.fillStyle=kg; c.beginPath(); c.arc(archCX,kY,kr,0,Math.PI*2); c.fill();
    c.shadowBlur=0;
  });

  // Tracery lines radiating from keystone
  for(let tr=0;tr<6;tr++){
    const ta=(tr/5)*Math.PI+Math.PI;
    const tx=archCX+Math.cos(ta)*archW*0.65;
    const ty=archTopY+Math.sin(ta)*60+10;
    c.strokeStyle=`rgba(255,240,168,${0.06+0.02*Math.sin(t*0.2+tr)})`;
    c.lineWidth=0.8;
    c.beginPath(); c.moveTo(archCX,kY+6); c.lineTo(tx,ty); c.stroke();
  }

  // Horizontal lintel connecting pillars
  [28,10,2.5].forEach((lw,pass)=>{
    const la=[0.035,0.10,0.55][pass]*pulse;
    c.strokeStyle=`rgba(255,243,170,${la})`;
    c.lineWidth=lw; c.shadowColor='rgba(255,232,138,0.4)'; c.shadowBlur=lw*2.5;
    c.beginPath();
    c.moveTo(PIL_LX-PIL_W*0.6,GATE_TOP);
    c.lineTo(PIL_RX+PIL_W*0.6,GATE_TOP);
    c.stroke(); c.shadowBlur=0;
  });
}

// Beam of light from gate up into sky
function drawGateBeam(c){
  const oe=eio(gateOpen);
  const bAlpha=(0.04+0.06*oe)*(0.8+0.2*Math.sin(t*0.3));
  for(let pass=2;pass>=0;pass--){
    const bw=[350,160,70][pass];
    const ba=[bAlpha*0.4,bAlpha*0.7,bAlpha*1.4][pass];
    const beamG=c.createLinearGradient(GATE_CX,GATE_TOP,GATE_CX,0);
    beamG.addColorStop(0,  `rgba(255,244,172,${ba})`);
    beamG.addColorStop(0.35,`rgba(255,240,158,${ba*0.55})`);
    beamG.addColorStop(0.72,`rgba(255,236,145,${ba*0.18})`);
    beamG.addColorStop(1,  'rgba(0,0,0,0)');
    const bwG=c.createLinearGradient(GATE_CX-bw/2,0,GATE_CX+bw/2,0);
    bwG.addColorStop(0,'rgba(0,0,0,0)');
    bwG.addColorStop(0.5,'rgba(255,244,172,1)');
    bwG.addColorStop(1,'rgba(0,0,0,0)');
    c.globalAlpha=ba;
    c.fillStyle=beamG;
    c.shadowColor='rgba(255,238,150,0.25)'; c.shadowBlur=bw*0.5;
    c.fillRect(GATE_CX-bw/2,0,bw,GATE_TOP);
    c.shadowBlur=0;
  }
  c.globalAlpha=1;
}

function drawGate(dt){
  const c=ctxGate;
  c.clearRect(0,0,W,H);
  tickGate(dt);

  drawGateBeam(c);
  drawGateInterior(c);
  drawPillar(c, PIL_LX, 0);
  drawPillar(c, PIL_RX, 1);
  drawGateArch(c);
}

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 5 — PARTICLES: gate particles + ambient motes
// ─────────────────────────────────────────────────────────────────────────────
class GPart {
  constructor(){this.reset()}
  reset(){
    const intX=PIL_LX+PIL_W, intW=PIL_RX-PIL_LX-PIL_W*2;
    this.x=intX+Math.random()*intW;
    this.y=GATE_TOP+Math.random()*(GATE_BOT-GATE_TOP);
    const a=rng(-Math.PI,0);                // bias upward/outward
    const spd=rng(0.2,3.5)*(0.4+gateOpen*0.6);
    this.vx=Math.cos(a)*spd*(Math.random()<0.5?-1:1);
    this.vy=Math.sin(a)*spd-rng(0,0.8);
    this.r=rng(0.8,4.2);
    this.life=1; this.decay=rng(0.004,0.018);
    this.wait=rng(0,12); this.elapsed=Math.random()*this.wait;
    this.hue=rng(44,58);
    this.linger=Math.random()<0.12;
    if(this.linger){ this.vx*=0.06; this.vy*=0.06; this.decay*=0.18; }
    this.trail=[];
  }
  update(dt){
    this.elapsed+=dt;
    if(this.elapsed<this.wait) return;
    this.trail.push({x:this.x,y:this.y});
    if(this.trail.length>7) this.trail.shift();
    this.x+=this.vx*dt*60; this.y+=this.vy*dt*60;
    if(!this.linger) this.vy+=0.014*dt*60;
    this.life-=this.decay*dt*60;
    if(this.life<=0||this.y>H+30||this.y<-80||this.x<-80||this.x>W+80) this.reset();
  }
  draw(c){
    if(this.elapsed<this.wait) return;
    c.save();
    for(let i=1;i<this.trail.length;i++){
      const tf=i/this.trail.length;
      c.globalAlpha=this.life*tf*tf*0.32;
      c.strokeStyle=`hsl(${this.hue},100%,88%)`;
      c.lineWidth=this.r*tf*0.6; c.lineCap='round';
      c.shadowColor=`hsl(${this.hue},100%,85%)`; c.shadowBlur=3;
      c.beginPath();
      c.moveTo(this.trail[i-1].x,this.trail[i-1].y);
      c.lineTo(this.trail[i].x,this.trail[i].y);
      c.stroke(); c.shadowBlur=0;
    }
    const p=this.linger?0.5+0.5*Math.sin(t*2.2+this.elapsed*3):1;
    c.globalAlpha=this.life*p*(this.linger?0.58:0.88);
    c.fillStyle=`hsl(${this.hue+8},100%,${this.linger?80:90}%)`;
    c.shadowColor=`hsl(${this.hue},100%,86%)`; c.shadowBlur=this.r*(this.linger?9:5);
    c.beginPath(); c.arc(this.x,this.y,this.r,0,Math.PI*2); c.fill();
    c.shadowBlur=0; c.restore();
  }
}

class AMote {
  constructor(){this.reset(true)}
  reset(init=false){
    this.x=init?rng(0,W):rng(50,W-50);
    this.y=init?rng(0,H):rng(H*0.15,H*0.92);
    this.vx=rng(-0.08,0.08); this.vy=rng(-0.05,0.03);
    this.r=rng(0.4,2.2); this.life=init?Math.random():1;
    this.decay=rng(0.0005,0.0018);
    this.ph=rng(0,Math.PI*2); this.sp=rng(0.4,1.8);
    this.hue=rng(44,56); this.alpha=rng(0.10,0.40);
  }
  update(dt){
    this.x+=this.vx*dt*60+Math.sin(t*0.4+this.ph)*0.18;
    this.y+=this.vy*dt*60;
    this.life-=this.decay*dt*60;
    if(this.life<=0||this.y<0||this.y>H) this.reset(false);
  }
  draw(c){
    c.save();
    c.globalAlpha=this.alpha*this.life*(0.38+0.62*Math.pow(Math.max(0,Math.sin(t*this.sp+this.ph)),1.5));
    c.fillStyle=`hsl(${this.hue},88%,82%)`;
    c.shadowColor=`hsl(${this.hue},100%,86%)`; c.shadowBlur=this.r*4;
    c.beginPath(); c.arc(this.x,this.y,this.r,0,Math.PI*2); c.fill();
    c.shadowBlur=0; c.restore();
  }
}

const GPARTS=Array.from({length:95},()=>new GPart());
const MOTES =Array.from({length:85},()=>new AMote());

function drawPart(dt){
  const c=ctxPart;
  c.clearRect(0,0,W,H);
  MOTES.forEach(m=>{ m.update(dt); m.draw(c); });
  GPARTS.forEach(p=>{ p.update(dt); p.draw(c); });
}

// ─────────────────────────────────────────────────────────────────────────────
// MAIN LOOP
// ─────────────────────────────────────────────────────────────────────────────
function loop(now){
  const dt=Math.min((now-last)/1000,0.05);
  last=now; t+=dt;
  drawSky();
  drawClouds(dt);
  drawStairs();
  drawGate(dt);
  drawPart(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
