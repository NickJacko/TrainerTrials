<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Light — Goldener Tempel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#1a1000;}
canvas{position:absolute;inset:0;width:1080px;height:1920px;display:block;}
.bg{position:absolute;inset:0;background:
  radial-gradient(ellipse 60% 40% at 50% 35%, #ffd700 0%, #ffa500 25%, #8a5500 55%, transparent 80%),
  radial-gradient(ellipse 100% 55% at 50% 10%, #ffe780 0%, transparent 40%),
  linear-gradient(180deg, #2a1c00 0%, #1a1000 45%, #2a1c00 80%, #1a1000 100%);}
/* Columns */
.col{position:absolute;bottom:220px;width:70px;height:900px;background:linear-gradient(90deg,#4a3010 0%,#8a6020 30%,#d4a040 50%,#8a6020 70%,#4a3010 100%);box-shadow:0 0 40px rgba(255,180,60,0.35);}
.cap{position:absolute;width:100px;height:24px;background:linear-gradient(90deg,#5a3810 0%,#c08030 50%,#5a3810 100%);left:-15px;top:-24px;}
.base{position:absolute;width:100px;height:30px;background:linear-gradient(90deg,#4a2a10 0%,#a07030 50%,#4a2a10 100%);left:-15px;bottom:-30px;}
.c1{left:6%;}.c2{left:22%;}.c3{right:22%;}.c4{right:6%;}
/* Temple floor */
.floor{position:absolute;bottom:0;left:0;right:0;height:220px;background:linear-gradient(180deg, #4a3010 0%, #2a1800 60%, #1a1000 100%);box-shadow:inset 0 20px 40px rgba(0,0,0,0.5);}
/* Holy sun shaft */
.shaft{position:absolute;top:-100px;left:50%;transform:translateX(-50%);width:900px;height:1800px;
  background:conic-gradient(from 70deg at 50% 0%, transparent 0deg, rgba(255,230,140,0.35) 10deg, rgba(255,215,0,0.4) 14deg, rgba(255,230,140,0.35) 18deg, transparent 28deg, transparent 332deg, rgba(255,230,140,0.25) 342deg, rgba(255,215,0,0.3) 346deg, rgba(255,230,140,0.25) 350deg, transparent 360deg);
  filter:blur(20px);mix-blend-mode:screen;animation:shaftP 8s ease-in-out infinite;}
@keyframes shaftP{0%,100%{opacity:0.75}50%{opacity:1}}

/* Sacred geometry (flower of life) */
.geom{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);width:520px;height:520px;opacity:0.18;pointer-events:none;animation:rot 60s linear infinite;mix-blend-mode:screen;}
@keyframes rot{to{transform:translate(-50%,-50%) rotate(360deg)}}

.zone-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(40,20,0,0.45) 0%,transparent 100%);z-index:40;}
.zone-bot{position:absolute;bottom:0;left:0;right:0;height:920px;background:linear-gradient(0deg,rgba(20,10,0,0.5) 0%,rgba(20,10,0,0.1) 40%,transparent 100%);z-index:40;}
.center-darken{position:absolute;top:300px;left:50%;transform:translateX(-50%);width:780px;height:540px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(30,15,0,0.28) 0%,transparent 70%);z-index:38;}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 40%,rgba(0,0,0,0.55) 100%);z-index:39;pointer-events:none;}
</style>
</head>
<body>
<div class="bg"></div>
<div class="shaft"></div>
<svg class="geom" viewBox="0 0 520 520">
<g fill="none" stroke="#ffd700" stroke-width="1.2">
  <circle cx="260" cy="260" r="60"/>
  <circle cx="260" cy="200" r="60"/><circle cx="260" cy="320" r="60"/>
  <circle cx="208" cy="230" r="60"/><circle cx="208" cy="290" r="60"/>
  <circle cx="312" cy="230" r="60"/><circle cx="312" cy="290" r="60"/>
  <circle cx="260" cy="140" r="60"/><circle cx="260" cy="380" r="60"/>
  <circle cx="156" cy="260" r="60"/><circle cx="364" cy="260" r="60"/>
  <circle cx="260" cy="260" r="180"/>
</g>
</svg>
<div class="col c1"><div class="cap"></div><div class="base"></div></div>
<div class="col c2"><div class="cap"></div><div class="base"></div></div>
<div class="col c3"><div class="cap"></div><div class="base"></div></div>
<div class="col c4"><div class="cap"></div><div class="base"></div></div>
<canvas id="lotus"></canvas>
<div class="floor"></div>
<canvas id="particles"></canvas>
<canvas id="doves"></canvas>
<div class="center-darken"></div>
<div class="vignette"></div>
<div class="zone-top"></div>
<div class="zone-bot"></div>
<script>
const W=1080,H=1920;
function setup(id){const c=document.getElementById(id);c.width=W;c.height=H;return c.getContext('2d');}

const lt=setup('lotus');
// Water with lotus flowers at bottom area
const lotuses=[{x:280,y:1660,r:50},{x:540,y:1700,r:60},{x:780,y:1680,r:55}];

const pt=setup('particles');
const parts=[];
for(let i=0;i<100;i++)parts.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.5,vy:-0.3-Math.random()*0.6,vx:(Math.random()-0.5)*0.3,a:0.5+Math.random()*0.4,ph:Math.random()*Math.PI*2,hue:40+Math.random()*20});

const dv=setup('doves');
const doves=[];
for(let i=0;i<3;i++)doves.push({x:Math.random()*W,y:400+Math.random()*500,vx:(Math.random()<0.5?1:-1)*(0.9+Math.random()*0.5),flap:Math.random()*Math.PI*2,flapSp:0.18+Math.random()*0.05,sz:10+Math.random()*6,bob:Math.random()*Math.PI*2});

function drawLotus(x,y,r,t){
  lt.save();lt.translate(x,y);
  // Water ripple
  lt.fillStyle='rgba(255,220,120,0.15)';
  lt.beginPath();lt.ellipse(0,0,r*2,r*0.5,0,0,Math.PI*2);lt.fill();
  // Petals
  for(let i=0;i<8;i++){
    const ang=i/8*Math.PI*2;
    lt.save();lt.rotate(ang);
    const grad=lt.createRadialGradient(0,-r*0.4,0,0,-r*0.4,r*0.6);
    grad.addColorStop(0,'rgba(255,255,220,0.9)');grad.addColorStop(0.6,'rgba(255,200,100,0.7)');grad.addColorStop(1,'rgba(255,150,50,0.2)');
    lt.fillStyle=grad;lt.shadowBlur=12;lt.shadowColor='#ffd700';
    lt.beginPath();lt.ellipse(0,-r*0.5,r*0.2,r*0.5,0,0,Math.PI*2);lt.fill();
    lt.restore();
  }
  lt.shadowBlur=0;
  lt.fillStyle='#ffe780';lt.beginPath();lt.arc(0,0,r*0.15,0,Math.PI*2);lt.fill();
  lt.restore();
}

let t=0;
function loop(){
  t+=0.016;
  lt.clearRect(0,0,W,H);
  for(const l of lotuses)drawLotus(l.x,l.y,l.r,t);

  pt.clearRect(0,0,W,H);
  for(const p of parts){p.ph+=0.04;
    p.y+=p.vy;p.x+=p.vx+Math.sin(p.ph)*0.3;
    if(p.y<-20){p.y=H+20;p.x=Math.random()*W;}
    pt.fillStyle=`hsla(${p.hue},100%,70%,${p.a*(0.7+Math.sin(p.ph)*0.3)})`;
    pt.shadowBlur=10;pt.shadowColor='#ffd700';
    pt.beginPath();pt.arc(p.x,p.y,p.r,0,Math.PI*2);pt.fill();}
  pt.shadowBlur=0;

  dv.clearRect(0,0,W,H);
  for(const b of doves){b.flap+=b.flapSp;b.bob+=0.02;b.x+=b.vx;b.y+=Math.sin(b.bob)*0.4;
    if(b.x<-40)b.x=W+40;if(b.x>W+40)b.x=-40;
    const fl=Math.sin(b.flap)*0.5;
    dv.fillStyle='rgba(255,245,220,0.95)';dv.shadowBlur=10;dv.shadowColor='#fff5dc';
    dv.save();dv.translate(b.x,b.y);dv.scale(b.vx>0?1:-1,1);
    dv.beginPath();dv.moveTo(0,0);
    dv.quadraticCurveTo(-b.sz*0.4,-b.sz*(0.4+fl*0.6),-b.sz*1.2,-b.sz*0.1);
    dv.lineTo(-b.sz*0.5,0);
    dv.quadraticCurveTo(-b.sz*0.4,b.sz*(0.3+fl*0.4),-b.sz*1.0,b.sz*0.2);
    dv.lineTo(0,0);dv.closePath();dv.fill();
    dv.save();dv.scale(-1,1);
    dv.beginPath();dv.moveTo(0,0);
    dv.quadraticCurveTo(-b.sz*0.4,-b.sz*(0.4+fl*0.6),-b.sz*1.2,-b.sz*0.1);
    dv.lineTo(-b.sz*0.5,0);
    dv.quadraticCurveTo(-b.sz*0.4,b.sz*(0.3+fl*0.4),-b.sz*1.0,b.sz*0.2);
    dv.lineTo(0,0);dv.closePath();dv.fill();dv.restore();
    dv.restore();}
  dv.shadowBlur=0;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
