<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Poison — Giftiger Sumpf</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:1080px;height:1920px;overflow:hidden;
    background:#060a02;
  }
  canvas{position:absolute;inset:0;width:1080px;height:1920px;display:block;}

  /* Oppressive heavy atmosphere */
  .atmos{
    position:absolute;inset:0;
    background:
      radial-gradient(ellipse 100% 65% at 50% 40%, #0e1a04 0%, #080f02 40%, #040800 75%, #020400 100%),
      radial-gradient(ellipse 70% 50% at 20% 60%, rgba(8,18,2,0.8) 0%, transparent 55%),
      radial-gradient(ellipse 65% 48% at 85% 55%, rgba(6,14,1,0.75) 0%, transparent 52%);
  }

  /* Poison sky — sickly yellowish-green overcast */
  .sky{
    position:absolute;top:0;left:0;right:0;height:900px;
    background:
      linear-gradient(180deg,
        #0a0e02 0%,
        #0e1505 12%,
        #131c06 28%,
        #0f1804 50%,
        #0a1002 75%,
        transparent 100%);
  }
  /* Sick yellow tint in clouds */
  .sky-yellow{
    position:absolute;top:0;left:0;right:0;height:600px;
    background:
      radial-gradient(ellipse 600px 200px at 30% 15%, rgba(60,55,0,0.18) 0%, transparent 65%),
      radial-gradient(ellipse 500px 180px at 75% 22%, rgba(50,45,0,0.14) 0%, transparent 60%),
      radial-gradient(ellipse 700px 220px at 50% 35%, rgba(40,38,0,0.12) 0%, transparent 55%);
  }

  /* Swamp water surface */
  .swamp-water{
    position:absolute;bottom:0;left:0;right:0;height:620px;
    background:
      radial-gradient(ellipse 110% 55% at 50% 100%, #0a1802 0%, #060f01 25%, #040a01 55%, transparent 75%),
      linear-gradient(0deg, #050c01 0%, #0a1503 35%, transparent 100%);
  }
  .water-sheen{
    position:absolute;bottom:160px;left:0;right:0;height:180px;
    background:
      radial-gradient(ellipse 65% 35% at 35% 100%, rgba(20,35,3,0.25) 0%, transparent 60%),
      radial-gradient(ellipse 55% 30% at 72% 100%, rgba(18,30,2,0.2) 0%, transparent 55%);
    animation:waterShift 18s ease-in-out infinite alternate;
  }
  @keyframes waterShift{0%{transform:translateX(0)}100%{transform:translateX(15px)}}

  /* Dead trees silhouettes */
  .dead-tree-l{
    position:absolute;top:0;left:-30px;width:280px;height:1100px;
    background:#030600;
    clip-path:polygon(
      30% 0,32% 0,32% 18%,45% 12%,46% 13%,33% 20%,34% 35%,
      55% 22%,56% 23%,35% 37%,36% 55%,58% 44%,59% 46%,37% 57%,
      38% 75%,52% 68%,53% 70%,39% 77%,40% 92%,
      55% 88%,56% 90%,41% 94%,42% 100%,28% 100%,
      27% 94%,12% 90%,13% 88%,26% 92%,25% 77%,
      8% 70%,9% 68%,24% 75%,23% 57%,4% 46%,5% 44%,22% 55%,
      21% 37%,3% 23%,4% 22%,20% 35%,19% 20%,2% 13%,3% 12%,18% 18%);
  }
  .dead-tree-r{
    position:absolute;top:0;right:-25px;width:260px;height:1050px;
    background:#030600;
    clip-path:polygon(
      68% 0,70% 0,70% 16%,85% 10%,86% 11%,71% 18%,72% 32%,
      90% 20%,91% 22%,73% 34%,74% 52%,92% 42%,93% 44%,75% 54%,
      76% 72%,88% 65%,89% 67%,77% 74%,78% 90%,
      90% 86%,91% 88%,79% 92%,80% 100%,60% 100%,
      59% 92%,48% 88%,49% 86%,58% 90%,57% 74%,
      42% 67%,43% 65%,56% 72%,54% 54%,36% 44%,37% 42%,53% 52%,
      51% 34%,32% 22%,33% 20%,50% 32%,48% 18%,30% 11%,31% 10%,47% 16%);
  }

  /* Dense vegetation walls */
  .veg-l{
    position:absolute;top:200px;left:0;width:160px;height:1400px;
    background:linear-gradient(90deg,#030601 0%,#060c02 55%,transparent 100%);
  }
  .veg-r{
    position:absolute;top:200px;right:0;width:160px;height:1400px;
    background:linear-gradient(270deg,#030601 0%,#060c02 55%,transparent 100%);
  }

  /* Ground rot — decaying matter */
  .ground-rot{
    position:absolute;bottom:0;left:0;right:0;height:280px;
    background:
      radial-gradient(ellipse 80px 30px at 12% 90%,  rgba(15,25,3,0.8)  0%, transparent 70%),
      radial-gradient(ellipse 100px 35px at 28% 95%, rgba(12,20,2,0.75) 0%, transparent 65%),
      radial-gradient(ellipse 90px 32px at 45% 88%,  rgba(14,22,3,0.7)  0%, transparent 68%),
      radial-gradient(ellipse 85px 30px at 62% 93%,  rgba(13,21,2,0.75) 0%, transparent 65%),
      radial-gradient(ellipse 95px 34px at 78% 90%,  rgba(15,24,3,0.8)  0%, transparent 70%),
      radial-gradient(ellipse 80px 28px at 92% 95%,  rgba(12,20,2,0.7)  0%, transparent 62%);
  }

  /* Poison mist creeping on ground */
  .mist-1{
    position:absolute;bottom:0;left:0;right:0;height:500px;
    background:
      radial-gradient(ellipse 120% 55% at 50% 100%, rgba(18,40,4,0.6)  0%, transparent 60%),
      radial-gradient(ellipse  85% 42% at 22% 100%, rgba(14,32,3,0.45) 0%, transparent 52%),
      radial-gradient(ellipse  78% 40% at 82% 100%, rgba(16,36,3,0.4)  0%, transparent 50%);
    filter:blur(20px);
    animation:mistCreep1 20s ease-in-out infinite alternate;
  }
  .mist-2{
    position:absolute;bottom:80px;left:0;right:0;height:380px;
    background:
      radial-gradient(ellipse 95% 48% at 42% 100%, rgba(22,48,5,0.35) 0%, transparent 55%),
      radial-gradient(ellipse 70% 38% at 70% 100%, rgba(18,40,4,0.28) 0%, transparent 48%);
    filter:blur(25px);mix-blend-mode:screen;
    animation:mistCreep2 25s ease-in-out infinite alternate-reverse;
  }
  @keyframes mistCreep1{0%{transform:translateX(0) scaleX(1)}100%{transform:translateX(20px) scaleX(1.02)}}
  @keyframes mistCreep2{0%{transform:translateX(0)}100%{transform:translateX(-18px)}}

  /* Ring — emanates heavy poison */
  .ring-poison{
    position:absolute;top:215px;left:50%;transform:translateX(-50%);
    width:840px;height:840px;border-radius:50%;
    background:radial-gradient(ellipse 100% 100% at 50% 50%,
      rgba(30,55,5,0.14) 0%,rgba(20,38,3,0.06) 48%,transparent 68%);
    filter:blur(25px);
    animation:poisonBreath 7s ease-in-out infinite;
  }
  @keyframes poisonBreath{
    0%,100%{opacity:0.55;transform:translateX(-50%) scale(1)}
    50%{opacity:0.85;transform:translateX(-50%) scale(1.015)}
  }

  /* Heavy air shimmer */
  .heavy-air{
    position:absolute;inset:0;
    background:radial-gradient(ellipse 55% 48% at 52% 55%, rgba(12,22,2,0.08) 0%, transparent 58%);
    animation:heavyAir 9s ease-in-out infinite;pointer-events:none;
  }
  @keyframes heavyAir{0%,100%{opacity:0.4}45%{opacity:0.8}}

  /* UI */
  .center-darken{position:absolute;top:300px;left:50%;transform:translateX(-50%);width:780px;height:540px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(0,3,0,0.45) 0%,transparent 70%);z-index:38;}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 38%,rgba(0,2,0,0.82) 100%);z-index:39;pointer-events:none;}
  .zone-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(0,0,0,0.6) 0%,transparent 100%);z-index:40;}
  .zone-bot{position:absolute;bottom:0;left:0;right:0;height:920px;background:linear-gradient(0deg,rgba(0,2,0,0.68) 0%,rgba(0,2,0,0.16) 40%,transparent 100%);z-index:40;}
</style>
</head>
<body>
  <div class="atmos"></div>
  <div class="sky"></div>
  <div class="sky-yellow"></div>
  <div class="dead-tree-l"></div>
  <div class="dead-tree-r"></div>
  <div class="veg-l"></div><div class="veg-r"></div>

  <!-- Canvas stack: plants → ring → fog → particles -->
  <canvas id="cPlants"></canvas>
  <canvas id="cRing"></canvas>
  <canvas id="cFog"></canvas>
  <canvas id="cParticles"></canvas>

  <div class="swamp-water"></div>
  <div class="water-sheen"></div>
  <div class="ground-rot"></div>
  <div class="mist-1"></div>
  <div class="mist-2"></div>
  <div class="ring-poison"></div>
  <div class="heavy-air"></div>
  <div class="center-darken"></div>
  <div class="vignette"></div>
  <div class="zone-top"></div>
  <div class="zone-bot"></div>

<script>
const W=1080, H=1920;
const RING_CX=540, RING_CY=590, RING_R=300;

function mkCanvas(id){
  const c=document.getElementById(id);
  c.width=W; c.height=H;
  return c.getContext('2d');
}
const plantsCtx = mkCanvas('cPlants');
const ringCtx   = mkCanvas('cRing');
const fogCtx    = mkCanvas('cFog');
const partCtx   = mkCanvas('cParticles');

/* ═══════════════════════════════════════════════════════════════════════════
   DEAD VEGETATION — drooping plants, rot, swamp reeds
   ═══════════════════════════════════════════════════════════════════════════ */
// Drooping toxic plants scattered
const droopPlants=[];
(function genDroopPlants(){
  const positions=[
    {x:60,  y:1400,cnt:4,hue:78},
    {x:180, y:1350,cnt:3,hue:72},
    {x:320, y:1380,cnt:5,hue:80},
    {x:480, y:1420,cnt:3,hue:75},
    {x:600, y:1390,cnt:4,hue:70},
    {x:750, y:1360,cnt:3,hue:76},
    {x:880, y:1400,cnt:5,hue:78},
    {x:1000,y:1370,cnt:3,hue:73},
    {x:130, y:1600,cnt:3,hue:72},
    {x:400, y:1580,cnt:4,hue:76},
    {x:680, y:1590,cnt:3,hue:74},
    {x:940, y:1610,cnt:4,hue:78},
  ];
  for(const p of positions){
    const stems=[];
    for(let i=0;i<p.cnt;i++){
      const len=60+Math.random()*120;
      const ang=-Math.PI/2+(Math.random()-0.5)*0.8;
      stems.push({
        len, ang,
        droop:0.4+Math.random()*0.6,
        w:2+Math.random()*3,
        phase:Math.random()*Math.PI*2,
        sp:0.005+Math.random()*0.008,
      });
    }
    droopPlants.push({x:p.x,y:p.y,stems,hue:p.hue,phase:Math.random()*Math.PI*2});
  }
})();

// Swamp reeds — thin vertical
const reeds=[];
for(let i=0;i<28;i++){
  reeds.push({
    x:40+Math.random()*(W-80),
    y:H-120-Math.random()*350,
    h:80+Math.random()*180,
    w:2+Math.random()*2.5,
    phase:Math.random()*Math.PI*2,
    sp:0.006+Math.random()*0.01,
    lean:(Math.random()-0.5)*0.12,
  });
}

// Floating algae patches on water
const algae=[];
for(let i=0;i<18;i++){
  algae.push({
    x:60+Math.random()*(W-120),
    y:H-80-Math.random()*320,
    rx:25+Math.random()*55,
    ry:8+Math.random()*18,
    vx:(Math.random()-0.5)*0.12,
    phase:Math.random()*Math.PI*2,
    sp:0.004+Math.random()*0.007,
    a:0.35+Math.random()*0.3,
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   VENUS TRAPS — but dim, threatening, not flashy
   ═══════════════════════════════════════════════════════════════════════════ */
const TRAP_COUNT=6;
const traps=[];
for(let i=0;i<TRAP_COUNT;i++){
  const ang=(i/TRAP_COUNT)*Math.PI*2;
  traps.push({
    ang,
    x:RING_CX+Math.cos(ang)*(RING_R+72),
    y:RING_CY+Math.sin(ang)*(RING_R+72)+35,
    stemLen:55+Math.random()*35,
    jawW:24+Math.random()*14,
    jawH:18+Math.random()*10,
    phase:i*(Math.PI*2/TRAP_COUNT),
    glowSp:0.01+Math.random()*0.012, // very slow
    snapState:'open',
    snapTimer:0,
    snapInterval:8+Math.random()*14,
    jawOpen:1.0,
    jawV:0,
    teeth:4+Math.floor(Math.random()*3),
  });
}

function drawTrapDim(ctx, tr){
  ctx.save();
  ctx.translate(tr.x, tr.y);
  const tiltAng=Math.atan2(RING_CY-tr.y, RING_CX-tr.x);
  ctx.rotate(tiltAng-Math.PI/2);

  const bright=0.25+Math.sin(tr.phase)*0.18; // very dim
  const jawOpen=tr.jawOpen;
  const halfAngle=jawOpen*Math.PI*0.4;

  // Stem — dark olive green
  ctx.strokeStyle=`rgba(28,45,6,0.85)`;
  ctx.lineWidth=4;ctx.lineCap='round';
  ctx.shadowBlur=5;ctx.shadowColor='rgba(20,38,4,0.5)';
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(-6,tr.stemLen*0.4,6,tr.stemLen*0.65,0,tr.stemLen);
  ctx.stroke();ctx.shadowBlur=0;

  const jy=tr.stemLen;

  // Inner dim glow
  if(jawOpen>0.12){
    const ig=ctx.createRadialGradient(0,jy,0,0,jy,tr.jawW*0.75);
    ig.addColorStop(0,`rgba(35,55,8,${bright*jawOpen*0.7})`);
    ig.addColorStop(0.6,`rgba(20,35,4,${bright*jawOpen*0.25})`);
    ig.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=ig;
    ctx.beginPath();ctx.ellipse(0,jy,tr.jawW*0.7*jawOpen,tr.jawH*jawOpen,0,0,Math.PI*2);ctx.fill();
  }

  // Draw each jaw
  for(const flip of [-1,1]){
    ctx.save();
    ctx.translate(0,jy);
    ctx.rotate(flip*halfAngle);
    // Jaw plate
    ctx.fillStyle=`rgba(22,40,5,${0.75+bright*0.2})`;
    ctx.shadowBlur=4+bright*6;
    ctx.shadowColor=`rgba(30,55,6,${bright*0.5})`;
    ctx.beginPath();
    ctx.ellipse(0,0,tr.jawW,tr.jawH*0.55,0,-Math.PI,0,false);
    ctx.lineTo(tr.jawW*1.05,0);
    ctx.arc(0,0,tr.jawW*1.05,0,Math.PI,true);
    ctx.fill();ctx.shadowBlur=0;
    // Teeth — small, dark
    ctx.fillStyle=`rgba(45,70,10,${0.55+bright*0.25})`;
    for(let ti=0;ti<tr.teeth;ti++){
      const ta=((ti+0.5)/tr.teeth)*Math.PI;
      const tx=Math.cos(ta)*tr.jawW;
      const ty=-Math.sin(ta)*tr.jawH*0.5;
      ctx.beginPath();
      ctx.moveTo(tx-3,ty);
      ctx.lineTo(tx,ty-6);
      ctx.lineTo(tx+3,ty);
      ctx.fill();
    }
    ctx.restore();
  }
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════════════════
   POISON GAS FOG LAYERS — slow heavy rolling
   ═══════════════════════════════════════════════════════════════════════════ */
const fogLayers=[];
for(let i=0;i<30;i++){
  fogLayers.push({
    x:Math.random()*W*1.6-W*0.3,
    y:H-100-Math.random()*600,
    rx:80+Math.random()*200,
    ry:22+Math.random()*50,
    vx:0.06+Math.random()*0.18,
    a:0.07+Math.random()*0.12,
    phase:Math.random()*Math.PI*2,
    sp:0.003+Math.random()*0.005,
    hue:80+Math.random()*20, // yellow-green
    dark:Math.random()<0.4,
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   RING: Slow poison emanations + drip system
   ═══════════════════════════════════════════════════════════════════════════ */
// Slow swirling poison tendrils around ring
const tendrilPhases=[];
for(let i=0;i<5;i++) tendrilPhases.push({phase:Math.random()*Math.PI*2,sp:0.004+Math.random()*0.005});

// Poison drips from ring edge down
const ringDrips=[];
for(let i=0;i<8;i++){
  const ang=(i/8)*Math.PI*2;
  ringDrips.push({
    ang,
    dropY:RING_CY+Math.sin(ang)*RING_R,
    baseY:RING_CY+Math.sin(ang)*RING_R,
    vy:0,
    active:false,
    timer:Math.random()*5,
    interval:3+Math.random()*6,
    trail:[],
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   PARTICLES: Slow heavy spores, acid drips, bubbles
   ═══════════════════════════════════════════════════════════════════════════ */
// Heavy spores — fall slowly, don't glow
const heavySpores=[];
for(let i=0;i<60;i++){
  heavySpores.push(mkHeavySpore(true));
}
function mkHeavySpore(init){
  return{
    x:60+Math.random()*(W-120),
    y:init?Math.random()*H:-20,
    vy:0.2+Math.random()*0.5, // falls slowly
    vx:(Math.random()-0.5)*0.2,
    r:1+Math.random()*2.5,
    a:0.12+Math.random()*0.2,
    phase:Math.random()*Math.PI*2,
    sp:0.008+Math.random()*0.012, // very slow pulse
    hue:78+Math.random()*18,
    sway:Math.random()*Math.PI*2,
    swaySp:0.008+Math.random()*0.012,
  };
}

// Swamp bubbles — rise from water, pop slowly
const swampBubbles=[];
for(let i=0;i<25;i++){
  swampBubbles.push(mkSwampBubble(true));
}
function mkSwampBubble(init){
  return{
    x:60+Math.random()*(W-120),
    y:init?(H-50-Math.random()*400):(H-20+Math.random()*30),
    r:4+Math.random()*14,
    vy:-(0.12+Math.random()*0.3),
    vx:(Math.random()-0.5)*0.15,
    life:init?Math.random():0,
    lifeSpd:0.003+Math.random()*0.004,
    wobble:Math.random()*Math.PI*2,
    wobSp:0.01+Math.random()*0.015,
    a:0.18+Math.random()*0.18,
  };
}

// Acid drips from canopy
const acidDrips=[];
const DRIP_SRC=[{x:90,y:360},{x:240,y:400},{x:420,y:350},{x:580,y:380},{x:740,y:360},{x:900,y:390},{x:980,y:370}];
for(const s of DRIP_SRC){
  acidDrips.push({...s,dropY:s.y,vy:0,active:false,timer:Math.random()*6,interval:4+Math.random()*8,trail:[]});
}
const driplashes=[];

/* ═══════════════════════════════════════════════════════════════════════════
   MAIN LOOP
   ═══════════════════════════════════════════════════════════════════════════ */
let t=0;

function loop(){
  t+=0.016;

  /* ── PLANTS ── */
  plantsCtx.clearRect(0,0,W,H);

  // Drooping plants
  plantsCtx.lineCap='round';
  for(const p of droopPlants){
    p.phase+=0.003;
    for(const s of p.stems){
      s.phase+=s.sp;
      // Gentle sway from breeze
      const sway=Math.sin(s.phase)*0.04;
      const ang=s.ang+sway;
      const ex=p.x+Math.cos(ang)*s.len;
      const ey=p.y+Math.sin(ang)*s.len+s.droop*s.len*0.4;
      // Control point for droop
      const cpx=p.x+Math.cos(ang)*s.len*0.5+Math.sin(ang)*s.droop*30;
      const cpy=p.y+Math.sin(ang)*s.len*0.5+s.droop*s.len*0.6;
      plantsCtx.strokeStyle=`rgba(${22+Math.floor(Math.random()*3)},${38+Math.floor(Math.random()*4)},5,0.75)`;
      plantsCtx.lineWidth=s.w;
      plantsCtx.shadowBlur=0;
      plantsCtx.beginPath();
      plantsCtx.moveTo(p.x,p.y);
      plantsCtx.quadraticCurveTo(cpx,cpy,ex,ey);
      plantsCtx.stroke();
      // Leaf tip — small dark ellipse
      plantsCtx.fillStyle='rgba(18,32,4,0.65)';
      plantsCtx.beginPath();
      plantsCtx.ellipse(ex,ey,s.w*2.5,s.w*1.2,ang,0,Math.PI*2);
      plantsCtx.fill();
    }
  }

  // Reeds
  for(const r of reeds){
    r.phase+=r.sp;
    const sway=Math.sin(r.phase)*r.lean;
    plantsCtx.strokeStyle=`rgba(20,35,4,${0.6+Math.sin(r.phase)*0.1})`;
    plantsCtx.lineWidth=r.w;
    plantsCtx.beginPath();
    plantsCtx.moveTo(r.x,r.y);
    plantsCtx.bezierCurveTo(r.x+sway*30,r.y-r.h*0.4,r.x+sway*50,r.y-r.h*0.75,r.x+sway*60,r.y-r.h);
    plantsCtx.stroke();
    // Reed top
    plantsCtx.fillStyle='rgba(25,42,5,0.7)';
    plantsCtx.beginPath();
    plantsCtx.ellipse(r.x+sway*60,r.y-r.h,r.w*1.5,r.w*4,sway*2,0,Math.PI*2);
    plantsCtx.fill();
  }

  // Algae on water
  for(const a of algae){
    a.phase+=a.sp;
    a.x+=a.vx;
    if(a.x<-100)a.x=W+100;if(a.x>W+100)a.x=-100;
    const pulse=0.8+Math.sin(a.phase)*0.2;
    plantsCtx.fillStyle=`rgba(15,28,3,${a.a*pulse})`;
    plantsCtx.beginPath();
    plantsCtx.ellipse(a.x,a.y,a.rx,a.ry,Math.sin(a.phase*0.3)*0.3,0,Math.PI*2);
    plantsCtx.fill();
  }

  /* ── RING: Traps + slow tendrils ── */
  ringCtx.clearRect(0,0,W,H);

  // Very subtle center glow — not flashy
  const poisonBreath=0.4+Math.sin(t*0.6)*0.18;
  const pg=ringCtx.createRadialGradient(RING_CX,RING_CY,RING_R*0.3,RING_CX,RING_CY,RING_R+180);
  pg.addColorStop(0,`rgba(28,50,6,${0.14*poisonBreath})`);
  pg.addColorStop(0.4,`rgba(18,35,3,${0.06*poisonBreath})`);
  pg.addColorStop(1,'rgba(0,0,0,0)');
  ringCtx.fillStyle=pg;ringCtx.beginPath();ringCtx.arc(RING_CX,RING_CY,RING_R+180,0,Math.PI*2);ringCtx.fill();

  // Slow poison tendrils swirling
  ringCtx.save();
  ringCtx.translate(RING_CX,RING_CY);
  for(let ti=0;ti<tendrilPhases.length;ti++){
    tendrilPhases[ti].phase+=tendrilPhases[ti].sp;
    const ph=tendrilPhases[ti].phase;
    ringCtx.strokeStyle=`rgba(25,45,5,${0.1+Math.sin(ph)*0.05})`;
    ringCtx.lineWidth=1.2;ringCtx.lineCap='round';
    ringCtx.beginPath();
    for(let i=0;i<80;i++){
      const angle=ph+(ti/5)*Math.PI*2+i*0.08;
      const r=15+i*3.8;
      if(r>RING_R+150) break;
      const x=Math.cos(angle)*r,y=Math.sin(angle)*r;
      i===0?ringCtx.moveTo(x,y):ringCtx.lineTo(x,y);
    }
    ringCtx.stroke();
  }
  ringCtx.restore();

  // Ring drips
  for(const d of ringDrips){
    d.timer+=0.016;
    if(!d.active&&d.timer>d.interval){
      d.active=true;d.timer=0;
      d.dropY=d.baseY;d.vy=0;d.trail=[];
    }
    if(!d.active) continue;
    d.vy+=0.06;d.dropY+=d.vy;
    d.trail.push({x:RING_CX+Math.cos(d.ang)*RING_R,y:d.dropY});
    if(d.trail.length>6) d.trail.shift();
    for(let ti=1;ti<d.trail.length;ti++){
      const ta=(ti/d.trail.length)*0.5;
      ringCtx.fillStyle=`rgba(20,40,4,${ta})`;
      ringCtx.beginPath();
      ringCtx.arc(d.trail[ti].x,d.trail[ti].y,1.5*(ti/d.trail.length),0,Math.PI*2);
      ringCtx.fill();
    }
    if(d.dropY>H-400){d.active=false;d.interval=3+Math.random()*6;}
  }

  // Traps
  for(const tr of traps){
    tr.phase+=tr.glowSp;
    tr.snapTimer+=0.016;
    if(tr.snapState==='open'&&tr.snapTimer>tr.snapInterval){
      tr.snapState='snapping';tr.snapTimer=0;tr.jawV=-0.08;
    }
    if(tr.snapState==='snapping'){
      tr.jawOpen+=tr.jawV;tr.jawV+=0.006;
      if(tr.jawOpen<=0.05){tr.jawOpen=0.05;tr.snapState='closed';tr.snapTimer=0;}
    }
    if(tr.snapState==='closed'&&tr.snapTimer>1.2){tr.snapState='reopening';tr.jawV=0.025;}
    if(tr.snapState==='reopening'){
      tr.jawOpen+=tr.jawV;
      if(tr.jawOpen>=1.0){tr.jawOpen=1.0;tr.snapState='open';tr.snapTimer=0;tr.snapInterval=8+Math.random()*14;}
    }
    drawTrapDim(ringCtx,tr);
  }
  ringCtx.shadowBlur=0;

  /* ── SLOW GROUND FOG ── */
  fogCtx.clearRect(0,0,W,H);
  for(const f of fogLayers){
    f.x+=f.vx;f.phase+=f.sp;
    if(f.x>W+350) f.x=-350;
    const pulse=0.85+Math.sin(f.phase)*0.15;
    const col=f.dark
      ?`rgba(8,14,2,${f.a*pulse})`
      :`hsla(${f.hue},55%,12%,${f.a*pulse*0.7})`;
    const fg=fogCtx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.rx);
    fg.addColorStop(0,col);
    fg.addColorStop(0.5,f.dark?`rgba(5,9,1,${f.a*pulse*0.5})`:`rgba(10,16,2,${f.a*pulse*0.35})`);
    fg.addColorStop(1,'rgba(0,0,0,0)');
    fogCtx.save();fogCtx.scale(1,f.ry/f.rx);
    fogCtx.fillStyle=fg;fogCtx.beginPath();fogCtx.arc(f.x,f.y*(f.rx/f.ry),f.rx,0,Math.PI*2);fogCtx.fill();
    fogCtx.restore();
  }

  /* ── PARTICLES ── */
  partCtx.clearRect(0,0,W,H);

  // Heavy spores — drifting down slowly
  for(let i=0;i<heavySpores.length;i++){
    const s=heavySpores[i];
    s.sway+=s.swaySp;s.phase+=s.sp;
    s.x+=s.vx+Math.sin(s.sway)*0.3;s.y+=s.vy;
    if(s.y>H+20) heavySpores[i]=mkHeavySpore(false);
    // No glow — just dim soft dots
    const fade=0.6+Math.sin(s.phase)*0.25;
    partCtx.fillStyle=`hsla(${s.hue},45%,28%,${s.a*fade})`;
    partCtx.beginPath();partCtx.arc(s.x,s.y,s.r,0,Math.PI*2);partCtx.fill();
  }

  // Swamp bubbles — slow, dim
  for(let i=0;i<swampBubbles.length;i++){
    const b=swampBubbles[i];
    b.wobble+=b.wobSp;b.life+=b.lifeSpd;
    b.x+=b.vx+Math.sin(b.wobble)*0.2;b.y+=b.vy;
    if(b.life>=1||b.y<H-700) swampBubbles[i]=mkSwampBubble(false);
    const fade=Math.sin(b.life*Math.PI)*0.85;
    // Hollow bubble — just outline
    partCtx.strokeStyle=`rgba(25,45,6,${b.a*fade})`;
    partCtx.lineWidth=1;
    partCtx.beginPath();partCtx.arc(b.x,b.y,b.r,0,Math.PI*2);partCtx.stroke();
    // Tiny highlight
    partCtx.fillStyle=`rgba(35,55,8,${b.a*fade*0.3})`;
    partCtx.beginPath();partCtx.arc(b.x-b.r*0.3,b.y-b.r*0.3,b.r*0.3,0,Math.PI*2);partCtx.fill();
  }

  // Acid drips
  for(const d of acidDrips){
    d.timer+=0.016;
    if(!d.active&&d.timer>d.interval){d.active=true;d.timer=0;d.dropY=d.y;d.vy=0;d.trail=[];}
    if(!d.active) continue;
    d.vy+=0.08;d.dropY+=d.vy;
    d.trail.push({x:d.x,y:d.dropY});
    if(d.trail.length>6) d.trail.shift();
    for(let ti=1;ti<d.trail.length;ti++){
      partCtx.fillStyle=`rgba(22,42,4,${(ti/d.trail.length)*0.6})`;
      partCtx.beginPath();partCtx.arc(d.trail[ti].x,d.trail[ti].y,1.5*(ti/d.trail.length)*0.7,0,Math.PI*2);partCtx.fill();
    }
    if(d.dropY>H-200){
      d.active=false;d.interval=4+Math.random()*8;
      for(let si=0;si<4;si++){
        driplashes.push({x:d.x+(Math.random()-0.5)*10,y:d.dropY,vx:(Math.random()-0.5)*2,vy:-(0.6+Math.random()*1),life:1,decay:0.05+Math.random()*0.04,r:0.8+Math.random()*1.5});
      }
    }
  }
  for(let i=driplashes.length-1;i>=0;i--){
    const s=driplashes[i];
    s.x+=s.vx;s.y+=s.vy;s.vy+=0.07;s.life-=s.decay;
    if(s.life<=0){driplashes.splice(i,1);continue;}
    partCtx.fillStyle=`rgba(20,38,4,${s.life*0.5})`;
    partCtx.beginPath();partCtx.arc(s.x,s.y,s.r,0,Math.PI*2);partCtx.fill();
  }

  requestAnimationFrame(loop);
}

loop();
</script>
