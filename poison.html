<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<title>Poison — Der Sumpf</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:1080px;height:1920px;
  overflow:hidden;
  background:#000;
  position:relative;
}
canvas{
  position:absolute;top:0;left:0;
  width:1080px;height:1920px;
  pointer-events:none;
}
#zone-top{
  position:absolute;top:0;left:0;width:1080px;height:120px;
  background:linear-gradient(to bottom,rgba(0,0,0,0.65) 0%,transparent 100%);
  z-index:50;pointer-events:none;
}
#zone-bot{
  position:absolute;bottom:0;left:0;width:1080px;height:920px;
  background:linear-gradient(to top,rgba(0,0,0,0.58) 0%,transparent 100%);
  z-index:50;pointer-events:none;
}
#vignette{
  position:absolute;top:0;left:0;width:1080px;height:1920px;
  background:radial-gradient(ellipse 88% 88% at 50% 50%,transparent 28%,rgba(0,0,0,0.75) 100%);
  z-index:49;pointer-events:none;
}
#center-darken{
  position:absolute;left:150px;top:300px;width:780px;height:540px;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0.38) 0%,transparent 70%);
  z-index:48;pointer-events:none;
}
</style>
</head>
<body>

<canvas id="cvBase"   style="z-index:1"></canvas>
<canvas id="cvWater"  style="z-index:2"></canvas>
<canvas id="cvMiasma" style="z-index:3"></canvas>
<canvas id="cvFog"    style="z-index:4"></canvas>
<canvas id="cvDecay"  style="z-index:5"></canvas>
<canvas id="cvTop"    style="z-index:6"></canvas>

<div id="zone-top"></div>
<div id="zone-bot"></div>
<div id="vignette"></div>
<div id="center-darken"></div>

<script>
'use strict';
const W=1080,H=1920,CX=540,CY=590,RING_R=300;

['cvBase','cvWater','cvMiasma','cvFog','cvDecay','cvTop'].forEach(id=>{
  const c=document.getElementById(id);c.width=W;c.height=H;
});
const gc=id=>document.getElementById(id).getContext('2d');
const ctxBase  =gc('cvBase');
const ctxWater =gc('cvWater');
const ctxMiasma=gc('cvMiasma');
const ctxFog   =gc('cvFog');
const ctxDecay =gc('cvDecay');
const ctxTop   =gc('cvTop');

document.getElementById('cvWater').style.mixBlendMode  ='screen';
document.getElementById('cvMiasma').style.mixBlendMode ='screen';
document.getElementById('cvFog').style.mixBlendMode    ='screen';
document.getElementById('cvDecay').style.mixBlendMode  ='screen';
document.getElementById('cvTop').style.mixBlendMode    ='screen';

let t=0, last=performance.now();
const rng=(a,b)=>a+(b-a)*Math.random();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,x)=>a+(b-a)*x;
const hash=(n)=>{ let x=Math.sin(n)*43758.5453; return x-Math.floor(x); };

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 1 — BASE: schwarzer Schlamm, stinkendes Wasser, kein Ausweg
// ─────────────────────────────────────────────────────────────────────────────

// The base uses pre-rendered noise texture for real mud feel
const mudOff=document.createElement('canvas');
mudOff.width=W; mudOff.height=H;
const mudCtx=mudOff.getContext('2d');
(function buildMud(){
  const img=mudCtx.createImageData(W,H);
  const d=img.data;
  for(let i=0;i<W*H;i++){
    const x=i%W, y=Math.floor(i/W);
    // Multi-octave turbulence — mud has texture
    const n1=(Math.sin(x*0.028+y*0.019)*0.5+0.5);
    const n2=(Math.sin(x*0.071-y*0.053+2.3)*0.5+0.5);
    const n3=(Math.sin(x*0.014+y*0.041+4.1)*0.5+0.5);
    const n4=(Math.sin((x+y)*0.035+1.7)*0.5+0.5);
    const n=n1*0.4+n2*0.3+n3*0.2+n4*0.1;

    // Depth — lower = darker (water) upper = slightly less dark (exposed mud)
    const depthFrac=y/H;
    // Is this water zone or mud zone?
    const waterLine=0.42; // water surface is at ~42% from top
    let r,g,b;
    if(y/H>waterLine){
      // Below water line — the submerged world
      const waterDepth=(y/H-waterLine)/(1-waterLine);
      // Black water, slightly tinted with rot
      const darkness=lerp(0.12,0.04,waterDepth);
      r=Math.round(n*darkness*22+2);
      g=Math.round(n*darkness*28+3); // slight green tint — algae
      b=Math.round(n*darkness*8+1);
      // Mud patches on bottom — brown organic matter
      if(n>0.62 && waterDepth>0.4){
        const mf=(n-0.62)/0.38;
        r=Math.round(lerp(r,28+mf*12,mf*0.6));
        g=Math.round(lerp(g,22+mf*8,mf*0.5));
        b=Math.round(lerp(b,8+mf*3,mf*0.4));
      }
    } else {
      // Above water — sky/atmosphere zone, very dark
      const skyFrac=1-y/H/waterLine;
      r=Math.round(n*4+1);
      g=Math.round(n*5+2);
      b=Math.round(n*3+1);
    }
    d[i*4]=r; d[i*4+1]=g; d[i*4+2]=b; d[i*4+3]=255;
  }
  mudCtx.putImageData(img,0,0);
})();

// Dead tree silhouettes — bare, skeletal, leafless
// The winter shows what they really are
const DEAD_TREES=[
  {x:55,   base:H*0.48, h:580, w:12},
  {x:200,  base:H*0.46, h:650, w:14},
  {x:395,  base:H*0.45, h:620, w:13},
  {x:590,  base:H*0.46, h:680, w:15},
  {x:780,  base:H*0.45, h:640, w:14},
  {x:950,  base:H*0.47, h:560, w:11},
  {x:1055, base:H*0.48, h:510, w:10},
  // Background thinner trees
  {x:130,  base:H*0.47, h:480, w:7},
  {x:310,  base:H*0.46, h:520, w:8},
  {x:690,  base:H*0.45, h:500, w:8},
  {x:870,  base:H*0.47, h:460, w:7},
];

function drawDeadTree(c, tx, base, h, w, alpha){
  c.save();
  c.globalAlpha=alpha;
  // Trunk
  const lean=Math.sin(tx*0.023)*14;
  const topX=tx+lean, topY=base-h;
  c.fillStyle='rgba(8,10,5,0.96)';
  c.beginPath();
  c.moveTo(tx-w,base);
  c.bezierCurveTo(tx-w*0.8,base-h*0.4, topX-w*0.5,base-h*0.8, topX,topY);
  c.bezierCurveTo(topX+w*0.5,base-h*0.8, tx+w*0.8,base-h*0.4, tx+w,base);
  c.closePath(); c.fill();

  // Bare branches — no leaves, just skeleton
  const branchAngles=[-0.6,-0.35,-0.15,0.15,0.35,0.6];
  branchAngles.forEach((ba,bi)=>{
    const branchY=topY+h*(0.12+bi*0.06);
    const branchLen=w*(4+bi*0.8)*(bi<3?1:-1);
    const bx=topX+lean*(1-bi/branchAngles.length)*0.5;
    c.strokeStyle='rgba(7,9,4,0.92)';
    c.lineWidth=Math.max(0.8,w*0.25*(1-bi/branchAngles.length));
    c.lineCap='round';
    c.beginPath();
    c.moveTo(bx,branchY);
    const endX=bx+Math.cos(ba+Math.PI/2)*branchLen;
    const endY=branchY+Math.sin(ba+Math.PI/2)*Math.abs(branchLen)*0.4;
    c.lineTo(endX,endY);
    c.stroke();
    // Sub-branches
    c.lineWidth=Math.max(0.4,w*0.12);
    c.strokeStyle='rgba(6,8,4,0.8)';
    for(let sb=0;sb<2;sb++){
      const sba=ba+(sb===0?0.25:-0.25);
      const sbLen=branchLen*0.45;
      const sbStartX=bx+Math.cos(ba+Math.PI/2)*branchLen*0.55;
      const sbStartY=branchY+Math.sin(ba+Math.PI/2)*Math.abs(branchLen)*0.4*0.55;
      c.beginPath();
      c.moveTo(sbStartX,sbStartY);
      c.lineTo(sbStartX+Math.cos(sba+Math.PI/2)*sbLen,
               sbStartY+Math.sin(sba+Math.PI/2)*Math.abs(sbLen)*0.4);
      c.stroke();
    }
  });
  c.restore();
}

// Pre-render trees
const treeOff=document.createElement('canvas');
treeOff.width=W; treeOff.height=H;
const treeCtx=treeOff.getContext('2d');
DEAD_TREES.forEach(tr=>{
  const alpha=tr.w>10?0.88:0.55;
  drawDeadTree(treeCtx,tr.x,tr.base,tr.h,tr.w,alpha);
});

// Slow breathing base glow — the toxic ground exhales
const EXHALE_ZONES=Array.from({length:6},(_,i)=>({
  x: 100+i*165+rng(-40,40),
  y: rng(H*0.48,H*0.82),
  r: rng(80,220),
  phase: rng(0,Math.PI*2),
  speed: rng(0.03,0.07),
  // Color: sickly yellow-green — THIS is the toxic color
  hue: Math.random()<0.6 ? rng(68,88) : rng(88,108),
  baseA: rng(0.025,0.055),
}));

function drawBase(){
  const c=ctxBase;
  c.clearRect(0,0,W,H);

  // Mud texture
  c.drawImage(mudOff,0,0);

  // Tree silhouettes
  c.drawImage(treeOff,0,0);

  // Toxic exhale from ground — the sickly yellow-green of decay
  EXHALE_ZONES.forEach(ez=>{
    const pulse=0.5+0.5*Math.sin(t*ez.speed+ez.phase);
    const a=ez.baseA*(0.5+0.8*pulse);
    c.save();
    c.globalAlpha=a;
    const g=c.createRadialGradient(ez.x,ez.y,0,ez.x,ez.y,ez.r*(0.9+0.2*pulse));
    // Sickly yellow-green — this is what decomposition looks like
    g.addColorStop(0,  `hsl(${ez.hue},75%,38%)`);
    g.addColorStop(0.4,`hsl(${ez.hue},60%,20%)`);
    g.addColorStop(1,  'rgba(0,0,0,0)');
    c.fillStyle=g;
    c.shadowColor=`hsl(${ez.hue},80%,42%)`; c.shadowBlur=ez.r*0.6*pulse;
    c.beginPath(); c.arc(ez.x,ez.y,ez.r*(0.9+0.2*pulse),0,Math.PI*2); c.fill();
    c.shadowBlur=0;
    c.restore();
  });

  // Deep dark water fill — the still black pool
  const waterGrad=c.createLinearGradient(0,H*0.38,0,H*0.58);
  waterGrad.addColorStop(0,  'rgba(0,0,0,0)');
  waterGrad.addColorStop(0.3,`rgba(3,8,3,${0.55+0.08*Math.sin(t*0.06)})`);
  waterGrad.addColorStop(0.7,`rgba(2,6,2,0.72)`);
  waterGrad.addColorStop(1,  'rgba(0,0,0,0)');
  c.fillStyle=waterGrad; c.fillRect(0,H*0.38,W,H*0.2);
}

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 2 — WATER: das schwarze stehende Wasser — es vergisst nicht, es verdaut
// Gasblasen, Ölfilm, Schaumränder
// ─────────────────────────────────────────────────────────────────────────────

// The water surface — absolutely still except for gas bubbles
const WATER_Y=H*0.495; // the actual surface line

// Oil film / scum lines — horizontal, barely moving
const SCUM_LINES=Array.from({length:22},(_,i)=>({
  y: H*0.41+i*14+rng(-5,5),
  alpha: rng(0.02,0.06),
  // Color of rot: yellow-green-brown
  hue: rng(55,95),
  speed: rng(-0.008,0.008),
  phase: rng(0,Math.PI*2),
  thickness: rng(0.8,3),
}));

// Gas bubble class — methane rising through black water
class Bubble {
  constructor(){this.reset(true)}
  reset(init=false){
    this.x=rng(60,W-60);
    this.y=init ? rng(H*0.5,H) : rng(H*0.65,H*0.98);
    this.r=rng(2,9);
    this.vy=-(rng(0.12,0.4));
    this.vx=rng(-0.04,0.04);
    this.life=init?Math.random():1;
    this.decay=rng(0.002,0.006);
    this.phase=rng(0,Math.PI*2);
    this.wobble=rng(0.15,0.45); // lateral wobble frequency
    this.hue=rng(70,100); // toxic yellow-green
  }
  update(dt){
    this.y+=this.vy*dt*60;
    this.x+=this.vx*dt*60+Math.sin(t*this.wobble+this.phase)*0.5;
    this.life-=this.decay*dt*60;
    if(this.life<=0||this.y<H*0.38) this.reset(false);
  }
  draw(c){
    if(this.y>WATER_Y+5) return; // only draw when rising through water, not below
    c.save();
    c.globalAlpha=this.life*0.55;
    c.strokeStyle=`hsla(${this.hue},55%,42%,0.8)`;
    c.lineWidth=0.7;
    c.shadowColor=`hsl(${this.hue},65%,45%)`; c.shadowBlur=this.r*1.5;
    c.beginPath(); c.arc(this.x,this.y,this.r,0,Math.PI*2); c.stroke();
    c.fillStyle=`hsla(${this.hue},40%,30%,0.15)`;
    c.fill();
    c.shadowBlur=0;
    c.restore();
  }
}

// Surface pop — brief disturbance when bubble breaks surface
class SurfacePop {
  constructor(x){
    this.x=x; this.y=WATER_Y;
    this.r=rng(4,14);
    this.life=1; this.decay=rng(0.04,0.08);
    this.hue=rng(70,95);
  }
  update(dt){ this.r+=dt*25; this.life-=this.decay*dt*60; return this.life>0; }
  draw(c){
    c.save();
    c.globalAlpha=this.life*this.life*0.45;
    c.strokeStyle=`hsl(${this.hue},50%,35%)`;
    c.lineWidth=0.8;
    c.shadowColor=`hsl(${this.hue},70%,42%)`; c.shadowBlur=6;
    c.beginPath(); c.arc(this.x,this.y,this.r,0,Math.PI*2); c.stroke();
    c.shadowBlur=0;
    c.restore();
  }
}

const BUBBLES=Array.from({length:45},()=>new Bubble());
let surfacePops=[]; let nextPop=rng(0.5,2.5);

function drawWater(dt){
  const c=ctxWater;
  c.clearRect(0,0,W,H);

  // Scum/oil lines — the skin of the water
  SCUM_LINES.forEach(sl=>{
    const wave=Math.sin(t*sl.speed+sl.phase)*8;
    const sl_a=sl.alpha*(0.7+0.3*Math.sin(t*0.1+sl.phase));
    c.save();
    c.globalAlpha=sl_a;
    // Discontinuous line — scum isn't uniform
    for(let ix=0;ix<W;ix+=rng(20,60)){
      const segLen=rng(15,80);
      const sg=c.createLinearGradient(ix,0,ix+segLen,0);
      sg.addColorStop(0,'rgba(0,0,0,0)');
      sg.addColorStop(0.3,`hsl(${sl.hue},50%,28%)`);
      sg.addColorStop(0.7,`hsl(${sl.hue},50%,28%)`);
      sg.addColorStop(1,'rgba(0,0,0,0)');
      c.fillStyle=sg;
      c.fillRect(ix,sl.y+wave,segLen,sl.thickness);
    }
    c.restore();
  });

  // The water surface itself — barely perceptible sheen
  const surfaceSheen=c.createLinearGradient(0,WATER_Y-8,0,WATER_Y+8);
  surfaceSheen.addColorStop(0,'rgba(0,0,0,0)');
  surfaceSheen.addColorStop(0.5,`rgba(20,32,12,${0.25+0.08*Math.sin(t*0.08)})`);
  surfaceSheen.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=surfaceSheen; c.fillRect(0,WATER_Y-8,W,16);

  // Bubbles rising
  BUBBLES.forEach(b=>{ b.update(dt); b.draw(c); });

  // Pops
  nextPop-=dt;
  if(nextPop<=0){
    surfacePops.push(new SurfacePop(rng(60,W-60)));
    nextPop=rng(0.4,3);
  }
  surfacePops=surfacePops.filter(p=>{ const a=p.update(dt); p.draw(c); return a; });

  // Toxic reflection — the trees reflected in the black water, distorted
  // Dark inverted band below waterline
  const reflGrad=c.createLinearGradient(0,WATER_Y,0,WATER_Y+180);
  reflGrad.addColorStop(0,  `rgba(12,18,8,${0.35+0.05*Math.sin(t*0.07)})`);
  reflGrad.addColorStop(0.5,`rgba(8,12,5,0.2)`);
  reflGrad.addColorStop(1,  'rgba(0,0,0,0)');
  c.fillStyle=reflGrad; c.fillRect(0,WATER_Y,W,180);
}

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 3 — MIASMA: das Ausatmen des Sumpfes — Methanwolken, Schwefeldampf
// "Der Geruch kommt zuerst" — sichtbar gemacht
// ─────────────────────────────────────────────────────────────────────────────

// Gas columns rising from specific spots
const GAS_VENTS=Array.from({length:10},(_,i)=>({
  x: rng(60,W-60),
  y: rng(H*0.46,H*0.7),
  phase: rng(0,Math.PI*2),
  speed: rng(0.04,0.09),
  size: rng(25,70),
  hue: rng(70,95), // sickly yellow-green
  alpha: rng(0.04,0.09),
}));

// Rising gas cloud particle
class GasCloud {
  constructor(){this.reset(true)}
  reset(init=false){
    const vent=GAS_VENTS[Math.floor(Math.random()*GAS_VENTS.length)];
    this.x=vent.x+rng(-30,30);
    this.y=init ? rng(H*0.3,H*0.7) : vent.y;
    this.vy=-(rng(0.2,0.6));
    this.vx=rng(-0.12,0.12);
    this.r=rng(20,65);
    this.life=init?Math.random():1;
    this.decay=rng(0.004,0.009);
    this.hue=rng(68,95);
    this.phase=rng(0,Math.PI*2);
    this.alpha=rng(0.04,0.085);
  }
  update(dt){
    this.x+=this.vx*dt*60+Math.sin(t*0.4+this.phase)*0.5;
    this.y+=this.vy*dt*60;
    this.r*=(1+dt*0.08); // expand as it rises
    this.life-=this.decay*dt*60;
    if(this.life<=0||this.y<-this.r) this.reset(false);
  }
  draw(c){
    c.save();
    c.globalAlpha=this.alpha*this.life*(0.6+0.4*Math.sin(t*1.2+this.phase));
    const g=c.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r);
    // Sickly yellow-green — not glowing, just wrong
    g.addColorStop(0,  `hsl(${this.hue},55%,30%)`);
    g.addColorStop(0.5,`hsl(${this.hue},45%,18%)`);
    g.addColorStop(1,  'rgba(0,0,0,0)');
    c.fillStyle=g;
    c.beginPath(); c.arc(this.x,this.y,this.r,0,Math.PI*2); c.fill();
    c.restore();
  }
}
const GAS_CLOUDS=Array.from({length:30},()=>new GasCloud());

// Slow-pulse toxic pools on the ground — pockets of gas trapped in mud
const TOXIC_POOLS=Array.from({length:9},(_,i)=>({
  x: rng(80,W-80),
  y: rng(H*0.52,H*0.88),
  rx: rng(40,130),
  ry: rng(15,45),
  phase: rng(0,Math.PI*2),
  speed: rng(0.06,0.14),
  hue: rng(68,92),
  alpha: rng(0.055,0.12),
}));

function drawMiasma(dt){
  const c=ctxMiasma;
  c.clearRect(0,0,W,H);

  // Toxic ground pools — pulsing sick light from trapped gas
  TOXIC_POOLS.forEach(tp=>{
    const pulse=0.5+0.5*Math.sin(t*tp.speed+tp.phase);
    const a=tp.alpha*(0.4+0.8*pulse);
    c.save();
    c.globalAlpha=a;
    c.translate(tp.x,tp.y);
    const g=c.createRadialGradient(0,0,0,0,0,tp.rx);
    g.addColorStop(0,  `hsl(${tp.hue},72%,32%)`);
    g.addColorStop(0.5,`hsl(${tp.hue},55%,16%)`);
    g.addColorStop(1,  'rgba(0,0,0,0)');
    c.scale(1,tp.ry/tp.rx);
    c.shadowColor=`hsl(${tp.hue},80%,36%)`; c.shadowBlur=tp.rx*0.5*pulse;
    c.fillStyle=g; c.beginPath(); c.arc(0,0,tp.rx,0,Math.PI*2); c.fill();
    c.shadowBlur=0;
    c.restore();
  });

  // Gas cloud particles rising
  GAS_CLOUDS.forEach(gc=>{ gc.update(dt); gc.draw(c); });
}

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 4 — FOG: dicker grau-grüner Nebel, frisst Konturen
// "Zehn Meter rein und du weißt nicht mehr genau wo du hergekommen bist"
// ─────────────────────────────────────────────────────────────────────────────

// Fog masses — HEAVY, grey-green, not beautiful
const FOG_BANKS=Array.from({length:14},(_,i)=>({
  x:   rng(-200,W+200),
  y:   rng(H*0.08,H*0.68),
  rx:  rng(180,420),
  ry:  rng(60,160),
  vx:  rng(-0.06,0.06),
  vy:  rng(-0.01,0.01),
  phase: rng(0,Math.PI*2),
  speed: rng(0.006,0.016),
  alpha: rng(0.07,0.16),
  // Grey-green, almost colorless — this is NOT romantic fog
  hue:   rng(80,115),
  sat:   rng(8,22), // very desaturated
  lig:   rng(38,55),
}));

// Dense ground fog layer — sits right on water, very thick
const GROUND_FOG=Array.from({length:8},(_,i)=>({
  x:    rng(0,W),
  y:    H*0.47+rng(-15,15),
  rx:   rng(220,500),
  ry:   rng(35,80),
  vx:   rng(-0.03,0.03),
  phase:rng(0,Math.PI*2),
  speed:rng(0.005,0.012),
  alpha:rng(0.10,0.22),
}));

function drawFog(){
  const c=ctxFog;
  c.clearRect(0,0,W,H);

  // Ground fog on water surface
  GROUND_FOG.forEach(gf=>{
    gf.x+=gf.vx;
    if(gf.x<-gf.rx*2) gf.x=W+gf.rx;
    if(gf.x>W+gf.rx*2) gf.x=-gf.rx;
    const pulse=0.75+0.25*Math.sin(t*gf.speed+gf.phase);
    c.save();
    c.globalAlpha=gf.alpha*pulse;
    c.translate(gf.x,gf.y);
    const g=c.createRadialGradient(0,0,0,0,0,gf.rx);
    // Off-white grey — the color of something you don't want to breathe
    g.addColorStop(0,  'rgba(155,162,140,0.7)');
    g.addColorStop(0.4,'rgba(120,128,108,0.35)');
    g.addColorStop(1,  'rgba(0,0,0,0)');
    c.scale(1,gf.ry/gf.rx);
    c.fillStyle=g; c.beginPath(); c.arc(0,0,gf.rx,0,Math.PI*2); c.fill();
    c.restore();
  });

  // Atmospheric fog banks — heavy, grey-green, slow
  FOG_BANKS.forEach(fb=>{
    fb.x+=fb.vx;
    fb.y+=fb.vy;
    if(fb.x<-fb.rx*2) fb.x=W+fb.rx;
    if(fb.x>W+fb.rx*2) fb.x=-fb.rx;
    const pulse=0.6+0.4*Math.sin(t*fb.speed+fb.phase);
    c.save();
    c.globalAlpha=fb.alpha*pulse;
    c.translate(fb.x,fb.y);
    const g=c.createRadialGradient(0,0,0,0,0,fb.rx);
    g.addColorStop(0,  `hsl(${fb.hue},${fb.sat}%,${fb.lig}%)`);
    g.addColorStop(0.5,`hsl(${fb.hue},${fb.sat-5}%,${fb.lig-8}%)`);
    g.addColorStop(1,  'rgba(0,0,0,0)');
    c.scale(1,fb.ry/fb.rx);
    c.fillStyle=g; c.beginPath(); c.arc(0,0,fb.rx,0,Math.PI*2); c.fill();
    c.restore();
  });

  // The fog that swallows the tree tops — heavy ceiling of grey
  const fogCeiling=c.createLinearGradient(0,0,0,H*0.22);
  fogCeiling.addColorStop(0,   `rgba(18,22,14,${0.88+0.05*Math.sin(t*0.04)})`);
  fogCeiling.addColorStop(0.5, `rgba(12,16,10,0.55)`);
  fogCeiling.addColorStop(0.8, `rgba(8,12,6,0.2)`);
  fogCeiling.addColorStop(1,   'rgba(0,0,0,0)');
  c.fillStyle=fogCeiling; c.fillRect(0,0,W,H*0.22);
}

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 5 — DECAY: biolumineszenz — kalt, unheimlich, nicht schön
// Pilzsporen, verrottendes Holz das glimmt, Bakterienfilm
// ─────────────────────────────────────────────────────────────────────────────

// Rotting wood patches that glow — cold foxfire
const FOXFIRE=Array.from({length:12},(_,i)=>({
  x: rng(20,W-20),
  y: rng(H*0.45,H*0.92),
  r: rng(8,35),
  phase: rng(0,Math.PI*2),
  speed: rng(0.05,0.14),
  // Foxfire is a very specific cold blue-green
  hue: rng(140,170),
  alpha: rng(0.06,0.14),
}));

// Spores — tiny things drifting up from the rot
class DecaySpore {
  constructor(){this.reset(true)}
  reset(init=false){
    this.x=init?rng(0,W):rng(80,W-80);
    this.y=init?rng(H*0.3,H):rng(H*0.5,H*0.9);
    this.vy=-(rng(0.04,0.18));
    this.vx=rng(-0.1,0.1);
    this.r=rng(0.6,2.2);
    this.life=init?Math.random():1;
    this.decay=rng(0.0006,0.0016);
    this.phase=rng(0,Math.PI*2);
    this.sp=rng(0.8,2.5);
    // Color: either sickly yellow-green or cold foxfire blue-green
    this.hue=Math.random()<0.55 ? rng(72,95) : rng(145,168);
    this.alpha=rng(0.15,0.4);
  }
  update(dt){
    this.x+=this.vx*dt*60+Math.sin(t*0.35+this.phase)*0.25;
    this.y+=this.vy*dt*60;
    this.life-=this.decay*dt*60;
    if(this.life<=0||this.y<0) this.reset(false);
  }
  draw(c){
    c.save();
    c.globalAlpha=this.alpha*this.life*(0.45+0.55*Math.pow(Math.max(0,Math.sin(t*this.sp+this.phase)),1.5));
    c.fillStyle=`hsl(${this.hue},65%,48%)`;
    c.shadowColor=`hsl(${this.hue},80%,52%)`; c.shadowBlur=this.r*3;
    c.beginPath(); c.arc(this.x,this.y,this.r,0,Math.PI*2); c.fill();
    c.shadowBlur=0;
    c.restore();
  }
}
const SPORES=Array.from({length:55},()=>new DecaySpore());

function drawDecay(dt){
  const c=ctxDecay;
  c.clearRect(0,0,W,H);

  // Foxfire patches — rotting wood that glows cold blue-green in the dark
  FOXFIRE.forEach(ff=>{
    const pulse=0.5+0.5*Math.sin(t*ff.speed+ff.phase);
    const a=ff.alpha*(0.3+0.9*pulse);
    c.save();
    c.globalAlpha=a;
    const g=c.createRadialGradient(ff.x,ff.y,0,ff.x,ff.y,ff.r*(1+0.3*pulse));
    g.addColorStop(0,  `hsl(${ff.hue},70%,45%)`);
    g.addColorStop(0.5,`hsl(${ff.hue},55%,22%)`);
    g.addColorStop(1,  'rgba(0,0,0,0)');
    c.shadowColor=`hsl(${ff.hue},85%,50%)`; c.shadowBlur=ff.r*2.5*pulse;
    c.fillStyle=g; c.beginPath(); c.arc(ff.x,ff.y,ff.r*(1+0.3*pulse),0,Math.PI*2); c.fill();
    c.shadowBlur=0;
    c.restore();
  });

  // Spores
  SPORES.forEach(s=>{ s.update(dt); s.draw(c); });
}

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 6 — TOP: Spawn Ring + ambient poison particles
// ─────────────────────────────────────────────────────────────────────────────
const RING_MOTES=Array.from({length:60},(_,i)=>({
  angle:i/60*Math.PI*2,
  speed:rng(-0.003,0.003),
  rOff:rng(-0.28,0.28),
  r:rng(0.8,2.5),
  life:Math.random(),
  decay:rng(0.003,0.007),
  phase:rng(0,Math.PI*2),
  // Mix of sickly yellow-green and cold foxfire
  hue:Math.random()<0.5?rng(72,92):rng(145,165),
}));

function drawRing(c){
  // Ring oscillates between yellow-green and cold blue-green
  const ringHue=lerp(82,155,0.5+0.5*Math.sin(t*0.25));
  [65,28,10,3].forEach((lw,pass)=>{
    const la=[0.022,0.055,0.16,0.52][pass]*(0.65+0.35*Math.sin(t*0.7));
    c.strokeStyle=`hsla(${ringHue},72%,48%,${la})`;
    c.lineWidth=lw;
    c.shadowColor=`hsl(${ringHue},90%,52%)`; c.shadowBlur=lw*2.5;
    c.beginPath(); c.arc(CX,CY,RING_R,0,Math.PI*2); c.stroke();
    c.shadowBlur=0;
  });
  RING_MOTES.forEach(rm=>{
    rm.angle+=rm.speed;
    rm.life-=rm.decay;
    if(rm.life<=0){rm.life=1;rm.decay=rng(0.003,0.007);}
    const rx=CX+Math.cos(rm.angle)*(RING_R+rm.rOff*22);
    const ry=CY+Math.sin(rm.angle)*(RING_R+rm.rOff*22);
    const ra=rm.life*(0.3+0.45*Math.sin(t*1.8+rm.phase));
    c.globalAlpha=ra*0.52;
    c.fillStyle=`hsl(${rm.hue},78%,55%)`;
    c.shadowColor=`hsl(${rm.hue},95%,58%)`; c.shadowBlur=rm.r*4;
    c.beginPath(); c.arc(rx,ry,rm.r,0,Math.PI*2); c.fill();
    c.shadowBlur=0;
  });
  c.globalAlpha=1;
}

function drawTop(dt){
  const c=ctxTop;
  c.clearRect(0,0,W,H);
  drawRing(c);
}

// ─────────────────────────────────────────────────────────────────────────────
// MAIN LOOP
// ─────────────────────────────────────────────────────────────────────────────
function loop(now){
  const dt=Math.min((now-last)/1000,0.05);
  last=now; t+=dt;

  drawBase();
  drawWater(dt);
  drawMiasma(dt);
  drawFog();
  drawDecay(dt);
  drawTop(dt);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
