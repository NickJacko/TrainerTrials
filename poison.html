<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Poison — Giftdschungel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#020008;}
canvas{position:absolute;inset:0;width:1080px;height:1920px;display:block;}
.bg{position:absolute;inset:0;background:
  radial-gradient(ellipse 70% 50% at 50% 50%, #0a2008 0%, #040010 55%, transparent 80%),
  linear-gradient(180deg, #020008 0%, #040010 40%, #040010 70%, #020006 100%);}

/* Jungle leaves silhouettes */
.jungle-top{position:absolute;top:0;left:0;right:0;height:280px;background:#020006;
  clip-path:polygon(0 0, 100% 0, 100% 45%, 95% 70%, 88% 35%, 80% 75%, 72% 30%, 65% 80%, 58% 40%, 50% 85%, 42% 35%, 35% 75%, 28% 30%, 20% 80%, 12% 40%, 5% 70%, 0 50%);}
.jungle-bot{position:absolute;bottom:0;left:0;right:0;height:340px;background:#020006;
  clip-path:polygon(0 100%, 100% 100%, 100% 55%, 96% 30%, 90% 75%, 84% 20%, 78% 65%, 70% 15%, 62% 70%, 55% 25%, 48% 75%, 40% 20%, 32% 60%, 24% 15%, 16% 70%, 8% 25%, 0 55%);}
.vines-l{position:absolute;top:0;left:0;width:80px;height:100%;background:linear-gradient(180deg,#020008 0%,rgba(2,0,8,0) 60%);}
.vines-r{position:absolute;top:0;right:0;width:80px;height:100%;background:linear-gradient(180deg,#020008 0%,rgba(2,0,8,0) 60%);}

/* Venus plants */
.plant{position:absolute;bottom:280px;pointer-events:none;}
.p1{left:8%;}.p2{right:12%;}.p3{left:38%;}
.trap{position:absolute;width:70px;height:50px;background:radial-gradient(ellipse at 50% 100%,#5a0a55 0%,#2a0030 60%,#10001a 100%);border-radius:50% 50% 20% 20% / 80% 80% 30% 30%;box-shadow:0 0 25px rgba(138,43,226,0.6);}
.trap::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent 7px,rgba(255,255,255,0.3) 7px,rgba(255,255,255,0.3) 8px);border-radius:50% 50% 20% 20% / 80% 80% 30% 30%;}
.stalk{position:absolute;width:6px;height:180px;background:linear-gradient(180deg,#2a0050 0%,#0a0015 100%);left:32px;top:20px;border-radius:3px;}

.zone-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(0,0,0,0.55) 0%,transparent 100%);z-index:40;}
.zone-bot{position:absolute;bottom:0;left:0;right:0;height:920px;background:linear-gradient(0deg,rgba(0,0,5,0.55) 0%,rgba(0,0,5,0.12) 40%,transparent 100%);z-index:40;}
.center-darken{position:absolute;top:300px;left:50%;transform:translateX(-50%);width:780px;height:540px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(0,5,0,0.4) 0%,transparent 70%);z-index:38;}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 40%,rgba(0,0,0,0.65) 100%);z-index:39;pointer-events:none;}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="fog"></canvas>
<div class="jungle-top"></div>
<div class="jungle-bot"></div>
<div class="vines-l"></div>
<div class="vines-r"></div>
<canvas id="poisonPlants"></canvas>
<div class="plant p1"><div class="stalk"></div><div class="trap" style="top:0;"></div></div>
<div class="plant p2"><div class="stalk"></div><div class="trap" style="top:0;"></div></div>
<div class="plant p3"><div class="stalk"></div><div class="trap" style="top:0;"></div></div>
<canvas id="spores"></canvas>
<canvas id="drips"></canvas>
<div class="center-darken"></div>
<div class="vignette"></div>
<div class="zone-top"></div>
<div class="zone-bot"></div>
<script>
const W=1080,H=1920;
function setup(id){const c=document.getElementById(id);c.width=W;c.height=H;return c.getContext('2d');}

const fg=setup('fog');
const fogs=[];
for(let i=0;i<30;i++)fogs.push({x:Math.random()*W,y:Math.random()*H,r:120+Math.random()*180,vx:(Math.random()-0.5)*0.2,vy:(Math.random()-0.5)*0.08,hue:Math.random()<0.6?120:280,a:0.1+Math.random()*0.15});

const pp=setup('poisonPlants');
const plants=[];
for(let i=0;i<40;i++)plants.push({x:Math.random()*W,y:Math.random()*H,sz:4+Math.random()*8,hue:Math.random()<0.6?120:280,ph:Math.random()*Math.PI*2,shape:Math.floor(Math.random()*3)});

const sp=setup('spores');
const spores=[];
for(let i=0;i<80;i++)spores.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.5,vy:-0.2-Math.random()*0.4,vx:(Math.random()-0.5)*0.3,a:0.4+Math.random()*0.4,hue:Math.random()<0.6?120:280,ph:Math.random()*Math.PI*2});

const dr=setup('drips');
const drips=[];
for(let i=0;i<6;i++)drips.push({x:200+Math.random()*680,y:240+Math.random()*60,vy:1.5+Math.random()*1.5,sz:1.8+Math.random(),next:performance.now()+Math.random()*3000});

let t=0;
function loop(){
  t+=0.016;
  fg.clearRect(0,0,W,H);fg.globalCompositeOperation='screen';
  for(const f of fogs){f.x+=f.vx;f.y+=f.vy;
    if(f.x<-200)f.x=W+200;if(f.x>W+200)f.x=-200;if(f.y<-200)f.y=H+200;if(f.y>H+200)f.y=-200;
    const g=fg.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
    g.addColorStop(0,`hsla(${f.hue},100%,35%,${f.a})`);g.addColorStop(1,`hsla(${f.hue},100%,25%,0)`);
    fg.fillStyle=g;fg.beginPath();fg.arc(f.x,f.y,f.r,0,Math.PI*2);fg.fill();}
  fg.globalCompositeOperation='source-over';

  pp.clearRect(0,0,W,H);
  for(const p of plants){p.ph+=0.03;const a=0.5+Math.sin(p.ph)*0.4;
    pp.fillStyle=`hsla(${p.hue},100%,60%,${a})`;pp.shadowBlur=15;pp.shadowColor=`hsl(${p.hue},100%,50%)`;
    pp.beginPath();
    if(p.shape===0)pp.arc(p.x,p.y,p.sz,0,Math.PI*2);
    else if(p.shape===1){pp.moveTo(p.x,p.y-p.sz);pp.lineTo(p.x+p.sz,p.y);pp.lineTo(p.x,p.y+p.sz);pp.lineTo(p.x-p.sz,p.y);pp.closePath();}
    else {for(let a=0;a<Math.PI*2;a+=Math.PI/3){const r=a%(Math.PI/3)===0?p.sz:p.sz*0.5;pp.lineTo(p.x+Math.cos(a)*r,p.y+Math.sin(a)*r);}pp.closePath();}
    pp.fill();}
  pp.shadowBlur=0;

  sp.clearRect(0,0,W,H);
  for(const s of spores){s.ph+=0.04;
    s.x+=s.vx+Math.sin(s.ph)*0.3;s.y+=s.vy;
    if(s.y<-20){s.y=H+20;s.x=Math.random()*W;}
    sp.fillStyle=`hsla(${s.hue},100%,65%,${s.a})`;sp.shadowBlur=8;sp.shadowColor=`hsl(${s.hue},100%,55%)`;
    sp.beginPath();sp.arc(s.x,s.y,s.r,0,Math.PI*2);sp.fill();}
  sp.shadowBlur=0;

  dr.clearRect(0,0,W,H);
  for(const d of drips){
    if(performance.now()>d.next){
      d.y+=d.vy;
      if(d.y>H-300){d.next=performance.now()+3000+Math.random()*4000;d.y=240+Math.random()*60;d.x=200+Math.random()*680;}
      dr.fillStyle='rgba(57,255,20,0.85)';dr.shadowBlur=8;dr.shadowColor='#39ff14';
      dr.beginPath();dr.ellipse(d.x,d.y,d.sz,d.sz*2.5,0,0,Math.PI*2);dr.fill();
    }
  }
  dr.shadowBlur=0;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
