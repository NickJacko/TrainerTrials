<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Fairy — Pilzwald</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0e0015;}
canvas{position:absolute;inset:0;width:1080px;height:1920px;display:block;}
.bg{position:absolute;inset:0;background:
  radial-gradient(ellipse 80% 50% at 50% 45%, #3a0055 0%, #1a0025 45%, transparent 75%),
  linear-gradient(180deg, #0e0015 0%, #160020 40%, #1a0030 70%, #0e0015 100%);}
/* Mushroom silhouettes */
.mush{position:absolute;pointer-events:none;}
.cap{position:absolute;border-radius:50% 50% 40% 40% / 80% 80% 20% 20%;box-shadow:0 0 40px rgba(255,105,180,0.5),0 0 80px rgba(218,112,214,0.3);}
.stem{position:absolute;background:linear-gradient(180deg,#3a1050,#200020);border-radius:30% 30% 10% 10%;}
.m1{bottom:220px;left:3%;}.m1 .cap{width:220px;height:130px;background:radial-gradient(ellipse at 50% 70%,#ff8cc8 0%,#d946a3 60%,#8a1a6a 100%);top:0;}.m1 .stem{width:70px;height:170px;top:110px;left:75px;}
.m2{bottom:180px;right:5%;}.m2 .cap{width:260px;height:150px;background:radial-gradient(ellipse at 50% 70%,#c080ff 0%,#9932cc 60%,#5a1080 100%);top:0;box-shadow:0 0 50px rgba(153,50,204,0.5);}.m2 .stem{width:80px;height:200px;top:130px;left:90px;}
.m3{bottom:320px;left:30%;}.m3 .cap{width:140px;height:85px;background:radial-gradient(ellipse at 50% 70%,#ff6bb8 0%,#c92080 60%,#6a0845 100%);top:0;}.m3 .stem{width:42px;height:120px;top:70px;left:49px;}
.m4{bottom:260px;left:60%;}.m4 .cap{width:180px;height:110px;background:radial-gradient(ellipse at 50% 70%,#d6a0ff 0%,#a050dc 60%,#501880 100%);top:0;}.m4 .stem{width:56px;height:160px;top:95px;left:62px;}
/* Spots on caps */
.spot{position:absolute;width:10px;height:10px;background:rgba(255,255,255,0.7);border-radius:50%;box-shadow:0 0 6px rgba(255,255,255,0.5);}

/* Canopy at top */
.canopy{position:absolute;top:0;left:0;right:0;height:260px;
  background:radial-gradient(ellipse 600px 180px at 20% 0%,#0a0015 0%,transparent 60%),
  radial-gradient(ellipse 700px 200px at 60% 0%,#0d0018 0%,transparent 60%),
  radial-gradient(ellipse 500px 160px at 90% 0%,#0a0015 0%,transparent 60%);filter:blur(2px);}

.zone-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(0,0,0,0.5) 0%,transparent 100%);z-index:40;}
.zone-bot{position:absolute;bottom:0;left:0;right:0;height:920px;background:linear-gradient(0deg,rgba(10,0,15,0.55) 0%,rgba(10,0,15,0.12) 40%,transparent 100%);z-index:40;}
.center-darken{position:absolute;top:300px;left:50%;transform:translateX(-50%);width:780px;height:540px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(10,0,20,0.3) 0%,transparent 70%);z-index:38;}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 40%,rgba(0,0,0,0.6) 100%);z-index:39;pointer-events:none;}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="stars"></canvas>
<div class="canopy"></div>
<canvas id="glow"></canvas>
<div class="mush m1"><div class="cap"><div class="spot" style="top:30%;left:20%"></div><div class="spot" style="top:50%;left:55%"></div><div class="spot" style="top:25%;left:75%"></div></div><div class="stem"></div></div>
<div class="mush m2"><div class="cap"><div class="spot" style="top:35%;left:25%"></div><div class="spot" style="top:45%;left:60%"></div><div class="spot" style="top:30%;left:80%"></div></div><div class="stem"></div></div>
<div class="mush m3"><div class="cap"><div class="spot" style="top:35%;left:30%"></div><div class="spot" style="top:50%;left:70%"></div></div><div class="stem"></div></div>
<div class="mush m4"><div class="cap"><div class="spot" style="top:30%;left:25%"></div><div class="spot" style="top:55%;left:60%"></div></div><div class="stem"></div></div>
<canvas id="fairies"></canvas>
<canvas id="flowers"></canvas>
<div class="center-darken"></div>
<div class="vignette"></div>
<div class="zone-top"></div>
<div class="zone-bot"></div>
<script>
const W=1080,H=1920;
function setup(id){const c=document.getElementById(id);c.width=W;c.height=H;return c.getContext('2d');}

const st=setup('stars');
const stars=[];
for(let i=0;i<100;i++)stars.push({x:Math.random()*W,y:Math.random()*400,r:Math.random()*1.2+0.2,tw:Math.random()*Math.PI*2,hue:Math.random()<0.3?320:0});

const gl=setup('glow');
const glows=[];
for(let i=0;i<25;i++)glows.push({x:Math.random()*W,y:300+Math.random()*1400,r:80+Math.random()*140,hue:280+Math.random()*60,a:0.1+Math.random()*0.15,ph:Math.random()*Math.PI*2});

const fr=setup('fairies');
const fairies=[];
for(let i=0;i<25;i++)fairies.push({x:Math.random()*W,y:300+Math.random()*1200,
  vx:(Math.random()-0.5)*1.5,vy:(Math.random()-0.5)*1.2,ph:Math.random()*Math.PI*2,
  sz:1.5+Math.random()*2,hue:[300,320,280,340][Math.floor(Math.random()*4)],trail:[]});

const fl=setup('flowers');
const flowers=[];
for(let i=0;i<20;i++)flowers.push({x:Math.random()*W,y:1500+Math.random()*350,r:3+Math.random()*5,hue:300+Math.random()*50,ph:Math.random()*Math.PI*2});

let t=0;
function loop(){
  t+=0.016;
  st.clearRect(0,0,W,H);
  for(const s of stars){s.tw+=0.03;const a=0.4+Math.sin(s.tw)*0.5;
    st.fillStyle=s.hue?`hsla(320,100%,75%,${a})`:`rgba(255,240,255,${a})`;
    st.beginPath();st.arc(s.x,s.y,s.r,0,Math.PI*2);st.fill();}

  gl.clearRect(0,0,W,H);gl.globalCompositeOperation='screen';
  for(const g of glows){g.ph+=0.015;const a=g.a*(0.7+Math.sin(g.ph)*0.3);
    const rg=gl.createRadialGradient(g.x,g.y,0,g.x,g.y,g.r);
    rg.addColorStop(0,`hsla(${g.hue},100%,60%,${a})`);rg.addColorStop(1,`hsla(${g.hue},100%,50%,0)`);
    gl.fillStyle=rg;gl.beginPath();gl.arc(g.x,g.y,g.r,0,Math.PI*2);gl.fill();}
  gl.globalCompositeOperation='source-over';

  fr.clearRect(0,0,W,H);
  for(const f of fairies){f.ph+=0.05;
    f.vx+=(Math.random()-0.5)*0.1;f.vy+=(Math.random()-0.5)*0.1;
    f.vx*=0.96;f.vy*=0.96;
    f.x+=f.vx;f.y+=f.vy;
    if(f.x<50||f.x>W-50)f.vx*=-1;if(f.y<300||f.y>1600)f.vy*=-1;
    f.trail.unshift({x:f.x,y:f.y});if(f.trail.length>8)f.trail.pop();
    for(let i=0;i<f.trail.length;i++){
      const p=f.trail[i],a=(1-i/f.trail.length)*0.6;
      fr.fillStyle=`hsla(${f.hue},100%,80%,${a})`;fr.shadowBlur=10;fr.shadowColor=`hsl(${f.hue},100%,70%)`;
      fr.beginPath();fr.arc(p.x,p.y,f.sz*(1-i/f.trail.length*0.5),0,Math.PI*2);fr.fill();
    }
  }
  fr.shadowBlur=0;

  fl.clearRect(0,0,W,H);
  for(const f of flowers){f.ph+=0.03;const a=0.5+Math.sin(f.ph)*0.4;
    fl.fillStyle=`hsla(${f.hue},100%,70%,${a})`;fl.shadowBlur=12;fl.shadowColor=`hsl(${f.hue},100%,60%)`;
    fl.beginPath();fl.arc(f.x,f.y,f.r,0,Math.PI*2);fl.fill();}
  fl.shadowBlur=0;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
