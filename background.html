<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stream Background</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#000;
  position:relative;
}

/* ── BASE GRADIENT — morpht per JS ─────────────────────────────────────────── */
#bgGrad{
  position:fixed;inset:0;
  transition:background 4s cubic-bezier(0.4,0,0.2,1);
  z-index:0;
}

/* ── ATMOSPHERE OVERLAY — typ-spezifischer Ambient ──────────────────────────── */
#atmoLayer{
  position:fixed;inset:0;
  transition:opacity 3s ease, background 4s ease;
  z-index:1;
  pointer-events:none;
  opacity:0;
}

/* ── VIGNETTE — immer oben, gibt Tiefe ────────────────────────────────────────*/
#vignette{
  position:fixed;inset:0;
  background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,0.65) 100%);
  z-index:8;pointer-events:none;
}

/* ── STAR LAYER ── */
#starLayer{position:fixed;inset:0;z-index:2;pointer-events:none;}
.star{
  position:absolute;border-radius:50%;background:white;
  box-shadow:0 0 4px rgba(255,255,255,0.8);
  animation:twinkle ease-in-out infinite;
}
@keyframes twinkle{0%,100%{opacity:0.2;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}

/* ── PARTICLE LAYER ── */
#particleLayer{position:fixed;inset:0;z-index:3;pointer-events:none;}
.p{
  position:absolute;border-radius:50%;
  animation:floatUp linear infinite;
  pointer-events:none;
}
@keyframes floatUp{
  0%  {transform:translateY(100vh) translateX(var(--dx,0px)) scale(0.4) rotate(0deg);opacity:0;}
  8%  {opacity:1;}
  92% {opacity:1;}
  100%{transform:translateY(-120px) translateX(calc(var(--dx,0px) * -1)) scale(1.1) rotate(360deg);opacity:0;}
}

/* ── TYPE EFFECT LAYERS ─────────────────────────────────────────────────────── */

/* Fire: ember streaks */
#fireLayer{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity 3s;}
.ember{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle,#fff 0%,#FF4500 40%,transparent 100%);
  animation:emberRise linear infinite;
}
@keyframes emberRise{
  0%  {transform:translateY(100vh) translateX(0) scale(0.3);opacity:0;}
  5%  {opacity:0.9;}
  80% {opacity:0.7;}
  100%{transform:translateY(-50px) translateX(var(--ex,20px)) scale(0.1);opacity:0;}
}

/* Electric: lightning bolts */
#electricLayer{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity 3s;}

/* Water: bubbles */
#waterLayer{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity 3s;}
.bubble{
  position:absolute;border-radius:50%;
  border:1px solid rgba(100,200,255,0.5);
  background:radial-gradient(circle at 30% 30%,rgba(200,240,255,0.3),transparent 60%);
  animation:bubbleRise linear infinite;
}
@keyframes bubbleRise{
  0%  {transform:translateY(100vh) translateX(0) scale(0.5);opacity:0;}
  5%  {opacity:0.8;}
  90% {opacity:0.5;}
  100%{transform:translateY(-50px) translateX(var(--bx,10px)) scale(1.2);opacity:0;}
}

/* Grass: leaves */
#grassLayer{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity 3s;}
.leaf{
  position:absolute;
  width:12px;height:8px;
  background:var(--lc,#4CAF50);
  border-radius:50% 0 50% 0;
  animation:leafFall linear infinite;
  opacity:0;
}
@keyframes leafFall{
  0%  {transform:translateY(-20px) translateX(0) rotate(0deg);opacity:0;}
  5%  {opacity:0.8;}
  90% {opacity:0.6;}
  100%{transform:translateY(110vh) translateX(var(--lx,40px)) rotate(720deg);opacity:0;}
}

/* Ice: snowflakes / crystals */
#iceLayer{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity 3s;}
.snow{
  position:absolute;background:white;border-radius:50%;
  box-shadow:0 0 6px rgba(150,220,255,0.8);
  animation:snowFall linear infinite;
}
@keyframes snowFall{
  0%  {transform:translateY(-20px) translateX(0) scale(0.5);opacity:0;}
  5%  {opacity:0.9;}
  95% {opacity:0.7;}
  100%{transform:translateY(110vh) translateX(var(--sx,30px)) scale(0.8);opacity:0;}
}

/* Psychic: rotating orbs */
#psychicLayer{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity 3s;}
.orb{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,0.8) 0%,var(--oc,rgba(180,0,255,0.6)) 50%,transparent 100%);
  box-shadow:0 0 20px var(--oc,rgba(180,0,255,0.5));
  animation:orbDrift ease-in-out infinite;
}
@keyframes orbDrift{
  0%  {transform:translate(0,0) scale(0.5);opacity:0;}
  10% {opacity:0.8;}
  50% {transform:translate(var(--ox,60px),var(--oy,-80px)) scale(1.2);}
  90% {opacity:0.8;}
  100%{transform:translate(var(--ox2,120px),var(--oy2,40px)) scale(0.3);opacity:0;}
}

/* Dark: shadow wisps */
#darkLayer{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity 3s;}
.wisp{
  position:absolute;border-radius:40% 60% 70% 30%;
  background:radial-gradient(ellipse,rgba(60,0,80,0.6) 0%,transparent 70%);
  filter:blur(8px);
  animation:wispDrift ease-in-out infinite;
}
@keyframes wispDrift{
  0%  {transform:translate(0,0) scale(0.8);opacity:0;}
  15% {opacity:0.6;}
  50% {transform:translate(var(--wx,80px),var(--wy,-60px)) scale(1.3);}
  85% {opacity:0.5;}
  100%{transform:translate(var(--wx2,-40px),var(--wy2,80px)) scale(0.5);opacity:0;}
}

/* Dragon: golden scales / embers */
#dragonLayer{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity 3s;}
.scale{
  position:absolute;
  background:linear-gradient(135deg,#FFD700,#FF6600,#FF0000);
  clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
  animation:scaleDrift linear infinite;
  opacity:0;
}
@keyframes scaleDrift{
  0%  {transform:translateY(110vh) rotate(0deg) scale(0.5);opacity:0;}
  5%  {opacity:0.7;}
  90% {opacity:0.4;}
  100%{transform:translateY(-50px) rotate(360deg) scale(1);opacity:0;}
}

/* Cosmic: star streaks + nebula */
#cosmicLayer{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity 3s;}
.streak{
  position:absolute;height:2px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.8),transparent);
  animation:streakMove linear infinite;
  opacity:0;
}
@keyframes streakMove{
  0%  {transform:translateX(-100%) rotate(var(--sa,-15deg));opacity:0;}
  5%  {opacity:0.8;}
  80% {opacity:0.6;}
  100%{transform:translateX(200vw) rotate(var(--sa,-15deg));opacity:0;}
}

/* Ghost: fading spirits */
#ghostLayer{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity 3s;}
.spirit{
  position:absolute;border-radius:50% 50% 30% 30%;
  background:radial-gradient(ellipse,rgba(200,255,220,0.4) 0%,transparent 70%);
  filter:blur(6px);
  animation:spiritFloat ease-in-out infinite;
}
@keyframes spiritFloat{
  0%  {transform:translate(0,0) scale(0.6);opacity:0;}
  20% {opacity:0.6;}
  50% {transform:translate(var(--gx,50px),var(--gy,-100px)) scale(1.1);}
  80% {opacity:0.4;}
  100%{transform:translate(var(--gx2,-30px),var(--gy2,-200px)) scale(0.3);opacity:0;}
}

/* Earth/Rock: dust particles */
#earthLayer{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity 3s;}

/* ── AMBIENT GLOW SPOTS ─────────────────────────────────────────────────────── */
#ambientLayer{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  transition:opacity 4s ease;
}
.gspot{
  position:absolute;border-radius:50%;filter:blur(80px);
  transition:background 4s ease,opacity 4s ease;
  pointer-events:none;
}

/* ── CANVAS for lightning ────────────────────────────────────────────────────── */
#ltCanvas{position:fixed;inset:0;z-index:5;pointer-events:none;}

/* ── FLOATING CATCHMON ────────────────────────────────────────────────────────── */
#catchmonLayer{position:fixed;inset:0;z-index:3;pointer-events:none;}
.fc{
  position:absolute;opacity:0;
  animation:fcFloat linear infinite;
  filter:brightness(1.1);
}
.fc img{width:70px;height:70px;object-fit:contain;}
@keyframes fcFloat{
  0%  {transform:translateY(105vh) translateX(var(--fdx,0px)) scale(0.4) rotate(0deg);opacity:0;}
  8%  {opacity:0.35;}
  92% {opacity:0.25;}
  100%{transform:translateY(-80px) translateX(var(--fdx2,30px)) scale(0.8) rotate(var(--frot,180deg));opacity:0;}
}

/* ── CONTENT ── */
.content-area{position:relative;z-index:10;width:100%;height:100%;pointer-events:none;}
.ui-safe-zone{position:absolute;top:10%;left:10%;right:10%;bottom:10%;pointer-events:auto;}
</style>
</head>

// ── STARS ──────────────────────────────────────────────────────────────────────
function initStars(){
  const c=document.getElementById('starLayer');c.innerHTML='';
  for(let i=0;i<60;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()*2+1;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*5}s;`;
    c.appendChild(s);
  }
}
initStars();

// ── LAYER POPULATION ──────────────────────────────────────────────────────────
function populate(layerId,tag,count,cssBuilder){
  const c=document.getElementById(layerId);
  if(!c)return;
  c.innerHTML='';
  for(let i=0;i<count;i++){
    const el=document.createElement('div');
    el.className=tag;
    const css=cssBuilder(i);
    el.style.cssText=css;
    c.appendChild(el);
  }
}

function buildFire(){
  populate('fireLayer','ember',18,i=>{
    const sz=3+Math.random()*6,dur=4+Math.random()*8;
    return `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;bottom:0;animation-duration:${dur}s;animation-delay:${Math.random()*dur}s;--ex:${(Math.random()-0.5)*80}px;`;
  });
}
function buildWater(){
  populate('waterLayer','bubble',14,i=>{
    const sz=8+Math.random()*20,dur=6+Math.random()*10;
    return `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;bottom:0;animation-duration:${dur}s;animation-delay:${Math.random()*dur}s;--bx:${(Math.random()-0.5)*60}px;`;
  });
}
function buildGrass(){
  populate('grassLayer','leaf',20,i=>{
    const colors=['#2e7d32','#388e3c','#43a047','#66bb6a','#1b5e20'];
    const dur=6+Math.random()*10;
    return `left:${Math.random()*100}%;top:-20px;animation-duration:${dur}s;animation-delay:${Math.random()*dur}s;--lx:${(Math.random()-0.5)*100}px;--lc:${colors[Math.floor(Math.random()*colors.length)]};transform:rotate(${Math.random()*360}deg);`;
  });
}
function buildIce(){
  populate('iceLayer','snow',20,i=>{
    const sz=2+Math.random()*5,dur=8+Math.random()*12;
    return `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:-10px;animation-duration:${dur}s;animation-delay:${Math.random()*dur}s;--sx:${(Math.random()-0.5)*80}px;border-radius:50%;`;
  });
}
function buildPsychic(){
  populate('psychicLayer','orb',10,i=>{
    const sz=15+Math.random()*30,dur=8+Math.random()*12;
    const cols=['rgba(180,0,255,0.5)','rgba(255,0,200,0.4)','rgba(200,100,255,0.45)','rgba(255,150,255,0.3)'];
    const c=cols[Math.floor(Math.random()*cols.length)];
    return `width:${sz}px;height:${sz}px;left:${20+Math.random()*60}%;top:${20+Math.random()*60}%;animation-duration:${dur}s;animation-delay:${Math.random()*dur}s;--oc:${c};--ox:${(Math.random()-0.5)*200}px;--oy:${(Math.random()-0.5)*200}px;--ox2:${(Math.random()-0.5)*300}px;--oy2:${(Math.random()-0.5)*300}px;filter:blur(2px);`;
  });
}
function buildDark(){
  populate('darkLayer','wisp',8,i=>{
    const w=80+Math.random()*120,h=60+Math.random()*80,dur=10+Math.random()*15;
    return `width:${w}px;height:${h}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${dur}s;animation-delay:${Math.random()*dur}s;--wx:${(Math.random()-0.5)*200}px;--wy:${(Math.random()-0.5)*150}px;--wx2:${(Math.random()-0.5)*150}px;--wy2:${(Math.random()-0.5)*200}px;`;
  });
}
function buildDragon(){
  populate('dragonLayer','scale',14,i=>{
    const sz=8+Math.random()*14,dur=5+Math.random()*8;
    return `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;bottom:0;animation-duration:${dur}s;animation-delay:${Math.random()*dur}s;`;
  });
}
function buildCosmic(){
  populate('cosmicLayer','streak',12,i=>{
    const w=60+Math.random()*200,dur=3+Math.random()*5;
    return `width:${w}px;top:${Math.random()*100}%;left:0;animation-duration:${dur}s;animation-delay:${Math.random()*dur}s;--sa:${(Math.random()-0.5)*30}deg;`;
  });
}
function buildGhost(){
  populate('ghostLayer','spirit',10,i=>{
    const w=60+Math.random()*100,h=40+Math.random()*80,dur=8+Math.random()*12;
    return `width:${w}px;height:${h}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${dur}s;animation-delay:${Math.random()*dur}s;--gx:${(Math.random()-0.5)*150}px;--gy:${-50-Math.random()*150}px;--gx2:${(Math.random()-0.5)*100}px;--gy2:${-100-Math.random()*200}px;`;
  });
}

const BUILDERS = {
  Fire:buildFire, Water:buildWater, Grass:buildGrass, Ice:buildIce,
  Psychic:buildPsychic, Dark:buildDark, Dragon:buildDragon,
  Cosmic:buildCosmic, Ghost:buildGhost, Fairy:buildPsychic,
  Poison:buildDark, Light:buildCosmic,
};

// ── AMBIENT GLOW SPOTS ────────────────────────────────────────────────────────
function setAmbient(colors){
  const ids=['gs1','gs2','gs3'];
  ids.forEach((id,i)=>{
    const el=document.getElementById(id);
    if(el && colors[i]) el.style.background=colors[i];
  });
}

// ── LIGHTNING CANVAS (Electric) ───────────────────────────────────────────────
const ltCv=document.getElementById('ltCanvas');
const ltCx=ltCv.getContext('2d');
ltCv.width=window.innerWidth; ltCv.height=window.innerHeight;
window.addEventListener('resize',()=>{ltCv.width=innerWidth;ltCv.height=innerHeight;});
let ltActive=false;
function drawBolt(x1,y1,x2,y2,branches=3){
  ltCx.beginPath();ltCx.strokeStyle=`rgba(220,255,100,${0.5+Math.random()*0.4})`;
  ltCx.lineWidth=1+Math.random();ltCx.shadowBlur=15;ltCx.shadowColor='rgba(200,255,0,0.8)';
  const pts=[[x1,y1]];
  const seg=8;
  for(let i=1;i<seg;i++){
    const t=i/seg;
    pts.push([x1+(x2-x1)*t+(Math.random()-0.5)*60, y1+(y2-y1)*t+(Math.random()-0.5)*40]);
  }
  pts.push([x2,y2]);
  ltCx.moveTo(pts[0][0],pts[0][1]);
  pts.slice(1).forEach(p=>ltCx.lineTo(p[0],p[1]));
  ltCx.stroke();
  if(branches>0){
    const mid=pts[Math.floor(pts.length/2)];
    drawBolt(mid[0],mid[1],mid[0]+(Math.random()-0.5)*150,mid[1]+50+Math.random()*100,branches-1);
  }
}
function flashLightning(){
  if(!ltActive)return;
  ltCx.clearRect(0,0,ltCv.width,ltCv.height);
  if(Math.random()<0.12){
    const x=Math.random()*innerWidth;
    drawBolt(x,-10,x+(Math.random()-0.5)*100,innerHeight*0.6);
  }
  setTimeout(()=>ltCx.clearRect(0,0,ltCv.width,ltCv.height),80);
  setTimeout(flashLightning,800+Math.random()*2000);
}

// ── FLOATING CATCHMON ────────────────────────────────────────────────────────
const ALL_SPRITES=[
  'catchmon/Common/Zapkit.png','catchmon/Common/Flurrie.png','catchmon/Common/Shadopup.png',
  'catchmon/Common/Flambini.png','catchmon/Common/Glissalune.png','catchmon/Common/Wyrmling.png',
  'catchmon/Rare/Mindferno.png','catchmon/Starter/Flaumi.png','catchmon/Starter/Plipsy.png',
  'catchmon/Legendary/Chronavelle.png','catchmon/Mythical/Myrelith.png',
];
function spawnCatchmon(){
  const c=document.getElementById('catchmonLayer');
  const fc=document.createElement('div');fc.className='fc';
  const dur=15+Math.random()*20;
  const dx=(Math.random()-0.5)*80, dx2=(Math.random()-0.5)*60;
  const rot=Math.floor(Math.random()*360);
  fc.style.cssText=`left:${Math.random()*100}%;bottom:0;animation-duration:${dur}s;animation-delay:${Math.random()*10}s;--fdx:${dx}px;--fdx2:${dx2}px;--frot:${rot}deg;filter:drop-shadow(0 0 12px var(--fc-glow,rgba(255,255,255,0.2)));`;
  const img=document.createElement('img');
  img.src=ALL_SPRITES[Math.floor(Math.random()*ALL_SPRITES.length)];
  img.alt='';img.onerror=()=>fc.remove();
  fc.appendChild(img);
  c.appendChild(fc);
  setTimeout(()=>fc.remove(),(dur+10)*1000);
}

// ── TRANSITION ────────────────────────────────────────────────────────────────
const ALL_LAYERS=['fireLayer','waterLayer','grassLayer','iceLayer','psychicLayer',
                  'darkLayer','dragonLayer','cosmicLayer','ghostLayer','earthLayer','electricLayer'];
let currentType='Normal';

function transitionTo(type){
  if(type===currentType)return;
  currentType=type;
  const a=ATMO[type]||ATMO.Normal;

  // 1. Fade out all type layers
  ALL_LAYERS.forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.style.opacity='0';
  });
  ltActive=false;
  ltCx.clearRect(0,0,ltCv.width,ltCv.height);

  // 2. Transition background gradient
  document.getElementById('bgGrad').style.background=a.bg;

  // 3. Atmosphere overlay
  const atmoEl=document.getElementById('atmoLayer');
  atmoEl.style.background=a.atmo;
  atmoEl.style.opacity='1';

  // 4. Ambient glow spots
  setAmbient(a.ambient);

  // 5. Stars visibility
  document.getElementById('starLayer').style.opacity=a.stars?'1':'0.3';

  // 6. Fade in type layer after short delay
  setTimeout(()=>{
    if(a.layer){
      const BUILDER=BUILDERS[type]||BUILDERS[ATMO[type]?.layer?.replace('Layer','')];
      if(BUILDER) BUILDER();
      const el=document.getElementById(a.layer);
      if(el) el.style.opacity='1';
    }
    if(type==='Electric'){ ltActive=true; flashLightning(); }
  }, 500);

  console.log(`🌍 Atmosphere → ${type}`);
}

// ── BASE PARTICLES (always running) ──────────────────────────────────────────
function spawnBaseParticle(){
  const c=document.getElementById('particleLayer');
  const el=document.createElement('div');el.className='p';
  const sz=4+Math.random()*8;
  const colors=['linear-gradient(45deg,#667eea,#764ba2)','linear-gradient(45deg,#4ecdc4,#44a08d)',
                 'linear-gradient(45deg,#ffd700,#ffa500)','linear-gradient(45deg,#9c27b0,#673ab7)'];
  const dur=12+Math.random()*15;
  el.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;bottom:0;background:${colors[Math.floor(Math.random()*colors.length)]};box-shadow:0 0 14px currentColor;animation-duration:${dur}s;animation-delay:${Math.random()*5}s;--dx:${(Math.random()-0.5)*60}px;`;
  c.appendChild(el);
  setTimeout(()=>el.remove(),(dur+6)*1000);
}

// ── FIREBASE LISTENER ─────────────────────────────────────────────────────────
let lastTs=0;
onValue(ref(db,'spawn/current'),snap=>{
  const d=snap.val();
  if(!d||!d.timestamp||d.timestamp===lastTs)return;
  lastTs=d.timestamp;
  const types=d.type||['Normal'];
  const primary=types[0]||'Normal';
  transitionTo(primary);
});

// ── INIT ──────────────────────────────────────────────────────────────────────
// Default atmosphere on load
document.getElementById('bgGrad').style.background=ATMO.Normal.bg;
document.getElementById('atmoLayer').style.background=ATMO.Normal.atmo;
document.getElementById('atmoLayer').style.opacity='1';
setAmbient(ATMO.Normal.ambient);

// Start base systems
setInterval(spawnBaseParticle, 900);
setInterval(spawnCatchmon, 7000);
for(let i=0;i<8;i++) setTimeout(spawnBaseParticle,i*400);
for(let i=0;i<3;i++) setTimeout(spawnCatchmon,i*4000);
</script>
