<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stream Background</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;}

#iframeA,#iframeB{
  position:fixed;inset:0;width:100%;height:100%;
  border:none;background:transparent;
  transition:opacity 3.5s cubic-bezier(0.4,0,0.2,1);
}
#iframeA{z-index:1;opacity:1;}
#iframeB{z-index:2;opacity:0;}
</style>
</head>
<body>
<iframe id="iframeA" src="backgrounds/normal.html"></iframe>
<iframe id="iframeB" src=""></iframe>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import{getDatabase,ref,onValue}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

const db=getDatabase(initializeApp({
  apiKey:"AIzaSyDdStpC5rVtgaZ4XvtKLwQttnyIDXL2z7Q",
  authDomain:"trainertrials.firebaseapp.com",
  databaseURL:"https://trainertrials-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"trainertrials",storageBucket:"trainertrials.firebasestorage.app",
  messagingSenderId:"22071275267",appId:"1:22071275267:web:92e82d6bfaee169aff8336"
}));

// Typ → Dateiname in backgrounds/
// Exakt abgestimmt auf CATCHMON_TYPES Primärtypen aus catcher.py
const TYPE_FILES = {
  // Direkte Mappings — Datei existiert
  Fire:    'fire',
  Water:   'water',
  Electric:'electric',
  Grass:   'grass',
  Ice:     'ice',
  Psychic: 'psychic',
  Dark:    'dark',
  Ghost:   'ghost',
  Dragon:  'dragon',
  Cosmic:  'cosmic',
  Earth:   'earth',
  Steel:   'steel',
  Wind:    'wind',
  Fairy:   'fairy',
  Poison:  'poison',
  Light:   'light',
  Normal:  'normal',
  Rock:    'earth',
  Bug:     'grass',
  Legendary:'legendary',
  Mythical: 'mythical',
  God:      'god',
};

const A = document.getElementById('iframeA');
const B = document.getElementById('iframeB');
let active = 'A';         // welches iframe gerade vorne sichtbar ist
let currentFile = 'normal';
let transitioning = false;
let lastTs = 0;

function transitionTo(file) {
  // Datei existiert noch nicht → fallback auf normal
  const knownFiles = Object.values(TYPE_FILES);
  const target = knownFiles.includes(file) ? file : 'normal';

  if (target === currentFile || transitioning) return;
  transitioning = true;
  currentFile = target;

  const front = active === 'A' ? A : B;
  const back  = active === 'A' ? B : A;

  // Neues File in den hinteren iframe laden
  back.src = `backgrounds/${target}.html`;

  back.onload = () => {
    // Hinterer iframe nach vorne faden
    back.style.zIndex  = '2';
    back.style.opacity = '1';
    front.style.zIndex  = '1';
    front.style.opacity = '0';

    // Nach Fade: alten iframe aufräumen, State switchen
    setTimeout(() => {
      front.src = 'about:blank';
      active = active === 'A' ? 'B' : 'A';
      transitioning = false;
    }, 4000); // warten bis CSS transition (3.5s) durch ist
  };

  // Fallback falls onload nicht feuert (z.B. leere src)
  back.onerror = () => {
    console.warn(`backgrounds/${target}.html nicht gefunden, bleibe bei normal`);
    back.src = 'backgrounds/normal.html';
    transitioning = false;
  };

  console.log(`🌍 Background → ${target}`);
}

// Firebase: hört auf neuen Spawn → Typ lesen → Transition starten
let lastFile = 'normal';
onValue(ref(db, 'spawn/current'), snap => {
  const d = snap.val();
  if (!d || !d.timestamp || d.timestamp === lastTs) return;
  lastTs = d.timestamp;

  const types  = Array.isArray(d.type) ? d.type : ['Normal'];
  const primary = types[0] || 'Normal';
  const file   = TYPE_FILES[primary] || 'normal';

  if (file !== lastFile) {
    lastFile = file;
    transitionTo(file);
  }
});
</script>
</body>
</html>
