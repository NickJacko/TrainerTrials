<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Epic Stream Background</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at center, #1a1a2e 0%, #16213e 30%, #0f0f23 70%, #000000 100%);
      position: relative;
    }

    /* Advanced Animated Background Particles */
    .bg-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      opacity: 0.6;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      animation: floatParticle linear infinite;
      background: linear-gradient(45deg, #667eea, #764ba2);
      box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
    }

    @keyframes floatParticle {
      0% {
        transform: translateY(100vh) rotate(0deg) scale(0.5);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100px) rotate(360deg) scale(1.2);
        opacity: 0;
      }
    }

    /* Enhanced Cloud System */
    .cloud-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 100px;
      opacity: 0.6;
      animation: cloudFloat linear infinite;
      backdrop-filter: blur(2px);
      box-shadow: inset 0 0 50px rgba(255, 255, 255, 0.1);
    }

    .cloud:before {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 100px;
      backdrop-filter: blur(1px);
    }

    .cloud:after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 100px;
    }

    @keyframes cloudFloat {
      0% {
        transform: translateX(-200px) translateY(0);
      }
      100% {
        transform: translateX(calc(100vw + 200px)) translateY(-20px);
      }
    }

    /* Floating Catchmon Sprites */
    .floating-catchmon {
      position: absolute;
      opacity: 0.3;
      animation: floatCatchmon linear infinite;
      pointer-events: none;
      z-index: 4;
      filter: brightness(1.2) drop-shadow(0 0 15px rgba(255,255,255,0.3));
    }

    .floating-catchmon img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      border-radius: 10px;
    }

    @keyframes floatCatchmon {
      0% {
        transform: translateY(100vh) translateX(-50px) rotate(0deg) scale(0.5);
        opacity: 0;
      }
      10% {
        opacity: 0.4;
      }
      50% {
        opacity: 0.8;
        transform: translateY(50vh) translateX(30px) rotate(180deg) scale(1);
      }
      90% {
        opacity: 0.4;
      }
      100% {
        transform: translateY(-100px) translateX(50px) rotate(360deg) scale(0.3);
        opacity: 0;
      }
    }

    /* Advanced Energy Orbs */
    .energy-orb {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, #FFD700 0%, #FFA500 50%, transparent 100%);
      animation: orbFloat linear infinite;
      box-shadow: 
        0 0 30px rgba(255, 215, 0, 0.8),
        0 0 60px rgba(255, 215, 0, 0.4),
        inset 0 0 20px rgba(255, 255, 255, 0.3);
      z-index: 3;
      pointer-events: none;
    }

    @keyframes orbFloat {
      0% {
        transform: translateY(100vh) translateX(0) scale(0.3);
        opacity: 0;
      }
      20% {
        opacity: 0.9;
      }
      80% {
        opacity: 0.9;
      }
      100% {
        transform: translateY(-100px) translateX(100px) scale(1.2);
        opacity: 0;
      }
    }

    /* Mystical Lightning Effects */
    .lightning-streak {
      position: absolute;
      width: 3px;
      background: linear-gradient(0deg, 
        transparent 0%, 
        rgba(255, 255, 255, 0.9) 20%, 
        rgba(135, 206, 250, 0.8) 50%, 
        rgba(255, 255, 255, 0.9) 80%, 
        transparent 100%);
      animation: lightningStrike linear infinite;
      box-shadow: 0 0 20px rgba(135, 206, 250, 0.8);
      z-index: 5;
      pointer-events: none;
      opacity: 0;
    }

    @keyframes lightningStrike {
      0% {
        opacity: 0;
        height: 0;
        top: 50%;
      }
      10% {
        opacity: 1;
        height: 200px;
        top: 0;
      }
      20% {
        opacity: 0.8;
        height: 400px;
      }
      30% {
        opacity: 0;
        height: 500px;
      }
      100% {
        opacity: 0;
        height: 500px;
      }
    }

    /* Atmospheric Glow Effects */
    .atmosphere-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(ellipse at 20% 30%, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(118, 75, 162, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 40% 90%, rgba(76, 175, 80, 0.08) 0%, transparent 40%);
      z-index: 6;
      pointer-events: none;
      animation: atmosphereShift 15s ease-in-out infinite;
    }

    @keyframes atmosphereShift {
      0%, 100% {
        opacity: 0.6;
        filter: brightness(1);
      }
      33% {
        opacity: 0.8;
        filter: brightness(1.2);
      }
      66% {
        opacity: 0.7;
        filter: brightness(0.9);
      }
    }

    /* Twinkling Stars */
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      animation: twinkle ease-in-out infinite;
      z-index: 7;
      pointer-events: none;
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.3;
        transform: scale(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.5);
      }
    }

    /* Floating UI Elements Space */
    .content-area {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .ui-safe-zone {
      position: absolute;
      top: 10%;
      left: 10%;
      right: 10%;
      bottom: 10%;
      pointer-events: auto;
    }

    /* Performance Optimization */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Mobile Optimizations */
    @media (max-width: 768px) {
      .particle, .energy-orb {
        animation-duration: 12s !important;
      }
      
      .cloud {
        animation-duration: 25s !important;
      }
      
      .floating-catchmon {
        animation-duration: 15s !important;
      }
    }
  </style>
</head>
<body>
  <!-- Enhanced Particle System -->
  <div class="bg-particles" id="bgParticles"></div>

  <!-- Advanced Cloud Layer -->
  <div class="cloud-layer" id="cloudLayer"></div>

  <!-- Atmospheric Effects -->
  <div class="atmosphere-glow"></div>

  <!-- Lightning Effects Container -->
  <div id="lightningContainer"></div>

  <!-- Stars Container -->
  <div id="starsContainer"></div>

  <!-- Content Area for Stream Overlays -->
  <div class="content-area">
    <div class="ui-safe-zone">
      <!-- Your stream overlays go here -->
    </div>
  </div>

  <script>
    // Enhanced Particle System
    function createParticle() {
      const particle = document.createElement('div');
      particle.className = 'particle';
      
      const size = Math.random() * 8 + 4;
      particle.style.width = size + 'px';
      particle.style.height = size + 'px';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDuration = (Math.random() * 15 + 10) + 's';
      particle.style.animationDelay = Math.random() * 5 + 's';
      
      // Random colors for variety
      const colors = [
        'linear-gradient(45deg, #667eea, #764ba2)',
        'linear-gradient(45deg, #4ecdc4, #44a08d)',
        'linear-gradient(45deg, #ff6b6b, #ee5a24)',
        'linear-gradient(45deg, #ffd700, #ffa500)',
        'linear-gradient(45deg, #9c27b0, #673ab7)'
      ];
      particle.style.background = colors[Math.floor(Math.random() * colors.length)];
      
      document.getElementById('bgParticles').appendChild(particle);
      
      setTimeout(() => {
        if (particle.parentNode) {
          particle.parentNode.removeChild(particle);
        }
      }, 25000);
    }

    // Enhanced Cloud System
    function createCloud() {
      const cloud = document.createElement('div');
      cloud.className = 'cloud';
      
      const width = Math.random() * 200 + 100;
      const height = Math.random() * 80 + 40;
      const top = Math.random() * 60 + '%';
      
      cloud.style.width = width + 'px';
      cloud.style.height = height + 'px';
      cloud.style.top = top;
      cloud.style.left = '-200px';
      cloud.style.animationDuration = (Math.random() * 40 + 30) + 's';
      cloud.style.animationDelay = Math.random() * 10 + 's';
      
      // Add cloud details
      const detail1 = document.createElement('div');
      detail1.style.cssText = `
        position: absolute;
        width: ${width * 0.6}px;
        height: ${height * 0.8}px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 50px;
        top: -${height * 0.3}px;
        left: ${width * 0.2}px;
      `;
      
      const detail2 = document.createElement('div');
      detail2.style.cssText = `
        position: absolute;
        width: ${width * 0.4}px;
        height: ${height * 0.6}px;
        background: rgba(255, 255, 255, 0.04);
        border-radius: 50px;
        top: -${height * 0.2}px;
        right: ${width * 0.1}px;
      `;
      
      cloud.appendChild(detail1);
      cloud.appendChild(detail2);
      
      document.getElementById('cloudLayer').appendChild(cloud);
      
      setTimeout(() => {
        if (cloud.parentNode) {
          cloud.parentNode.removeChild(cloud);
        }
      }, 50000);
    }

    // Floating Catchmon System
    function createFloatingCatchmon() {
      const catchmonSprites = [
        'catchmon/Common/Zapkit.png',
        'catchmon/Common/Flurrie.png',
        'catchmon/Rare/Mindferno.png',
        'catchmon/Starter/Flaumi.png',
        'catchmon/Common/Glissalune.png',
        'catchmon/Legendary/Chronavelle.png',
        'catchmon/Mythical/Myrelith.png'
      ];

      const catchmon = document.createElement('div');
      catchmon.className = 'floating-catchmon';
      catchmon.style.left = Math.random() * 100 + '%';
      catchmon.style.animationDuration = (Math.random() * 20 + 15) + 's';
      catchmon.style.animationDelay = Math.random() * 5 + 's';
      
      const img = document.createElement('img');
      img.src = catchmonSprites[Math.floor(Math.random() * catchmonSprites.length)];
      img.alt = 'Floating Catchmon';
      catchmon.appendChild(img);
      
      document.getElementById('bgParticles').appendChild(catchmon);
      
      setTimeout(() => {
        if (catchmon.parentNode) {
          catchmon.parentNode.removeChild(catchmon);
        }
      }, 35000);
    }

    // Energy Orbs
    function createEnergyOrb() {
      const orb = document.createElement('div');
      orb.className = 'energy-orb';
      
      const size = Math.random() * 15 + 10;
      orb.style.width = size + 'px';
      orb.style.height = size + 'px';
      orb.style.left = Math.random() * 100 + '%';
      orb.style.animationDuration = (Math.random() * 12 + 8) + 's';
      orb.style.animationDelay = Math.random() * 3 + 's';
      
      document.getElementById('bgParticles').appendChild(orb);
      
      setTimeout(() => {
        if (orb.parentNode) {
          orb.parentNode.removeChild(orb);
        }
      }, 20000);
    }

    // Lightning Effects
    function createLightning() {
      if (Math.random() < 0.02) { // 2% chance every interval
        const lightning = document.createElement('div');
        lightning.className = 'lightning-streak';
        lightning.style.left = Math.random() * 100 + '%';
        lightning.style.animationDuration = (Math.random() * 2 + 1) + 's';
        
        const container = document.getElementById('lightningContainer');
        if (!container) return;
        
        container.appendChild(lightning);
        
        setTimeout(() => {
          if (lightning.parentNode) {
            lightning.parentNode.removeChild(lightning);
          }
        }, 3000);
      }
    }

    // Twinkling Stars
    function createStars() {
      const starsContainer = document.getElementById('starsContainer');
      if (!starsContainer) return;
      
      for (let i = 0; i < 50; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDuration = (Math.random() * 4 + 2) + 's';
        star.style.animationDelay = Math.random() * 5 + 's';
        
        starsContainer.appendChild(star);
      }
    }

    // Performance Management
    let particleCount = 0;
    const maxParticles = 20;

    function managePerformance() {
      const allParticles = document.querySelectorAll('.particle, .energy-orb, .floating-catchmon');
      particleCount = allParticles.length;
      
      if (particleCount > maxParticles) {
        // Remove oldest particles
        for (let i = 0; i < particleCount - maxParticles; i++) {
          if (allParticles[i] && allParticles[i].parentNode) {
            allParticles[i].parentNode.removeChild(allParticles[i]);
          }
        }
      }
    }

    // Tab Visibility Optimization
    document.addEventListener('visibilitychange', () => {
      const elements = document.querySelectorAll('*');
      if (document.hidden) {
        elements.forEach(el => {
          if (el.style) el.style.animationPlayState = 'paused';
        });
      } else {
        elements.forEach(el => {
          if (el.style) el.style.animationPlayState = 'running';
        });
      }
    });

    // Initialize Effects
    createStars();

    // Particle Creation Intervals
    setInterval(createParticle, 800);
    setInterval(createCloud, 3000);
    setInterval(createFloatingCatchmon, 6000);
    setInterval(createEnergyOrb, 1500);
    setInterval(createLightning, 500);
    setInterval(managePerformance, 5000);

    // Initial burst of effects
    for (let i = 0; i < 8; i++) {
      setTimeout(createParticle, i * 300);
    }
    
    for (let i = 0; i < 3; i++) {
      setTimeout(createCloud, i * 2000);
      setTimeout(createFloatingCatchmon, i * 4000);
    }
    
    for (let i = 0; i < 6; i++) {
      setTimeout(createEnergyOrb, i * 800);
    }

    console.log('🎬 Epic Stream Background loaded successfully!');
  </script>
</body>
</html>
