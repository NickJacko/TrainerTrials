<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>TikTok Spiele-Rätsel Background</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: radial-gradient(ellipse at center, #1a1a2e 0%, #16213e 30%, #0f0f23 70%, #000000 100%);
      position: relative;
      font-family: 'Arial Black', Arial, sans-serif;
    }

    /* Enhanced Animated Background Particles */
    .bg-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      opacity: 0.6;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      animation: floatParticle linear infinite;
      background: linear-gradient(45deg, #667eea, #764ba2);
      box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
    }

    @keyframes floatParticle {
      0% {
        transform: translateY(100vh) rotate(0deg) scale(0.5);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100px) rotate(360deg) scale(1.2);
        opacity: 0;
      }
    }

    /* Enhanced Cloud System */
    .cloud-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 100px;
      opacity: 0.6;
      animation: cloudFloat linear infinite;
      backdrop-filter: blur(2px);
      box-shadow: inset 0 0 50px rgba(255, 255, 255, 0.1);
    }

    @keyframes cloudFloat {
      0% {
        transform: translateX(-200px) translateY(0);
      }
      100% {
        transform: translateX(calc(100vw + 200px)) translateY(-20px);
      }
    }

    /* Gaming Particles */
    .game-icon {
      position: absolute;
      font-size: 40px;
      opacity: 0.15;
      animation: floatGameIcon linear infinite;
      user-select: none;
      z-index: 3;
    }

    @keyframes floatGameIcon {
      0% {
        transform: translateY(100vh) rotate(0deg) scale(0.5);
        opacity: 0;
      }
      10% {
        opacity: 0.3;
      }
      50% {
        opacity: 0.15;
      }
      90% {
        opacity: 0.1;
      }
      100% {
        transform: translateY(-100px) rotate(360deg) scale(1.2);
        opacity: 0;
      }
    }

    /* Energy Orbs */
    .energy-orb {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, #FFD700 0%, #FFA500 50%, transparent 100%);
      animation: orbFloat linear infinite;
      box-shadow: 
        0 0 30px rgba(255, 215, 0, 0.8),
        0 0 60px rgba(255, 215, 0, 0.4),
        inset 0 0 20px rgba(255, 255, 255, 0.3);
      z-index: 3;
      pointer-events: none;
    }

    @keyframes orbFloat {
      0% {
        transform: translateY(100vh) translateX(0) scale(0.3);
        opacity: 0;
      }
      20% {
        opacity: 0.9;
      }
      80% {
        opacity: 0.9;
      }
      100% {
        transform: translateY(-100px) translateX(100px) scale(1.2);
        opacity: 0;
      }
    }

    /* Atmospheric Glow Effects */
    .atmosphere-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(ellipse at 20% 30%, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(118, 75, 162, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 40% 90%, rgba(76, 175, 80, 0.08) 0%, transparent 40%);
      z-index: 4;
      pointer-events: none;
      animation: atmosphereShift 15s ease-in-out infinite;
    }

    @keyframes atmosphereShift {
      0%, 100% {
        opacity: 0.6;
        filter: brightness(1);
      }
      33% {
        opacity: 0.8;
        filter: brightness(1.2);
      }
      66% {
        opacity: 0.7;
        filter: brightness(0.9);
      }
    }

    /* Content Container for TikTok Format - mittig zentriert */
    .content-container {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 60px;
      transition: opacity 1s ease, transform 1s ease;
    }

    /* Main Title - mittig */
    .main-title {
      font-size: 88px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 
        0 0 30px rgba(255,255,255,0.9),
        4px 4px 0px #333,
        -2px -2px 0px #333,
        2px -2px 0px #333,
        -2px 2px 0px #333;
      margin-bottom: 40px;
      animation: titlePulse 2s ease-in-out infinite;
      letter-spacing: 3px;
      line-height: 1.1;
      margin-top: 0px;
      transition: opacity 1s ease, transform 1s ease;
    }

    @keyframes titlePulse {
      0%, 100% {
        transform: scale(1);
        text-shadow: 
          0 0 30px rgba(255,255,255,0.9),
          4px 4px 0px #333,
          -2px -2px 0px #333,
          2px -2px 0px #333,
          -2px 2px 0px #333;
      }
      50% {
        transform: scale(1.05);
        text-shadow: 
          0 0 50px rgba(255,255,255,1),
          4px 4px 0px #333,
          -2px -2px 0px #333,
          2px -2px 0px #333,
          -2px 2px 0px #333;
      }
    }

    /* Subtitle - Level Display - mittig */
    .subtitle {
      font-size: 36px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
      margin-bottom: 30px;
      opacity: 0.95;
      padding: 15px 40px;
      border: 3px solid #FFD700;
      border-radius: 25px;
      background: rgba(255, 215, 0, 0.1);
      box-shadow: 
        0 0 30px rgba(255, 215, 0, 0.5),
        inset 0 0 20px rgba(255, 215, 0, 0.1);
      text-transform: uppercase;
      letter-spacing: 3px;
      animation: levelGlow 2s ease-in-out infinite;
      transition: opacity 1s ease, transform 1s ease;
    }

    @keyframes levelGlow {
      0%, 100% {
        box-shadow: 
          0 0 30px rgba(255, 215, 0, 0.5),
          inset 0 0 20px rgba(255, 215, 0, 0.1);
      }
      50% {
        box-shadow: 
          0 0 50px rgba(255, 215, 0, 0.8),
          inset 0 0 30px rgba(255, 215, 0, 0.2);
      }
    }

    /* Timer Display - weiter unten */
    .timer-container {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 1200px;
      opacity: 0;
      z-index: 15;
      transition: opacity 1s ease, transform 1s ease;
    }

    .timer-container.show {
      opacity: 1;
    }

    .timer-display {
      font-size: 200px;
      font-weight: 900;
      color: #FFD700;
      text-shadow: 
        0 0 40px rgba(255, 215, 0, 1),
        0 0 80px rgba(255, 215, 0, 0.8),
        0 0 120px rgba(255, 215, 0, 0.6);
      text-align: center;
      animation: timerFlash 1s ease-in-out;
    }

    @keyframes timerFlash {
      0% {
        transform: scale(0.5);
        opacity: 0;
        text-shadow: 
          0 0 20px rgba(255, 215, 0, 1),
          0 0 40px rgba(255, 215, 0, 0.8);
      }
      50% {
        transform: scale(1.2);
        opacity: 1;
        text-shadow: 
          0 0 60px rgba(255, 215, 0, 1),
          0 0 120px rgba(255, 215, 0, 0.9),
          0 0 180px rgba(255, 215, 0, 0.7);
      }
      100% {
        transform: scale(1);
        opacity: 1;
        text-shadow: 
          0 0 40px rgba(255, 215, 0, 1),
          0 0 80px rgba(255, 215, 0, 0.8),
          0 0 120px rgba(255, 215, 0, 0.6);
      }
    }

    /* Auflösung unter Timer */
    .solution-text {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 1280px;
      font-size: 72px;
      font-weight: 900;
      color: #4CAF50;
      text-shadow: 
        0 0 30px rgba(76, 175, 80, 0.9),
        3px 3px 0px #333,
        -2px -2px 0px #333,
        2px -2px 0px #333,
        -2px 2px 0px #333;
      text-align: center;
      opacity: 0;
      z-index: 16;
      animation: solutionSlideUp 0.8s ease-out both;
    }

    .solution-text.show {
      opacity: 1;
    }

    /* Game Image - erscheint mit der Auflösung */
    .game-image {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 700px;
      width: 600px;
      height: 500px;
      border-radius: 20px;
      border: 5px solid #4CAF50;
      box-shadow: 
        0 0 40px rgba(76, 175, 80, 0.8),
        0 0 80px rgba(76, 175, 80, 0.4);
      opacity: 0;
      z-index: 16;
      transition: opacity 0.8s ease-out, transform 0.8s ease-out;
      object-fit: contain;
    }

    .game-image.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    @keyframes solutionSlideUp {
      0% {
        transform: translateX(-50%) translateY(50px);
        opacity: 0;
      }
      100% {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
    }

    /* Emoji Container - feste Plätze nebeneinander */
    .emoji-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 80px;
      margin: 60px 0;
      width: 100%;
      min-height: 150px;
      transition: opacity 1s ease, transform 1s ease;
    }

    .emoji {
      font-size: 120px;
      filter: drop-shadow(0 0 25px rgba(255,255,255,0.6));
      opacity: 0;
      transform: scale(0);
      text-shadow: 0 0 30px rgba(255,255,255,0.5);
      transition: opacity 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55), 
                  transform 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      width: 140px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .emoji.show {
      opacity: 1;
      transform: scale(1);
    }

    .emoji:hover {
      transform: scale(1.1);
      filter: drop-shadow(0 0 35px rgba(255,255,255,0.9));
    }



    /* Final CTA - erscheint nach Timer */
    .final-cta {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 50px;
      font-size: 44px;
      font-weight: 800;
      color: #ffff00;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
      text-align: center;
      opacity: 0;
      visibility: hidden;
      z-index: 17;
      transition: opacity 1s ease, transform 1s ease, visibility 1s ease;
    }

    .final-cta.show {
      opacity: 1;
      visibility: visible;
      animation: finalCtaBlink 1.5s ease-in-out infinite;
    }

    @keyframes finalCtaBlink {
      0%, 100% {
        opacity: 1;
        transform: translateX(-50%) scale(1);
      }
      50% {
        opacity: 0.7;
        transform: translateX(-50%) scale(1.05);
      }
    }

    /* Elements fade out animation - verbesserte mittige Animation */
    .fade-out {
      opacity: 0 !important;
      transform: scale(0.5) translateY(0) !important;
      filter: blur(10px) !important;
      transition: all 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) !important;
    }

    /* Control Panel - Hidden for video */
    .control-panel {
      display: none;
    }

  </style>
</head>
<body>
  <!-- Original Background Effects -->
  <div class="bg-particles" id="bgParticles"></div>
  <div class="cloud-layer" id="cloudLayer"></div>
  <div class="atmosphere-glow"></div>

  <!-- Timer Display -->
  <div class="timer-container" id="timerContainer">
    <div class="timer-display" id="timerDisplay">5</div>
  </div>

  <!-- Solution Text unter Timer -->
  <div class="solution-text" id="solutionText"></div>

  <!-- Game Image - erscheint mit der Auflösung -->
  <img class="game-image" id="gameImage" src="resolve.png" alt="Game Image" />

  <!-- Final CTA - erscheint erst nach Timer -->
  <div class="final-cta" id="finalCta">Did you know it?<br>Write your answer in the comments!</div>

  <!-- Main Content - feste Positionen -->
  <div class="content-container" id="contentContainer">
    <p class="subtitle" id="subtitle">🟢 EASY 🟢</p>
    <h1 class="main-title" id="mainTitle">WHICH GAME IS THIS?</h1>
    <div class="emoji-container" id="emojiContainer">
      <!-- Emojis werden hier dynamisch hinzugefügt -->
    </div>
  </div>

  <script>
    // === KONFIGURATION (Hier anpassen für verschiedene Videos) ===
    const CONFIG = {
      mainTitle: "WHICH GAME IS THIS?",
      currentGameIndex: 0, // Welches Spiel soll verwendet werden (0-7)
      autoShowEmojis: true, // Emojis automatisch einblenden
      emojiInterval: 2000, // Alle 2 Sekunden ein neues Emoji
      showTimerAfter: 10000, // Timer nach 10 Sekunden zeigen
      countdownFrom: 5 // Von 5 runterzählen
    };

    // Level-Farben und Styles
    const levelStyles = {
      'EASY': {
        color: '#4CAF50',      // Grün
        glow: '76, 175, 80',   // RGB für Glow-Effekte
        icon: '🟢',
        animation: 'smooth'
      },
      'MEDIUM': {
        color: '#FF9800',      // Orange
        glow: '255, 152, 0',
        icon: '🟡', 
        animation: 'pulse'
      },
      'HARD': {
        color: '#F44336',      // Rot
        glow: '244, 67, 54',
        icon: '🔴',
        animation: 'intense'
      },
      'EXPERT': {
        color: '#9C27B0',      // Lila
        glow: '156, 39, 176',
        icon: '🟣',
        animation: 'glow'
      },
      'LEGENDARY': {
        color: '#FFD700',      // Gold
        glow: '255, 215, 0',
        icon: '👑',
        animation: 'royal'
      }
    };

    // Gaming Icons für Original-Partikel-Effekt
    const gameIcons = ['🎮', '🕹️', '👾', '🎯', '🏆', '⚡', '💎', '🚀', '🔥', '⭐', '🎲', '🎪'];
    
    // Spiele-Datenbank mit Difficulty
    const gameRiddles = [
      {
        title: 'Super Mario 64',
        emojis: ['🐢', '💣', '🪜'],
        difficulty: 'EASY'
      },
      {
        title: 'The Legend of Zelda',
        emojis: ['🗡️', '🛡️', '👑'],
        difficulty: 'MEDIUM'
      },
      {
        title: 'Minecraft',
        emojis: ['🧱', '⛏️', '🐷'],
        difficulty: 'EASY'
      },
      {
        title: 'Pac-Man',
        emojis: ['👻', '🟡', '🍒'],
        difficulty: 'EASY'
      },
      {
        title: 'Pokémon',
        emojis: ['⚡', '🔥', '💧'],
        difficulty: 'MEDIUM'
      },
      {
        title: 'Tetris',
        emojis: ['🧩', '📦', '🔽'],
        difficulty: 'EASY'
      },
      {
        title: 'Among Us',
        emojis: ['👥', '🔪', '🚀'],
        difficulty: 'MEDIUM'
      },
      {
        title: 'Fortnite',
        emojis: ['🏗️', '🔫', '🌪️'],
        difficulty: 'HARD'
      }
    ];

    let emojiIndex = 0;
    let timerInterval = null;
    let emojiInterval = null;

    // Original Partikel-System
    function createParticle() {
      const particle = document.createElement('div');
      particle.className = 'particle';
      
      const size = Math.random() * 8 + 4;
      particle.style.width = size + 'px';
      particle.style.height = size + 'px';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDuration = (Math.random() * 15 + 10) + 's';
      particle.style.animationDelay = Math.random() * 5 + 's';
      
      const colors = [
        'linear-gradient(45deg, #667eea, #764ba2)',
        'linear-gradient(45deg, #4ecdc4, #44a08d)',
        'linear-gradient(45deg, #ff6b6b, #ee5a24)',
        'linear-gradient(45deg, #ffd700, #ffa500)',
        'linear-gradient(45deg, #9c27b0, #673ab7)'
      ];
      particle.style.background = colors[Math.floor(Math.random() * colors.length)];
      
      document.getElementById('bgParticles').appendChild(particle);
      
      setTimeout(() => {
        if (particle.parentNode) {
          particle.parentNode.removeChild(particle);
        }
      }, 25000);
    }

    function createCloud() {
      const cloud = document.createElement('div');
      cloud.className = 'cloud';
      
      const width = Math.random() * 200 + 100;
      const height = Math.random() * 80 + 40;
      const top = Math.random() * 60 + '%';
      
      cloud.style.width = width + 'px';
      cloud.style.height = height + 'px';
      cloud.style.top = top;
      cloud.style.left = '-200px';
      cloud.style.animationDuration = (Math.random() * 40 + 30) + 's';
      cloud.style.animationDelay = Math.random() * 10 + 's';
      
      document.getElementById('cloudLayer').appendChild(cloud);
      
      setTimeout(() => {
        if (cloud.parentNode) {
          cloud.parentNode.removeChild(cloud);
        }
      }, 50000);
    }

    function createGameParticle() {
      const particle = document.createElement('div');
      particle.className = 'game-icon';
      particle.textContent = gameIcons[Math.floor(Math.random() * gameIcons.length)];
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDuration = (Math.random() * 12 + 8) + 's';
      particle.style.animationDelay = Math.random() * 2 + 's';
      
      document.getElementById('bgParticles').appendChild(particle);
      
      setTimeout(() => {
        if (particle.parentNode) {
          particle.parentNode.removeChild(particle);
        }
      }, 20000);
    }

    function createEnergyOrb() {
      const orb = document.createElement('div');
      orb.className = 'energy-orb';
      
      const size = Math.random() * 15 + 10;
      orb.style.width = size + 'px';
      orb.style.height = size + 'px';
      orb.style.left = Math.random() * 100 + '%';
      orb.style.animationDuration = (Math.random() * 12 + 8) + 's';
      orb.style.animationDelay = Math.random() * 3 + 's';
      
      document.getElementById('bgParticles').appendChild(orb);
      
      setTimeout(() => {
        if (orb.parentNode) {
          orb.parentNode.removeChild(orb);
        }
      }, 20000);
    }

    // Automatischer 5-Sekunden Countdown mit Fade-Out Logik
    function startCountdown() {
      const timerContainer = document.getElementById('timerContainer');
      const timerDisplay = document.getElementById('timerDisplay');
      
      // Timer einblenden
      timerContainer.classList.add('show');
      
      let timeLeft = CONFIG.countdownFrom;
      timerDisplay.textContent = timeLeft;
      
      timerInterval = setInterval(() => {
        timeLeft--;
        timerDisplay.textContent = timeLeft;
        
        // Flash-Animation für jede Zahl
        timerDisplay.style.animation = 'none';
        setTimeout(() => {
          timerDisplay.style.animation = 'timerFlash 1s ease-in-out';
        }, 10);
        
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          // Timer auf 0 setzen und dann showAnswer aufrufen
          timerDisplay.textContent = '0';
          
          // Kurze Verzögerung für den finalen Timer-Flash
          setTimeout(() => {
            showAnswer();
          }, 500);
        }
      }, 1000);
    }

    function showAnswer() {
      const currentGame = gameRiddles[CONFIG.currentGameIndex];
      const solutionText = document.getElementById('solutionText');
      const gameImage = document.getElementById('gameImage');
      const finalCta = document.getElementById('finalCta');
      
      // Alle Content-Elemente ausblenden
      const contentContainer = document.getElementById('contentContainer');
      const timerContainer = document.getElementById('timerContainer');
      
      console.log('🎯 Antwort wird gezeigt:', currentGame.title);
      
      // Alle Inhalte außer Hintergrund ausblenden
      contentContainer.classList.add('fade-out');
      timerContainer.classList.add('fade-out');
      
      // Auflösung und Bild anzeigen (nach Fade-Out)
      setTimeout(() => {
        solutionText.textContent = currentGame.title;
        solutionText.classList.add('show');
        
        // Bild gleichzeitig mit Text anzeigen
        gameImage.classList.add('show');
        
        // Final CTA anzeigen (2 Sekunden nach Auflösung)
        setTimeout(() => {
          finalCta.classList.add('show');
        }, 2000);
      }, 1000);
    }

    // Level-System mit coolen Animationen
    function setLevelDisplay() {
      const currentGame = gameRiddles[CONFIG.currentGameIndex];
      const level = currentGame.difficulty;
      const subtitle = document.getElementById('subtitle');
      const style = levelStyles[level];
      
      if (style) {
        subtitle.textContent = `${style.icon} ${level} ${style.icon}`;
        subtitle.style.color = style.color;
        
        // Level-spezifische Animationen
        switch(level) {
          case 'EASY':
            subtitle.style.animation = 'easyFloat 3s ease-in-out infinite';
            break;
          case 'MEDIUM':
            subtitle.style.animation = 'mediumPulse 2s ease-in-out infinite';
            break;
          case 'HARD':
            subtitle.style.animation = 'hardShake 1.5s ease-in-out infinite';
            break;
          case 'EXPERT':
            subtitle.style.animation = 'expertGlow 2s ease-in-out infinite';
            break;
          case 'LEGENDARY':
            subtitle.style.animation = 'legendaryRoyal 2.5s ease-in-out infinite';
            subtitle.style.fontSize = '44px';
            break;
        }
        
        console.log(`🎯 Level gesetzt: ${level} mit ${style.animation} Animation`);
      }
    }

    // Hex zu RGB konvertieren
    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? 
        `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : 
        '255, 215, 0';
    }

    // Emoji Animation System - feste Plätze
    function showNextEmoji() {
      const container = document.getElementById('emojiContainer');
      const currentGame = gameRiddles[CONFIG.currentGameIndex];
      
      if (emojiIndex < currentGame.emojis.length) {
        // Prüfen ob bereits Emoji-Plätze existieren, sonst erstellen
        if (container.children.length === 0) {
          // Alle 3 Emoji-Plätze erstellen
          for (let i = 0; i < currentGame.emojis.length; i++) {
            const emojiDiv = document.createElement('div');
            emojiDiv.className = 'emoji';
            emojiDiv.textContent = currentGame.emojis[i];
            emojiDiv.id = `emoji-${i}`;
            container.appendChild(emojiDiv);
          }
        }
        
        // Aktuelles Emoji einblenden
        const currentEmoji = document.getElementById(`emoji-${emojiIndex}`);
        if (currentEmoji) {
          setTimeout(() => {
            currentEmoji.classList.add('show');
          }, 100);
        }
        
        emojiIndex++;
      }
    }

    // Automatische Video-Sequenz
    function startVideoSequence() {
      // Texte setzen
      document.getElementById('mainTitle').textContent = CONFIG.mainTitle;
      
      // Level-Display setzen
      setLevelDisplay();
      
      const currentGame = gameRiddles[CONFIG.currentGameIndex];
      console.log('🎬 Video-Sequenz gestartet für:', currentGame.title);
      console.log('🎯 Level:', currentGame.difficulty);
      
      // Emojis automatisch einblenden
      if (CONFIG.autoShowEmojis) {
        emojiInterval = setInterval(() => {
          showNextEmoji();
        }, CONFIG.emojiInterval);
      }
      
      // Timer nach 10 Sekunden zeigen
      setTimeout(() => {
        startCountdown();
        // Emoji-Intervall stoppen wenn Timer startet
        if (emojiInterval) {
          clearInterval(emojiInterval);
        }
      }, CONFIG.showTimerAfter);
    }

    // Keyboard Controls (optional für Entwicklung)
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        showNextEmoji();
      } else if (e.code === 'KeyT') {
        e.preventDefault();
        startCountdown();
      } else if (e.code === 'KeyR') {
        e.preventDefault();
        location.reload(); // Reset für neues Video
      }
    });

    // Initialize effects
    setInterval(createParticle, 800);
    setInterval(createCloud, 3000);
    setInterval(createGameParticle, 1200);
    setInterval(createEnergyOrb, 1500);

    // Initial effects
    for (let i = 0; i < 8; i++) {
      setTimeout(createParticle, i * 300);
      setTimeout(createGameParticle, i * 400);
    }
    
    for (let i = 0; i < 3; i++) {
      setTimeout(createCloud, i * 2000);
      setTimeout(createEnergyOrb, i * 800);
    }

    // Video-Sequenz automatisch starten
    setTimeout(startVideoSequence, 1000);

    console.log('🎮 TikTok Video Background geladen!');
    console.log('Spiel:', gameRiddles[CONFIG.currentGameIndex].title);
  </script>
</body>
</html>
