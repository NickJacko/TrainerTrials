<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Electric — Gewitter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#050a00;}
canvas{position:absolute;inset:0;width:1080px;height:1920px;display:block;}
.bg{position:absolute;inset:0;background:
  radial-gradient(ellipse 80% 50% at 50% 30%, #1a2400 0%, #0a1400 50%, transparent 80%),
  linear-gradient(180deg, #050a00 0%, #0a1400 40%, #05080a 75%, #02050a 100%);}
/* City skyline at bottom */
.city{position:absolute;bottom:0;left:0;right:0;height:340px;background:#000205;
  clip-path:polygon(
    0 100%, 0 60%, 4% 60%, 4% 45%, 8% 45%, 8% 50%, 12% 50%, 12% 30%, 16% 30%, 16% 55%,
    22% 55%, 22% 38%, 26% 38%, 26% 48%, 30% 48%, 30% 25%, 34% 25%, 34% 42%, 40% 42%,
    40% 55%, 44% 55%, 44% 20%, 48% 20%, 48% 40%, 52% 40%, 52% 35%, 56% 35%, 56% 50%,
    60% 50%, 60% 28%, 64% 28%, 64% 45%, 68% 45%, 68% 55%, 72% 55%, 72% 35%, 76% 35%,
    76% 22%, 80% 22%, 80% 45%, 84% 45%, 84% 50%, 88% 50%, 88% 38%, 92% 38%, 92% 55%,
    96% 55%, 96% 48%, 100% 48%, 100% 100%
  );}
/* Windows on city */
.windows{position:absolute;bottom:0;left:0;right:0;height:340px;pointer-events:none;
  background-image:
    radial-gradient(circle 2px at 5% 75%, rgba(255,220,100,0.7), transparent),
    radial-gradient(circle 2px at 15% 82%, rgba(255,220,100,0.5), transparent),
    radial-gradient(circle 2px at 25% 68%, rgba(255,220,100,0.6), transparent),
    radial-gradient(circle 2px at 35% 78%, rgba(255,220,100,0.5), transparent),
    radial-gradient(circle 2px at 45% 70%, rgba(255,220,100,0.7), transparent),
    radial-gradient(circle 2px at 55% 85%, rgba(200,180,255,0.5), transparent),
    radial-gradient(circle 2px at 65% 75%, rgba(255,220,100,0.6), transparent),
    radial-gradient(circle 2px at 75% 80%, rgba(200,180,255,0.4), transparent),
    radial-gradient(circle 2px at 85% 72%, rgba(255,220,100,0.6), transparent),
    radial-gradient(circle 2px at 95% 78%, rgba(255,220,100,0.5), transparent);}

/* Street wet reflection */
.reflect{position:absolute;bottom:0;left:0;right:0;height:80px;
  background:linear-gradient(0deg, rgba(204,255,0,0.08) 0%, transparent 100%);mix-blend-mode:screen;animation:refPulse 3s ease-in-out infinite;}
@keyframes refPulse{0%,100%{opacity:0.5}50%{opacity:1}}

.flash{position:absolute;inset:0;background:#ccff00;opacity:0;mix-blend-mode:screen;z-index:35;pointer-events:none;}

.zone-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(0,0,0,0.55) 0%,transparent 100%);z-index:40;}
.zone-bot{position:absolute;bottom:0;left:0;right:0;height:920px;background:linear-gradient(0deg,rgba(0,0,0,0.5) 0%,rgba(0,0,0,0.1) 40%,transparent 100%);z-index:40;}
.center-darken{position:absolute;top:300px;left:50%;transform:translateX(-50%);width:780px;height:540px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(0,0,5,0.32) 0%,transparent 70%);z-index:38;}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 40%,rgba(0,0,0,0.6) 100%);z-index:39;pointer-events:none;}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="clouds"></canvas>
<canvas id="bolt"></canvas>
<canvas id="arc"></canvas>
<div class="city"></div>
<div class="windows"></div>
<div class="reflect"></div>
<canvas id="rain"></canvas>
<div class="flash" id="flash"></div>
<div class="center-darken"></div>
<div class="vignette"></div>
<div class="zone-top"></div>
<div class="zone-bot"></div>
<script>
const W=1080,H=1920;
function setup(id){const c=document.getElementById(id);c.width=W;c.height=H;return c.getContext('2d');}

// Storm clouds
const cl=setup('clouds');
const clouds=[];
for(let i=0;i<30;i++){
  clouds.push({x:Math.random()*W,y:Math.random()*700,
    r:80+Math.random()*150,vx:0.15+Math.random()*0.25,
    a:0.3+Math.random()*0.3,hue:200+Math.random()*40});
}

// Lightning
const bl=setup('bolt');
let boltUntil=0;let boltPts=[];
function genBolt(){
  boltPts=[];
  const startX=200+Math.random()*680;
  let x=startX,y=0;
  while(y<1600){
    const nx=x+(Math.random()-0.5)*60;
    const ny=y+40+Math.random()*60;
    boltPts.push([x,y,nx,ny]);
    // Branch
    if(Math.random()<0.25&&y<1200){
      let bx=nx,by=ny;
      for(let i=0;i<4;i++){
        const b2x=bx+(Math.random()-0.5)*80;
        const b2y=by+30+Math.random()*50;
        boltPts.push([bx,by,b2x,b2y,true]);
        bx=b2x;by=b2y;
      }
    }
    x=nx;y=ny;
  }
}

// Arcs near center
const ar=setup('arc');
function drawArcs(t){
  ar.clearRect(0,0,W,H);
  for(let i=0;i<3;i++){
    if(Math.random()<0.1){
      const x1=300+Math.random()*480,y1=500+Math.random()*800;
      const x2=x1+(Math.random()-0.5)*200,y2=y1+(Math.random()-0.5)*200;
      ar.strokeStyle='rgba(204,255,0,0.7)';ar.lineWidth=1.5;
      ar.shadowBlur=15;ar.shadowColor='#ccff00';
      ar.beginPath();ar.moveTo(x1,y1);
      let cx=x1,cy=y1;
      while(Math.hypot(x2-cx,y2-cy)>10){
        cx+=(x2-cx)*0.25+(Math.random()-0.5)*20;
        cy+=(y2-cy)*0.25+(Math.random()-0.5)*20;
        ar.lineTo(cx,cy);
      }
      ar.stroke();ar.shadowBlur=0;
    }
  }
}

// Rain
const rn=setup('rain');
const drops=[];
for(let i=0;i<220;i++){
  drops.push({x:Math.random()*(W+400)-200,y:Math.random()*H,len:18+Math.random()*22,vy:14+Math.random()*8,vx:-4});
}

const flash=document.getElementById('flash');
let lastStrike=0;
let t=0,frame=0;
function loop(){
  t+=0.016;frame++;

  cl.clearRect(0,0,W,H);
  for(const c of clouds){
    c.x+=c.vx;
    if(c.x>W+200)c.x=-200;
    const g=cl.createRadialGradient(c.x,c.y,0,c.x,c.y,c.r);
    g.addColorStop(0,`hsla(${c.hue},20%,15%,${c.a})`);
    g.addColorStop(1,`hsla(${c.hue},20%,8%,0)`);
    cl.fillStyle=g;cl.beginPath();cl.arc(c.x,c.y,c.r,0,Math.PI*2);cl.fill();
  }

  // Trigger lightning periodically
  if(performance.now()-lastStrike>1800+Math.random()*2200){
    lastStrike=performance.now();
    genBolt();boltUntil=performance.now()+220;
    flash.animate([{opacity:0},{opacity:0.5},{opacity:0}],{duration:400});
  }

  bl.clearRect(0,0,W,H);
  if(performance.now()<boltUntil){
    const life=(boltUntil-performance.now())/220;
    bl.strokeStyle=`rgba(255,255,255,${life})`;
    bl.lineWidth=4;bl.shadowBlur=25;bl.shadowColor='#ccff00';
    for(const p of boltPts){
      bl.lineWidth=p[4]?2:4;
      bl.beginPath();bl.moveTo(p[0],p[1]);bl.lineTo(p[2],p[3]);bl.stroke();
    }
    // Brighter core
    bl.strokeStyle=`rgba(204,255,0,${life})`;bl.lineWidth=1.5;bl.shadowBlur=0;
    for(const p of boltPts){bl.beginPath();bl.moveTo(p[0],p[1]);bl.lineTo(p[2],p[3]);bl.stroke();}
  }

  drawArcs(t);

  // Rain
  rn.clearRect(0,0,W,H);
  rn.strokeStyle='rgba(180,220,255,0.35)';rn.lineWidth=1.2;
  for(const d of drops){
    d.x+=d.vx;d.y+=d.vy;
    if(d.y>H){d.y=-20;d.x=Math.random()*(W+400)-200;}
    rn.beginPath();rn.moveTo(d.x,d.y);rn.lineTo(d.x+d.vx*1.5,d.y+d.len);rn.stroke();
  }

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
