<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Grass — Lichtungswald</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#08220a;}
canvas{position:absolute;inset:0;width:1080px;height:1920px;display:block;}

/* Deep forest background — looking through the woods into a clearing */
.bg{position:absolute;inset:0;background:
  radial-gradient(ellipse 45% 32% at 50% 42%, #9ed26a 0%, #5fa84a 20%, #2d6b1a 50%, transparent 75%),
  radial-gradient(ellipse 70% 50% at 50% 55%, #3a7a28 0%, #1e4a1a 55%, transparent 80%),
  linear-gradient(180deg, #0a2a0d 0%, #143d18 25%, #1a4a20 55%, #0d2a10 100%);}

/* Far trees in the clearing — small, misty */
.far-trees{position:absolute;top:620px;left:0;right:0;height:260px;opacity:0.6;background:#1a3a20;
  clip-path:polygon(0 100%, 0 75%, 3% 65%, 6% 72%, 10% 60%, 13% 68%, 17% 55%, 21% 68%, 25% 62%, 29% 70%, 33% 58%, 37% 65%, 42% 55%, 46% 68%, 50% 60%, 54% 70%, 58% 55%, 62% 68%, 66% 60%, 71% 72%, 75% 58%, 79% 68%, 83% 62%, 87% 55%, 91% 70%, 95% 62%, 100% 68%, 100% 100%);
  filter:blur(3px);}

/* Ground — undergrowth, darker near bottom */
.ground{position:absolute;bottom:0;left:0;right:0;height:520px;background:
  radial-gradient(ellipse 70% 60% at 50% 100%, #3a6a2a 0%, #1e4a1a 50%, #0a1e08 100%);}

/* BIG tree trunks on left and right — framing the view through the forest */
.trunk{position:absolute;top:-80px;bottom:-80px;}
.trunk svg{width:100%;height:100%;display:block;}
.trunk-l{left:-20px;width:300px;}
.trunk-r{right:-20px;width:320px;}
/* Mid-ground smaller trunks for depth */
.trunk-l2{left:40px;width:160px;top:200px;bottom:-80px;opacity:0.85;filter:blur(0.5px);}
.trunk-r2{right:60px;width:180px;top:180px;bottom:-80px;opacity:0.85;filter:blur(0.5px);}

/* Dense leafy bushes — left and right foreground */
.bush{position:absolute;bottom:-40px;filter:blur(1px);}
.bush-l{left:-40px;width:520px;height:720px;}
.bush-r{right:-40px;width:560px;height:780px;}
.bush svg{width:100%;height:100%;display:block;}

/* Canopy leaves hanging from top */
.canopy{position:absolute;top:-50px;left:-40px;right:-40px;height:420px;}
.canopy svg{width:100%;height:100%;display:block;}

/* Sun shaft from top-left through the clearing */
.shaft{position:absolute;top:-150px;left:-100px;width:900px;height:1800px;
  background:linear-gradient(160deg, rgba(255,240,150,0.35) 0%, rgba(255,235,130,0.15) 25%, transparent 50%);
  filter:blur(50px);mix-blend-mode:screen;animation:sh 9s ease-in-out infinite;}
.shaft2{position:absolute;top:-80px;left:120px;width:600px;height:1400px;
  background:linear-gradient(172deg, rgba(255,235,140,0.25) 0%, transparent 45%);
  filter:blur(35px);mix-blend-mode:screen;animation:sh 12s ease-in-out infinite reverse;}
@keyframes sh{0%,100%{opacity:0.75}50%{opacity:1}}

.zone-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(0,0,0,0.55) 0%,transparent 100%);z-index:40;}
.zone-bot{position:absolute;bottom:0;left:0;right:0;height:920px;background:linear-gradient(0deg,rgba(0,10,0,0.55) 0%,rgba(0,10,0,0.15) 40%,transparent 100%);z-index:40;}
.center-darken{position:absolute;top:300px;left:50%;transform:translateX(-50%);width:780px;height:540px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(0,10,0,0.3) 0%,transparent 70%);z-index:38;}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse 75% 65% at 50% 50%,transparent 35%,rgba(0,0,0,0.65) 100%);z-index:39;pointer-events:none;}
</style>
</head>
<body>
<div class="bg"></div>
<div class="far-trees"></div>
<div class="ground"></div>
<canvas id="bokeh"></canvas>
<div class="shaft"></div>
<div class="shaft2"></div>

<!-- Mid-ground trunks -->
<div class="trunk trunk-l2"><svg viewBox="0 0 160 1640" preserveAspectRatio="none"><path d="M65 0 Q70 400 55 800 Q45 1200 60 1640 L100 1640 Q85 1200 95 800 Q105 400 95 0 Z" fill="#1a2a10"/></svg></div>
<div class="trunk trunk-r2"><svg viewBox="0 0 180 1660" preserveAspectRatio="none"><path d="M85 0 Q95 400 70 800 Q60 1200 80 1660 L125 1660 Q110 1200 120 800 Q130 400 115 0 Z" fill="#1a2a10"/></svg></div>

<!-- Main framing trunks -->
<div class="trunk trunk-l"><svg viewBox="0 0 300 2080" preserveAspectRatio="none">
  <path d="M60 0 Q90 300 40 700 Q0 1100 50 1500 Q30 1800 80 2080 L200 2080 Q240 1800 210 1500 Q260 1100 220 700 Q270 300 240 0 Z" fill="#0a1a08"/>
  <!-- Bark texture -->
  <path d="M80 100 Q75 400 90 700 M140 200 Q135 500 150 900 M180 150 Q175 450 190 800 M100 800 Q95 1200 110 1600 M160 1000 Q155 1400 170 1900" stroke="#051008" stroke-width="3" fill="none" opacity="0.6"/>
</svg></div>
<div class="trunk trunk-r"><svg viewBox="0 0 320 2080" preserveAspectRatio="none">
  <path d="M80 0 Q50 300 110 700 Q160 1100 90 1500 Q120 1800 60 2080 L240 2080 Q200 1800 230 1500 Q280 1100 220 700 Q260 300 230 0 Z" fill="#0a1a08"/>
  <path d="M120 100 Q125 400 110 700 M180 250 Q185 600 170 1000 M220 180 Q225 500 210 900 M140 900 Q145 1300 130 1700 M200 1100 Q205 1500 190 1900" stroke="#051008" stroke-width="3" fill="none" opacity="0.6"/>
</svg></div>

<!-- Canopy overhead -->
<div class="canopy"><svg viewBox="0 0 1160 420" preserveAspectRatio="none">
  <g fill="#0a1e08">
    <ellipse cx="80" cy="40" rx="200" ry="140"/>
    <ellipse cx="260" cy="10" rx="220" ry="150"/>
    <ellipse cx="460" cy="30" rx="240" ry="160"/>
    <ellipse cx="680" cy="5" rx="230" ry="140"/>
    <ellipse cx="900" cy="25" rx="240" ry="155"/>
    <ellipse cx="1100" cy="40" rx="200" ry="140"/>
  </g>
  <g fill="#143018" opacity="0.8">
    <ellipse cx="160" cy="80" rx="120" ry="90"/>
    <ellipse cx="380" cy="70" rx="140" ry="100"/>
    <ellipse cx="580" cy="90" rx="130" ry="90"/>
    <ellipse cx="780" cy="60" rx="150" ry="110"/>
    <ellipse cx="1000" cy="85" rx="130" ry="95"/>
  </g>
  <!-- Hanging vines -->
  <g stroke="#1a3a1e" stroke-width="3" fill="none" opacity="0.8">
    <path d="M120 140 Q115 220 125 300"/>
    <path d="M320 160 Q325 240 315 320"/>
    <path d="M560 150 Q565 230 555 310"/>
    <path d="M820 170 Q815 250 825 330"/>
    <path d="M1020 140 Q1025 220 1015 300"/>
  </g>
</svg></div>

<!-- Left bush -->
<div class="bush bush-l"><svg viewBox="0 0 520 720" preserveAspectRatio="none">
  <g fill="#0a1f0a">
    <ellipse cx="100" cy="600" rx="180" ry="180"/>
    <ellipse cx="260" cy="520" rx="200" ry="200"/>
    <ellipse cx="420" cy="620" rx="170" ry="160"/>
    <ellipse cx="180" cy="360" rx="160" ry="170"/>
    <ellipse cx="340" cy="300" rx="170" ry="180"/>
    <ellipse cx="80" cy="180" rx="140" ry="160"/>
    <ellipse cx="260" cy="120" rx="150" ry="140"/>
  </g>
  <g fill="#1a3a18" opacity="0.9">
    <ellipse cx="140" cy="500" rx="100" ry="100"/>
    <ellipse cx="320" cy="420" rx="120" ry="110"/>
    <ellipse cx="220" cy="260" rx="110" ry="120"/>
    <ellipse cx="380" cy="200" rx="100" ry="110"/>
  </g>
  <!-- Leaf details -->
  <g fill="#2d6b2a" opacity="0.85">
    <ellipse cx="90" cy="480" rx="14" ry="22" transform="rotate(-20 90 480)"/>
    <ellipse cx="170" cy="430" rx="14" ry="22" transform="rotate(15 170 430)"/>
    <ellipse cx="270" cy="380" rx="14" ry="22" transform="rotate(-10 270 380)"/>
    <ellipse cx="350" cy="310" rx="14" ry="22" transform="rotate(25 350 310)"/>
    <ellipse cx="180" cy="220" rx="14" ry="22" transform="rotate(-30 180 220)"/>
    <ellipse cx="280" cy="150" rx="14" ry="22" transform="rotate(10 280 150)"/>
    <ellipse cx="420" cy="470" rx="14" ry="22" transform="rotate(20 420 470)"/>
    <ellipse cx="120" cy="280" rx="14" ry="22" transform="rotate(40 120 280)"/>
  </g>
  <!-- Small flowers -->
  <g>
    <circle cx="210" cy="440" r="5" fill="#fff8b0"/><circle cx="210" cy="440" r="2" fill="#ffcc40"/>
    <circle cx="340" cy="360" r="5" fill="#ffb0d8"/><circle cx="340" cy="360" r="2" fill="#ff70a0"/>
    <circle cx="420" cy="540" r="5" fill="#fff8b0"/><circle cx="420" cy="540" r="2" fill="#ffcc40"/>
    <circle cx="140" cy="340" r="5" fill="#d8b0ff"/><circle cx="140" cy="340" r="2" fill="#a070ff"/>
  </g>
</svg></div>

<!-- Right bush -->
<div class="bush bush-r"><svg viewBox="0 0 560 780" preserveAspectRatio="none">
  <g fill="#0a1f0a">
    <ellipse cx="460" cy="640" rx="180" ry="180"/>
    <ellipse cx="300" cy="550" rx="210" ry="210"/>
    <ellipse cx="140" cy="660" rx="180" ry="170"/>
    <ellipse cx="380" cy="380" rx="170" ry="180"/>
    <ellipse cx="220" cy="320" rx="180" ry="180"/>
    <ellipse cx="480" cy="200" rx="150" ry="170"/>
    <ellipse cx="300" cy="130" rx="160" ry="150"/>
  </g>
  <g fill="#1a3a18" opacity="0.9">
    <ellipse cx="420" cy="520" rx="110" ry="110"/>
    <ellipse cx="240" cy="440" rx="130" ry="120"/>
    <ellipse cx="340" cy="280" rx="120" ry="130"/>
    <ellipse cx="180" cy="210" rx="110" ry="120"/>
  </g>
  <g fill="#2d6b2a" opacity="0.85">
    <ellipse cx="470" cy="500" rx="14" ry="22" transform="rotate(20 470 500)"/>
    <ellipse cx="390" cy="450" rx="14" ry="22" transform="rotate(-15 390 450)"/>
    <ellipse cx="290" cy="400" rx="14" ry="22" transform="rotate(10 290 400)"/>
    <ellipse cx="210" cy="330" rx="14" ry="22" transform="rotate(-25 210 330)"/>
    <ellipse cx="380" cy="240" rx="14" ry="22" transform="rotate(30 380 240)"/>
    <ellipse cx="280" cy="160" rx="14" ry="22" transform="rotate(-10 280 160)"/>
    <ellipse cx="140" cy="480" rx="14" ry="22" transform="rotate(-20 140 480)"/>
    <ellipse cx="440" cy="300" rx="14" ry="22" transform="rotate(-40 440 300)"/>
  </g>
  <g>
    <circle cx="350" cy="460" r="5" fill="#fff8b0"/><circle cx="350" cy="460" r="2" fill="#ffcc40"/>
    <circle cx="220" cy="380" r="5" fill="#ffb0d8"/><circle cx="220" cy="380" r="2" fill="#ff70a0"/>
    <circle cx="140" cy="560" r="5" fill="#fff8b0"/><circle cx="140" cy="560" r="2" fill="#ffcc40"/>
    <circle cx="420" cy="340" r="5" fill="#d8b0ff"/><circle cx="420" cy="340" r="2" fill="#a070ff"/>
  </g>
</svg></div>

<canvas id="pollen"></canvas>
<canvas id="leaves"></canvas>
<canvas id="butter"></canvas>
<canvas id="grass-blades"></canvas>

<div class="center-darken"></div>
<div class="vignette"></div>
<div class="zone-top"></div>
<div class="zone-bot"></div>

<script>
const W=1080,H=1920;
function setup(id){const c=document.getElementById(id);c.width=W;c.height=H;return c.getContext('2d');}

// Soft bokeh light spots
const bk=setup('bokeh');
const bokeh=[];
for(let i=0;i<45;i++){
  bokeh.push({x:Math.random()*W,y:Math.random()*H,r:14+Math.random()*36,
    hue:55+Math.random()*50,a:0.1+Math.random()*0.3,
    vx:(Math.random()-0.5)*0.25,vy:(Math.random()-0.5)*0.15-0.04,
    ph:Math.random()*Math.PI*2,sp:0.3+Math.random()*0.6});
}

// Pollen/dust motes (tiny)
const pl=setup('pollen');
const pollen=[];
for(let i=0;i<120;i++)pollen.push({x:Math.random()*W,y:Math.random()*H,r:0.5+Math.random()*1.5,vx:(Math.random()-0.5)*0.3,vy:-0.1-Math.random()*0.3,a:0.3+Math.random()*0.5,hue:50+Math.random()*30,ph:Math.random()*Math.PI*2});

// Falling leaves
const lv=setup('leaves');
const leaves=[];
const leafCol=['#7fc940','#9edc5a','#b8e878','#c9d94a','#e8d75f','#5fa83a','#8fd050','#d4c040','#6ab030'];
for(let i=0;i<40;i++)leaves.push({x:Math.random()*W,y:Math.random()*H-H,sz:7+Math.random()*13,col:leafCol[Math.floor(Math.random()*leafCol.length)],vy:0.5+Math.random()*1.2,vx:(Math.random()-0.5)*0.6,rot:Math.random()*Math.PI*2,vr:(Math.random()-0.5)*0.04,sw:Math.random()*Math.PI*2,swSp:0.008+Math.random()*0.014});

// Butterflies
const bt=setup('butter');
const butters=[];
for(let i=0;i<4;i++)butters.push({x:Math.random()*W,y:400+Math.random()*800,vx:(Math.random()<0.5?1:-1)*(0.8+Math.random()*0.5),vy:(Math.random()-0.5)*0.3,flap:Math.random()*Math.PI*2,flapSp:0.25,col:['#ff6ba0','#ffe86b','#6bb5ff','#ff9d6b'][Math.floor(Math.random()*4)],sz:12+Math.random()*7,bob:Math.random()*Math.PI*2});

// Grass blades at bottom, swaying
const gb=setup('grass-blades');
const blades=[];
for(let i=0;i<55;i++)blades.push({x:Math.random()*W,base:1750+Math.random()*170,h:30+Math.random()*60,sw:Math.random()*Math.PI*2,swSp:0.02+Math.random()*0.02,hue:80+Math.random()*30,light:25+Math.random()*15});

function drawLeaf(ctx,x,y,sz,rot,col){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  ctx.fillStyle=col;
  ctx.beginPath();ctx.ellipse(0,0,sz*0.45,sz,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(40,80,20,0.5)';ctx.lineWidth=0.8;
  ctx.beginPath();ctx.moveTo(0,-sz);ctx.lineTo(0,sz);ctx.stroke();
  ctx.restore();
}
function drawButterfly(ctx,b){
  ctx.save();ctx.translate(b.x,b.y);
  const flap=Math.sin(b.flap)*0.8;
  ctx.fillStyle=b.col;ctx.globalAlpha=0.85;
  ctx.save();ctx.scale(Math.cos(flap),1);
  ctx.beginPath();ctx.ellipse(-b.sz*0.5,0,b.sz*0.6,b.sz*0.8,0.3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(-b.sz*0.4,b.sz*0.5,b.sz*0.35,b.sz*0.5,0.2,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.save();ctx.scale(-Math.cos(flap),1);
  ctx.beginPath();ctx.ellipse(-b.sz*0.5,0,b.sz*0.6,b.sz*0.8,0.3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(-b.sz*0.4,b.sz*0.5,b.sz*0.35,b.sz*0.5,0.2,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.fillStyle='#2a1a0a';ctx.globalAlpha=1;
  ctx.beginPath();ctx.ellipse(0,0,2,b.sz*0.7,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

let t=0;
function loop(){
  t+=0.016;

  bk.clearRect(0,0,W,H);
  for(const p of bokeh){
    p.x+=p.vx;p.y+=p.vy;p.ph+=0.02*p.sp;
    if(p.x<-50)p.x=W+50;if(p.x>W+50)p.x=-50;
    if(p.y<-50)p.y=H+50;if(p.y>H+50)p.y=-50;
    const a=p.a*(0.7+Math.sin(p.ph)*0.3);
    const g=bk.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
    g.addColorStop(0,`hsla(${p.hue},75%,65%,${a})`);
    g.addColorStop(1,`hsla(${p.hue},75%,65%,0)`);
    bk.fillStyle=g;bk.beginPath();bk.arc(p.x,p.y,p.r,0,Math.PI*2);bk.fill();
  }

  pl.clearRect(0,0,W,H);
  for(const p of pollen){
    p.ph+=0.04;p.x+=p.vx+Math.sin(p.ph)*0.2;p.y+=p.vy;
    if(p.y<-10){p.y=H+10;p.x=Math.random()*W;}
    if(p.x<-10)p.x=W+10;if(p.x>W+10)p.x=-10;
    pl.fillStyle=`hsla(${p.hue},80%,75%,${p.a})`;
    pl.beginPath();pl.arc(p.x,p.y,p.r,0,Math.PI*2);pl.fill();
  }

  lv.clearRect(0,0,W,H);
  for(const l of leaves){
    l.sw+=l.swSp;l.x+=l.vx+Math.sin(l.sw)*0.8;l.y+=l.vy;l.rot+=l.vr;
    if(l.y>H+40){l.y=-40;l.x=Math.random()*W;}
    if(l.x<-40)l.x=W+40;if(l.x>W+40)l.x=-40;
    drawLeaf(lv,l.x,l.y,l.sz,l.rot,l.col);
  }

  bt.clearRect(0,0,W,H);
  for(const b of butters){
    b.flap+=b.flapSp;b.bob+=0.03;b.x+=b.vx;b.y+=b.vy+Math.sin(b.bob)*0.3;
    if(b.x<-40)b.x=W+40;if(b.x>W+40)b.x=-40;
    if(b.y<350)b.vy=Math.abs(b.vy);if(b.y>1200)b.vy=-Math.abs(b.vy);
    drawButterfly(bt,b);
  }

  gb.clearRect(0,0,W,H);
  for(const b of blades){
    b.sw+=b.swSp;
    const bend=Math.sin(b.sw)*8;
    gb.strokeStyle=`hsl(${b.hue},70%,${b.light}%)`;gb.lineWidth=2.2;gb.lineCap='round';
    gb.beginPath();gb.moveTo(b.x,b.base);
    gb.quadraticCurveTo(b.x+bend*0.5,b.base-b.h*0.5,b.x+bend,b.base-b.h);
    gb.stroke();
  }

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
