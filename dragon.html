<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Dragon — Drachennest</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#1a0800;}
canvas{position:absolute;inset:0;width:1080px;height:1920px;display:block;}
.bg{position:absolute;inset:0;background:
  radial-gradient(ellipse 80% 50% at 50% 30%, #8a3a00 0%, #4a1800 40%, transparent 75%),
  radial-gradient(ellipse 100% 60% at 50% 0%, #cc6a20 0%, #8a3a00 25%, transparent 55%),
  linear-gradient(180deg, #2d1000 0%, #3a1800 30%, #1a0800 60%, #150500 100%);}
/* Cloud layers below (flying above clouds) */
.cloud-layer{position:absolute;bottom:0;left:0;right:0;height:620px;
  background:
    radial-gradient(ellipse 500px 120px at 15% 60%, rgba(255,160,80,0.25) 0%, transparent 70%),
    radial-gradient(ellipse 600px 140px at 60% 45%, rgba(255,130,60,0.3) 0%, transparent 70%),
    radial-gradient(ellipse 450px 110px at 85% 55%, rgba(255,180,90,0.25) 0%, transparent 70%),
    radial-gradient(ellipse 800px 180px at 40% 80%, rgba(120,50,20,0.5) 0%, transparent 65%),
    radial-gradient(ellipse 700px 160px at 75% 90%, rgba(80,30,10,0.6) 0%, transparent 65%);
  filter:blur(3px);}
/* Peak silhouette */
.peak{position:absolute;bottom:340px;left:50%;transform:translateX(-50%);width:700px;height:380px;background:#0f0400;
  clip-path:polygon(0 100%, 5% 90%, 12% 75%, 20% 60%, 32% 45%, 42% 30%, 50% 15%, 58% 30%, 68% 45%, 80% 60%, 88% 75%, 95% 90%, 100% 100%);}

.zone-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(0,0,0,0.55) 0%,transparent 100%);z-index:40;}
.zone-bot{position:absolute;bottom:0;left:0;right:0;height:920px;background:linear-gradient(0deg,rgba(20,8,0,0.55) 0%,rgba(20,8,0,0.12) 40%,transparent 100%);z-index:40;}
.center-darken{position:absolute;top:300px;left:50%;transform:translateX(-50%);width:780px;height:540px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(15,5,0,0.4) 0%,transparent 70%);z-index:38;}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 40%,rgba(0,0,0,0.6) 100%);z-index:39;pointer-events:none;}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="clouds"></canvas>
<div class="peak"></div>
<canvas id="scales"></canvas>
<canvas id="shadow"></canvas>
<canvas id="fire"></canvas>
<div class="cloud-layer"></div>
<div class="center-darken"></div>
<div class="vignette"></div>
<div class="zone-top"></div>
<div class="zone-bot"></div>
<script>
const W=1080,H=1920;
function setup(id){const c=document.getElementById(id);c.width=W;c.height=H;return c.getContext('2d');}

const cl=setup('clouds');
const clouds=[];
for(let i=0;i<30;i++)clouds.push({x:Math.random()*W,y:Math.random()*500,r:80+Math.random()*150,vx:0.1+Math.random()*0.2,hue:20+Math.random()*30,a:0.15+Math.random()*0.2});

const sc=setup('scales');
const scales=[];
for(let i=0;i<50;i++)scales.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*0.4,vy:-0.2-Math.random()*0.4,rot:Math.random()*Math.PI*2,vr:(Math.random()-0.5)*0.03,sz:6+Math.random()*10,ph:Math.random()*Math.PI*2,hue:40+Math.random()*15});

const sh=setup('shadow');
const shadows=[];
for(let i=0;i<3;i++)shadows.push({x:-300,y:400+i*400,vx:0.8+Math.random()*0.6,sz:500+Math.random()*200,delay:i*8000,start:performance.now()+i*6000});

const fr=setup('fire');
const fires=[];
for(let i=0;i<2;i++)fires.push({pts:[],nextFire:performance.now()+Math.random()*3000});

function drawWingShadow(ctx,sh){
  const prog=(sh.x+300)/(W+600);
  ctx.save();
  ctx.translate(sh.x,sh.y+Math.sin(prog*Math.PI*2)*30);
  ctx.globalAlpha=0.18*Math.sin(prog*Math.PI);
  ctx.fillStyle='#000';
  // Wing shape
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.quadraticCurveTo(-sh.sz*0.3,-sh.sz*0.5,-sh.sz,-sh.sz*0.3);
  ctx.quadraticCurveTo(-sh.sz*0.7,-sh.sz*0.1,-sh.sz*0.5,0);
  ctx.quadraticCurveTo(-sh.sz*0.3,sh.sz*0.1,0,sh.sz*0.15);
  ctx.quadraticCurveTo(sh.sz*0.3,sh.sz*0.1,sh.sz*0.5,0);
  ctx.quadraticCurveTo(sh.sz*0.7,-sh.sz*0.1,sh.sz,-sh.sz*0.3);
  ctx.quadraticCurveTo(sh.sz*0.3,-sh.sz*0.5,0,0);
  ctx.closePath();ctx.fill();
  ctx.restore();
}

let t=0;
function loop(){
  t+=0.016;
  cl.clearRect(0,0,W,H);
  for(const c of clouds){c.x+=c.vx;if(c.x>W+200)c.x=-200;
    const g=cl.createRadialGradient(c.x,c.y,0,c.x,c.y,c.r);
    g.addColorStop(0,`hsla(${c.hue},80%,40%,${c.a})`);g.addColorStop(1,`hsla(${c.hue},80%,30%,0)`);
    cl.fillStyle=g;cl.beginPath();cl.arc(c.x,c.y,c.r,0,Math.PI*2);cl.fill();}

  sc.clearRect(0,0,W,H);
  for(const s of scales){
    s.ph+=0.05;s.x+=s.vx;s.y+=s.vy+Math.sin(s.ph)*0.3;s.rot+=s.vr;
    if(s.y<-20){s.y=H+20;s.x=Math.random()*W;}
    sc.save();sc.translate(s.x,s.y);sc.rotate(s.rot);
    sc.fillStyle=`hsla(${s.hue},90%,60%,0.85)`;sc.shadowBlur=8;sc.shadowColor=`hsl(${s.hue},100%,60%)`;
    sc.beginPath();sc.moveTo(0,-s.sz);sc.quadraticCurveTo(s.sz*0.6,0,0,s.sz);sc.quadraticCurveTo(-s.sz*0.6,0,0,-s.sz);sc.fill();
    sc.restore();
  }sc.shadowBlur=0;

  sh.clearRect(0,0,W,H);
  for(const s of shadows){
    s.x+=s.vx;
    if(s.x>W+400){s.x=-400;s.y=400+Math.random()*800;}
    drawWingShadow(sh,s);
  }

  // Fire streaks
  fr.clearRect(0,0,W,H);
  for(const f of fires){
    if(performance.now()>f.nextFire){
      const sy=200+Math.random()*400;
      f.pts=[{x:-50,y:sy,t:performance.now(),ey:sy+100}];
      f.nextFire=performance.now()+5000+Math.random()*5000;
    }
    if(f.pts.length){
      const p=f.pts[0];
      const age=(performance.now()-p.t)/2500;
      if(age<1){
        const cx=-50+age*(W+100);
        const cy=p.y+Math.sin(age*4)*40;
        // Trail
        fr.strokeStyle='rgba(255,120,30,0.6)';fr.lineWidth=6;fr.shadowBlur=30;fr.shadowColor='#ff6600';
        fr.beginPath();
        for(let i=0;i<20;i++){
          const a=Math.max(0,age-i*0.02);
          if(a<=0)break;
          const tx=-50+a*(W+100);
          const ty=p.y+Math.sin(a*4)*40;
          if(i===0)fr.moveTo(tx,ty);else fr.lineTo(tx,ty);
        }
        fr.stroke();
        // Head
        const hg=fr.createRadialGradient(cx,cy,0,cx,cy,40);
        hg.addColorStop(0,'rgba(255,230,150,1)');hg.addColorStop(0.5,'rgba(255,120,30,0.7)');hg.addColorStop(1,'rgba(255,100,0,0)');
        fr.fillStyle=hg;fr.beginPath();fr.arc(cx,cy,40,0,Math.PI*2);fr.fill();
      }else f.pts=[];
    }
  }
  fr.shadowBlur=0;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
