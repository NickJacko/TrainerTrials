<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Dragon — Inside the Dragon's Eye</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:1080px;height:1920px;overflow:hidden;
    background:#0a0300;
  }
  canvas{position:absolute;inset:0;width:1080px;height:1920px;display:block;}

  /* Cornea refraction — light bending at the top of the eye */
  .cornea{
    position:absolute;top:-120px;left:50%;transform:translateX(-50%);
    width:1400px;height:600px;border-radius:50%;
    background:radial-gradient(ellipse 60% 45% at 50% 30%,
      rgba(255,200,100,0.12) 0%,
      rgba(200,140,60,0.07) 40%,
      transparent 70%);
    mix-blend-mode:screen;filter:blur(30px);
    animation:corneaShimmer 8s ease-in-out infinite;
  }
  @keyframes corneaShimmer{
    0%,100%{opacity:0.6;transform:translateX(-50%) scaleX(1)}
    50%{opacity:1;transform:translateX(-50%) scaleX(1.03)}
  }

  /* Iris outer ring — the sclera edge (reddish veins meet white) */
  .sclera-edge{
    position:absolute;top:50%;left:50%;
    width:1920px;height:1920px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(ellipse 100% 100% at 50% 50%,
      transparent 44%,
      rgba(180,60,10,0.15) 58%,
      rgba(220,80,15,0.25) 70%,
      rgba(150,40,5,0.35) 82%,
      rgba(80,15,0,0.6) 92%,
      rgba(20,3,0,0.9) 100%);
  }

  /* Pupil — the abyss */
  .pupil{
    position:absolute;top:50%;left:50%;
    width:420px;height:520px;
    transform:translate(-50%,-50%);
    border-radius:50% 50% 50% 50% / 45% 45% 55% 55%;
    background:radial-gradient(ellipse at 50% 50%,
      #000 0%, #010000 40%, #050100 70%, rgba(8,2,0,0) 100%);
    box-shadow:0 0 80px rgba(0,0,0,0.95), 0 0 160px rgba(0,0,0,0.8);
    animation:pupilPulse 6s ease-in-out infinite;
  }
  @keyframes pupilPulse{
    0%,100%{transform:translate(-50%,-50%) scale(1)}
    50%{transform:translate(-50%,-50%) scale(1.08)}
  }

  /* Blink overlay — eyelid coming down */
  .blink-top{
    position:absolute;top:0;left:0;right:0;
    height:0;
    background:linear-gradient(180deg, #050100 0%, #0a0300 100%);
    border-radius:0 0 50% 50%;
    animation:blinkTop 12s ease-in-out infinite;
    z-index:50;
    transform-origin:top center;
  }
  .blink-bot{
    position:absolute;bottom:0;left:0;right:0;
    height:0;
    background:linear-gradient(0deg, #050100 0%, #0a0300 100%);
    border-radius:50% 50% 0 0;
    animation:blinkBot 12s ease-in-out infinite;
    z-index:50;
    transform-origin:bottom center;
  }
  @keyframes blinkTop{
    0%,35%,55%,100%{height:0}
    42%,48%{height:960px}
  }
  @keyframes blinkBot{
    0%,35%,55%,100%{height:0}
    42%,48%{height:960px}
  }

  /* Eyelid skin texture edge */
  .lid-edge-top{
    position:absolute;top:0;left:0;right:0;height:60px;
    background:linear-gradient(180deg,rgba(5,1,0,0.9) 0%,transparent 100%);
    z-index:45;
  }
  .lid-edge-bot{
    position:absolute;bottom:0;left:0;right:0;height:60px;
    background:linear-gradient(0deg,rgba(5,1,0,0.9) 0%,transparent 100%);
    z-index:45;
  }

  /* Ring area glow */
  .ring-iris-glow{
    position:absolute;top:210px;left:50%;transform:translateX(-50%);
    width:840px;height:840px;border-radius:50%;
    background:radial-gradient(ellipse 100% 100% at 50% 50%,
      rgba(255,120,0,0.1) 0%,rgba(200,80,0,0.05) 48%,transparent 68%);
    mix-blend-mode:screen;filter:blur(20px);
    animation:irisGlow 4s ease-in-out infinite;
  }
  @keyframes irisGlow{0%,100%{opacity:0.65;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.02)}}

  /* UI */
  .center-darken{position:absolute;top:300px;left:50%;transform:translateX(-50%);width:780px;height:540px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(4,1,0,0.42) 0%,transparent 70%);z-index:38;}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 38%,rgba(0,0,0,0.78) 100%);z-index:39;pointer-events:none;}
  .zone-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(0,0,0,0.6) 0%,transparent 100%);z-index:40;}
  .zone-bot{position:absolute;bottom:0;left:0;right:0;height:920px;background:linear-gradient(0deg,rgba(0,0,0,0.65) 0%,rgba(0,0,0,0.15) 40%,transparent 100%);z-index:40;}
</style>
</head>
<body>
  <div class="cornea"></div>
  <div class="sclera-edge"></div>

  <!-- Canvas stack: iris → veins → ring → particles -->
  <canvas id="cIris"></canvas>
  <canvas id="cVeins"></canvas>
  <canvas id="cRing"></canvas>
  <canvas id="cParticles"></canvas>

  <div class="pupil"></div>
  <div class="ring-iris-glow"></div>
  <div class="lid-edge-top"></div>
  <div class="lid-edge-bot"></div>
  <div class="blink-top"></div>
  <div class="blink-bot"></div>
  <div class="center-darken"></div>
  <div class="vignette"></div>
  <div class="zone-top"></div>
  <div class="zone-bot"></div>

<script>
const W=1080, H=1920;
const CX=540, CY=960; // Eye center (middle of screen)
const RING_CX=540, RING_CY=590, RING_R=300;

function mkCanvas(id){
  const c=document.getElementById(id);
  c.width=W; c.height=H;
  return c.getContext('2d');
}
const irisCtx   = mkCanvas('cIris');
const veinsCtx  = mkCanvas('cVeins');
const ringCtx   = mkCanvas('cRing');
const partCtx   = mkCanvas('cParticles');

/* ═══════════════════════════════════════════════════════════════════════════
   IRIS — rotating geometric dragon-eye pattern
   The iris has 3 rotation layers at different speeds + texture segments
   ═══════════════════════════════════════════════════════════════════════════ */
// Iris layers
const irisLayers=[
  // {segCount, innerR, outerR, rotSpeed, hue, style}
  {segCount:24, innerR:210, outerR:320, rotSpeed:0.0018, hue:28, style:'shard'},
  {segCount:16, innerR:320, outerR:440, rotSpeed:-0.0012, hue:18, style:'plate'},
  {segCount:32, innerR:440, outerR:560, rotSpeed:0.0008, hue:35, style:'fiber'},
  {segCount:12, innerR:560, outerR:680, rotSpeed:-0.0006, hue:22, style:'plate'},
  {segCount:40, innerR:680, outerR:820, rotSpeed:0.0005, hue:15, style:'fiber'},
];
const irisRots=irisLayers.map(()=>0);

// Iris texture heightmap (per-segment variation, generated once)
const segTextures=irisLayers.map(layer=>{
  return Array.from({length:layer.segCount},()=>({
    brightness:0.4+Math.random()*0.6,
    hueOffset:(Math.random()-0.5)*20,
    crackedEdge:Math.random()<0.3,
    glow:Math.random()<0.25,
    phase:Math.random()*Math.PI*2,
  }));
});

function drawIrisLayer(ctx, layer, layerIdx, rot, t){
  const {segCount,innerR,outerR,hue,style} = layer;
  const angStep=(Math.PI*2)/segCount;
  const segs=segTextures[layerIdx];

  for(let i=0;i<segCount;i++){
    const s=segs[i];
    s.phase+=0.008;
    const ang=i*angStep+rot;
    const ang2=ang+angStep;
    const pulse=0.8+Math.sin(s.phase)*0.2;
    const b=s.brightness*pulse;
    const h=hue+s.hueOffset;

    if(style==='shard'){
      // Pointed shards — inner radius narrows at midpoint
      const midAng=(ang+ang2)/2;
      const midInner=innerR+(outerR-innerR)*0.2;
      const gap=angStep*0.06;

      ctx.beginPath();
      ctx.moveTo(CX+Math.cos(ang+gap)*innerR, CY+Math.sin(ang+gap)*innerR);
      ctx.lineTo(CX+Math.cos(midAng)*midInner, CY+Math.sin(midAng)*midInner);
      ctx.lineTo(CX+Math.cos(ang2-gap)*innerR, CY+Math.sin(ang2-gap)*innerR);
      ctx.lineTo(CX+Math.cos(ang2-gap*0.5)*outerR, CY+Math.sin(ang2-gap*0.5)*outerR);
      ctx.lineTo(CX+Math.cos(ang+gap*0.5)*outerR, CY+Math.sin(ang+gap*0.5)*outerR);
      ctx.closePath();

      const grad=ctx.createLinearGradient(
        CX+Math.cos(midAng)*innerR, CY+Math.sin(midAng)*innerR,
        CX+Math.cos(midAng)*outerR, CY+Math.sin(midAng)*outerR
      );
      grad.addColorStop(0, `hsla(${h+15},90%,${25+b*35}%,0.85)`);
      grad.addColorStop(0.5,`hsla(${h},85%,${35+b*30}%,0.7)`);
      grad.addColorStop(1, `hsla(${h-8},80%,${20+b*20}%,0.5)`);
      ctx.fillStyle=grad;
      if(s.glow){ctx.shadowBlur=12;ctx.shadowColor=`hsla(${h},100%,55%,0.6)`;}
      ctx.fill();
      ctx.shadowBlur=0;

      // Shard edge highlight
      ctx.strokeStyle=`hsla(${h+20},100%,${55+b*20}%,${0.15+b*0.2})`;
      ctx.lineWidth=0.8; ctx.stroke();

    } else if(style==='plate'){
      // Hexagonal plates — flat segments
      const gap=angStep*0.04;
      ctx.beginPath();
      ctx.arc(CX,CY,innerR,ang+gap,ang2-gap);
      ctx.arc(CX,CY,outerR,ang2-gap,ang+gap,true);
      ctx.closePath();

      const grad=ctx.createRadialGradient(CX,CY,innerR,CX,CY,outerR);
      grad.addColorStop(0,`hsla(${h+20},80%,${40+b*25}%,${0.5+b*0.3})`);
      grad.addColorStop(0.4,`hsla(${h},85%,${30+b*30}%,${0.6+b*0.2})`);
      grad.addColorStop(1,`hsla(${h-10},75%,${18+b*18}%,${0.4+b*0.2})`);
      ctx.fillStyle=grad;
      if(s.glow){ctx.shadowBlur=15;ctx.shadowColor=`hsla(${h},100%,55%,0.5)`;}
      ctx.fill();
      ctx.shadowBlur=0;

      // Scale line detail
      if(s.crackedEdge){
        const mx=CX+Math.cos((ang+ang2)/2)*((innerR+outerR)/2);
        const my=CY+Math.sin((ang+ang2)/2)*((innerR+outerR)/2);
        ctx.strokeStyle=`hsla(${h+30},100%,70%,${0.1+b*0.15})`;
        ctx.lineWidth=0.6;
        ctx.beginPath();
        ctx.arc(CX,CY,(innerR+outerR)/2,ang+gap*2,ang2-gap*2);
        ctx.stroke();
      }

    } else { // fiber
      // Radial fiber strands
      const fiberCount=3;
      for(let fi=0;fi<fiberCount;fi++){
        const fa=ang+(fi+0.5)*(angStep/fiberCount);
        ctx.beginPath();
        ctx.moveTo(CX+Math.cos(fa)*innerR, CY+Math.sin(fa)*innerR);
        // Slight curve
        const curveMid=(innerR+outerR)/2;
        const perpAng=fa+Math.PI/2;
        const cx1=CX+Math.cos(fa)*curveMid+Math.cos(perpAng)*8*Math.sin(s.phase);
        const cy1=CY+Math.sin(fa)*curveMid+Math.sin(perpAng)*8*Math.sin(s.phase);
        ctx.quadraticCurveTo(cx1,cy1,CX+Math.cos(fa)*outerR,CY+Math.sin(fa)*outerR);
        ctx.strokeStyle=`hsla(${h+fi*8},90%,${45+b*30}%,${0.25+b*0.35})`;
        ctx.lineWidth=1+b*0.8;
        if(s.glow && fi===1){ctx.shadowBlur=8;ctx.shadowColor=`hsla(${h},100%,60%,0.5)`;}
        ctx.stroke();
        ctx.shadowBlur=0;
      }
    }
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   RETINA VEINS — glowing blood vessels radiating from pupil
   ═══════════════════════════════════════════════════════════════════════════ */
const VEIN_COUNT=18;
const veins=[];

function genVein(idx){
  const baseAng=(idx/VEIN_COUNT)*Math.PI*2;
  const ang=baseAng+(Math.random()-0.5)*0.3;
  const pts=[{x:CX+Math.cos(ang)*220, y:CY+Math.sin(ang)*260}];
  let cx2=pts[0].x, cy2=pts[0].y;
  let a=ang;
  const branches=[];
  const totalLen=300+Math.random()*400;
  const steps=12+Math.floor(Math.random()*8);
  for(let s=0;s<steps;s++){
    a+=(Math.random()-0.5)*0.35;
    const segLen=totalLen/steps*(0.7+Math.random()*0.6);
    cx2+=Math.cos(a)*segLen;
    cy2+=Math.sin(a)*segLen;
    pts.push({x:cx2,y:cy2});
    // Random branch
    if(s>3&&Math.random()<0.35){
      const bpts=[{x:cx2,y:cy2}];
      let ba=a+(Math.random()<0.5?1:-1)*(0.5+Math.random()*0.5);
      let bx=cx2, by=cy2;
      for(let bi=0;bi<5+Math.floor(Math.random()*4);bi++){
        ba+=(Math.random()-0.5)*0.4;
        bx+=Math.cos(ba)*segLen*0.55;
        by+=Math.sin(ba)*segLen*0.55;
        bpts.push({x:bx,y:by});
      }
      branches.push(bpts);
    }
  }
  return{
    pts, branches,
    phase:Math.random()*Math.PI*2,
    pulseSpeed:0.025+Math.random()*0.035,
    width:1+Math.random()*2.5,
    hue:Math.random()<0.7?15+Math.random()*20:35+Math.random()*20, // red or gold
    glowIntensity:0.3+Math.random()*0.7,
  };
}
for(let i=0;i<VEIN_COUNT;i++) veins.push(genVein(i));

// Energy pulses that travel along veins
const veinPulses=[];
let pulseSpawnTimer=0;

function drawVeinPath(ctx,pts,width,hue,alpha,glow){
  if(pts.length<2) return;
  ctx.beginPath();
  ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length-1;i++){
    const mx=(pts[i].x+pts[i+1].x)/2;
    const my=(pts[i].y+pts[i+1].y)/2;
    ctx.quadraticCurveTo(pts[i].x,pts[i].y,mx,my);
  }
  ctx.lineTo(pts[pts.length-1].x,pts[pts.length-1].y);
  ctx.strokeStyle=`hsla(${hue},90%,55%,${alpha})`;
  ctx.lineWidth=width;
  if(glow>0){ctx.shadowBlur=glow*12;ctx.shadowColor=`hsla(${hue},100%,60%,0.8)`;}
  ctx.stroke();
  ctx.shadowBlur=0;
}

/* ═══════════════════════════════════════════════════════════════════════════
   RING — Iris geometry meets spawn ring
   Concentric rotating rings of draconic sigils + depth glow
   ═══════════════════════════════════════════════════════════════════════════ */
const sigilRings=[
  {count:8,  r:RING_R+60, rot:0, rotSp:0.012,  hue:25, size:16},
  {count:12, r:RING_R+110,rot:1, rotSp:-0.008, hue:35, size:12},
  {count:6,  r:RING_R+158,rot:2, rotSp:0.005,  hue:18, size:20},
];

function drawSigil(ctx,cx,cy,size,ang,hue,a){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);
  ctx.strokeStyle=`hsla(${hue},100%,65%,${a})`;
  ctx.lineWidth=1.4;ctx.shadowBlur=10;ctx.shadowColor=`hsla(${hue},100%,60%,0.7)`;
  ctx.lineCap='round';
  // Dragon scale sigil — curved diamond with inner detail
  ctx.beginPath();
  ctx.moveTo(0,-size);
  ctx.bezierCurveTo(size*0.7,-size*0.4,size*0.7,size*0.4,0,size);
  ctx.bezierCurveTo(-size*0.7,size*0.4,-size*0.7,-size*0.4,0,-size);
  ctx.stroke();
  // Inner cross
  ctx.beginPath();
  ctx.moveTo(0,-size*0.5);ctx.lineTo(size*0.4,0);
  ctx.lineTo(0,size*0.5);ctx.lineTo(-size*0.4,0);
  ctx.closePath();ctx.stroke();
  // Dot
  ctx.fillStyle=`hsla(${hue+20},100%,78%,${a*0.9})`;
  ctx.beginPath();ctx.arc(0,0,size*0.12,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════════════════
   PARTICLES
   ═══════════════════════════════════════════════════════════════════════════ */
// Floating iris motes — dust inside the eye
const irisMotes=[];
for(let i=0;i<60;i++){
  const ang=Math.random()*Math.PI*2;
  const r=200+Math.random()*750;
  irisMotes.push({
    x:CX+Math.cos(ang)*r,
    y:CY+Math.sin(ang)*r,
    r:0.8+Math.random()*2.5,
    orbitAng:ang,
    orbitR:r,
    orbitSp:(0.0003+Math.random()*0.0005)*(Math.random()<0.5?1:-1),
    phase:Math.random()*Math.PI*2,
    phaseSp:0.03+Math.random()*0.05,
    hue:20+Math.random()*30,
    a:0.3+Math.random()*0.5,
  });
}

// Depth shimmer — light catching inside the vitreous humor
const shimmerPoints=[];
for(let i=0;i<35;i++){
  shimmerPoints.push({
    x:150+Math.random()*780,
    y:200+Math.random()*1500,
    phase:Math.random()*Math.PI*2,
    sp:0.04+Math.random()*0.08,
    r:2+Math.random()*6,
    hue:30+Math.random()*20,
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   MAIN LOOP
   ═══════════════════════════════════════════════════════════════════════════ */
let t=0;

function loop(){
  t+=0.016;

  /* ── IRIS ── */
  irisCtx.clearRect(0,0,W,H);

  // Background iris base — deep amber/red radial
  const baseg=irisCtx.createRadialGradient(CX,CY,180,CX,CY,900);
  baseg.addColorStop(0,'rgba(80,25,0,0.95)');
  baseg.addColorStop(0.25,'rgba(140,55,5,0.9)');
  baseg.addColorStop(0.5,'rgba(100,35,3,0.85)');
  baseg.addColorStop(0.75,'rgba(60,18,1,0.8)');
  baseg.addColorStop(1,'rgba(20,5,0,0.7)');
  irisCtx.fillStyle=baseg;
  irisCtx.beginPath();irisCtx.arc(CX,CY,900,0,Math.PI*2);irisCtx.fill();

  // Draw all iris layers
  irisCtx.save();
  for(let li=0;li<irisLayers.length;li++){
    irisRots[li]+=irisLayers[li].rotSpeed;
    drawIrisLayer(irisCtx, irisLayers[li], li, irisRots[li], t);
  }
  irisCtx.restore();

  // Pupil gradient overlay — makes center dark
  const pupilG=irisCtx.createRadialGradient(CX,CY,0,CX,CY,230);
  pupilG.addColorStop(0,'rgba(0,0,0,0.98)');
  pupilG.addColorStop(0.6,'rgba(0,0,0,0.85)');
  pupilG.addColorStop(0.85,'rgba(2,0,0,0.4)');
  pupilG.addColorStop(1,'rgba(0,0,0,0)');
  irisCtx.fillStyle=pupilG;
  irisCtx.beginPath();irisCtx.ellipse(CX,CY,210,260,0,0,Math.PI*2);irisCtx.fill();

  /* ── VEINS ── */
  veinsCtx.clearRect(0,0,W,H);

  // Draw veins
  for(const v of veins){
    v.phase+=v.pulseSpeed;
    const basePulse=0.35+Math.sin(v.phase)*0.35;
    const alpha=basePulse*v.glowIntensity;

    // Outer glow pass
    drawVeinPath(veinsCtx,v.pts,v.width+2,v.hue,alpha*0.4,alpha*0.5);
    // Main vein
    drawVeinPath(veinsCtx,v.pts,v.width,v.hue,alpha*0.8,alpha*0.6);
    // Bright core
    drawVeinPath(veinsCtx,v.pts,v.width*0.3,v.hue+15,alpha*0.6,0);

    // Branches
    for(const b of v.branches){
      drawVeinPath(veinsCtx,b,v.width*0.55,v.hue+5,alpha*0.55,alpha*0.3);
    }
  }

  // Energy pulses traveling along veins
  pulseSpawnTimer+=0.016;
  if(pulseSpawnTimer>0.8+Math.random()*1.2){
    pulseSpawnTimer=0;
    const vein=veins[Math.floor(Math.random()*veins.length)];
    veinPulses.push({
      vein,
      progress:0,
      speed:0.008+Math.random()*0.012,
      hue:40+Math.random()*20,
      size:6+Math.random()*10,
    });
  }
  for(let i=veinPulses.length-1;i>=0;i--){
    const p=veinPulses[i];
    p.progress+=p.speed;
    if(p.progress>=1){veinPulses.splice(i,1);continue;}
    // Interpolate position along vein
    const pts=p.vein.pts;
    const idx=p.progress*(pts.length-1);
    const lo=Math.floor(idx), hi=Math.min(lo+1,pts.length-1);
    const frac=idx-lo;
    const px=pts[lo].x+(pts[hi].x-pts[lo].x)*frac;
    const py=pts[lo].y+(pts[hi].y-pts[lo].y)*frac;
    const fade=1-Math.abs(p.progress-0.5)*2;
    const pg=veinsCtx.createRadialGradient(px,py,0,px,py,p.size*2);
    pg.addColorStop(0,`hsla(${p.hue},100%,80%,${fade*0.9})`);
    pg.addColorStop(0.4,`hsla(${p.hue},100%,60%,${fade*0.4})`);
    pg.addColorStop(1,'rgba(0,0,0,0)');
    veinsCtx.fillStyle=pg;
    veinsCtx.shadowBlur=15;veinsCtx.shadowColor=`hsla(${p.hue},100%,65%,0.8)`;
    veinsCtx.beginPath();veinsCtx.arc(px,py,p.size*2,0,Math.PI*2);veinsCtx.fill();
    veinsCtx.shadowBlur=0;
  }

  /* ── RING AREA ── */
  ringCtx.clearRect(0,0,W,H);

  // Depth glow — ring is a window through the iris
  const rDepth=0.55+Math.sin(t*1.4)*0.3;
  const rdg=ringCtx.createRadialGradient(RING_CX,RING_CY,RING_R*0.2,RING_CX,RING_CY,RING_R+200);
  rdg.addColorStop(0,`rgba(255,110,0,${0.16*rDepth})`);
  rdg.addColorStop(0.4,`rgba(200,70,0,${0.07*rDepth})`);
  rdg.addColorStop(1,'rgba(0,0,0,0)');
  ringCtx.fillStyle=rdg;
  ringCtx.beginPath();ringCtx.arc(RING_CX,RING_CY,RING_R+200,0,Math.PI*2);ringCtx.fill();

  // Sigil rings
  for(const sr of sigilRings){
    sr.rot+=sr.rotSp;
    const pulse=0.5+Math.sin(t*1.6+sr.rot)*0.35;
    for(let i=0;i<sr.count;i++){
      const ang=sr.rot+(i/sr.count)*Math.PI*2;
      const px=RING_CX+Math.cos(ang)*sr.r;
      const py=RING_CY+Math.sin(ang)*sr.r;
      drawSigil(ringCtx,px,py,sr.size,ang+t*0.3,sr.hue,pulse);
    }
  }
  ringCtx.shadowBlur=0;

  // Iris-ring border — where spawn ring meets iris geometry
  const borderPulse=0.4+Math.sin(t*2.2)*0.4;
  ringCtx.strokeStyle=`rgba(255,140,30,${borderPulse*0.5})`;
  ringCtx.lineWidth=2;
  ringCtx.shadowBlur=18;ringCtx.shadowColor=`rgba(255,120,0,0.7)`;
  ringCtx.beginPath();ringCtx.arc(RING_CX,RING_CY,RING_R,0,Math.PI*2);ringCtx.stroke();
  ringCtx.shadowBlur=0;

  /* ── PARTICLES ── */
  partCtx.clearRect(0,0,W,H);

  // Orbiting iris motes
  partCtx.save();
  for(const m of irisMotes){
    m.orbitAng+=m.orbitSp;
    m.phase+=m.phaseSp;
    m.x=CX+Math.cos(m.orbitAng)*m.orbitR;
    m.y=CY+Math.sin(m.orbitAng)*m.orbitR;
    const pulse=0.3+Math.abs(Math.sin(m.phase))*0.6;
    // Only show motes in iris band
    const dist=Math.hypot(m.x-CX,m.y-CY);
    if(dist<250||dist>860) continue;
    const mg=partCtx.createRadialGradient(m.x,m.y,0,m.x,m.y,m.r*3);
    mg.addColorStop(0,`hsla(${m.hue},90%,70%,${pulse*m.a*0.9})`);
    mg.addColorStop(0.5,`hsla(${m.hue},85%,55%,${pulse*m.a*0.35})`);
    mg.addColorStop(1,'rgba(0,0,0,0)');
    partCtx.shadowBlur=6;partCtx.shadowColor=`hsla(${m.hue},100%,60%,0.6)`;
    partCtx.fillStyle=mg;
    partCtx.beginPath();partCtx.arc(m.x,m.y,m.r*3,0,Math.PI*2);partCtx.fill();
    partCtx.fillStyle=`hsla(${m.hue+10},100%,80%,${pulse*m.a})`;
    partCtx.beginPath();partCtx.arc(m.x,m.y,m.r,0,Math.PI*2);partCtx.fill();
  }
  partCtx.shadowBlur=0;partCtx.restore();

  // Vitreous shimmer — light refracting inside the eye
  partCtx.save();
  for(const s of shimmerPoints){
    s.phase+=s.sp;
    const pulse=Math.max(0,Math.sin(s.phase));
    if(pulse<0.1) continue;
    const sg=partCtx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*4);
    sg.addColorStop(0,`hsla(${s.hue},80%,85%,${pulse*0.7})`);
    sg.addColorStop(0.5,`hsla(${s.hue},75%,65%,${pulse*0.2})`);
    sg.addColorStop(1,'rgba(0,0,0,0)');
    partCtx.shadowBlur=10;partCtx.shadowColor=`hsla(${s.hue},100%,70%,0.5)`;
    partCtx.fillStyle=sg;
    partCtx.beginPath();partCtx.arc(s.x,s.y,s.r*4,0,Math.PI*2);partCtx.fill();
  }
  partCtx.shadowBlur=0;partCtx.restore();

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
