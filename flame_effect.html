<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Burn Away Effect</title>
  <script src="utils.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      width: 100vw;
      height: 100vh;
    }

    #burnCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    #imageContainer {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      height: 400px;
      z-index: 2;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    #catchImage {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: brightness(1.2) contrast(1.1);
      border-radius: 20px;
    }

    #nameOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s ease;
    }

    #winnerName {
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
      text-shadow: 
        0 0 20px currentColor,
        0 0 40px currentColor,
        0 0 60px currentColor,
        0 4px 8px rgba(0,0,0,0.8);
      animation: nameGlow 2s ease-in-out infinite alternate;
    }

    #catchLine {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      color: #fff;
      text-align: center;
      opacity: 0.9;
      text-shadow: 
        0 0 10px rgba(255,255,255,0.8),
        0 2px 4px rgba(0,0,0,0.8);
      animation: subtitlePulse 3s ease-in-out infinite;
    }

    @keyframes nameGlow {
      0% { 
        filter: brightness(1) drop-shadow(0 0 10px currentColor);
        transform: scale(1);
      }
      100% { 
        filter: brightness(1.3) drop-shadow(0 0 25px currentColor);
        transform: scale(1.02);
      }
    }

    @keyframes subtitlePulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; }
    }

    /* Donation Tier Styles */
    .catcher-name {
      display: inline-block;
      font-weight: bold;
      background-size: 200% auto;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 3s linear infinite;
    }

    .king {
      background-image: linear-gradient(90deg, #ffd700, #fff200, #ffd700);
      color: #ffd700;
    }
    
    .flame {
      background-image: linear-gradient(90deg, #ff4500, #ff8c00, #ff4500);
      color: #ff4500;
    }
    
    .diamond {
      background-image: linear-gradient(90deg, #00bfff, #87ceeb, #00bfff);
      color: #00bfff;
    }
    
    .shine {
      background-image: linear-gradient(90deg, #32cd32, #90ee90, #32cd32);
      color: #32cd32;
    }
    
    .normal {
      color: #fff;
      background: none;
      -webkit-text-fill-color: inherit;
      background-clip: unset;
      animation: nameGlow 2s ease-in-out infinite alternate;
    }

    @keyframes shine {
      to { background-position: -200% center; }
    }

    /* Particle Effects */
    .particle {
      position: fixed;
      width: 4px;
      height: 4px;
      background: #ff6600;
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      box-shadow: 0 0 6px currentColor;
    }

    .particle.active {
      animation: particleFloat 3s ease-out forwards;
    }

    @keyframes particleFloat {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-200px) scale(0.3);
      }
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      #imageContainer {
        width: 300px;
        height: 300px;
      }

      #winnerName {
        font-size: clamp(2rem, 12vw, 4rem);
      }

      #catchLine {
        font-size: clamp(1rem, 6vw, 1.8rem);
      }
    }
  </style>
</head>
<body>
  <canvas id="burnCanvas"></canvas>
  
  <div id="imageContainer">
    <img id="catchImage" src="" alt="Catchmon">
  </div>

  <div id="nameOverlay">
    <div id="winnerName"></div>
    <div id="catchLine"></div>
  </div>

  <audio id="burnSound" src="sounds/fire.mp3" preload="auto"></audio>

  <script>
    const canvas = document.getElementById('burnCanvas');
    const ctx = canvas.getContext('2d');
    const imageContainer = document.getElementById('imageContainer');
    const catchImage = document.getElementById('catchImage');
    const nameOverlay = document.getElementById('nameOverlay');
    const winnerName = document.getElementById('winnerName');
    const catchLine = document.getElementById('catchLine');

    // Canvas Setup
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Burn Effect Variables
    let burnParticles = [];
    let burnProgress = 0;
    let imageData = null;
    let originalImageData = null;
    let burnStarted = false;

    // Load spawn data and setup
    fetch("spawn_data.json?" + Date.now())
      .then(res => res.json())
      .then(data => {
        const styledName = getStyledCatcherName(data.winner || "???", data.donation || 0);
        const tier = getDonationTier(data.donation || 0);
        
        winnerName.innerHTML = styledName;
        winnerName.className = `catcher-name ${tier}`;
        catchLine.textContent = `caught ${data.name || "???"}!`;
        
        // Load the catchmon image
        if (data.sprite) {
          catchImage.src = data.sprite;
          catchImage.onload = () => {
            setTimeout(startBurnEffect, 1000);
          };
        }
      })
      .catch(err => {
        console.error("Error loading spawn data:", err);
        startBurnEffect();
      });

    // Sound Effect
    window.addEventListener("DOMContentLoaded", () => {
      const burnAudio = document.getElementById("burnSound");
      if (burnAudio) {
        burnAudio.volume = 0.4;
        burnAudio.play().catch(() => {
          console.log("Autoplay blocked");
        });
      }
    });

    // Burn Particle Class
    class BurnParticle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 4;
        this.vy = -Math.random() * 3 - 1;
        this.life = 1.0;
        this.decay = Math.random() * 0.02 + 0.01;
        this.size = Math.random() * 8 + 4;
        this.color = this.getRandomFireColor();
      }

      getRandomFireColor() {
        const colors = [
          'rgba(255, 100, 0, ',
          'rgba(255, 150, 0, ',
          'rgba(255, 200, 0, ',
          'rgba(255, 50, 0, ',
          'rgba(200, 0, 0, '
        ];
        return colors[Math.floor(Math.random() * colors.length)];
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.1; // gravity
        this.life -= this.decay;
        this.size *= 0.98;
        return this.life > 0;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color + this.life + ')';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        
        // Add glow effect
        ctx.shadowColor = this.color + '0.8)';
        ctx.shadowBlur = this.size * 2;
        ctx.fill();
        ctx.restore();
      }
    }

    function createBurnParticles() {
      const rect = imageContainer.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      
      // Create particles around the image edges
      for (let i = 0; i < 15; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = (rect.width / 2) * (0.8 + Math.random() * 0.4);
        const x = centerX + Math.cos(angle) * radius;
        const y = centerY + Math.sin(angle) * radius;
        
        burnParticles.push(new BurnParticle(x, y));
      }
    }

    function updateBurnEffect() {
      // Update particles
      burnParticles = burnParticles.filter(particle => {
        particle.update();
        return particle.life > 0;
      });

      // Create new particles
      if (burnProgress < 1 && Math.random() < 0.7) {
        createBurnParticles();
      }

      // Update burn progress
      if (burnStarted) {
        burnProgress += 0.008;
        
        // Fade out image as it burns
        if (burnProgress > 0.3) {
          const fadeAmount = Math.min(1, (burnProgress - 0.3) / 0.4);
          imageContainer.style.opacity = 1 - fadeAmount;
        }

        // Show name overlay when image is mostly burned
        if (burnProgress > 0.7) {
          nameOverlay.style.opacity = Math.min(1, (burnProgress - 0.7) / 0.3);
        }
      }
    }

    function drawBurnEffect() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Draw burn particles
      burnParticles.forEach(particle => particle.draw());
      
      // Add screen burn effect
      if (burnProgress > 0.4) {
        const burnIntensity = Math.min(1, (burnProgress - 0.4) / 0.3);
        ctx.fillStyle = `rgba(255, 100, 0, ${burnIntensity * 0.1})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    function startBurnEffect() {
      burnStarted = true;
      
      // Create initial burst of particles
      for (let i = 0; i < 30; i++) {
        setTimeout(() => createBurnParticles(), i * 50);
      }
    }

    function animate() {
      updateBurnEffect();
      drawBurnEffect();
      requestAnimationFrame(animate);
    }

    // Start animation
    animate();

    // Cleanup after effect
    setTimeout(() => {
      canvas.remove();
      imageContainer.remove();
      nameOverlay.remove();
    }, 8000);
  </script>
</body>
</html>
