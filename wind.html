<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Wind — Hochgebirge Windauge</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:1080px;height:1920px;overflow:hidden;
    background:radial-gradient(ellipse 100% 70% at 50% 0%, #4ac8f0 0%, #1a8fd4 30%, #0d5a9a 65%, #082244 100%);
  }
  canvas{position:absolute;inset:0;width:1080px;height:1920px;display:block;}

  /* Deep sky gradient */
  .sky{
    position:absolute;inset:0;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%,  rgba(180,240,255,0.35) 0%, transparent 55%),
      radial-gradient(ellipse 60% 40% at 15% 20%, rgba(100,200,255,0.18) 0%, transparent 50%),
      radial-gradient(ellipse 55% 38% at 88% 25%, rgba(80,190,250,0.15) 0%, transparent 48%),
      linear-gradient(180deg, #5ad0f5 0%, #2299e0 18%, #0e6ab8 45%, #093570 80%, #041828 100%);
  }

  /* Atmospheric haze — light scattering at horizon */
  .haze{
    position:absolute;bottom:0;left:0;right:0;height:500px;
    background:linear-gradient(0deg,
      rgba(180,235,255,0.22) 0%,
      rgba(140,210,250,0.12) 30%,
      rgba(100,190,240,0.06) 60%,
      transparent 100%);
    filter:blur(4px);
  }

  /* Mountain silhouettes */
  .mtn{position:absolute;bottom:0;left:0;right:0;}
  .m1{
    height:680px;background:#0a2040;
    clip-path:polygon(0 100%,0 55%,4% 40%,9% 55%,14% 32%,19% 50%,24% 22%,29% 44%,34% 14%,39% 38%,44% 8%,49% 35%,54% 10%,59% 38%,64% 18%,69% 42%,74% 28%,79% 50%,84% 35%,89% 55%,94% 42%,100% 58%,100% 100%);
  }
  .m2{
    height:520px;background:#0c2848;
    clip-path:polygon(0 100%,0 62%,5% 48%,11% 62%,17% 38%,23% 56%,29% 30%,35% 50%,41% 22%,47% 45%,53% 16%,59% 42%,65% 25%,71% 48%,77% 36%,83% 54%,89% 44%,95% 60%,100% 52%,100% 100%);
  }
  .m3{
    height:380px;background:#0e3058;
    clip-path:polygon(0 100%,0 70%,6% 55%,13% 72%,20% 45%,28% 65%,36% 38%,44% 60%,52% 28%,60% 55%,68% 38%,76% 62%,84% 48%,92% 68%,100% 58%,100% 100%);
  }
  /* Snow caps */
  .snow{position:absolute;bottom:0;left:0;right:0;}
  .sn1{height:200px;background:rgba(220,240,255,0.12);filter:blur(3px);
    clip-path:polygon(24% 100%,29% 40%,34% 100%,44% 5%,49% 100%,54% 8%,59% 100%);}
  .sn2{height:160px;background:rgba(200,230,255,0.08);filter:blur(2px);
    clip-path:polygon(17% 100%,23% 38%,29% 100%,41% 18%,47% 100%,53% 14%,59% 100%);}

  /* Foreground — alpine meadow at bottom */
  .meadow{
    position:absolute;bottom:0;left:0;right:0;height:480px;
    background:
      radial-gradient(ellipse 100% 55% at 50% 100%, #0a2810 0%, #062010 25%, #04180a 55%, transparent 75%),
      linear-gradient(0deg, #061a08 0%, #0c2a12 30%, transparent 100%);
  }
  /* Grass silhouettes at very bottom */
  .grass{
    position:absolute;bottom:0;left:0;right:0;height:140px;
    background:#04120608;
    clip-path:polygon(
      0 100%,0 65%,1% 40%,2% 65%,3% 30%,4% 55%,5% 20%,6% 50%,7% 35%,8% 60%,
      9% 25%,10% 55%,11% 38%,12% 62%,13% 28%,14% 50%,15% 18%,16% 45%,17% 32%,18% 55%,
      20% 22%,22% 50%,24% 30%,26% 58%,28% 20%,30% 48%,32% 35%,34% 60%,36% 24%,38% 52%,
      40% 18%,42% 46%,44% 30%,46% 55%,48% 22%,50% 50%,52% 35%,54% 60%,56% 25%,58% 52%,
      60% 18%,62% 48%,64% 32%,66% 56%,68% 22%,70% 50%,72% 36%,74% 62%,76% 28%,78% 54%,
      80% 20%,82% 48%,84% 34%,86% 58%,88% 24%,90% 52%,92% 38%,94% 62%,96% 30%,98% 55%,
      100% 40%,100% 100%);
    animation:grassSway 3s ease-in-out infinite;
  }
  @keyframes grassSway{
    0%,100%{transform:skewX(0deg)}
    50%{transform:skewX(2.5deg) translateX(4px)}
  }

  /* Wind streaks background texture */
  .wind-bg{
    position:absolute;top:100px;left:0;right:0;height:1200px;
    background:
      repeating-linear-gradient(175deg,
        transparent 0px, transparent 55px,
        rgba(180,230,255,0.025) 55px, rgba(180,230,255,0.025) 57px),
      repeating-linear-gradient(172deg,
        transparent 0px, transparent 85px,
        rgba(160,215,250,0.02) 85px, rgba(160,215,250,0.02) 87px);
    animation:windBgMove 4s linear infinite;
  }
  @keyframes windBgMove{0%{transform:translateX(0)}100%{transform:translateX(-30px)}}

  /* Ring — eye of the storm */
  .ring-calm{
    position:absolute;top:215px;left:50%;transform:translateX(-50%);
    width:820px;height:820px;border-radius:50%;
    background:radial-gradient(ellipse 100% 100% at 50% 50%,
      rgba(180,240,255,0.12) 0%,
      rgba(100,200,240,0.06) 48%,
      transparent 68%);
    mix-blend-mode:screen;filter:blur(18px);
    animation:calmPulse 5s ease-in-out infinite;
  }
  @keyframes calmPulse{0%,100%{opacity:0.65;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.02)}}

  /* UI */
  .center-darken{position:absolute;top:300px;left:50%;transform:translateX(-50%);width:780px;height:540px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(0,8,20,0.38) 0%,transparent 70%);z-index:38;}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse 82% 72% at 50% 50%,transparent 36%,rgba(0,5,15,0.72) 100%);z-index:39;pointer-events:none;}
  .zone-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(0,0,0,0.45) 0%,transparent 100%);z-index:40;}
  .zone-bot{position:absolute;bottom:0;left:0;right:0;height:920px;background:linear-gradient(0deg,rgba(0,5,10,0.65) 0%,rgba(0,5,10,0.14) 40%,transparent 100%);z-index:40;}
</style>
</head>
<body>
  <div class="sky"></div>
  <div class="wind-bg"></div>
  <div class="haze"></div>

  <!-- Canvas stack -->
  <canvas id="cClouds"></canvas>
  <canvas id="cRing"></canvas>
  <canvas id="cBirds"></canvas>
  <canvas id="cParticles"></canvas>

  <div class="mtn"><div class="m1"></div><div class="m2"></div><div class="m3"></div></div>
  <div class="snow"><div class="sn1"></div><div class="sn2"></div></div>
  <div class="meadow"></div>
  <div class="grass"></div>
  <div class="ring-calm"></div>
  <div class="center-darken"></div>
  <div class="vignette"></div>
  <div class="zone-top"></div>
  <div class="zone-bot"></div>

<script>
const W=1080, H=1920;
const RING_CX=540, RING_CY=590, RING_R=300;

function mkCanvas(id){
  const c=document.getElementById(id);
  c.width=W; c.height=H;
  return c.getContext('2d');
}
const cloudCtx = mkCanvas('cClouds');
const ringCtx  = mkCanvas('cRing');
const birdsCtx = mkCanvas('cBirds');
const partCtx  = mkCanvas('cParticles');

/* ═══════════════════════════════════════════════════════════════════════════
   CLOUDS — fast-moving storm clouds + high cirrus
   ═══════════════════════════════════════════════════════════════════════════ */
// Main storm cloud puffs — racing with the wind
const stormClouds=[];
for(let i=0;i<32;i++){
  stormClouds.push(mkStormCloud(true));
}
function mkStormCloud(init){
  const y=init?120+Math.random()*900:120+Math.random()*700;
  return{
    x:init?(Math.random()*W*1.6-W*0.3):-W*0.4-Math.random()*400,
    y,
    rx:80+Math.random()*220,
    ry:35+Math.random()*65,
    vx:2+Math.random()*3.5, // fast! these are storm clouds
    a:0.18+Math.random()*0.32,
    phase:Math.random()*Math.PI*2,
    // darker higher up, whiter lower
    bright:y<400?0.55+Math.random()*0.2:0.75+Math.random()*0.2,
    fluffy:Math.random()<0.5,
  };
}

// Cirrus — thin wispy high-altitude streaks
const cirrusClouds=[];
for(let i=0;i<20;i++){
  cirrusClouds.push(mkCirrus(true));
}
function mkCirrus(init){
  return{
    x:init?(Math.random()*W*1.8-W*0.4):-300-Math.random()*200,
    y:80+Math.random()*380,
    len:120+Math.random()*280,
    h:4+Math.random()*10,
    vx:3+Math.random()*4,
    a:0.06+Math.random()*0.1,
    curl:(Math.random()-0.5)*0.15,
  };
}

/* ═══════════════════════════════════════════════════════════════════════════
   RING: Wind vortex — eye of the storm
   ═══════════════════════════════════════════════════════════════════════════ */
// Spiral wind arms
const WIND_ARMS=6;
let windRot=0;

// Cloud shreds flying through ring
const ringShreds=[];
for(let i=0;i<16;i++) ringShreds.push(mkShred());
function mkShred(){
  const side=Math.random()<0.5?-1:1;
  return{
    x:RING_CX+side*(RING_R*0.9+Math.random()*RING_R*0.5),
    y:RING_CY+(Math.random()-0.5)*RING_R*1.2,
    vx:side>0?-(3+Math.random()*3):(3+Math.random()*3),
    vy:(Math.random()-0.5)*1.5,
    life:Math.random(),
    lifeSpd:0.01+Math.random()*0.015,
    w:25+Math.random()*55,
    h:6+Math.random()*12,
    rot:(Math.random()-0.5)*0.5,
    a:0.2+Math.random()*0.25,
  };
}

// Wind orbit particles — debris caught in the eye
const ORBIT_COUNT=35;
const orbitParticles=[];
for(let i=0;i<ORBIT_COUNT;i++){
  const ang=(i/ORBIT_COUNT)*Math.PI*2;
  orbitParticles.push({
    ang,
    r:RING_R*0.4+Math.random()*RING_R*0.9,
    speed:(0.02+Math.random()*0.025)*(Math.random()<0.5?1:-1),
    phase:Math.random()*Math.PI*2,
    phaseSp:0.04+Math.random()*0.06,
    size:1+Math.random()*3,
    a:0.25+Math.random()*0.45,
    type:Math.random()<0.4?'leaf':'droplet',
    hue:Math.random()<0.5?160+Math.random()*30:200+Math.random()*30,
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   BIRDS — V-formations of geese/migrating birds
   ═══════════════════════════════════════════════════════════════════════════ */
const formations=[];
for(let i=0;i<4;i++){
  const scale=0.35+Math.random()*0.55;
  const vCount=5+Math.floor(Math.random()*6);
  formations.push({
    x:Math.random()<0.5?-80:W+80,
    y:180+Math.random()*600,
    vx:Math.random()<0.5?(1.2+Math.random()*0.8):-(1.2+Math.random()*0.8),
    vy:(Math.random()-0.5)*0.3,
    scale,
    flapPhase:Math.random()*Math.PI*2,
    flapSp:0.06+Math.random()*0.04,
    vCount,
    wobble:Math.random()*Math.PI*2,
    wobbleSp:0.015+Math.random()*0.02,
  });
}

function drawBirdV(ctx,fx,fy,flapAngle,scale,vCount,dir){
  const spacing=28*scale;
  for(let vi=0;vi<vCount;vi++){
    const side=vi%2===0?-1:1;
    const pos=Math.ceil(vi/2);
    const bx=fx+side*pos*spacing*0.85*dir;
    const by=fy+pos*spacing*0.5;
    // Simple bird — M shape
    const flap=flapAngle+(vi*0.3);
    const wingOpen=(Math.cos(flap)+1)*0.5;
    const s=9*scale;
    ctx.save();
    ctx.translate(bx,by);
    ctx.scale(dir,1);
    ctx.fillStyle=`rgba(5,15,35,${0.7+scale*0.2})`;
    ctx.shadowBlur=scale*6;
    ctx.shadowColor='rgba(100,200,255,0.2)';
    // Body
    ctx.beginPath();
    ctx.ellipse(0,0,s*0.55,s*0.18,0,0,Math.PI*2);
    ctx.fill();
    // Wings — classic bird M
    ctx.beginPath();
    ctx.moveTo(-s*0.1,0);
    ctx.bezierCurveTo(-s*0.4,-(s*0.45*wingOpen),-s*0.85,-(s*0.5*wingOpen),-s*1.0,0);
    ctx.bezierCurveTo(-s*0.85,s*0.15*wingOpen,-s*0.4,s*0.1*wingOpen,-s*0.1,0);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(s*0.1,0);
    ctx.bezierCurveTo(s*0.4,-(s*0.42*wingOpen),s*0.82,-(s*0.48*wingOpen),s*0.95,0);
    ctx.bezierCurveTo(s*0.82,s*0.14*wingOpen,s*0.4,s*0.1*wingOpen,s*0.1,0);
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.restore();
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   PARTICLES: Wind streaks, rain/mist droplets, leaves, updraft
   ═══════════════════════════════════════════════════════════════════════════ */
// Wind streaks — fast horizontal
const windStreaks=[];
for(let i=0;i<22;i++) windStreaks.push(mkStreak(true));
function mkStreak(init){
  return{
    x:init?(Math.random()*W*1.4-W*0.2):-200-Math.random()*300,
    y:init?80+Math.random()*H*0.65:100+Math.random()*800,
    vx:5+Math.random()*7,
    vy:(Math.random()-0.5)*0.3,
    len:40+Math.random()*130,
    a:0.07+Math.random()*0.14,
    w:0.6+Math.random()*1.2,
    hue:195+Math.random()*25,
  };
}

// Rain-mist particles — blown horizontal
const mistDrops=[];
for(let i=0;i<70;i++){
  mistDrops.push({
    x:Math.random()*W,
    y:Math.random()*H*0.75,
    vx:4+Math.random()*5,
    vy:0.8+Math.random()*1.5,
    len:8+Math.random()*18,
    a:0.08+Math.random()*0.14,
  });
}

// Leaves/debris caught in wind
const leaves=[];
for(let i=0;i<20;i++){
  leaves.push(mkLeaf(true));
}
function mkLeaf(init){
  return{
    x:init?(Math.random()*W):(-30),
    y:init?(600+Math.random()*H*0.4):(800+Math.random()*500),
    vx:2+Math.random()*4,
    vy:(Math.random()-0.5)*1.5-0.5,
    rot:Math.random()*Math.PI*2,
    rotV:0.05+Math.random()*0.12,
    size:5+Math.random()*9,
    a:0.45+Math.random()*0.4,
    sway:Math.random()*Math.PI*2,
    swaySp:0.04+Math.random()*0.06,
    hue:105+Math.random()*40,
  };
}

/* ═══════════════════════════════════════════════════════════════════════════
   MAIN LOOP
   ═══════════════════════════════════════════════════════════════════════════ */
let t=0;

function loop(){
  t+=0.016;

  /* ── CLOUDS ── */
  cloudCtx.clearRect(0,0,W,H);

  // Cirrus first (behind)
  cloudCtx.save();
  for(let i=0;i<cirrusClouds.length;i++){
    const c=cirrusClouds[i];
    c.x+=c.vx;
    c.curl+=(Math.random()-0.5)*0.003;
    if(c.x>W+400) cirrusClouds[i]=mkCirrus(false);
    // Draw as a tapered streak
    const g=cloudCtx.createLinearGradient(c.x,c.y,c.x+c.len,c.y);
    g.addColorStop(0,'rgba(255,255,255,0)');
    g.addColorStop(0.3,`rgba(220,240,255,${c.a})`);
    g.addColorStop(0.7,`rgba(200,230,255,${c.a*0.6})`);
    g.addColorStop(1,'rgba(255,255,255,0)');
    cloudCtx.strokeStyle=g;
    cloudCtx.lineWidth=c.h;
    cloudCtx.lineCap='round';
    cloudCtx.beginPath();
    cloudCtx.moveTo(c.x,c.y);
    cloudCtx.quadraticCurveTo(c.x+c.len*0.5,c.y+c.curl*c.len,c.x+c.len,c.y);
    cloudCtx.stroke();
  }
  cloudCtx.restore();

  // Storm clouds
  cloudCtx.globalCompositeOperation='source-over';
  for(let i=0;i<stormClouds.length;i++){
    const c=stormClouds[i];
    c.x+=c.vx; c.phase+=0.006;
    if(c.x>W+400) stormClouds[i]=mkStormCloud(false);
    const pulse=0.92+Math.sin(c.phase)*0.08;
    const lightness=Math.floor(c.bright*100);
    const col=`hsla(205,45%,${lightness}%,${c.a*pulse})`;
    const g=cloudCtx.createRadialGradient(c.x,c.y,0,c.x,c.y,c.rx);
    g.addColorStop(0,col);
    g.addColorStop(0.5,`hsla(205,35%,${lightness-10}%,${c.a*pulse*0.55})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    cloudCtx.save();
    cloudCtx.scale(1,c.ry/c.rx);
    cloudCtx.fillStyle=g;
    if(c.fluffy){cloudCtx.shadowBlur=20;cloudCtx.shadowColor=`rgba(200,230,255,${c.a*0.4})`;}
    cloudCtx.beginPath();cloudCtx.arc(c.x,c.y*(c.rx/c.ry),c.rx,0,Math.PI*2);cloudCtx.fill();
    cloudCtx.shadowBlur=0;
    cloudCtx.restore();
  }

  /* ── RING: Eye of the storm ── */
  ringCtx.clearRect(0,0,W,H);
  windRot+=0.015;

  // Calm eye glow — clear blue
  const eyePulse=0.5+Math.sin(t*1.4)*0.3;
  const eg=ringCtx.createRadialGradient(RING_CX,RING_CY,RING_R*0.2,RING_CX,RING_CY,RING_R+200);
  eg.addColorStop(0,`rgba(100,220,255,${0.18*eyePulse})`);
  eg.addColorStop(0.38,`rgba(60,180,240,${0.08*eyePulse})`);
  eg.addColorStop(1,'rgba(0,0,0,0)');
  ringCtx.fillStyle=eg;ringCtx.beginPath();ringCtx.arc(RING_CX,RING_CY,RING_R+200,0,Math.PI*2);ringCtx.fill();

  // Wind spiral arms — curving inward
  ringCtx.save();
  ringCtx.translate(RING_CX,RING_CY);
  for(let arm=0;arm<WIND_ARMS;arm++){
    const armOff=(arm/WIND_ARMS)*Math.PI*2;
    const hue=190+arm*5;
    const alpha=0.18+Math.sin(t*1.1+arm*0.9)*0.1;
    ringCtx.strokeStyle=`hsla(${hue},80%,75%,${alpha})`;
    ringCtx.lineWidth=1.5-arm*0.05;
    ringCtx.shadowBlur=8;ringCtx.shadowColor=`rgba(100,210,255,0.4)`;
    ringCtx.lineCap='round';
    ringCtx.beginPath();
    for(let i=0;i<70;i++){
      const angle=windRot+armOff+i*0.11;
      const r=6+i*5.2;
      if(r>RING_R+165) break;
      const x=Math.cos(angle)*r, y=Math.sin(angle)*r;
      i===0?ringCtx.moveTo(x,y):ringCtx.lineTo(x,y);
    }
    ringCtx.stroke();
  }
  ringCtx.restore();ringCtx.shadowBlur=0;

  // Cloud shreds flying through
  for(let i=0;i<ringShreds.length;i++){
    const s=ringShreds[i];
    s.life+=s.lifeSpd; s.x+=s.vx; s.y+=s.vy;
    if(s.life>=1) ringShreds[i]=mkShred();
    const fade=Math.sin(s.life*Math.PI);
    ringCtx.save();
    ringCtx.translate(s.x,s.y);ringCtx.rotate(s.rot);
    const sg=ringCtx.createRadialGradient(0,0,0,0,0,s.w);
    sg.addColorStop(0,`rgba(220,240,255,${s.a*fade})`);
    sg.addColorStop(0.5,`rgba(180,220,250,${s.a*fade*0.4})`);
    sg.addColorStop(1,'rgba(0,0,0,0)');
    ringCtx.scale(1,s.h/s.w);
    ringCtx.fillStyle=sg;
    ringCtx.beginPath();ringCtx.arc(0,0,s.w,0,Math.PI*2);ringCtx.fill();
    ringCtx.restore();
  }

  // Orbital debris — caught in the vortex
  for(const op of orbitParticles){
    op.ang+=op.speed;
    op.phase+=op.phaseSp;
    // Slightly pulsing orbit radius — breathing vortex
    const r=op.r+Math.sin(op.phase*0.5)*15;
    const px=RING_CX+Math.cos(op.ang)*r;
    const py=RING_CY+Math.sin(op.ang)*r;
    const pulse=0.4+Math.abs(Math.sin(op.phase))*0.5;

    if(op.type==='leaf'){
      // Small leaf shape
      ringCtx.save();
      ringCtx.translate(px,py);ringCtx.rotate(op.ang+Math.PI/2);
      ringCtx.fillStyle=`hsla(${op.hue},65%,45%,${op.a*pulse})`;
      ringCtx.beginPath();
      ringCtx.ellipse(0,0,op.size,op.size*0.45,0,0,Math.PI*2);
      ringCtx.fill();
      ringCtx.restore();
    } else {
      // Water droplet
      const dg=ringCtx.createRadialGradient(px,py,0,px,py,op.size*2.5);
      dg.addColorStop(0,`hsla(${op.hue},85%,78%,${op.a*pulse*0.9})`);
      dg.addColorStop(0.5,`hsla(${op.hue},80%,60%,${op.a*pulse*0.3})`);
      dg.addColorStop(1,'rgba(0,0,0,0)');
      ringCtx.fillStyle=dg;
      ringCtx.shadowBlur=5;ringCtx.shadowColor=`hsla(${op.hue},100%,70%,0.5)`;
      ringCtx.beginPath();ringCtx.arc(px,py,op.size*2.5,0,Math.PI*2);ringCtx.fill();
      ringCtx.shadowBlur=0;
    }
  }

  /* ── BIRDS ── */
  birdsCtx.clearRect(0,0,W,H);
  for(const f of formations){
    f.flapPhase+=f.flapSp;
    f.wobble+=f.wobbleSp;
    f.x+=f.vx;
    f.y+=f.vy+Math.sin(f.wobble)*0.3;
    if(f.x>W+200||f.x<-200){
      f.x=f.vx>0?-80:W+80;
      f.y=180+Math.random()*600;
    }
    const flapAngle=Math.sin(f.flapPhase);
    const dir=f.vx>0?1:-1;
    drawBirdV(birdsCtx,f.x,f.y,flapAngle,f.scale,f.vCount,dir);
  }

  /* ── PARTICLES ── */
  partCtx.clearRect(0,0,W,H);

  // Wind streaks
  partCtx.save();
  for(let i=0;i<windStreaks.length;i++){
    const s=windStreaks[i];
    s.x+=s.vx; s.y+=s.vy;
    if(s.x>W+250) windStreaks[i]=mkStreak(false);
    const tx=s.x-s.len;
    const sg=partCtx.createLinearGradient(tx,s.y,s.x,s.y);
    sg.addColorStop(0,'rgba(180,230,255,0)');
    sg.addColorStop(0.4,`hsla(${s.hue},75%,82%,${s.a})`);
    sg.addColorStop(0.75,`hsla(${s.hue},70%,78%,${s.a*0.5})`);
    sg.addColorStop(1,'rgba(180,230,255,0)');
    partCtx.strokeStyle=sg;
    partCtx.lineWidth=s.w;
    partCtx.lineCap='round';
    partCtx.beginPath();partCtx.moveTo(tx,s.y);partCtx.lineTo(s.x,s.y);partCtx.stroke();
  }
  partCtx.restore();

  // Mist/rain droplets blown horizontal
  partCtx.save();
  for(const d of mistDrops){
    d.x+=d.vx; d.y+=d.vy;
    if(d.x>W+30){d.x=-30;d.y=Math.random()*H*0.75;}
    if(d.y>H*0.8){d.y=100+Math.random()*200;d.x=Math.random()*W;}
    const dg=partCtx.createLinearGradient(d.x,d.y,d.x-d.len,d.y-d.vy*(d.len/d.vx));
    dg.addColorStop(0,'rgba(200,230,255,0)');
    dg.addColorStop(0.5,`rgba(180,220,250,${d.a})`);
    dg.addColorStop(1,'rgba(200,230,255,0)');
    partCtx.strokeStyle=dg;
    partCtx.lineWidth=0.7;
    partCtx.beginPath();
    partCtx.moveTo(d.x,d.y);
    partCtx.lineTo(d.x-d.len*0.8,d.y-d.vy*(d.len*0.8/d.vx));
    partCtx.stroke();
  }
  partCtx.restore();

  // Leaves tumbling in the wind
  partCtx.save();
  for(let i=0;i<leaves.length;i++){
    const l=leaves[i];
    l.sway+=l.swaySp; l.rot+=l.rotV;
    l.x+=l.vx+Math.sin(l.sway)*1.2;
    l.y+=l.vy+Math.cos(l.sway*0.7)*0.6;
    if(l.x>W+40) leaves[i]=mkLeaf(false);
    if(l.y<200||l.y>H-200){l.vy*=-0.7;}
    partCtx.save();
    partCtx.translate(l.x,l.y);partCtx.rotate(l.rot);
    partCtx.fillStyle=`hsla(${l.hue},60%,38%,${l.a})`;
    partCtx.shadowBlur=3;partCtx.shadowColor=`hsla(${l.hue},70%,50%,0.4)`;
    partCtx.beginPath();
    // Leaf shape
    partCtx.moveTo(0,-l.size);
    partCtx.bezierCurveTo(l.size*0.6,-l.size*0.4,l.size*0.6,l.size*0.4,0,l.size);
    partCtx.bezierCurveTo(-l.size*0.6,l.size*0.4,-l.size*0.6,-l.size*0.4,0,-l.size);
    partCtx.fill();
    // Midrib
    partCtx.strokeStyle=`hsla(${l.hue+10},55%,50%,${l.a*0.6})`;
    partCtx.lineWidth=0.8;
    partCtx.beginPath();partCtx.moveTo(0,-l.size);partCtx.lineTo(0,l.size);partCtx.stroke();
    partCtx.shadowBlur=0;
    partCtx.restore();
  }
  partCtx.restore();

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
