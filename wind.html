<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<title>Wind — Das Unsichtbare</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:1080px;height:1920px;
  overflow:hidden;
  background:#000;
  position:relative;
}
canvas{
  position:absolute;top:0;left:0;
  width:1080px;height:1920px;
  pointer-events:none;
}
#zone-top{
  position:absolute;top:0;left:0;width:1080px;height:120px;
  background:linear-gradient(to bottom,rgba(0,0,0,0.55) 0%,transparent 100%);
  z-index:50;pointer-events:none;
}
#zone-bot{
  position:absolute;bottom:0;left:0;width:1080px;height:920px;
  background:linear-gradient(to top,rgba(0,0,0,0.50) 0%,transparent 100%);
  z-index:50;pointer-events:none;
}
#vignette{
  position:absolute;top:0;left:0;width:1080px;height:1920px;
  background:radial-gradient(ellipse 90% 90% at 50% 50%,transparent 30%,rgba(0,0,0,0.65) 100%);
  z-index:49;pointer-events:none;
}
#center-darken{
  position:absolute;left:150px;top:300px;width:780px;height:540px;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0.32) 0%,transparent 70%);
  z-index:48;pointer-events:none;
}
</style>
</head>
<body>

<canvas id="cvSky"     style="z-index:1"></canvas>
<canvas id="cvTerrain" style="z-index:2"></canvas>
<canvas id="cvBending" style="z-index:3"></canvas>
<canvas id="cvStreams"  style="z-index:4"></canvas>
<canvas id="cvVortex"  style="z-index:5"></canvas>
<canvas id="cvCarried" style="z-index:6"></canvas>

<div id="zone-top"></div>
<div id="zone-bot"></div>
<div id="vignette"></div>
<div id="center-darken"></div>

<script>
'use strict';
const W=1080, H=1920, CX=540, CY=590, RING_R=300;

['cvSky','cvTerrain','cvBending','cvStreams','cvVortex','cvCarried'].forEach(id=>{
  const c=document.getElementById(id); c.width=W; c.height=H;
});
const gc=id=>document.getElementById(id).getContext('2d');
const ctxSky    =gc('cvSky');
const ctxTerrain=gc('cvTerrain');
const ctxBending=gc('cvBending');
const ctxStreams =gc('cvStreams');
const ctxVortex =gc('cvVortex');
const ctxCarried=gc('cvCarried');

document.getElementById('cvTerrain').style.mixBlendMode='screen';
document.getElementById('cvBending').style.mixBlendMode='screen';
document.getElementById('cvStreams').style.mixBlendMode ='screen';
document.getElementById('cvVortex').style.mixBlendMode  ='screen';
document.getElementById('cvCarried').style.mixBlendMode ='screen';

let t=0, last=performance.now();
const rng=(a,b)=>a+(b-a)*Math.random();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,x)=>a+(b-a)*x;
const eio=(x)=>x<.5?2*x*x:1-(-2*x+2)**2/2;
const hash=(n)=>{ let x=Math.sin(n)*43758.5453; return x-Math.floor(x); };

// Wind global state — strength pulses, direction stays mostly right-to-left
// windStr: 0=calm, 1=max gust
let windStr=0.5;
let windTarget=0.5;
let windChangeTimer=rng(3,8);

function tickWind(dt){
  windChangeTimer-=dt;
  if(windChangeTimer<=0){
    windTarget=rng(0.15,1.0);
    windChangeTimer=rng(2,7);
  }
  windStr+=(windTarget-windStr)*dt*0.8;
}

// Horizon / terrain reference
const HORIZON_Y = H*0.52;  // mountain ridge at this y

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 1 — SKY: dramatischer Himmel, rasende Wolken, Jetstream-Feeling
// ─────────────────────────────────────────────────────────────────────────────

// Fast-moving cloud layers — multiple speeds, wind-shredded edges
const CLOUD_LAYERS=[
  // High altitude — very fast, thin, wispy
  {y:H*0.05, count:6, speed:2.2, ry:28, lig:72, alpha:0.14, hue:210},
  {y:H*0.12, count:5, speed:1.8, ry:22, lig:68, alpha:0.12, hue:215},
  // Mid clouds — moderate speed, thicker
  {y:H*0.22, count:4, speed:1.1, ry:55, lig:62, alpha:0.18, hue:205},
  {y:H*0.30, count:5, speed:0.9, ry:70, lig:58, alpha:0.22, hue:208},
  // Low storm clouds — slower but massive, dark
  {y:H*0.40, count:3, speed:0.55, ry:130, lig:38, alpha:0.28, hue:205},
  {y:H*0.46, count:4, speed:0.45, ry:110, lig:32, alpha:0.32, hue:210},
];

const CLOUDS=CLOUD_LAYERS.flatMap(layer=>
  Array.from({length:layer.count},(_,i)=>({
    x: rng(-300,W+300),
    layer,
    phase: rng(0,Math.PI*2),
    rx: rng(180,520),
    subBlobs: Array.from({length:Math.floor(rng(3,8))},(_,j)=>({
      ox:rng(-200,200), oy:rng(-40,30), r:rng(0.35,0.75)
    })),
  }))
);

// Wispy high-altitude streaks — Jetstream visible in cloud shredding
const JET_STREAKS=Array.from({length:22},(_,i)=>({
  y: rng(0, H*0.35),
  x: rng(-200,W+200),
  len: rng(200,600),
  speed: rng(2.5,5.0),
  phase: rng(0,Math.PI*2),
  alpha: rng(0.05,0.12),
  thickness: rng(0.8,3),
  hue: rng(200,220),
}));

function drawSky(){
  const c=ctxSky;
  c.clearRect(0,0,W,H);

  // Stormy sky gradient — grey-blue, dramatic
  const bg=c.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,   '#060a12');
  bg.addColorStop(0.12,'#080f1a');
  bg.addColorStop(0.25,'#0a1420');
  bg.addColorStop(0.38,'#0c1828');
  bg.addColorStop(0.50,'#0e1c2e');
  bg.addColorStop(0.62,'#101f32');
  bg.addColorStop(0.72,'#0e1c2a');
  bg.addColorStop(0.82,'#0c1820');
  bg.addColorStop(1,   '#0a1418');
  c.fillStyle=bg; c.fillRect(0,0,W,H);

  // Dramatic backlit sky glow — light breaking through storm
  const breakLight=c.createRadialGradient(W*0.75,H*0.25,0,W*0.75,H*0.25,650);
  breakLight.addColorStop(0,  `rgba(180,195,220,${0.08+0.04*Math.sin(t*0.3)})`);
  breakLight.addColorStop(0.25,`rgba(140,158,185,0.04)`);
  breakLight.addColorStop(0.5, `rgba(100,118,148,0.02)`);
  breakLight.addColorStop(1,   'rgba(0,0,0,0)');
  c.fillStyle=breakLight; c.fillRect(0,0,W,H);

  // Storm horizon glow
  const stormGlow=c.createLinearGradient(0,HORIZON_Y-200,0,HORIZON_Y+100);
  stormGlow.addColorStop(0,'rgba(0,0,0,0)');
  stormGlow.addColorStop(0.4,`rgba(60,75,95,${0.12+0.05*windStr})`);
  stormGlow.addColorStop(0.75,`rgba(80,95,115,0.18)`);
  stormGlow.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=stormGlow; c.fillRect(0,HORIZON_Y-200,W,300);

  // Jet streaks — high-altitude wind shredding clouds horizontally
  JET_STREAKS.forEach(js=>{
    js.x-=js.speed*windStr*1.2;
    if(js.x<-js.len-200) js.x=W+200;
    const pulse=0.7+0.3*Math.sin(t*0.8+js.phase);
    c.save();
    c.globalAlpha=js.alpha*pulse*windStr;
    const sg=c.createLinearGradient(js.x,js.y,js.x+js.len,js.y);
    sg.addColorStop(0,'rgba(0,0,0,0)');
    sg.addColorStop(0.2,`hsla(${js.hue},45%,${js.lig||70}%,0.9)`);
    sg.addColorStop(0.5,`hsla(${js.hue},50%,72%,0.7)`);
    sg.addColorStop(0.8,`hsla(${js.hue},45%,68%,0.4)`);
    sg.addColorStop(1,'rgba(0,0,0,0)');
    c.strokeStyle=sg; c.lineWidth=js.thickness;
    c.beginPath();
    c.moveTo(js.x, js.y+Math.sin(t*0.4+js.phase)*6);
    c.lineTo(js.x+js.len, js.y+Math.sin(t*0.4+js.phase+0.5)*4);
    c.stroke();
    c.restore();
  });

  // Clouds — moving fast, shredded by wind
  CLOUDS.forEach(cl=>{
    const spd=cl.layer.speed*(0.6+0.4*windStr);
    cl.x-=spd;
    if(cl.x<-cl.rx*2-300) cl.x=W+cl.rx*1.5;
    const pulse=0.82+0.18*Math.sin(t*0.06+cl.phase);

    // Clouds get stretched/shredded horizontally by wind
    const stretchX=1+windStr*0.8;  // horizontally stretched

    c.save();
    c.globalAlpha=cl.layer.alpha*pulse;
    c.translate(cl.x,cl.layer.y);
    c.scale(stretchX,1);

    const drawBlob=(bx,by,br)=>{
      const cg=c.createRadialGradient(bx,by-br*0.1,0,bx,by,br);
      cg.addColorStop(0,  `hsl(${cl.layer.hue},18%,${cl.layer.lig}%)`);
      cg.addColorStop(0.5,`hsl(${cl.layer.hue},14%,${cl.layer.lig-15}%)`);
      cg.addColorStop(1,  'rgba(0,0,0,0)');
      c.fillStyle=cg; c.beginPath(); c.arc(bx,by,br,0,Math.PI*2); c.fill();
    };

    drawBlob(0,0,cl.rx);
    cl.subBlobs.forEach(sb=>drawBlob(sb.ox,sb.oy,cl.rx*sb.r));
    c.restore();
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 2 — TERRAIN: Bergkamm-Silhouette, du stehst auf dem Grat
// ─────────────────────────────────────────────────────────────────────────────

const terrainOff=document.createElement('canvas');
terrainOff.width=W; terrainOff.height=H;
(function buildTerrain(){
  const c=terrainOff.getContext('2d');
  c.clearRect(0,0,W,H);

  // Far mountains — dark silhouettes, layered depth
  const layers=[
    {col:'rgba(22,28,38,0.85)', yBase:HORIZON_Y+20,  peaks:8,  peakH:320},
    {col:'rgba(16,22,30,0.92)', yBase:HORIZON_Y+55,  peaks:6,  peakH:250},
    {col:'rgba(10,14,20,0.96)', yBase:HORIZON_Y+100, peaks:5,  peakH:200},
  ];

  layers.forEach(layer=>{
    c.fillStyle=layer.col;
    c.beginPath();
    c.moveTo(-10,H);
    c.lineTo(-10,layer.yBase);
    for(let i=0;i<=layer.peaks;i++){
      const px=i*(W/layer.peaks);
      const peakY=layer.yBase-hash(i*127.1+layer.peakH)*layer.peakH;
      const nextPX=(i+1)*(W/layer.peaks);
      const nextPeakY=layer.yBase-hash((i+1)*127.1+layer.peakH)*layer.peakH;
      if(i===0) c.lineTo(px,peakY);
      // Bezier curve for natural mountain shape
      const cpx=(px+nextPX)/2, cpy=Math.min(peakY,nextPeakY)-hash(i*311)*60;
      c.quadraticCurveTo(cpx,cpy,nextPX,nextPeakY);
    }
    c.lineTo(W+10,H); c.closePath(); c.fill();
  });

  // The ridge we're standing on — foreground
  // Jagged, close, dark
  c.fillStyle='rgba(6,8,12,0.98)';
  c.beginPath();
  c.moveTo(-10,H);
  c.lineTo(-10,HORIZON_Y+120);
  // Left side rises up to left edge
  c.lineTo(0,HORIZON_Y+80);
  c.lineTo(60,HORIZON_Y+60);
  c.lineTo(120,HORIZON_Y+90);
  c.lineTo(200,HORIZON_Y+50);
  c.lineTo(280,HORIZON_Y+35);
  c.lineTo(350,HORIZON_Y+55);
  // Central ridge — where we stand, highest point
  c.lineTo(420,HORIZON_Y+18);
  c.lineTo(480,HORIZON_Y+8);
  c.lineTo(CX,HORIZON_Y);      // apex of ridge
  c.lineTo(600,HORIZON_Y+8);
  c.lineTo(660,HORIZON_Y+22);
  c.lineTo(730,HORIZON_Y+48);
  c.lineTo(800,HORIZON_Y+38);
  c.lineTo(880,HORIZON_Y+58);
  c.lineTo(950,HORIZON_Y+72);
  c.lineTo(1020,HORIZON_Y+90);
  c.lineTo(W+10,HORIZON_Y+110);
  c.lineTo(W+10,H);
  c.closePath(); c.fill();

  // Ridge detail — loose rocks, small outcroppings
  for(let r=0;r<18;r++){
    const rx=rng(50,W-50);
    const ry=HORIZON_Y + hash(r*89)*60 + 20;
    const rr=rng(4,20);
    c.fillStyle=`rgba(${8+Math.floor(hash(r*53)*10)},${10+Math.floor(hash(r*71)*12)},${14+Math.floor(hash(r*37)*8)},0.9)`;
    c.beginPath(); c.arc(rx,ry,rr,0,Math.PI*2); c.fill();
  }
})();

function drawTerrain(){
  const c=ctxTerrain;
  c.clearRect(0,0,W,H);
  c.drawImage(terrainOff,0,0);

  // Atmospheric haze on far mountains — distance fog
  const hazeLayers=[
    {y:HORIZON_Y-80, h:80, a:0.08+0.02*Math.sin(t*0.1)},
    {y:HORIZON_Y,    h:50, a:0.06},
  ];
  hazeLayers.forEach(hl=>{
    const hg=c.createLinearGradient(0,hl.y,0,hl.y+hl.h);
    hg.addColorStop(0,'rgba(0,0,0,0)');
    hg.addColorStop(0.5,`rgba(45,55,72,${hl.a})`);
    hg.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=hg; c.fillRect(0,hl.y,W,hl.h);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 3 — BENDING: Alles was der Wind sichtbar macht
// Bäume biegen sich, Gras peitscht, das ist Wind — nicht der Wind selbst
// ─────────────────────────────────────────────────────────────────────────────

// Bent tree — draws a single tree with all branches bent by wind
function drawBentTree(c, tx, ty, height, thickness, alpha, windAmt){
  c.save();
  c.globalAlpha=alpha;
  c.strokeStyle=`rgba(14,18,22,0.9)`;
  c.fillStyle=`rgba(14,18,22,0.9)`;
  c.lineCap='round'; c.lineJoin='round';

  // Wind bends trunk — the lean increases with height
  const leanMax=windAmt*height*0.55;

  function drawBranch(bx,by,dir,len,thick,depth){
    if(len<4||thick<0.4) return;
    const heightFrac=(ty-by)/height;
    const bendX=leanMax*heightFrac*heightFrac;
    const ex=bx+Math.cos(dir)*len + bendX*0.15;
    const ey=by-Math.sin(dir)*len;

    c.lineWidth=thick;
    c.beginPath(); c.moveTo(bx,by); c.lineTo(ex,ey); c.stroke();

    if(depth<5){
      const spread=0.35+windAmt*0.25;
      drawBranch(ex,ey,dir+spread*(1+windAmt*0.3),len*0.62,thick*0.62,depth+1);
      drawBranch(ex,ey,dir-spread*0.7,len*0.58,thick*0.55,depth+1);
      if(depth<3) drawBranch(ex,ey,dir+spread*0.1,len*0.7,thick*0.7,depth+1);
    }
  }

  // Trunk
  const trunkLean=leanMax;
  const trunkTopX=tx+trunkLean;
  const trunkTopY=ty-height;
  c.lineWidth=thickness; c.beginPath();
  c.moveTo(tx,ty);
  c.bezierCurveTo(tx+trunkLean*0.3,ty-height*0.3,
                   tx+trunkLean*0.7,ty-height*0.6,
                   trunkTopX,trunkTopY);
  c.stroke();

  // Main branches — grown from top 40% of trunk, all leaning in wind
  for(let bi=0;bi<5;bi++){
    const bFrac=0.5+bi*0.1;
    const bx=lerp(tx,trunkTopX,bFrac);
    const by=lerp(ty,trunkTopY,bFrac);
    const baseDir=Math.PI*0.35+windAmt*0.4;
    const bDir=bi%2===0 ? baseDir : Math.PI-baseDir*0.6;
    const bLen=height*(0.25-bi*0.02);
    drawBranch(bx,by,bDir,bLen,thickness*(0.35-bi*0.04),1);
  }

  c.restore();
}

// Grass/scrub on ridge — small bent blades
function drawGrassBlade(c,gx,gy,len,windAmt,alpha){
  c.save();
  c.globalAlpha=alpha;
  c.strokeStyle=`rgba(28,35,22,0.85)`;
  c.lineWidth=1.2; c.lineCap='round';
  const bendX=windAmt*len*0.85;
  const bendY=-len*(1-windAmt*0.3);
  c.beginPath();
  c.moveTo(gx,gy);
  c.bezierCurveTo(gx+bendX*0.3,gy+bendY*0.4,
                   gx+bendX*0.7,gy+bendY*0.75,
                   gx+bendX,gy+bendY);
  c.stroke();
  c.restore();
}

// Tree positions on ridge
const TREES=[
  {x:80,   y:HORIZON_Y+62,  h:200, w:7,  a:0.7},
  {x:175,  y:HORIZON_Y+50,  h:240, w:8,  a:0.75},
  {x:310,  y:HORIZON_Y+40,  h:210, w:7,  a:0.65},
  {x:420,  y:HORIZON_Y+26,  h:180, w:6,  a:0.6},
  {x:660,  y:HORIZON_Y+22,  h:185, w:6,  a:0.6},
  {x:755,  y:HORIZON_Y+36,  h:215, w:7,  a:0.65},
  {x:880,  y:HORIZON_Y+52,  h:230, w:8,  a:0.7},
  {x:990,  y:HORIZON_Y+78,  h:195, w:7,  a:0.65},
  // Far background trees — smaller, on far mountains
  {x:140,  y:HORIZON_Y-12,  h:120, w:4,  a:0.35},
  {x:380,  y:HORIZON_Y-8,   h:100, w:3,  a:0.30},
  {x:700,  y:HORIZON_Y-10,  h:115, w:4,  a:0.32},
  {x:900,  y:HORIZON_Y-5,   h:105, w:3,  a:0.28},
];

// Grass blade positions along ridge
const GRASS_BLADES=Array.from({length:60},(_,i)=>({
  x:rng(20,W-20),
  y:HORIZON_Y + hash(i*127.1)*80 + 10,
  len:rng(12,32),
  phase:rng(0,Math.PI*2),
  speed:rng(3,8),
}));

function drawBending(){
  const c=ctxBending;
  c.clearRect(0,0,W,H);

  // Wind gusts make the bend animate — not constant but pulsing
  const gustPhase=Math.sin(t*0.7)*0.3+Math.sin(t*1.4)*0.15+Math.sin(t*3.1)*0.08;
  const bendAmt=clamp(windStr*(0.7+gustPhase),0,1);

  // Trees
  TREES.forEach(tr=>drawBentTree(c,tr.x,tr.y,tr.h,tr.w,tr.a,bendAmt));

  // Grass blades
  GRASS_BLADES.forEach(gb=>{
    const localGust=bendAmt*(0.7+0.3*Math.sin(t*gb.speed+gb.phase));
    drawGrassBlade(c,gb.x,gb.y,gb.len,localGust,0.45+0.25*localGust);
  });

  // Wind-pushed surface on ridge — dust/debris layer hugging ground
  const dustY=HORIZON_Y+5;
  for(let dx=0;dx<W;dx+=8){
    const dWave=Math.sin(dx*0.012+t*4+Math.sin(t*1.3)*1.5)*3;
    const da=windStr*(0.04+0.02*Math.sin(dx*0.025+t*3));
    c.fillStyle=`rgba(65,58,42,${da})`;
    c.fillRect(dx,dustY+dWave,6,2);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 4 — STREAMS: Windströmungen sichtbar gemacht als Linien
// Der Jetstream, die Böen, die unsichtbare Geometrie des Windes
// ─────────────────────────────────────────────────────────────────────────────

// Wind stream lines — the invisible made barely visible
// Fast horizontal flows at different altitudes
const WIND_STREAMS=Array.from({length:28},(_,i)=>({
  y0: rng(0, H*0.85),
  x: rng(-W,W*2),
  speed: rng(1.8,6.5),
  len: rng(150,500),
  alpha: rng(0.025,0.065),
  thickness: rng(0.5,2.2),
  hue: rng(200,220),
  phase: rng(0,Math.PI*2),
  waveAmp: rng(8,35),
  waveFreq: rng(0.003,0.008),
}));

function drawStreams(){
  const c=ctxStreams;
  c.clearRect(0,0,W,H);

  WIND_STREAMS.forEach(ws=>{
    ws.x-=ws.speed*windStr;
    if(ws.x<-ws.len-200) ws.x=W+200;

    const pulse=0.6+0.4*Math.abs(Math.sin(t*0.4+ws.phase));
    const a=ws.alpha*windStr*pulse;
    if(a<0.005) return;

    c.save();
    c.globalAlpha=a;
    c.strokeStyle=`hsla(${ws.hue},35%,72%,1)`;
    c.lineWidth=ws.thickness;
    c.lineCap='round';
    c.shadowColor=`hsl(${ws.hue},40%,75%)`;
    c.shadowBlur=ws.thickness*2;

    // Slightly wavy line
    c.beginPath();
    for(let seg=0;seg<=30;seg++){
      const frac=seg/30;
      const px=ws.x+frac*ws.len;
      const py=ws.y0+Math.sin(px*ws.waveFreq+t*1.5+ws.phase)*ws.waveAmp;
      seg===0?c.moveTo(px,py):c.lineTo(px,py);
    }
    c.stroke();
    c.shadowBlur=0;
    c.restore();
  });

  // Broad atmospheric flow suggestion — very faint horizontal gradient bands
  for(let band=0;band<8;band++){
    const by=band*H/8+H/16;
    const scrollX=(t*lerp(40,120,band/7)*windStr)%W;
    const ba=0.012+0.006*Math.sin(t*0.2+band)*windStr;
    const bg=c.createLinearGradient(-scrollX,by,-scrollX+W,by);
    bg.addColorStop(0,'rgba(0,0,0,0)');
    bg.addColorStop(0.1,`rgba(140,155,175,${ba})`);
    bg.addColorStop(0.5,`rgba(160,175,195,${ba*0.6})`);
    bg.addColorStop(0.9,`rgba(140,155,175,${ba})`);
    bg.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=bg; c.fillRect(0,by-20,W,40);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 5 — VORTEX: Windhos — kurz, unberechenbar, nimmt Form an dann löst sie sich auf
// ─────────────────────────────────────────────────────────────────────────────

// Vortex state machine
let vortexState='dormant'; // dormant | forming | alive | dissolving
let vortexT=0;
let vortexX=rng(200,W-200);
let vortexY=HORIZON_Y+rng(0,300);
let vortexNextT=rng(5,15);
let vortexLifetime=0;
let vortexMaxH=0;

function tickVortex(dt){
  switch(vortexState){
    case 'dormant':
      vortexNextT-=dt;
      if(vortexNextT<=0&&windStr>0.4){
        vortexState='forming'; vortexT=0;
        vortexX=rng(150,W-150);
        vortexY=HORIZON_Y+rng(10,180);
        vortexMaxH=rng(200,500);
      }
      break;
    case 'forming':
      vortexT+=dt;
      if(vortexT>=2){ vortexState='alive'; vortexLifetime=rng(3,8); }
      break;
    case 'alive':
      vortexLifetime-=dt;
      // Vortex slowly drifts with wind
      vortexX-=windStr*0.8;
      if(vortexLifetime<=0) vortexState='dissolving';
      break;
    case 'dissolving':
      vortexT-=dt*0.8;
      if(vortexT<=0){
        vortexState='dormant';
        vortexNextT=rng(8,20);
      }
      break;
  }
}

function drawVortex(){
  const c=ctxVortex;
  c.clearRect(0,0,W,H);

  if(vortexState==='dormant') return;

  let progress=0;
  if(vortexState==='forming') progress=eio(vortexT/2);
  else if(vortexState==='alive') progress=1;
  else if(vortexState==='dissolving') progress=eio(Math.max(0,vortexT/2));

  if(progress<0.01) return;

  const vH=vortexMaxH*progress;
  const vW=lerp(8,60,progress)*(1+Math.sin(t*3)*0.1);
  const rotSpeed=3+windStr*4;

  // Draw vortex as spiraling dust cone — narrow at top, wider at bottom
  for(let layer=0;layer<5;layer++){
    const layerFrac=layer/4;
    const layerY=vortexY;
    const layerH=vH;
    const layerAlpha=(0.08+0.06*layer)*progress*windStr;

    c.save();
    c.globalAlpha=layerAlpha;

    // Rotating ellipses at different heights — the spiral structure
    for(let ring=0;ring<12;ring++){
      const ringFrac=ring/12;
      const ringY=layerY-ringFrac*layerH;
      const ringW=vW*(0.15+ringFrac*0.85)*(1+layer*0.1);
      const ringH=ringW*0.28;
      const rot=t*rotSpeed*(1-ringFrac*0.5)*(layer%2===0?1:-1)+layer;

      const ra=layerAlpha*(1-ringFrac*0.6);
      c.globalAlpha=ra;
      c.strokeStyle=`rgba(${160+layer*10},${148+layer*8},${120+layer*5},0.8)`;
      c.lineWidth=0.8+windStr*0.5;
      c.shadowColor='rgba(150,140,110,0.3)'; c.shadowBlur=4;
      c.save();
      c.translate(vortexX,ringY);
      c.rotate(rot);
      c.scale(1,0.3);
      c.beginPath(); c.arc(0,0,ringW,0,Math.PI*2); c.stroke();
      c.restore();
      c.shadowBlur=0;
    }
    c.restore();
  }

  // Dust particles sucked into vortex
  const partCount=Math.floor(30*progress);
  for(let pi=0;pi<partCount;pi++){
    const pAngle=pi/partCount*Math.PI*2+t*rotSpeed*0.8;
    const pFrac=hash(pi*127+Math.floor(t*0.2))*0.9+0.05;
    const pr=vW*(0.2+pFrac*0.8);
    const pH=vH*pFrac;
    const px=vortexX+Math.cos(pAngle)*pr;
    const py=vortexY-pH;
    const pa=progress*(1-pFrac*0.5)*0.6;
    c.globalAlpha=pa;
    c.fillStyle=`rgba(${155+Math.floor(pFrac*30)},${142+Math.floor(pFrac*20)},${108+Math.floor(pFrac*15)},0.9)`;
    c.shadowColor='rgba(140,128,98,0.4)'; c.shadowBlur=2;
    c.beginPath(); c.arc(px,py,rng(0.8,2.2),0,Math.PI*2); c.fill();
    c.shadowBlur=0;
  }
  c.globalAlpha=1;
}

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 6 — CARRIED: Was der Wind trägt — Blätter, Staub, Salz, Asche
// Der Wind war überall und bringt alles von überall
// ─────────────────────────────────────────────────────────────────────────────

// Different particle types — what wind carries from different places
class CarriedParticle {
  constructor(){this.reset(true)}
  reset(init=false){
    // Spawn from right edge (wind comes from right)
    this.x=init?rng(0,W):W+rng(0,60);
    this.y=init?rng(0,H):rng(H*0.05,H*0.88);
    // Base velocity — mostly horizontal, left-moving
    const baseVX=-(rng(1.5,6)*windStr+0.5);
    const drift=rng(-0.4,0.4);
    this.vx=baseVX;
    this.vy=drift;
    this.r=rng(0.6,3.5);
    this.life=init?Math.random():1;
    this.decay=rng(0.0008,0.003);
    this.alpha=rng(0.2,0.65);
    this.phase=rng(0,Math.PI*2);
    this.type=Math.floor(Math.random()*4); // 0=dust,1=leaf,2=sand,3=unknown(exotic)
    this.rot=rng(0,Math.PI*2);
    this.rotSpeed=rng(-0.08,0.08);
    // Type-based colors — where it's from
    switch(this.type){
      case 0: this.hue=rng(28,48);  this.sat=35; this.lig=52; break; // dust — brown
      case 1: this.hue=rng(85,130); this.sat=40; this.lig=32; break; // leaf — dark green/brown
      case 2: this.hue=rng(38,55);  this.sat=45; this.lig=62; break; // sand — ochre
      case 3: this.hue=rng(180,220);this.sat=25; this.lig=65; break; // exotic — pale blue/grey (salt? ash?)
    }
  }
  update(dt){
    // Wind gusts affect velocity
    const gust=windStr*(0.8+0.2*Math.sin(t*3.5+this.phase));
    this.x+=this.vx*gust*dt*60;
    this.y+=this.vy*dt*60+Math.sin(t*1.2+this.phase)*0.4;
    this.rot+=this.rotSpeed*gust*dt*60;
    this.life-=this.decay*dt*60;
    if(this.life<=0||this.x<-30||this.y<-30||this.y>H+30) this.reset(false);
  }
  draw(c){
    c.save();
    c.globalAlpha=this.alpha*this.life*(0.5+0.5*Math.sin(t*2+this.phase));
    c.translate(this.x,this.y); c.rotate(this.rot);

    if(this.type===1){
      // Leaf — elongated shape
      c.fillStyle=`hsl(${this.hue},${this.sat}%,${this.lig}%)`;
      c.shadowColor=`hsl(${this.hue},${this.sat+10}%,${this.lig+10}%)`; c.shadowBlur=3;
      c.beginPath();
      c.ellipse(0,0,this.r*2.2,this.r*0.7,0,0,Math.PI*2);
      c.fill();
    } else {
      // Dot — dust, sand, or exotic
      c.fillStyle=`hsl(${this.hue},${this.sat}%,${this.lig}%)`;
      c.shadowColor=`hsl(${this.hue},${this.sat+15}%,${this.lig+12}%)`; c.shadowBlur=this.r*2;
      c.beginPath(); c.arc(0,0,this.r,0,Math.PI*2); c.fill();
    }
    c.shadowBlur=0;
    c.restore();
  }
}

// Spawn rate depends on wind strength
const CARRIED=Array.from({length:160},()=>new CarriedParticle());

// Dust cloud bursts — sudden swirls of debris
class DustBurst {
  constructor(){this.reset()}
  reset(){
    this.x=rng(100,W-100);
    this.y=HORIZON_Y+rng(-20,200);
    this.r=0; this.maxR=rng(40,120);
    this.life=1; this.decay=rng(0.02,0.04);
    this.hue=rng(28,48);
    this.wait=rng(0,12);
    this.elapsed=Math.random()*this.wait;
  }
  update(dt){
    this.elapsed+=dt;
    if(this.elapsed<this.wait) return;
    this.r=Math.min(this.maxR,this.r+dt*this.maxR*0.8*(0.5+windStr*0.5));
    this.life-=this.decay*dt*60*windStr;
    return this.life>0;
  }
  draw(c){
    if(this.elapsed<this.wait) return;
    c.save();
    c.globalAlpha=this.life*this.life*0.22*windStr;
    const g=c.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r);
    g.addColorStop(0,`hsl(${this.hue},40%,55%)`);
    g.addColorStop(0.5,`hsl(${this.hue},32%,38%)`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    c.shadowColor=`hsl(${this.hue},45%,50%)`; c.shadowBlur=this.r*0.5;
    c.fillStyle=g; c.beginPath(); c.arc(this.x,this.y,this.r,0,Math.PI*2); c.fill();
    c.shadowBlur=0;
    c.restore();
  }
}

const DUST_BURSTS=Array.from({length:10},()=>new DustBurst());

// Ring motes
const RING_MOTES=Array.from({length:65},(_,i)=>({
  angle:i/65*Math.PI*2,
  speed:rng(-0.004,0.004),
  rOff:rng(-0.28,0.28),
  r:rng(0.8,2.8),
  life:Math.random(),
  decay:rng(0.003,0.007),
  phase:rng(0,Math.PI*2),
  hue:rng(200,220),
}));

function drawCarried(dt){
  const c=ctxCarried;
  c.clearRect(0,0,W,H);

  DUST_BURSTS.forEach(db=>{
    const alive=db.update(dt);
    db.draw(c);
    if(!alive) db.reset();
  });

  CARRIED.forEach(p=>{ p.update(dt); p.draw(c); });

  // Ring — wind-blue/grey
  const ringHue=205+Math.sin(t*0.3)*8;
  [65,28,10,3].forEach((lw,pass)=>{
    const la=[0.022,0.055,0.16,0.52][pass]*(0.65+0.35*Math.sin(t*0.8));
    c.strokeStyle=`hsla(${ringHue},45%,68%,${la})`;
    c.lineWidth=lw;
    c.shadowColor=`hsl(${ringHue},55%,72%)`; c.shadowBlur=lw*2.5;
    c.beginPath(); c.arc(CX,CY,RING_R,0,Math.PI*2); c.stroke();
    c.shadowBlur=0;
  });

  RING_MOTES.forEach(rm=>{
    rm.angle+=rm.speed*(0.8+windStr*0.4);
    rm.life-=rm.decay;
    if(rm.life<=0){rm.life=1;rm.decay=rng(0.003,0.007);}
    const rx=CX+Math.cos(rm.angle)*(RING_R+rm.rOff*24);
    const ry=CY+Math.sin(rm.angle)*(RING_R+rm.rOff*24);
    const ra=rm.life*(0.3+0.45*Math.sin(t*2+rm.phase));
    c.globalAlpha=ra*0.55;
    c.fillStyle=`hsl(${rm.hue},45%,72%)`;
    c.shadowColor=`hsl(${rm.hue},55%,76%)`; c.shadowBlur=rm.r*4;
    c.beginPath(); c.arc(rx,ry,rm.r,0,Math.PI*2); c.fill();
    c.shadowBlur=0;
  });
  c.globalAlpha=1;
}

// ─────────────────────────────────────────────────────────────────────────────
// MAIN LOOP
// ─────────────────────────────────────────────────────────────────────────────
function loop(now){
  const dt=Math.min((now-last)/1000,0.05);
  last=now; t+=dt;

  tickWind(dt);
  tickVortex(dt);

  drawSky();
  drawTerrain();
  drawBending();
  drawStreams();
  drawVortex();
  drawCarried(dt);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
