<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Wind — Wolkenmeer Sunset</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0a0500;}
canvas{position:absolute;inset:0;width:1080px;height:1920px;display:block;}
.sky{position:absolute;inset:0;background:
  radial-gradient(ellipse 70% 50% at 50% 35%,#ff9d00 0%,#ff6b35 25%,#a83a2a 55%,#3a1208 85%,#0a0500 100%),
  linear-gradient(180deg,#2a0a00 0%,#5a1d08 30%,#a83a2a 50%,#ff6b35 65%,#ff9d00 80%,#ffcf77 95%);}
.sun{position:absolute;top:520px;left:50%;transform:translateX(-50%);width:380px;height:380px;border-radius:50%;
  background:radial-gradient(circle,#ffefb0 0%,#ffcf77 25%,#ff9d00 55%,rgba(255,107,53,0) 80%);
  filter:blur(8px);animation:sp 10s ease-in-out infinite;}
@keyframes sp{0%,100%{opacity:0.9;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.04)}}
.zone-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(0,0,0,0.5) 0%,transparent 100%);z-index:40;}
.zone-bot{position:absolute;bottom:0;left:0;right:0;height:920px;background:linear-gradient(0deg,rgba(20,5,0,0.55) 0%,transparent 100%);z-index:40;}
.center-darken{position:absolute;top:300px;left:50%;transform:translateX(-50%);width:780px;height:540px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(20,5,0,0.25) 0%,transparent 70%);z-index:38;}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse 75% 65% at 50% 50%,transparent 35%,rgba(0,0,0,0.6) 100%);z-index:39;pointer-events:none;}
</style></head><body>
<div class="sky"></div><div class="sun"></div>
<canvas id="clouds"></canvas>
<canvas id="streams"></canvas>
<canvas id="gusts"></canvas>
<canvas id="birds"></canvas>
<canvas id="leaves"></canvas>
<div class="center-darken"></div><div class="vignette"></div><div class="zone-top"></div><div class="zone-bot"></div>
<script>
const W=1080,H=1920;
function s(id){const c=document.getElementById(id);c.width=W;c.height=H;return c.getContext('2d');}
const cl=s('clouds'),st=s('streams'),gs=s('gusts'),bd=s('birds'),lv=s('leaves');
const clouds=[];
for(let i=0;i<22;i++){clouds.push({x:Math.random()*W,y:900+Math.random()*700,w:220+Math.random()*380,h:50+Math.random()*90,vx:0.4+Math.random()*0.8,hue:15+Math.random()*25,light:50+Math.random()*25,a:0.55+Math.random()*0.35});}
const streams=[];
for(let i=0;i<24;i++){streams.push({x:Math.random()*W,y:Math.random()*H,len:180+Math.random()*320,vx:4+Math.random()*5,a:0.15+Math.random()*0.3,th:1+Math.random()*2.5,hue:25+Math.random()*20,light:70+Math.random()*20});}
const gusts=[];
function addGust(){gusts.push({x:-200,y:200+Math.random()*1500,vx:7+Math.random()*4,segs:[],life:0,maxLife:120+Math.random()*80,a:0.5,curv:(Math.random()-0.5)*0.8,hue:30+Math.random()*20});}
for(let i=0;i<3;i++)addGust();
const birds=[];
for(let i=0;i<7;i++)birds.push({x:Math.random()*W,y:600+Math.random()*500,vx:1.2+Math.random()*0.8,flap:Math.random()*Math.PI*2,flapSp:0.12+Math.random()*0.08,sz:10+Math.random()*8});
const leaves=[];
for(let i=0;i<18;i++)leaves.push({x:Math.random()*W,y:Math.random()*H,vx:3+Math.random()*3,vy:(Math.random()-0.5)*0.8,rot:Math.random()*Math.PI*2,vr:(Math.random()-0.5)*0.15,sz:5+Math.random()*6,hue:20+Math.random()*25,a:0.7});

let t=0;
function loop(){
  t+=0.016;
  cl.clearRect(0,0,W,H);
  for(const c of clouds){
    c.x+=c.vx;if(c.x-c.w>W)c.x=-c.w;
    const g=cl.createRadialGradient(c.x,c.y,0,c.x,c.y,c.w*0.6);
    g.addColorStop(0,`hsla(${c.hue},80%,${c.light}%,${c.a})`);
    g.addColorStop(0.6,`hsla(${c.hue},70%,${c.light-15}%,${c.a*0.5})`);
    g.addColorStop(1,`hsla(${c.hue},60%,${c.light-25}%,0)`);
    cl.fillStyle=g;cl.beginPath();cl.ellipse(c.x,c.y,c.w*0.6,c.h,0,0,Math.PI*2);cl.fill();
  }
  st.clearRect(0,0,W,H);
  for(const r of streams){
    r.x+=r.vx;if(r.x-r.len>W)r.x=-r.len-Math.random()*200;
    const g=st.createLinearGradient(r.x,r.y,r.x+r.len,r.y);
    g.addColorStop(0,`hsla(${r.hue},90%,${r.light}%,0)`);
    g.addColorStop(0.5,`hsla(${r.hue},90%,${r.light}%,${r.a})`);
    g.addColorStop(1,`hsla(${r.hue},90%,${r.light}%,0)`);
    st.strokeStyle=g;st.lineWidth=r.th;st.lineCap='round';
    st.beginPath();st.moveTo(r.x,r.y);st.lineTo(r.x+r.len,r.y);st.stroke();
  }
  gs.clearRect(0,0,W,H);
  for(let i=gusts.length-1;i>=0;i--){
    const g=gusts[i];g.x+=g.vx;g.life++;
    g.segs.push({x:g.x,y:g.y+Math.sin(g.life*0.05)*30*g.curv});
    if(g.segs.length>35)g.segs.shift();
    const a=Math.min(1,g.life/30)*Math.max(0,1-g.life/g.maxLife);
    gs.strokeStyle=`hsla(${g.hue},90%,80%,${a*0.65})`;gs.lineWidth=3;gs.lineCap='round';
    gs.beginPath();
    for(let k=0;k<g.segs.length;k++){const p=g.segs[k];if(k===0)gs.moveTo(p.x,p.y);else gs.lineTo(p.x,p.y);}
    gs.stroke();
    // Echo trail
    gs.strokeStyle=`hsla(${g.hue+10},90%,90%,${a*0.3})`;gs.lineWidth=7;
    gs.beginPath();
    for(let k=0;k<g.segs.length;k++){const p=g.segs[k];if(k===0)gs.moveTo(p.x,p.y);else gs.lineTo(p.x,p.y);}
    gs.stroke();
    if(g.life>g.maxLife||g.x>W+200){gusts.splice(i,1);addGust();}
  }
  if(Math.random()<0.015)addGust();
  bd.clearRect(0,0,W,H);
  for(const b of birds){
    b.x+=b.vx;b.flap+=b.flapSp;if(b.x>W+40)b.x=-40;
    const f=Math.sin(b.flap)*0.5;
    bd.strokeStyle='rgba(30,10,0,0.85)';bd.lineWidth=2;bd.lineCap='round';
    bd.beginPath();
    bd.moveTo(b.x-b.sz,b.y+f*b.sz*0.5);
    bd.quadraticCurveTo(b.x-b.sz*0.3,b.y-b.sz*0.3-f*b.sz,b.x,b.y);
    bd.quadraticCurveTo(b.x+b.sz*0.3,b.y-b.sz*0.3-f*b.sz,b.x+b.sz,b.y+f*b.sz*0.5);
    bd.stroke();
  }
  lv.clearRect(0,0,W,H);
  for(const l of leaves){
    l.x+=l.vx;l.y+=l.vy+Math.sin(t+l.rot)*0.3;l.rot+=l.vr;
    if(l.x>W+20){l.x=-20;l.y=Math.random()*H;}
    lv.save();lv.translate(l.x,l.y);lv.rotate(l.rot);
    lv.fillStyle=`hsla(${l.hue},80%,55%,${l.a})`;
    lv.beginPath();lv.ellipse(0,0,l.sz*0.4,l.sz,0,0,Math.PI*2);lv.fill();
    lv.restore();
  }
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
