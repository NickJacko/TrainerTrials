<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wild Pokémon Spawn</title>
  <script>setTimeout(() => location.reload(), 1000);</script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .pokemon {
      position: relative;
      text-align: center;
    }
    .pokemon img {
      width: 200px;
      height: auto;
      z-index: 2;
      position: relative;
    }
    .glitter {
      position: absolute;
      top: -30px;
      left: -30px;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, transparent 70%);
      border-radius: 50%;
      animation: shimmer 2s infinite;
      z-index: 1;
    }
    @keyframes shimmer {
      0% { transform: rotate(0deg) scale(1); opacity: 0.6; }
      50% { transform: rotate(180deg) scale(1.1); opacity: 1; }
      100% { transform: rotate(360deg) scale(1); opacity: 0.6; }
    }
    .info {
      font-size: 20px;
      margin-top: 40px;
      font-weight: bold;
      color: white;
      text-shadow: 0 0 4px black;
    }
    .stat-table {
      margin-top: 20px;
      border-collapse: collapse;
      color: white;
      text-shadow: 0 0 2px black;
    }
    .stat-table th, .stat-table td {
      padding: 6px 12px;
      border: 1px solid #ccc;
      text-align: center;
    }
    .stat-table th {
      background: #34495e;
    }
  </style>
</head>
<body>
  <div class="pokemon">
    
    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/58.png" alt="Growlithe">
  </div>
  <div class="info">✨ Wild Growlithe appeared!<br>Level: 11 &nbsp;&nbsp; Rarity: Common</div>
  <table class="stat-table">
    <thead>
      <tr>
<th>HP</th><th>Attack</th><th>Defense</th><th>Sp.Attack</th><th>Sp.Defense</th><th>Speed</th></tr></thead><tbody><tr><td style='color:#e74c3c'>28</td><td style='color:#2ecc71'>9</td><td style='color:#ff69b4'>0</td><td style='color:#e74c3c'>30</td><td style='color:#2ecc71'>8</td><td style='color:#f1c40f'>20</td></tr></tbody></table></body></html>
