<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self' https://www.gstatic.com https://www.google.com https://*.firebasedatabase.app;connect-src 'self' https://*.firebasedatabase.app https://*.firebaseio.com https://www.googleapis.com wss://*.firebasedatabase.app https://www.google.com https://content-firebaseappcheck.googleapis.com https://firebaseappcheck.googleapis.com;frame-src 'self' https://www.google.com https://*.firebasedatabase.app;img-src 'self' data: https:;style-src 'self' 'unsafe-inline';base-uri 'self';">
<title>Spawn</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  background:transparent;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:white;overflow:hidden;
  width:100vw;height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
#fx{position:fixed;inset:0;pointer-events:none;z-index:0;}

.wrap{position:relative;width:420px;z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px;}

/* ── RING ── */
.ring-area{position:relative;width:270px;height:270px;}

.ring-svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}
.rt{fill:none;stroke:rgba(255,255,255,0.06);stroke-width:3;}
.rp{
  fill:none;stroke:var(--rc,#4CAF50);stroke-width:4;stroke-linecap:round;
  filter:drop-shadow(0 0 6px var(--rc,#4CAF50));
  transition:stroke-dashoffset 0.5s linear,stroke 0.4s;
}

/* Orbiting dot on ring */
.orb-dot{
  position:absolute;top:50%;left:50%;
  width:10px;height:10px;border-radius:50%;
  background:var(--rc,#4CAF50);
  box-shadow:0 0 16px var(--rc,#4CAF50),0 0 32px var(--rc,#4CAF50);
  transform:translate(-50%,-50%);
  transition:background 0.4s,box-shadow 0.4s;
}

/* Burst ring on new spawn */
.brust{
  position:absolute;top:50%;left:50%;
  width:270px;height:270px;
  border:2px solid var(--rc,#4CAF50);border-radius:50%;
  transform:translate(-50%,-50%) scale(0.3);
  opacity:0;pointer-events:none;
}
.brust.play{animation:brOut 1.1s cubic-bezier(0.22,1,0.36,1) forwards;}
@keyframes brOut{0%{opacity:0.9;transform:translate(-50%,-50%) scale(0.3);}100%{opacity:0;transform:translate(-50%,-50%) scale(1.8);border-width:1px;}}

/* Catchmon stage — nearly invisible circle */
.stage{
  position:absolute;top:18px;left:18px;
  width:234px;height:234px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  /* No opaque bg — just a very dark tinted lens */
  background:radial-gradient(circle at 35% 30%,rgba(102,126,234,0.05) 0%,rgba(0,0,0,0.15) 100%);
  overflow:hidden;
}
/* Subtle scanline sweep */
.stage::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:linear-gradient(transparent 48%,rgba(78,205,196,0.08) 49%,rgba(78,205,196,0.25) 50%,rgba(78,205,196,0.08) 51%,transparent 52%);
  animation:sc 5s linear infinite;pointer-events:none;
}
@keyframes sc{0%{transform:translateY(-100%);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(100%);opacity:0}}

/* Shiny aura */
.shiny-aura{
  position:absolute;inset:-15px;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(255,215,0,0.18),rgba(255,105,180,0.15),rgba(135,206,250,0.18),rgba(255,215,0,0.18));
  animation:sa 4s linear infinite;filter:blur(12px);z-index:0;
}
@keyframes sa{to{transform:rotate(360deg);}}

#img{
  width:185px;height:auto;
  position:relative;z-index:2;
  transform-origin:center;animation-fill-mode:both;
}

/* Entry */
.entry{animation:en 1.5s cubic-bezier(0.16,1,0.3,1) forwards;}
@keyframes en{
  0%  {transform:scale(0.15) translateY(60px);opacity:0;filter:blur(30px) brightness(4);}
  40% {transform:scale(1.12) translateY(-8px);opacity:1;filter:blur(4px) brightness(1.5);}
  70% {transform:scale(0.97) translateY(3px);filter:blur(0) brightness(1.1);}
  100%{transform:scale(1) translateY(0);opacity:1;filter:none;}
}

/* Idle */
.ib{animation:ib 3.2s ease-in-out infinite;}
.io{animation:io 2.8s ease-in-out infinite;}
.is{animation:is 4.5s ease-in-out infinite;}
.if{animation:if 5s ease-in-out infinite;}
.iw{animation:iw 3.8s ease-in-out infinite;}
@keyframes ib{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes io{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes is{0%,100%{transform:rotate(0)}25%{transform:rotate(2.5deg)}75%{transform:rotate(-2.5deg)}}
@keyframes if{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(1.5deg)}}
@keyframes iw{0%,100%{transform:rotate(0)}25%{transform:rotate(1.5deg)}75%{transform:rotate(-1.5deg)}}

/* Shake */
.shake{animation:sk 1.1s ease forwards;}
@keyframes sk{
  0%,100%{transform:translateX(0) rotate(0);}
  10%{transform:translateX(-14px) rotate(-5deg);}
  20%{transform:translateX(14px) rotate(5deg);}
  30%{transform:translateX(-10px) rotate(-3deg);}
  40%{transform:translateX(10px) rotate(3deg);}
  55%{transform:translateX(-6px) rotate(-1.5deg);}
  70%{transform:translateX(6px) rotate(1.5deg);}
  85%{transform:translateX(-3px);}
}

/* Rarity glows */
.rcommon  #img{filter:drop-shadow(0 0 10px rgba(150,150,160,0.35));}
.rrare    #img{filter:drop-shadow(0 0 16px rgba(102,126,234,0.6));}
.rstarter #img{filter:drop-shadow(0 0 16px rgba(76,175,80,0.55));}
.rlegendary #img{filter:drop-shadow(0 0 22px rgba(255,152,0,0.65));animation:lgp 2.5s ease-in-out infinite alternate;}
.rmythical  #img{filter:drop-shadow(0 0 26px rgba(156,39,176,0.75));animation:mtp 2s ease-in-out infinite alternate;}
.rgod       #img{filter:drop-shadow(0 0 30px rgba(255,0,128,0.85));animation:gdp 1.5s ease-in-out infinite alternate;}
@keyframes lgp{to{filter:drop-shadow(0 0 38px rgba(255,152,0,1)) brightness(1.15);}}
@keyframes mtp{to{filter:drop-shadow(0 0 44px rgba(156,39,176,1)) brightness(1.2);}}
@keyframes gdp{to{filter:drop-shadow(0 0 50px rgba(255,0,128,1)) brightness(1.25) saturate(1.2);}}

/* Caught flash */
.caught-flash{animation:cf 0.9s ease-out;}
@keyframes cf{0%{filter:brightness(3.5) saturate(2) drop-shadow(0 0 50px #4CAF50);}60%{filter:brightness(1.6) drop-shadow(0 0 28px #4CAF50);}100%{filter:none;}}

/* Escaped fade */
.escaped-state #img{opacity:0.25;filter:grayscale(100%) blur(3px)!important;transition:all 0.9s;}

/* ── TIMER ── */
.timer{
  display:flex;align-items:center;gap:9px;
  background:rgba(0,0,0,0.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:12px;padding:7px 16px;
  font-size:21px;font-weight:900;letter-spacing:-0.5px;
}
.tdot{width:6px;height:6px;border-radius:50%;background:var(--rc,#4ECDC4);box-shadow:0 0 8px var(--rc,#4ECDC4);animation:tdb 1s ease-in-out infinite;}
@keyframes tdb{0%,100%{opacity:1}50%{opacity:0.2}}
.timer.urg{border-color:rgba(255,68,68,0.4);}
.timer.urg .tdot{background:#FF4444;box-shadow:0 0 10px #FF4444;}

/* ── INFO ── */
.info{
  background:rgba(6,4,18,0.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:16px;padding:12px 16px;text-align:center;
  width:100%;position:relative;overflow:hidden;
}
/* Animated color line at top */
.info::before{
  content:'';position:absolute;top:0;left:-100%;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--rc,#4ECDC4) 40%,var(--rc,#4ECDC4) 60%,transparent);
  animation:il 3s linear infinite;
}
@keyframes il{to{left:100%;}}

.iname{font-size:19px;font-weight:900;letter-spacing:-0.4px;margin-bottom:4px;display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;}

/* Rarity badge — colored text only, no pill background */
.rbdg{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;}
.rbdg.rc {color:rgba(200,200,200,0.7);}
.rbdg.rr {color:#90caf9;text-shadow:0 0 8px rgba(144,202,249,0.5);}
.rbdg.rs {color:#a5d6a7;text-shadow:0 0 8px rgba(165,214,167,0.5);}
.rbdg.rl {color:#ffcc80;text-shadow:0 0 8px rgba(255,204,128,0.5);}
.rbdg.rm {color:#ce93d8;text-shadow:0 0 10px rgba(206,147,216,0.6);}
.rbdg.rg {color:#ff80ab;text-shadow:0 0 12px rgba(255,128,171,0.7);}

.imeta{font-size:10px;color:rgba(255,255,255,0.35);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}

/* Stats — minimal, no boxes */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;}
.sc{
  border-radius:6px;padding:4px 2px;text-align:center;
  background:rgba(255,255,255,0.03);
}
.sk{font-size:7.5px;font-weight:700;letter-spacing:0.8px;opacity:0.35;margin-bottom:1px;}
.sv{font-size:12px;font-weight:900;}

/* ── RESULT ── */
.result{
  height:30px;display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:900;letter-spacing:0.3px;
  opacity:0;transition:opacity 0.4s;
}
.result.show{opacity:1;}
.result.caught {color:#4CAF50;text-shadow:0 0 18px rgba(76,175,80,0.8);animation:rcp 0.6s cubic-bezier(0.22,1,0.36,1);}
@keyframes rcp{from{transform:scale(0.4);opacity:0;}to{transform:scale(1);opacity:1;}}
.result.escaped{color:#FF4444;text-shadow:0 0 14px rgba(255,68,68,0.7);}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap" id="W">
  <div class="ring-area">
    <svg class="ring-svg" viewBox="0 0 270 270">
      <circle class="rt" cx="135" cy="135" r="126"/>
      <circle class="rp" id="rp" cx="135" cy="135" r="126" stroke-dasharray="791.7" stroke-dashoffset="0"/>
    </svg>
    <div class="orb-dot" id="od"></div>
    <div class="brust" id="br"></div>
    <div class="stage" id="stage"></div>
  </div>
  <div class="timer" id="tp"><div class="tdot"></div><span id="tt">00:00</span></div>
  <div class="info" id="info">
    <div class="iname" id="iname">Waiting...</div>
    <div class="imeta" id="imeta">—</div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="result" id="res"></div>
</div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import{getDatabase,ref,onValue}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
const db=getDatabase(initializeApp({apiKey:"AIzaSyDdStpC5rVtgaZ4XvtKLwQttnyIDXL2z7Q",authDomain:"trainertrials.firebaseapp.com",databaseURL:"https://trainertrials-default-rtdb.europe-west1.firebasedatabase.app",projectId:"trainertrials",storageBucket:"trainertrials.firebasestorage.app",messagingSenderId:"22071275267",appId:"1:22071275267:web:92e82d6bfaee169aff8336"}));

const RC={Common:'#9E9E9E',Rare:'#667eea',Starter:'#4CAF50',Legendary:'#FF9800',Mythical:'#9C27B0',God:'#FF0080'};
const RI={Common:['ib','io'],Rare:['ib','is'],Starter:['io','if'],Legendary:['if','is'],Mythical:['if','ib'],God:['if']};
const CIRC=2*Math.PI*126;
let sD=null,lTs=0,lR=null,SI=15,idT=null;

// Canvas FX
const cv=document.getElementById('fx'),cx=cv.getContext('2d');
const rsz=()=>{cv.width=innerWidth;cv.height=innerHeight;};rsz();window.addEventListener('resize',rsz);
const ps=[];
class P{
  constructor(x,y,col,opts={}){
    this.x=x;this.y=y;this.col=col;
    const a=opts.a??(Math.random()*Math.PI*2),sp=opts.sp??(4+Math.random()*6);
    this.vx=Math.cos(a)*sp;this.vy=Math.sin(a)*sp-(opts.lift??4);
    this.s=opts.s??(2+Math.random()*3);this.al=1;this.dec=opts.dec??0.018;this.g=opts.g??0.14;
  }
  tick(){this.x+=this.vx;this.y+=this.vy;this.vy+=this.g;this.al-=this.dec;}
  draw(){if(this.al<=0)return;cx.save();cx.globalAlpha=this.al;cx.beginPath();cx.arc(this.x,this.y,this.s,0,Math.PI*2);cx.fillStyle=this.col;cx.shadowBlur=12;cx.shadowColor=this.col;cx.fill();cx.restore();}
}
function ploop(){cx.clearRect(0,0,cv.width,cv.height);for(let i=ps.length-1;i>=0;i--){ps[i].tick();ps[i].draw();if(ps[i].al<=0)ps.splice(i,1);}requestAnimationFrame(ploop);}
ploop();
function burst(col,n,opts={}){
  const r=document.getElementById('stage').getBoundingClientRect();
  const x=r.left+r.width/2,y=r.top+r.height/2;
  for(let i=0;i<n;i++){const a=(Math.PI*2)*(i/n)+Math.random()*0.4;ps.push(new P(x,y,col,{...opts,a}));}
}

// Idle
function setIdle(img,rarity){
  clearTimeout(idT);
  img.classList.remove('ib','io','is','if','iw');
  const an=RI[rarity]||['ib'];
  const pick=()=>{img.classList.remove('ib','io','is','if','iw');img.classList.add(an[Math.floor(Math.random()*an.length)]);idT=setTimeout(pick,10000+Math.random()*6000);};
  pick();
}

function renderSpawn(d){
  const {name,level,rarity,shiny,sprite,stats}=d;
  const col=RC[rarity]||'#4CAF50';
  document.documentElement.style.setProperty('--rc',col);

  // Name
  const nm=document.getElementById('iname');nm.innerHTML='';
  nm.appendChild(document.createTextNode(name));
  if(shiny){const s=document.createElement('span');s.style.cssText='color:#FFD700;text-shadow:0 0 10px rgba(255,215,0,0.8);animation:st 1.5s ease-in-out infinite';s.textContent=' ✦';nm.appendChild(s);}
  const rb=document.createElement('span');
  const rcMap={common:'rc',rare:'rr',starter:'rs',legendary:'rl',mythical:'rm',god:'rg'};
  rb.className=`rbdg ${rcMap[rarity.toLowerCase()]||'rc'}`;rb.textContent=rarity;nm.appendChild(rb);
  document.getElementById('imeta').textContent=`Level ${level}`;

  // Stats
  const st=document.getElementById('stats');st.innerHTML='';
  for(const[k,v]of Object.entries(stats||{})){
    let c='#bbb';
    if(v===0)c='#FF69B4';else if(v===31)c='#ce93d8';else if(v>=28)c='#4CAF50';else if(v>=20)c='#FF9800';else if(v>=15)c='#667eea';else if(v<10)c='#FF5252';
    st.insertAdjacentHTML('beforeend',`<div class="sc"><div class="sk">${k}</div><div class="sv" style="color:${c};text-shadow:0 0 8px ${c}">${v}</div></div>`);
  }

  // Sprite
  const stage=document.getElementById('stage');stage.innerHTML='';
  const W=document.getElementById('W');
  W.className='';W.classList.add(`r${rarity.toLowerCase()}`);

  if(shiny){const a=document.createElement('div');a.className='shiny-aura';stage.appendChild(a);}
  const img=document.createElement('img');img.id='img';img.src=sprite;img.alt=name;
  img.classList.add('entry');stage.appendChild(img);
  setTimeout(()=>{img.classList.remove('entry');setIdle(img,rarity);},1500);

  // Burst ring
  const br=document.getElementById('br');br.classList.remove('play');void br.offsetWidth;br.classList.add('play');

  // Particle burst on spawn
  setTimeout(()=>{
    const cnt={God:65,Mythical:50,Legendary:40,Rare:28,Starter:25,Common:18}[rarity]||18;
    burst(col,cnt,{sp:7,s:3,dec:0.014});
  },200);

  // Result message reset
  const res=document.getElementById('res');res.classList.remove('show','caught','escaped');
  W.classList.remove('caught-flash','escaped-state');
}

function triggerResult(result){
  const img=document.getElementById('img');
  const res=document.getElementById('res');
  const W=document.getElementById('W');
  if(!img)return;
  const shakes=result==='caught'?3:(1+Math.floor(Math.random()*2));
  let n=0;
  function doShake(){
    if(n>=shakes)return finish();
    clearTimeout(idT);img.classList.remove('ib','io','is','if','iw');
    img.classList.remove('shake');void img.offsetWidth;img.classList.add('shake');n++;
    setTimeout(()=>{img.classList.remove('shake');if(n<shakes)setTimeout(doShake,160);else finish();},1100);
  }
  function finish(){
    clearTimeout(idT);
    if(result==='caught'){
      W.classList.add('caught-flash');
      img.classList.add('caught-flash');
      res.textContent='✓ Caught!';res.classList.add('show','caught');
      burst('#4CAF50',55,{sp:9,s:3,dec:0.013});
      setTimeout(()=>burst('#FFD700',25,{sp:6}),250);
    }else if(result==='escaped'){
      W.classList.add('escaped-state');
      res.textContent='✗ Escaped';res.classList.add('show','escaped');
      burst('#FF4444',22,{sp:5,s:2,dec:0.025});
    }
  }
  setTimeout(doShake,400);
}

// Ring update
function updRing(){
  if(sD?.spawn_start){
    const el=Math.max(0,(Date.now()/1000)-sD.spawn_start);
    const prog=Math.min(1,el/SI);
    document.getElementById('rp').style.strokeDashoffset=CIRC*prog;
    const ang=(prog*360-90)*Math.PI/180,r=126;
    document.getElementById('od').style.transform=`translate(calc(-50% + ${Math.cos(ang)*r}px),calc(-50% + ${Math.sin(ang)*r}px))`;
    const rem=SI-el;
    document.getElementById('tp').classList.toggle('urg',rem<=5);
  }
  requestAnimationFrame(updRing);
}
updRing();
setInterval(()=>{
  if(!sD?.spawn_start)return;
  const r=Math.max(0,SI-Math.floor(Date.now()/1000-sD.spawn_start));
  document.getElementById('tt').textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
},250);

onValue(ref(db,'spawn/current'),s=>{
  const d=s.val();if(!d)return;
  const newSpawn=d.timestamp!==lTs;
  const resChg=d.result&&d.result!==lR;
  if(newSpawn){lTs=d.timestamp;lR=d.result;SI=d.spawn_interval||15;sD=d;renderSpawn(d);}
  else if(resChg){lR=d.result;sD=d;triggerResult(d.result);}
});
</script>
</body>
</html>
