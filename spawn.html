<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wild Pokémon Spawn</title>
  <script>setTimeout(() => location.reload(), 1000);</script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .pokemon {
      position: relative;
      text-align: center;
    }
    .pokemon img {
      width: 200px;
      height: auto;
      z-index: 2;
      position: relative;
    }
    .glitter {
      position: absolute;
      top: -30px;
      left: -30px;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, transparent 70%);
      border-radius: 50%;
      animation: shimmer 2s infinite;
      z-index: 1;
    }
    @keyframes shimmer {
      0% { transform: rotate(0deg) scale(1); opacity: 0.6; }
      50% { transform: rotate(180deg) scale(1.1); opacity: 1; }
      100% { transform: rotate(360deg) scale(1); opacity: 0.6; }
    }
    .info {
      font-size: 20px;
      margin-top: 40px;
      font-weight: bold;
      color: white;
      text-shadow: 0 0 4px black;
    }
    .stat-table {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(6, auto);
      gap: 12px;
      color: white;
      text-align: center;
    }
    .stat-table div {
      font-weight: bold;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="pokemon">
    
    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/479.png" alt="Rotom">
  </div>
  <div class="info">✨ Wild Rotom appeared!<br>Level: 100 &nbsp;&nbsp; Rarity: Common</div>
  <div class="stat-table"><div>HP</div><div>Attack</div><div>Defense</div><div>Sp.Attack</div><div>Sp.Defense</div><div>Speed</div><div style='color:#2ecc71'>6</div><div style='color:#2ecc71'>3</div><div style='color:#2ecc71'>5</div><div style='color:#2ecc71'>4</div><div style='color:#f1c40f'>16</div><div style='color:#f1c40f'>16</div></div></body></html>
