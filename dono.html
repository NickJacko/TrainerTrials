<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Donation Alert</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:1080px;height:1920px;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:transparent;
}

#pc{position:fixed;inset:0;pointer-events:none;z-index:1;}

/* Screen edge aurora */
.aurora{
  position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;
  box-shadow:
    inset 0 0 100px var(--ac,rgba(255,215,0,0.0)),
    inset 0 -80px 160px var(--ac,rgba(255,215,0,0.0));
}
.aurora.on{animation:aur 1.6s ease-out forwards;}
@keyframes aur{0%{opacity:0}20%{opacity:1}100%{opacity:0}}

/* Card — centered in full 1080×1920 space */
.wrap{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0.1);
  opacity:0;pointer-events:none;z-index:10;
  width:600px;text-align:center;
}
.wrap.enter{animation:wIn 0.85s cubic-bezier(0.22,1,0.36,1) forwards;}
.wrap.exit {animation:wOut 0.6s cubic-bezier(0.55,0,1,0.45) forwards;}
@keyframes wIn{
  0%  {opacity:0;transform:translate(-50%,-50%) scale(0.1) translateY(50px);filter:blur(28px);}
  55% {opacity:1;transform:translate(-50%,-50%) scale(1.04) translateY(-8px);filter:blur(0);}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1) translateY(0);}
}
@keyframes wOut{
  0%  {opacity:1;transform:translate(-50%,-50%) scale(1);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(0.7) translateY(30px);filter:blur(10px);}
}

/* Icon ring */
.iring{
  width:130px;height:130px;margin:0 auto 24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--tc,rgba(255,215,0,0.45));
  box-shadow:
    0 0 30px var(--tc,rgba(255,215,0,0.3)),
    0 0 80px var(--tc,rgba(255,215,0,0.14)),
    inset 0 0 40px rgba(0,0,0,0.65);
  background:rgba(0,0,0,0.3);
  backdrop-filter:blur(12px);
  animation:irglow 2.8s ease-in-out infinite alternate;
}
@keyframes irglow{
  to{
    box-shadow:0 0 50px var(--tc,rgba(255,215,0,0.5)),
               0 0 110px var(--tc,rgba(255,215,0,0.2)),
               inset 0 0 40px rgba(0,0,0,0.65);
  }
}
.ie{font-size:60px;animation:ip 1.1s ease-in-out infinite alternate;}
@keyframes ip{to{transform:scale(1.1) rotate(8deg);}}

/* Card */
.card{
  background:rgba(7,5,20,0.88);
  backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border-radius:28px;padding:32px 36px 34px;
  border:1px solid rgba(255,255,255,0.08);
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:18%;right:18%;height:1.5px;
  background:var(--tc,rgba(255,215,0,0.5));
  box-shadow:0 0 24px var(--tc,rgba(255,215,0,0.4));
}
.card::after{
  content:'';position:absolute;inset:0;border-radius:28px;
  background:radial-gradient(ellipse at top,rgba(102,126,234,0.08) 0%,transparent 60%);
  pointer-events:none;
}

.slbl{
  font-size:12px;font-weight:800;letter-spacing:4px;
  text-transform:uppercase;color:var(--tc,#FFD700);
  opacity:0.6;margin-bottom:16px;position:relative;z-index:1;
}

/* Donor name */
.dname{
  font-size:48px;font-weight:900;letter-spacing:-2px;
  margin-bottom:10px;line-height:1;position:relative;z-index:1;
}
.dname.normal  {color:white;}
.dname.shine   {background:linear-gradient(90deg,#32cd32,#fff,#32cd32);background-size:200% auto;background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:ds 2s linear infinite;}
.dname.diamond {background:linear-gradient(90deg,#7ec8ff,#fff,#7ec8ff);background-size:200% auto;background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:ds 2s linear infinite;}
.dname.flame   {background:linear-gradient(90deg,#ff8c7a,#ffcc80,#ff8c7a);background-size:200% auto;background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:ds 1.8s linear infinite;}
.dname.king    {background:linear-gradient(90deg,#ffd700,#fff8,#ffaa00,#fff8,#ffd700);background-size:300% auto;background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:ds 1.4s linear infinite;}
@keyframes ds{to{background-position:-200% center;}}

/* Amount */
.amt{
  font-size:38px;font-weight:900;letter-spacing:-1px;
  color:#ffd700;
  text-shadow:0 0 28px rgba(255,215,0,0.7);
  margin-bottom:6px;position:relative;z-index:1;
}
.tot{
  font-size:13px;color:rgba(255,255,255,0.28);
  font-weight:600;position:relative;z-index:1;
}
.tot em{color:var(--tc,#FFD700);font-style:normal;font-weight:800;}

/* Divider */
.divider{
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.08),transparent);
  margin:18px 0;position:relative;z-index:1;
}

/* XP Bonus badge */
.xprow{
  display:flex;align-items:center;justify-content:center;
  margin-bottom:18px;position:relative;z-index:1;
}
.xpbadge{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,215,0,0.08);
  border:1px solid rgba(255,215,0,0.25);
  border-radius:14px;
  padding:9px 20px;
  font-size:18px;font-weight:900;
  color:#ffd700;
  text-shadow:0 0 18px rgba(255,215,0,0.75),0 0 36px rgba(255,215,0,0.3);
  box-shadow:0 0 22px rgba(255,215,0,0.12);
  animation:xpPop 0.55s cubic-bezier(0.22,1,0.36,1) both;
}
.xpbadge .xplabel{
  font-size:11px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,215,0,0.5);text-shadow:none;
}
@keyframes xpPop{
  0%  {opacity:0;transform:scale(0.6) translateY(10px)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}

/* Thank you */
.thx{
  display:inline-block;font-size:15px;font-weight:700;
  padding:9px 20px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:12px;
  color:rgba(255,255,255,0.45);
  position:relative;z-index:1;
}
</style>
</head>
<body>
<canvas id="pc"></canvas>
<div class="aurora" id="au"></div>

<div class="wrap" id="W">
  <div class="iring"><div class="ie" id="ie">👑</div></div>
  <div class="card">
    <div class="slbl">Incoming Gift</div>
    <div class="dname" id="dn">—</div>
    <div class="amt"><span id="am">—</span> Coins</div>
    <div class="tot">Total: <em id="to">0</em> Coins</div>
    <div class="divider"></div>
    <div class="xprow" id="xprow" style="display:none">
      <div class="xpbadge">
        ✨ +<span id="xpa">0</span> XP
        <span class="xplabel">Community Level</span>
      </div>
    </div>
    <div class="thx">Thank you! 💖</div>
  </div>
</div>

<audio id="snd" src="sounds/dono.mp3" preload="auto"></audio>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import{getDatabase,ref,onValue}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
const db=getDatabase(initializeApp({
  apiKey:"AIzaSyDdStpC5rVtgaZ4XvtKLwQttnyIDXL2z7Q",
  authDomain:"trainertrials.firebaseapp.com",
  databaseURL:"https://trainertrials-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"trainertrials",storageBucket:"trainertrials.firebasestorage.app",
  messagingSenderId:"22071275267",appId:"1:22071275267:web:92e82d6bfaee169aff8336"
}));

// ── Particle canvas ──────────────────────────────────────────────
const cv=document.getElementById('pc'),cx=cv.getContext('2d');
cv.width=1080;cv.height=1920;
const ps=[];
class P{
  constructor(x,y,col,opts={}){
    this.x=x;this.y=y;this.col=col;
    const a=opts.a??(Math.random()*Math.PI*2),sp=opts.sp??(3+Math.random()*9);
    this.vx=Math.cos(a)*sp;this.vy=Math.sin(a)*sp-(opts.lift??3);
    this.s=opts.s??(2+Math.random()*4.5);this.al=1;
    this.dec=opts.dec??0.013;this.g=opts.g??0.13;
    this.em=opts.em??null;this.r=Math.random()*Math.PI*2;
    this.vr=(Math.random()-0.5)*0.12;
  }
  tick(){this.x+=this.vx;this.y+=this.vy;this.vy+=this.g;this.al-=this.dec;this.r+=this.vr;}
  draw(){
    if(this.al<=0)return;cx.save();cx.globalAlpha=this.al;
    if(this.em){
      cx.translate(this.x,this.y);cx.rotate(this.r);
      cx.font=`${this.s*4}px serif`;cx.textAlign='center';cx.textBaseline='middle';
      cx.fillText(this.em,0,0);
    } else {
      cx.beginPath();cx.arc(this.x,this.y,this.s,0,Math.PI*2);
      cx.fillStyle=this.col;cx.shadowBlur=12;cx.shadowColor=this.col;cx.fill();
    }
    cx.restore();
  }
}
function ploop(){
  cx.clearRect(0,0,1080,1920);
  for(let i=ps.length-1;i>=0;i--){ps[i].tick();ps[i].draw();if(ps[i].al<=0)ps.splice(i,1);}
  requestAnimationFrame(ploop);
}
ploop();

function blast(col,n,opts={}){
  const el=document.getElementById('W').getBoundingClientRect();
  const bx=el.left+el.width/2,by=el.top+el.height/2;
  for(let i=0;i<n;i++){
    const a=(Math.PI*2)*(i/n)+Math.random()*0.5;
    ps.push(new P(bx,by,col,{...opts,a}));
  }
}
function rain(ems,n){
  for(let i=0;i<n;i++){
    ps.push(new P(Math.random()*1080,-10,'#fff',{
      a:Math.PI/2+(Math.random()-0.5)*0.5,sp:1.5+Math.random()*2.2,
      lift:-2,g:0.045,dec:0.004,
      em:ems[Math.floor(Math.random()*ems.length)],s:2.6
    }));
  }
}

// ── Tiers ────────────────────────────────────────────────────────
const TIERS={
  king:   {icon:'👑',tc:'rgba(255,215,0,0.5)',   col:'#FFD700',n:90, em:['👑','⭐','💎','✨'],rain:true},
  flame:  {icon:'🔥',tc:'rgba(255,140,100,0.45)',col:'#FF8C64',n:70, em:['🔥','💥','⭐'],   rain:false},
  diamond:{icon:'💎',tc:'rgba(126,200,255,0.45)',col:'#7EC8FF',n:55, em:['💎','❄','✦'],    rain:false},
  shine:  {icon:'✨',tc:'rgba(125,219,136,0.4)', col:'#7DDB88',n:35, em:['✨'],             rain:false},
  normal: {icon:'💖',tc:'rgba(255,130,180,0.35)',col:'#FF82B4',n:22, em:null,               rain:false},
};
const gt=t=>t>=2500?'king':t>=500?'flame':t>=250?'diamond':t>=100?'shine':'normal';
const cap=s=>String(s??'').charAt(0).toUpperCase()+String(s??'').slice(1);

let atm=null,lts=0;

function show(name,amount,total,xpBonus){
  const snd=document.getElementById('snd');
  if(snd){snd.currentTime=0;snd.volume=0.5;snd.play().catch(()=>{});}

  const tier=gt(total),T=TIERS[tier];
  document.documentElement.style.setProperty('--tc',T.tc);
  document.documentElement.style.setProperty('--ac',T.tc);

  const W=document.getElementById('W');W.className='wrap';void W.offsetWidth;
  document.getElementById('ie').textContent=T.icon;
  const d=document.getElementById('dn');d.textContent=cap(name);d.className=`dname ${tier}`;
  document.getElementById('am').textContent=amount.toLocaleString('de-DE');
  document.getElementById('to').textContent=total.toLocaleString('de-DE');

  // XP bonus badge
  const xprow=document.getElementById('xprow');
  if(xpBonus>0){
    document.getElementById('xpa').textContent=xpBonus.toLocaleString('de-DE');
    xprow.style.display='flex';
    const badge=xprow.querySelector('.xpbadge');
    badge.style.animation='none';void badge.offsetWidth;badge.style.animation='';
  } else {
    xprow.style.display='none';
  }

  const au=document.getElementById('au');
  au.classList.remove('on');void au.offsetWidth;au.classList.add('on');
  if(atm)clearTimeout(atm);
  W.classList.add('enter');

  setTimeout(()=>{
    blast(T.col,T.n,{sp:9,s:3.2,dec:0.011,g:0.11});
    if(T.rain){setTimeout(()=>rain(T.em,25),200);setTimeout(()=>rain(T.em,25),1600);}
    if(tier==='king'){setTimeout(()=>blast('#667eea',40,{sp:6}),350);}
  },480);

  atm=setTimeout(()=>{
    W.classList.remove('enter');W.classList.add('exit');
    atm=setTimeout(()=>{W.className='wrap';},650);
  },5200);
}

onValue(ref(db,'donations/latest'),s=>{
  const d=s.val();
  if(!d||!d.donor||!d.amount||d.timestamp<=lts)return;
  lts=d.timestamp;
  show(d.donor,d.amount,d.total_donation||0,d.xp_bonus||0);
});
</script>
</body>
</html>
