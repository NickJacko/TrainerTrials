<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Donation Alert</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:transparent;overflow:hidden;width:100vw;height:100vh;}

#pc{position:fixed;inset:0;pointer-events:none;z-index:1;}

/* Edge aurora — not a solid overlay, painted only on screen edges */
.aurora{
  position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;
  box-shadow:
    inset 0 0 60px var(--ac,rgba(255,215,0,0.0)),
    inset 0 -40px 80px var(--ac,rgba(255,215,0,0.0));
}
.aurora.on{animation:aur 1.4s ease-out forwards;}
@keyframes aur{0%{opacity:0}20%{opacity:1}100%{opacity:0}}

/* Card — centered, emerges from darkness */
.wrap{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0.15);
  opacity:0;pointer-events:none;z-index:10;
  width:340px;text-align:center;
}
.wrap.enter{animation:wIn 0.8s cubic-bezier(0.22,1,0.36,1) forwards;}
.wrap.exit {animation:wOut 0.6s cubic-bezier(0.55,0,1,0.45) forwards;}
@keyframes wIn{
  0%  {opacity:0;transform:translate(-50%,-50%) scale(0.15) translateY(30px);filter:blur(20px);}
  55% {opacity:1;transform:translate(-50%,-50%) scale(1.04) translateY(-5px);filter:blur(0);}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1) translateY(0);}
}
@keyframes wOut{
  0%  {opacity:1;transform:translate(-50%,-50%) scale(1);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(0.7) translateY(20px);filter:blur(6px);}
}

/* Icon ring — glowing circle against dark bg */
.iring{
  width:88px;height:88px;margin:0 auto 16px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  /* No background box — just glow ring */
  border:1.5px solid var(--tc,rgba(255,215,0,0.5));
  box-shadow:
    0 0 20px var(--tc,rgba(255,215,0,0.3)),
    0 0 50px var(--tc,rgba(255,215,0,0.15)),
    inset 0 0 25px rgba(0,0,0,0.7);
  background:rgba(0,0,0,0.35);
  backdrop-filter:blur(8px);
  animation:irglow 2.5s ease-in-out infinite alternate;
}
@keyframes irglow{to{box-shadow:0 0 35px var(--tc,rgba(255,215,0,0.5)),0 0 70px var(--tc,rgba(255,215,0,0.2)),inset 0 0 25px rgba(0,0,0,0.7);}}
.ie{font-size:40px;animation:ip 1s ease-in-out infinite alternate;}
@keyframes ip{to{transform:scale(1.1) rotate(8deg);}}

/* Card — deep glass matching #0f0f23 background */
.card{
  background:rgba(8,6,22,0.82);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-radius:20px;padding:20px 24px 22px;
  border:1px solid rgba(255,255,255,0.07);
  position:relative;overflow:hidden;
}
/* Top color line */
.card::before{
  content:'';position:absolute;top:0;left:25%;right:25%;height:1px;
  background:var(--tc,rgba(255,215,0,0.5));
  box-shadow:0 0 16px var(--tc,rgba(255,215,0,0.4));
}
/* Ambient inner glow matching background palette */
.card::after{
  content:'';position:absolute;inset:0;border-radius:20px;
  background:radial-gradient(ellipse at top,rgba(102,126,234,0.06) 0%,transparent 60%);
  pointer-events:none;
}

.slbl{font-size:9px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--tc,#FFD700);opacity:0.65;margin-bottom:9px;position:relative;z-index:1;}

.dname{font-size:28px;font-weight:900;letter-spacing:-1px;margin-bottom:7px;line-height:1;position:relative;z-index:1;}
.dname.normal  {color:white;}
.dname.shine   {background:linear-gradient(90deg,#32cd32,#fff,#32cd32);background-size:200% auto;background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:ds 2s linear infinite;}
.dname.diamond {background:linear-gradient(90deg,#7ec8ff,#fff,#7ec8ff);background-size:200% auto;background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:ds 2s linear infinite;}
.dname.flame   {background:linear-gradient(90deg,#ff8c7a,#ffcc80,#ff8c7a);background-size:200% auto;background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:ds 1.8s linear infinite;}
.dname.king    {background:linear-gradient(90deg,#ffd700,#fff8,#ffaa00,#fff8,#ffd700);background-size:300% auto;background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:ds 1.4s linear infinite;}
@keyframes ds{to{background-position:-200% center;}}

.amt{font-size:24px;font-weight:900;letter-spacing:-0.5px;color:#ffd700;text-shadow:0 0 20px rgba(255,215,0,0.65);margin-bottom:4px;position:relative;z-index:1;}
.tot{font-size:10px;color:rgba(255,255,255,0.3);font-weight:600;margin-bottom:12px;position:relative;z-index:1;}
.tot em{color:var(--tc,#FFD700);font-style:normal;font-weight:800;}
.thx{display:inline-block;font-size:12px;font-weight:700;padding:6px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:8px;color:rgba(255,255,255,0.5);position:relative;z-index:1;}
</style>
</head>
<body>
<canvas id="pc"></canvas>
<div class="aurora" id="au"></div>
<div class="wrap" id="W">
  <div class="iring"><div class="ie" id="ie">👑</div></div>
  <div class="card">
    <div class="slbl">Incoming Gift</div>
    <div class="dname" id="dn">—</div>
    <div class="amt"><span id="am">—</span> Coins</div>
    <div class="tot">Total: <em id="to">0</em> Coins</div>
    <div class="thx">Thank you! 💖</div>
  </div>
</div>
<audio id="snd" src="sounds/dono.mp3" preload="auto"></audio>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import{getDatabase,ref,onValue}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
const db=getDatabase(initializeApp({apiKey:"AIzaSyDdStpC5rVtgaZ4XvtKLwQttnyIDXL2z7Q",authDomain:"trainertrials.firebaseapp.com",databaseURL:"https://trainertrials-default-rtdb.europe-west1.firebasedatabase.app",projectId:"trainertrials",storageBucket:"trainertrials.firebasestorage.app",messagingSenderId:"22071275267",appId:"1:22071275267:web:92e82d6bfaee169aff8336"}));

const cv=document.getElementById('pc'),cx=cv.getContext('2d');
const rsz=()=>{cv.width=innerWidth;cv.height=innerHeight;};rsz();window.addEventListener('resize',rsz);
const ps=[];
class P{
  constructor(x,y,col,opts={}){
    this.x=x;this.y=y;this.col=col;
    const a=opts.a??(Math.random()*Math.PI*2),sp=opts.sp??(3+Math.random()*7);
    this.vx=Math.cos(a)*sp;this.vy=Math.sin(a)*sp-(opts.lift??3);
    this.s=opts.s??(2+Math.random()*3.5);this.al=1;this.dec=opts.dec??0.015;this.g=opts.g??0.13;
    this.em=opts.em??null;this.r=Math.random()*Math.PI*2;this.vr=(Math.random()-0.5)*0.12;
  }
  tick(){this.x+=this.vx;this.y+=this.vy;this.vy+=this.g;this.al-=this.dec;this.r+=this.vr;}
  draw(){
    if(this.al<=0)return;cx.save();cx.globalAlpha=this.al;
    if(this.em){cx.translate(this.x,this.y);cx.rotate(this.r);cx.font=`${this.s*3.5}px serif`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(this.em,0,0);}
    else{cx.beginPath();cx.arc(this.x,this.y,this.s,0,Math.PI*2);cx.fillStyle=this.col;cx.shadowBlur=10;cx.shadowColor=this.col;cx.fill();}
    cx.restore();
  }
}
function ploop(){cx.clearRect(0,0,cv.width,cv.height);for(let i=ps.length-1;i>=0;i--){ps[i].tick();ps[i].draw();if(ps[i].al<=0)ps.splice(i,1);}requestAnimationFrame(ploop);}
ploop();

function blast(col,n,opts={}){
  const el=document.getElementById('W').getBoundingClientRect();
  const cx2=el.left+el.width/2,cy2=el.top+el.height/2;
  for(let i=0;i<n;i++){const a=(Math.PI*2)*(i/n)+Math.random()*0.4;ps.push(new P(cx2,cy2,col,{...opts,a}));}
}
function rain(ems,n){
  for(let i=0;i<n;i++){
    ps.push(new P(Math.random()*cv.width,-10,'#fff',{a:Math.PI/2+(Math.random()-0.5)*0.5,sp:1.2+Math.random()*1.8,lift:-2,g:0.045,dec:0.004,em:ems[Math.floor(Math.random()*ems.length)],s:2.2}));
  }
}

// Colors matching background palette for particles
const TIERS={
  king:  {icon:'👑',tc:'rgba(255,215,0,0.5)',col:'#FFD700',n:80,em:['👑','⭐','💎','✨'],rain:true},
  flame: {icon:'🔥',tc:'rgba(255,140,100,0.45)',col:'#FF8C64',n:60,em:['🔥','💥','⭐'],rain:false},
  diamond:{icon:'💎',tc:'rgba(126,200,255,0.45)',col:'#7EC8FF',n:45,em:['💎','❄','✦'],rain:false},
  shine: {icon:'✨',tc:'rgba(125,219,136,0.4)',col:'#7DDB88',n:30,em:['✨'],rain:false},
  normal:{icon:'💖',tc:'rgba(255,130,180,0.35)',col:'#FF82B4',n:18,em:null,rain:false},
};
const gt=t=>t>=2500?'king':t>=500?'flame':t>=250?'diamond':t>=100?'shine':'normal';
const cap=s=>String(s??'').charAt(0).toUpperCase()+String(s??'').slice(1);

let atm=null,lts=0;
function show(name,amount,total){
  const snd=document.getElementById('snd');if(snd){snd.currentTime=0;snd.volume=0.5;snd.play().catch(()=>{});}
  const tier=gt(total),T=TIERS[tier];
  document.documentElement.style.setProperty('--tc',T.tc);
  document.documentElement.style.setProperty('--ac',T.tc);
  const W=document.getElementById('W');W.className='wrap';void W.offsetWidth;
  document.getElementById('ie').textContent=T.icon;
  const d=document.getElementById('dn');d.textContent=cap(name);d.className=`dname ${tier}`;
  document.getElementById('am').textContent=amount.toLocaleString('de-DE');
  document.getElementById('to').textContent=total.toLocaleString('de-DE');
  const au=document.getElementById('au');au.classList.remove('on');void au.offsetWidth;au.classList.add('on');
  if(atm)clearTimeout(atm);
  W.classList.add('enter');
  setTimeout(()=>{
    blast(T.col,T.n,{sp:7,s:2.8,dec:0.013,g:0.12});
    if(T.rain){setTimeout(()=>rain(T.em,20),200);setTimeout(()=>rain(T.em,20),1400);}
    if(tier==='king'){setTimeout(()=>blast('#667eea',30,{sp:5}),300);}
  },450);
  atm=setTimeout(()=>{W.classList.remove('enter');W.classList.add('exit');atm=setTimeout(()=>{W.className='wrap';},650);},4800);
}
onValue(ref(db,'donations/latest'),s=>{
  const d=s.val();if(!d||!d.donor||!d.amount||d.timestamp<=lts)return;
  lts=d.timestamp;show(d.donor,d.amount,d.total_donation||0);
});
</script>
</body>
</html>
