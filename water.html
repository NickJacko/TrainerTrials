<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Water — Tiefsee Korallenriff</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:1080px;height:1920px;overflow:hidden;
    background:radial-gradient(ellipse 100% 80% at 50% 0%, #0087c0 0%, #005080 30%, #002a42 70%, #001520 100%);
  }
  canvas{position:absolute;inset:0;width:1080px;height:1920px;display:block;}

  /* Water surface — shimmer at top */
  .surface{
    position:absolute;top:0;left:0;right:0;height:280px;
    background:
      radial-gradient(ellipse 800px 120px at 30% 0%, rgba(100,220,255,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 600px 100px at 75% 0%, rgba(80,200,240,0.15) 0%, transparent 55%),
      linear-gradient(180deg, rgba(0,160,220,0.22) 0%, transparent 100%);
    animation:surfaceShimmer 6s ease-in-out infinite;
  }
  @keyframes surfaceShimmer{
    0%,100%{opacity:0.7}50%{opacity:1}
  }

  /* God-rays from surface — diagonal light beams */
  .ray{
    position:absolute;top:0;
    width:180px;height:1400px;
    background:linear-gradient(180deg, rgba(120,230,255,0.14) 0%, rgba(80,180,230,0.05) 40%, transparent 75%);
    transform-origin:top center;
    mix-blend-mode:screen;
    filter:blur(22px);
  }
  .ray1{left:8%;transform:rotate(8deg);animation:rayPulse 7s ease-in-out infinite;}
  .ray2{left:22%;width:140px;transform:rotate(4deg);animation:rayPulse 9s ease-in-out infinite reverse;animation-delay:-2s;}
  .ray3{left:45%;width:200px;transform:rotate(-3deg);animation:rayPulse 8s ease-in-out infinite;animation-delay:-3.5s;}
  .ray4{right:18%;width:150px;transform:rotate(-7deg);animation:rayPulse 10s ease-in-out infinite reverse;}
  .ray5{right:5%;width:120px;transform:rotate(-12deg);animation:rayPulse 6.5s ease-in-out infinite;animation-delay:-1.5s;}
  @keyframes rayPulse{
    0%,100%{opacity:0.55;transform-origin:top center}
    30%{opacity:1;}
    70%{opacity:0.65}
  }

  /* Deep ocean darkening — bottom */
  .abyss{
    position:absolute;bottom:0;left:0;right:0;height:900px;
    background:linear-gradient(0deg, rgba(0,8,18,0.82) 0%, rgba(0,15,30,0.45) 45%, transparent 100%);
  }

  /* Coral bed platform */
  .coral-bed{
    position:absolute;bottom:0;left:0;right:0;height:480px;
    background:radial-gradient(ellipse 100% 60% at 50% 100%, rgba(0,30,50,0.7) 0%, transparent 70%);
  }

  /* Bioluminescent ambient glow around ring area */
  .ring-glow{
    position:absolute;top:230px;left:50%;transform:translateX(-50%);
    width:800px;height:800px;border-radius:50%;
    background:radial-gradient(ellipse 100% 100% at 50% 50%,
      transparent 48%,
      rgba(0,220,200,0.05) 56%,
      rgba(0,200,220,0.1) 62%,
      rgba(0,220,200,0.05) 70%,
      transparent 80%);
    mix-blend-mode:screen;filter:blur(8px);
    animation:ringPulse 3s ease-in-out infinite;
  }
  @keyframes ringPulse{
    0%,100%{opacity:0.7;transform:translateX(-50%) scale(1)}
    50%{opacity:1;transform:translateX(-50%) scale(1.025)}
  }

  /* Caustic light patches on water floor */
  .caustic-base{
    position:absolute;bottom:0;left:0;right:0;height:700px;
    background:
      radial-gradient(ellipse 300px 80px at 20% 70%, rgba(0,180,220,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 250px 70px at 60% 80%, rgba(0,160,200,0.05) 0%, transparent 65%),
      radial-gradient(ellipse 280px 75px at 85% 65%, rgba(0,200,230,0.06) 0%, transparent 70%);
    mix-blend-mode:screen;
    animation:causticDrift 8s ease-in-out infinite alternate;
  }
  @keyframes causticDrift{
    0%{transform:translateX(0)}100%{transform:translateX(30px)}
  }

  /* Scene-wide bioluminescent ambient */
  .scene-bio{
    position:absolute;inset:0;
    background:radial-gradient(ellipse 90% 55% at 50% 50%, rgba(0,80,120,0.12) 0%, transparent 60%);
    mix-blend-mode:screen;
    animation:bioPulse 5s ease-in-out infinite;
  }
  @keyframes bioPulse{0%,100%{opacity:0.6}50%{opacity:1}}

  /* UI zones */
  .center-darken{position:absolute;top:300px;left:50%;transform:translateX(-50%);width:780px;height:540px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(0,10,25,0.42) 0%,transparent 70%);z-index:38;}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 40%,rgba(0,0,10,0.68) 100%);z-index:39;pointer-events:none;}
  .zone-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(0,0,0,0.45) 0%,transparent 100%);z-index:40;}
  .zone-bot{position:absolute;bottom:0;left:0;right:0;height:920px;background:linear-gradient(0deg,rgba(0,0,8,0.6) 0%,rgba(0,0,8,0.15) 40%,transparent 100%);z-index:40;}
</style>
</head>
<body>
  <div class="surface"></div>
  <div class="ray ray1"></div>
  <div class="ray ray2"></div>
  <div class="ray ray3"></div>
  <div class="ray ray4"></div>
  <div class="ray ray5"></div>

  <!-- Canvas stack: caustics → corals → ring-bubbles → creatures → particles -->
  <canvas id="cCaustic"></canvas>
  <canvas id="cCoral"></canvas>
  <canvas id="cRing"></canvas>
  <canvas id="cCreatures"></canvas>
  <canvas id="cParticles"></canvas>

  <div class="abyss"></div>
  <div class="coral-bed"></div>
  <div class="caustic-base"></div>
  <div class="scene-bio"></div>
  <div class="ring-glow"></div>
  <div class="center-darken"></div>
  <div class="vignette"></div>
  <div class="zone-top"></div>
  <div class="zone-bot"></div>

<script>
const W=1080, H=1920;
const RING_CX=540, RING_CY=590, RING_R=300;

function mkCanvas(id){
  const c=document.getElementById(id);
  c.width=W; c.height=H;
  return c.getContext('2d');
}
const causticCtx  = mkCanvas('cCaustic');
const coralCtx    = mkCanvas('cCoral');
const ringCtx     = mkCanvas('cRing');
const creatureCtx = mkCanvas('cCreatures');
const partCtx     = mkCanvas('cParticles');

/* ═══════════════════════════════════════════════════════════════════════════
   CAUSTIC LIGHT PATCHES — shifting light patterns on the seafloor
   ═══════════════════════════════════════════════════════════════════════════ */
const caustics = [];
for(let i=0;i<16;i++){
  caustics.push({
    x: Math.random()*W,
    y: 900+Math.random()*900,
    rx: 90+Math.random()*160,
    ry: 25+Math.random()*40,
    vx: (Math.random()-0.5)*0.35,
    vy: (Math.random()-0.5)*0.12,
    rot: Math.random()*Math.PI,
    rotV: (Math.random()-0.5)*0.004,
    phase: Math.random()*Math.PI*2,
    speed: 0.008+Math.random()*0.012,
    a: 0.04+Math.random()*0.08,
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   CORAL STRUCTURES — drawn once to an offscreen canvas, layered by depth
   ═══════════════════════════════════════════════════════════════════════════ */
const coralData = [
  // {x, y, type, scale, hue, sat, glow}
  {x:80,  y:1920, type:'branch',  scale:1.3, hue:340, sat:90, glow:'rgba(255,80,150,0.6)'},
  {x:220, y:1920, type:'fan',     scale:1.0, hue:28,  sat:95, glow:'rgba(255,140,40,0.55)'},
  {x:380, y:1920, type:'tube',    scale:1.1, hue:175, sat:85, glow:'rgba(0,230,190,0.5)'},
  {x:530, y:1920, type:'branch',  scale:0.9, hue:15,  sat:90, glow:'rgba(255,80,40,0.55)'},
  {x:680, y:1920, type:'fan',     scale:1.2, hue:285, sat:80, glow:'rgba(160,60,255,0.5)'},
  {x:820, y:1920, type:'tube',    scale:1.0, hue:195, sat:90, glow:'rgba(0,200,240,0.5)'},
  {x:980, y:1920, type:'branch',  scale:1.1, hue:350, sat:85, glow:'rgba(255,50,120,0.6)'},
  // Smaller background corals
  {x:150, y:1920, type:'anemone', scale:0.7, hue:60,  sat:80, glow:'rgba(220,200,0,0.45)'},
  {x:460, y:1920, type:'anemone', scale:0.8, hue:320, sat:85, glow:'rgba(255,60,200,0.45)'},
  {x:760, y:1920, type:'anemone', scale:0.65,hue:140, sat:80, glow:'rgba(40,220,100,0.4)'},
  {x:900, y:1920, type:'fan',     scale:0.75,hue:55,  sat:90, glow:'rgba(220,200,0,0.4)'},
];

function drawBranchCoral(ctx, x, y, len, ang, depth, hue, sat){
  if(depth>4 || len<6) return;
  const ex = x + Math.cos(ang)*len;
  const ey = y - len; // always grows up
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(ex, ey);
  ctx.lineWidth = Math.max(1, (5-depth)*1.2);
  ctx.strokeStyle = `hsla(${hue},${sat}%,${50+depth*8}%,${0.9-depth*0.1})`;
  ctx.stroke();
  if(Math.random()<0.85){
    drawBranchCoral(ctx, ex, ey, len*0.72, ang-0.45-Math.random()*0.3, depth+1, hue+5, sat);
    drawBranchCoral(ctx, ex, ey, len*0.68, ang+0.45+Math.random()*0.3, depth+1, hue-5, sat);
  }
  if(depth>=3){
    // polyp tips
    ctx.beginPath();
    ctx.arc(ex, ey, 3-depth*0.3, 0, Math.PI*2);
    ctx.fillStyle=`hsla(${hue+20},100%,75%,0.9)`;
    ctx.fill();
  }
}

function drawFanCoral(ctx, x, y, w, h, hue, sat){
  const ribs = 9;
  for(let i=0;i<ribs;i++){
    const ang = -Math.PI/2 + (i/(ribs-1)-0.5)*0.9;
    const rx=x+Math.cos(ang)*w/2, ry=y-Math.abs(Math.sin(ang))*h;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(rx,ry);
    ctx.strokeStyle=`hsla(${hue},${sat}%,${52+i*3}%,0.85)`;
    ctx.lineWidth=1.8;ctx.stroke();
  }
  // Webbing between ribs
  ctx.beginPath();
  for(let i=0;i<ribs;i++){
    const ang=-Math.PI/2+(i/(ribs-1)-0.5)*0.9;
    const rx=x+Math.cos(ang)*w/2, ry=y-Math.abs(Math.sin(ang))*h;
    i===0?ctx.moveTo(rx,ry):ctx.lineTo(rx,ry);
  }
  ctx.strokeStyle=`hsla(${hue},${sat}%,60%,0.35)`;
  ctx.lineWidth=8; ctx.stroke();
  ctx.strokeStyle=`hsla(${hue},${sat}%,70%,0.15)`;
  ctx.lineWidth=14; ctx.stroke();
}

function drawTubeCoral(ctx, x, y, hue, sat){
  const tubes = 4+Math.floor(Math.random()*3);
  for(let i=0;i<tubes;i++){
    const tx=x+(i-(tubes-1)/2)*22+Math.random()*8;
    const th=100+Math.random()*120;
    const tw=10+Math.random()*8;
    const g=ctx.createLinearGradient(tx,y,tx,y-th);
    g.addColorStop(0,`hsla(${hue},${sat}%,35%,0.95)`);
    g.addColorStop(0.7,`hsla(${hue+10},${sat}%,55%,0.85)`);
    g.addColorStop(1,`hsla(${hue+20},${sat}%,65%,0.7)`);
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.roundRect(tx-tw/2, y-th, tw, th, [tw/2,tw/2,0,0]);
    ctx.fill();
    // Opening
    ctx.beginPath();
    ctx.ellipse(tx, y-th, tw/2, tw*0.35, 0, 0, Math.PI*2);
    ctx.fillStyle=`hsla(${hue+30},100%,70%,0.9)`;
    ctx.fill();
  }
}

function drawAnemone(ctx, x, y, hue, sat){
  const tentacles = 14;
  for(let i=0;i<tentacles;i++){
    const ang = (i/tentacles)*Math.PI*2;
    const len = 45+Math.random()*30;
    const cx1=x+Math.cos(ang)*20, cy1=y-25;
    const cx2=x+Math.cos(ang)*len*0.8, cy2=y-len*0.6;
    const tx=x+Math.cos(ang)*len, ty=y-len;
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.bezierCurveTo(cx1,cy1,cx2,cy2,tx,ty);
    ctx.strokeStyle=`hsla(${hue+i*5},${sat}%,${55+i*2}%,0.85)`;
    ctx.lineWidth=2.5;ctx.stroke();
    // Tip
    ctx.beginPath();ctx.arc(tx,ty,4,0,Math.PI*2);
    ctx.fillStyle=`hsla(${hue+30},100%,80%,0.95)`;ctx.fill();
  }
  // Base disk
  ctx.beginPath();ctx.ellipse(x,y,20,8,0,0,Math.PI*2);
  ctx.fillStyle=`hsla(${hue},${sat}%,30%,0.8)`;ctx.fill();
}

// Draw all corals — seeded so they are consistent
(function buildCorals(){
  coralCtx.clearRect(0,0,W,H);
  const savedRng = Math.random;

  for(const c of coralData){
    coralCtx.save();
    coralCtx.translate(c.x, c.y);
    coralCtx.scale(c.scale, c.scale);
    // Glow behind
    coralCtx.shadowBlur=30; coralCtx.shadowColor=c.glow;
    if(c.type==='branch'){
      coralCtx.lineCap='round';
      drawBranchCoral(coralCtx,0,0,65,-Math.PI/2,0,c.hue,c.sat);
    } else if(c.type==='fan'){
      drawFanCoral(coralCtx,0,0,130,160,c.hue,c.sat);
    } else if(c.type==='tube'){
      drawTubeCoral(coralCtx,0,0,c.hue,c.sat);
    } else if(c.type==='anemone'){
      drawAnemone(coralCtx,0,0,c.hue,c.sat);
    }
    coralCtx.restore();
  }
})();

/* ═══════════════════════════════════════════════════════════════════════════
   RING AREA — Bubble spiral + bioluminescent crown
   ═══════════════════════════════════════════════════════════════════════════ */
const SPIRAL_COUNT = 38;
const spiralBubbles = [];
for(let i=0;i<SPIRAL_COUNT;i++){
  const angle = (i/SPIRAL_COUNT)*Math.PI*2;
  // Distribute across spiral arms at different radii
  const layer = Math.floor(i/12);
  const baseR = 120 + layer*90 + Math.random()*60;
  spiralBubbles.push({
    angle,
    baseR,
    r: 3+Math.random()*9,
    speed: 0.004+Math.random()*0.008,  // Angular orbit speed
    riseSpeed: 0.5+Math.random()*1.2,
    wobble: Math.random()*Math.PI*2,
    wobbleSpeed: 0.02+Math.random()*0.04,
    wobbleAmp: 8+Math.random()*20,
    y: RING_CY + Math.random()*400,   // Start below ring
    opacity: 0.3+Math.random()*0.6,
    phase: Math.random()*Math.PI*2,
  });
}

// Bioluminescent ring crown — fixed glowing orbs at ring circumference
const crownOrbs = [];
for(let i=0;i<18;i++){
  const ang=(i/18)*Math.PI*2;
  crownOrbs.push({
    ang,
    r:4+Math.random()*6,
    phase:Math.random()*Math.PI*2,
    speed:0.025+Math.random()*0.035,
    hue: [175,195,215,155][Math.floor(Math.random()*4)],
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   JELLYFISH — drift around ring area
   ═══════════════════════════════════════════════════════════════════════════ */
const jellyfish = [
  {x:280, y:350, vx:0.3, vy:0.1, phase:0,    size:55, hue:200, tentacles:8},
  {x:820, y:480, vx:-0.4,vy:0.15,phase:2.1,  size:40, hue:285, tentacles:6},
  {x:540, y:750, vx:0.2, vy:-0.08,phase:4.3, size:35, hue:165, tentacles:7},
];

function drawJellyfish(ctx, jf, t){
  const pulse = Math.sin(jf.phase+t*1.8);
  const bell = jf.size*(0.88+pulse*0.12);
  ctx.save();
  ctx.translate(jf.x, jf.y);

  // Bell glow
  const bg=ctx.createRadialGradient(0,0,bell*0.2,0,0,bell);
  bg.addColorStop(0,`hsla(${jf.hue},80%,80%,0.35)`);
  bg.addColorStop(0.6,`hsla(${jf.hue},85%,65%,0.12)`);
  bg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bg;
  ctx.beginPath();ctx.arc(0,0,bell*1.3,0,Math.PI*2);ctx.fill();

  // Bell shape
  const bellG=ctx.createLinearGradient(0,-bell,0,bell*0.2);
  bellG.addColorStop(0,`hsla(${jf.hue},70%,80%,0.75)`);
  bellG.addColorStop(0.5,`hsla(${jf.hue},75%,65%,0.5)`);
  bellG.addColorStop(1,`hsla(${jf.hue},80%,55%,0.1)`);
  ctx.fillStyle=bellG;
  ctx.shadowBlur=18; ctx.shadowColor=`hsla(${jf.hue},90%,75%,0.8)`;
  ctx.beginPath();
  ctx.ellipse(0, -bell*0.1, bell*(0.85+pulse*0.08), bell, 0, -Math.PI, 0);
  ctx.fill();
  ctx.shadowBlur=0;

  // Tentacles
  for(let i=0;i<jf.tentacles;i++){
    const tx = (i-(jf.tentacles-1)/2)*(bell*0.2);
    const tlen = bell*(1.5+Math.sin(jf.phase+t*2+i*0.7)*0.4);
    const cx = tx+Math.sin(t*1.2+i)*20;
    ctx.beginPath();
    ctx.moveTo(tx, bell*0.1);
    ctx.quadraticCurveTo(cx, bell*0.8, tx+Math.sin(t+i)*15, tlen);
    ctx.strokeStyle=`hsla(${jf.hue},70%,75%,${0.3+pulse*0.1})`;
    ctx.lineWidth=1.5; ctx.stroke();
  }
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════════════════
   FISH SCHOOLS
   ═══════════════════════════════════════════════════════════════════════════ */
const FISH_COLORS = [
  {hue:50, sat:95, name:'yellow'},
  {hue:25, sat:95, name:'orange'},
  {hue:200,sat:90, name:'blue'},
  {hue:340,sat:85, name:'pink'},
  {hue:120,sat:80, name:'green'},
  {hue:0,  sat:90, name:'red'},
];
const fish = [];
for(let i=0;i<12;i++){
  const col=FISH_COLORS[i%FISH_COLORS.length];
  const spd=0.8+Math.random()*1.4;
  fish.push({
    x: Math.random()*W,
    y: 300+Math.random()*1200,
    vx: (Math.random()<0.5?1:-1)*spd,
    vy: (Math.random()-0.5)*0.3,
    size: 10+Math.random()*16,
    hue: col.hue+Math.random()*20-10,
    sat: col.sat,
    wig: Math.random()*Math.PI*2,
    wigSpeed: 0.12+Math.random()*0.1,
    wigAmp: 0.18+Math.random()*0.12,
    school: Math.floor(i/3), // 4 schools of 3
  });
}

function drawFish(ctx, f){
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.scale(f.vx>0?1:-1, 1);

  const wig=Math.sin(f.wig)*f.wigAmp;

  // Body
  const fg=ctx.createRadialGradient(0,0,f.size*0.1,0,0,f.size);
  fg.addColorStop(0,`hsla(${f.hue+15},${f.sat}%,75%,0.95)`);
  fg.addColorStop(0.6,`hsla(${f.hue},${f.sat}%,55%,0.85)`);
  fg.addColorStop(1,`hsla(${f.hue-10},${f.sat}%,40%,0.5)`);
  ctx.fillStyle=fg;
  ctx.shadowBlur=12; ctx.shadowColor=`hsla(${f.hue},90%,65%,0.6)`;
  ctx.beginPath();
  ctx.ellipse(0, 0, f.size, f.size*0.45, wig, 0, Math.PI*2);
  ctx.fill();

  // Tail fin
  ctx.fillStyle=`hsla(${f.hue-5},${f.sat}%,55%,0.8)`;
  ctx.beginPath();
  ctx.moveTo(-f.size*0.75, 0);
  ctx.lineTo(-f.size*1.5, -f.size*0.45+wig*f.size*0.3);
  ctx.lineTo(-f.size*1.4, wig*f.size*0.1);
  ctx.lineTo(-f.size*1.5, f.size*0.45+wig*f.size*0.3);
  ctx.closePath(); ctx.fill();

  // Eye
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(0,0,0,0.85)';
  ctx.beginPath(); ctx.arc(f.size*0.5, -f.size*0.1, f.size*0.12, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.8)';
  ctx.beginPath(); ctx.arc(f.size*0.52, -f.size*0.12, f.size*0.05, 0, Math.PI*2); ctx.fill();

  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════════════════
   PARTICLES — bubbles, plankton, drift
   ═══════════════════════════════════════════════════════════════════════════ */

// General rising bubbles
const bubbles = [];
for(let i=0;i<80;i++){
  bubbles.push(mkBubble(true));
}
function mkBubble(init){
  return {
    x: Math.random()*W,
    y: init ? Math.random()*H : H+20,
    r: 2+Math.random()*8,
    vy: -(0.3+Math.random()*0.9),
    vx: (Math.random()-0.5)*0.2,
    sway: Math.random()*Math.PI*2,
    swaySpeed: 0.02+Math.random()*0.03,
    swayAmp: 3+Math.random()*8,
    a: 0.25+Math.random()*0.45,
  };
}

// Plankton — tiny bioluminescent specks
const plankton = [];
for(let i=0;i<55;i++){
  plankton.push({
    x: Math.random()*W,
    y: Math.random()*H,
    r: 0.8+Math.random()*1.8,
    vx: (Math.random()-0.5)*0.15,
    vy: (Math.random()-0.5)*0.1,
    phase: Math.random()*Math.PI*2,
    speed: 0.04+Math.random()*0.06,
    hue: Math.random()<0.5 ? 175 : Math.random()<0.5 ? 195 : 215,
  });
}

// Drifting particles (marine snow)
const snow = [];
for(let i=0;i<35;i++){
  snow.push({
    x: Math.random()*W,
    y: Math.random()*H,
    r: 0.8+Math.random()*2,
    vy: 0.12+Math.random()*0.22,
    vx: (Math.random()-0.5)*0.15,
    sway: Math.random()*Math.PI*2,
    swaySpeed: 0.01+Math.random()*0.015,
    a: 0.1+Math.random()*0.2,
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   MAIN LOOP
   ═══════════════════════════════════════════════════════════════════════════ */
let t=0;

function loop(){
  t+=0.016;

  /* ── CAUSTICS ── */
  causticCtx.clearRect(0,0,W,H);
  causticCtx.globalCompositeOperation='screen';
  for(const c of caustics){
    c.phase+=c.speed;
    c.x+=c.vx; c.y+=c.vy;
    c.rot+=c.rotV;
    if(c.x<-200) c.x=W+200;
    if(c.x>W+200) c.x=-200;
    if(c.y<800) c.y=H;
    if(c.y>H+100) c.y=800;
    const pulse=0.6+Math.sin(c.phase)*0.4;
    const g=causticCtx.createRadialGradient(c.x,c.y,0,c.x,c.y,c.rx);
    g.addColorStop(0,`rgba(100,220,255,${c.a*pulse})`);
    g.addColorStop(0.4,`rgba(60,180,230,${c.a*pulse*0.5})`);
    g.addColorStop(1,'rgba(0,100,180,0)');
    causticCtx.save();
    causticCtx.translate(c.x,c.y);
    causticCtx.rotate(c.rot);
    causticCtx.translate(-c.x,-c.y);
    causticCtx.fillStyle=g;
    causticCtx.beginPath();
    causticCtx.ellipse(c.x,c.y,c.rx,c.ry,0,0,Math.PI*2);
    causticCtx.fill();
    causticCtx.restore();
  }
  causticCtx.globalCompositeOperation='source-over';

  /* ── RING: Bubble spiral + crown ── */
  ringCtx.clearRect(0,0,W,H);

  // Deep ambient ring glow
  const ringA=0.55+Math.sin(t*1.5)*0.2;
  const rg=ringCtx.createRadialGradient(RING_CX,RING_CY,RING_R-20,RING_CX,RING_CY,RING_R+180);
  rg.addColorStop(0,`rgba(0,200,220,${ringA*0.18})`);
  rg.addColorStop(0.4,`rgba(0,160,200,${ringA*0.08})`);
  rg.addColorStop(1,'rgba(0,0,0,0)');
  ringCtx.fillStyle=rg;
  ringCtx.beginPath(); ringCtx.arc(RING_CX,RING_CY,RING_R+180,0,Math.PI*2); ringCtx.fill();

  // Crown orbs
  for(const orb of crownOrbs){
    orb.phase+=orb.speed;
    const pulse=0.5+Math.sin(orb.phase)*0.5;
    const ox=RING_CX+Math.cos(orb.ang)*RING_R;
    const oy=RING_CY+Math.sin(orb.ang)*RING_R;
    const og=ringCtx.createRadialGradient(ox,oy,0,ox,oy,orb.r*4);
    og.addColorStop(0,`hsla(${orb.hue},90%,80%,${pulse*0.9})`);
    og.addColorStop(0.4,`hsla(${orb.hue},85%,65%,${pulse*0.4})`);
    og.addColorStop(1,'rgba(0,0,0,0)');
    ringCtx.fillStyle=og;
    ringCtx.beginPath(); ringCtx.arc(ox,oy,orb.r*4,0,Math.PI*2); ringCtx.fill();
    ringCtx.fillStyle=`hsla(${orb.hue},90%,85%,${pulse*0.95})`;
    ringCtx.beginPath(); ringCtx.arc(ox,oy,orb.r,0,Math.PI*2); ringCtx.fill();
  }

  // Spiral bubbles
  for(const b of spiralBubbles){
    b.angle+=b.speed;
    b.wobble+=b.wobbleSpeed;
    b.y-=b.riseSpeed;
    // When bubble rises above ring, reset it below
    if(b.y < RING_CY-RING_R-100){
      b.y=RING_CY+RING_R+80+Math.random()*200;
      b.angle=(b.angle+Math.PI/4)%(Math.PI*2);
    }
    const bx=RING_CX+Math.cos(b.angle)*b.baseR+Math.sin(b.wobble)*b.wobbleAmp;
    const by=b.y;
    const pulse=0.7+Math.sin(b.phase+t*2)*0.3;
    ringCtx.save();
    ringCtx.shadowBlur=b.r*3; ringCtx.shadowColor=`rgba(0,220,255,${b.opacity*0.6})`;
    // Bubble outline
    ringCtx.strokeStyle=`rgba(150,240,255,${b.opacity*pulse})`;
    ringCtx.lineWidth=1.2;
    ringCtx.beginPath(); ringCtx.arc(bx,by,b.r,0,Math.PI*2); ringCtx.stroke();
    // Internal highlight
    ringCtx.fillStyle=`rgba(220,250,255,${b.opacity*0.25})`;
    ringCtx.beginPath(); ringCtx.arc(bx-b.r*0.3,by-b.r*0.3,b.r*0.4,0,Math.PI*2); ringCtx.fill();
    ringCtx.restore();
  }

  /* ── CREATURES: Jellyfish + Fish ── */
  creatureCtx.clearRect(0,0,W,H);

  // Update + draw jellyfish
  for(const jf of jellyfish){
    jf.x+=jf.vx;
    jf.y+=jf.vy+Math.sin(jf.phase+t*0.5)*0.2;
    jf.phase+=0.02;
    if(jf.x<-100) jf.x=W+100;
    if(jf.x>W+100) jf.x=-100;
    if(jf.y<150) jf.vy=Math.abs(jf.vy);
    if(jf.y>900) jf.vy=-Math.abs(jf.vy);
    drawJellyfish(creatureCtx, jf, t);
  }

  // School behavior — fish loosely follow school center
  for(const f of fish){
    f.wig+=f.wigSpeed;
    // Gentle school cohesion
    const schoolmates=fish.filter(o=>o!==f && o.school===f.school);
    if(schoolmates.length>0){
      const cx=schoolmates.reduce((s,o)=>s+o.x,0)/schoolmates.length;
      const cy=schoolmates.reduce((s,o)=>s+o.y,0)/schoolmates.length;
      f.vx+=(cx-f.x)*0.0002;
      f.vy+=(cy-f.y)*0.0002;
    }
    // Speed limit
    const spd=Math.hypot(f.vx,f.vy);
    if(spd>2.5){f.vx=f.vx/spd*2.5;f.vy=f.vy/spd*2.5;}
    if(spd<0.4){f.vx*=1.05;f.vy*=1.05;}
    // Boundary
    if(f.x<-40) f.x=W+40;
    if(f.x>W+40) f.x=-40;
    if(f.y<200) f.vy=Math.abs(f.vy)*0.8;
    if(f.y>1600) f.vy=-Math.abs(f.vy)*0.8;
    f.x+=f.vx; f.y+=f.vy;
    drawFish(creatureCtx, f);
  }

  /* ── PARTICLES: Bubbles, Plankton, Snow ── */
  partCtx.clearRect(0,0,W,H);

  // Rising bubbles
  for(let i=0;i<bubbles.length;i++){
    const b=bubbles[i];
    b.sway+=b.swaySpeed;
    b.x+=b.vx+Math.sin(b.sway)*b.swayAmp*0.04;
    b.y+=b.vy;
    if(b.y<-20) bubbles[i]=mkBubble(false);
    // Stroke circle (bubbles are hollow)
    partCtx.strokeStyle=`rgba(180,240,255,${b.a})`;
    partCtx.lineWidth=1.2;
    partCtx.beginPath(); partCtx.arc(b.x,b.y,b.r,0,Math.PI*2); partCtx.stroke();
    // Highlight
    partCtx.fillStyle=`rgba(240,255,255,${b.a*0.35})`;
    partCtx.beginPath(); partCtx.arc(b.x-b.r*0.3,b.y-b.r*0.3,b.r*0.35,0,Math.PI*2); partCtx.fill();
  }

  // Plankton
  partCtx.save();
  for(const p of plankton){
    p.phase+=p.speed;
    p.x+=p.vx+Math.sin(p.phase*0.5)*0.08;
    p.y+=p.vy;
    if(p.x<0) p.x=W; if(p.x>W) p.x=0;
    if(p.y<0) p.y=H; if(p.y>H) p.y=0;
    const glow=0.3+Math.sin(p.phase)*0.4;
    partCtx.shadowBlur=6; partCtx.shadowColor=`hsla(${p.hue},90%,70%,0.8)`;
    partCtx.fillStyle=`hsla(${p.hue},90%,75%,${glow})`;
    partCtx.beginPath(); partCtx.arc(p.x,p.y,p.r,0,Math.PI*2); partCtx.fill();
  }
  partCtx.shadowBlur=0;
  partCtx.restore();

  // Marine snow
  for(const s of snow){
    s.sway+=s.swaySpeed;
    s.x+=s.vx+Math.sin(s.sway)*0.4;
    s.y+=s.vy;
    if(s.y>H+10) s.y=-10;
    if(s.x<0) s.x=W; if(s.x>W) s.x=0;
    partCtx.fillStyle=`rgba(200,235,255,${s.a})`;
    partCtx.beginPath(); partCtx.arc(s.x,s.y,s.r,0,Math.PI*2); partCtx.fill();
  }

  requestAnimationFrame(loop);
}

loop();
</script>
