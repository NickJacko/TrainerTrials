<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Catch Banner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:transparent;overflow:hidden;
  width:100vw;height:88px;
  display:flex;align-items:center;
}

.wrap{
  width:100%;height:88px;
  display:flex;align-items:center;
  padding:0 16px;
  position:relative;
}

.wrap::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,
    rgba(10,6,30,0.9) 0%,
    rgba(10,6,30,0.7) 8%,
    rgba(10,6,30,0.5) 15%,
    rgba(10,6,30,0.3) 30%,
    rgba(10,6,30,0.15) 60%,
    transparent 100%);
  pointer-events:none;
}

.wrap::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,
    rgba(102,126,234,0.8) 0%,
    rgba(78,205,196,0.6) 30%,
    rgba(255,215,0,0.3) 60%,
    transparent 100%);
  animation:lineAnim 6s ease-in-out infinite alternate;
}
@keyframes lineAnim{0%{opacity:0.6;transform:scaleX(0.7);transform-origin:left}100%{opacity:1;transform:scaleX(1);transform-origin:left}}

.badge{
  flex-shrink:0;display:flex;align-items:center;gap:10px;
  margin-right:20px;position:relative;z-index:1;
}
.dot{
  width:9px;height:9px;border-radius:50%;background:#ff6b6b;
  box-shadow:0 0 10px rgba(255,107,107,1),0 0 24px rgba(255,107,107,0.5);
  animation:dp 1.3s ease-in-out infinite;
}
@keyframes dp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.2;transform:scale(0.6)}}
.badge-txt{font-size:15px;font-weight:900;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,0.35);}

.car{
  flex:1;overflow:hidden;height:100%;
  display:flex;align-items:center;
  position:relative;z-index:1;
  mask-image:linear-gradient(90deg,transparent,black 2%,black 88%,transparent);
  -webkit-mask-image:linear-gradient(90deg,transparent,black 2%,black 88%,transparent);
}
.track{position:relative;width:100%;height:100%;}

.item{
  position:absolute;inset:0;
  display:flex;align-items:center;gap:14px;padding:0 4px;
  opacity:0;
  transition:opacity 0.55s ease,transform 0.55s cubic-bezier(0.22,1,0.36,1);
  transform:translateY(12px);
}
.item.on{opacity:1;transform:translateY(0)}
.item.off{opacity:0;transform:translateY(-12px)}

.spr{
  width:50px;height:50px;object-fit:contain;flex-shrink:0;
  filter:drop-shadow(0 0 8px rgba(255,255,255,0.25));
  animation:sprIn 0.5s cubic-bezier(0.22,1,0.36,1);
}
@keyframes sprIn{from{transform:scale(0.4) rotate(-10deg);opacity:0}to{transform:scale(1);opacity:1}}

.txt{
  font-size:20px;font-weight:600;letter-spacing:-0.1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
  color:rgba(255,255,255,0.85);
}
.cn{font-weight:900}
.nk{color:#FFD700;text-shadow:0 0 14px rgba(255,215,0,0.7)}
.nf{color:#ff8c7a;text-shadow:0 0 12px rgba(255,140,122,0.6)}
.nd{color:#7ec8ff;text-shadow:0 0 12px rgba(126,200,255,0.5)}
.ns{color:#7ddb88;text-shadow:0 0 10px rgba(125,219,136,0.5)}
.rc{color:rgba(255,255,255,0.9)}
.rr{color:#90caf9;text-shadow:0 0 8px rgba(144,202,249,0.4)}
.rs{color:#a5d6a7;text-shadow:0 0 8px rgba(165,214,167,0.4)}
.rl{color:#ffcc80;text-shadow:0 0 10px rgba(255,204,128,0.5)}
.rm{color:#ce93d8;text-shadow:0 0 12px rgba(206,147,216,0.6)}
.rg{color:#ff80ab;text-shadow:0 0 14px rgba(255,128,171,0.7)}
.verb{color:rgba(255,255,255,0.35);font-weight:400}
.shiny{color:#FFD700;text-shadow:0 0 10px rgba(255,215,0,0.8);animation:st 1.5s ease-in-out infinite}
@keyframes st{0%,100%{opacity:1}50%{opacity:0.4}}
.ago{font-size:14px;color:rgba(255,255,255,0.2);font-weight:700;flex-shrink:0;letter-spacing:0.5px}
.url{color:#4ecdc4;font-weight:800;text-shadow:0 0 10px rgba(78,205,196,0.6)}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge"><div class="dot"></div><div class="badge-txt">Live</div></div>
  <div class="car"><div class="track" id="T"></div></div>
</div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import{getDatabase,ref,onValue,query,orderByChild,limitToLast}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
const db=getDatabase(initializeApp({apiKey:"AIzaSyDdStpC5rVtgaZ4XvtKLwQttnyIDXL2z7Q",authDomain:"trainertrials.firebaseapp.com",databaseURL:"https://trainertrials-default-rtdb.europe-west1.firebasedatabase.app",projectId:"trainertrials",storageBucket:"trainertrials.firebasestorage.app",messagingSenderId:"22071275267",appId:"1:22071275267:web:92e82d6bfaee169aff8336"}));
const SITE='trainertrials.github.io/TrainerTrials',IV=4200,PE=6;
let cs=[],idx=0,cur=null,pc=0;
const cap=s=>String(s??'').charAt(0).toUpperCase()+String(s??'').slice(1);
const nc=d=>d>=2500?'nk':d>=500?'nf':d>=250?'nd':d>=50?'ns':'';
const rc=r=>({common:'rc',rare:'rr',starter:'rs',legendary:'rl',mythical:'rm',god:'rg'}[(r||'common').toLowerCase()]||'rc');
const ta=t=>{const s=(Date.now()-t)/1000;return s<60?'now':s<3600?Math.floor(s/60)+'m':Math.floor(s/3600)+'h';};
function mkItem(e){
  const d=document.createElement('div');d.className=`item r-${(e.rarity||'common').toLowerCase()}`;
  if(e.sprite){const i=document.createElement('img');i.className='spr';i.src=e.sprite;i.onerror=()=>i.remove();d.appendChild(i);}
  const t=document.createElement('div');t.className='txt';
  const n=nc(e.donation||0);
  t.innerHTML=`<span class="cn ${n}">${cap(e.catcher)}</span><span class="verb"> caught </span><span class="${rc(e.rarity)} cn">${cap(e.catchmon)}</span><span class="verb"> · Lv${e.level||1}</span>${e.shiny?'<span class="shiny"> ✦</span>':''}`;
  d.appendChild(t);
  if(e.caught_at){const a=document.createElement('div');a.className='ago';a.textContent=ta(e.caught_at);d.appendChild(a);}
  return d;
}
function mkPromo(){
  const d=document.createElement('div');d.className='item';
  d.innerHTML=`<div class="txt"><span class="verb">Check your team → </span><span class="url">${SITE}</span></div>`;
  return d;
}
function next(){
  const T=document.getElementById('T');
  if(cur){cur.classList.remove('on');cur.classList.add('off');const o=cur;setTimeout(()=>o.remove(),600);}
  let el;pc++;
  if(!cs.length||pc%PE===0){el=mkPromo();}
  else{el=mkItem(cs[idx]);idx=(idx+1)%cs.length;}
  T.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('on')));
  cur=el;
}
onValue(query(ref(db,'catches/recent'),orderByChild('caught_at'),limitToLast(30)),s=>{
  const d=s.val();
  cs=d?Object.values(d).sort((a,b)=>b.caught_at-a.caught_at):[];
  idx=Math.min(idx,Math.max(0,cs.length-1));
});
next();setInterval(next,IV);
</script>
</body>
</html>
