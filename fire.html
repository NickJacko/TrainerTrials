<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Fire — Vulkankrater bei Nacht</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:1080px;height:1920px;overflow:hidden;
    background:radial-gradient(ellipse 100% 80% at 50% 100%, #3a0800 0%, #1e0400 45%, #0d0100 100%);
  }
  canvas{position:absolute;inset:0;width:1080px;height:1920px;display:block;}

  /* Sky layers */
  .sky{
    position:absolute;top:0;left:0;right:0;height:800px;
    background:
      radial-gradient(ellipse 900px 350px at 50% -80px, rgba(30,8,2,0.95) 0%, transparent 70%),
      radial-gradient(ellipse 600px 200px at 20% 250px, rgba(50,15,5,0.7) 0%, transparent 65%),
      radial-gradient(ellipse 500px 180px at 82% 180px, rgba(45,12,4,0.65) 0%, transparent 60%),
      radial-gradient(ellipse 800px 300px at 65% 400px, rgba(35,10,3,0.6) 0%, transparent 65%);
  }

  /* Distant volcano silhouettes */
  .volc-far-l{
    position:absolute;bottom:1050px;left:-60px;width:420px;height:280px;
    background:#0a0100;
    clip-path:polygon(0 100%, 0 72%, 30% 45%, 42% 50%, 52% 28%, 64% 48%, 78% 38%, 90% 52%, 100% 60%, 100% 100%);
    opacity:0.75;
  }
  .volc-far-r{
    position:absolute;bottom:1070px;right:-40px;width:380px;height:240px;
    background:#0a0100;
    clip-path:polygon(0 62%, 10% 50%, 24% 38%, 36% 52%, 50% 30%, 62% 48%, 76% 42%, 88% 55%, 100% 65%, 100% 100%, 0 100%);
    opacity:0.7;
  }
  /* Glow on distant volcano craters */
  .volc-glow-l{
    position:absolute;bottom:1295px;left:155px;width:140px;height:40px;
    background:radial-gradient(ellipse 80% 60% at 50% 100%, rgba(255,60,0,0.45) 0%, transparent 100%);
    filter:blur(8px);
    animation:distVolcPulse 7s ease-in-out infinite;
  }
  .volc-glow-r{
    position:absolute;bottom:1280px;right:80px;width:120px;height:35px;
    background:radial-gradient(ellipse 80% 60% at 50% 100%, rgba(255,50,0,0.35) 0%, transparent 100%);
    filter:blur(7px);
    animation:distVolcPulse 9s ease-in-out infinite reverse;
  }
  @keyframes distVolcPulse{
    0%,100%{opacity:0.6}50%{opacity:1}
  }

  /* Main crater rim */
  .rim-l{
    position:absolute;bottom:0;left:0;width:580px;height:700px;
    background:#090100;
    clip-path:polygon(0 100%, 0 48%, 5% 38%, 12% 44%, 20% 34%, 30% 40%, 40% 30%, 52% 37%, 62% 29%, 72% 36%, 83% 30%, 92% 38%, 100% 48%, 100% 100%);
  }
  .rim-r{
    position:absolute;bottom:0;right:0;width:620px;height:640px;
    background:#090100;
    clip-path:polygon(0 50%, 8% 40%, 18% 46%, 28% 35%, 40% 42%, 52% 32%, 64% 40%, 76% 34%, 86% 42%, 94% 36%, 100% 44%, 100% 100%, 0 100%);
  }
  /* Crater rim edge glow */
  .rim-glow-l{
    position:absolute;bottom:680px;left:0;width:580px;height:60px;
    background:linear-gradient(90deg,
      transparent 0%,
      rgba(255,70,0,0.0) 5%,
      rgba(255,70,0,0.25) 20%,
      rgba(255,90,0,0.35) 40%,
      rgba(255,70,0,0.15) 60%,
      transparent 80%);
    filter:blur(12px);mix-blend-mode:screen;
    animation:rimGlow 5s ease-in-out infinite;
  }
  .rim-glow-r{
    position:absolute;bottom:620px;right:0;width:620px;height:55px;
    background:linear-gradient(270deg,
      transparent 0%,
      rgba(255,70,0,0.0) 5%,
      rgba(255,70,0,0.25) 20%,
      rgba(255,90,0,0.3) 40%,
      rgba(255,70,0,0.12) 65%,
      transparent 85%);
    filter:blur(10px);mix-blend-mode:screen;
    animation:rimGlow 6.5s ease-in-out infinite reverse;
  }
  @keyframes rimGlow{
    0%,100%{opacity:0.6}50%{opacity:1}
  }

  /* Lava pool lower area */
  .lava-pool{
    position:absolute;bottom:0;left:0;right:0;height:820px;
    background:
      radial-gradient(ellipse 90% 50% at 50% 90%, rgba(255,90,0,0.55) 0%, rgba(220,50,0,0.3) 30%, transparent 65%),
      radial-gradient(ellipse 70% 35% at 30% 85%, rgba(255,60,0,0.4) 0%, transparent 55%),
      radial-gradient(ellipse 60% 30% at 75% 88%, rgba(255,70,0,0.35) 0%, transparent 50%),
      linear-gradient(0deg, rgba(180,30,0,0.5) 0%, transparent 60%);
    mix-blend-mode:screen;
    filter:blur(30px);
    animation:lavaPoolPulse 3.5s ease-in-out infinite;
  }
  @keyframes lavaPoolPulse{
    0%,100%{opacity:0.7;transform:scaleX(1)}
    50%{opacity:1;transform:scaleX(1.03)}
  }

  /* Eruption glow pulse — periodic */
  .erupt-glow{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:1500px;height:1200px;
    background:radial-gradient(ellipse 40% 35% at 50% 85%, rgba(255,80,0,0.38) 0%, transparent 60%);
    mix-blend-mode:screen;filter:blur(60px);
    animation:eruptCycle 11s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes eruptCycle{
    0%{opacity:0}8%{opacity:0.9}18%{opacity:0.3}100%{opacity:0}
  }

  /* Scene-wide lava light flicker */
  .scene-light{
    position:absolute;inset:0;
    background:radial-gradient(ellipse 100% 60% at 50% 100%, rgba(255,60,0,0.14) 0%, transparent 55%);
    mix-blend-mode:screen;
    animation:sceneFlicker 3s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes sceneFlicker{
    0%,100%{opacity:0.6}25%{opacity:1}50%{opacity:0.7}75%{opacity:0.95}
  }

  /* Heat haze around spawn ring */
  .heat-ring{
    position:absolute;top:230px;left:50%;transform:translateX(-50%);
    width:760px;height:760px;
    border-radius:50%;
    background:radial-gradient(ellipse 100% 100% at 50% 50%,
      transparent 55%,
      rgba(255,80,0,0.04) 62%,
      rgba(255,100,20,0.08) 68%,
      rgba(255,80,0,0.04) 74%,
      transparent 82%);
    mix-blend-mode:screen;
    filter:blur(6px);
    animation:heatPulse 2s ease-in-out infinite;
  }
  @keyframes heatPulse{
    0%,100%{opacity:0.6;transform:translateX(-50%) scale(1)}
    50%{opacity:1;transform:translateX(-50%) scale(1.02)}
  }

  /* UI zones */
  .center-darken{position:absolute;top:300px;left:50%;transform:translateX(-50%);width:780px;height:540px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(10,0,0,0.4) 0%,transparent 70%);z-index:38;}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 40%,rgba(0,0,0,0.65) 100%);z-index:39;pointer-events:none;}
  .zone-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(0,0,0,0.55) 0%,transparent 100%);z-index:40;}
  .zone-bot{position:absolute;bottom:0;left:0;right:0;height:920px;background:linear-gradient(0deg,rgba(0,0,0,0.55) 0%,rgba(0,0,0,0.12) 40%,transparent 100%);z-index:40;}
</style>
</head>
<body>
  <div class="sky"></div>
  <div class="volc-far-l"></div>
  <div class="volc-far-r"></div>
  <div class="volc-glow-l"></div>
  <div class="volc-glow-r"></div>

  <!-- Canvas stack: bg → cracks → smoke/ash → ring-flames → sparks/embers -->
  <canvas id="cBg"></canvas>
  <canvas id="cCracks"></canvas>
  <canvas id="cAtmos"></canvas>
  <canvas id="cRing"></canvas>
  <canvas id="cParticles"></canvas>

  <div class="lava-pool"></div>
  <div class="erupt-glow"></div>
  <div class="scene-light"></div>
  <div class="rim-l"></div>
  <div class="rim-r"></div>
  <div class="rim-glow-l"></div>
  <div class="rim-glow-r"></div>
  <div class="heat-ring"></div>
  <div class="center-darken"></div>
  <div class="vignette"></div>
  <div class="zone-top"></div>
  <div class="zone-bot"></div>

<script>
const W=1080,H=1920;
const RING_CX=540,RING_CY=590,RING_R=300;

function mkCanvas(id){
  const c=document.getElementById(id);
  c.width=W;c.height=H;
  return c.getContext('2d');
}
const bgCtx=mkCanvas('cBg');
const crackCtx=mkCanvas('cCracks');
const atmosCtx=mkCanvas('cAtmos');
const ringCtx=mkCanvas('cRing');
const partCtx=mkCanvas('cParticles');

/* ─────────── BG: Static lava texture strokes ─────────── */
function drawBgLava(){
  const ctx=bgCtx;
  ctx.clearRect(0,0,W,H);
  // Dark lava texture in lower area
  ctx.save();
  for(let i=0;i<35;i++){
    const x=Math.random()*W;
    const y=1300+Math.random()*620;
    const w=60+Math.random()*200;
    const h=8+Math.random()*20;
    const alpha=0.04+Math.random()*0.08;
    const g=ctx.createRadialGradient(x,y,0,x,y,w*0.7);
    g.addColorStop(0,`rgba(255,${60+Math.random()*80},0,${alpha})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.ellipse(x,y,w,h,Math.random()*Math.PI,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}
drawBgLava();

/* ─────────── CRACKS: Lava crack network ─────────── */
const cracks=[];
function buildCrack(x,y,len,ang,depth){
  const pts=[{x,y}];
  let cx=x,cy=y,a=ang;
  const segs=Math.ceil(len/18);
  for(let i=0;i<segs;i++){
    a+=(Math.random()-0.5)*0.45;
    cx+=Math.cos(a)*18;
    cy+=Math.sin(a)*18;
    pts.push({x:cx,y:cy});
  }
  cracks.push({pts,phase:Math.random()*Math.PI*2,speed:0.018+Math.random()*0.025,width:depth===0?3.5:2});
  if(depth<3&&Math.random()<0.65){
    const mid=pts[Math.floor(pts.length*0.45)];
    buildCrack(mid.x,mid.y,len*0.55,ang+(Math.random()<0.5?1:-1)*(0.7+Math.random()*0.5),depth+1);
  }
}
// Main cracks spread across lower lava field
const crackSeeds=[
  [120,1680,260],[280,1520,210],[420,1780,200],[540,1600,280],
  [660,1720,220],[800,1560,240],[960,1680,200],[350,1850,180],[750,1840,170]
];
for(const [x,y,len] of crackSeeds){
  buildCrack(x+Math.random()*60-30,y+Math.random()*40-20,len,Math.random()*Math.PI*2,0);
}

/* ─────────── SMOKE & ASH ─────────── */
const smokeParticles=[];
function mkSmoke(i){
  const fromRing=i<30;
  return{
    fromRing,
    x:fromRing ? RING_CX+(Math.random()-0.5)*260 : 80+Math.random()*920,
    y:fromRing ? RING_CY+200+Math.random()*100 : 1300+Math.random()*300,
    r:fromRing ? 25+Math.random()*55 : 35+Math.random()*80,
    vx:(Math.random()-0.5)*0.4,
    vy:fromRing ? -(0.5+Math.random()*0.9) : -(0.3+Math.random()*0.5),
    life:Math.random(),
    maxA:fromRing ? 0.12+Math.random()*0.14 : 0.1+Math.random()*0.18,
    hue:fromRing ? 10+Math.random()*12 : 5+Math.random()*10
  };
}
for(let i=0;i<75;i++) smokeParticles.push(mkSmoke(i));

/* Ash — falls from top */
const ash=[];
for(let i=0;i<55;i++){
  ash.push({
    x:Math.random()*W,y:Math.random()*H,
    r:0.8+Math.random()*2.2,
    vx:-0.2+Math.random()*0.4,
    vy:0.3+Math.random()*0.7,
    a:0.15+Math.random()*0.3,
    flutter:Math.random()*Math.PI*2,
    fs:0.02+Math.random()*0.03
  });
}

/* ─────────── RING FLAMES: circular flame crown ─────────── */
const FLAME_COUNT=26;
const flames=[];
for(let i=0;i<FLAME_COUNT;i++){
  const baseAngle=(i/FLAME_COUNT)*Math.PI*2;
  flames.push({
    baseAngle,
    orbitR:RING_R+58,
    height:55+Math.random()*80,
    width:22+Math.random()*18,
    phase:Math.random()*Math.PI*2,
    speed:0.04+Math.random()*0.05,
    sway:0.12+Math.random()*0.2,
    swayPhase:Math.random()*Math.PI*2
  });
}

/* ─────────── EMBERS ─────────── */
const embers=[];
function mkEmber(){
  const fromRing=Math.random()<0.4;
  const ang=Math.random()*Math.PI*2;
  const dist=fromRing ? RING_R+40+Math.random()*80 : 0;
  return{
    x:fromRing ? RING_CX+Math.cos(ang)*dist : 100+Math.random()*880,
    y:fromRing ? RING_CY+Math.sin(ang)*dist : 1400+Math.random()*350,
    r:0.8+Math.random()*2.8,
    vx:(Math.random()-0.5)*1.2,
    vy:-(0.7+Math.random()*2.0),
    life:1,decay:0.003+Math.random()*0.006,
    flick:Math.random()*Math.PI*2,
    flickSpeed:0.1+Math.random()*0.15,
    hue:Math.random()<0.6 ? 25 : 45,
    sat:Math.random()<0.6 ? 100 : 80,
    lum:Math.random()<0.6 ? 55 : 65
  };
}
for(let i=0;i<120;i++){
  const e=mkEmber();
  e.life=Math.random();
  e.y=100+Math.random()*(H-100);
  embers.push(e);
}

/* ─────────── SPARKS from lava pool ─────────── */
const sparks=[];
let sparkTimer=0;
let eruptTimer=0;
let isErupting=false;
let eruptIntensity=0;

/* ─────────── LAVA SPLATTER (periodic) ─────────── */
const splats=[];
let splatTimer=0;
let nextSplat=4+Math.random()*4;

/* ─────────── GROUND SPARKS under ring ─────────── */
const groundSparks=[];
for(let i=0;i<30;i++){
  groundSparks.push({
    x:RING_CX+(Math.random()-0.5)*240,
    y:RING_CY+RING_R-20+Math.random()*80,
    vx:(Math.random()-0.5)*0.8,
    vy:-(0.4+Math.random()*0.8),
    life:Math.random(),
    decay:0.008+Math.random()*0.012,
    r:0.6+Math.random()*1.5
  });
}

/* ─────────── MAIN LOOP ─────────── */
let t=0,frame=0;

function loop(){
  t+=0.016;frame++;

  /* ── CRACKS ── */
  crackCtx.clearRect(0,0,W,H);
  for(const ck of cracks){
    ck.phase+=ck.speed;
    const pulse=0.55+Math.sin(ck.phase)*0.45;
    // outer glow
    crackCtx.save();
    crackCtx.shadowBlur=18;crackCtx.shadowColor=`rgba(255,100,0,${pulse*0.8})`;
    crackCtx.strokeStyle=`rgba(255,${70+pulse*80},0,${pulse*0.9})`;
    crackCtx.lineWidth=ck.width+1;crackCtx.lineCap='round';crackCtx.lineJoin='round';
    crackCtx.beginPath();
    crackCtx.moveTo(ck.pts[0].x,ck.pts[0].y);
    for(let i=1;i<ck.pts.length;i++) crackCtx.lineTo(ck.pts[i].x,ck.pts[i].y);
    crackCtx.stroke();
    // bright core
    crackCtx.shadowBlur=0;
    crackCtx.strokeStyle=`rgba(255,240,180,${pulse*0.85})`;
    crackCtx.lineWidth=ck.width*0.35;
    crackCtx.stroke();
    crackCtx.restore();
  }

  /* ── ATMOS: Smoke + Ash ── */
  atmosCtx.clearRect(0,0,W,H);
  // Smoke
  for(let i=0;i<smokeParticles.length;i++){
    const s=smokeParticles[i];
    s.x+=s.vx;s.y+=s.vy;s.life+=0.0035;
    if(s.life>1){
      smokeParticles[i]=mkSmoke(i);
      continue;
    }
    const alpha=s.maxA*Math.sin(s.life*Math.PI)*0.9;
    if(alpha<0.005) continue;
    const g=atmosCtx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r);
    g.addColorStop(0,`hsla(${s.hue},35%,12%,${alpha})`);
    g.addColorStop(0.5,`hsla(${s.hue},30%,8%,${alpha*0.5})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    atmosCtx.fillStyle=g;
    atmosCtx.beginPath();atmosCtx.arc(s.x,s.y,s.r,0,Math.PI*2);atmosCtx.fill();
  }
  // Ash
  for(const a of ash){
    a.flutter+=a.fs;
    a.x+=a.vx+Math.sin(a.flutter)*0.3;
    a.y+=a.vy;
    if(a.y>H+10) a.y=-10;
    if(a.x<-10) a.x=W+10;
    if(a.x>W+10) a.x=-10;
    atmosCtx.fillStyle=`rgba(60,20,10,${a.a})`;
    atmosCtx.beginPath();atmosCtx.arc(a.x,a.y,a.r,0,Math.PI*2);atmosCtx.fill();
  }

  /* ── RING FLAMES ── */
  ringCtx.clearRect(0,0,W,H);

  // Outer ring glow
  const ringGlowPulse=0.6+Math.sin(t*2.2)*0.4;
  const rg=ringCtx.createRadialGradient(RING_CX,RING_CY,RING_R+20,RING_CX,RING_CY,RING_R+160);
  rg.addColorStop(0,`rgba(255,80,0,${0.25*ringGlowPulse})`);
  rg.addColorStop(0.5,`rgba(255,50,0,${0.1*ringGlowPulse})`);
  rg.addColorStop(1,'rgba(0,0,0,0)');
  ringCtx.fillStyle=rg;
  ringCtx.beginPath();ringCtx.arc(RING_CX,RING_CY,RING_R+160,0,Math.PI*2);ringCtx.fill();

  // Individual flames
  for(const fl of flames){
    fl.phase+=fl.speed;
    fl.swayPhase+=fl.speed*0.7;
    const sway=Math.sin(fl.swayPhase)*fl.sway;
    const flickH=0.7+Math.sin(fl.phase)*0.3;
    const angle=fl.baseAngle+sway;
    const bx=RING_CX+Math.cos(fl.baseAngle)*fl.orbitR;
    const by=RING_CY+Math.sin(fl.baseAngle)*fl.orbitR;
    const tipX=bx+Math.cos(angle)*fl.height*flickH*0.3;
    const tipY=by-fl.height*flickH;
    const lx=bx+Math.cos(angle+0.5)*fl.width*0.5;
    const ly=by+fl.width*0.15;
    const rx=bx+Math.cos(angle-0.5)*fl.width*0.5;
    const ry=by+fl.width*0.15;

    ringCtx.save();
    const fg=ringCtx.createLinearGradient(bx,by,tipX,tipY);
    fg.addColorStop(0,'rgba(255,200,20,0.95)');
    fg.addColorStop(0.2,'rgba(255,110,0,0.88)');
    fg.addColorStop(0.6,'rgba(255,50,0,0.55)');
    fg.addColorStop(1,'rgba(200,20,0,0)');
    ringCtx.shadowBlur=24;ringCtx.shadowColor='rgba(255,100,0,0.7)';
    ringCtx.fillStyle=fg;
    ringCtx.beginPath();
    ringCtx.moveTo(tipX,tipY);
    ringCtx.bezierCurveTo(
      tipX+(lx-tipX)*0.5,tipY+(ly-tipY)*0.5,
      lx+(tipX-lx)*0.2,ly+(tipY-ly)*0.7,
      lx,ly
    );
    ringCtx.bezierCurveTo(lx+(bx-lx)*0.7,ly+(by-ly)*0.4,bx+(lx-bx)*0.3,by+(ly-by)*0.2,bx,by);
    ringCtx.bezierCurveTo(bx+(rx-bx)*0.3,by+(ry-by)*0.2,rx+(bx-rx)*0.7,ry+(by-ry)*0.4,rx,ry);
    ringCtx.bezierCurveTo(
      rx+(tipX-rx)*0.2,ry+(tipY-ry)*0.7,
      tipX+(rx-tipX)*0.5,tipY+(ry-tipY)*0.5,
      tipX,tipY
    );
    ringCtx.fill();
    // Bright core
    ringCtx.shadowBlur=0;
    ringCtx.strokeStyle='rgba(255,240,160,0.5)';
    ringCtx.lineWidth=1.2;
    ringCtx.beginPath();ringCtx.moveTo(bx,by);ringCtx.lineTo(tipX,tipY);ringCtx.stroke();
    ringCtx.restore();
  }

  // Ground sparks under ring
  for(const gs of groundSparks){
    gs.life-=gs.decay;
    gs.x+=gs.vx;gs.y+=gs.vy;
    if(gs.life<=0){
      gs.x=RING_CX+(Math.random()-0.5)*240;
      gs.y=RING_CY+RING_R-20+Math.random()*80;
      gs.vx=(Math.random()-0.5)*0.8;
      gs.vy=-(0.4+Math.random()*0.8);
      gs.life=0.7+Math.random()*0.3;
      gs.decay=0.008+Math.random()*0.012;
    }
    ringCtx.fillStyle=`rgba(255,${160+Math.random()*80},30,${gs.life*0.8})`;
    ringCtx.beginPath();ringCtx.arc(gs.x,gs.y,gs.r,0,Math.PI*2);ringCtx.fill();
  }

  /* ── PARTICLES: Embers, Sparks, Splats ── */
  partCtx.clearRect(0,0,W,H);

  // Erupt logic
  eruptTimer+=0.016;
  if(!isErupting && eruptTimer>10+Math.random()*6){
    isErupting=true;eruptIntensity=0;eruptTimer=0;
    // Spawn splat particles
    const ox=300+Math.random()*480;
    const oy=1480+Math.random()*200;
    for(let i=0;i<8+Math.floor(Math.random()*6);i++){
      splats.push({
        x:ox,y:oy,
        vx:(Math.random()-0.5)*5,
        vy:-(4+Math.random()*7),
        life:1,
        r:2+Math.random()*4,
        hue:20+Math.random()*30
      });
    }
  }
  if(isErupting){
    eruptIntensity+=0.05;
    if(eruptIntensity>=1){isErupting=false;eruptIntensity=0;}
  }

  // Sparks spawning
  sparkTimer+=0.016;
  const sparkRate=isErupting ? 1 : 3;
  if(sparkTimer>0.05){
    sparkTimer=0;
    for(let i=0;i<Math.ceil(2/sparkRate*(isErupting?3:1));i++){
      sparks.push({
        x:150+Math.random()*780,y:1450+Math.random()*350,
        vx:(Math.random()-0.5)*3.5,vy:-(2+Math.random()*5.5),
        life:1,decay:0.015+Math.random()*0.02,
        r:0.8+Math.random()*2
      });
    }
  }

  // Draw sparks
  partCtx.save();
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i];
    s.x+=s.vx;s.y+=s.vy;s.vy+=0.07;
    s.life-=s.decay;
    if(s.life<=0){sparks.splice(i,1);continue;}
    partCtx.shadowBlur=10;partCtx.shadowColor='rgba(255,140,0,0.8)';
    partCtx.fillStyle=`rgba(255,${130+Math.random()*120},40,${s.life})`;
    partCtx.beginPath();partCtx.arc(s.x,s.y,s.r,0,Math.PI*2);partCtx.fill();
  }
  partCtx.shadowBlur=0;

  // Draw splats
  for(let i=splats.length-1;i>=0;i--){
    const s=splats[i];
    s.x+=s.vx;s.y+=s.vy;s.vy+=0.2;s.life-=0.014;
    if(s.life<=0||s.y>H+50){splats.splice(i,1);continue;}
    partCtx.shadowBlur=16;partCtx.shadowColor=`rgba(255,${s.hue*3},0,0.9)`;
    partCtx.fillStyle=`rgba(255,${80+s.hue*2},10,${s.life})`;
    partCtx.beginPath();partCtx.arc(s.x,s.y,s.r,0,Math.PI*2);partCtx.fill();
  }
  partCtx.shadowBlur=0;

  // Embers
  for(let i=embers.length-1;i>=0;i--){
    const e=embers[i];
    e.x+=e.vx;e.y+=e.vy;e.flick+=e.flickSpeed;
    e.life-=e.decay;
    if(e.life<=0){
      embers[i]=mkEmber();
      continue;
    }
    const flick=(0.5+Math.sin(e.flick)*0.5)*e.life;
    partCtx.save();
    partCtx.shadowBlur=8;
    partCtx.shadowColor=`hsla(${e.hue},${e.sat}%,${e.lum}%,0.8)`;
    partCtx.fillStyle=`hsla(${e.hue},${e.sat}%,${e.lum}%,${flick})`;
    partCtx.beginPath();partCtx.arc(e.x,e.y,e.r,0,Math.PI*2);partCtx.fill();
    partCtx.restore();
  }

  requestAnimationFrame(loop);
}

loop();
</script>
