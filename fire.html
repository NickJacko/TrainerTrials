<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Fire — Vulkankrater bei Nacht</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#1a0400;}
  canvas{position:absolute;inset:0;width:1080px;height:1920px;display:block;}
  .bg{
    position:absolute;inset:0;
    background:
      radial-gradient(ellipse 80% 55% at 50% 60%, #661200 0%, #3a0800 35%, transparent 70%),
      radial-gradient(ellipse 120% 80% at 50% 100%, #801a00 0%, transparent 55%),
      linear-gradient(180deg, #1a0400 0%, #2d0800 30%, #3a0a00 60%, #2d0800 100%);
  }
  /* Ash/smoke sky */
  .sky-ash{
    position:absolute;top:0;left:0;right:0;height:700px;
    background:
      radial-gradient(ellipse 600px 200px at 30% 100px, rgba(60,20,10,0.6) 0%, transparent 60%),
      radial-gradient(ellipse 700px 280px at 75% 220px, rgba(80,30,15,0.5) 0%, transparent 65%),
      radial-gradient(ellipse 800px 300px at 20% 480px, rgba(40,12,5,0.7) 0%, transparent 60%);
    filter:blur(8px);
  }
  /* Crater rim silhouettes */
  .rim-l{
    position:absolute;bottom:0;left:0;width:520px;height:560px;
    background:#0a0200;
    clip-path:polygon(0 100%, 0 55%, 8% 42%, 18% 48%, 32% 38%, 45% 44%, 58% 36%, 70% 42%, 85% 38%, 100% 48%, 100% 100%);
  }
  .rim-r{
    position:absolute;bottom:0;right:0;width:580px;height:500px;
    background:#0a0200;
    clip-path:polygon(0 48%, 12% 40%, 25% 46%, 38% 38%, 52% 44%, 68% 40%, 82% 46%, 100% 52%, 100% 100%, 0 100%);
  }
  /* Central lava glow pool — behind spawn area must remain subtle */
  .lava-glow{
    position:absolute;top:540px;left:50%;transform:translateX(-50%);
    width:1200px;height:900px;
    background:radial-gradient(ellipse 50% 40% at 50% 60%, rgba(255,80,0,0.45) 0%, rgba(255,69,0,0.22) 30%, transparent 65%);
    filter:blur(40px);mix-blend-mode:screen;
    animation:lavaPulse 4s ease-in-out infinite;
  }
  @keyframes lavaPulse{
    0%,100%{opacity:0.75;transform:translateX(-50%) scale(1)}
    50%{opacity:1;transform:translateX(-50%) scale(1.04)}
  }

  .zone-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(0,0,0,0.65) 0%,transparent 100%);z-index:40;}
  .zone-bot{position:absolute;bottom:0;left:0;right:0;height:920px;background:linear-gradient(0deg,rgba(0,0,0,0.6) 0%,rgba(0,0,0,0.15) 40%,transparent 100%);z-index:40;}
  .center-darken{position:absolute;top:300px;left:50%;transform:translateX(-50%);width:780px;height:540px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(10,0,0,0.4) 0%,transparent 70%);z-index:38;}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 40%,rgba(0,0,0,0.6) 100%);z-index:39;pointer-events:none;}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="sky-ash"></div>
  <canvas id="cracks"></canvas>
  <div class="lava-glow"></div>
  <div class="rim-l"></div>
  <div class="rim-r"></div>
  <canvas id="smoke"></canvas>
  <canvas id="spark"></canvas>
  <canvas id="ember"></canvas>
  <div class="center-darken"></div>
  <div class="vignette"></div>
  <div class="zone-top"></div>
  <div class="zone-bot"></div>

<script>
const W=1080,H=1920;
function setup(id){const c=document.getElementById(id);c.width=W;c.height=H;return c.getContext('2d');}

// Lava cracks — pulsing hot lines on ground
const cr=setup('cracks');
const cracks=[];
function genCrack(x,y,len,ang,branch){
  const pts=[{x,y}];
  let cx=x,cy=y,a=ang;
  const segs=Math.floor(len/20);
  for(let i=0;i<segs;i++){
    a+=(Math.random()-0.5)*0.4;
    cx+=Math.cos(a)*20;cy+=Math.sin(a)*20;
    pts.push({x:cx,y:cy});
  }
  cracks.push({pts,ph:Math.random()*Math.PI*2,sp:0.02+Math.random()*0.02});
  if(branch>0&&Math.random()<0.6){
    genCrack(pts[Math.floor(pts.length/2)].x,pts[Math.floor(pts.length/2)].y,len*0.5,ang+(Math.random()<0.5?1:-1)*0.9,branch-1);
  }
}
for(let i=0;i<8;i++){
  genCrack(200+Math.random()*680,1400+Math.random()*400,150+Math.random()*250,Math.random()*Math.PI*2,2);
}

// Smoke columns
const sm=setup('smoke');
const smoke=[];
for(let i=0;i<60;i++){
  smoke.push({
    x:300+Math.random()*500,y:1400+Math.random()*300,
    r:30+Math.random()*60,a:0.15+Math.random()*0.2,
    vy:-0.4-Math.random()*0.6,vx:(Math.random()-0.5)*0.3,
    life:Math.random(),
    hue:15+Math.random()*15
  });
}

// Sparks — bright short-lived
const sp=setup('spark');
const sparks=[];

// Embers — slow-rising glowing dots
const em=setup('ember');
const embers=[];
for(let i=0;i<80;i++){
  embers.push({
    x:Math.random()*W,y:H+Math.random()*400,
    r:1+Math.random()*2.5,
    vy:-0.6-Math.random()*1.2,
    vx:(Math.random()-0.5)*0.5,
    life:Math.random(),
    flick:Math.random()*Math.PI*2,
    col:Math.random()<0.5?[255,100,20]:[255,180,60]
  });
}

let t=0,frame=0;
function loop(){
  t+=0.016;frame++;

  // Cracks — redraw with pulsing glow
  cr.clearRect(0,0,W,H);
  for(const cr2 of cracks){
    cr2.ph+=cr2.sp;
    const pulse=0.65+Math.sin(cr2.ph)*0.35;
    cr.strokeStyle=`rgba(255,${80+pulse*100},0,${pulse})`;
    cr.lineWidth=4;cr.shadowBlur=20;cr.shadowColor=`rgba(255,100,0,${pulse})`;
    cr.beginPath();
    cr.moveTo(cr2.pts[0].x,cr2.pts[0].y);
    for(let i=1;i<cr2.pts.length;i++)cr.lineTo(cr2.pts[i].x,cr2.pts[i].y);
    cr.stroke();
    // Bright core
    cr.shadowBlur=0;cr.strokeStyle=`rgba(255,240,180,${pulse*0.9})`;cr.lineWidth=1.5;cr.stroke();
  }

  // Smoke
  sm.clearRect(0,0,W,H);
  for(const s of smoke){
    s.x+=s.vx;s.y+=s.vy;s.life+=0.004;
    if(s.life>1){s.life=0;s.x=300+Math.random()*500;s.y=1400+Math.random()*150;}
    const alpha=s.a*Math.sin(s.life*Math.PI);
    const g=sm.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r);
    g.addColorStop(0,`hsla(${s.hue},40%,15%,${alpha})`);
    g.addColorStop(1,`hsla(${s.hue},40%,10%,0)`);
    sm.fillStyle=g;sm.beginPath();sm.arc(s.x,s.y,s.r,0,Math.PI*2);sm.fill();
  }

  // Sparks — spawn near lava
  if(frame%3===0){
    for(let i=0;i<2;i++){
      sparks.push({
        x:200+Math.random()*680,y:1500+Math.random()*300,
        vx:(Math.random()-0.5)*3,vy:-3-Math.random()*5,
        life:1,sz:1+Math.random()*2
      });
    }
  }
  sp.clearRect(0,0,W,H);
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i];
    s.x+=s.vx;s.y+=s.vy;s.vy+=0.08;s.life-=0.02;
    if(s.life<=0){sparks.splice(i,1);continue;}
    sp.fillStyle=`rgba(255,${150+Math.random()*100},50,${s.life})`;
    sp.shadowBlur=12;sp.shadowColor='#ff8c00';
    sp.beginPath();sp.arc(s.x,s.y,s.sz,0,Math.PI*2);sp.fill();
  }
  sp.shadowBlur=0;

  // Embers
  em.clearRect(0,0,W,H);
  for(const e of embers){
    e.x+=e.vx;e.y+=e.vy;e.flick+=0.15;
    if(e.y<-20||e.x<-20||e.x>W+20){
      e.x=Math.random()*W;e.y=H+20;
    }
    const flick=0.55+Math.sin(e.flick)*0.45;
    em.fillStyle=`rgba(${e.col[0]},${e.col[1]},${e.col[2]},${flick})`;
    em.shadowBlur=10;em.shadowColor=`rgb(${e.col[0]},${e.col[1]},${e.col[2]})`;
    em.beginPath();em.arc(e.x,e.y,e.r,0,Math.PI*2);em.fill();
  }
  em.shadowBlur=0;

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
