<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: wss: data: blob:;">
  <title>🏆 Elite Catcher Arena</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="assets/css/catcher_ranking.css">
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="container" style="padding-top:72px;">

    <div class="top-bar reveal">
      <a class="back-btn" href="index.html">← Arena</a>
      <div class="header-stats">
        <div class="hstat"><span class="hstat-num" id="totalCatchers">—</span><span class="hstat-label">Catchers</span></div>
        <div class="hstat"><span class="hstat-num gold" id="totalPoints">—</span><span class="hstat-label">Total Points</span></div>
      </div>
    </div>

    <div class="page-header reveal">
      <div class="eyebrow">Catchmon Arena · Rankings</div>
      <h1><span class="line-white">Elite</span><span class="line-grad">Catcher Arena</span></h1>
    </div>

    <div class="controls reveal">
      <div class="sort-row">
        <button class="sort-btn active" id="sortPoints">🏆 Points</button>
        <button class="sort-btn" id="sortLevel">⚡ Level</button>
        <button class="sort-btn" id="sortCount">🐲 Count</button>
      </div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Search catchers...">
      </div>
    </div>

    <div class="table-wrap reveal">
      <table>
        <thead>
          <tr><th>Rank</th><th>Catcher</th><th>Points</th><th>Catchmon</th><th>Level</th></tr>
        </thead>
        <tbody id="rankingBody">
          <tr><td colspan="5" class="loading"><div class="spinner"></div><div>Loading...</div></td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <button class="refresh-fab" id="refreshFab" title="Refresh">🔄</button>

  <script type="module" src="assets/js/pages/catcher_ranking.js"></script>
  <script type="module" src="assets/js/trainer_widget.js"></script>
</body>
</html>
