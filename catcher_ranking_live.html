<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🏆 Elite Catcher Arena - Firebase Live</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      color: white;
      overflow-x: hidden;
    }

    .container {
      max-width: 1400px;
      margin: auto;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    /* Firebase Connection Status */
    .connection-status {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      z-index: 1000;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .connection-status.connected {
      background: rgba(76, 175, 80, 0.9);
    }

    .connection-status.disconnected {
      background: rgba(244, 67, 54, 0.9);
    }

    /* Header Section */
    .header-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 20px 30px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .back-button {
      font-size: 16px;
      text-decoration: none;
      color: white;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      transition: all 0.2s ease;
    }

    .back-button:hover {
      background: rgba(255,255,255,0.2);
      transform: translateY(-2px);
    }

    h1 {
      text-align: center;
      flex: 1;
      font-size: clamp(1.8rem, 5vw, 3rem);
      background: linear-gradient(45deg, #FFD700, #FF6B6B, #4ECDC4, #45B7D1);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .stats-display {
      display: flex;
      gap: 15px;
      font-size: 0.85rem;
    }

    .stat-item {
      text-align: center;
      padding: 6px 10px;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      backdrop-filter: blur(5px);
    }

    .stat-number {
      font-size: 1.1rem;
      font-weight: 800;
      color: #FFD700;
      display: block;
    }

    /* Controls Section */
    .controls-section {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 25px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .controls-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
    }

    .sort-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .sort-button {
      background: rgba(76, 175, 80, 0.8);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.85rem;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .sort-button.active {
      background: rgba(255, 215, 0, 0.9);
      color: #000;
      transform: translateY(-1px);
    }

    .sort-button:hover {
      transform: translateY(-1px);
    }

    .search-container {
      position: relative;
    }

    #searchInput {
      padding: 10px 16px 10px 35px;
      font-size: 14px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 15px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      color: white;
      width: 250px;
      transition: all 0.2s ease;
    }

    #searchInput::placeholder {
      color: rgba(255,255,255,0.6);
    }

    #searchInput:focus {
      outline: none;
      border-color: rgba(255, 215, 0, 0.5);
      background: rgba(255,255,255,0.15);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      opacity: 0.6;
    }

    /* Table Section */
    .table-section {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 0;
      border: 1px solid rgba(255,255,255,0.2);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th {
      background: rgba(255, 215, 0, 0.2);
      color: white;
      padding: 15px 12px;
      text-align: center;
      font-weight: 700;
      font-size: 13px;
      border: none;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      transition: background-color 0.2s ease;
      color: white;
    }

    tr:hover td {
      background: rgba(255, 215, 0, 0.1);
    }

    /* Rank Badges - Simplified */
    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      font-weight: 800;
      font-size: 1rem;
      color: white;
    }

    .rank-1 { 
      background: linear-gradient(45deg, #FFD700, #FFA500);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
    }

    .rank-2 { 
      background: linear-gradient(45deg, #C0C0C0, #E8E8E8);
      color: #333;
    }

    .rank-3 { 
      background: linear-gradient(45deg, #CD7F32, #DAA520);
    }

    .rank-other { 
      background: rgba(108, 117, 125, 0.8);
    }

    /* Medal Icons for Top 3 */
    .rank-1::after { content: '👑'; position: absolute; top: -6px; right: -6px; font-size: 1rem; }
    .rank-2::after { content: '🥈'; position: absolute; top: -5px; right: -5px; font-size: 0.9rem; }
    .rank-3::after { content: '🥉'; position: absolute; top: -5px; right: -5px; font-size: 0.9rem; }

    /* Special Row Styling - Simplified */
    .gold-row td { 
      background: rgba(255, 215, 0, 0.15);
      border-bottom: 1px solid rgba(255, 215, 0, 0.3);
    }

    .silver-row td { 
      background: rgba(192, 192, 192, 0.15);
      border-bottom: 1px solid rgba(192, 192, 192, 0.3);
    }

    .bronze-row td { 
      background: rgba(205, 127, 50, 0.15);
      border-bottom: 1px solid rgba(205, 127, 50, 0.3);
    }

    /* Catcher Name Styling */
    .catcher-cell {
      font-weight: 700;
      font-size: 1rem;
    }

    .level-display {
      font-size: 0.8rem;
      opacity: 0.8;
      margin-top: 3px;
    }

    .points-cell {
      font-weight: 700;
      color: #FFD700;
      font-size: 1.1rem;
    }

    .team-count {
      color: #4ECDC4;
      font-weight: 600;
    }

    /* Donation Tier Styles - Simplified */
    .catcher-name {
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;
    }

    .king {
      background: linear-gradient(90deg, #FFD700, #FFA500);
      color: #000;
    }

    .flame {
      background: linear-gradient(90deg, #FF4444, #FF6B6B);
      color: white;
    }

    .diamond {
      background: linear-gradient(90deg, #4ECDC4, #45B7D1);
      color: white;
    }

    .shine {
      background: linear-gradient(90deg, #4CAF50, #66BB6A);
      color: white;
    }

    .normal {
      color: white;
      background: rgba(255,255,255,0.1);
    }

    /* Loading Animation */
    .loading {
      text-align: center;
      padding: 40px;
      color: rgba(255,255,255,0.8);
      font-size: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .loading-spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top: 3px solid #FFD700;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Floating Action Button */
    .refresh-fab {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: linear-gradient(45deg, #4ECDC4, #44A08D);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      z-index: 1000;
    }

    .refresh-fab:hover {
      transform: scale(1.1);
    }

    /* Mobile Optimizations */
    @media (max-width: 1024px) {
      th:nth-child(5), td:nth-child(5) { display: none; } /* Level hide */
    }

    @media (max-width: 768px) {
      .container { 
        padding: 15px; 
      }
      
      .header-section {
        flex-direction: column;
        gap: 15px;
        padding: 20px;
      }

      .header-content {
        flex-direction: column;
        gap: 15px;
      }

      .stats-display {
        flex-direction: column;
        gap: 8px;
      }

      .controls-content {
        flex-direction: column;
        gap: 12px;
      }

      .sort-controls {
        flex-wrap: wrap;
        justify-content: center;
      }

      #searchInput {
        width: 100%;
        max-width: 250px;
      }

      table { 
        font-size: 12px; 
      }
      
      th, td { 
        padding: 10px 6px; 
      }

      .rank-badge {
        width: 28px;
        height: 28px;
        font-size: 0.8rem;
      }

      .catcher-cell {
        font-size: 0.9rem;
      }

      .points-cell {
        font-size: 1rem;
      }

      /* Hide team count on mobile */
      th:nth-child(4), td:nth-child(4) { 
        display: none; 
      }
    }

    @media (max-width: 480px) {
      .container { 
        padding: 10px; 
      }

      .controls-section {
        padding: 15px;
      }

      table { 
        font-size: 11px; 
      }

      th, td { 
        padding: 8px 4px; 
      }

      .rank-badge {
        width: 24px;
        height: 24px;
        font-size: 0.7rem;
      }

      .refresh-fab {
        width: 45px;
        height: 45px;
        font-size: 1rem;
      }
    }

    /* Scrollable table for very wide content */
    @media (max-width: 600px) {
      .table-section {
        overflow-x: auto;
      }
      
      table {
        min-width: 400px;
      }
    }

    /* Reduce motion for performance */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- Firebase Connection Status -->
  <div class="connection-status" id="connectionStatus">🔄 Verbinde...</div>

  <div class="container">
    <!-- Header Section -->
    <div class="header-section">
      <div class="header-content">
        <a class="back-button" href="javascript:history.back()">← Back</a>
        <h1>🏆 Elite Catcher Arena</h1>
        <div class="stats-display">
          <div class="stat-item">
            <span class="stat-number" id="totalCatchers">0</span>
            <span>Catchers</span>
          </div>
          <div class="stat-item">
            <span class="stat-number" id="totalPoints">0</span>
            <span>Total Points</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Controls Section -->
    <div class="controls-section">
      <div class="controls-content">
        <div class="sort-controls">
          <button class="sort-button active" onclick="setSortMode('points')" id="sortPoints">🏆 Points</button>
          <button class="sort-button" onclick="setSortMode('level')" id="sortLevel">⚡ Level</button>
          <button class="sort-button" onclick="setSortMode('count')" id="sortCount">📊 Count</button>
        </div>
        
        <div class="search-container">
          <div class="search-icon">🔍</div>
          <input type="text" id="searchInput" placeholder="Search elite catchers..." onkeyup="filterTable()">
        </div>
      </div>
    </div>

    <!-- Rankings Table -->
    <div class="table-section">
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Catcher</th>
            <th>Total Points</th>
            <th>Catchmon</th>
            <th>Level</th>
          </tr>
        </thead>
        <tbody id="rankingBody">
          <tr><td colspan="5" class="loading">
            <div class="loading-spinner"></div>
            <div>Loading Elite Catchers...</div>
          </td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Floating Refresh Button -->
  <button class="refresh-fab" onclick="forceRefresh()" title="Refresh Rankings">🔄</button>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { 
      getDatabase, 
      ref, 
      onValue 
    } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDdStpC5rVtgaZ4XvtKLwQttnyIDXL2z7Q",
      authDomain: "trainertrials.firebaseapp.com",
      databaseURL: "https://trainertrials-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "trainertrials",
      storageBucket: "trainertrials.firebasestorage.app",
      messagingSenderId: "22071275267",
      appId: "1:22071275267:web:92e82d6bfaee169aff8336",
      measurementId: "G-WWENZ0HP22"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Game State
    let currentSortMode = 'points';
    let allCatchers = [];
    let trainersData = {};
    let connectionStatus = false;

    // Firebase Listeners
    const connectedRef = ref(db, '.info/connected');
    onValue(connectedRef, (snapshot) => {
      connectionStatus = snapshot.val();
      updateConnectionStatus();
    });

    const trainersRef = ref(db, 'trainers');
    onValue(trainersRef, (snapshot) => {
      trainersData = snapshot.val() || {};
      updateData();
    });

    function updateConnectionStatus() {
      const statusElement = document.getElementById('connectionStatus');
      if (connectionStatus) {
        statusElement.textContent = '🟢 Connected';
        statusElement.className = 'connection-status connected';
      } else {
        statusElement.textContent = '🔴 Offline';
        statusElement.className = 'connection-status disconnected';
      }
    }

    // Utility Functions
    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function calcPoints(catchmon) {
      if (!catchmon) return 0;
      
      const level = catchmon.level || 1;
      const stats = catchmon.stats || {};
      const statSum = Object.values(stats).reduce((sum, val) => sum + (val || 0), 0);
      let points = level * 10 + statSum;
      
      // Rarity multiplier
      const rarityMultipliers = {
        "Common": 1,
        "Uncommon": 1.2,
        "Rare": 1.5,
        "Epic": 2,
        "Legendary": 3,
        "Mythical": 5
      };
      
      const multiplier = rarityMultipliers[catchmon.rarity] || 1;
      points *= multiplier;
      
      if (catchmon.shiny) {
        points *= 2;
      }
      
      return Math.round(points);
    }

    function calcLevel(points) {
      return Math.floor(Math.pow(points / 500, 0.6));
    }

    function getRankClass(index) {
      if (index === 0) return 'rank-1';
      if (index === 1) return 'rank-2';
      if (index === 2) return 'rank-3';
      return 'rank-other';
    }

    function getRowClass(index) {
      if (index === 0) return 'gold-row';
      if (index === 1) return 'silver-row';
      if (index === 2) return 'bronze-row';
      return '';
    }

    function getDonationTier(donation) {
      if (donation >= 2500) return "king";
      if (donation >= 500) return "flame";
      if (donation >= 250) return "diamond";
      if (donation >= 100) return "shine";
      return "normal";
    }

    function getStyledCatcherName(name, donation) {
      const tier = getDonationTier(donation);
      if (tier === "normal") return capitalize(name);
      return `<span class="catcher-name ${tier}">${capitalize(name)}</span>`;
    }

    function setSortMode(mode) {
      currentSortMode = mode;
      
      // Update button states
      document.querySelectorAll('.sort-button').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`sort${mode.charAt(0).toUpperCase() + mode.slice(1)}`).classList.add('active');
      
      renderTable();
    }

    function filterTable() {
      const input = document.getElementById("searchInput").value.toUpperCase();
      const rows = document.getElementById("rankingBody").getElementsByTagName("tr");
      
      for (let i = 0; i < rows.length; i++) {
        const nameCell = rows[i].getElementsByTagName("td")[1];
        if (nameCell) {
          const textValue = nameCell.textContent || nameCell.innerText;
          rows[i].style.display = textValue.toUpperCase().includes(input) ? "" : "none";
        }
      }
    }

    function updateData() {
      console.log('🔄 Processing trainers data:', Object.keys(trainersData).length);
      
      allCatchers = Object.entries(trainersData).map(([name, info]) => {
        const team = info.team || [];
        const totalPoints = team.reduce((sum, p) => sum + calcPoints(p), 0);
        const level = calcLevel(totalPoints);
        return {
          name,
          teamSize: team.length,
          totalPoints,
          level,
          donation: info.donation || 0
        };
      });

      // Update stats
      updateStats();
      renderTable();
    }

    function updateStats() {
      const totalCatchers = allCatchers.length;
      const totalPoints = allCatchers.reduce((sum, c) => sum + c.totalPoints, 0);
      
      // Animate numbers
      animateNumber('totalCatchers', totalCatchers);
      animateNumber('totalPoints', totalPoints);
    }

    function animateNumber(elementId, targetNumber) {
      const element = document.getElementById(elementId);
      const startNumber = parseInt(element.textContent) || 0;
      const duration = 1000;
      const startTime = Date.now();

      function updateNumber() {
        const now = Date.now();
        const progress = Math.min((now - startTime) / duration, 1);
        const easeProgress = 1 - Math.pow(1 - progress, 3);
        const currentNumber = Math.floor(startNumber + (targetNumber - startNumber) * easeProgress);
        
        if (elementId === 'totalPoints') {
          element.textContent = currentNumber.toLocaleString('de-DE');
        } else {
          element.textContent = currentNumber;
        }
        
        if (progress < 1) {
          requestAnimationFrame(updateNumber);
        }
      }
      
      updateNumber();
    }

    function renderTable() {
      const tbody = document.getElementById("rankingBody");

      if (allCatchers.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="loading"><div class="loading-spinner"></div><div>No catchers found</div></td></tr>';
        return;
      }

      // Sort catchers
      const sortedCatchers = [...allCatchers].sort((a, b) => {
        if (currentSortMode === 'points') return b.totalPoints - a.totalPoints;
        if (currentSortMode === 'level') return b.level - a.level;
        if (currentSortMode === 'count') return b.teamSize - a.teamSize;
        return 0;
      });

      // Use DocumentFragment for better performance
      const fragment = document.createDocumentFragment();

      sortedCatchers.forEach((catcher, index) => {
        const rank = index + 1;
        const tr = document.createElement("tr");
        const rankClass = getRankClass(index);
        const rowClass = getRowClass(index);
        
        if (rowClass) tr.classList.add(rowClass);
        
        tr.innerHTML = `
          <td><div class="rank-badge ${rankClass}">${rank}</div></td>
          <td class="catcher-cell">
            <a href="catcher_detail.html?name=${encodeURIComponent(catcher.name)}" style="text-decoration: none; color: inherit;">
              <div>${getStyledCatcherName(catcher.name, catcher.donation)}</div>
              <div class="level-display">Level ${catcher.level}</div>
            </a>
          </td>
          <td class="points-cell">${catcher.totalPoints.toLocaleString('de-DE')}</td>
          <td class="team-count">${catcher.teamSize}</td>
          <td>${catcher.level}</td>
        `;
        
        fragment.appendChild(tr);
      });

      tbody.innerHTML = '';
      tbody.appendChild(fragment);
    }

    function forceRefresh() {
      console.log('🔄 Force refresh triggered');
      const fab = document.querySelector('.refresh-fab');
      fab.style.transform = 'scale(1.2)';
      
      setTimeout(() => {
        fab.style.transform = '';
      }, 200);

      // Show loading state
      document.getElementById("rankingBody").innerHTML = 
        '<tr><td colspan="5" class="loading"><div class="loading-spinner"></div><div>Refreshing rankings...</div></td></tr>';
      
      // Firebase will automatically update when data changes
      renderTable();
    }

    // Make functions globally available
    window.setSortMode = setSortMode;
    window.filterTable = filterTable;
    window.forceRefresh = forceRefresh;

    console.log('🔥 Firebase Elite Catcher Arena System loaded!');

  </script>
</body>
</html>
