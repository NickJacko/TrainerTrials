<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Psychic — Floating Islands</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0d0020;}
canvas{position:absolute;inset:0;width:1080px;height:1920px;display:block;}
.bg{position:absolute;inset:0;background:
  radial-gradient(ellipse 80% 60% at 50% 50%, #2a0055 0%, #1a0035 40%, transparent 75%),
  linear-gradient(180deg, #0d0020 0%, #1a0035 50%, #0d0020 100%);}
/* Floating island silhouettes */
.isle{position:absolute;background:radial-gradient(ellipse at 50% 30%, #2d0055 0%, #100020 70%);border-radius:50% 50% 35% 35% / 60% 60% 15% 15%;}
.i1{width:180px;height:80px;top:280px;left:8%;transform:rotate(-5deg);animation:float1 12s ease-in-out infinite;}
.i2{width:140px;height:70px;top:450px;right:10%;transform:rotate(3deg);animation:float1 14s ease-in-out infinite reverse;}
.i3{width:220px;height:90px;top:1250px;left:6%;animation:float1 16s ease-in-out infinite;}
.i4{width:160px;height:75px;top:1380px;right:8%;animation:float1 13s ease-in-out infinite reverse;}
@keyframes float1{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-18px) rotate(3deg)}}
/* Inverted waterfalls from islands */
.wf{position:absolute;background:linear-gradient(180deg, rgba(157,0,255,0.35) 0%, rgba(157,0,255,0) 100%);width:20px;filter:blur(3px);}
.wf1{height:200px;top:360px;left:calc(8% + 80px);}
.wf2{height:150px;top:520px;right:calc(10% + 60px);}
.wf3{height:220px;top:1340px;left:calc(6% + 100px);}

/* Giant eye in center-back */
.eye-wrap{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);width:500px;height:260px;opacity:0.18;pointer-events:none;z-index:1;}
.eye{position:absolute;inset:0;background:radial-gradient(ellipse 50% 50% at 50% 50%, #ff00cc 0%, #6600aa 40%, transparent 70%);border-radius:50%;animation:blink 9s ease-in-out infinite;}
.eye-pupil{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;background:#000;border-radius:50%;box-shadow:0 0 30px #ff00cc;}
@keyframes blink{0%,45%,55%,100%{transform:scaleY(1)}48%,52%{transform:scaleY(0.08)}}

.zone-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(0,0,0,0.55) 0%,transparent 100%);z-index:40;}
.zone-bot{position:absolute;bottom:0;left:0;right:0;height:920px;background:linear-gradient(0deg,rgba(5,0,20,0.55) 0%,rgba(5,0,20,0.12) 40%,transparent 100%);z-index:40;}
.center-darken{position:absolute;top:300px;left:50%;transform:translateX(-50%);width:780px;height:540px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(5,0,20,0.45) 0%,transparent 70%);z-index:38;}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 40%,rgba(0,0,0,0.65) 100%);z-index:39;pointer-events:none;}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="galaxy"></canvas>
<div class="eye-wrap"><div class="eye"></div><div class="eye-pupil"></div></div>
<canvas id="fog"></canvas>
<div class="isle i1"></div><div class="isle i2"></div><div class="isle i3"></div><div class="isle i4"></div>
<div class="wf wf1"></div><div class="wf wf2"></div><div class="wf wf3"></div>
<canvas id="crystals"></canvas>
<canvas id="spirals"></canvas>
<div class="center-darken"></div>
<div class="vignette"></div>
<div class="zone-top"></div>
<div class="zone-bot"></div>
<script>
const W=1080,H=1920;
function setup(id){const c=document.getElementById(id);c.width=W;c.height=H;return c.getContext('2d');}

const gx=setup('galaxy');
const stars=[];
for(let i=0;i<200;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+0.2,tw:Math.random()*Math.PI*2,hue:Math.random()<0.3?300:0});

const fg=setup('fog');
const fog=[];
for(let i=0;i<40;i++)fog.push({x:Math.random()*W,y:Math.random()*H,r:100+Math.random()*200,vx:(Math.random()-0.5)*0.2,vy:(Math.random()-0.5)*0.1,hue:280+Math.random()*40,a:0.1+Math.random()*0.15});

const cr=setup('crystals');
const crystals=[];
for(let i=0;i<8;i++){
  crystals.push({x:Math.random()*W,y:Math.random()*H,sz:15+Math.random()*25,
    ph:Math.random()*Math.PI*2,rot:Math.random()*Math.PI,hue:280+Math.random()*50});
}

const sp=setup('spirals');
let t=0;
function drawSpirals(){
  sp.clearRect(0,0,W,H);
  sp.globalCompositeOperation='screen';
  for(let i=0;i<3;i++){
    const cx=W/2+Math.cos(t*0.2+i*2)*300;
    const cy=H/2+Math.sin(t*0.3+i*1.7)*400;
    sp.strokeStyle=`rgba(${i===0?'157,0,255':i===1?'255,0,204':'200,100,255'},0.25)`;
    sp.lineWidth=2;
    sp.beginPath();
    for(let a=0;a<Math.PI*6;a+=0.1){
      const r=a*8;
      const x=cx+Math.cos(a+t*0.3)*r;
      const y=cy+Math.sin(a+t*0.3)*r;
      if(a===0)sp.moveTo(x,y);else sp.lineTo(x,y);
    }
    sp.stroke();
  }
  sp.globalCompositeOperation='source-over';
}

function loop(){
  t+=0.016;
  gx.clearRect(0,0,W,H);
  for(const s of stars){
    s.tw+=0.03;
    const a=0.4+Math.sin(s.tw)*0.5;
    gx.fillStyle=s.hue?`hsla(300,100%,70%,${a})`:`rgba(255,255,255,${a})`;
    gx.beginPath();gx.arc(s.x,s.y,s.r,0,Math.PI*2);gx.fill();
  }
  fg.clearRect(0,0,W,H);
  fg.globalCompositeOperation='screen';
  for(const f of fog){
    f.x+=f.vx;f.y+=f.vy;
    if(f.x<-200)f.x=W+200;if(f.x>W+200)f.x=-200;
    if(f.y<-200)f.y=H+200;if(f.y>H+200)f.y=-200;
    const g=fg.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
    g.addColorStop(0,`hsla(${f.hue},100%,40%,${f.a})`);
    g.addColorStop(1,`hsla(${f.hue},100%,30%,0)`);
    fg.fillStyle=g;fg.beginPath();fg.arc(f.x,f.y,f.r,0,Math.PI*2);fg.fill();
  }
  fg.globalCompositeOperation='source-over';

  cr.clearRect(0,0,W,H);
  for(const c of crystals){
    c.ph+=0.025;
    const a=0.4+Math.sin(c.ph)*0.3;
    cr.save();cr.translate(c.x,c.y);cr.rotate(c.rot+t*0.1);
    cr.shadowBlur=20;cr.shadowColor=`hsl(${c.hue},100%,60%)`;
    cr.fillStyle=`hsla(${c.hue},100%,60%,${a})`;
    cr.beginPath();
    cr.moveTo(0,-c.sz);cr.lineTo(c.sz*0.5,-c.sz*0.3);cr.lineTo(c.sz*0.5,c.sz*0.5);cr.lineTo(0,c.sz);
    cr.lineTo(-c.sz*0.5,c.sz*0.5);cr.lineTo(-c.sz*0.5,-c.sz*0.3);cr.closePath();cr.fill();
    cr.restore();
  }
  drawSpirals();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
