<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>📘 Epic Catchdex Arena</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="utils.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: radial-gradient(ellipse at center, #1a1a2e 0%, #16213e 30%, #0f0f23 70%, #000000 100%);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      color: white;
      overflow-x: hidden;
    }

    .container {
      max-width: 1400px;
      margin: auto;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    /* Header Section */
    .header-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 50px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border-radius: 25px;
      padding: 25px 35px;
      border: 2px solid rgba(255,255,255,0.1);
      box-shadow: 0 15px 50px rgba(0,0,0,0.2);
    }

    .back-button {
      font-size: 16px;
      text-decoration: none;
      color: white;
      font-weight: 700;
      padding: 15px 25px;
      border-radius: 15px;
      background: linear-gradient(145deg, rgba(255,255,255,0.15), rgba(255,255,255,0.08));
      border: 2px solid rgba(255,255,255,0.2);
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    .back-button:hover {
      transform: translateY(-2px);
      background: linear-gradient(145deg, rgba(255,255,255,0.25), rgba(255,255,255,0.15));
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      border-color: rgba(255,255,255,0.4);
    }

    h1 {
      text-align: center;
      flex: 1;
      font-size: clamp(2.5rem, 6vw, 4rem);
      background: linear-gradient(45deg, #FFD700, #FF6B6B, #4ECDC4, #45B7D1, #96CEB4, #FFD700);
      background-size: 400% 400%;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
      letter-spacing: -1px;
    }

    .spacer {
      width: 150px;
    }

    /* Search Section */
    .search-section {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 40px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    }

    .search-container {
      position: relative;
      max-width: 600px;
      margin: 0 auto;
    }

    .search-input {
      width: 100%;
      padding: 18px 25px 18px 60px;
      font-size: 18px;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 30px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      color: white;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    .search-input::placeholder {
      color: rgba(255,255,255,0.6);
      font-weight: 400;
    }

    .search-input:focus {
      outline: none;
      border-color: rgba(255, 215, 0, 0.5);
      background: rgba(255,255,255,0.15);
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
      transform: translateY(-2px);
    }

    .search-icon {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.5rem;
      opacity: 0.7;
    }

    /* Rarity Sections */
    .rarity-section {
      margin-bottom: 60px;
    }

    .rarity-header {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      border-radius: 25px;
      padding: 30px;
      margin-bottom: 30px;
      text-align: center;
      border: 2px solid rgba(255,255,255,0.15);
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    }

    .rarity-title {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      margin: 0 0 15px 0;
    }

    .rarity-count {
      background: rgba(255,255,255,0.15);
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      display: inline-block;
    }

    /* Rarity Specific Styles */
    .starter .rarity-title {
      background: linear-gradient(45deg, #4CAF50, #81C784, #A5D6A7);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
    }

    .common .rarity-title {
      background: linear-gradient(45deg, #9E9E9E, #BDBDBD, #E0E0E0);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(158, 158, 158, 0.3);
    }

    .rare .rarity-title {
      background: linear-gradient(45deg, #2196F3, #64B5F6, #90CAF9);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(33, 150, 243, 0.3);
    }

    .legendary .rarity-title {
      background: linear-gradient(45deg, #FF9800, #FFB74D, #FFCC02);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 152, 0, 0.3);
    }

    .mythical .rarity-title {
      background: linear-gradient(45deg, #9C27B0, #BA68C8, #CE93D8);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(156, 39, 176, 0.3);
    }

    .god .rarity-title {
      background: linear-gradient(45deg, #000000, #424242, #616161, #000000);
      background-size: 200% auto;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
    }

    .god .rarity-header {
      background: linear-gradient(135deg, 
        rgba(0,0,0,0.4) 0%, 
        rgba(64,0,64,0.3) 25%, 
        rgba(0,0,0,0.5) 50%, 
        rgba(64,0,64,0.3) 75%, 
        rgba(0,0,0,0.4) 100%);
      border: 2px solid rgba(0,0,0,0.6);
      box-shadow: 
        0 0 40px rgba(0,0,0,0.6),
        inset 0 0 30px rgba(255,255,255,0.1);
    }

    /* Card Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 25px;
      justify-items: center;
    }

    .card {
      background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
      border-radius: 20px;
      width: 180px;
      min-height: 260px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      padding: 20px;
      text-align: center;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      border: 2px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 25px 60px rgba(0,0,0,0.3);
      border-color: rgba(255,255,255,0.3);
    }

    /* God Card Special Effects */
    .god .card {
      background: linear-gradient(145deg, #1a1a1a, #2d2d2d);
      border: 2px solid rgba(128,0,128,0.4);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    .god .card:hover {
      border-color: rgba(128,0,128,0.7);
      box-shadow: 0 25px 60px rgba(128,0,128,0.4);
    }

    .card img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 15px;
      transition: transform 0.3s ease;
      border-radius: 10px;
    }

    .card:hover img {
      transform: scale(1.1);
    }

    /* God Image Effects */
    .god .card img {
      filter: brightness(0.4) contrast(1.8) saturate(0.6);
      border: 2px solid rgba(128,0,128,0.4);
      box-shadow: 0 0 20px rgba(128,0,128,0.5);
    }

    .god .card::before {
      content: '⚡ DIVINE POWER ⚡';
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #DAA520;
      font-weight: 900;
      font-size: 11px;
      z-index: 3;
      text-shadow: 
        0 0 15px rgba(218, 165, 32, 1),
        0 0 30px rgba(255, 215, 0, 0.8);
      letter-spacing: 1px;
      text-align: center;
      line-height: 1.2;
      background: rgba(0,0,0,0.8);
      padding: 5px 10px;
      border-radius: 10px;
      border: 1px solid rgba(218, 165, 32, 0.6);
      white-space: nowrap;
    }

    .card a {
      text-decoration: none;
      color: white;
      font-weight: bold;
      display: block;
    }

    .god .card a {
      color: #9370DB;
    }

    .card .id-name {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 10px;
      color: white;
      line-height: 1.2;
    }

    .god .card .id-name {
      color: #9370DB;
      text-shadow: 0 0 8px rgba(147,112,219,0.6);
    }

    .card .stats {
      font-size: 13px;
      color: rgba(255,255,255,0.8);
      font-weight: 500;
    }

    .god .card .stats {
      color: rgba(147,112,219,0.9);
    }

    /* Loading Animation */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
      color: rgba(255,255,255,0.8);
      font-size: 18px;
      flex-direction: column;
      gap: 20px;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid #FFD700;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Mobile Optimizations */
    @media (max-width: 1024px) {
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 20px;
      }

      .card {
        width: 160px;
        min-height: 240px;
        padding: 18px;
      }

      .card img {
        width: 100px;
        height: 100px;
      }
    }

    @media (max-width: 768px) {
      .container {
        padding: 15px;
      }

      .header-section {
        flex-direction: column;
        gap: 20px;
        text-align: center;
        padding: 25px 20px;
      }

      .spacer {
        display: none;
      }

      .search-section {
        padding: 20px;
        margin-bottom: 30px;
      }

      .search-input {
        padding: 15px 20px 15px 50px;
        font-size: 16px;
      }

      .search-icon {
        left: 15px;
        font-size: 1.3rem;
      }

      .rarity-section {
        margin-bottom: 40px;
      }

      .rarity-header {
        padding: 25px 20px;
        margin-bottom: 20px;
      }

      .rarity-title {
        font-size: clamp(1.5rem, 5vw, 2rem);
      }

      .grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 15px;
      }

      .card {
        width: 140px;
        min-height: 200px;
        padding: 15px;
      }

      .card img {
        width: 80px;
        height: 80px;
        margin-bottom: 10px;
      }

      .card .id-name {
        font-size: 14px;
        margin-bottom: 8px;
      }

      .card .stats {
        font-size: 12px;
      }

      .god .card::before {
        font-size: 9px;
        padding: 4px 8px;
        top: 40%;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 10px;
      }

      .search-section {
        padding: 15px;
        margin-bottom: 25px;
      }

      .rarity-header {
        padding: 20px 15px;
      }

      .grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 12px;
      }

      .card {
        width: 120px;
        min-height: 180px;
        padding: 12px;
      }

      .card img {
        width: 70px;
        height: 70px;
        margin-bottom: 8px;
      }

      .card .id-name {
        font-size: 13px;
        margin-bottom: 6px;
      }

      .card .stats {
        font-size: 11px;
      }

      .god .card::before {
        font-size: 8px;
        padding: 3px 6px;
        letter-spacing: 0.5px;
      }

      .rarity-count {
        font-size: 14px;
        padding: 8px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header Section -->
    <div class="header-section">
      <a class="back-button" href="javascript:history.back()">← Back to Arena</a>
      <h1>📘 Epic Catchdex</h1>
      <div class="spacer"></div>
    </div>

    <!-- Search Section -->
    <div class="search-section">
      <div class="search-container">
        <div class="search-icon">🔍</div>
        <input type="text" id="searchInput" class="search-input" onkeyup="filterDex()" placeholder="Search for legendary Catchmon...">
      </div>
    </div>

    <!-- Dex Container -->
    <div id="dexContainer">
      <div class="loading">
        <div class="loading-spinner"></div>
        <div>Loading Epic Catchmon...</div>
      </div>
    </div>
  </div>

  <script>
    const rarityOrder = ["Starter", "Common", "Rare", "Legendary", "Mythical", "God"];
    const rarityEmojis = {
      "Starter": "🌱",
      "Common": "⚪",
      "Rare": "🔵", 
      "Legendary": "🟡",
      "Mythical": "🟣",
      "God": "⚫"
    };

    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function censorGodName(name) {
      return "??? ??? ???";
    }

    function filterDex() {
      const input = document.getElementById("searchInput").value.toLowerCase();
      const sections = document.querySelectorAll(".rarity-section");
      
      sections.forEach(section => {
        const cards = section.querySelectorAll(".card");
        let hasVisibleCards = false;
        
        cards.forEach(card => {
          const name = card.innerText.toLowerCase();
          const isVisible = name.includes(input);
          card.style.display = isVisible ? "" : "none";
          if (isVisible) hasVisibleCards = true;
        });
        
        section.style.display = hasVisibleCards ? "" : "none";
      });
    }

    function buildRaritySection(rarity, pokemons, seenData) {
      if (pokemons.length === 0) return '';
      
      const rarityClass = rarity.toLowerCase();
      const emoji = rarityEmojis[rarity] || "❓";
      
      let cardsHtml = '';
      pokemons.forEach(p => {
        const name = p.name.toLowerCase();
        const escaped = seenData[name]?.escaped || 0;
        const caught = seenData[name]?.caught || 0;
        const id = String(p.id).padStart(3, "0");
        
        let displayName = capitalize(p.name);
        let displayId = id;
        
        if (rarity === "God") {
          displayName = censorGodName(displayName);
          displayId = "???";
        }
        
        const safeName = capitalize(p.name).replace(/ /g, "_");

        cardsHtml += `
          <div class="card">
            <a href="dex_detail.html?name=${safeName}">
              <img src="${p.sprite}" alt="${capitalize(p.name)}">
              <div class="id-name">#${displayId}<br>${displayName}</div>
              <div class="stats">${escaped} escaped / ${caught} caught</div>
            </a>
          </div>
        `;
      });

      return `
        <div class="rarity-section ${rarityClass}">
          <div class="rarity-header">
            <h2 class="rarity-title">${emoji} ${rarity}</h2>
            <div class="rarity-count">${pokemons.length} Catchmon</div>
          </div>
          <div class="grid">
            ${cardsHtml}
          </div>
        </div>
      `;
    }

    function buildSections(dexList, seenData, enabledGens) {
      const container = document.getElementById("dexContainer");
      
      const filtered = dexList
        .filter(p => enabledGens.has(p.gen))
        .sort((a, b) => a.id - b.id);

      if (filtered.length === 0) {
        container.innerHTML = '<div class="loading"><div class="loading-spinner"></div><div>No Catchmon found</div></div>';
        return;
      }

      const byRarity = {};
      rarityOrder.forEach(r => byRarity[r] = []);

      filtered.forEach(p => {
        const parts = p.sprite.split("/");
        const rarity = parts.length > 1 ? parts[1] : "Common";
        if (byRarity[rarity]) {
          byRarity[rarity].push(p);
        } else {
          byRarity["Common"].push(p);
        }
      });

      rarityOrder.forEach(r => {
        if (byRarity[r]) {
          byRarity[r].sort((a, b) => a.id - b.id);
        }
      });

      let html = '';
      rarityOrder.forEach(rarity => {
        const pokemons = byRarity[rarity] || [];
        html += buildRaritySection(rarity, pokemons, seenData);
      });

      container.innerHTML = html;
    }

    async function updateDex() {
      try {
        const [dexList, seenCaught, genConfig] = await Promise.all([
          fetch("dex_list.json?" + Date.now()).then(r => r.json()),
          fetch("seen_caught.json?" + Date.now()).then(r => r.json()),
          fetch("gen_config.json?" + Date.now()).then(r => r.json())
        ]);
        
        const enabledGens = new Set(genConfig.enabled_gens || []);
        buildSections(dexList, seenCaught, enabledGens);
      } catch (err) {
        console.error("Fehler beim Laden der Catchdex-Daten:", err);
        document.getElementById("dexContainer").innerHTML = 
          '<div class="loading"><div class="loading-spinner"></div><div>Error loading data</div></div>';
      }
    }

    // ONLY load once when page loads - NO intervals, NO auto-refresh, NO timers
    updateDex();
    console.log("📘 Catchdex loaded once - no auto refresh enabled");
  </script>
</body>
</html>
