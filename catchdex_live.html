<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: wss: data: blob:;">
  <title>📘 Catchdex — Catchmon Arena</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="assets/css/catchdex_live.css">
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="bg-grid"></div>
  <canvas class="bg-canvas" id="bgCanvas"></canvas>

  <div class="container">

    <div class="top-bar reveal">
      <a class="back-btn" href="#" id="backBtn">← Back</a>
    </div>

    <div class="page-header reveal" id="heroCard">
      <div class="eyebrow"><span class="pip"></span>Catchmon Arena · Dex</div>
      <h1>
        <span class="line-white">📘 Epic</span>
        <span class="line-grad">Catchdex</span>
      </h1>
      <p class="page-sub">Browse all Catchmon — track your collection</p>
    </div>

    <div class="search-wrap reveal">
      <div class="search-inner">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Search Catchmon...">
      </div>
    </div>

    <div id="dexContainer" class="reveal">
      <div class="loading"><div class="spinner"></div><div>Loading Catchdex...</div></div>
    </div>

  </div>

  <script src="assets/js/pages/catchdex_live_fx.js"></script>
  <script type="module" src="assets/js/pages/catchdex_live.js"></script>
  <script type="module" src="assets/js/trainer_widget.js"></script>
</body>
</html>
