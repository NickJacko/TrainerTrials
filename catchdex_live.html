<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com https://*.firebasedatabase.app; connect-src 'self' https://*.firebasedatabase.app https://*.firebaseio.com https://www.googleapis.com wss://*.firebasedatabase.app https://www.google.com https://content-firebaseappcheck.googleapis.com https://firebaseappcheck.googleapis.com; frame-src 'self' https://www.google.com https://*.firebasedatabase.app; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'self';">
  <title>📘 Epic Catchdex Arena</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: radial-gradient(ellipse at center, #1a1a2e 0%, #16213e 30%, #0f0f23 70%, #000000 100%); margin: 0; padding: 0; min-height: 100vh; color: white; overflow-x: hidden; }
    .container { max-width: 1400px; margin: auto; padding: 20px; position: relative; z-index: 1; }
    .header-section { display: flex; align-items: center; justify-content: space-between; margin-bottom: 50px; background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border-radius: 25px; padding: 25px 35px; border: 2px solid rgba(255,255,255,0.1); box-shadow: 0 15px 50px rgba(0,0,0,0.2); }
    .back-button { font-size: 16px; text-decoration: none; color: white; font-weight: 700; padding: 15px 25px; border-radius: 15px; background: linear-gradient(145deg, rgba(255,255,255,0.15), rgba(255,255,255,0.08)); border: 2px solid rgba(255,255,255,0.2); transition: all 0.3s ease; backdrop-filter: blur(10px); }
    .back-button:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.4); }
    h1 { text-align: center; flex: 1; font-size: clamp(2.5rem, 6vw, 4rem); background: linear-gradient(45deg, #FFD700, #FF6B6B, #4ECDC4, #45B7D1, #96CEB4, #FFD700); background-size: 400% 400%; background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; letter-spacing: -1px; }
    .spacer { width: 150px; }
    .search-section { background: rgba(255,255,255,0.05); backdrop-filter: blur(15px); border-radius: 20px; padding: 25px; margin-bottom: 40px; border: 1px solid rgba(255,255,255,0.1); }
    .search-container { position: relative; max-width: 600px; margin: 0 auto; }
    .search-input { width: 100%; padding: 18px 25px 18px 60px; font-size: 18px; border: 2px solid rgba(255,255,255,0.2); border-radius: 30px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); color: white; transition: all 0.3s ease; font-weight: 500; }
    .search-input::placeholder { color: rgba(255,255,255,0.6); }
    .search-input:focus { outline: none; border-color: rgba(255,215,0,0.5); background: rgba(255,255,255,0.15); }
    .search-icon { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); font-size: 1.5rem; opacity: 0.7; }
    .rarity-section { margin-bottom: 60px; }
    .rarity-header { background: rgba(255,255,255,0.08); backdrop-filter: blur(20px); border-radius: 25px; padding: 30px; margin-bottom: 30px; text-align: center; border: 2px solid rgba(255,255,255,0.15); }
    .rarity-title { font-size: clamp(2rem, 4vw, 3rem); font-weight: 800; margin: 0 0 15px 0; }
    .rarity-count { background: rgba(255,255,255,0.15); padding: 10px 20px; border-radius: 25px; font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.9); display: inline-block; }
    .starter .rarity-title { background: linear-gradient(45deg, #4CAF50, #81C784, #A5D6A7); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .common .rarity-title { background: linear-gradient(45deg, #9E9E9E, #BDBDBD, #E0E0E0); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .rare .rarity-title { background: linear-gradient(45deg, #2196F3, #64B5F6, #90CAF9); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .legendary .rarity-title { background: linear-gradient(45deg, #FF9800, #FFB74D, #FFCC02); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .mythical .rarity-title { background: linear-gradient(45deg, #9C27B0, #BA68C8, #CE93D8); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .god .rarity-title { background: linear-gradient(45deg, #000000, #424242, #616161, #000000); background-size: 200% auto; background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 10px rgba(0,0,0,0.8)); }
    .god .rarity-header { background: linear-gradient(135deg, rgba(0,0,0,0.4) 0%, rgba(64,0,64,0.3) 25%, rgba(0,0,0,0.5) 50%, rgba(64,0,64,0.3) 75%, rgba(0,0,0,0.4) 100%); border: 2px solid rgba(0,0,0,0.6); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 25px; justify-items: center; }
    .card { background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06)); border-radius: 20px; width: 180px; min-height: 260px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); padding: 20px; text-align: center; transition: all 0.3s ease; display: flex; flex-direction: column; justify-content: space-between; align-items: center; border: 2px solid rgba(255,255,255,0.1); backdrop-filter: blur(15px); }
    .card:hover { transform: translateY(-8px); box-shadow: 0 25px 60px rgba(0,0,0,0.3); border-color: rgba(255,255,255,0.3); }
    .god .card { background: linear-gradient(145deg, #1a1a1a, #2d2d2d); border: 2px solid rgba(128,0,128,0.4); }
    .god .card:hover { border-color: rgba(128,0,128,0.7); }
    .card img { width: 120px; height: 120px; object-fit: contain; margin-bottom: 15px; transition: transform 0.3s ease; border-radius: 10px; }
    .card:hover img { transform: scale(1.1); }
    .god .card img { filter: brightness(0.4) contrast(1.8) saturate(0.6); border: 2px solid rgba(128,0,128,0.4); }
    .god .card::before { content: '⚡ DIVINE POWER ⚡'; position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); color: #DAA520; font-weight: 900; font-size: 11px; z-index: 3; background: rgba(0,0,0,0.8); padding: 5px 10px; border-radius: 10px; border: 1px solid rgba(218,165,32,0.6); white-space: nowrap; }
    .card a { text-decoration: none; color: white; font-weight: bold; display: block; }
    .god .card a { color: #9370DB; }
    .card .id-name { font-size: 16px; font-weight: 700; margin-bottom: 10px; color: white; line-height: 1.2; }
    .god .card .id-name { color: #9370DB; }
    .card .stats { font-size: 13px; color: rgba(255,255,255,0.8); font-weight: 500; }
    .loading { display: flex; justify-content: center; align-items: center; height: 200px; color: rgba(255,255,255,0.8); font-size: 18px; flex-direction: column; gap: 20px; }
    .loading-spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.2); border-top: 4px solid #FFD700; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 1024px) { .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; } .card { width: 160px; min-height: 240px; padding: 18px; } .card img { width: 100px; height: 100px; } }
    @media (max-width: 768px) { .container { padding: 15px; } .header-section { flex-direction: column; gap: 20px; text-align: center; padding: 25px 20px; } .spacer { display: none; } .search-section { padding: 20px; margin-bottom: 30px; } .search-input { padding: 15px 20px 15px 50px; font-size: 16px; } .search-icon { left: 15px; } .rarity-section { margin-bottom: 40px; } .rarity-header { padding: 25px 20px; margin-bottom: 20px; } .rarity-title { font-size: clamp(1.5rem, 5vw, 2rem); } .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; } .card { width: 140px; min-height: 200px; padding: 15px; } .card img { width: 80px; height: 80px; margin-bottom: 10px; } .card .id-name { font-size: 14px; margin-bottom: 8px; } .card .stats { font-size: 12px; } .god .card::before { font-size: 9px; padding: 4px 8px; top: 40%; } }
    @media (max-width: 480px) { .container { padding: 10px; } .search-section { padding: 15px; margin-bottom: 25px; } .rarity-header { padding: 20px 15px; } .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; } .card { width: 120px; min-height: 180px; padding: 12px; } .card img { width: 70px; height: 70px; margin-bottom: 8px; } .card .id-name { font-size: 13px; margin-bottom: 6px; } .card .stats { font-size: 11px; } .god .card::before { font-size: 8px; padding: 3px 6px; } .rarity-count { font-size: 14px; padding: 8px 16px; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-section">
      <a class="back-button" href="#" id="backBtn">← Back to Arena</a>
      <h1>📘 Epic Catchdex</h1>
      <div class="spacer"></div>
    </div>
    <div class="search-section">
      <div class="search-container">
        <div class="search-icon">🔍</div>
        <input type="text" id="searchInput" class="search-input" placeholder="Search for legendary Catchmon...">
      </div>
    </div>
    <div id="dexContainer">
      <div class="loading">
        <div class="loading-spinner"></div>
        <div>Loading Epic Catchmon...</div>
      </div>
    </div>
  </div>
  <script type="module" src="assets/js/pages/catchdex_live.js"></script>
</body>
</html>
