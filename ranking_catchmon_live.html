<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com https://*.firebasedatabase.app; connect-src 'self' https://*.firebasedatabase.app https://*.firebaseio.com https://www.googleapis.com wss://*.firebasedatabase.app https://www.google.com https://content-firebaseappcheck.googleapis.com https://firebaseappcheck.googleapis.com; frame-src 'self' https://www.google.com https://*.firebasedatabase.app; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'self';">
  <title>🐲 Legendary Catchmon Arena</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="assets/css/ranking_catchmon.css">
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="connection-status" id="connectionStatus">🔄 Connecting...</div>

  <div class="container">

    <div class="top-bar reveal">
      <a class="back-btn" href="index.html">← Arena</a>
    </div>

    <div class="page-header reveal">
      <div class="eyebrow">Catchmon Arena · Rankings</div>
      <h1><span class="line-white">Legendary</span><span class="line-grad">Catchmon Arena</span></h1>
    </div>

    <div class="controls reveal">
      <div class="rarity-filters">
        <button class="rarity-btn active" data-rarity="all">⚡ All</button>
        <button class="rarity-btn" data-rarity="Common">⚪ Common</button>
        <button class="rarity-btn" data-rarity="Starter">🌱 Starter</button>
        <button class="rarity-btn" data-rarity="Rare">🔵 Rare</button>
        <button class="rarity-btn" data-rarity="Legendary">🟡 Legendary</button>
        <button class="rarity-btn" data-rarity="Mythical">🟣 Mythical</button>
        <button class="rarity-btn" data-rarity="God">⚫ God</button>
      </div>
      <label class="checkbox-label">
        <input type="checkbox" id="caughtOnly">Caught only
      </label>
    </div>

    <div class="table-wrap reveal">
      <table>
        <thead>
          <tr><th>#</th><th>Sprite</th><th>Name</th><th>Catcher</th><th>Points</th><th>Level</th><th>Stats</th><th>✨</th></tr>
        </thead>
        <tbody id="rankingBody">
          <tr><td colspan="8" class="loading"><div class="spinner"></div><div>Loading...</div></td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <button class="refresh-fab" id="refreshFab" title="Refresh">🔄</button>

  <script type="module" src="assets/js/pages/ranking_catchmon.js"></script>
  <script type="module" src="assets/js/trainer_widget.js"></script>
</body>
</html>
