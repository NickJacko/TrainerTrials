<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🐲 Legendary Catchmon Arena - Firebase Live</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      color: white;
      overflow-x: hidden;
    }

    .container {
      max-width: 1400px;
      margin: auto;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    /* Firebase Connection Status */
    .connection-status {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      z-index: 1000;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .connection-status.connected {
      background: rgba(76, 175, 80, 0.9);
    }

    .connection-status.disconnected {
      background: rgba(244, 67, 54, 0.9);
    }

    /* Header Section */
    .header-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 20px 30px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .back-button {
      font-size: 16px;
      text-decoration: none;
      color: white;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      transition: all 0.2s ease;
    }

    .back-button:hover {
      background: rgba(255,255,255,0.2);
      transform: translateY(-2px);
    }

    h1 {
      text-align: center;
      flex: 1;
      font-size: clamp(1.8rem, 5vw, 3rem);
      background: linear-gradient(45deg, #FFD700, #FF6B6B, #4ECDC4, #45B7D1);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      letter-spacing: -1px;
    }

    /* Controls Section */
    .controls-section {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 25px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .controls-content {
      text-align: center;
    }

    .controls-content label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      padding: 12px 20px;
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      transition: all 0.2s ease;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .controls-content label:hover {
      background: rgba(255,255,255,0.2);
    }

    .controls-content input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #FFD700;
      cursor: pointer;
    }

    /* Table Section */
    .table-section {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 0;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }

    th {
      background: rgba(255, 215, 0, 0.2);
      color: white;
      padding: 15px 12px;
      text-align: center;
      font-weight: 700;
      font-size: 14px;
      border: none;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      transition: background-color 0.2s ease;
      color: white;
    }

    tr:hover td {
      background: rgba(255, 215, 0, 0.1);
    }

    /* Rank Badges - Simplified */
    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      font-weight: 800;
      font-size: 1rem;
      color: white;
    }

    .rank-1 { 
      background: linear-gradient(45deg, #FFD700, #FFA500);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
    }

    .rank-2 { 
      background: linear-gradient(45deg, #C0C0C0, #E8E8E8);
      color: #333;
    }

    .rank-3 { 
      background: linear-gradient(45deg, #CD7F32, #DAA520);
    }

    .rank-other { 
      background: rgba(108, 117, 125, 0.8);
    }

    /* Special Row Styling - Simplified */
    .gold-row td { 
      background: rgba(255, 215, 0, 0.15);
      border-bottom: 1px solid rgba(255, 215, 0, 0.3);
    }

    .silver-row td { 
      background: rgba(192, 192, 192, 0.15);
      border-bottom: 1px solid rgba(192, 192, 192, 0.3);
    }

    .bronze-row td { 
      background: rgba(205, 127, 50, 0.15);
      border-bottom: 1px solid rgba(205, 127, 50, 0.3);
    }

    img.catchmon-sprite {
      width: 60px;
      height: 60px;
      object-fit: contain;
      border-radius: 8px;
      transition: transform 0.2s ease;
      border: 1px solid rgba(255,255,255,0.2);
    }

    img.catchmon-sprite:hover {
      transform: scale(1.1);
    }

    a {
      text-decoration: none;
      font-weight: 600;
      color: inherit;
      transition: color 0.2s ease;
    }

    a:hover {
      color: #4CAF50;
    }

    .name-cell {
      font-weight: 700;
      font-size: 1rem;
      color: white;
    }

    .points-cell {
      font-weight: 700;
      color: #FFD700;
      font-size: 1.1rem;
    }

    .level-cell {
      font-weight: 600;
      color: #4ECDC4;
    }

    .stats-cell {
      font-weight: 600;
      color: #FF6B6B;
    }

    .shiny-badge {
      font-size: 20px;
    }

    .catcher-cell {
      font-weight: 600;
    }

    /* Donation Tier Styles - Simplified */
    .catcher-name {
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;
    }

    .king {
      background: linear-gradient(90deg, #FFD700, #FFA500);
      color: #000;
    }

    .flame {
      background: linear-gradient(90deg, #FF4444, #FF6B6B);
      color: white;
    }

    .diamond {
      background: linear-gradient(90deg, #4ECDC4, #45B7D1);
      color: white;
    }

    .shine {
      background: linear-gradient(90deg, #4CAF50, #66BB6A);
      color: white;
    }

    .normal {
      color: white;
      background: rgba(255,255,255,0.1);
    }

    /* Loading Animation */
    .loading {
      text-align: center;
      padding: 40px;
      color: rgba(255,255,255,0.8);
      font-size: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .loading-spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top: 3px solid #FFD700;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Floating Action Button */
    .refresh-fab {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: linear-gradient(45deg, #4ECDC4, #44A08D);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      z-index: 1000;
    }

    .refresh-fab:hover {
      transform: scale(1.1);
    }

    /* Mobile Optimizations */
    @media (max-width: 1024px) {
      th:nth-child(6), td:nth-child(6) { display: none; } /* Level hide */
    }

    @media (max-width: 768px) {
      .container { 
        padding: 15px; 
      }
      
      .header-section {
        flex-direction: column;
        gap: 15px;
        padding: 20px;
      }

      .header-content {
        flex-direction: column;
        gap: 15px;
      }

      .controls-section {
        padding: 15px;
      }

      table { 
        font-size: 13px; 
      }
      
      th, td { 
        padding: 10px 6px; 
      }

      img.catchmon-sprite {
        width: 45px;
        height: 45px;
      }

      .rank-badge {
        width: 28px;
        height: 28px;
        font-size: 0.8rem;
      }

      /* Hide stats sum on mobile */
      th:nth-child(7), td:nth-child(7) { 
        display: none; 
      }
    }

    @media (max-width: 480px) {
      .container { 
        padding: 10px; 
      }

      h1 { 
        font-size: 1.5rem; 
      }

      table { 
        font-size: 12px; 
      }

      th, td { 
        padding: 8px 4px; 
      }

      img.catchmon-sprite {
        width: 35px;
        height: 35px;
      }

      .rank-badge {
        width: 24px;
        height: 24px;
        font-size: 0.7rem;
      }

      .refresh-fab {
        width: 45px;
        height: 45px;
        font-size: 1rem;
      }

      /* Hide catcher on very small screens */
      th:nth-child(4), td:nth-child(4) { display: none; }
    }

    /* Scrollable table for very wide content */
    @media (max-width: 600px) {
      .table-section {
        overflow-x: auto;
      }
      
      table {
        min-width: 400px;
      }
    }

    /* Reduce motion for performance */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- Firebase Connection Status -->
  <div class="connection-status" id="connectionStatus">🔄 Verbinde...</div>

  <div class="container">
    <!-- Header Section -->
    <div class="header-section">
      <div class="header-content">
        <a class="back-button" href="javascript:history.back()">← Back</a>
        <h1>🐲 Legendary Catchmon Arena</h1>
        <div></div> <!-- Spacer -->
      </div>
    </div>

    <!-- Controls Section -->
    <div class="controls-section">
      <div class="controls-content">
        <label>
          <input type="checkbox" id="caughtOnly" onchange="renderTable()">
          Show caught only
        </label>
      </div>
    </div>

    <!-- Rankings Table -->
    <div class="table-section">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Image</th>
            <th>Name</th>
            <th>Catcher</th>
            <th>Points</th>
            <th>Level</th>
            <th>Stats</th>
            <th>Shiny</th>
          </tr>
        </thead>
        <tbody id="rankingBody">
          <tr><td colspan="8" class="loading">
            <div class="loading-spinner"></div>
            <div>🔥 Connecting to Firebase...</div>
          </td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Floating Refresh Button -->
  <button class="refresh-fab" onclick="forceRefresh()" title="Refresh Rankings">🔄</button>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { 
      getDatabase, 
      ref, 
      onValue 
    } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDdStpC5rVtgaZ4XvtKLwQttnyIDXL2z7Q",
      authDomain: "trainertrials.firebaseapp.com",
      databaseURL: "https://trainertrials-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "trainertrials",
      storageBucket: "trainertrials.firebasestorage.app",
      messagingSenderId: "22071275267",
      appId: "1:22071275267:web:92e82d6bfaee169aff8336",
      measurementId: "G-WWENZ0HP22"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Game State
    let allCatchmon = [];
    let catcherDonations = {};
    let connectionStatus = false;

    // Firebase Listeners - Optimized
    const connectedRef = ref(db, '.info/connected');
    onValue(connectedRef, (snapshot) => {
      connectionStatus = snapshot.val();
      updateConnectionStatus();
    });

    const trainersRef = ref(db, 'trainers');
    onValue(trainersRef, (snapshot) => {
      const trainersData = snapshot.val() || {};
      updateData(trainersData);
    });

    function updateConnectionStatus() {
      const statusElement = document.getElementById('connectionStatus');
      if (connectionStatus) {
        statusElement.textContent = '🟢 Connected';
        statusElement.className = 'connection-status connected';
      } else {
        statusElement.textContent = '🔴 Offline';
        statusElement.className = 'connection-status disconnected';
      }
    }

    // Utility Functions
    function sumStats(stats) {
      return Object.values(stats || {}).reduce((a, b) => a + (b || 0), 0);
    }

    function calcPoints(catchmon) {
      if (!catchmon) return 0;
      
      const level = catchmon.level || 1;
      const statSum = sumStats(catchmon.stats);
      let points = level * 10 + statSum;
      
      // Rarity multiplier
      const rarityMultipliers = {
        "Common": 1,
        "Uncommon": 1.2,
        "Rare": 1.5,
        "Epic": 2,
        "Legendary": 3,
        "Mythical": 5
      };
      
      const multiplier = rarityMultipliers[catchmon.rarity] || 1;
      points *= multiplier;
      
      if (catchmon.shiny) {
        points *= 2;
      }
      
      return Math.round(points);
    }

    function getRankClass(index) {
      if (index === 0) return 'rank-1';
      if (index === 1) return 'rank-2';
      if (index === 2) return 'rank-3';
      return 'rank-other';
    }

    function getRowClass(index) {
      if (index === 0) return 'gold-row';
      if (index === 1) return 'silver-row';
      if (index === 2) return 'bronze-row';
      return '';
    }

    function getDonationTier(donation) {
      if (donation >= 1000) return "king";
      if (donation >= 500) return "flame";
      if (donation >= 250) return "diamond";
      if (donation >= 100) return "shine";
      return "normal";
    }

    function getStyledCatcherName(catcher, donation) {
      const tier = getDonationTier(donation);
      return `<span class="catcher-name ${tier}">${catcher}</span>`;
    }

    function updateData(trainersData) {
      console.log('🔄 Loading trainers:', Object.keys(trainersData).length);
      
      allCatchmon = [];
      catcherDonations = {};

      // Process trainer data efficiently
      for (const [catcher, info] of Object.entries(trainersData)) {
        catcherDonations[catcher] = info.donation || 0;
        
        if (info.team && Array.isArray(info.team)) {
          for (const c of info.team) {
            if (c && c.name) {
              allCatchmon.push({
                catcher,
                name: c.name,
                level: c.level || 1,
                shiny: c.shiny || false,
                stats: c.stats || {},
                rarity: c.rarity || "Common",
                sprite: c.sprite || "",
                points: calcPoints(c),
                statSum: sumStats(c.stats),
                caught: true
              });
            }
          }
        }
      }

      console.log('📊 Loaded catchmon:', allCatchmon.length);
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById("rankingBody");
      const showCaughtOnly = document.getElementById("caughtOnly").checked;

      const visible = allCatchmon
        .filter(p => !showCaughtOnly || p.caught)
        .sort((a, b) => b.points - a.points);

      if (visible.length === 0) {
        tbody.innerHTML = `
          <tr><td colspan="8" class="loading">
            <div class="loading-spinner"></div>
            <div>No Catchmon found</div>
          </td></tr>
        `;
        return;
      }

      // Use DocumentFragment for better performance
      const fragment = document.createDocumentFragment();

      visible.forEach((p, index) => {
        const tr = document.createElement("tr");
        const rank = index + 1;
        const rankClass = getRankClass(index);
        const rowClass = getRowClass(index);

        if (rowClass) tr.classList.add(rowClass);

        const catcherCell = getStyledCatcherName(p.catcher, catcherDonations[p.catcher] || 0);
        const rankBadge = `<div class="rank-badge ${rankClass}">${rank}</div>`;

        tr.innerHTML = `
          <td>${rankBadge}</td>
          <td><a href="dex_detail.html?name=${encodeURIComponent(p.name)}"><img class="catchmon-sprite" src="${p.sprite}" alt="${p.name}" loading="lazy" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHZpZXdCb3g9IjAgMCA2MCA2MCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHJlY3Qgd2lkdGg9IjYwIiBoZWlnaHQ9IjYwIiByeD0iOCIgZmlsbD0iIzMzMyIvPgo8dGV4dCB4PSIzMCIgeT0iMzUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNCIgZmlsbD0iIzY2NiIgdGV4dC1hbmNob3I9Im1pZGRsZSI+PzwvdGV4dD4KPC9zdmc+Cg=='"></a></td>
          <td class="name-cell"><a href="dex_detail.html?name=${encodeURIComponent(p.name)}">${p.name}</a></td>
          <td class="catcher-cell">${catcherCell}</td>
          <td class="points-cell">${p.points.toLocaleString('de-DE')}</td>
          <td class="level-cell">${p.level}</td>
          <td class="stats-cell">${p.statSum.toLocaleString('de-DE')}</td>
          <td>${p.shiny ? '<span class="shiny-badge">✨</span>' : ""}</td>
        `;
        
        fragment.appendChild(tr);
      });

      tbody.innerHTML = '';
      tbody.appendChild(fragment);
    }

    window.forceRefresh = function() {
      console.log('🔄 Force refresh');
      document.getElementById("rankingBody").innerHTML = 
        '<tr><td colspan="8" class="loading"><div class="loading-spinner"></div><div>Refreshing...</div></td></tr>';
      
      renderTable();
    };

    window.renderTable = renderTable;

    console.log('🔥 Optimized Firebase Ranking System loaded!');
  </script>
</body>
</html>
