<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Normal — Mystische Berglandschaft</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:1080px;height:1920px;overflow:hidden;
    background:radial-gradient(ellipse 100% 75% at 50% 15%, #1e1a3a 0%, #141230 35%, #0c0d22 65%, #080818 100%);
  }
  canvas{position:absolute;inset:0;width:1080px;height:1920px;display:block;}

  /* Deep night sky gradients */
  .sky{
    position:absolute;inset:0;
    background:
      radial-gradient(ellipse 75% 55% at 65% 12%, rgba(40,30,80,0.35) 0%, transparent 55%),
      radial-gradient(ellipse 60% 45% at 20% 25%, rgba(20,15,55,0.28) 0%, transparent 50%),
      radial-gradient(ellipse 50% 40% at 88% 30%, rgba(30,20,65,0.25) 0%, transparent 48%),
      linear-gradient(180deg, #100e28 0%, #13112e 20%, #0e0c24 50%, #0a0818 80%, #060610 100%);
  }

  /* Milky Way band — diagonal diagonal */
  .milkyway{
    position:absolute;top:-100px;left:-200px;
    width:1600px;height:800px;
    background:
      linear-gradient(125deg,
        transparent 0%,
        rgba(80,60,140,0.08) 15%,
        rgba(120,100,200,0.14) 28%,
        rgba(160,130,230,0.18) 38%,
        rgba(140,110,210,0.22) 45%,
        rgba(180,150,240,0.2) 52%,
        rgba(200,160,255,0.15) 58%,
        rgba(160,120,220,0.12) 68%,
        rgba(100,80,170,0.08) 80%,
        transparent 100%);
    filter:blur(18px);
    mix-blend-mode:screen;
    animation:mwDrift 60s linear infinite;
  }
  @keyframes mwDrift{0%{transform:translateX(0)}100%{transform:translateX(-20px)}}

  /* Milky Way star density band */
  .milkyway2{
    position:absolute;top:0;left:-150px;
    width:1500px;height:600px;
    background:
      radial-gradient(ellipse 800px 120px at 55% 45%, rgba(200,180,255,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 600px 100px at 35% 60%, rgba(180,160,240,0.07) 0%, transparent 65%),
      radial-gradient(ellipse 700px 110px at 75% 35%, rgba(220,200,255,0.06) 0%, transparent 68%);
    filter:blur(8px);mix-blend-mode:screen;
    transform:rotate(-22deg);
  }

  /* Mountain silhouettes — 4 layers */
  .mtn{position:absolute;left:0;right:0;bottom:0;}
  /* Farthest — lightest blue-grey tint */
  .m4{
    height:520px;
    background:linear-gradient(180deg,#1c1a38 0%,#141230 60%,#0e0c24 100%);
    clip-path:polygon(0 100%,0 55%,4% 42%,8% 56%,13% 36%,18% 52%,23% 28%,28% 46%,33% 20%,38% 40%,43% 14%,48% 35%,53% 10%,58% 32%,63% 18%,68% 38%,73% 26%,78% 44%,83% 30%,88% 48%,93% 36%,98% 52%,100% 45%,100% 100%);
  }
  /* 3rd layer */
  .m3{
    height:480px;
    background:linear-gradient(180deg,#161428 0%,#0f0d1e 60%,#0a0816 100%);
    clip-path:polygon(0 100%,0 60%,5% 46%,10% 62%,15% 38%,20% 58%,25% 30%,30% 50%,35% 22%,40% 44%,45% 16%,50% 38%,55% 12%,60% 36%,65% 22%,70% 42%,75% 30%,80% 50%,85% 36%,90% 54%,95% 40%,100% 55%,100% 100%);
  }
  /* 2nd layer */
  .m2{
    height:420px;
    background:linear-gradient(180deg,#0e0c20 0%,#09081a 60%,#060512 100%);
    clip-path:polygon(0 100%,0 62%,6% 48%,12% 65%,18% 42%,24% 60%,30% 32%,36% 55%,42% 24%,48% 48%,54% 18%,60% 42%,66% 28%,72% 50%,78% 34%,84% 55%,90% 40%,96% 58%,100% 50%,100% 100%);
  }
  /* Nearest — darkest */
  .m1{
    height:360px;
    background:linear-gradient(180deg,#08061a 0%,#050410 60%,#020208 100%);
    clip-path:polygon(0 100%,0 65%,7% 50%,14% 68%,21% 44%,28% 64%,35% 35%,42% 58%,49% 26%,55% 50%,58% 40%,62% 55%,65% 30%,72% 52%,79% 36%,86% 56%,93% 42%,100% 58%,100% 100%);
  }
  /* Peak highlight on nearest mountains */
  .m1-snow{
    position:absolute;bottom:0;left:0;right:0;height:200px;
    clip-path:polygon(49% 0%,55% 14%,58% 8%,62% 16%,65% 4%,72% 18%,75% 12%,79% 20%);
    background:rgba(180,200,255,0.06);
    filter:blur(3px);
  }

  /* Summit platform — where the ring observatory sits */
  .summit{
    position:absolute;bottom:355px;left:50%;transform:translateX(-50%);
    width:200px;height:15px;
    background:linear-gradient(90deg,transparent,rgba(120,140,200,0.18),rgba(150,170,220,0.22),rgba(120,140,200,0.18),transparent);
    border-radius:50%;filter:blur(2px);
  }

  /* Village lights glow — behind mountains */
  .village-glow{
    position:absolute;bottom:160px;left:50%;transform:translateX(-50%);
    width:680px;height:180px;
    background:
      radial-gradient(ellipse 280px 80px at 35% 65%, rgba(255,200,80,0.12) 0%, transparent 65%),
      radial-gradient(ellipse 220px 65px at 68% 55%, rgba(255,180,60,0.1) 0%, transparent 58%),
      radial-gradient(ellipse 160px 50px at 52% 80%, rgba(255,190,70,0.08) 0%, transparent 52%);
    mix-blend-mode:screen;
    animation:villagePulse 5s ease-in-out infinite;
  }
  @keyframes villagePulse{0%,100%{opacity:0.7}50%{opacity:1}}

  /* Observatory ring glow */
  .ring-obs{
    position:absolute;top:218px;left:50%;transform:translateX(-50%);
    width:830px;height:830px;border-radius:50%;
    background:radial-gradient(ellipse 100% 100% at 50% 50%,
      rgba(150,170,255,0.08) 0%,rgba(100,120,220,0.04) 48%,transparent 68%);
    mix-blend-mode:screen;filter:blur(18px);
    animation:obsGlow 6s ease-in-out infinite;
  }
  @keyframes obsGlow{0%,100%{opacity:0.5;transform:translateX(-50%) scale(1)}50%{opacity:0.85;transform:translateX(-50%) scale(1.015)}}

  /* UI */
  .center-darken{position:absolute;top:300px;left:50%;transform:translateX(-50%);width:780px;height:540px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(0,0,8,0.42) 0%,transparent 70%);z-index:38;}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse 82% 72% at 50% 50%,transparent 36%,rgba(0,0,8,0.78) 100%);z-index:39;pointer-events:none;}
  .zone-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(0,0,0,0.5) 0%,transparent 100%);z-index:40;}
  .zone-bot{position:absolute;bottom:0;left:0;right:0;height:920px;background:linear-gradient(0deg,rgba(0,0,8,0.65) 0%,rgba(0,0,8,0.14) 40%,transparent 100%);z-index:40;}
</style>
</head>
<body>
  <div class="sky"></div>
  <div class="milkyway"></div>
  <div class="milkyway2"></div>

  <!-- Canvas stack: stars → ring → meteors → village → particles -->
  <canvas id="cStars"></canvas>
  <canvas id="cRing"></canvas>
  <canvas id="cMeteors"></canvas>
  <canvas id="cVillage"></canvas>
  <canvas id="cParticles"></canvas>

  <div class="mtn"><div class="m4"></div><div class="m3"></div><div class="m2"></div><div class="m1"></div></div>
  <div class="m1-snow"></div>
  <div class="summit"></div>
  <div class="village-glow"></div>
  <div class="ring-obs"></div>
  <div class="center-darken"></div>
  <div class="vignette"></div>
  <div class="zone-top"></div>
  <div class="zone-bot"></div>

<script>
const W=1080, H=1920;
const RING_CX=540, RING_CY=590, RING_R=300;

function mkCanvas(id){
  const c=document.getElementById(id);
  c.width=W; c.height=H;
  return c.getContext('2d');
}
const starsCtx   = mkCanvas('cStars');
const ringCtx    = mkCanvas('cRing');
const meteorCtx  = mkCanvas('cMeteors');
const villageCtx = mkCanvas('cVillage');
const partCtx    = mkCanvas('cParticles');

/* ═══════════════════════════════════════════════════════════════════════════
   STAR FIELD — 420 stars, various types
   ═══════════════════════════════════════════════════════════════════════════ */
const STAR_COUNT=420;
const stars=[];

// Star color distribution
function starColor(rand){
  if(rand<0.08) return {h:220,s:80,l:80}; // blue
  if(rand<0.14) return {h:45,s:85,l:82};  // yellow
  if(rand<0.18) return {h:28,s:80,l:78};  // orange
  if(rand<0.22) return {h:340,s:70,l:80}; // red
  return null; // white
}

for(let i=0;i<STAR_COUNT;i++){
  const x=Math.random()*W, y=Math.random()*H*0.72;
  const col=starColor(Math.random());
  stars.push({
    x, y,
    baseX:x, baseY:y,
    r:0.3+Math.random()*2.0,
    a:0.25+Math.random()*0.75,
    col,
    flicker:Math.random()<0.07,
    flickPhase:Math.random()*Math.PI*2,
    flickSp:0.03+Math.random()*0.06,
    // Orbiting stars around ring
    orbit:i<55,
    orbitAng:Math.random()*Math.PI*2,
    orbitR:i<55?(200+Math.random()*320):0,
    orbitSp:i<55?((0.0003+Math.random()*0.0004)*(Math.random()<0.5?1:-1)):0,
  });
}

// Draw static milky way star field on star canvas once
(function drawMilkyWayStars(){
  for(let i=0;i<600;i++){
    // Stars distributed along the MW band diagonal
    const bandT=Math.random();
    const bandX=W*0.05+bandT*W*1.1;
    const bandY=H*0.72-bandT*H*0.55+(Math.random()-0.5)*160;
    if(bandY<0||bandY>H*0.72) continue;
    const a=0.02+Math.random()*0.08;
    const r=0.2+Math.random()*0.8;
    starsCtx.fillStyle=`rgba(${180+Math.floor(Math.random()*75)},${170+Math.floor(Math.random()*65)},${210+Math.floor(Math.random()*45)},${a})`;
    starsCtx.beginPath();starsCtx.arc(bandX,bandY,r,0,Math.PI*2);starsCtx.fill();
  }
})();

/* ═══════════════════════════════════════════════════════════════════════════
   RING: Observatory — telescope rings + constellation + rotating stars
   ═══════════════════════════════════════════════════════════════════════════ */
// Telescope coordinate rings
const SCOPE_RINGS=[
  {r:RING_R+40,  alpha:0.12, dash:12, gap:18},
  {r:RING_R+90,  alpha:0.09, dash:20, gap:28},
  {r:RING_R+145, alpha:0.07, dash:8,  gap:22},
];

// Constellation lines — connect nearby orbit-stars
let constellLines=[];
let constellTimer=0;
let constellFade=0; // 0=hidden,1=appearing,2=visible,3=fading
let constellLife=0;

// Crosshair lines (telescope reticle)
const reticlePulse={phase:0, sp:0.008};

/* ═══════════════════════════════════════════════════════════════════════════
   METEORS
   ═══════════════════════════════════════════════════════════════════════════ */
const meteors=[];
let meteorTimer=0;
let nextMeteorTime=4+Math.random()*5;
const meteorSparks=[];

function spawnMeteor(){
  const fromEdge=Math.floor(Math.random()*3); // 0=top, 1=left, 2=right
  let sx,sy,angle;
  if(fromEdge===0){sx=Math.random()*W;sy=-20;angle=Math.PI/2+Math.PI*(Math.random()-0.5)*0.6;}
  else if(fromEdge===1){sx=-20;sy=Math.random()*H*0.55;angle=Math.PI*(0.1+Math.random()*0.3);}
  else{sx=W+20;sy=Math.random()*H*0.55;angle=Math.PI*(0.7+Math.random()*0.3);}
  const len=60+Math.random()*160;
  const spd=12+Math.random()*10;
  const hue=Math.random()<0.4?200+Math.random()*30:0; // some blue, most white
  meteors.push({
    x:sx,y:sy,
    vx:Math.cos(angle)*spd, vy:Math.sin(angle)*spd,
    len,
    life:1,
    decay:0.025+Math.random()*0.02,
    hue,
    width:1.5+Math.random()*2,
    trail:[],
    throughRing:Math.random()<0.18, // some pass through ring area
  });
  // Sometimes double
  if(Math.random()<0.22){
    const offset=(Math.random()-0.5)*120;
    meteors.push({
      x:sx+Math.cos(angle+Math.PI/2)*offset,
      y:sy+Math.sin(angle+Math.PI/2)*offset,
      vx:Math.cos(angle)*spd*(0.85+Math.random()*0.3),
      vy:Math.sin(angle)*spd*(0.85+Math.random()*0.3),
      len:len*0.6,life:0.9,decay:0.03+Math.random()*0.02,hue,width:1+Math.random()*1.5,trail:[],throughRing:false,
    });
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   VILLAGE LIGHTS — warm flickering in the valley
   ═══════════════════════════════════════════════════════════════════════════ */
const villageX=[-260,-180,-110,-50,0,45,90,140,185,225,265,300,-220,-140,-70,10,65,120,170,210,250,-190,-100,-20,55,110,160];
const villageY=[-30,-20,-35,-15,-28,-18,-25,-12,-30,-22,-38,-10,-20,-35,-18,-28,-15,-32,-20,-25,-12,-28,-15,-22,-32,-18,-25];
const villageLights=villageX.map((ox,i)=>{
  return{
    x:RING_CX+ox+(Math.random()-0.5)*20,
    y:H-280+villageY[i]+(Math.random()-0.5)*15,
    r:1+Math.random()*2.5,
    phase:Math.random()*Math.PI*2,
    sp:0.04+Math.random()*0.08,
    hue:38+Math.random()*20,
    a:0.45+Math.random()*0.4,
  };
});

/* ═══════════════════════════════════════════════════════════════════════════
   PARTICLES: Cosmic dust + afterglow
   ═══════════════════════════════════════════════════════════════════════════ */
const cosmicDust=[];
for(let i=0;i<48;i++){
  cosmicDust.push({
    x:Math.random()*W, y:Math.random()*H*0.75,
    vx:(Math.random()-0.5)*0.04, vy:(Math.random()-0.5)*0.03,
    r:0.4+Math.random()*1.2,
    a:0.05+Math.random()*0.12,
    phase:Math.random()*Math.PI*2,
    sp:0.004+Math.random()*0.007,
    hue:200+Math.random()*60,
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   MAIN LOOP
   ═══════════════════════════════════════════════════════════════════════════ */
let t=0;

function loop(){
  t+=0.016;

  /* ── STARS ── */
  // Don't clearRect on full canvas — we keep the static MW base
  // Instead draw a semi-transparent overlay to fade previous dynamic stars
  starsCtx.fillStyle='rgba(10,8,24,0.18)';
  starsCtx.fillRect(0,0,W,H);

  for(const s of stars){
    if(s.orbit){
      s.orbitAng+=s.orbitSp;
      s.x=RING_CX+Math.cos(s.orbitAng)*s.orbitR;
      s.y=RING_CY+Math.sin(s.orbitAng)*s.orbitR;
      // Only show if above mountain line (rough)
      if(s.y>H*0.72) continue;
    }
    let alpha=s.a;
    if(s.flicker){
      s.flickPhase+=s.flickSp;
      alpha=s.a*(0.3+Math.abs(Math.sin(s.flickPhase))*0.8);
    }
    let col;
    if(s.col){
      col=`hsla(${s.col.h},${s.col.s}%,${s.col.l}%,${alpha})`;
    } else {
      col=`rgba(${210+Math.floor(Math.random()*45)},${215+Math.floor(Math.random()*40)},${240+Math.floor(Math.random()*15)},${alpha})`;
    }
    // Larger stars get a subtle cross diffraction spike
    if(s.r>1.4){
      starsCtx.strokeStyle=col.replace(`)`,',0.3)'). replace('rgba(','rgba(').replace('hsla(','hsla(');
      starsCtx.lineWidth=0.5;
      starsCtx.beginPath();
      starsCtx.moveTo(s.x-s.r*2.5,s.y);starsCtx.lineTo(s.x+s.r*2.5,s.y);
      starsCtx.moveTo(s.x,s.y-s.r*2.5);starsCtx.lineTo(s.x,s.y+s.r*2.5);
      starsCtx.stroke();
    }
    starsCtx.fillStyle=col;
    if(s.r>1.2){starsCtx.shadowBlur=4;starsCtx.shadowColor=col;}
    starsCtx.beginPath();starsCtx.arc(s.x,s.y,s.r,0,Math.PI*2);starsCtx.fill();
    starsCtx.shadowBlur=0;
  }

  /* ── RING: Observatory ── */
  ringCtx.clearRect(0,0,W,H);

  // Reticle pulse
  reticlePulse.phase+=reticlePulse.sp;
  const retPulse=0.4+Math.sin(reticlePulse.phase)*0.25;

  // Telescope coordinate rings
  for(const sr of SCOPE_RINGS){
    ringCtx.strokeStyle=`rgba(160,185,255,${sr.alpha*retPulse})`;
    ringCtx.lineWidth=0.8;
    ringCtx.setLineDash([sr.dash,sr.gap]);
    ringCtx.lineDashOffset=t*5;
    ringCtx.beginPath();ringCtx.arc(RING_CX,RING_CY,sr.r,0,Math.PI*2);ringCtx.stroke();
  }
  ringCtx.setLineDash([]);

  // Crosshair lines
  const crossAlpha=0.1*retPulse;
  ringCtx.strokeStyle=`rgba(180,200,255,${crossAlpha})`;
  ringCtx.lineWidth=0.6;
  ringCtx.beginPath();
  ringCtx.moveTo(RING_CX-RING_R*1.6,RING_CY);ringCtx.lineTo(RING_CX+RING_R*1.6,RING_CY);
  ringCtx.moveTo(RING_CX,RING_CY-RING_R*1.6);ringCtx.lineTo(RING_CX,RING_CY+RING_R*1.6);
  ringCtx.stroke();

  // Constellation lines between nearby orbit-stars
  constellTimer+=0.016;
  if(constellFade===0 && constellTimer>8+Math.random()*6){
    // Build constellation
    constellLines=[];
    const orbitStars=stars.filter(s=>s.orbit&&s.y<H*0.72);
    const used=new Set();
    for(let i=0;i<orbitStars.length;i++){
      if(used.has(i)) continue;
      for(let j=i+1;j<orbitStars.length;j++){
        const dx=orbitStars[i].x-orbitStars[j].x;
        const dy=orbitStars[i].y-orbitStars[j].y;
        const dist=Math.hypot(dx,dy);
        if(dist<120+Math.random()*60&&constellLines.length<6){
          constellLines.push({s1:orbitStars[i],s2:orbitStars[j]});
          used.add(i);used.add(j);
        }
      }
    }
    constellFade=1;constellTimer=0;constellLife=0;
  }
  if(constellFade===1){
    constellLife=Math.min(1,constellLife+0.015);
    if(constellLife>=1) constellFade=2;
  }
  if(constellFade===2){
    constellTimer+=0.016;
    if(constellTimer>5+Math.random()*3){constellFade=3;constellTimer=0;}
  }
  if(constellFade===3){
    constellLife=Math.max(0,constellLife-0.01);
    if(constellLife<=0){constellFade=0;constellTimer=0;constellLines=[];}
  }
  if(constellLines.length>0&&constellLife>0){
    for(const cl of constellLines){
      ringCtx.strokeStyle=`rgba(180,210,255,${0.25*constellLife})`;
      ringCtx.lineWidth=0.7;
      ringCtx.shadowBlur=3;ringCtx.shadowColor='rgba(180,210,255,0.4)';
      ringCtx.beginPath();ringCtx.moveTo(cl.s1.x,cl.s1.y);ringCtx.lineTo(cl.s2.x,cl.s2.y);ringCtx.stroke();
    }
    ringCtx.shadowBlur=0;
  }

  // Central observatory glow
  const obsG=ringCtx.createRadialGradient(RING_CX,RING_CY,0,RING_CX,RING_CY,RING_R+160);
  obsG.addColorStop(0,`rgba(140,170,255,${0.1*retPulse})`);
  obsG.addColorStop(0.4,`rgba(100,130,220,${0.04*retPulse})`);
  obsG.addColorStop(1,'rgba(0,0,0,0)');
  ringCtx.fillStyle=obsG;ringCtx.beginPath();ringCtx.arc(RING_CX,RING_CY,RING_R+160,0,Math.PI*2);ringCtx.fill();

  /* ── METEORS ── */
  meteorCtx.clearRect(0,0,W,H);
  meteorTimer+=0.016;
  if(meteorTimer>nextMeteorTime){
    meteorTimer=0; nextMeteorTime=4+Math.random()*6;
    spawnMeteor();
  }

  for(let i=meteors.length-1;i>=0;i--){
    const m=meteors[i];
    m.trail.unshift({x:m.x,y:m.y});
    if(m.trail.length>20) m.trail.pop();
    m.x+=m.vx; m.y+=m.vy;
    m.life-=m.decay;
    if(m.life<=0||m.x<-200||m.x>W+200||m.y>H+200){
      // Afterglow sparks
      if(m.life>0.3){
        for(let si=0;si<4+Math.floor(Math.random()*4);si++){
          const ang=Math.random()*Math.PI*2;
          const spd=1+Math.random()*3;
          meteorSparks.push({
            x:m.x,y:m.y,
            vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
            life:0.6+Math.random()*0.4,
            decay:0.02+Math.random()*0.03,
            r:0.8+Math.random()*1.5,
            hue:m.hue,
          });
        }
      }
      meteors.splice(i,1);continue;
    }

    // Meteor head + trail
    for(let ti=1;ti<m.trail.length;ti++){
      const ta=(1-ti/m.trail.length)*m.life;
      const tw=m.width*(1-ti/m.trail.length)*0.8;
      if(m.hue){
        meteorCtx.strokeStyle=`hsla(${m.hue},80%,80%,${ta*0.7})`;
      } else {
        meteorCtx.strokeStyle=`rgba(255,255,255,${ta*0.7})`;
      }
      meteorCtx.lineWidth=tw;meteorCtx.lineCap='round';
      meteorCtx.beginPath();
      meteorCtx.moveTo(m.trail[ti-1].x,m.trail[ti-1].y);
      meteorCtx.lineTo(m.trail[ti].x,m.trail[ti].y);
      meteorCtx.stroke();
    }
    // Bright head
    meteorCtx.shadowBlur=10;
    meteorCtx.shadowColor=m.hue?`hsla(${m.hue},90%,85%,0.9)`:'rgba(255,255,255,0.9)';
    meteorCtx.fillStyle=m.hue?`hsla(${m.hue},85%,88%,${m.life})`:`rgba(255,255,255,${m.life})`;
    meteorCtx.beginPath();meteorCtx.arc(m.x,m.y,m.width*0.9,0,Math.PI*2);meteorCtx.fill();
    meteorCtx.shadowBlur=0;
  }
  // Afterglow sparks
  for(let i=meteorSparks.length-1;i>=0;i--){
    const s=meteorSparks[i];
    s.x+=s.vx;s.y+=s.vy;s.vy+=0.04;s.life-=s.decay;
    if(s.life<=0){meteorSparks.splice(i,1);continue;}
    meteorCtx.fillStyle=s.hue?`hsla(${s.hue},80%,78%,${s.life*0.6})`:`rgba(220,230,255,${s.life*0.6})`;
    meteorCtx.beginPath();meteorCtx.arc(s.x,s.y,s.r,0,Math.PI*2);meteorCtx.fill();
  }

  /* ── VILLAGE LIGHTS ── */
  villageCtx.clearRect(0,0,W,H);
  villageCtx.save();
  for(const vl of villageLights){
    vl.phase+=vl.sp;
    const flick=0.55+Math.sin(vl.phase)*0.35+Math.sin(vl.phase*2.1)*0.1;
    // Check if light is in valley (between mountain peaks — approximate)
    const vg=villageCtx.createRadialGradient(vl.x,vl.y,0,vl.x,vl.y,vl.r*4);
    vg.addColorStop(0,`hsla(${vl.hue},90%,75%,${vl.a*flick})`);
    vg.addColorStop(0.4,`hsla(${vl.hue},85%,60%,${vl.a*flick*0.4})`);
    vg.addColorStop(1,'rgba(0,0,0,0)');
    villageCtx.shadowBlur=8;villageCtx.shadowColor=`hsla(${vl.hue},90%,65%,0.6)`;
    villageCtx.fillStyle=vg;
    villageCtx.beginPath();villageCtx.arc(vl.x,vl.y,vl.r*4,0,Math.PI*2);villageCtx.fill();
    villageCtx.fillStyle=`hsla(${vl.hue+8},95%,85%,${vl.a*flick*0.9})`;
    villageCtx.beginPath();villageCtx.arc(vl.x,vl.y,vl.r,0,Math.PI*2);villageCtx.fill();
  }
  villageCtx.shadowBlur=0;villageCtx.restore();

  /* ── PARTICLES: Cosmic dust ── */
  partCtx.clearRect(0,0,W,H);
  for(const d of cosmicDust){
    d.phase+=d.sp;
    d.x+=d.vx; d.y+=d.vy;
    if(d.x<0)d.x=W;if(d.x>W)d.x=0;
    if(d.y<0)d.y=H*0.7;if(d.y>H*0.72)d.y=0;
    const pulse=0.5+Math.sin(d.phase)*0.4;
    partCtx.fillStyle=`hsla(${d.hue},60%,70%,${d.a*pulse})`;
    partCtx.beginPath();partCtx.arc(d.x,d.y,d.r,0,Math.PI*2);partCtx.fill();
  }

  requestAnimationFrame(loop);
}

loop();
</script>
