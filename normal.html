<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Normal — Mystische Berglandschaft</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#1a1a2e;}
canvas{position:absolute;inset:0;width:1080px;height:1920px;display:block;}
.bg{position:absolute;inset:0;background:
  radial-gradient(ellipse 80% 45% at 50% 35%, #2d2a5a 0%, #1a1a3e 50%, transparent 80%),
  linear-gradient(180deg, #1a1a2e 0%, #16213e 40%, #1a1a3e 70%, #0e0e20 100%);}
/* Milky way band */
.mw{position:absolute;top:100px;left:-200px;right:-200px;height:900px;
  background:
    radial-gradient(ellipse 60% 15% at 40% 50%, rgba(180,160,255,0.22) 0%, transparent 60%),
    radial-gradient(ellipse 70% 20% at 55% 55%, rgba(200,180,255,0.18) 0%, transparent 65%);
  transform:rotate(-18deg);filter:blur(20px);mix-blend-mode:screen;}
/* Mountain layers — back to front, darker as closer */
.mtn{position:absolute;left:0;right:0;}
.mtn-bg{bottom:340px;height:220px;background:#1e1e42;
  clip-path:polygon(0 100%, 0 60%, 6% 55%, 14% 65%, 22% 45%, 30% 60%, 38% 38%, 46% 55%, 54% 32%, 62% 55%, 70% 40%, 78% 60%, 86% 48%, 94% 62%, 100% 55%, 100% 100%);}
.mtn-mid{bottom:280px;height:280px;background:#141430;
  clip-path:polygon(0 100%, 0 55%, 8% 45%, 18% 60%, 28% 30%, 38% 50%, 48% 22%, 58% 48%, 68% 28%, 78% 55%, 88% 38%, 96% 55%, 100% 50%, 100% 100%);}
.mtn-fg{bottom:220px;height:340px;background:#08081a;
  clip-path:polygon(0 100%, 0 50%, 7% 35%, 16% 55%, 26% 20%, 34% 42%, 44% 12%, 54% 40%, 64% 18%, 74% 45%, 84% 25%, 92% 50%, 100% 40%, 100% 100%);}
/* Foreground ground */
.ground{position:absolute;bottom:0;left:0;right:0;height:220px;background:linear-gradient(180deg, #0a0a1a 0%, #050510 60%, #02020a 100%);}

.zone-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(0,0,0,0.5) 0%,transparent 100%);z-index:40;}
.zone-bot{position:absolute;bottom:0;left:0;right:0;height:920px;background:linear-gradient(0deg,rgba(5,5,15,0.55) 0%,rgba(5,5,15,0.12) 40%,transparent 100%);z-index:40;}
.center-darken{position:absolute;top:300px;left:50%;transform:translateX(-50%);width:780px;height:540px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(5,5,20,0.32) 0%,transparent 70%);z-index:38;}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 40%,rgba(0,0,0,0.6) 100%);z-index:39;pointer-events:none;}
</style>
</head>
<body>
<div class="bg"></div>
<div class="mw"></div>
<canvas id="stars"></canvas>
<canvas id="meteors"></canvas>
<div class="mtn mtn-bg"></div>
<div class="mtn mtn-mid"></div>
<div class="mtn mtn-fg"></div>
<div class="ground"></div>
<canvas id="dust"></canvas>
<div class="center-darken"></div>
<div class="vignette"></div>
<div class="zone-top"></div>
<div class="zone-bot"></div>
<script>
const W=1080,H=1920;
function setup(id){const c=document.getElementById(id);c.width=W;c.height=H;return c.getContext('2d');}

const st=setup('stars');
const stars=[];
for(let i=0;i<320;i++)stars.push({
  x0:Math.random()*W-W/2,y0:Math.random()*1200-600,
  r:Math.random()*1.5+0.2,tw:Math.random()*Math.PI*2,
  hue:Math.random()<0.15?220:Math.random()<0.25?40:Math.random()<0.35?300:0
});

const mt=setup('meteors');
const meteors=[];

const du=setup('dust');
const dust=[];
for(let i=0;i<40;i++)dust.push({x:Math.random()*W,y:Math.random()*H,r:0.5+Math.random()*1.2,vx:(Math.random()-0.5)*0.15,vy:(Math.random()-0.5)*0.08,a:0.15+Math.random()*0.25,hue:220+Math.random()*40});

let t=0,spin=0;
function loop(){
  t+=0.016;spin+=0.0002;

  // Rotating starfield
  st.clearRect(0,0,W,H);
  const cx=W/2,cy=800;
  for(const s of stars){
    s.tw+=0.025;
    const ca=Math.cos(spin),sa=Math.sin(spin);
    const rx=s.x0*ca-s.y0*sa;
    const ry=s.x0*sa+s.y0*ca;
    const x=cx+rx,y=cy+ry;
    if(x<-10||x>W+10||y<-10||y>1300)continue;
    const a=0.4+Math.sin(s.tw)*0.5;
    if(s.hue===220)st.fillStyle=`rgba(180,200,255,${a})`;
    else if(s.hue===40)st.fillStyle=`rgba(255,230,180,${a})`;
    else if(s.hue===300)st.fillStyle=`rgba(220,180,255,${a})`;
    else st.fillStyle=`rgba(255,255,255,${a})`;
    st.beginPath();st.arc(x,y,s.r,0,Math.PI*2);st.fill();
  }

  // Meteors — occasional
  if(Math.random()<0.015&&meteors.length<3){
    meteors.push({x:Math.random()*W,y:-20,vx:-3-Math.random()*3,vy:5+Math.random()*4,life:1,len:60+Math.random()*80});
  }
  mt.clearRect(0,0,W,H);
  for(let i=meteors.length-1;i>=0;i--){
    const m=meteors[i];m.x+=m.vx;m.y+=m.vy;m.life-=0.01;
    if(m.life<=0||m.y>1200){meteors.splice(i,1);continue;}
    const g=mt.createLinearGradient(m.x,m.y,m.x-m.vx*m.len/8,m.y-m.vy*m.len/8);
    g.addColorStop(0,`rgba(255,255,255,${m.life})`);
    g.addColorStop(0.4,`rgba(200,180,255,${m.life*0.6})`);
    g.addColorStop(1,'rgba(180,160,255,0)');
    mt.strokeStyle=g;mt.lineWidth=2.5;mt.lineCap='round';
    mt.shadowBlur=12;mt.shadowColor='#d0c0ff';
    mt.beginPath();mt.moveTo(m.x,m.y);mt.lineTo(m.x-m.vx*m.len/8,m.y-m.vy*m.len/8);mt.stroke();
  }
  mt.shadowBlur=0;

  du.clearRect(0,0,W,H);
  for(const d of dust){d.x+=d.vx;d.y+=d.vy;
    if(d.x<0)d.x=W;if(d.x>W)d.x=0;if(d.y<0)d.y=H;if(d.y>H)d.y=0;
    du.fillStyle=`hsla(${d.hue},80%,80%,${d.a})`;du.beginPath();du.arc(d.x,d.y,d.r,0,Math.PI*2);du.fill();}
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
