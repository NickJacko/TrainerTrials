<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catchmon Live Hub</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: radial-gradient(ellipse at center, #1a1a2e 0%, #16213e 30%, #0f0f23 70%, #000000 100%);
      color: white;
      overflow-x: hidden;
    }
    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }
    .card-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .card {
      background: rgba(255,255,255,0.05);
      padding: 20px;
      border-radius: 10px;
      flex: 1 1 250px;
      text-align: center;
    }
    .card-title {
      font-size: 1.2rem;
      font-weight: bold;
    }
    .points-highlight {
      font-size: 1.5rem;
      color: gold;
      margin-top: 10px;
    }
    .catcher-name {
      display: inline-block;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }
    .king { background-image: linear-gradient(90deg, #ffd700, #ffffff, #ffd700); }
    .flame { background-image: linear-gradient(90deg, #ff4500, #ffffff, #ff4500); }
    .diamond { background-image: linear-gradient(90deg, #00bfff, #ffffff, #00bfff); }
    .shine { background-image: linear-gradient(90deg, #32cd32, #ffffff, #32cd32); }
    .normal {
      color: white;
      -webkit-text-fill-color: inherit;
      background: none;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .stat-card {
      background: rgba(255,255,255,0.1);
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }
    .fab {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: gold;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 Live Hub</h1>
    <p>The Ultimate Catchmon Arena Experience</p>

    <h2>📊 Arena Statistics</h2>
    <div class="stat-grid">
      <div class="stat-card"><strong>Total Spawns</strong><br><span id="statSpawns">...</span></div>
      <div class="stat-card"><strong>Total Catches</strong><br><span id="statCatches">...</span></div>
      <div class="stat-card"><strong>Total Escapes</strong><br><span id="statEscapes">...</span></div>
      <div class="stat-card"><strong>Total Likes Ever</strong><br><span id="statLikes">...</span></div>
    </div>

    <h2>🏆 Elite Catchers</h2>
    <div id="catchers" class="card-row"></div>

    <h2>🐲 Legendary Catchmon</h2>
    <div id="legendaries" class="card-row"></div>
  </div>

  <script>
    const data = {
      stats: {
        totalSpawns: 124587,
        totalCatches: 78942,
        totalEscapes: 45645,
        totalLikesEver: 238754
      },
      topCatchers: [
        { name: "MasterCatcher99", points: 9850, catches: 387, rares: 42, tier: "king" },
        { name: "DragonWhisperer", points: 8720, catches: 352, rares: 38, tier: "flame" },
        { name: "CatchmonHunter", points: 7890, catches: 316, rares: 29, tier: "diamond" },
        { name: "PokeLegend", points: 6540, catches: 289, rares: 22, tier: "shine" },
        { name: "CatchEmAll", points: 5980, catches: 254, rares: 19, tier: "normal" }
      ],
      legendaryCreatures: [
        { name: "DracoMaximus", catcher: "MasterCatcher99", power: 9850, rarity: "Mythical" },
        { name: "ThunderBeast", catcher: "DragonWhisperer", power: 8720, rarity: "Legendary" },
        { name: "ShadowPhoenix", catcher: "CatchmonHunter", power: 7890, rarity: "Legendary" }
      ]
    };

    document.getElementById('statSpawns').textContent = data.stats.totalSpawns;
    document.getElementById('statCatches').textContent = data.stats.totalCatches;
    document.getElementById('statEscapes').textContent = data.stats.totalEscapes;
    document.getElementById('statLikes').textContent = data.stats.totalLikesEver;

    const catcherContainer = document.getElementById('catchers');
    data.topCatchers.forEach(c => {
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = `
        <div class="card-title"><span class="catcher-name ${c.tier}">${c.name}</span></div>
        <div>Catches: ${c.catches} | Rares: ${c.rares}</div>
        <div class="points-highlight">${c.points} PTS</div>
      `;
      catcherContainer.appendChild(el);
    });

    const legendaryContainer = document.getElementById('legendaries');
    data.legendaryCreatures.forEach(l => {
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = `
        <div class="card-title">${l.name}</div>
        <div>Caught by: ${l.catcher} | Rarity: ${l.rarity}</div>
        <div class="points-highlight">${l.power} PWR</div>
      `;
      legendaryContainer.appendChild(el);
    });
  </script>
</body>
</html>
