<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Offline - TrainerTrials</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: radial-gradient(ellipse at center, #1a1a2e 0%, #16213e 30%, #0f0f23 70%, #000000 100%);
      min-height: 100vh; color: white;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 20px;
    }

    .container {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      border-radius: 25px;
      padding: 50px 40px;
      border: 1px solid rgba(255,255,255,0.15);
      max-width: 500px;
      width: 100%;
    }

    .icon { font-size: 5rem; margin-bottom: 20px; }

    h1 {
      font-size: 2rem; font-weight: 800; margin-bottom: 15px;
      background: linear-gradient(45deg, #FFD700, #FF6B6B);
      background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 1.1rem; color: rgba(255,255,255,0.8);
      margin-bottom: 30px; line-height: 1.6;
    }

    .retry-btn {
      display: inline-block; padding: 15px 35px;
      background: linear-gradient(135deg, #4CAF50, #45a049);
      color: white; font-weight: 700; border-radius: 15px;
      text-decoration: none; font-size: 1.1rem;
      border: none; cursor: pointer;
      box-shadow: 0 6px 20px rgba(76,175,80,0.4);
      transition: all 0.3s ease;
    }

    .retry-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(76,175,80,0.5);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>No internet connection detected. Please check your connection and try again.</p>
    <button class="retry-btn" onclick="window.location.reload()">🔄 Try Again</button>
  </div>
</body>
</html>
