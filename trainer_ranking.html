<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Trainer Ranking</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background-color: #f9f9f9; }
    h1 { text-align: center; }
    input {
      display: block;
      margin: 10px auto 20px;
      padding: 8px;
      font-size: 16px;
      width: 80%;
      max-width: 400px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; border: 1px solid #ccc; text-align: center; }
    th { background-color: #eee; cursor: pointer; }
  </style>
</head>
<body>
  <h1>🏆 Trainer Ranking</h1>
  <input type="text" id="searchInput" placeholder="Search trainer name..." onkeyup="filterTable()">
  <table id="rankingTable">
    <thead>
      <tr>
        <th onclick="sortTable(0)">#</th>
        <th onclick="sortTable(1)">Trainer</th>
        <th onclick="sortTable(2)">Pokémon</th>
        <th onclick="sortTable(3)">Gesamtpunkte</th>
      </tr>
    </thead>
    <tbody>
<tr><td>1</td><td style="color:gold; font-weight:bold;"><a href="trainer_pages/Nick.html" style="color:gold; text-decoration:none;">💎 Nick</a></td><td>1</td><td>0</td></tr>
<tr><td>2</td><td style="color:inherit; font-weight:bold;"><a href="trainer_pages/thix1300.html" style="color:inherit; text-decoration:none;"> thix1300</a></td><td>1</td><td>0</td></tr>
<tr><td>3</td><td style="color:inherit; font-weight:bold;"><a href="trainer_pages/Moritzlolii.html" style="color:inherit; text-decoration:none;"> Moritzlolii</a></td><td>0</td><td>0</td></tr>
<tr><td>4</td><td style="color:inherit; font-weight:bold;"><a href="trainer_pages/TrainerTrials.html" style="color:inherit; text-decoration:none;"> TrainerTrials</a></td><td>0</td><td>0</td></tr>
</tbody>
  </table>
  <script>
    function filterTable() {
      var input = document.getElementById("searchInput");
      var filter = input.value.toUpperCase();
      var table = document.getElementById("rankingTable");
      var tr = table.getElementsByTagName("tr");
      for (var i = 1; i < tr.length; i++) {
        var td = tr[i].getElementsByTagName("td")[1];
        tr[i].style.display = (td && td.innerHTML.toUpperCase().indexOf(filter) > -1) ? "" : "none";
      }
    }
    function sortTable(n) {
      var table = document.getElementById("rankingTable");
      var switching = true;
      var dir = "asc";
      while (switching) {
        switching = false;
        var rows = table.rows;
        for (var i = 1; i < (rows.length - 1); i++) {
          var shouldSwitch = false;
          var x = rows[i].getElementsByTagName("TD")[n];
          var y = rows[i+1].getElementsByTagName("TD")[n];
          if (!x || !y) continue;
          var cmpX = (n==0 || n==2 || n==3) ? parseInt(x.innerText) : x.innerText.toUpperCase();
          var cmpY = (n==0 || n==2 || n==3) ? parseInt(y.innerText) : y.innerText.toUpperCase();
          if ((dir == "asc" && cmpX > cmpY) || (dir == "desc" && cmpX < cmpY)) {
            shouldSwitch = true;
            break;
          }
        }
        if (shouldSwitch) {
          rows[i].parentNode.insertBefore(rows[i+1], rows[i]);
          switching = true;
        } else {
          if (dir == "asc") {
            dir = "desc";
            switching = true;
          }
        }
      }
    }
  </script>
</body>
</html>
