<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<title>Xandryth — Das Alles</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:1080px;height:1920px;
  overflow:hidden;
  background:#000;
  position:relative;
}
canvas{
  position:absolute;top:0;left:0;
  width:1080px;height:1920px;
  pointer-events:none;
}
#zone-top{
  position:absolute;top:0;left:0;width:1080px;height:120px;
  background:linear-gradient(to bottom,rgba(0,0,0,0.58) 0%,transparent 100%);
  z-index:70;pointer-events:none;
}
#zone-bot{
  position:absolute;bottom:0;left:0;width:1080px;height:920px;
  background:linear-gradient(to top,rgba(0,0,0,0.55) 0%,transparent 100%);
  z-index:70;pointer-events:none;
}
#vignette{
  position:absolute;top:0;left:0;width:1080px;height:1920px;
  background:radial-gradient(ellipse 90% 90% at 50% 50%,transparent 30%,rgba(0,0,0,0.7) 100%);
  z-index:69;pointer-events:none;
}
#center-darken{
  position:absolute;left:150px;top:300px;width:780px;height:540px;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0.35) 0%,transparent 70%);
  z-index:68;pointer-events:none;
}
#flash{
  position:absolute;top:0;left:0;width:1080px;height:1920px;
  opacity:0;z-index:67;pointer-events:none;
}
</style>
</head>
<body>

<canvas id="cvBase"    style="z-index:1"></canvas>
<canvas id="cvIntro"   style="z-index:2"></canvas>
<canvas id="cvGhosts"  style="z-index:3"></canvas>
<canvas id="cvPhase"   style="z-index:4"></canvas>
<canvas id="cvRing"    style="z-index:5"></canvas>
<canvas id="cvFx"      style="z-index:6"></canvas>
<canvas id="cvTop"     style="z-index:7"></canvas>

<div id="zone-top"></div>
<div id="zone-bot"></div>
<div id="vignette"></div>
<div id="center-darken"></div>
<canvas id="flash" style="z-index:67"></canvas>

<script>
'use strict';
// ─────────────────────────────────────────────────────────────────────────────
// SETUP
// ─────────────────────────────────────────────────────────────────────────────
const W=1080,H=1920,CX=540,CY=590,RING_R=300;

['cvBase','cvIntro','cvGhosts','cvPhase','cvRing','cvFx','cvTop','flash'].forEach(id=>{
  const c=document.getElementById(id);c.width=W;c.height=H;
});
const get=(id)=>document.getElementById(id);
const ctx=(id)=>get(id).getContext('2d');

const ctxBase  =ctx('cvBase');
const ctxIntro =ctx('cvIntro');
const ctxGhosts=ctx('cvGhosts');
const ctxPhase =ctx('cvPhase');
const ctxRing  =ctx('cvRing');
const ctxFx    =ctx('cvFx');
const ctxTop   =ctx('cvTop');
const ctxFlash =ctx('flash');

get('cvGhosts').style.mixBlendMode ='screen';
get('cvPhase').style.mixBlendMode  ='screen';
get('cvRing').style.mixBlendMode   ='screen';
get('cvFx').style.mixBlendMode     ='screen';
get('cvTop').style.mixBlendMode    ='screen';

let t=0,last=performance.now();

// ─────────────────────────────────────────────────────────────────────────────
// MATH / UTILS
// ─────────────────────────────────────────────────────────────────────────────
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,x)=>a+(b-a)*x;
const eio=(x)=>x<.5?2*x*x:1-(-2*x+2)**2/2;
const eo3=(x)=>1-(1-x)**3;
const rand=()=>Math.random();
const rng=(a,b)=>a+(b-a)*rand();

// deterministic noise stand-in
function hash(n){
  let x=Math.sin(n)*43758.5453123;
  return x-Math.floor(x);
}

// lightning bolt path builder
function bolt(x0,y0,x1,y1,d,spread){
  if(d===0) return [{x:x0,y:y0},{x:x1,y:y1}];
  const mx=(x0+x1)/2+(rand()-.5)*spread;
  const my=(y0+y1)/2+(rand()-.5)*spread*.5;
  return [...bolt(x0,y0,mx,my,d-1,spread*.6),...bolt(mx,my,x1,y1,d-1,spread*.6)];
}

// ─────────────────────────────────────────────────────────────────────────────
// PHASE CONFIG
// ─────────────────────────────────────────────────────────────────────────────
const PHASE_DUR=15;     // seconds each phase holds
const TRANS_DUR=2.2;    // cross-fade duration

const PM=[
  {name:'Ozean',    h:188,  bg:'#00080f'},
  {name:'Vulkan',   h:18,   bg:'#0f0200'},
  {name:'Blitz',    h:52,   bg:'#04040f'},
  {name:'Tektonik', h:22,   bg:'#0a0500'},
  {name:'Arktis',   h:182,  bg:'#00080d'},
  {name:'Void',     h:255,  bg:'#02000a'},
  {name:'Urknall',  h:45,   bg:'#070005'},
  {name:'Aufstieg', h:47,   bg:'#040406'},
];

let phaseIdx=0;
let phaseT=0;
let transiting=false;
let transT=0;
let cycle=0;
const ghosts=[];   // accumulated ghost canvases

// ─────────────────────────────────────────────────────────────────────────────
// INTRO STATE MACHINE
// ─────────────────────────────────────────────────────────────────────────────
// INTRO_DUR total: ~11 seconds
// 0.0 – 2.5s  : absolute black, single distant heartbeat pulse
// 2.5 – 4.5s  : second pulse, slightly brighter, filaments begin to stir
// 4.5 – 6.5s  : third pulse, the void cracks open a sliver of light
// 6.5 – 8.5s  : ring appears as a thin line, reality membrane tears
// 8.5 – 10.0s : everything collapses inward then — DETONATION
// 10.0s+       : phases begin normally

const INTRO_DUR=10.5;
let introT=0;
let introDone=false;

// Intro filaments (dark matter tendrils, barely visible)
const introFilaments=Array.from({length:20},(_,i)=>({
  x:rng(0,W), y:rng(0,H),
  angle:rng(0,Math.PI*2),
  len:rng(200,600),
  speed:rng(-.01,.01),
  phase:rng(0,Math.PI*2),
}));

// Intro implosion particles (drawn inward before detonation)
const introImplode=Array.from({length:80},(_,i)=>{
  const angle=i/80*Math.PI*2;
  const dist=rng(300,900);
  return {
    x:CX+Math.cos(angle)*dist,
    y:CY+Math.sin(angle)*dist,
    tx:CX,ty:CY,
    speed:rng(0.04,0.09),
    r:rng(1,3),
    hue:rng(180,280),
    alpha:rng(0.3,0.9),
  };
});

function drawIntro(){
  const c=ctxIntro;
  c.clearRect(0,0,W,H);
  if(introDone) return;

  const it=introT;

  // ── Phase A: 0→2.5s — total void, first heartbeat ──────────────────────
  if(it<2.5){
    const beat=Math.max(0,1-it/2.5);          // fade in silence
    // One deep pulse at t=1.2
    const pulse1=clamp(1-Math.abs(it-1.2)/0.35,0,1);
    const ringR=pulse1*180;
    if(ringR>0){
      c.globalAlpha=pulse1*0.18;
      c.strokeStyle='rgba(120,80,200,1)';
      c.lineWidth=pulse1*8;
      c.shadowColor='rgba(100,60,180,0.8)';
      c.shadowBlur=30;
      c.beginPath();c.arc(CX,CY,ringR,0,Math.PI*2);c.stroke();
      c.shadowBlur=0;
    }
    c.globalAlpha=1;
    return;
  }

  // ── Phase B: 2.5→4.5s — filaments stir, second beat ────────────────────
  if(it<4.5){
    const prog=eo3((it-2.5)/2);
    // Filaments barely visible
    introFilaments.forEach((f,fi)=>{
      const fa=prog*(0.04+0.02*Math.sin(t*0.3+fi));
      c.globalAlpha=fa;
      c.strokeStyle=`rgba(60,30,120,1)`;
      c.lineWidth=0.8;
      c.beginPath();
      for(let s=0;s<30;s++){
        const frac=s/30;
        const px=f.x+Math.cos(f.angle)*frac*f.len + Math.sin(frac*Math.PI*3+t*0.5+f.phase)*12;
        const py=f.y+Math.sin(f.angle)*frac*f.len + Math.cos(frac*Math.PI*2+t*0.4)*8;
        s===0?c.moveTo(px,py):c.lineTo(px,py);
      }
      c.stroke();
    });

    // Second heartbeat at it=3.2
    const pulse2=clamp(1-Math.abs(it-3.2)/0.3,0,1);
    const r2=pulse2*280;
    if(r2>0){
      [60,25,8].forEach((lw,pass)=>{
        const la=[0.06,0.15,0.45][pass]*pulse2;
        c.strokeStyle=`rgba(130,80,220,${la})`;
        c.lineWidth=lw;
        c.shadowColor='rgba(110,60,200,0.7)';
        c.shadowBlur=lw*3;
        c.beginPath();c.arc(CX,CY,r2,0,Math.PI*2);c.stroke();
        c.shadowBlur=0;
      });
    }
    c.globalAlpha=1;
    return;
  }

  // ── Phase C: 4.5→6.5s — void cracks, third beat stronger ───────────────
  if(it<6.5){
    const prog=eo3((it-4.5)/2);

    // Filaments now visible as faint strands
    introFilaments.forEach((f,fi)=>{
      const fa=prog*(0.06+0.03*Math.sin(t*0.5+fi));
      c.globalAlpha=fa;
      c.strokeStyle=`rgba(80,50,160,1)`;
      c.lineWidth=1.2;
      c.beginPath();
      for(let s=0;s<35;s++){
        const frac=s/35;
        const px=f.x+Math.cos(f.angle)*frac*f.len+Math.sin(frac*Math.PI*4+t*0.8+f.phase)*18;
        const py=f.y+Math.sin(f.angle)*frac*f.len+Math.cos(frac*Math.PI*3+t*0.6)*10;
        s===0?c.moveTo(px,py):c.lineTo(px,py);
      }
      c.stroke();
    });

    // Crack opening — a tiny tear of white light
    const crackProg=prog;
    const crackLen=crackProg*80;
    c.globalAlpha=crackProg*0.6;
    c.strokeStyle='rgba(255,255,255,0.9)';
    c.lineWidth=1.5*crackProg;
    c.shadowColor='rgba(200,180,255,0.9)'; c.shadowBlur=15;
    c.beginPath();
    for(let s=0;s<12;s++){
      const iy=CY-crackLen+s*(crackLen*2/12);
      const jag=Math.sin(s*2.1)*3*crackProg;
      s===0?c.moveTo(CX+jag,iy):c.lineTo(CX+jag,iy);
    }
    c.stroke();
    c.shadowBlur=0;

    // Third pulse at it=5.3 — bigger
    const pulse3=clamp(1-Math.abs(it-5.3)/0.4,0,1);
    const r3=pulse3*420;
    if(r3>0){
      [80,30,10].forEach((lw,pass)=>{
        const la=[0.07,0.18,0.55][pass]*pulse3;
        c.strokeStyle=`rgba(160,100,255,${la})`;
        c.lineWidth=lw;
        c.shadowColor='rgba(140,80,240,0.8)'; c.shadowBlur=lw*3;
        c.beginPath();c.arc(CX,CY,r3,0,Math.PI*2);c.stroke();
        c.shadowBlur=0;
      });
    }
    c.globalAlpha=1;
    return;
  }

  // ── Phase D: 6.5→8.5s — ring materialises, world tears open ────────────
  if(it<8.5){
    const prog=eio((it-6.5)/2);

    // Filaments now brighter and moving faster
    introFilaments.forEach((f,fi)=>{
      const fa=0.08+0.06*Math.sin(t*0.8+fi);
      c.globalAlpha=fa*prog;
      c.strokeStyle=`rgba(100,70,200,1)`;
      c.lineWidth=1.5;
      c.beginPath();
      for(let s=0;s<40;s++){
        const frac=s/40;
        const px=f.x+Math.cos(f.angle)*frac*f.len+Math.sin(frac*Math.PI*5+t*1.5+f.phase)*25;
        const py=f.y+Math.sin(f.angle)*frac*f.len+Math.cos(frac*Math.PI*4+t*1.2)*14;
        s===0?c.moveTo(px,py):c.lineTo(px,py);
      }
      c.stroke();
    });

    // Ring materialising — thin, electric, uncertain
    [40,16,4,1].forEach((lw,pass)=>{
      const la=[0.03,0.08,0.22,0.6][pass]*prog*prog;
      c.strokeStyle=`rgba(180,130,255,${la})`;
      c.lineWidth=lw;
      c.shadowColor='rgba(160,100,255,0.6)'; c.shadowBlur=lw*4;
      c.beginPath();c.arc(CX,CY,RING_R,0,Math.PI*2);c.stroke();
      c.shadowBlur=0;
    });

    // Vertical rift widening
    const riftW=prog*12;
    c.globalAlpha=prog*0.4;
    [riftW*8,riftW*3,riftW].forEach((lw,pass)=>{
      const la=[0.05,0.15,0.5][pass];
      c.strokeStyle=`rgba(240,220,255,${la})`;
      c.lineWidth=lw;
      c.shadowColor='rgba(200,180,255,0.9)'; c.shadowBlur=lw*2;
      c.beginPath();
      for(let s=0;s<20;s++){
        const iy=-50+s*(H+100)/20;
        const jag=Math.sin(s*1.7+t*2)*5*prog;
        s===0?c.moveTo(CX+jag,iy):c.lineTo(CX+jag,iy);
      }
      c.stroke();
      c.shadowBlur=0;
    });

    // Fourth pulse — very strong
    const pulse4=clamp(1-Math.abs(it-7.4)/0.5,0,1);
    const r4=pulse4*600;
    if(r4>0){
      [100,40,12].forEach((lw,pass)=>{
        const la=[0.1,0.25,0.65][pass]*pulse4;
        c.strokeStyle=`rgba(200,150,255,${la})`;
        c.lineWidth=lw;
        c.shadowColor='rgba(180,120,255,0.9)'; c.shadowBlur=lw*4;
        c.beginPath();c.arc(CX,CY,r4,0,Math.PI*2);c.stroke();
        c.shadowBlur=0;
      });
    }
    c.globalAlpha=1;
    return;
  }

  // ── Phase E: 8.5→10.0s — IMPLOSION then DETONATION ─────────────────────
  if(it<10.0){
    const prog=(it-8.5)/1.5;
    const implodeProg=clamp(prog/0.6,0,1);  // particles rush inward
    const detonProg=clamp((prog-0.55)/0.45,0,1); // then BOOM

    // Draw all filaments at full blaze
    introFilaments.forEach((f,fi)=>{
      const fa=0.15+0.1*Math.sin(t*2+fi);
      c.globalAlpha=fa*(1-detonProg);
      c.strokeStyle=`rgba(140,100,255,1)`;
      c.lineWidth=2;
      c.beginPath();
      for(let s=0;s<40;s++){
        const frac=s/40;
        const px=f.x+Math.cos(f.angle)*frac*f.len+Math.sin(frac*Math.PI*6+t*2.5+f.phase)*30;
        const py=f.y+Math.sin(f.angle)*frac*f.len+Math.cos(frac*Math.PI*5+t*2)*16;
        s===0?c.moveTo(px,py):c.lineTo(px,py);
      }
      c.stroke();
    });

    // Implosion — particles rushing toward center
    introImplode.forEach((p,pi)=>{
      const px=lerp(p.x,p.tx,eio(implodeProg));
      const py=lerp(p.y,p.ty,eio(implodeProg));
      const pa=p.alpha*(1-implodeProg*0.5);
      c.globalAlpha=pa*(1-detonProg);
      c.fillStyle=`hsl(${p.hue},90%,75%)`;
      c.shadowColor=`hsl(${p.hue},100%,80%)`; c.shadowBlur=p.r*4;
      c.beginPath();c.arc(px,py,p.r,0,Math.PI*2);c.fill();
      c.shadowBlur=0;
    });

    // Ring at full glow, then collapsing
    const ringScale=1-detonProg*0.85;
    [80,30,8,2].forEach((lw,pass)=>{
      const la=[0.06,0.15,0.4,0.85][pass]*(1-detonProg*0.3);
      c.strokeStyle=`rgba(200,160,255,${la})`;
      c.lineWidth=lw*ringScale;
      c.shadowColor='rgba(180,130,255,0.8)'; c.shadowBlur=lw*3;
      c.beginPath();
      c.arc(CX,CY,RING_R*ringScale+detonProg*20,0,Math.PI*2);
      c.stroke();
      c.shadowBlur=0;
    });

    // DETONATION — blinding radial flash from center
    if(detonProg>0){
      const dp2=detonProg*detonProg;
      // Shockwaves
      for(let sw=0;sw<4;sw++){
        const sr=(detonProg-sw*0.08)*H*0.7;
        if(sr<=0) continue;
        const sa=Math.max(0,(1-detonProg)*0.8-sw*0.15);
        [50,18,4].forEach((lw,pass)=>{
          c.strokeStyle=`rgba(255,240,255,${sa*[0.15,0.35,0.8][pass]})`;
          c.lineWidth=lw;
          c.shadowColor='rgba(220,200,255,0.9)'; c.shadowBlur=lw*4;
          c.beginPath();c.arc(CX,CY,sr,0,Math.PI*2);c.stroke();
          c.shadowBlur=0;
        });
      }
      // Central radial glow
      const cg=ctxFlash;
      cg.clearRect(0,0,W,H);
      const rg=cg.createRadialGradient(CX,CY,0,CX,CY,H);
      rg.addColorStop(0,   `rgba(255,255,255,${dp2*0.95})`);
      rg.addColorStop(0.05,`rgba(220,200,255,${dp2*0.7})`);
      rg.addColorStop(0.2, `rgba(160,120,255,${dp2*0.3})`);
      rg.addColorStop(0.5, `rgba(80,60,160,${dp2*0.1})`);
      rg.addColorStop(1,   'rgba(0,0,0,0)');
      cg.fillStyle=rg; cg.fillRect(0,0,W,H);
    }

    c.globalAlpha=1;
    return;
  }

  // Intro complete — but let the flash fade
  introDone=true;
}

// ─────────────────────────────────────────────────────────────────────────────
// BASE LAYER
// ─────────────────────────────────────────────────────────────────────────────
const STARS=Array.from({length:260},()=>({
  x:rng(0,W),y:rng(0,H),
  r:rng(0.3,1.6),
  a:rng(0.2,0.7),
  ph:rng(0,Math.PI*2),
  sp:rng(0.4,2),
}));

function drawBase(){
  const c=ctxBase;
  c.clearRect(0,0,W,H);
  c.fillStyle='#000000';
  c.fillRect(0,0,W,H);
  const vis=introDone?1:clamp(introT/INTRO_DUR,0,1);
  STARS.forEach(s=>{
    const a=s.a*(0.5+0.5*Math.sin(t*s.sp+s.ph))*vis;
    c.globalAlpha=a;
    c.fillStyle='rgba(210,220,240,1)';
    c.beginPath();c.arc(s.x,s.y,s.r,0,Math.PI*2);c.fill();
  });
  c.globalAlpha=1;
}

// ─────────────────────────────────────────────────────────────────────────────
// PHASE DRAW FUNCTIONS
// ─────────────────────────────────────────────────────────────────────────────

// ── 0: OZEAN ─────────────────────────────────────────────────────────────────
function drawOzean(c,a,t,pt){
  c.save();c.globalAlpha=a;

  const bg=c.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#000a14');bg.addColorStop(.6,'#001828');bg.addColorStop(1,'#001020');
  c.fillStyle=bg;c.fillRect(0,0,W,H);

  // Caustic patterns — floor
  for(let ci=0;ci<8;ci++){
    const cx2=80+ci*140+Math.sin(t*.25+ci)*90;
    const cy2=1200+ci*90+Math.cos(t*.2+ci*1.3)*70;
    const cr=70+Math.sin(t*.6+ci)*25;
    const cg2=c.createRadialGradient(cx2,cy2,0,cx2,cy2,cr*2);
    cg2.addColorStop(0,`rgba(30,200,190,${.12*a})`);
    cg2.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=cg2;c.beginPath();c.arc(cx2,cy2,cr*2,0,Math.PI*2);c.fill();
  }
  // Caustic grid lines
  for(let iy=1150;iy<H;iy+=45){
    c.strokeStyle=`rgba(30,190,180,${.06*a})`;
    c.lineWidth=.8;c.beginPath();
    for(let ix=0;ix<=W;ix+=10){
      const py=iy+Math.sin(ix*.02+t*1.2)*20+Math.sin(ix*.007-t*.8)*14;
      ix===0?c.moveTo(ix,py):c.lineTo(ix,py);
    }
    c.stroke();
  }
  // Bioluminescence — cyan and green pulses
  for(let bi=0;bi<22;bi++){
    const bx=40+Math.sin(t*.12+bi*2.1+bi*.3)*500+bi*47;
    const by=300+Math.cos(t*.1+bi*1.7)*700+bi*68;
    const br=6+Math.sin(t*1.8+bi)*4;
    const ba=(0.35+0.4*Math.sin(t*1.4+bi*.9))*a;
    const bh=bi%3===0?130:bi%3===1?185:165;
    const bg2=c.createRadialGradient(bx,by,0,bx,by,br*4);
    bg2.addColorStop(0,`hsla(${bh},100%,72%,${ba})`);
    bg2.addColorStop(.5,`hsla(${bh},90%,50%,${ba*.3})`);
    bg2.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=bg2;c.beginPath();c.arc(bx,by,br*4,0,Math.PI*2);c.fill();
  }
  // Deep water columns of light
  for(let lc=0;lc<5;lc++){
    const lx=90+lc*230+Math.sin(t*.1+lc)*80;
    const lg=c.createLinearGradient(lx-15,0,lx+15,0);
    lg.addColorStop(0,'rgba(0,0,0,0)');
    lg.addColorStop(.5,`rgba(0,160,180,${.05*a})`);
    lg.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=lg;c.fillRect(lx-60,0,120,H);
  }
  c.restore();
}

// ── 1: VULKAN ────────────────────────────────────────────────────────────────
function drawVulkan(c,a,t,pt){
  c.save();c.globalAlpha=a;
  const bg=c.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#060100');bg.addColorStop(.5,'#150300');bg.addColorStop(1,'#250a00');
  c.fillStyle=bg;c.fillRect(0,0,W,H);

  // Lava flows — 5 tongues
  for(let f=0;f<5;f++){
    const fx=60+f*230+Math.sin(t*.06+f)*50;
    const pts=[];
    for(let fy=H;fy>600;fy-=18){
      const frac=(H-fy)/(H-600);
      const w=Math.sin(fy*.015+t*.15+f)*28*(1-frac*.4);
      pts.push([fx+w,fy]);
    }
    for(let pi=1;pi<pts.length;pi++){
      const frac=pi/pts.length;
      const heat=1-frac;
      c.strokeStyle=`hsl(${lerp(0,38,heat)},90%,${lerp(5,58,heat)}%)`;
      c.lineWidth=lerp(8,60,1-frac);
      c.beginPath();
      c.moveTo(pts[pi-1][0],pts[pi-1][1]);
      c.lineTo(pts[pi][0],pts[pi][1]);
      c.stroke();
    }
  }
  // Lava pool glow
  const pool=c.createLinearGradient(0,1580,0,H);
  pool.addColorStop(0,'rgba(0,0,0,0)');
  pool.addColorStop(.4,`rgba(180,55,5,${.45*a})`);
  pool.addColorStop(1,`rgba(255,160,10,${.75*a})`);
  c.fillStyle=pool;c.fillRect(0,1580,W,340);

  // Surface ripples
  for(let rp=0;rp<10;rp++){
    const ry=1680+rp*22+Math.sin(t*.5+rp)*16;
    c.strokeStyle=`rgba(255,130,8,${.18*a})`;c.lineWidth=2;
    c.beginPath();
    for(let ix=0;ix<=W;ix+=8){
      const py=ry+Math.sin(ix*.022+t*1.4+rp)*7;
      ix===0?c.moveTo(ix,py):c.lineTo(ix,py);
    }
    c.stroke();
  }
  // Ground cracks
  for(let cr=0;cr<8;cr++){
    const cx2=80+cr*135+Math.sin(cr*2.1)*30;
    const pulse=(.5+.5*Math.sin(t*1.1+cr));
    const pts2=bolt(cx2,1250,cx2+(rand()-.5)*80,H,5,40);
    [14,5,1.5].forEach((lw,pass)=>{
      c.strokeStyle=`rgba(255,${80+pass*30},0,${[.04,.14,.45][pass]*pulse*a})`;
      c.lineWidth=lw;c.shadowColor='rgba(255,70,0,.5)';c.shadowBlur=lw*3;
      c.beginPath();pts2.forEach((p,i)=>{i===0?c.moveTo(p.x,p.y):c.lineTo(p.x,p.y);});
      c.stroke();c.shadowBlur=0;
    });
  }
  // Embers
  for(let em=0;em<50;em++){
    const ex=30+Math.sin(t*.25+em*2.3)*510+em*21;
    const ey=((H-(t*25+em*38)%H)+H)%H;
    const er=.8+Math.sin(t*3+em)*.7;
    const ea=(.4+.5*Math.sin(t*4+em))*a;
    c.fillStyle=`rgba(255,${80+Math.floor(Math.sin(t+em)*90)},0,${ea})`;
    c.shadowColor='rgba(255,120,0,.8)';c.shadowBlur=5;
    c.beginPath();c.arc(ex,ey,er,0,Math.PI*2);c.fill();
  }
  c.shadowBlur=0;c.restore();
}

// ── 2: BLITZ ─────────────────────────────────────────────────────────────────
function drawBlitz(c,a,t,pt){
  c.save();c.globalAlpha=a;
  const bg=c.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#020214');bg.addColorStop(.5,'#04041a');bg.addColorStop(1,'#020210');
  c.fillStyle=bg;c.fillRect(0,0,W,H);

  // Storm clouds
  for(let sc=0;sc<8;sc++){
    const sx=60+sc*160+Math.sin(t*.08+sc)*80;
    const sy=80+Math.cos(t*.06+sc*1.4)*90;
    const sr=140+Math.sin(t*.12+sc)*45;
    const sg=c.createRadialGradient(sx,sy,0,sx,sy,sr);
    sg.addColorStop(0,`rgba(18,18,55,${.65*a})`);
    sg.addColorStop(.7,`rgba(8,8,30,${.3*a})`);
    sg.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=sg;c.beginPath();c.arc(sx,sy,sr,0,Math.PI*2);c.fill();
  }

  // 8 simultaneous main bolts
  const anchors=[55,175,310,455,600,740,875,1025];
  anchors.forEach((bx,bi)=>{
    const flicker=Math.floor(t*1.1+bi*.37)%3<2;
    if(!flicker) return;
    const endX=CX+(bi-3.5)*90+Math.sin(t*.5+bi)*30;
    const endY=H*.65+Math.sin(t*.3+bi)*80;
    const pts=bolt(bx,0,endX,endY,6,120);
    [14,5,1.5].forEach((lw,pass)=>{
      c.strokeStyle=`rgba(${170+pass*30},${190+pass*25},255,${[.07,.22,.7][pass]*a})`;
      c.lineWidth=lw;c.shadowColor='rgba(150,170,255,.5)';c.shadowBlur=lw*4;
      c.beginPath();pts.forEach((p,i)=>{i===0?c.moveTo(p.x,p.y):c.lineTo(p.x,p.y);});
      c.stroke();c.shadowBlur=0;
    });
    // Branches
    if(pts.length>8){
      const branchIdx=Math.floor(pts.length*.4);
      const bp=pts[branchIdx];
      const bpts=bolt(bp.x,bp.y,bp.x+(rand()-.5)*200,bp.y+rng(100,250),4,60);
      c.strokeStyle=`rgba(180,200,255,${.2*a})`;c.lineWidth=1;
      c.beginPath();bpts.forEach((p,i)=>{i===0?c.moveTo(p.x,p.y):c.lineTo(p.x,p.y);});
      c.stroke();
    }
  });

  // Horizontal arc bridges
  for(let arc=0;arc<7;arc++){
    if(Math.floor(t*1.2+arc*.6)%5!==0) continue;
    const x0=anchors[arc],x1=anchors[arc+1];
    const ay=60+Math.sin(t*2+arc)*50;
    const apts=bolt(x0,ay,x1,ay,4,60);
    c.strokeStyle=`rgba(200,215,255,${.35*a})`;c.lineWidth=1.5;
    c.shadowColor='rgba(180,200,255,.6)';c.shadowBlur=8;
    c.beginPath();apts.forEach((p,i)=>{i===0?c.moveTo(p.x,p.y):c.lineTo(p.x,p.y);});
    c.stroke();c.shadowBlur=0;
  }

  // Electric atmosphere
  const ag=c.createRadialGradient(CX,CY,0,CX,CY,800);
  ag.addColorStop(0,`rgba(60,60,180,${.1*a})`);
  ag.addColorStop(.6,`rgba(30,30,90,${.04*a})`);
  ag.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=ag;c.fillRect(0,0,W,H);
  c.restore();
}

// ── 3: TEKTONIK ──────────────────────────────────────────────────────────────
function drawTektonik(c,a,t,pt){
  c.save();c.globalAlpha=a;
  const bg=c.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#060300');bg.addColorStop(.5,'#0e0600');bg.addColorStop(1,'#180a00');
  c.fillStyle=bg;c.fillRect(0,0,W,H);

  // Tectonic plates slowly grinding
  const shift=Math.sin(t*.035)*18;
  // Plate silhouettes — dark heavy masses
  c.fillStyle=`rgba(22,12,4,${.7*a})`;
  c.beginPath();
  c.moveTo(-10,380+shift);c.lineTo(W*.62,290+shift*.5);
  c.lineTo(W*.58,H*.45);c.lineTo(-10,H*.48);c.closePath();c.fill();

  c.fillStyle=`rgba(16,8,2,${.65*a})`;
  c.beginPath();
  c.moveTo(W+10,360-shift);c.lineTo(W*.38,270-shift*.5);
  c.lineTo(W*.42,H*.44);c.lineTo(W+10,H*.47);c.closePath();c.fill();

  // Rift cracks
  const cracks=[[CX-180,280,CX+160,1580],[80,550,380,1380],[700,480,960,1460],[CX-80,780,CX+60,H]];
  cracks.forEach(([x0,y0,x1,y1],ci)=>{
    const pulse=.5+.5*Math.sin(t*.7+ci);
    const cpts=bolt(x0,y0,x1,y1,5,35);
    [18,7,2].forEach((lw,pass)=>{
      c.strokeStyle=`hsla(${lerp(0,28,pass/2)},90%,52%,${[.04,.16,.5][pass]*pulse*a})`;
      c.lineWidth=lw;c.shadowColor='rgba(210,70,0,.4)';c.shadowBlur=lw*2;
      c.beginPath();cpts.forEach((p,i)=>{i===0?c.moveTo(p.x,p.y):c.lineTo(p.x,p.y);});
      c.stroke();c.shadowBlur=0;
    });
  });

  // Magma seeping upward
  const mg=c.createLinearGradient(0,1480,0,H);
  mg.addColorStop(0,'rgba(0,0,0,0)');
  mg.addColorStop(.4,`rgba(150,45,0,${.22*a})`);
  mg.addColorStop(1,`rgba(220,90,8,${.42*a})`);
  c.fillStyle=mg;c.fillRect(0,1480,W,440);

  // Mountain silhouettes
  const mnts=[[0,H,160,880],[140,H,380,730],[360,H,550,800],[510,H,700,680],[660,H,880,760],[840,H,1080,850]];
  c.fillStyle=`rgba(6,3,1,${.85*a})`;
  mnts.forEach(([mx0,my0,mx1,my1])=>{
    c.beginPath();
    c.moveTo(mx0,my0);c.lineTo((mx0+mx1)/2+shift*.25,my1);c.lineTo(mx1,my0);c.fill();
  });
  c.restore();
}

// ── 4: ARKTIS ────────────────────────────────────────────────────────────────
function drawArktis(c,a,t,pt){
  c.save();c.globalAlpha=a;
  const bg=c.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#00060c');bg.addColorStop(.5,'#000d18');bg.addColorStop(1,'#001222');
  c.fillStyle=bg;c.fillRect(0,0,W,H);

  // Aurora — 4 layers of curtains
  const auroras=[
    {h:142,sp:.28,off:0,  amp:130,y:160,ht:280},
    {h:152,sp:.22,off:1.3,amp:85, y:320,ht:190},
    {h:272,sp:.18,off:2.6,amp:160,y:120,ht:300},
    {h:285,sp:.32,off:.9, amp:75, y:260,ht:175},
  ];
  auroras.forEach(al=>{
    for(let ix=0;ix<=W;ix+=5){
      const f=ix/W;
      const w1=Math.sin(f*Math.PI*3+t*al.sp+al.off)*al.amp;
      const w2=Math.sin(f*Math.PI*5-t*al.sp*.65+al.off+1)*al.amp*.35;
      const ty=al.y+w1+w2;
      const ch=al.ht*(.4+.6*Math.sin(f*Math.PI*3+t*.18));
      const aa=(.18+.12*Math.sin(f*Math.PI*2+t*.22))*a;
      const ag=c.createLinearGradient(ix,ty,ix,ty+ch);
      ag.addColorStop(0,`hsla(${al.h},90%,60%,${aa})`);
      ag.addColorStop(.45,`hsla(${al.h},85%,45%,${aa*.45})`);
      ag.addColorStop(1,'rgba(0,0,0,0)');
      c.fillStyle=ag;c.fillRect(ix,ty,5,ch);
    }
  });

  // Hexagonal ice crystals growing
  function hex(c,hx,hy,hr,ha){
    c.save();c.globalAlpha=ha;
    c.strokeStyle='rgba(140,220,255,.9)';c.lineWidth=.7;
    c.shadowColor='rgba(100,200,255,.4)';c.shadowBlur=4;
    c.beginPath();
    for(let vi=0;vi<6;vi++){
      const va=vi/6*Math.PI*2-Math.PI/6;
      vi===0?c.moveTo(hx+Math.cos(va)*hr,hy+Math.sin(va)*hr)
            :c.lineTo(hx+Math.cos(va)*hr,hy+Math.sin(va)*hr);
    }
    c.closePath();c.stroke();
    for(let vi=0;vi<6;vi++){
      const va=vi/6*Math.PI*2-Math.PI/6;
      c.beginPath();c.moveTo(hx,hy);
      c.lineTo(hx+Math.cos(va)*hr,hy+Math.sin(va)*hr);c.stroke();
    }
    // inner ring
    c.beginPath();c.arc(hx,hy,hr*.5,0,Math.PI*2);c.stroke();
    c.restore();
  }
  const hexSeeds=[[150,1380,44],[300,1640,36],[480,1490,58],[660,1570,30],[840,1460,48],[110,1760,38],[720,1710,40],[960,1590,52],[390,1820,34]];
  hexSeeds.forEach(([hx,hy,hr])=>{
    const grow=clamp((pt-1.5)/9,0,1);
    hex(c,hx,hy,hr*grow,0.28*a);
    hex(c,hx,hy,hr*grow*.5,0.18*a);
  });

  // Arctic starfield
  for(let si=0;si<70;si++){
    const sx=(hash(si*127.1))*W, sy=(hash(si*311.7))*H*.7;
    const sr=.5+hash(si*71)*.9;
    const sa=(.3+.4*Math.sin(t*1.3+si))*a;
    c.fillStyle=`rgba(190,220,255,${sa})`;
    c.beginPath();c.arc(sx,sy,sr,0,Math.PI*2);c.fill();
  }

  // Ice ground
  const ig=c.createLinearGradient(0,1440,0,H);
  ig.addColorStop(0,'rgba(0,0,0,0)');
  ig.addColorStop(.6,`rgba(8,55,90,${.18*a})`);
  ig.addColorStop(1,`rgba(18,75,120,${.32*a})`);
  c.fillStyle=ig;c.fillRect(0,1440,W,480);
  c.restore();
}

// ── 5: VOID ──────────────────────────────────────────────────────────────────
function drawVoid(c,a,t,pt){
  c.save();c.globalAlpha=a;
  c.fillStyle='#010008';c.fillRect(0,0,W,H);

  // Dark matter filaments — barely visible, only bending is seen
  for(let fi=0;fi<14;fi++){
    const angle=fi/14*Math.PI+t*.008+fi*.38;
    const ox=CX+Math.cos(angle+Math.PI*.5)*280+Math.sin(t*.02+fi)*100;
    const oy=CY+Math.sin(angle+Math.PI*.5)*280+Math.cos(t*.015+fi)*80;
    const pts=[];
    for(let s=0;s<50;s++){
      const frac=s/50;
      const fx=ox+Math.cos(angle)*frac*W*1.6-W*.35;
      const fy=oy+Math.sin(angle)*frac*W*1.6-W*.1;
      const bend=Math.sin(frac*Math.PI*4+t*.15+fi)*20;
      pts.push([fx+bend,fy+bend*.4]);
    }
    const fa=(.05+.025*Math.sin(t*.25+fi))*a;
    [8,2.5,.7].forEach((lw,pass)=>{
      c.strokeStyle=`rgba(70,35,150,${fa*[.25,.55,1][pass]})`;
      c.lineWidth=lw;
      c.beginPath();pts.forEach(([px,py],i)=>{i===0?c.moveTo(px,py):c.lineTo(px,py);});
      c.stroke();
    });
  }

  // Gravitational lensing arcs
  for(let li=0;li<6;li++){
    const lx=100+li*185+Math.sin(t*.04+li)*90;
    const ly=250+li*290+Math.cos(t*.03+li)*110;
    const lr=35+li*18;
    const sa=t*.04+li;
    c.strokeStyle=`rgba(140,100,240,${.12*a})`;
    c.lineWidth=1.2;c.shadowColor='rgba(120,80,220,.4)';c.shadowBlur=6;
    c.beginPath();c.arc(lx,ly,lr,sa,sa+Math.PI*.65);c.stroke();
    c.shadowBlur=0;
  }

  // Absolute nothing — a few ghost stars
  for(let si=0;si<25;si++){
    const sx=(hash(si*89.3))*W, sy=(hash(si*223.7))*H;
    const sa=(.1+.07*Math.sin(t*.4+si))*a;
    c.fillStyle=`rgba(160,140,230,${sa})`;
    c.beginPath();c.arc(sx,sy,.6,0,Math.PI*2);c.fill();
  }

  // The substance of nothing
  const fog=c.createRadialGradient(CX,CY,80,CX,CY,750);
  fog.addColorStop(0,'rgba(0,0,0,0)');
  fog.addColorStop(.6,`rgba(18,5,35,${.06*a})`);
  fog.addColorStop(1,`rgba(8,2,18,${.03*a})`);
  c.fillStyle=fog;c.fillRect(0,0,W,H);
  c.restore();
}

// ── 6: URKNALL ───────────────────────────────────────────────────────────────
function drawUrknall(c,a,t,pt){
  c.save();c.globalAlpha=a;
  c.fillStyle='#030008';c.fillRect(0,0,W,H);

  // 5 expanding epoch rings — each at different expansion phase
  const epochs=[
    [260,50,200,'Quarks'],    // violet
    [200,110,255,'Atome'],    // blue
    [255,200,50,'Sterne'],    // gold
    [255,90,15,'Galaxien'],   // orange
    [60,255,130,'Leben'],     // green
  ];
  epochs.forEach(([r,g,b,name],ei)=>{
    const phase=(t*.14+ei*3.8)%5.5;
    const prog=phase/5.5;
    const radius=prog*820;
    const ra=(1-prog)*(1-prog)*(.55+.2*Math.sin(t*1.8+ei))*a;
    if(radius>4){
      [32,12,2.5].forEach((lw,pass)=>{
        c.strokeStyle=`rgba(${r},${g},${b},${ra*[.07,.2,.65][pass]})`;
        c.lineWidth=lw;c.shadowColor=`rgba(${r},${g},${b},.4)`;c.shadowBlur=lw*4;
        c.beginPath();c.arc(CX,CY,radius,0,Math.PI*2);c.stroke();c.shadowBlur=0;
      });
    }
  });

  // CMB texture
  for(let ci=0;ci<90;ci++){
    const cx2=(hash(ci*127+t*.015))*W;
    const cy2=(hash(ci*311+t*.012))*H;
    const cr=25+hash(ci*71)*20;
    const cg2=c.createRadialGradient(cx2,cy2,0,cx2,cy2,cr);
    cg2.addColorStop(0,`hsla(${lerp(200,320,ci/90)},55%,55%,${.025*a})`);
    cg2.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=cg2;c.beginPath();c.arc(cx2,cy2,cr,0,Math.PI*2);c.fill();
  }

  // Origin point flash pairs
  for(let fi=0;fi<24;fi++){
    const fv=(.5+.5*Math.sin(t*9+fi*.68));
    const ang=fi/24*Math.PI*2+t*.4;
    const dist=15+fi*14;
    const fx=CX+Math.cos(ang)*dist, fy=CY+Math.sin(ang)*dist;
    c.fillStyle=`rgba(255,255,255,${.25*fv*a})`;
    c.shadowColor='rgba(255,255,255,.6)';c.shadowBlur=6;
    c.beginPath();c.arc(fx,fy,1.2*(.3+.7*fv),0,Math.PI*2);c.fill();
  }
  c.shadowBlur=0;

  // Central singularity
  const sg=c.createRadialGradient(CX,CY,0,CX,CY,80);
  sg.addColorStop(0,`rgba(255,255,255,${.15*a})`);
  sg.addColorStop(.3,`rgba(200,160,255,${.06*a})`);
  sg.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=sg;c.fillRect(CX-80,CY-80,160,160);
  c.restore();
}

// ── 7: AUFSTIEG ──────────────────────────────────────────────────────────────
function drawAufstieg(c,a,t,pt){
  c.save();c.globalAlpha=a;
  const bg=c.createRadialGradient(CX,CY,0,CX,CY,1200);
  bg.addColorStop(0,'#060608');bg.addColorStop(.5,'#030305');bg.addColorStop(1,'#010103');
  c.fillStyle=bg;c.fillRect(0,0,W,H);

  const PHI=1.6180339887;
  // 5 golden Fibonacci spirals, 2 CW / 3 CCW
  for(let sp=0;sp<5;sp++){
    const sOff=sp/5*Math.PI*2;
    const sCW=(sp%2===0?1:-1);
    const sSpd=sCW*.055;
    const sAlpha=(.1+.05*Math.sin(t*.45+sp))*a;
    const sHue=42+sp*14;
    c.strokeStyle=`hsla(${sHue},88%,62%,${sAlpha})`;
    c.lineWidth=1+sp*.25;
    c.shadowColor=`hsla(${sHue},100%,68%,0.35)`;c.shadowBlur=7;
    c.beginPath();
    for(let ang=0;ang<Math.PI*14;ang+=0.04){
      const r=Math.pow(PHI,ang/(Math.PI*2))*3.5;
      if(r>750) break;
      const px=CX+Math.cos(ang+sOff+t*sSpd)*r;
      const py=CY+Math.sin(ang+sOff+t*sSpd)*r;
      ang===0?c.moveTo(px,py):c.lineTo(px,py);
    }
    c.stroke();c.shadowBlur=0;
  }

  // Fibonacci circles + pentagons
  [8,13,21,34,55,89,144,233,377,610].forEach((fr,fi)=>{
    const fa=(.055+.025*Math.sin(t*.28+fi))*a;
    c.strokeStyle=`hsla(${48+fi*7},82%,68%,${fa})`;c.lineWidth=.7;
    c.beginPath();c.arc(CX,CY,fr*1.45,0,Math.PI*2);c.stroke();
    c.beginPath();
    for(let vi=0;vi<5;vi++){
      const va=vi/5*Math.PI*2+t*.035;
      vi===0?c.moveTo(CX+Math.cos(va)*fr*1.45,CY+Math.sin(va)*fr*1.45)
            :c.lineTo(CX+Math.cos(va)*fr*1.45,CY+Math.sin(va)*fr*1.45);
    }
    c.closePath();c.stroke();
  });

  // Radiant light from center — 12 sacred rays
  for(let ray=0;ray<12;ray++){
    const ra=ray/12*Math.PI*2+t*.038;
    const rIntensity=.06+.035*Math.sin(t*1.1+ray);
    const rg=c.createLinearGradient(CX,CY,CX+Math.cos(ra)*900,CY+Math.sin(ra)*900);
    rg.addColorStop(0,`rgba(255,215,90,${rIntensity*a})`);
    rg.addColorStop(.4,`rgba(200,165,60,${rIntensity*.35*a})`);
    rg.addColorStop(1,'rgba(0,0,0,0)');
    c.strokeStyle=rg;c.lineWidth=1.4;
    c.beginPath();c.moveTo(CX,CY);
    c.lineTo(CX+Math.cos(ra)*900,CY+Math.sin(ra)*900);c.stroke();
  }

  // Golden central radiance
  const cg=c.createRadialGradient(CX,CY,0,CX,CY,300);
  cg.addColorStop(0,`rgba(255,220,100,${.06*a})`);
  cg.addColorStop(.4,`rgba(200,160,50,${.025*a})`);
  cg.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=cg;c.fillRect(CX-300,CY-300,600,600);
  c.restore();
}

const DRAW=[drawOzean,drawVulkan,drawBlitz,drawTektonik,drawArktis,drawVoid,drawUrknall,drawAufstieg];

// ─────────────────────────────────────────────────────────────────────────────
// GHOST SYSTEM
// ─────────────────────────────────────────────────────────────────────────────
function captureGhost(idx){
  const gc=document.createElement('canvas');
  gc.width=W;gc.height=H;
  const gctx=gc.getContext('2d');
  DRAW[idx](gctx,1,t,PHASE_DUR);
  ghosts.push({canvas:gc,idx,age:0});
}

function drawGhosts(){
  const c=ctxGhosts;
  c.clearRect(0,0,W,H);
  if(!ghosts.length) return;
  ghosts.forEach((g,gi)=>{
    const ageRank=ghosts.length-gi;
    const base=.15/Math.sqrt(ageRank);
    const breathe=.7+.3*Math.sin(t*.3+gi*.8);
    const a=clamp(base*breathe,.015,.18);
    c.globalAlpha=a;
    c.drawImage(g.canvas,0,0);
  });
  c.globalAlpha=1;
}

// ─────────────────────────────────────────────────────────────────────────────
// ACTIVE PHASE + TRANSITION
// ─────────────────────────────────────────────────────────────────────────────
function drawPhase(){
  const c=ctxPhase;
  c.clearRect(0,0,W,H);
  if(!introDone) return;

  if(!transiting){
    DRAW[phaseIdx](c,1,t,phaseT);
  } else {
    const prog=eio(clamp(transT/TRANS_DUR,0,1));
    const next=(phaseIdx+1)%8;
    DRAW[phaseIdx](c,1-prog*.85,t,phaseT);
    DRAW[next](c,prog,t,0);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// SPAWN RING — always present, color-shifts with phase
// ─────────────────────────────────────────────────────────────────────────────
const ringPts=Array.from({length:90},(_,i)=>({
  angle:i/90*Math.PI*2,
  offset:rng(-.3,.3),
  speed:rng(-.006,.006),
  r:rng(1,2.5),
  life:rand(),
  decay:rng(.003,.007),
  phase:rng(0,Math.PI*2),
}));

function drawRing(){
  const c=ctxRing;
  c.clearRect(0,0,W,H);

  // Visibility ramp
  let vis;
  if(!introDone){
    vis=clamp((introT-6.5)/2,0,1);
  } else {
    vis=1;
  }
  if(vis<=0) return;

  let hue=PM[phaseIdx].h;
  if(transiting) hue=lerp(hue,PM[(phaseIdx+1)%8].h,clamp(transT/TRANS_DUR,0,1));

  // Glow rings
  [70,30,12,4].forEach((lw,pass)=>{
    const la=[.03,.08,.2,.55][pass]*vis*(.75+.25*Math.sin(t*1.4));
    c.strokeStyle=`hsla(${hue},85%,65%,${la})`;
    c.lineWidth=lw;c.shadowColor=`hsla(${hue},100%,72%,.4)`;c.shadowBlur=lw*2;
    c.beginPath();c.arc(CX,CY,RING_R,0,Math.PI*2);c.stroke();c.shadowBlur=0;
  });

  // Orbiting ring particles
  ringPts.forEach(rp=>{
    rp.angle+=rp.speed;
    rp.life-=rp.decay;
    if(rp.life<=0){rp.life=1;rp.decay=rng(.003,.007);}
    const rx=CX+Math.cos(rp.angle)*(RING_R+rp.offset*18);
    const ry=CY+Math.sin(rp.angle)*(RING_R+rp.offset*18);
    const ra=rp.life*(.4+.6*Math.sin(t*3+rp.angle))*vis*.6;
    c.fillStyle=`hsla(${hue+20},90%,78%,${ra})`;
    c.shadowColor=`hsla(${hue+20},100%,82%,.4)`;c.shadowBlur=rp.r*3;
    c.beginPath();c.arc(rx,ry,rp.r,0,Math.PI*2);c.fill();
    c.shadowBlur=0;
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// SHOCKWAVE + FLASH FX
// ─────────────────────────────────────────────────────────────────────────────
let shockwaves=[];
let flashAlpha=0,flashDecay=0,flashHue=0;

class SW {
  constructor(h,delay=0){
    this.h=h;this.r=5;this.life=1;this.delay=delay;this.active=false;
  }
  update(dt){
    if(this.delay>0){this.delay-=dt;return true;}
    this.active=true;
    const spd=lerp(600,200,this.r/(H*.8));
    this.r+=spd*dt;
    this.life-=.0045*dt*60;
    return this.life>0&&this.r<H;
  }
  draw(c){
    if(!this.active) return;
    [35,14,3].forEach((lw,pass)=>{
      const la=[.07,.18,.55][pass]*this.life*this.life;
      c.strokeStyle=`hsla(${this.h},88%,72%,${la})`;
      c.lineWidth=lw;c.shadowColor=`hsla(${this.h},100%,80%,.5)`;c.shadowBlur=lw*3;
      c.beginPath();c.arc(CX,CY,this.r,0,Math.PI*2);c.stroke();c.shadowBlur=0;
    });
  }
}

function triggerTransitionFx(hue){
  // 3 staggered shockwaves
  shockwaves.push(new SW(hue,0));
  shockwaves.push(new SW(hue,.18));
  shockwaves.push(new SW(hue,.38));
  flashAlpha=1;flashDecay=0;flashHue=hue;
}

function drawFx(dt){
  const c=ctxFx;
  c.clearRect(0,0,W,H);
  shockwaves=shockwaves.filter(sw=>{const a=sw.update(dt);sw.draw(c);return a;});
}

function updateFlash(dt){
  if(flashAlpha>0){
    flashDecay+=dt;
    if(flashDecay<.07) flashAlpha=1;
    else flashAlpha=Math.max(0,1-(flashDecay-.07)/1.1);
  }
  // Draw flash on its own canvas
  const c=ctxFlash;
  c.clearRect(0,0,W,H);
  if(flashAlpha>0 && introDone){
    const rg=c.createRadialGradient(CX,CY,0,CX,CY,H*.7);
    rg.addColorStop(0,`rgba(255,255,255,${flashAlpha*.88})`);
    rg.addColorStop(.08,`hsla(${flashHue},90%,90%,${flashAlpha*.55})`);
    rg.addColorStop(.3, `hsla(${flashHue},80%,50%,${flashAlpha*.2})`);
    rg.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=rg;c.fillRect(0,0,W,H);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// GLOBAL PARTICLES — xandryth's persistent essence
// ─────────────────────────────────────────────────────────────────────────────
class XP {
  constructor(){this.reset(true)}
  reset(init=false){
    if(init){this.x=rng(0,W);this.y=rng(0,H);}
    else{
      const side=Math.floor(rand()*4);
      if(side===0){this.x=rng(0,W);this.y=-8;}
      else if(side===1){this.x=W+8;this.y=rng(0,H);}
      else if(side===2){this.x=rng(0,W);this.y=H+8;}
      else{this.x=-8;this.y=rng(0,H);}
    }
    this.vx=(rand()-.5)*0.7;
    this.vy=(rand()-.5)*0.45;
    this.r=rng(.5,2.2);
    this.life=init?rand():1;
    this.decay=rng(.0008,.002);
    this.hOff=rng(0,360);
    this.ph=rng(0,Math.PI*2);
  }
  update(dt){
    this.x+=this.vx*dt*60;
    this.y+=this.vy*dt*60+Math.sin(t*.5+this.ph)*.25;
    this.life-=this.decay*dt*60;
    if(this.life<=0||this.x<-15||this.x>W+15||this.y<-15||this.y>H+15) this.reset(false);
  }
  draw(c){
    const hue=(PM[phaseIdx].h+this.hOff*.25)%360;
    const vis=introDone?1:clamp(introT/INTRO_DUR,0,1);
    c.globalAlpha=this.life*.45*vis;
    c.fillStyle=`hsl(${hue},80%,75%)`;
    c.shadowColor=`hsl(${hue},100%,80%)`;c.shadowBlur=this.r*3;
    c.beginPath();c.arc(this.x,this.y,this.r,0,Math.PI*2);c.fill();
    c.globalAlpha=1;c.shadowBlur=0;
  }
}
const XPS=Array.from({length:110},()=>new XP());

function drawTop(dt){
  const c=ctxTop;
  c.clearRect(0,0,W,H);
  XPS.forEach(p=>{p.update(dt);p.draw(c);});
}

// ─────────────────────────────────────────────────────────────────────────────
// PHASE ENGINE
// ─────────────────────────────────────────────────────────────────────────────
function tickPhase(dt){
  if(!introDone) return;

  if(!transiting){
    phaseT+=dt;
    if(phaseT>=PHASE_DUR){
      captureGhost(phaseIdx);
      const nextH=PM[(phaseIdx+1)%8].h;
      triggerTransitionFx(nextH);
      transiting=true;transT=0;
    }
  } else {
    transT+=dt;
    if(transT>=TRANS_DUR){
      phaseIdx=(phaseIdx+1)%8;
      if(phaseIdx===0) cycle++;
      phaseT=0;transiting=false;transT=0;
    }
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// MAIN LOOP
// ─────────────────────────────────────────────────────────────────────────────
function loop(now){
  const dt=Math.min((now-last)/1000,.05);
  last=now; t+=dt;

  if(!introDone){
    introT+=dt;
    if(introT>=INTRO_DUR) introDone=true;
  }

  tickPhase(dt);
  updateFlash(dt);

  drawBase();
  drawIntro();
  drawGhosts();
  drawPhase();
  drawRing();
  drawFx(dt);
  drawTop(dt);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
