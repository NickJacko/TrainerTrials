<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Steel — Raumstation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#030810;}
canvas{position:absolute;inset:0;width:1080px;height:1920px;display:block;}
.bg{position:absolute;inset:0;background:
  radial-gradient(ellipse 70% 50% at 50% 50%, #0a1a30 0%, #050e1a 55%, transparent 80%),
  linear-gradient(180deg, #030810 0%, #050e1a 50%, #030810 100%);}
/* Station frame — metallic grid around edges */
.frame-top{position:absolute;top:0;left:0;right:0;height:200px;background:linear-gradient(180deg, #0a1525 0%, #050c18 100%);border-bottom:2px solid #102840;box-shadow:inset 0 -20px 30px rgba(0,170,255,0.1);}
.frame-bot{position:absolute;bottom:0;left:0;right:0;height:240px;background:linear-gradient(0deg, #0a1525 0%, #050c18 100%);border-top:2px solid #102840;box-shadow:inset 0 20px 30px rgba(0,170,255,0.1);}
.pillar-l{position:absolute;top:150px;bottom:200px;left:0;width:80px;background:linear-gradient(90deg, #0a1828 0%, #050e1a 100%);border-right:2px solid #102840;}
.pillar-r{position:absolute;top:150px;bottom:200px;right:0;width:80px;background:linear-gradient(270deg, #0a1828 0%, #050e1a 100%);border-left:2px solid #102840;}

/* Grid struts */
.struts{position:absolute;top:200px;bottom:240px;left:80px;right:80px;pointer-events:none;
  background:
    linear-gradient(90deg, transparent 49.5%, rgba(0,170,255,0.04) 50%, transparent 50.5%) 0 0/200px 100%,
    linear-gradient(0deg, transparent 49.5%, rgba(0,170,255,0.04) 50%, transparent 50.5%) 0 0/100% 160px;}

/* Viewport "window" — the space seen through */
.view{position:absolute;top:220px;bottom:260px;left:100px;right:100px;border-radius:20px;overflow:hidden;border:3px solid #1a3a5a;box-shadow:inset 0 0 60px rgba(0,100,200,0.15),0 0 40px rgba(0,150,255,0.1);}
.view-bg{position:absolute;inset:0;background:
  radial-gradient(ellipse 60% 40% at 30% 30%, rgba(0,170,255,0.3) 0%, transparent 60%),
  radial-gradient(ellipse 70% 50% at 70% 70%, rgba(50,100,200,0.3) 0%, transparent 60%),
  linear-gradient(180deg, #000612 0%, #000a18 100%);}

/* LED strips */
.led-l{position:absolute;left:40px;top:200px;bottom:240px;width:4px;background:#00aaff;box-shadow:0 0 12px #00aaff;opacity:0.8;animation:ledP 2s ease-in-out infinite;}
.led-r{position:absolute;right:40px;top:200px;bottom:240px;width:4px;background:#00aaff;box-shadow:0 0 12px #00aaff;opacity:0.8;animation:ledP 2s ease-in-out infinite;animation-delay:-1s;}
@keyframes ledP{0%,100%{opacity:0.5}50%{opacity:1}}

/* Holo display corner — subtle */
.holo{position:absolute;top:100px;left:120px;width:220px;height:70px;border:1px solid rgba(0,170,255,0.4);border-radius:4px;padding:10px;font-family:'Courier New',monospace;color:rgba(0,200,255,0.7);font-size:11px;line-height:1.5;background:rgba(0,40,80,0.15);backdrop-filter:blur(4px);}
.holo .blink{animation:bl 1.2s steps(2,end) infinite;}
@keyframes bl{0%,50%{opacity:1}51%,100%{opacity:0}}
.holo-r{position:absolute;bottom:120px;right:120px;width:200px;height:60px;border:1px solid rgba(0,170,255,0.4);border-radius:4px;padding:8px;font-family:'Courier New',monospace;color:rgba(0,200,255,0.7);font-size:10px;background:rgba(0,40,80,0.15);backdrop-filter:blur(4px);text-align:right;}

.zone-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(0,0,0,0.55) 0%,transparent 100%);z-index:40;}
.zone-bot{position:absolute;bottom:0;left:0;right:0;height:920px;background:linear-gradient(0deg,rgba(0,5,15,0.55) 0%,rgba(0,5,15,0.12) 40%,transparent 100%);z-index:40;}
.center-darken{position:absolute;top:300px;left:50%;transform:translateX(-50%);width:780px;height:540px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(0,10,25,0.3) 0%,transparent 70%);z-index:38;}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 40%,rgba(0,0,0,0.6) 100%);z-index:39;pointer-events:none;}
</style>
</head>
<body>
<div class="bg"></div>
<div class="view"><div class="view-bg"></div><canvas id="space"></canvas></div>
<div class="frame-top"></div>
<div class="frame-bot"></div>
<div class="pillar-l"></div>
<div class="pillar-r"></div>
<div class="struts"></div>
<div class="led-l"></div>
<div class="led-r"></div>
<div class="holo">
  <div>▸ STATION SYS <span style="color:#00ff80">OK</span></div>
  <div>▸ NAV LOCK <span style="color:#00ff80">STABLE</span></div>
  <div>▸ SIGNAL<span class="blink">_</span></div>
</div>
<div class="holo-r">
  <div>⬡ QUADRANT 7-B</div>
  <div>⬡ 0.047 PARSEC</div>
  <div>⬡ <span class="blink">SCANNING</span></div>
</div>
<canvas id="data"></canvas>
<div class="center-darken"></div>
<div class="vignette"></div>
<div class="zone-top"></div>
<div class="zone-bot"></div>
<script>
const W=1080,H=1920;
function setup(id){const c=document.getElementById(id);c.width=W;c.height=H;return c.getContext('2d');}

// Space through window — stars far
const sp=document.getElementById('space');
sp.width=880;sp.height=1480;
const spc=sp.getContext('2d');
const sStars=[];
for(let i=0;i<220;i++)sStars.push({x:Math.random()*880,y:Math.random()*1480,r:Math.random()*1.4+0.2,tw:Math.random()*Math.PI*2,hue:Math.random()<0.25?220:Math.random()<0.4?40:0});
// Planets/moons
const planets=[
  {x:150,y:280,r:60,hue:200,a:0.6},
  {x:700,y:1100,r:90,hue:30,a:0.5}
];

const dt=setup('data');
const dparts=[];
for(let i=0;i<25;i++)dparts.push({x:Math.random()*W,y:Math.random()*H,sz:3+Math.random()*6,vy:-0.2-Math.random()*0.3,ph:Math.random()*Math.PI*2,hue:190+Math.random()*30});

let t=0;
function loop(){
  t+=0.016;
  spc.clearRect(0,0,880,1480);
  for(const p of planets){
    const g=spc.createRadialGradient(p.x-p.r*0.3,p.y-p.r*0.3,0,p.x,p.y,p.r);
    g.addColorStop(0,`hsla(${p.hue},80%,55%,${p.a})`);g.addColorStop(0.7,`hsla(${p.hue},80%,25%,${p.a*0.6})`);g.addColorStop(1,'rgba(0,0,0,0)');
    spc.fillStyle=g;spc.beginPath();spc.arc(p.x,p.y,p.r,0,Math.PI*2);spc.fill();
  }
  for(const s of sStars){
    s.tw+=0.03;const a=0.4+Math.sin(s.tw)*0.5;
    if(s.hue===220)spc.fillStyle=`rgba(180,210,255,${a})`;
    else if(s.hue===40)spc.fillStyle=`rgba(255,230,180,${a})`;
    else spc.fillStyle=`rgba(255,255,255,${a})`;
    spc.beginPath();spc.arc(s.x,s.y,s.r,0,Math.PI*2);spc.fill();
  }

  dt.clearRect(0,0,W,H);
  for(const p of dparts){
    p.ph+=0.04;p.y+=p.vy;
    if(p.y<-20){p.y=H+20;p.x=Math.random()*W;}
    dt.fillStyle=`hsla(${p.hue},100%,70%,${0.4+Math.sin(p.ph)*0.3})`;
    dt.shadowBlur=8;dt.shadowColor=`hsl(${p.hue},100%,60%)`;
    dt.fillRect(p.x,p.y,p.sz*0.4,p.sz);
  }
  dt.shadowBlur=0;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
