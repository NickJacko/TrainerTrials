<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<title>Steel — Die Fabrik</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;position:relative;}
canvas{position:absolute;top:0;left:0;width:1080px;height:1920px;pointer-events:none;}
#zone-top{position:absolute;top:0;left:0;width:1080px;height:120px;
  background:linear-gradient(to bottom,rgba(0,0,0,0.60) 0%,transparent 100%);z-index:50;pointer-events:none;}
#zone-bot{position:absolute;bottom:0;left:0;width:1080px;height:920px;
  background:linear-gradient(to top,rgba(0,0,0,0.55) 0%,transparent 100%);z-index:50;pointer-events:none;}
#vignette{position:absolute;top:0;left:0;width:1080px;height:1920px;
  background:radial-gradient(ellipse 90% 90% at 50% 50%,transparent 28%,rgba(0,0,0,0.72) 100%);z-index:49;pointer-events:none;}
#center-darken{position:absolute;left:150px;top:300px;width:780px;height:540px;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0.38) 0%,transparent 70%);z-index:48;pointer-events:none;}
</style>
</head>
<body>

<canvas id="cvBase"    style="z-index:1"></canvas>
<canvas id="cvFurnace" style="z-index:2"></canvas>
<canvas id="cvPipes"   style="z-index:3"></canvas>
<canvas id="cvSparks"  style="z-index:4"></canvas>
<canvas id="cvRain"    style="z-index:5"></canvas>
<canvas id="cvPulse"   style="z-index:6"></canvas>

<div id="zone-top"></div>
<div id="zone-bot"></div>
<div id="vignette"></div>
<div id="center-darken"></div>

<script>
'use strict';
const W=1080,H=1920,CX=540,CY=590,RING_R=300;

['cvBase','cvFurnace','cvPipes','cvSparks','cvRain','cvPulse'].forEach(id=>{
  const c=document.getElementById(id);c.width=W;c.height=H;
});
const gc=id=>document.getElementById(id).getContext('2d');
const ctxBase   =gc('cvBase');
const ctxFurnace=gc('cvFurnace');
const ctxPipes  =gc('cvPipes');
const ctxSparks =gc('cvSparks');
const ctxRain   =gc('cvRain');
const ctxPulse  =gc('cvPulse');

document.getElementById('cvFurnace').style.mixBlendMode='screen';
document.getElementById('cvPipes').style.mixBlendMode  ='screen';
document.getElementById('cvSparks').style.mixBlendMode ='screen';
document.getElementById('cvRain').style.mixBlendMode   ='screen';
document.getElementById('cvPulse').style.mixBlendMode  ='screen';

let t=0,last=performance.now();
const rng=(a,b)=>a+(b-a)*Math.random();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,x)=>a+(b-a)*x;
const eio=(x)=>x<.5?2*x*x:1-(-2*x+2)**2/2;
const hash=(n)=>{let x=Math.sin(n)*43758.5453;return x-Math.floor(x);};
// Safe arc — NEVER lets negative radius through
const safeArc=(c,x,y,r,a0,a1)=>c.arc(x,y,Math.max(0.01,r),a0,a1);

// ── HAMMER PULSE ─────────────────────────────────────────────────────────────
// Industrial heartbeat — irregular rhythm, felt before heard
const BEATS=[0,0.42,0.82,1.18,1.72,2.05,2.38,2.95];
const BEAT_CYCLE=3.2;
let beatPhase=0,lastBeat=-1,hammerPulse=0;

function tickHammer(dt){
  beatPhase=(beatPhase+dt)%BEAT_CYCLE;
  const idx=BEATS.findIndex(b=>Math.abs(beatPhase-b)<0.045);
  if(idx>=0&&idx!==lastBeat){hammerPulse=1;lastBeat=idx;}
  if(lastBeat>=0&&Math.abs(beatPhase-BEATS[lastBeat])>0.07) lastBeat=-1;
  hammerPulse=Math.max(0,hammerPulse-dt*7);
}

// ── FLOOR LEVEL ───────────────────────────────────────────────────────────────
const FLOOR_Y=H*0.74;

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 1 — BASE: Fabrikhalle — Stahl, Anthrazit, Rost, Geschichte
// ─────────────────────────────────────────────────────────────────────────────
const baseOff=document.createElement('canvas');
baseOff.width=W;baseOff.height=H;
(function(){
  const c=baseOff.getContext('2d');

  // Dark anthracite base
  const bg=c.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#050505');bg.addColorStop(0.4,'#070707');
  bg.addColorStop(0.7,'#080808');bg.addColorStop(1,'#060606');
  c.fillStyle=bg;c.fillRect(0,0,W,H);

  // ── Ceiling girders ─────────────────────────────────────────────────────
  [85,170,265].forEach(gy=>{
    // I-beam body
    c.fillStyle='rgba(16,15,13,0.98)';c.fillRect(0,gy,W,20);
    // Top flange
    c.fillStyle='rgba(26,24,20,0.9)';c.fillRect(0,gy-5,W,6);
    // Bottom flange
    c.fillStyle='rgba(26,24,20,0.85)';c.fillRect(0,gy+20,W,5);
    // Shadow under beam
    c.fillStyle='rgba(0,0,0,0.5)';c.fillRect(0,gy+25,W,8);
    // Highlight on top
    c.fillStyle='rgba(32,30,25,0.4)';c.fillRect(0,gy-5,W,2);
    // Rivets
    for(let rx=50;rx<W;rx+=90){
      const jx=rx+(hash(rx*0.01+gy)*14-7);
      c.fillStyle='rgba(30,28,23,0.95)';
      c.beginPath();safeArc(c,jx,gy+10,4.5,0,Math.PI*2);c.fill();
      c.fillStyle='rgba(42,39,32,0.6)';
      c.beginPath();safeArc(c,jx-1,gy+9,1.8,0,Math.PI*2);c.fill();
    }
  });

  // ── Vertical columns ────────────────────────────────────────────────────
  [185,430,650,895].forEach(cx=>{
    const cw=26;
    // Web
    c.fillStyle='rgba(14,13,11,0.98)';c.fillRect(cx-cw*0.38,0,cw*0.76,H);
    // Flanges
    c.fillStyle='rgba(20,19,16,0.97)';c.fillRect(cx-cw,0,cw*0.55,H);c.fillRect(cx+cw*0.45,0,cw*0.55,H);
    // Highlight edges
    c.strokeStyle='rgba(32,30,24,0.45)';c.lineWidth=1;
    c.beginPath();c.moveTo(cx-cw,0);c.lineTo(cx-cw,H);c.stroke();
    c.beginPath();c.moveTo(cx+cw,0);c.lineTo(cx+cw,H);c.stroke();
  });

  // ── Overhead crane rail ─────────────────────────────────────────────────
  c.fillStyle='rgba(22,21,17,0.97)';c.fillRect(0,308,W,14);
  c.fillStyle='rgba(32,30,24,0.6)';c.fillRect(0,308,W,3);
  c.fillStyle='rgba(8,7,6,0.5)';c.fillRect(0,319,W,5);
  for(let tx=0;tx<W;tx+=44){
    c.fillStyle='rgba(18,17,14,0.85)';c.fillRect(tx,322,2,22);
  }

  // ── Floor ───────────────────────────────────────────────────────────────
  c.fillStyle='rgba(10,10,9,0.99)';c.fillRect(0,FLOOR_Y,W,H-FLOOR_Y);
  // Metal grating
  for(let gy=FLOOR_Y+2;gy<H;gy+=20){
    c.strokeStyle=`rgba(20,19,16,${0.4+0.15*(gy-FLOOR_Y)/(H-FLOOR_Y)})`;
    c.lineWidth=0.8;c.beginPath();c.moveTo(0,gy);c.lineTo(W,gy);c.stroke();
  }
  for(let gx=0;gx<W;gx+=20){
    c.strokeStyle='rgba(18,17,14,0.35)';c.lineWidth=0.8;
    c.beginPath();c.moveTo(gx,FLOOR_Y);c.lineTo(gx,H);c.stroke();
  }
  // Floor edge
  c.fillStyle='rgba(32,29,22,0.75)';c.fillRect(0,FLOOR_Y,W,4);

  // ── Old machinery silhouettes ────────────────────────────────────────────
  // Left — heavy press
  c.fillStyle='rgba(9,8,7,0.98)';
  c.fillRect(0,H*0.45,150,H*0.55);
  c.fillRect(20,H*0.30,110,H*0.16);
  c.fillRect(45,H*0.18,60,H*0.13);
  c.strokeStyle='rgba(22,20,16,0.5)';c.lineWidth=1;
  c.strokeRect(0,H*0.45,150,H*0.55);
  // Right — generator bulk
  c.fillStyle='rgba(9,8,7,0.98)';
  c.fillRect(W-160,H*0.42,160,H*0.58);
  c.fillRect(W-140,H*0.28,120,H*0.15);
  c.fillRect(W-120,H*0.35,80,8);
  c.strokeStyle='rgba(22,20,16,0.5)';c.lineWidth=1;
  c.strokeRect(W-160,H*0.42,160,H*0.58);
  // Nameplates on machines
  [[55,H*0.46],[W-120,H*0.44]].forEach(([mx,my])=>{
    c.fillStyle='rgba(18,16,13,0.9)';c.fillRect(mx-20,my,40,20);
    c.strokeStyle='rgba(35,32,25,0.6)';c.lineWidth=0.8;c.strokeRect(mx-20,my,40,20);
    // Engraved lines suggesting text
    c.strokeStyle='rgba(28,25,19,0.4)';c.lineWidth=0.6;
    [my+6,my+11,my+15].forEach(ly=>{
      c.beginPath();c.moveTo(mx-14,ly);c.lineTo(mx+14,ly);c.stroke();
    });
  });

  // ── Rust stains on walls ─────────────────────────────────────────────────
  for(let r=0;r<22;r++){
    const rx=hash(r*127.1)*W;
    const ry=hash(r*311.7)*H*0.68;
    const rh=rng(40,180);const rw=rng(3,30);
    const rg=c.createLinearGradient(rx,ry,rx,ry+rh);
    const ri=Math.floor(hash(r*89)*15);
    rg.addColorStop(0,'rgba(0,0,0,0)');
    rg.addColorStop(0.3,`rgba(${28+ri},${16+Math.floor(ri*0.5)},${9},${rng(0.02,0.055)})`);
    rg.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=rg;c.fillRect(rx,ry,rw,rh);
  }
})();

// Animated crane
let craneX=W*0.32,craneDir=1;

function drawBase(){
  const c=ctxBase;
  c.clearRect(0,0,W,H);
  c.drawImage(baseOff,0,0);

  // Crane movement
  craneX+=craneDir*0.28;
  if(craneX>W*0.78||craneX<W*0.18) craneDir*=-1;

  // Crane trolley body
  c.fillStyle='rgba(20,19,15,0.96)';
  c.fillRect(craneX-32,308,64,22);c.fillRect(craneX-22,304,44,7);
  // Cable
  c.strokeStyle='rgba(28,26,20,0.82)';c.lineWidth=2.2;
  c.beginPath();c.moveTo(craneX,330);c.lineTo(craneX,440);c.stroke();
  // Hook
  c.strokeStyle='rgba(35,32,25,0.88)';c.lineWidth=3;
  c.beginPath();safeArc(c,craneX,452,10,0,Math.PI);c.stroke();
  c.strokeStyle='rgba(45,42,33,0.5)';c.lineWidth=1.2;
  c.beginPath();safeArc(c,craneX,452,7.5,-Math.PI*0.15,Math.PI*0.85);c.stroke();

  // Hammer pulse — floor vibration shimmer
  if(hammerPulse>0.05){
    const vg=c.createLinearGradient(0,FLOOR_Y-4,0,FLOOR_Y+20);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(0.5,`rgba(45,35,15,${hammerPulse*0.06})`);
    vg.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=vg;c.fillRect(0,FLOOR_Y-4,W,24);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 2 — FURNACE: Schmelzöfen, orangeglühendes Metall, Hallenlicht
// ─────────────────────────────────────────────────────────────────────────────
const FURNACES=[
  {x:175, y:H*0.60,w:145,h:185,phase:0.0, cycle:13,dur:4.5},
  {x:CX-70,y:H*0.58,w:165,h:205,phase:2.9, cycle:10,dur:5},
  {x:810, y:H*0.61,w:138,h:178,phase:5.2, cycle:15,dur:3.8},
];

function furnaceOpen(f){
  const cy=(t+f.phase)%f.cycle;
  if(cy>=f.dur) return 0;
  const p=cy/f.dur;
  return p<0.14?p/0.14:p>0.72?(1-p)/0.28:1;
}

function drawFurnace(){
  const c=ctxFurnace;
  c.clearRect(0,0,W,H);

  FURNACES.forEach(f=>{
    const oe=eio(furnaceOpen(f));

    // Furnace housing — pre-draw the dark metal box
    c.globalAlpha=1;
    c.fillStyle='rgba(14,13,10,0.97)';
    c.fillRect(f.x-14,f.y-22,f.w+28,f.h+44);
    // Door frame thick border
    c.strokeStyle='rgba(35,30,22,0.85)';c.lineWidth=5;
    c.strokeRect(f.x,f.y,f.w,f.h);
    // Rivets on corners
    [[f.x+12,f.y+12],[f.x+f.w-12,f.y+12],
     [f.x+12,f.y+f.h-12],[f.x+f.w-12,f.y+f.h-12]].forEach(([rx,ry])=>{
      c.fillStyle='rgba(42,36,26,0.85)';
      c.beginPath();safeArc(c,rx,ry,5,0,Math.PI*2);c.fill();
    });
    // Control panel stub on side
    c.fillStyle='rgba(12,11,9,0.95)';
    c.fillRect(f.x+f.w+14,f.y+20,22,60);
    c.strokeStyle='rgba(28,25,18,0.5)';c.lineWidth=1;
    c.strokeRect(f.x+f.w+14,f.y+20,22,60);

    if(oe>0.01){
      const fcx=f.x+f.w/2,fcy=f.y+f.h/2;

      // Interior — molten metal radial gradient
      c.save();
      c.beginPath();c.rect(f.x+2,f.y+2,f.w-4,f.h-4);c.clip();
      const ig=c.createRadialGradient(fcx,fcy+f.h*0.15,0,fcx,fcy,f.w*0.85);
      ig.addColorStop(0,  `rgba(255,255,190,${oe*0.92})`);
      ig.addColorStop(0.12,`rgba(255,210,60,${oe*0.88})`);
      ig.addColorStop(0.28,`rgba(255,145,18,${oe*0.8})`);
      ig.addColorStop(0.52,`rgba(210,65,8,${oe*0.65})`);
      ig.addColorStop(0.78,`rgba(140,25,4,${oe*0.4})`);
      ig.addColorStop(1,  'rgba(0,0,0,0)');
      c.globalAlpha=1;c.fillStyle=ig;c.fillRect(f.x,f.y,f.w,f.h);

      // Molten surface pools — slow convection
      for(let lv=0;lv<3;lv++){
        const lvx=f.x+f.w*(0.25+lv*0.25)+Math.sin(t*0.25+lv)*f.w*0.09;
        const lvy=f.y+f.h*0.62+Math.cos(t*0.18+lv)*f.h*0.1;
        const lvr=f.w*(0.14+lv*0.04);
        const lvg=c.createRadialGradient(lvx,lvy,0,lvx,lvy,lvr);
        lvg.addColorStop(0,`rgba(255,255,160,${oe*0.55})`);
        lvg.addColorStop(0.5,`rgba(255,200,50,${oe*0.28})`);
        lvg.addColorStop(1,'rgba(0,0,0,0)');
        c.fillStyle=lvg;c.beginPath();safeArc(c,lvx,lvy,lvr,0,Math.PI*2);c.fill();
      }
      c.restore();

      // Hall flood — orange light spilling into the space
      const hg=c.createRadialGradient(fcx,fcy,f.w*0.25,fcx,fcy,520*oe);
      hg.addColorStop(0,  `rgba(255,135,14,${oe*0.18})`);
      hg.addColorStop(0.3,`rgba(220,95,10,${oe*0.10})`);
      hg.addColorStop(0.6,`rgba(175,55,6,${oe*0.04})`);
      hg.addColorStop(1,  'rgba(0,0,0,0)');
      c.fillStyle=hg;c.fillRect(0,0,W,H);

      // Heat columns rising from open door
      for(let sh=0;sh<5;sh++){
        const shx=f.x+f.w*(0.18+sh*0.16);
        const sha=0.038*oe*(0.5+0.5*Math.sin(t*2.8+sh));
        const shg=c.createLinearGradient(shx,f.y,shx,f.y-220*oe);
        shg.addColorStop(0,`rgba(255,145,22,${sha})`);
        shg.addColorStop(0.5,`rgba(200,95,12,${sha*0.35})`);
        shg.addColorStop(1,'rgba(0,0,0,0)');
        c.fillStyle=shg;c.fillRect(shx-9,f.y-220*oe,18,220*oe);
      }
    }
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 3 — PIPES: Rohrnetz, Dampf, Anfang und Ende unbekannt
// ─────────────────────────────────────────────────────────────────────────────
const pipeOff=document.createElement('canvas');
pipeOff.width=W;pipeOff.height=H;
(function(){
  const c=pipeOff.getContext('2d');
  // Horizontal pipes
  const HP=[
    {y:H*0.13,r:15},{y:H*0.25,r:11},{y:H*0.37,r:20},
    {y:H*0.50,r:9}, {y:H*0.64,r:16},{y:H*0.78,r:7},
  ];
  HP.forEach(p=>{
    c.fillStyle='rgba(20,19,15,0.97)';c.fillRect(0,p.y-p.r,W,p.r*2);
    c.fillStyle='rgba(32,30,24,0.5)';c.fillRect(0,p.y-p.r,W,p.r*0.4);
    c.fillStyle='rgba(7,6,5,0.55)';c.fillRect(0,p.y+p.r*0.6,W,p.r*0.4);
    // Flanges
    for(let fx=55;fx<W;fx+=rng(130,250)){
      const fw=16;
      c.fillStyle='rgba(28,26,21,0.97)';c.fillRect(fx-fw/2,p.y-p.r-4,fw,p.r*2+8);
      c.strokeStyle='rgba(38,35,27,0.7)';c.lineWidth=1;
      c.strokeRect(fx-fw/2,p.y-p.r-4,fw,p.r*2+8);
    }
  });
  // Vertical connectors
  [[80,H*0.13,H*0.37,8],[CX-10,H*0.13,H*0.50,13],[340,H*0.25,H*0.64,7],
   [720,H*0.37,H*0.78,8],[960,H*0.13,H*0.50,9],[160,H*0.50,H*0.78,6]].forEach(([vx,y1,y2,vr])=>{
    c.fillStyle='rgba(20,19,15,0.97)';c.fillRect(vx-vr,y1,vr*2,y2-y1);
    c.fillStyle='rgba(30,28,22,0.45)';c.fillRect(vx-vr,y1,vr*0.4,y2-y1);
    c.fillStyle='rgba(7,6,5,0.45)';c.fillRect(vx+vr*0.6,y1,vr*0.4,y2-y1);
  });
  // Pressure gauges
  [[200,H*0.25],[510,H*0.13],[760,H*0.37],[330,H*0.64],[910,H*0.50]].forEach(([gx,gy])=>{
    c.fillStyle='rgba(24,22,18,0.99)';
    c.beginPath();safeArc(c,gx,gy,18,0,Math.PI*2);c.fill();
    c.strokeStyle='rgba(40,37,29,0.82)';c.lineWidth=2;
    c.beginPath();safeArc(c,gx,gy,18,0,Math.PI*2);c.stroke();
    c.fillStyle='rgba(14,13,11,0.9)';
    c.beginPath();safeArc(c,gx,gy,12,0,Math.PI*2);c.fill();
    // Dial needle
    c.strokeStyle='rgba(52,46,34,0.72)';c.lineWidth=1.5;
    const na=Math.PI*0.2+hash(gx*0.01)*Math.PI*1.2;
    c.beginPath();c.moveTo(gx,gy);c.lineTo(gx+Math.cos(na)*9,gy+Math.sin(na)*9);c.stroke();
  });
})();

// Steam puffs from joints
const VENTS=[
  {x:80, y:H*0.37-20,ph:0.0,sp:4.5},{x:CX,y:H*0.50-13,ph:2.1,sp:3.8},
  {x:720,y:H*0.78-7, ph:3.8,sp:5.2},{x:340,y:H*0.64-7, ph:1.5,sp:4.0},
];
class Steam{
  constructor(v){this.v=v;this.reset()}
  reset(){
    this.x=this.v.x+rng(-10,10);this.y=this.v.y;
    this.r=rng(3,11);this.vx=rng(-0.25,0.25);this.vy=-(rng(0.4,1.4));
    this.life=1;this.decay=rng(0.01,0.022);this.alpha=rng(0.035,0.08);
  }
  update(dt){
    this.x+=this.vx*dt*60;this.y+=this.vy*dt*60;
    this.r=Math.min(this.r*(1+dt*0.65),120);
    this.life-=this.decay*dt*60;
    if(this.life<=0)this.reset();
  }
  draw(c){
    c.save();c.globalAlpha=this.alpha*this.life*this.life;
    const g=c.createRadialGradient(this.x,this.y,0,this.x,this.y,Math.max(0.1,this.r));
    g.addColorStop(0,'rgba(175,170,160,0.65)');
    g.addColorStop(0.5,'rgba(135,130,120,0.28)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=g;c.beginPath();safeArc(c,this.x,this.y,Math.max(0.1,this.r),0,Math.PI*2);c.fill();
    c.restore();
  }
}
const STEAM=VENTS.flatMap(v=>Array.from({length:5},()=>new Steam(v)));

function drawPipes(dt){
  const c=ctxPipes;
  c.clearRect(0,0,W,H);
  c.drawImage(pipeOff,0,0);
  STEAM.forEach(s=>{s.update(dt);s.draw(c);});
}

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 4 — SPARKS: Schweißfunken + Schleifbögen — kurz, präzise, schön
// ─────────────────────────────────────────────────────────────────────────────
const WELDERS=[
  {x:265,y:H*0.55,active:false,activeT:0,nextT:rng(1,5)},
  {x:685,y:H*0.52,active:false,activeT:0,nextT:rng(3,9)},
  {x:445,y:H*0.68,active:false,activeT:0,nextT:rng(2,7)},
];

class Spark{
  constructor(x,y){
    this.x=x;this.y=y;
    // Sparks fly upward and outward
    const a=rng(-Math.PI*0.92,-Math.PI*0.08)+(Math.random()-0.5)*0.9;
    const spd=rng(1.8,7.5);
    this.vx=Math.cos(a)*spd;this.vy=Math.sin(a)*spd-rng(0.8,2.5);
    this.r=Math.max(0.5,rng(0.6,2.8));
    this.life=1;this.decay=rng(0.038,0.09);
    this.arc=Math.random()<0.28; // blue-white arc vs orange spark
    this.hue=this.arc?rng(200,222):rng(22,48);
    this.trail=[];
  }
  update(dt){
    this.trail.push({x:this.x,y:this.y});
    if(this.trail.length>6)this.trail.shift();
    this.vy+=0.055*dt*60;
    this.x+=this.vx*dt*60;this.y+=this.vy*dt*60;
    this.life-=this.decay*dt*60;
    return this.life>0&&this.y<H+10;
  }
  draw(c){
    c.save();
    for(let i=1;i<this.trail.length;i++){
      const tf=i/this.trail.length;
      c.globalAlpha=this.life*tf*tf*0.48;
      c.strokeStyle=`hsl(${this.hue},${this.arc?82:95}%,${this.arc?80:88}%)`;
      c.lineWidth=Math.max(0.1,this.r*tf*0.6);c.lineCap='round';
      c.shadowColor=`hsl(${this.hue},100%,85%)`;c.shadowBlur=3;
      c.beginPath();
      c.moveTo(this.trail[i-1].x,this.trail[i-1].y);
      c.lineTo(this.trail[i].x,this.trail[i].y);c.stroke();c.shadowBlur=0;
    }
    c.globalAlpha=this.life*0.9;
    c.fillStyle=`hsl(${this.hue+10},100%,${this.arc?90:88}%)`;
    c.shadowColor=`hsl(${this.hue},100%,86%)`;c.shadowBlur=Math.max(0.1,this.r)*6;
    c.beginPath();safeArc(c,this.x,this.y,this.r,0,Math.PI*2);c.fill();
    c.shadowBlur=0;c.restore();
  }
}

let sparks=[];

function drawSparks(dt){
  const c=ctxSparks;
  c.clearRect(0,0,W,H);

  WELDERS.forEach(w=>{
    w.nextT-=dt;
    if(!w.active&&w.nextT<=0){
      w.active=true;w.activeT=rng(1.5,4.5);w.nextT=rng(4,13);
    }
    if(w.active){
      w.activeT-=dt;if(w.activeT<=0)w.active=false;
      // Arc glow at weld point
      const flicker=0.55+0.45*Math.abs(Math.sin(t*22));
      [28,11,3].forEach((wr,pass)=>{
        const wa=[0.04,0.13,0.5][pass]*flicker;
        c.fillStyle=`rgba(175,208,255,${wa})`;
        c.shadowColor='rgba(155,190,255,0.6)';c.shadowBlur=wr*3;
        c.beginPath();safeArc(c,w.x,w.y,Math.max(0.1,wr),0,Math.PI*2);c.fill();
        c.shadowBlur=0;
      });
      if(Math.random()<0.55*dt*60){
        for(let si=0;si<Math.floor(rng(2,7));si++){
          sparks.push(new Spark(w.x+rng(-9,9),w.y+rng(-5,5)));
        }
      }
    }
  });

  sparks=sparks.filter(s=>{const a=s.update(dt);s.draw(c);return a;});
}

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 5 — RAIN: Regen auf Stahldach — jedes Ping einzeln
// ─────────────────────────────────────────────────────────────────────────────
class Drop{
  constructor(){this.reset(true)}
  reset(init=false){
    this.x=rng(0,W);this.y=init?rng(-10,H*0.15):-8;
    this.vy=rng(9,20);this.len=rng(9,24);
    this.alpha=rng(0.07,0.20);this.ph=rng(0,Math.PI*2);
  }
  update(dt){this.y+=this.vy*dt*60;return this.y<FLOOR_Y;}
  draw(c){
    c.save();c.globalAlpha=this.alpha*(0.55+0.45*Math.sin(t*1.8+this.ph));
    const dg=c.createLinearGradient(this.x,this.y,this.x,this.y+this.len);
    dg.addColorStop(0,'rgba(0,0,0,0)');
    dg.addColorStop(0.3,'rgba(150,158,172,0.85)');
    dg.addColorStop(1,'rgba(115,122,135,0.18)');
    c.strokeStyle=dg;c.lineWidth=0.8;
    c.beginPath();c.moveTo(this.x,this.y);c.lineTo(this.x,this.y+this.len);c.stroke();
    c.restore();
  }
}

class Ping{
  constructor(x){this.x=x;this.y=FLOOR_Y;this.r=0;this.life=1;this.decay=rng(0.055,0.11);}
  update(dt){this.r+=dt*22;this.life-=this.decay*dt*60;return this.life>0&&this.r<25;}
  draw(c){
    c.save();c.globalAlpha=this.life*this.life*0.32;
    c.strokeStyle='rgba(155,162,175,0.85)';c.lineWidth=0.7;
    c.beginPath();safeArc(c,this.x,this.y,Math.max(0.1,this.r),0,Math.PI*2);c.stroke();
    c.restore();
  }
}

const DROPS=Array.from({length:130},()=>new Drop());
let pings=[];

function drawRain(dt){
  const c=ctxRain;
  c.clearRect(0,0,W,H);
  DROPS.forEach(d=>{
    const alive=d.update(dt);
    if(!alive){if(Math.random()<0.45)pings.push(new Ping(d.x));d.reset(false);}
    d.draw(c);
  });
  pings=pings.filter(p=>{const a=p.update(dt);p.draw(c);return a;});
}

// ─────────────────────────────────────────────────────────────────────────────
// LAYER 6 — PULSE: Hammer-Rhythmus sichtbar, Ring, Bodenböen
// ─────────────────────────────────────────────────────────────────────────────
class FloorWave{
  constructor(){
    this.x=CX+(rng(-1,1)*180);
    this.y=FLOOR_Y+rng(5,40);
    this.r=0;this.life=1;
  }
  update(dt){this.r+=dt*380;this.life-=dt*3.8;return this.life>0;}
  draw(c){
    c.save();c.globalAlpha=this.life*this.life*0.16;
    c.strokeStyle=`rgba(110,98,75,${this.life*0.7})`;c.lineWidth=1.4;
    c.save();c.scale(1,0.22);
    c.beginPath();safeArc(c,this.x,this.y/0.22,Math.max(0.1,this.r),0,Math.PI*2);c.stroke();
    c.restore();c.restore();
  }
}
let floorWaves=[];

const RING_MOTES=Array.from({length:65},(_,i)=>({
  angle:i/65*Math.PI*2,speed:rng(-0.004,0.004),
  rOff:rng(-0.28,0.28),r:Math.max(0.5,rng(0.8,2.8)),
  life:Math.random(),decay:rng(0.003,0.007),phase:rng(0,Math.PI*2),
}));

function drawPulse(dt){
  const c=ctxPulse;
  c.clearRect(0,0,W,H);

  if(hammerPulse>0.75&&floorWaves.length<8)floorWaves.push(new FloorWave());
  floorWaves=floorWaves.filter(fw=>{const a=fw.update(dt);fw.draw(c);return a;});

  // Subtle whole-screen warm flash on beat
  if(hammerPulse>0.01){
    c.globalAlpha=hammerPulse*0.038;
    c.fillStyle='rgba(75,52,22,1)';c.fillRect(0,0,W,H);
    c.globalAlpha=1;
  }

  // Ring — oscillates between steel grey and furnace orange
  const furnaceGlow=FURNACES.reduce((acc,f)=>acc+furnaceOpen(f),0)/FURNACES.length;
  const ringHue=lerp(205,24,furnaceGlow);
  const ringPulse=0.68+0.32*Math.sin(t*0.75)+hammerPulse*0.28;

  [65,28,10,3].forEach((lw,pass)=>{
    const la=[0.022,0.058,0.18,0.55][pass]*ringPulse;
    c.strokeStyle=`hsla(${ringHue},${lerp(40,80,furnaceGlow)}%,${lerp(48,65,furnaceGlow)}%,${la})`;
    c.lineWidth=lw*(1+hammerPulse*0.25);
    c.shadowColor=`hsl(${ringHue},65%,58%)`;c.shadowBlur=lw*2.5*(1+hammerPulse*0.8);
    c.beginPath();safeArc(c,CX,CY,RING_R,0,Math.PI*2);c.stroke();c.shadowBlur=0;
  });

  RING_MOTES.forEach(rm=>{
    rm.angle+=rm.speed*(1+hammerPulse*0.45);
    rm.life-=rm.decay;
    if(rm.life<=0){rm.life=1;rm.decay=rng(0.003,0.007);}
    const rx=CX+Math.cos(rm.angle)*(RING_R+rm.rOff*24);
    const ry=CY+Math.sin(rm.angle)*(RING_R+rm.rOff*24);
    const ra=rm.life*(0.3+0.45*Math.sin(t*2+rm.phase))*(1+hammerPulse*0.35);
    c.globalAlpha=ra*0.55;
    c.fillStyle=`hsl(${ringHue},${lerp(42,75,furnaceGlow)}%,${lerp(52,68,furnaceGlow)}%)`;
    c.shadowColor=`hsl(${ringHue},65%,62%)`;c.shadowBlur=rm.r*4*(1+hammerPulse*0.5);
    c.beginPath();safeArc(c,rx,ry,rm.r,0,Math.PI*2);c.fill();c.shadowBlur=0;
  });
  c.globalAlpha=1;
}

// ─────────────────────────────────────────────────────────────────────────────
// MAIN LOOP
// ─────────────────────────────────────────────────────────────────────────────
function loop(now){
  const dt=Math.min((now-last)/1000,0.05);
  last=now;t+=dt;
  tickHammer(dt);
  drawBase();
  drawFurnace();
  drawPipes(dt);
  drawSparks(dt);
  drawRain(dt);
  drawPulse(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
